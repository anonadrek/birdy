[project]
name = "birdy-eval"
version = "0.1.0"
description = "Birdy Bird Scanner ML eval pipeline — measure TFLite model accuracy"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pillow>=11.0.0",
    "pyyaml>=6.0.2",
    "tensorflow-cpu==2.16.1",
]

[project.scripts]
birdy-eval = "birdy_eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdy_eval"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
