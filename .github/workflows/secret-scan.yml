name: secret-scan

# Scans the commits in each push (any branch) and each pull request for API keys and
# other secrets (gitleaks default rules + .gitleaks.toml: MapTiler, Anthropic). The repo
# is public, so a key that reaches a commit is leaked even if a later commit removes it.
# GitHub's own secret scanning and push protection are on as well; this adds the
# patterns GitHub does not know (MapTiler).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# One group per pull request (a new push to the PR replaces the running scan) and one per
# pushed commit, so pushes never cancel or replace each other's scans.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # BEFORE is missing for a new branch (all zeros) and after a force-push (the old
          # tip is gone): then scan everything reachable from AFTER.
          if [ -n "${BEFORE}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${AFTER}"
          else
            RANGE="${AFTER}"
          fi
          if ! COUNT=$(git rev-list --count "${RANGE}"); then
            echo "::error::git rev-list failed for ${RANGE}; refusing to report a clean scan"
            exit 1
          fi
          echo "Scanning ${RANGE} (${COUNT} commits)"
          ./gitleaks git . --config .gitleaks.toml --log-opts="${RANGE}" --redact -v --no-banner --exit-code 1
