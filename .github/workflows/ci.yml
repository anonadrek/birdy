name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Unit tests (shared modules)
        run: ./gradlew :shared:domain:jvmTest :shared:ml:jvmTest --stacktrace

      - name: Validate species data
        run: ./gradlew :shared:content:validateSpeciesData --stacktrace

      - name: Run :shared:content tests
        run: ./gradlew :shared:content:jvmTest --stacktrace

      - name: Build species.db
        run: ./gradlew :shared:content:buildSpeciesDb --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: birdy-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
