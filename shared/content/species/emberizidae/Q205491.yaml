description:
  sv: ''
  en: '# Rock Bunting


    The rock bunting is a small passerine in the bunting family Emberizidae. It is
    a distinctive bird with grey and chestnut plumage, featuring characteristic bold
    head markings with white and dark stripes that make it recognizable in the field.
    The male typically displays brighter, more contrasting coloration than the female.


    This species inhabits rocky slopes, cliffs, and stony hillsides where sparse vegetation
    provides suitable habitat. It is often seen perched conspicuously on rocks or
    low vegetation, from which it forages for seeds and insects. During breeding season,
    the male delivers its simple, rhythmic song from exposed perches, a distinctive
    tinkling phrase that helps identify the species. The call is a sharp, thin note.


    The rock bunting favours arid and semi-arid regions across southern Europe, the
    Mediterranean basin, and into Central Asia and the Middle East. It tends to be
    a summer breeding visitor in northern parts of its range, though populations in
    southern areas may be resident year-round. These bunting are typically seen singly
    or in pairs during the breeding season, though they may form small flocks during
    migration and winter months.'
migration:
  sv: ''
  en: '# Rock Bunting (Emberiza cia) in Scandinavia/Northern Europe


    The Rock Bunting is primarily a summer visitor to Scandinavia and Northern Europe,
    with breeding populations arriving in late April through May. This species is
    largely absent during winter months, with most individuals migrating southward
    to Mediterranean and North African wintering grounds in September and October.
    In Scandinavia, the Rock Bunting is restricted to suitable rocky habitats in southern
    regions, particularly in Sweden where it is scarce and local. The species is present
    from May through August during the breeding season, making it a typical trans-Saharan
    migrant that winters in Africa before returning north in spring.'
