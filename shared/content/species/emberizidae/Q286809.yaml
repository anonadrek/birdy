description:
  sv: '# Videsparv


    Videsparv är en liten fågel som tillhör familjen fältsparvar. Den häckar på den
    sibiriska tajgan i ett vidsträckt område från Skandinavien och österut. Arten
    är migrationsbenägen och flyttar långväga vintertid – en del populationer reser
    hela vägen till östra Kina för att tillbringa de kallare månaderna.


    Arten möter idag utmaningar på grund av habitatförändringar. Både på häckplatserna
    i norr och i övervintringsområdena i söder försvinner lämplig miljö, vilket har
    lett till en minskning av beståndet. Denna utveckling kräver uppmärksamhet för
    att bevara arten för framtiden.'
  en: '# Rustic Bunting


    The rustic bunting is a small passerine belonging to the bunting family Emberizidae,
    a group now recognized as distinct from finches. Its name derives from the Old
    German "Embritz" (bunting) and the Latin "rustica" (rustic, simple), reflecting
    both its taxonomic classification and modest appearance.


    This species exhibits the characteristic compact build typical of buntings, with
    a relatively short tail and conical bill adapted for seed-eating. Rustic buntings
    display subtle but distinctive plumage patterns that aid identification in the
    field. The bird''s call and song are diagnostic features useful for detection,
    particularly during breeding season when males become vocal.


    The rustic bunting frequents open and semi-open habitats, favoring areas with
    scattered shrubs and grassland. It shows typical bunting behavior, often foraging
    on the ground for seeds and insects, though it may also glean food from vegetation.
    The species has an extensive range across northern regions, with populations showing
    migratory tendencies that bring individuals through various habitats during passage
    periods and winter months.'
migration:
  sv: '# Videsparv (Emberiza rustica) – Förekomst i Skandinavien


    Videsparven häckar i Skandinavien och utgör den västra delen av sin sibieriska
    häckningspopulation. Under häckningstiden förekommer arten i öppen tajgamiljö.
    Arten är en långdistansflytt som överge Skandinavien när hösten nalkas och flyttar
    långt söderut till sina övervintringsområden i östra Asien, framför allt östra
    Kina. Under vintern saknas arten helt i Skandinavien. Återkomsten till häckningsområdena
    sker på våren då miljöförhållandena möjliggör häckning igen. Populationen minskar
    på grund av habitatförstöring både i häckningsområdet och i övervintringsområdet.'
  en: '# Rustic Bunting (Emberiza rustica) in Scandinavia/Northern Europe


