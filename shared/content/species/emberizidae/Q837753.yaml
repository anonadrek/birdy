description:
  sv: '# Rostsparv


    Rostsparven är en sparv som tillhör familjen fältsparvar. Det är en mycket liten
    fågel som liknar ortolansparven och bergortolanen närmare släkt. Arten häckar
    framför allt utmed kustnära områden vid Medelhavet, medan det övervintrarar framför
    allt i Sudan. Rostsparven är klassificerad som livskraftig enligt IUCN.


    Arten ses endast tillfälligt norr om sitt ordinarie utbredningsområde. I Sverige
    har arten noterats mycket sällan, med endast tre fynd dokumenterade. På grund
    av källtextens begränsade information är detaljer om utseende, beteende och ljud
    svåra att presentera utan att gissa. För mera specifik information om rostsparven
    rekommenderas specieliserad fågellitteratur eller ornitologiska resurser.'
  en: ''
migration:
  sv: '# Rostsparv (Cretzschmar''s Bunting) i Skandinavien


    Rostsparven är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    längs kusterna vid östra Medelhavet och genomför långdistansmigration till övervintringsområden
    huvudsakligen i Sudan, Afrika. I Sverige har arten endast dokumenterats vid tre
    tillfällen, vilket gör den till en mycket ovanlig irrfågel norr om sitt normala
    utbredningsområde. Dessa fynd representerar gränsöverskridande vagabonderande
    individer långt från arten typiska migrationsvägar. Rostsparven förekommer således
    inte regelbundet i något område i Skandinavien eller Nordeuropa under någon årstid.'
  en: ''
