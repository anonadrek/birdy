description:
  sv: '# Svarthuvad sparv


    Svarthuvad sparv är en medelstor fågel i fältsparvfamiljen. Hanen i häckningsdräkt
    är karakteristisk med sin svarta huvud- och ansiktsmask som kontrasterar skarpt
    mot den gula undersidan och bröstpartiet. Honan och fåglar utanför häckningstiden
    är mycket svårare att särskilja från den närbesläktade stäppsparven – de är nästan
    identiska. Arten förekommer främst i östra Medelhavsområdet och västra Asien under
    häckningstiden.


    Svarthuvad sparv är en flyttfågel som övervintrarna huvudsakligen i Indien och
    närliggande områden. Under flyttning påträffas den sporadiskt långt norr om sitt
    normala utbredningsområde, och den har observerats i Sverige vid ungefär 50 tillfällen.
    Arten är klassificerad som livskraftig av IUCN.'
  en: '# Black-headed Bunting


    The black-headed bunting is a striking bunting species that breeds across south-east
    Europe extending eastward to Iran, then migrates to winter grounds primarily in
    India and occasionally further into south-east Asia. It inhabits open grassland
    environments where it characteristically forages in flocks, searching the ground
    for grains and seeds.


    Adult males display bold plumage with bright yellow underparts contrasting sharply
    against a chestnut back and distinctive black head. Females in breeding plumage
    appear as duller versions of males, though their basic pattern remains recognizable.
    Non-breeding birds and females in other plumages can prove challenging to identify,
    particularly when compared to the closely related red-headed bunting. The two
    species'' ranges overlap in northern Iran, where natural hybridization occasionally
    occurs between them, further complicating field identification in that region.


    The species'' preference for open grassland and gregarious feeding behaviour make
    it relatively easy to observe during migration and on winter grounds, where flocks
    may congregate in suitable habitat patches.'
migration:
  sv: '# Svarthuvad sparv – Förekomst i Skandinavien


    Svarthuvad sparv är en mycket sällsynt gäst i Skandinavien och övriga Nordeuropa.
    Arten häckar i östra Medelhavsområdet och västra Asien, och flyttar under vintern
    huvudsakligen till Indien och närliggande länder. Den påträffas endast tillfälligt
    norr om sitt normala utbredningsområde, och har dokumenterats i Sverige vid ungefär
    50 tillfällen. Det rör sig således om enstaka observationer under migrationsperioderna,
    utan att arten etablerar någon regelbunden förekomst i Skandinavien.'
  en: '# Black-headed Bunting in Scandinavia/Northern Europe


    The Black-headed Bunting is not a regular occurrence in Scandinavia or Northern
    Europe. This species breeds in south-east Europe and winters primarily in India
    and south-east Asia, with its range centered far south of the Nordic region. While
    vagrant individuals may occasionally be recorded during migration periods, particularly
    in spring and autumn, the species has no established presence in Scandinavian
    territories. Any sightings in northern Europe would represent exceptional wanderers
    well outside their normal migratory range, which spans from south-eastern European
    breeding grounds to Indian wintering grounds.'
