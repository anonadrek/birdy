description:
  sv: '# Bergsparv


    Bergsparv är en tätting som tillhör familjen fältsparvar. Det är en liten fågel
    som är nära släkt med hussparven, och dessa två arter behandlades tidigare som
    en enda art. Bergsparven förekommer i karga bergstrakter från nordöstra Afrika
    genom Mellanöstern till Indien, där det trivs i höglänta och torra miljöer.


    Arten har ett stabilt bestånd och antalet individer ökar, vilket gör att det klassificeras
    som livskraftigt. Bergsparven är välanpassad för sitt tuffa bergsmiljöer och är
    en viktig del av de lokala ekosystemen där den förekommer.'
  en: '# Striolated Bunting


    The striolated bunting is a small passerine in the bunting family Emberizidae.
    It is a compact, heavily streaked bird with fine linear markings throughout its
    plumage, giving it a distinctly striped appearance that distinguishes it from
    related bunting species. The overall coloration is subdued, with buff and brown
    tones predominating.


    This species inhabits arid and semi-arid regions, typically favoring rocky slopes,
    sparse scrubland, and mountainous terrain. It tends to be rather inconspicuous,
    often remaining hidden within low vegetation. The striolated bunting forages on
    the ground for seeds and insects, sometimes joining small feeding flocks outside
    the breeding season.


    The call is a simple, quiet chip, while the song is a brief, undistinctive warble
    that lacks the complexity heard in some other bunting species. During breeding
    season, males may sing from exposed perches, though they generally remain unobtrusive
    birds. The striolated bunting''s cryptic appearance and retiring behavior mean
    it often goes unnoticed despite being reasonably common within its range.'
