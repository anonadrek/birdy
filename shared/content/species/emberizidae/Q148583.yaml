description:
  sv: '# Häcksparv


    Häcksparv är en mindre sparv inom familjen fältsparvar som förekommer i Sydeuropa
    och Nordafrika. Det är en stannfågel som stannar året runt i sitt utbredningsområde.
    Arten kategoriseras av IUCN som livskraftig med en stabil population.


    Häcksparven är en medelstor sparv med karakteristisk fjäderdräkt. Hanfågeln är
    särskilt färgglad under häckningstiden med gulfärgade partier på ansiktet och
    klassiska sparv-liknande teckningsmönster. Honan är mer diskret färgad i bruna
    och gråa toner.


    Arten förekommer typiskt i halvöppna, varma miljöer med låg vegetation och buskar.
    Det är en häcksparv som visar territorium under reproduktionstiden. Arten är främst
    fröätare men varierar dieten med insekter under häckningsperioden, särskilt när
    den matar unga. Häcksparven är relativt hemlighetsfull men kan observeras från
    exponerade sittplatser där den ofta ses singandes från låga buskar eller träd
    under morgonen och kvällen.'
  en: '# Cirl Bunting


    The Cirl Bunting is a small passerine bird belonging to the bunting family Emberizidae.
    Males are particularly striking, displaying a distinctive yellow and black head
    pattern with olive-green upperparts and yellow underparts streaked with brown.
    Females are duller, with more subdued colouration and less pronounced head markings,
    making them somewhat challenging to identify in the field.


    This species is primarily a ground and low vegetation forager, often feeding on
    seeds and insects. It tends to be quite vocal, particularly during breeding season,
    with males producing a characteristically repetitive, metallic song that sounds
    like a variation of common and lesser goldfinch calls. The call is often described
    as a sharp, wiry note.


    The Cirl Bunting frequents warm, open habitats including scrubland, hedgerows,
    and cultivated areas with scattered vegetation. It prefers regions with a Mediterranean
    or warm temperate climate, typically staying year-round in milder areas or undertaking
    short-distance migrations in more northern regions. The species has expanded its
    range northward in recent decades, likely in response to climate change and habitat
    management practices that favour its preferred open, scrubby landscape.'
migration:
  sv: '# Häcksparv - förekomst i norra Europa


    Häcksparven är primärt en sydeuropeisk art som inte förekommer naturligt i Skandinavien
    eller Nordeuropa under året. Arten är klassificerad som stannfågel, vilket innebär
    att den är företrädesvis icke-migratorisk i sitt naturliga utbredningsområde i
    Sydeuropa och Nordafrika. Då arten inte är etablerad i norra Europa, förekommer
    den inte regelbundet här varken under häckningstid, övervintring eller under migrationstider.
    Eventuella observationer i Skandinavien skulle utgöra spridda vaganter långt utanför
    artens normala utbredningsområde.'
  en: '# Cirl Bunting (Emberiza cirlus) - Occurrence in Scandinavia/Northern Europe


    The Cirl Bunting is a rare vagrant to Scandinavia and Northern Europe, with no
    established breeding population in the region. This southern European species
    has a breeding range centered on the Mediterranean and temperate zones, extending
    north to southern France and occasionally southern England. In Scandinavia, sightings
    are extremely sporadic and primarily occur during spring and autumn migration
    periods, representing birds that have wandered northward from their core range.
    The species is not a regular winter visitor to Northern Europe, and any records
    in the region are considered exceptional occurrences rather than predictable seasonal
    movements.'
