description:
  sv: '# Dvärgsparv


    Dvärgsparv är en liten fågel i familjen fältsparvar som häckar på tajgan i norra
    delen av den palearktiska zonen, med utbredning västerut in i nordligaste Norrland.
    Under vintern är arten en långdistansflyttare som framför allt söker sig till
    södra Kina. Arten anses ha ett livskraftigt bestånd.'
  en: ''
migration:
  sv: '# Dvärgsparv – Förekomst i Norden


    Dvärgsparven häckar på tajgan i norra palearkis och når västerut in i nordligaste
    Norrland under häckningstiden. Det är en flyttfågel som genomför ett omfattande
    årligt förflyttning. Vintertid lämnar arten Skandinavien och flyttar framför allt
    till södra Kina, där den tillbringar vintermånaderna. Beståndet är stabilt och
    anses livskraftigt.'
  en: ''
