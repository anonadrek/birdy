description:
  sv: '# Zebrasparv


    Zebrasparv är en sparv inom familjen fältsparvar som förekommer i stora delar
    av Afrika samt i sydvästra Arabien. Arten är medelstor och karakteriseras av sitt
    rostfärgade bröst och karakteristiska teckningar. Fjäderdräkten är varierande
    mellan könen och åldersgrupperna, med mörkare markeringar på huvudet och en distinkt
    teckning på undersidan.


    Arten är vanligtvis knuten till halvöppen habitat med gräsmarker och låg växtlighet.
    Det är en fågelart som ofta ses på marken eller i låga buskar, där det söker föda
    bestående av frön och små insekter. Zebrasparven är en aktiv fågel som ofta rör
    sig i små grupper.


    Artens bestånd anses vara livskraftigt, och den är relativt vanlig inom sitt utbredningsområde.
    För den intresserade fågelskådaren kan denna sparv vara ett givande fynd i lämpliga
    biotoper inom sitt geografiska område.'
  en: '# Cinnamon-breasted Bunting


    The cinnamon-breasted bunting is a striking member of the Emberizidae family,
    recognizable by its distinctive plumage featuring warm cinnamon tones on the breast
    and underparts, contrasted with darker markings on the head and back. It has a
    compact, sturdy build typical of buntings, with a conical bill adapted for seed-eating.


    This species inhabits rocky outcrops, boulder-strewn hillsides, and arid scrubland
    across sub-Saharan Africa. It is often seen perching on exposed rocks or low vegetation,
    where it forages for seeds and insects. The bird tends to be quite vocal, delivering
    sharp, distinctive calls that help reveal its presence even in sparse habitat.


    The cinnamon-breasted bunting is generally social and may be encountered singly
    or in small loose groups. It has adapted well to harsh, dry environments where
    food and water are scarce, making it a characteristic species of rocky African
    landscapes. Its preference for elevated perches and rocky terrain makes observation
    relatively straightforward for patient birdwatchers in its range.'
