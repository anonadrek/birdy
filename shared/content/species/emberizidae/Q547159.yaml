description:
  sv: '# Stäppsparv


    Stäppsparven är en fågel inom familjen fältsparvar som häckar i Centralasien.
    Den är mycket nära släkt med svarthuvad sparv och hybridiserar med denna där deras
    utbredningsområden möts. Arten är klassificerad som livskraftig enligt IUCN:s
    bedömning.


    Denna sparv förekommer primärt i öppna stäppmiljöer och gräsrika områden i Centralasien,
    där den hittas under häckningstiden. Släktskapet med svarthuvad sparv gör att
    de två arterna kan påverka varandra där de möts, något som forskare följer noga.
    Trots detta behöll arten en stabil population och räknas inte som hotad.'
  en: ''
migration:
  sv: '# Stäppsparv - Utbredning i Nordeuropa


    Stäppsparven är en centralasiatisk art som inte förekommer i Skandinavien eller
    Nordeuropa under något senare år. Arten är knuten till stäppregionerna i Centralasien
    där den häckar. Det finns inga etablerade migrationsmönster mellan Centralasien
    och nordiska länder, och arten ses inte regelbundet i denna region.


    Migrationsdata saknas för denna art i relation till Skandinavien och Nordeuropa.'
  en: ''
