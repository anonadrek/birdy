description:
  sv: '# Hussparv


    Hussparv är en nordafrikansk fältsparvfågel som förekommer från Marocko till Senegal
    och Tchad. Till skillnad från den närbesläktade bergsparven är hussparven knuten
    till människans närhet och förekommer ofta i bebyggelse. Arten är noterad för
    att öka i antal.


    Hussparven tillhör familjen fältsparvar inom ordningen tättingar och är således
    närbesläktad med andra sparvar i samma familj. Arten skiljer sig från bergsparven
    genom sin förkärlek för mänskliga bosättningar, där den är väl anpassad för att
    leva i nära samspel med människan.'
  en: ''
