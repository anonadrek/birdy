description:
  sv: '# Gulsparv


    Gulsparven är en stor och långstjärtad sparv som kännetecknas av sin gula färgteckning.
    Det är en robust fågel med en karakteristisk silhuett och en relativt lång svans
    som oftast är väl synlig när det sitter uppöst på buskar eller teleledningar.


    Arten förekommer över stora delar av Europa samt i väst- och centralasien. Merparten
    av den europeiska populationen är stannfåglar som stannar året runt, medan den
    östra underarten är delvis flyttfågel som söker sig längre söderut under vintermånaderna
    för att finna föda.


    Gulsparven är en ganska aktiv och alert fågel som ofta sitter väl synligt. Det
    föredrar öppna och halvöppna landskapsmiljöer där det kan hitta frön och insekter.'
  en: '# Yellowhammer


    The yellowhammer is a striking bunting with distinctive plumage that varies between
    sexes and seasons. Males display a bright yellow head and underparts contrasted
    with a streaked brown back and chestnut rump, while females and non-breeding birds
    show duller versions of the same pattern. This colouration makes them recognisable
    even at a distance, particularly when flushed from cover.


    It favours open habitats with scattered shrubs and trees, where it hunts for seeds
    and insects on the ground. In winter, it forms small flocks, often joining mixed
    feeding groups with other seed-eating birds. The yellowhammer is highly vocal,
    especially during breeding season, delivering its characteristic song with a distinctive
    rhythm often likened to "a little bit of bread and no cheese."


    The species is native across Eurasia, where populations show varying migratory
    patterns. Western European birds typically remain year-round in their breeding
    territories, while eastern populations migrate southward to escape harsh winters.
    It has also been introduced to the southern hemisphere with established populations
    in both regions.'
migration:
  sv: '# Gulsparv (Emberiza citrinella) – förekomst i Skandinavien


    Gulsparven är en mycket vanlig art i Skandinavien och Nordeuropa. Huvuddelen av
    populationen i denna region är stannfåglar som stannar året runt, särskilt i södra
    Skandinavien. Den östra underarten består dock delvis av flyttfåglar som migrerar
    söderut under hösten för att övervintras i mildare klimatzoner. Under vintern
    kan det ske en viss inflyttning av östliga individer från närliggande områden.
    Arten återvänder från sin vinterövervintering under mars och april, och är sedan
    mycket synlig under häckningstiden från april till juli.'
  en: '# Yellowhammer (Emberiza citrinella) in Scandinavia/Northern Europe


    The yellowhammer is a year-round resident across much of Scandinavia and Northern
    Europe, with most Western European populations remaining in their breeding ranges
    throughout winter. However, eastern subspecies populations are partially migratory,
    with significant numbers moving southward to winter in more temperate regions.
    Birds that do remain in northern areas form small flocks during the colder months
    to improve foraging efficiency. Spring arrival occurs in March and April as migratory
    populations return to breeding grounds, while departures for southern wintering
    grounds typically take place from September through November, depending on local
    weather conditions and food availability.'
