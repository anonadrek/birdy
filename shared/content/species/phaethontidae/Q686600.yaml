description:
  sv: ''
  en: '# Red-billed Tropicbird


    The red-billed tropicbird is an elegant seabird of tropical oceans, instantly
    recognizable by its mostly white plumage contrasted with black markings on the
    wings and back, a distinctive black mask, and a bright red bill. Its most striking
    feature is the pair of extremely long tail streamers, which typically extend about
    twice the bird''s body length—notably longer in males than females. Three subspecies
    are recognized: the nominate form found in the southern Atlantic; *indicus*, smaller
    with a more restricted mask and orange-tinted bill, inhabiting waters off the
    Middle East and Indian Ocean; and *mesonauta*, displaying a rosy tinge to fresh
    plumage, occurring in eastern Atlantic and Pacific waters and the Caribbean.


    Though superficially resembling a tern, the red-billed tropicbird is a distinctive
    tropical seabird adapted to life far from land. It ranges widely across tropical
    Atlantic, eastern Pacific, and Indian Ocean waters. The species has been documented
    since at least 1758, when Carl Linnaeus described it in his seminal work. With
    its combination of elegant white plumage, dramatic tail streamers, and vibrant
    red bill, it remains one of the most visually striking seabirds of warm waters.'
