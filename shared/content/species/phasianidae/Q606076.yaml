description:
  sv: '# Harlekinvaktel


    Harlekinvaktel är en liten fågel i familjen fasanfåglar som främst förekommer
    i Afrika söder om Sahara, men finns även på Madagaskar och sydvästra Arabiska
    halvön. Arten är anpassad till öppna gräsmarker där den rör sig på marken och
    söker föda bland vegetationen.


    Denna vaktelart har ett karakteristiskt färgmönster som inspirerat namnet – en
    kontrasterande och mönstrad fjäderdräkt som hjälper den att smälta in i gräsmiljön.
    Som många vaktelarter är det en relativt små fågel som föredrar att springa och
    gömma sig snarare än att flyga.


    Beståndet av harlekinvaktel anses vara livskraftigt och arten är inte klassificerad
    som hotad. Den återfinns framför allt i lämpliga habitattyper med gräsmarker och
    öppen terräng där den kan föda sig på små frön och insekter.'
  en: '# Harlequin Quail


    The harlequin quail is a small gamebird belonging to the pheasant family, found
    across sub-Saharan Africa and the Arabian Peninsula. This diminutive species is
    named after the naturalist Adolphe Delegorgue, an early collector of African birds.


    As a ground-dwelling quail, it inhabits grasslands and open savanna regions where
    it forages for seeds and insects among low vegetation. Like other quails, it is
    a mobile species, moving in response to seasonal rainfall patterns and food availability.
    The bird tends to be secretive and runs rather than flies when disturbed, though
    it will take to the wing when pressed.


    The harlequin quail''s plumage features distinctive markings that give it its
    striking common name, though specific details of appearance, vocalizations, and
    precise habitat preferences remain less documented than those of more widely studied
    quail species. Its presence in arid and semi-arid regions makes it well-adapted
    to variable environmental conditions across its range.'
