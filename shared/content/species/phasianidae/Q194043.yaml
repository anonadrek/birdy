description:
  sv: '# Berghöna


    Berghöna är en medelstor hönsfågel som tillhör fasanfågelfamiljen. Det är en robust
    fågel med karakteristisk färgteckning – grå och brun på ovansidan med röda ben
    och röd näbb. Den har ett distinkt mönster på halsen med svarta streck mot ljus
    botten, vilket gör den lätt att identifiera.


    Arten förekommer naturligt i västra Asien och allra östligaste Europa, där det
    trivs i bergiga och steniga terränger. Det har också introducerats på flera platser
    runt om i världen. Berghönan lever på marken och är en skicklig löpare som föredrar
    att springa snarare än att flyga när den blir hotad. Det lever i små flockar och
    söker föda på marken.


    Fågeln är mest aktiv under morgon och kväll. Det är en vaksam art som är svår
    att närma sig i sin naturliga miljö. Berghönan är väsentlig för människor på vissa
    håll, både för jakt och som insättningsart för vildtsamfund.'
  en: '# Chukar Partridge


    The chukar is a stocky upland gamebird belonging to the pheasant family. It displays
    striking plumage with bold black and white barring on the flanks, while its head
    features a distinctive black band running from the forehead through the eye and
    down to the neck, forming a necklace-like marking that frames a white throat.
    This striking head pattern makes identification straightforward in the field.


    This species favors rocky, arid hillsides and mountainous terrain across temperate
    and Middle Eastern regions of Asia, where it forages on the ground for seeds,
    vegetation, and invertebrates. The chukar typically moves in small flocks and
    is adept at running quickly across steep slopes when disturbed rather than taking
    flight. When alarmed, it produces a distinctive loud, repetitive call that sounds
    like "chuk-chuk-chuk," from which its common name derives.


    Originally native to Asia, the chukar has been widely introduced for sport hunting
    and has successfully established feral populations in North America, Malta, and
    New Zealand, where it thrives in similar arid and mountainous habitats. The species
    remains popular among gamebird enthusiasts due to its challenging terrain preference
    and swift, elusive behavior.'
