description:
  sv: '# Kaukasisk snöhöna


    Kaukasisk snöhöna är en bergslevande fågel som tillhör familjen fasanfåglar. Den
    är anpassad för livet i höga bergsmiljöer och förekommer enbart i höga snöbetäckta
    bergsregioner. Fågeln har ett relativt litet bestånd, men populationen anses trots
    detta vara livskraftig.


    Arten är väl utrustad för sitt höga bergsmiljö och är framför allt en markfågel
    som lever på höga höjder. För en närmare beskrivning av dess utseende, beteende
    och läten krävs mer detaljerad information än vad som finns tillgängligt i denna
    kortare källa.'
