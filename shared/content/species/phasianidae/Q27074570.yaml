description:
  sv: ''
  en: '# Double-spurred Spurfowl


    The double-spurred spurfowl is a gamebird belonging to the pheasant family, found
    exclusively across Africa. As its name suggests, it possesses characteristic spurs—a
    feature shared with related spurfowl species. This resident breeder inhabits tropical
    regions of West Africa, where it maintains stable populations in its preferred
    habitats.


    A small and notably declining population exists in an isolated range, representing
    the northernmost extent of the species'' distribution. This separated population
    is increasingly threatened and represents a conservation concern for the species.
    The double-spurred spurfowl remains primarily a tropical African bird, with its
    stronghold in the western portions of the continent where suitable habitat conditions
    persist.'
