description:
  sv: ''
  en: '# Golden Pheasant


    The Golden Pheasant, also known as the Chinese Pheasant, is a striking gamebird
    native to China. It is renowned for its spectacular plumage, featuring brilliant
    golden and red coloration that makes it one of the most visually distinctive pheasant
    species. The male displays particularly vibrant hues, while the female is more
    subdued in appearance.


    This species inhabits dense forest and woodland areas, where it typically forages
    on the ground for seeds, insects, and vegetation. It is generally shy and retiring,
    preferring to remain concealed in thick cover. When disturbed, it will flush explosively
    with a characteristic loud, cackling call. The Golden Pheasant''s cryptic behaviour,
    combined with its preference for dense habitat, means it can be challenging to
    observe in the wild despite its brilliant coloration.


    The species is primarily found in forested regions of central and western China,
    particularly in mountainous terrain. Its range has been affected by habitat loss,
    though it remains relatively widespread across suitable forest habitats within
    its native range. Outside China, the Golden Pheasant is popular in aviculture
    and has been introduced to various regions worldwide, where feral populations
    occasionally become established.'
