description:
  sv: 'Kungsfasan är en hönsfågel i familjen fasanfåglar med ursprung i Kina. Arten
    är liten och fragmenterad i sitt naturliga utbredningsområde, vilket har lett
    till att den klassificeras som sårbar på IUCN:s röda lista för hotade arter. Förutom
    sin naturliga förekomst i Asien har en frilevande population etablerats i Europa,
    notamment i Frankrike och Tjeckien.


    Arten är anpassad till att leva i skogiga bergsmiljöer. Kungensfasan är en marksökande
    fågel som lever mest på marken, där den söker föda. Som många fasaner inom familjen
    fasanfåglar är arten relativt skyggt och föredrar områden med tät vegetation där
    det kan dölja sig från predatorer.


    Populationen kräver bevarandeinsatser för att säkerställa dess överlevnad på lång
    sikt, både i sitt naturliga utbredningsområde och i de etablerade populationerna
    i Europa.'
