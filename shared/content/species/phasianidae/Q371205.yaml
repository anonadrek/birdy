description:
  sv: '# Svartstrupig berghöna


    Svartstrupig berghöna är en fälthöna som är endemit för södra delen av Arabiska
    halvön. Den är en medelstor höna med karakteristisk svart strupe, vilket också
    återspeglas i dess namn. Fågeln är välanpassad för sitt bergiga habitat och lever
    på höga platåer och bergssluttningar.


    Arten är framförallt markvandare som söker föda på marken. Det är en relativt
    sparsamt dokumenterad fågel, men tros ha liknande beteende som andra hönsarter
    i samma familj – den föredrar att springa från fara snarare än att flyga.


    Trots sitt mycket begränsat utbredningsområde klassificeras svartstrupig berghöna
    inte som hotad art för närvarande. Populationen anses stabil inom sitt naturliga
    område, vilket utgörs av specifika bergregioner på Arabiska halvön. Arten är främst
    av intresse för specialiserade fågelskådare som söker sig till dessa bergiga områden.'
  en: ''
