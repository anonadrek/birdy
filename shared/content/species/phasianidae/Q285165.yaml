description:
  sv: ''
  en: '# Black Francolin


    The black francolin is a gamebird belonging to the pheasant family Phasianidae.
    It was formerly known as the black partridge and remains an important species
    in cultural and culinary contexts across its range.


    This francolin is valued both as a wild bird and in traditional cuisines, where
    it has been hunted for generations. Its status as a state bird in parts of its
    natural range reflects its significance to local communities and wildlife heritage.


    The species represents an interesting member of the Galliformes order, occupying
    ecological niches similar to other gamebirds in open and semi-open habitats across
    its distribution.'
