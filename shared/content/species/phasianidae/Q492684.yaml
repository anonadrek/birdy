description:
  sv: ''
  en: '# Rock Partridge


    The rock partridge is a compact gamebird belonging to the pheasant family, native
    to southern European regions. It bears a striking resemblance to its eastern relative,
    the chukar partridge, making the two species difficult to distinguish in the field.
    The bird''s plumage is typically well-adapted for rocky, arid terrain, providing
    effective camouflage in its preferred habitat.


    This species inhabits steep, rocky hillsides and mountainous areas where sparse
    vegetation offers both cover and feeding opportunities. Rock partridges are ground-dwelling
    birds that prefer to run rather than fly when disturbed, relying on their swift
    movement across rocky slopes to evade predators. They are often encountered in
    small groups or coveys, particularly outside the breeding season.


    The rock partridge''s call is a distinctive loud, repetitive series of notes that
    echoes across hillsides, particularly during breeding season. This vocalization
    helps individuals maintain contact within groups and establishes territorial boundaries.
    The species remains relatively common throughout its range where suitable habitat
    persists, though specific distribution varies across different southern European
    regions.'
migration:
  sv: ''
  en: '# Rock Partridge (Alectoris graeca) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Rock Partridge is a southern European species with no established presence
    or migration patterns in Scandinavia or Northern Europe. Its range is restricted
    to mountainous regions of southern Europe, particularly the Mediterranean and
    Balkan regions, where it remains resident year-round. Any occurrences in Scandinavian
    countries would be exceptional vagrants rather than part of regular migration
    movements.'
