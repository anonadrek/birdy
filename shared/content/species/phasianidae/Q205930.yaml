description:
  sv: '# Fjällripa


    Fjällripan är en hönsfågel som lever i karga arktiska och subarktiska områden
    runt världen, samt på isolerade högfjällen på sydligare breddgrader. Den har en
    stor, rundad kropp och förhållandevis litet huvud, vilket gör den lik dalripan.
    Arten når en längd på omkring 31–35 cm beroende på underart.


    Fjällripan är en mästare på kamouflage. Dess fjäderdräkt skiftar säsongsvis för
    att passa miljön: helt vit på vintern och gråbrunspräcklig på vår och sommar.
    Även tarserna är fjäderklädda för värmeisolering. Under parningsleken framträder
    den röda kam ovanför ögat, som funktion signalerande för att attrahera honor.


    Fjällripan förekommer året om på sitt territorialsystem i högfjällens kala områden,
    där den är väl anpassad till extrema väderförhållanden. Medan de flesta populationer
    är stationära, visar några högarktiska populationer flyttfågelbeteende.'
  en: '# Rock Ptarmigan


    The rock ptarmigan is a medium-sized game bird belonging to the grouse family.
    It undergoes a remarkable seasonal transformation: in winter, its plumage turns
    white for camouflage against snow, while in summer it adopts mottled brown and
    grey tones to blend with rocky terrain. Both sexes display a small red comb above
    the eye, particularly visible during breeding season. It is stockily built with
    feathered legs and toes adapted for movement across mountainous landscapes.


    This bird is found in high alpine and subarctic regions across the Northern Hemisphere,
    inhabiting rocky slopes, tundra, and moorland above the tree line. It forages
    on the ground for vegetation, seeds, and insects, moving quietly through sparse
    vegetation. Its call is a harsh, grating croak or chuckle, often heard during
    territorial disputes.


    Rock ptarmigans are relatively sedentary, remaining in their mountain habitats
    year-round. They rely on their cryptic plumage for protection, freezing motionless
    when threatened rather than taking flight. During winter, they develop special
    feathering on their feet that acts like snowshoes, allowing them to walk across
    deep snow while foraging.'
migration:
  sv: '# Fjällripan i Norden – Förekomst och migration


    Fjällripan är en stannfågel eller kortstickare i de flesta av sitt utbredningsområde,
    men ett antal högarktiska populationer är flyttfåglar. I Skandinavien och Nordeuropa
    är arten huvudsakligen stannfågel, särskilt de bergspopulationer som förekommer
    i fjällregionerna. Under hårda vintrar kan vissa individer från nordöstra populationer
    visa upp nomadisk beteende och förflytta sig söderut för att finna föda. Arten
    är närvarande året om i sitt hemområde, anpassad för det arktiska och subarktiska
    klimatet med sin säsongsbundna fjäderdräkt – helt vit på vintern för kamouflage
    i snö och grå-brunspräcklig under växtperioden.'
  en: '# Rock Ptarmigan (Lagopus muta) in Northern Europe


    The rock ptarmigan is a resident species throughout Scandinavia and northern Europe,
    occurring year-round in alpine and arctic regions. In these areas, the species
    is largely sedentary, remaining at high elevations even during winter months.
    Northern populations may exhibit altitudinal movements, descending to lower elevations
    during particularly harsh winters, though true long-distance migration is uncommon.
    The species is well-adapted to extreme cold and snow cover, utilizing its seasonal
    plumage changes—molting to white winter plumage and brown/grey summer plumage—as
    camouflage throughout the year in subnival and alpine habitats.'
