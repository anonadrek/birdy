description:
  sv: ''
  en: '# Red Grouse


    The red grouse is a medium-sized grouse species found exclusively in heather moorland
    habitats across Great Britain and Ireland. It is a stocky, ground-dwelling bird
    perfectly adapted to open moorland environments where heather provides both food
    and shelter.


    In appearance, the red grouse displays predominantly dark reddish-brown plumage
    that helps it blend seamlessly into heather vegetation. Males are generally darker
    and more richly colored than females, often showing a deeper russet tone. The
    bird has a characteristic rounded body shape typical of grouse species, with feathered
    legs extending down to the toes—an adaptation for warmth in exposed moorland conditions.


    Red grouse are primarily terrestrial birds that spend most of their time on the
    ground, running and hiding in heather rather than flying unless necessary. They
    are cryptic by nature, relying on camouflage to avoid detection. When alarmed,
    they will flush suddenly with a whirring flight pattern. The species is known
    for its distinctive calls, particularly a loud croaking sound during breeding
    displays. Pairs typically remain on the same moorland territories year-round,
    making them relatively sedentary birds.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Red Grouse is a resident bird endemic to Great Britain and Ireland, with no
    significant migratory movements. It remains on its heather moorland territories
    year-round, making it a permanent resident throughout its limited range. Since
    the species does not occur naturally in Scandinavia or Northern Europe beyond
    the British Isles, detailed information about seasonal occurrence in these regions
    is not applicable.'
