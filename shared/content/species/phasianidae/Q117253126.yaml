description:
  sv: ''
  en: '# Grey Francolin


    The grey francolin is a ground-dwelling bird found across the plains and drier
    regions of the Indian subcontinent and Iran. It inhabits open cultivated lands,
    scrub forests, and semi-arid grasslands where it spends most of its time on the
    ground foraging and moving through low vegetation.


    This francolin is most distinctive for its loud, repeated call—a sharp "Ka-tee-tar,
    tee-tar"—which gives the species its local name "teetar." The call is characteristic
    and immediately recognizable, often produced by one or more birds in sequence.
    During breeding season, males become particularly vocal, with their calling attracting
    rival males that engage in confrontations.


    The grey francolin''s appearance reflects its ground-dwelling lifestyle, with
    cryptic plumage that provides camouflage in its scrubby habitat. It is a relatively
    compact gamebird adapted to running through grassland rather than sustained flight.
    Its behavior and vocalizations make it easier to locate by sound than sight, particularly
    during the breeding season when male activity peaks.'
migration:
  sv: ''
  en: '# Grey Francolin in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Grey Francolin is endemic to the Indian subcontinent and Iran, with no established
    presence or migration patterns in Scandinavia or Northern Europe. This species
    is a resident bird in its native range, found in open cultivated lands, scrub
    forests, and drier plains. It does not naturally occur in or migrate to Scandinavian
    or Northern European regions, making migration information for this area not applicable.'
