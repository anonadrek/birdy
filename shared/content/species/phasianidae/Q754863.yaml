  en: '# Red-legged Partridge: Occurrence in Northern Europe


    The Red-legged Partridge is not a regular resident of Scandinavia or Northern
    Europe. This Mediterranean species has its primary range in southern Europe, including
    Spain, Portugal, southern France, and Italy. While the species is resident throughout
    its core range, it does not occur naturally in Scandinavian countries or have
    established migratory patterns to Northern Europe. Any sightings in the region
    would be exceptional vagrants or escaped birds from captivity rather than part
    of a natural migration cycle.'
