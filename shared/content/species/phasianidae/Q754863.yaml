description:
  sv: '# Rödhöna


    Rödhönan är en västeuropeisk hönsfågel som tillhör familjen fasanfåglar. Det är
    en medelstor fågel med karakteristisk röd näbb och röda ben, vilket gett arten
    sitt namn. Kroppen är grågul med svarta streck på flanker och bröst. Den har också
    en tydlig vit strupe omgiven av svart.


    Rödhönan är en markfågel som främst håller till i öppna och halvöppna miljöer
    såsom buskmark, åkermark och steniga sluttningar. Det är en mycket försiktig fågel
    som ofta springer före flykt och föredrar att springa snarare än att flyga. Det
    lever gärna i små flockar, särskilt utanför häckningstiden.


    Arten var tidigare vanlig men minskar kraftigt i antal på grund av jakt och jordbrukets
    intensifiering. Sedan 2020 är den därför klassificerad som nära hotad enligt IUCN.
    Rödhönan förekommer naturligt i västra Europa och har även introducerats till
    flera andra regioner världen över.'
  en: '# Red-legged Partridge


    The red-legged partridge is a medium-sized gamebird belonging to the pheasant
    family. It is occasionally called the French partridge to distinguish it from
    the related grey partridge. The bird''s scientific name derives from Ancient Greek
    *alektoris*, meaning farmyard chicken, and the Latin *rufa*, referring to its
    distinctive red coloring.


    This partridge is characterized by its rufous plumage, which gives the species
    its common English name. It inhabits open countryside and scrubland where it forages
    on the ground for seeds and invertebrates. The species typically moves on foot
    rather than taking flight, though it will fly when disturbed, producing rapid
    wingbeats. Its call is a distinctive loud, repetitive series of notes that carries
    across open terrain.


    The red-legged partridge is found across southern Europe and has been introduced
    to various regions as a gamebird. It prefers dry, rocky, or cultivated terrain
    with sparse vegetation where it can remain concealed while moving through suitable
    habitat.'
