description:
  sv: ''
  en: '# Barbary Partridge


    The Barbary partridge is a gamebird belonging to the pheasant family, native to
    North Africa where it inhabits rocky, mountainous terrain. It is a small to medium-sized
    partridge with distinctive plumage featuring rufous and grey tones, along with
    characteristic facial markings that aid in identification. The bird''s appearance
    reflects its rocky habitat, providing effective camouflage among stone and scrubland.


    This partridge is primarily terrestrial, spending much of its time foraging on
    the ground for seeds, insects, and vegetation. It typically moves through its
    habitat in small groups and prefers to run rather than fly when disturbed, a common
    trait among partridges. The bird''s call is a distinctive loud, repeated series
    of notes that can be heard echoing through mountain valleys, particularly during
    breeding season.


    The Barbary partridge is found in arid and semi-arid mountainous regions of North
    Africa, where it occupies rocky slopes and sparse scrubland habitats. It remains
    largely endemic to this region and is adapted to survive in harsh, dry conditions
    with limited water. Birdwatchers seeking this species should focus on high-altitude
    rocky areas and scrubland during early morning hours when it is most vocal and
    active.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Barbary Partridge is a resident species of North Africa with no significant
    migratory populations in Scandinavia or Northern Europe. It does not occur naturally
    in these regions and therefore has no documented migration patterns or seasonal
    occurrence data relevant to Scandinavian bird guides.'
