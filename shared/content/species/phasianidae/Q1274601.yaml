description:
  sv: '# Kaspisk snöhöna


    Kaspisk snöhöna är en bergslevande fågel inom familjen fasanfåglar som förekommer
    i bergstrakter i västra Asien. Det är en stor och robust höna anpassad för höga
    höjder och kallt klimat. Fågeln har ett kraftigt bygge med täta fjädrar som ger
    den god isolering i snö och is.


    Arten är främst aktiv på morgon och kväll då den söker föda på bergssidorna. Det
    är en försiktig fågel som förlitar sig på sitt kamuflerande fjäderdräkt för att
    smälta in i den steniga bergsmiljön. När faran närmar sig springer den snarare
    än att flyga.


    Beståndet av kaspisk snöhöna tros vara livskraftigt, men arten minskar långsamt
    i antal. Denna utveckling förknippas troligen med förändringar i bergsmiljön och
    människans påverkan på dess naturliga habitat. Arten är starkt bunden till sina
    bergsområden och är känsllig för störningar i dessa högt belägna ekosystem.'
  en: ''
