description:
  sv: '# Rödhuvad falk


    Rödhuvad falk är en medelstor falk med utbredning i två huvudsakliga regioner:
    Afrika söder om Sahara och Indiska subkontinenten. Det är en återkommande fågel
    inom sitt område, även om vissa forskare förespråkar att dela upp de afrikanska
    och asiatiska populationerna i två åtskilda arter.


    Arten är anpassad för att jaga mindre fåglar och insekter i öppen och halvöppen
    miljö. Med sin relativt kompakta storlek är rödhuvad falk en smidig jägare som
    ofta ses när den patrullerar över sitt territorium. Arten är namnet värd för sin
    karakteristiska rödbrun färgteckning på huvud och nacke, som särskiljer den från
    många andra falkar i samma regioner.


    Rödhuvad falk förekommer framför allt i savannliknande habitat och öppna områden
    där den kan jaga från upphöjda utgångspunkter. Den anses vara relativt vanlig
    inom sitt utbredningsområde och är känd för sitt aktiva jaktbeteende under dagsljus.'
  en: '# Red-necked Falcon


    The red-necked falcon is a medium-sized bird of prey with striking plumage. It
    displays bluish-grey wings and upper body contrasted by a distinctive chestnut-red
    cap, with short dark "chin straps" extending through the eye. Black primary feathers
    and a single black band at the tail tip are characteristic features. Two geographically
    separated populations exist: one in the Indian subcontinent and another in sub-Saharan
    Africa. The African subspecies shows darker barring on the upperparts, a rufous
    breast band, and pronounced black moustachial and eye stripes, making it noticeably
    different from its Indian counterpart.


    These falcons are primarily crepuscular hunters, most active at dawn and dusk,
    typically hunting in pairs. They capture small birds, bats, and squirrels with
    swift aerial pursuits. Females are considerably larger than males—a common trait
    among falcons—which traditionally led Indian falconers to distinguish them with
    separate names.


    The red-necked falcon favours open plains and grassland habitats where it can
    hunt effectively. Its preference for open country makes it more visible than many
    falcon species, though its activity patterns at low-light hours mean patient observation
    is often required to spot it. Its distinctive silhouette and colour pattern make
    identification relatively straightforward when encountered.'
