  en: '# Red-necked Falcon – Occurrence in Scandinavia/Northern Europe


    **Migration data unavailable for this species.**


    The Red-necked Falcon is a resident species of India and sub-Saharan Africa with
    two geographically isolated populations. The source material provides no information
    regarding its occurrence, migration patterns, or presence in Scandinavia or Northern
    Europe. This species does not naturally occur in these regions and is not documented
    as a migrant, vagrant, or winter visitor to Scandinavian territories.'
