description:
  sv: '# Pilgrimsfalk


    Pilgrimen är en stor och kraftfull falk med iögonfallande utseende. Ryggen är
    mörk grå till svart medan undersidan är ljus med tät grå vattring. Det mest karakteristiska
    draget är den skarpa ansiktsmasken med en tydlig "mustasch" – ett mörkt streck
    som löper ner från ögat. Hanen är ungefär lika stor som en ringduva, medan honan
    är något större än en kråka. Kroppslängden varierar mellan 40–50 cm och vingspannet
    mellan 80–110 cm.


    Pilgrimen är känd för sitt spektakulära jaktbeteende. När den dykstötar mot sitt
    byte – främst mindre fåglar – kan den nå hastigheter på över 320 km/h, vilket
    gör den till världens snabbaste djur under dessa attackdykningar. Det är dock
    viktigt att notera att pilgrimen inte flyger på denna hastighet under normal kryss,
    utan endast under dessa kontrollerade dykningar.


    Arten förekommer på nästan alla kontinenter och har gjort en bemerkvär återhämtning
    efter att ha varit nära utrotning. Man kan ofta se pilgrimen jaga från höga utgångspunkter
    som klippor, tornspiraler och höga byggnader i urbana miljöer.'
  en: '# Peregrine Falcon


    The peregrine falcon is a large, crow-sized raptor renowned for its exceptional
    speed in pursuit of flying prey. It displays distinctive plumage: a blue-grey
    back contrasts sharply with barred white underparts, while a striking black head
    and "moustache" markings give it a characterful appearance. Like other bird-eating
    falcons, it exhibits marked sexual dimorphism, with females noticeably larger
    than males.


    This species is a specialist hunter of birds in flight, which dictates much of
    its behaviour and habitat preferences. Peregrines favour open landscapes—cliffs,
    moorlands, and urban areas with tall buildings—where they can launch high-speed
    stoops at passing prey. They are highly adaptable and have successfully colonised
    cities, nesting on buildings and bridges where abundant pigeon populations provide
    food.


    The falcon''s vocalisation is a sharp, repeated chitter-chatter, particularly
    intense around the nest. Historically persecuted and nearly extinct in many regions
    due to pesticide poisoning, peregrine falcon populations have recovered remarkably
    well following legal protection and intensive conservation efforts. Today, it
    is found across most continents and remains one of the most impressive and iconic
    raptors encountered by birdwatchers.'
