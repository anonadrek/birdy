description:
  sv: '# Slagfalk


    Slagfalk är en stor rovfågel som tillhör falkfamiljen och påminner morfologiskt
    mycket om pilgrimsfalken. Arten förekommer främst i Afrika och på Arabiska halvön.
    Slagfalken är en skicklig jägare som jagtar andra fåglar i flygning, präglad av
    snabba manövrer och stor smidighet i luften.


    Arten är anpassad för jakt i öppna och halvöppna miljöer där den kan nå höga hastigheter
    när den förföljer sitt byte. Slagfalken är ofta att se när den patrullerar sitt
    revirhögt ovanför marken eller sitter på utposter som träd och klippor. Arten
    är territoriell och återvänder ofta till samma häckningsplatser år efter år.


    Som rovfågel spelar slagfalken en viktig roll i sitt ekosystem genom att reglera
    populationerna av mindre fåglar. Arten är anpassad för varmt klimat och trivs
    i olika typer av öppna terränger från halvöken till savann. Slagfalken är en imponerande
    fågel att observera tack vare sin storlek, snabbhet och skicklighet i luften.'
  en: '# Lanner Falcon


    The lanner falcon is a large, medium-sized bird of prey with a streamlined build
    adapted for hunting in open terrain. It displays the typical falcon silhouette
    with pointed wings and a relatively long tail, allowing for agile flight when
    pursuing prey.


    This species hunts primarily birds and bats in swift, aerial pursuits characteristic
    of falcons. It prefers open habitats where it can exploit its speed and manoeuvrability
    to catch quarry mid-flight. Most populations are resident year-round, though some
    individuals disperse more widely after breeding season, moving beyond their typical
    range.


    The lanner falcon breeds across Africa, southeast Europe, and into parts of Asia.
    Its historical significance is notable—it may well have been the sacred falcon
    species of ancient Egypt, with deities such as Ra and Horus frequently depicted
    with the lanner falcon''s head in religious iconography.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: '# Lanner Falcon in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Lanner Falcon breeds primarily in Africa, southeast Europe, and marginally
    into Asia, with its range extending only into southeastern parts of Europe. Scandinavia
    and Northern Europe lie well outside its natural distribution. While the species
    is largely resident throughout its African and Mediterranean range, with some
    post-breeding dispersal occurring, there is no documented occurrence or migration
    pattern involving Scandinavian or Northern European territories. The species should
    not be expected in this region during any season.'
