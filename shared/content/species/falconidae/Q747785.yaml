description:
  sv: ''
  en: '# Sooty Falcon


    The Sooty Falcon is a medium-sized falcon with a distinctive dark plumage that
    gives it its common name. It breeds across a broad range from northeastern Africa
    through to the southern Persian Gulf region, making it a bird of arid and semi-arid
    landscapes. During winter months, the species migrates southward to East Africa
    and Madagascar, demonstrating a notable long-distance migratory pattern.


    This falcon is adapted to open and sparsely vegetated habitats where it hunts
    small birds and insects in flight. Its streamlined build and agile flight style
    reflect its aerial hunting prowess. The Sooty Falcon''s call and specific behavioral
    characteristics, typical of falcons, include rapid stooping dives when pursuing
    prey.


    Amateur birdwatchers encountering this species should note its overall dark coloration,
    which distinguishes it from paler falcon species in the same regions. Timing observations
    according to the species'' migratory schedule—breeding season in the northern
    portions of its range and winter presence in southern regions—will improve sighting
    opportunities.'
migration:
  sv: ''
  en: '# Sooty Falcon (Falco concolor) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Sooty Falcon breeds in northeastern Africa and the Persian Gulf region, wintering
    in East Africa and Madagascar. This species does not naturally occur in Scandinavia
    or Northern Europe, and there are no documented records of regular or seasonal
    presence in these regions.'
