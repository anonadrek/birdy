description:
  sv: '# Eleonorafalk


    Eleonorafalk är en falk i familjen falkfåglar som huvudsakligen häckar runt Medelhavet.
    Det är en specialiserad rovfågel som har anpassat sitt häckningsbeteende på ett
    ovanligt sätt – den häckar mellan juli och september, vilket är senare än de flesta
    andra falkarter. Denna tidpunkt är ingen slump utan en perfekt anpassning till
    artens jagtstrategi.


    Arten livnär sig framför allt på flyttfåglar, vilket är nyckeln till att förstå
    dess biologi. Under hösten passerar miljontals fåglar genom sitt häckningsområde
    under sin sydliga migration, och eleonorafalk tiden sitt reproduktion för att
    kunna mata sina ungar just när denna överflöd av bytesdjur är som störst. På så
    sätt säkrar den ett rikligt födotillbud för sitt växande kullnöt.


    Arten är således ett fascinerande exempel på hur rovfåglar har utvecklat sofistikerade
    anpassningar till sin miljö och bytestillgång, där häckningstidpunkten helt och
    hållet styrs av migrationsmönstren hos andra fågelarter.'
  en: ''
migration:
  sv: '# Eleonorafalk i Skandinavien/Nordeuropa


    Eleonorafalk är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    övervägande kring Medelhavet och förekommer endast sporadiskt under flyttningen
    genom regionen. De fåtal observationer som görs i norden inträffar huvudsakligen
    under sensommaren och hösten när ungfåglar och överskottspopulationer sprider
    sig från häckningsområdena. Arten övervintrar inte i nordiska områden utan återvänder
    till sitt hemland efter häckningssäsongen.'
  en: ''
