description:
  sv: '# Rödfalk


    Rödfalk är en liten falk som tillhör familjen falkfåglar. Arten häckar i Medelhavsområdet
    och sträcker sig österut till Kina. Den är migratorisk och flyttar under vintertid
    till Afrika söder om Sahara för att söka föda.


    Arten har länge varit klassificerad som utrotningshotad på grund av habitatförlust
    och förföljelse. Under senare år har dock situationen förbättrats märkbart. Beståndet
    har stabiliserats och har till och med ökat i vissa områden, vilket är ett positivt
    tecken för artens överlevnad. Denna positiva utveckling är resultatet av ökade
    naturvårdsinsatser och bättre skydd av häckningslokalerna.'
  en: '# Lesser Kestrel


    The lesser kestrel is a small falcon with a compact build suited to its aerial
    hunting lifestyle. It breeds across a broad range spanning from the Mediterranean
    eastward through Central Asia to China and Mongolia, making it one of the more
    widespread falcon species. The bird is highly migratory, departing breeding grounds
    to winter in Africa, Pakistan, and occasionally India and Iraq. It is rarely encountered
    north of its established breeding range, and populations in Europe show concerning
    declines.


    This species favors open and semi-open habitats where it hunts small prey from
    the air or low perches. The lesser kestrel is a summer breeder, timing its reproduction
    to coincide with seasonal abundance of food resources. Its populations have faced
    pressure from habitat loss and environmental changes across its range, contributing
    to the downward trend observed particularly in European populations.'
migration:
  sv: '# Rödfalk – Förekomst i Nordeuropa


    Rödfalk är en flyttfågel som inte är en regelbunden förekomstare i Skandinavien
    och Nordeuropa. Arten häckar i Medelhavsområdet och eastut till Kina, men förekommer
    inte som häckfågel i vårt område. Under hösten påbörjar rödfalken sin långväga
    migration söderut till Afrika söder om Sahara, där den tillbringar vintern. Under
    våren återvänder arten till sina häckningsområden i söder. Observationer av rödfalk
    i Norden är mycket sällsynta och skulle klassificeras som extraordinära avvikelser
    snarare än regelbundna migrationer genom vårt område.'
  en: '# Lesser Kestrel (Rödfalk) in Scandinavia/Northern Europe


    The Lesser Kestrel is extremely rare in Scandinavia and Northern Europe. This
    small falcon breeds primarily in the Mediterranean region and Central Asia, with
    its European range now declining significantly. As a summer migrant, it winters
    primarily in Africa, with some populations reaching Pakistan, India, and Iraq.
    The species is only occasionally recorded north of its main breeding range, making
    sightings in Scandinavia highly exceptional. Any occurrences in Northern Europe
    would represent vagrants far outside the species'' typical migration routes and
    established range.'
