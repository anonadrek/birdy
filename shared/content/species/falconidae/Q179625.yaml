description:
  sv: '# Aftonfalk


    Aftonfalk är en liten och smidig falk med specialisering på insektsföda. Hanen
    är mörkgrå till nästan svart på övre delen med karakteristiska röda ben och ansikte,
    medan honan är gul-brun med mörkare teckning. Det är en elegant fågel med spetsiga
    vingar och snabb, wendig flygstil som påminner om en mindre tornfalk.


    Arten förekommer som häckfågel i Östeuropa och västra Asien, där den återvänder
    varje vår. Under hösten drar arten långt söderut för att övervinta i Afrika söder
    om Sahara. Under häckningsperioden ses aftonfalk ofta i öppna och halvöppna landskap
    med glesa träd, ofta nära vatten.


    Arten är mycket insektsätande och jagar ofta från låg höjd eller från pinnar,
    där den spottar och snatchar flygande insekter. Populationen har minskat märkbart
    på grund av habitatförlust och klimatförändringar, vilket har fört arten till
    kategorin sårbar enligt IUCN.'
  en: '# Red-footed Falcon


    The red-footed falcon is a small falcon belonging to the family Falconidae. This
    bird of prey is found across eastern Europe and Asia, where it breeds before migrating
    to Africa for winter. It occasionally wanders into western Europe, demonstrating
    its migratory restlessness during seasonal movements.


    The species is characterized by its distinctive red feet, which give it its common
    name. Its populations have declined significantly in recent decades due to habitat
    loss and hunting pressure, making it an increasingly scarce sight throughout much
    of its range. The red-footed falcon typically hunts small birds and insects in
    open habitats, employing agile aerial pursuit typical of smaller falcons.


    This falcon''s appearance and behaviour mark it as an active, energetic hunter
    adapted to open country. While detailed descriptions of its plumage and calls
    are not provided in available sources, its small size and red feet make it identifiable
    among falcon species. Its occurrence as a vagrant to western Europe and its rare
    appearance in North America highlight its capacity for long-distance wandering,
    occasionally taking individuals far beyond their normal range.'
migration:
  sv: Aftonfalk är en långflyttare som häckar i Östeuropa och Asien men övervintrar
    i Afrika söder om Sahara. Under vårmigration anländer arten till häckningsområdena
    från april till maj. Efter häckningssäsongen påbörjas höstflyttningen från juli,
    och fågeln är borta från Europa under vintermånaderna. I Skandinavien och Norden
    är aftonfalk en sparsam genomfartsgenomfågelart under migrationerna, då den passerar
    genom regionen på vägen mellan sina östeuropeiska häckningsområden och afrikanska
    övervintringsplatser.
  en: '# Red-footed Falcon in Scandinavia and Northern Europe


    The red-footed falcon is a migratory species that occurs irregularly in Scandinavia
    and northern Europe, primarily as a wanderer during migration periods. This eastern
    European and Asian breeder is not a regular resident in the region but appears
    sporadically, particularly in late summer and autumn when individuals disperse
    westward. The species winters in Africa, making it a trans-Saharan migrant. While
    sightings in Scandinavia remain uncommon, they are most likely during August and
    September when vagrant birds occasionally reach western European countries during
    their southbound migration to African wintering grounds.'
