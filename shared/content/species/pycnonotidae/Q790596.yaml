description:
  sv: ''
  en: '# Common Bulbul


    The common bulbul is a widespread African passerine belonging to the bulbul family.
    It is found throughout most of the continent, avoiding only the driest regions,
    and has recently established breeding populations in the southernmost parts of
    Europe. Ten subspecies are currently recognized, reflecting variation in plumage
    across the bird''s range. Some subspecies were once classified as separate species,
    including Dodson''s bulbul, the Somali bulbul, and the dark-capped bulbul.


    This adaptable bird demonstrates remarkable range expansion, now occupying territories
    well beyond its traditional African strongholds. The plumage variation across
    subspecies makes identification in the field challenging, as different populations
    display distinct markings and coloration. The common bulbul''s success in colonizing
    new regions suggests it is a resilient species capable of thriving in diverse
    habitats beyond its native range.'
