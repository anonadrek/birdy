description:
  sv: ''
  en: '# White-eared Bulbul


    The white-eared bulbul is a member of the bulbul family found across south-western
    Asia, ranging from the Indian subcontinent to the Arabian Peninsula. This species
    is characterized by distinctive white ear-coverts that stand out against its darker
    plumage, providing the basis for its common name.


    While the provided source material is limited, the white-eared bulbul, like other
    bulbuls, is typically an active and social bird. It inhabits scrubby woodland
    and gardens within its range, where it forages for insects and fruits. The species
    is often encountered in small groups, moving restlessly through vegetation with
    characteristic bulbul behaviour—quick, darting movements and frequent vocalizations.


    The bird''s calls are typical of bulbuls: a series of energetic, chattering notes
    that can be quite loud and distinctive. Its presence is often announced by these
    vocal outbursts before the bird itself is spotted.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The White-eared Bulbul is native to south-western Asia, with its range extending
