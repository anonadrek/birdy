description:
  sv: '# Rödörad bulbyl


    Rödörad bulbyl är en vanlig asiatisk tätting som tillhör familjen bulbyler. Arten
    är vida spridd över sin hemregion och har även etablerat sig i frilevande populationer
    på andra håll i världen.


    Arten är känd för sitt livliga temperament och sin högljudda närvaro. Det är en
    social fågel som ofta ses i mindre grupper bland täta buskar och trädkronor där
    det söker föda bland löv och frukter. Rödörad bulbyl är aktiv och rörig, med ett
    utpräglat beteende där den ofta hörs innan den ses.


    Fågeln är anpassad till olika typer av växtlighet och trivs väl i både naturliga
    och urbana miljöer, vilket förklarar dess framgångsrika spridning utanför sitt
    ursprungliga utbredningsområde.'
  en: '# Red-whiskered Bulbul


    The red-whiskered bulbul is a distinctive passerine with a prominent crest and
    striking red face patches that give it its name. It is a medium-sized bird that
    perches conspicuously in open positions on trees and branches, making it relatively
    easy to observe. Its appearance and bold behaviour make it stand out in its habitat.


    This species is a frugivore that feeds primarily on fruits, supplemented with
    small insects. It has a loud, distinctive call consisting of three or four notes
    that can be heard distinctly across short to medium distances. The bird is notably
    vocal and active, drawing attention through both its appearance and sound.


    Native to tropical Asia where it is a year-round resident, the red-whiskered bulbul
    thrives in hill forests and urban gardens. It has proven highly adaptable and
    has been successfully introduced to many tropical regions worldwide, where established
    populations have become common. This adaptability makes it one of the more widespread
    and recognizable bulbul species in introduced ranges as well as its native habitat.'
