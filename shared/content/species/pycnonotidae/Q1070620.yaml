  en: '# White-spectacled Bulbul in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The White-spectacled Bulbul is a resident species of the eastern Mediterranean
    and Middle Eastern regions, with breeding populations ranging from Turkey through
    the Levant to Arabia. This species does not occur naturally in Scandinavia or
    Northern Europe, as its range is restricted to warmer, more southerly climates
    where it inhabits fruit plantations, gardens, and urban areas.'
