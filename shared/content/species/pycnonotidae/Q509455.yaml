description:
  sv: '# Rödgumpad bulbyl


    Rödgumpad bulbyl är en asiatisk tätting som tillhör familjen bulbyler. Arten härstammar
    från västra Pakistan och förekommer naturligt från Indien och Sri Lanka till sydvästra
    Kina och Burma. Denna framgångsrik art har även introducerats till olika delar
    av världen.


    Beståndet av rödgumpad bulbyl är livskraftigt och arten ökar i antal både inom
    sitt naturliga utbredningsområde och på introduceringslokaler. Det är en adaptiv
    art som trivs väl i olika miljöer och har visat sig kunna etablera sig framgångsrikt
    på nya håll.'
  en: '# Red-vented Bulbul


    The red-vented bulbul is a common bulbul found across South Asia and extending
    into Burma. It is a resident breeder in these regions, maintaining populations
    year-round. The species is characterized by its distinctive red vent—the feathers
    beneath the tail—which gives it its common name. It displays typical bulbul features
    with a medium-sized, compact body and alert posture.


    This bulbul is highly adaptable and social, often seen in small groups or flocks.
    It is an active forager, gleaning insects and fruits from vegetation and lower
    canopy levels. The species produces loud, distinctive calls that are characteristic
    of bulbuls, contributing to its presence in gardens and cultivated areas where
    it thrives.


    Unfortunately, the red-vented bulbul is one of the world''s most invasive bird
    species, having established populations far beyond its native range, including
    in Argentina, Fiji, Tonga, and parts of the Pacific Islands. This invasive success
    reflects its adaptability to varied habitats and generalist feeding ecology, making
    it a conservation concern in regions where it has been introduced. The species
    demonstrates the capacity of certain passerines to become problematic when introduced
    to new environments.'
