description:
  sv: '# Mandarinand


    Mandarinanden är en elegant ändfågel från Östasien som tillhör familjen egentliga
    andfåglar. Arten är framför allt känd för sin extraordinärt vacker fjäderdräkt,
    som gör den till en av världens mest iögonfallande andfåglar. Honan är betydligt
    mattare färgad än hanen, som bär en imponerande dräkt med skimrande färger.


    Arten förekommer naturligt i Östasien, men på grund av sin skönhet har den blivit
    populär som prydnadsfågel och hålls därför i många fågeldammar i parker och zoologiska
    trädgårdar världen över, även långt utanför sitt naturliga utbredningsområde.
    I dessa miljöer är mandarinanden ofta en attraktion för besökare tack vare sitt
    spektakulära utseende.'
  en: '# Mandarin Duck


    The mandarin duck is a striking medium-sized duck, measuring 41–49 cm long with
    a 65–75 cm wingspan. It is most notable for its extreme sexual dimorphism: males
    display elaborate and colourful plumage, while females are considerably more subdued
    in appearance. It is closely related to the North American wood duck, being the
    only other member of the genus Aix.


    Native to the East Palearctic, the mandarin duck is a perching duck species, reflecting
    its woodland habitat preferences. Beyond its native range, it has established
    substantial introduced populations in the British Isles and Western Europe, with
    smaller populations also present in North America. These introduced populations
    have become established in various wetland and park environments.


    The species name reflects its distinctive appearance: ''galericulata'' derives
    from the Latin word for a wig or cap, referring to the elaborate head markings
    of the male bird.'
migration:
  sv: '# Mandarinand i Skandinavien/Nordeuropa


    Mandarinanden är en østasiatisk art som normalt inte förekommer naturligt i Skandinavien
    eller Nordeuropa. De exemplar som påträffas i regionen är nästan uteslutande undsluppna
    eller utslappade prydnadsfåglar från parker och zoologiska trädgårdar. Dessa introducerade
    populationer har ingen etablerad migrationscykel i norden, då arten är bunden
    till sitt introduktionsomgivningar och inte genomför regelbundna säsongsvandringar.
    Under hårdare vintrar kan många av dessa fåglar dö eller försvinna från området
    då de saknar anpassningar för nordeuropeiska klimatförhållanden.'
  en: '# Mandarin Duck in Northern Europe


    The Mandarin Duck is not native to Scandinavia or Northern Europe but occurs as
    an introduced species, primarily in the British Isles and Western Europe. In these
    regions, populations are largely sedentary or partially migratory, depending on
    local conditions and winter severity. Most birds remain year-round where populations
    are established, though some movement occurs during harsh winters when birds may
    relocate to more favorable habitats with open water. The species is increasingly
    visible in parks and on waterways across Western Europe, having escaped or been
    released from captivity. In Scandinavia specifically, Mandarin Ducks remain rare
    vagrants or occasional winter visitors rather than regular members of the avifauna.'
