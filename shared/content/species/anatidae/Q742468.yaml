description:
  sv: '# Vitnackad svärta


    Vitnackad svärta är en amerikansk andfågel som häckar i Kanada och Alaska. Under
    vintern flyttar arten främst till USA:s norra kuster, men dyker regelbundet upp
    i Europa som gäst. I Sverige observeras den årligen, även om den är relativt fåtalig.


    Arten kännetecknas av sitt karakteristiska utseende med svart fjäderdräkt och
    vita märken på nacken och huvudet. Vitnackad svärta föredrar kustnära vatten där
    den dykande och födosökning efter småfisk och andra vattenorganismer. Arten är
    ofta aktiv på djupare vatten än många andra andarter.


    Populationen vitnackad svärta minskar långsamt, men beståndet anses fortsatt vara
    livskraftigt. Som många simfåglar är arten beroende av friska marina och kustmiljöer
    för sin överlevnad.'
  en: '# Surf Scoter


    The surf scoter is a large sea duck with striking sexual dimorphism. Males are
    predominantly black with distinctive white patches on the forehead and nape, making
    them instantly recognizable. Females are noticeably smaller and browner overall,
    lacking the bold white markings. Both sexes have characteristic heavy bills adapted
    for their diving lifestyle.


    This species is primarily a benthic feeder, diving to the seafloor to forage for
    invertebrates, with mussels forming a significant part of its diet. Surf scoters
    are highly specialized for marine life and are rarely seen on freshwater. They
    breed in the northern regions of North America during summer months, then migrate
    to coastal waters for winter, where they gather in large flocks often visible
    from shore, particularly along rocky or sandy coasts where their preferred food
    sources are abundant.'
migration:
  sv: '# Vitnackad svärta i Skandinavien


    Vitnackad svärta är en nordamerikansk andfågel som endast förekommer som oregelbunden
    gäst i Europa och Sverige. Arten observeras årligen i svenska farvatten, särskilt
    under höst och vinter när nordamerikanska populationer migrerar söderut. Även
    om den är en fåtalig besökare, ses den regelbundet längs våra kuster. Huvuddelen
    av arten övervintrargränslös på östkusten av USA:s norra atlantkust, långt från
    sitt häckningsområde i Kanada och Alaska. I Sverige anländer enstaka individer
    framför allt under höst- och vinterperioden.'
  en: '# Surf Scoter in Scandinavia/Northern Europe


    The Surf Scoter is primarily a North American species with very limited occurrence
    in Scandinavia and Northern Europe. While the species is native to breeding grounds
    in Northern Canada and Alaska, wintering along North American coasts, occasional
    vagrants may appear in northern European waters during winter months. However,
    regular migration patterns to Scandinavia are not established, and sightings remain
    rare and unpredictable. The species should not be considered a typical winter
    visitor or regular migrant to the region.


    **Migration data for regular Scandinavian/Northern European occurrence is unavailable
    for this species.**'
