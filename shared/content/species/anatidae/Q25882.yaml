description:
  sv: '# Grågås


    Grågåsen är en stor och kraftig gås med grå fjäderdräkt och mycket karakteristiska
    ljusa vingframkanter som är tydliga både sittande och flygande. Näbben och benen
    är ljusrosa, vilket skiljer arten från andra gåsarter. Det är en robust fågel
    som väl motsvarar många människors mentala bild av en typisk gås.


    Som kortflyttande flyttfågel häckar grågåsen i stora delar av norra och mellersta
    Palearktis. Arten är gregär och ses ofta i större eller mindre flockar, särskilt
    under migration och på övervintringsområdena. Grågåsen föredrar våtmarker som
    sjöar, vattendrag och sumpiga områden där den kan föda sig på växtmaterial.


    Grågåsen är känd för sitt höga, trumpetliknande läte som ofta hörs när flockar
    flyger förbi. Arten är också källan till vår tamgås, då tamgåsen domesticerades
    från grågåsen redan för flera tusen år sedan. Idag klassificeras grågåsen som
    livskraftig och förekommer fortfarande i gott antal på många håll inom sitt utbredningsområde.'
  en: '# Greylag Goose


    The greylag goose is a large waterfowl measuring 74–91 centimetres in length,
    weighing around 3.3 kilograms. It displays mottled and barred grey and white plumage,
    with a distinctive orange beak and pink legs. Its robust build and substantial
    size make it one of the more impressive goose species encountered in the wild.


    This species has a widespread distribution across Europe and Asia. Northern populations
    are typically migratory, moving southward during winter to seek milder conditions,
    while many southern populations remain resident year-round. The greylag goose
    is notably the ancestor of most domestic goose breeds, having been domesticated
    for thousands of years, with evidence of domestication dating back at least to
    1360 BCE.


    In its natural habitat, the greylag goose frequents lakes, marshes, and wetland
    areas where it feeds on vegetation. It is highly sociable, often seen in flocks,
    particularly during migration periods and winter gatherings. Its adaptability
    to various wetland environments and its relatively large population make it a
    familiar sight across much of its range, especially where protected from hunting
    pressures.'
migration:
  sv: '# Grågås – Förekomst i Skandinavien/Nordeuropa


    Grågåsen är en kortflyttande art som häckar i stora delar av norra och mellersta
    Palearktis. I Skandinavien och Nordeuropa är den en sesongsarter som följer årscykeln.
    Arten anländer till häckningsområdena under våren och återvänder till sina övervintringsområden
    innan vintern sätter in. Som kortflyttare förflyttar sig populationerna mellan
    nordiska häckningsplatser och mindre avlägsna övervintringshabitat, ofta inom
    samma större geografiska region.


    Grågåsen är därmed ingen långflyttare utan återkommer regelbundet till samma områden
    säsong efter säsong, där förekomsten är starkt beroende av säsongens framsteg
    och is- och snöförhållandena.'
  en: '# Greylag Goose in Scandinavia/Northern Europe


    The Greylag Goose shows variable migratory behavior throughout Scandinavia and
    Northern Europe. Northern populations are highly migratory, with birds departing
    breeding grounds in autumn to overwinter in southern regions, returning northward
    in spring. However, many populations have become increasingly resident, remaining
    year-round even in northern areas, particularly where winter conditions permit
    access to open water and food sources. Spring arrival typically occurs from February
    onwards, with peak breeding activity in spring and early summer. Autumn migration
    intensifies from September through November as birds move southward to escape
    harsh winter conditions.'
