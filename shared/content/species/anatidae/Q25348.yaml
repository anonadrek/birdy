description:
  sv: '# Gräsand


    Gräsand är en av norra halvklotets vanligaste andfåglar. Arten är välbekant och
    vida spridd över stora områden. Gräsanden är särskilt anmärkningsvärd eftersom
    den, tillsammans med myskanden, är ursprunget till de tamänder som människan tämjt
    genom historien.


    Denna andfågel förekommer i många olika miljöer där det finns vatten – från små
    dammar och sjöar till större vattendrag. Den är anpassad till såväl naturliga
    som människoskapade vattenhabitat, vilket bidrar till dess framgång och utbredning
    över norra halvklotet. Gräsanden är därför en art som många människor får möta
    i sitt dagliga liv, både i städer och på landsbygden.'
  en: '# Mallard


    The mallard is a dabbling duck found across temperate and subtropical regions
    worldwide, having been introduced to many additional locations. Males are distinctive
    with their iridescent green heads, yellow bills, and chestnut breasts, while females
    are mottled brown with orange-and-brown bills. It is a highly social species,
    typically seen in groups of varying sizes on wetlands.


    Mallards are adaptable foragers, dabbling in shallow water to feed on aquatic
    plants and small animals. They are vocal ducks, with males producing a soft, nasal
    call and females emitting the classic loud, repetitive quacking sound. The species
    is often seen in pairs or larger flocks, particularly during breeding season,
    and readily congregates in parks and urban waterways alongside other duck species.


    This abundant and familiar duck prefers wetland habitats including lakes, ponds,
    marshes, and rivers. Its adaptability and social nature have made it one of the
    most widespread and recognizable waterfowl species, thriving in both natural and
    human-modified environments.'
migration:
  sv: '# Gräsand - Säsongförekomst i Nordeuropa


    Gräsanden är en övervintrare och flyttfågel i Skandinavien. Arten återvänder till
    häckningsområdena under mars-april när isen börjar smälta. Under sommaren häckar
    gräsanden vid sjöar, våtmarker och vattendrag över större delen av Sverige, Norge
    och Danmark. Hösten påbörjas förflyttningen från augusti-september då många individer
    drar söderut och västerut. En del gräsänder stannar kvar och överväxlar vid öppna
    vattnet längs kusten och vid värmekällor där is inte bildas.'
  en: '# Mallard in Scandinavia/Northern Europe


    The mallard is a common and widespread dabbling duck throughout Scandinavia and
    Northern Europe, occurring year-round in many areas. Northern populations are
    migratory, with birds arriving from March onwards to breed in wetlands across
    the region. During autumn, typically from September onwards, these populations
    undertake southwesterly migrations to overwinter in more temperate regions. However,
    substantial numbers remain as winter residents in Scandinavian countries, particularly
    in coastal areas and unfrozen inland waters where food remains accessible. This
    species'' flexibility in wintering habits makes it one of the few dabbling ducks
    regularly present throughout the year in Northern Europe.'
