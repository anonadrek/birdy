description:
  sv: '# Ringand


    Ringand är en liten dykand från Nordamerika som påträffas mycket sällsynt i Europa.
    Det är en relativt vanlig art på sitt hemkontinent, och beståndet anses vara livskraftigt
    och i ökning.


    Arten karakteriseras av sitt lilla format och tillhör familjen egentliga andfåglar.
    Ringanden föredrar dammar och sjöar som miljö och är en dykfågel som söker sin
    föda under vattenytan.


    Som nordamerikansk art observeras ringanden endast undantagsvis utanför sitt naturliga
    utbredningsområde, varför den inte är känd för den genomsnittlige fågelskådaren
    i Europa.'
  en: '# Ring-necked Duck


    The ring-necked duck is a diving duck native to North America, commonly inhabiting
    freshwater ponds and lakes. Despite its name, the ring around its neck is often
    inconspicuous and difficult to spot in the field. Males display distinctive plumage
    with a dark head, grey flanks, and a prominent white ring on the bill, while females
    are more subtly marked with brownish-grey tones and a similar white bill ring.


    This species is a true diving duck, meaning it feeds by submerging entirely underwater
    rather than dabbling at the surface. It typically forages on aquatic vegetation,
    seeds, and invertebrates in deeper water. Ring-necked ducks are relatively quiet
    ducks, though males produce soft whistles during courtship and both sexes may
    utter occasional low calls when alarmed or in flight.


    The species frequents freshwater environments across its range, showing a preference
    for deeper lakes and ponds with abundant aquatic vegetation. During migration
    periods, ring-necked ducks may be seen in larger flocks, though they often remain
    in small groups. Their compact body shape and diving behaviour make them easily
    distinguished from dabbling ducks, even when the diagnostic neck ring is not clearly
    visible.'
migration:
  sv: Ringand är en nordamerikansk art som förekommer mycket sällsynt i Europa och
    Skandinavien. I Nordeuropa ses arten främst under höst- och vinterperioden, då
    några individer sporadiskt dyker upp, särskilt vid kustnära områden och större
    sjöar. Arten är en dykand som föredrar öppna vattenytor och ses oftast som tillfälliga
    iakttagelser under oktober till mars. De nordamerikanska populationerna är långdistansmigratörer,
    men när arten påträffas i Europa tycks det röra sig om individer från västra populationen
    som antagligen driver västerut istället för söderut under hösten.
