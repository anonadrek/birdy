description:
  sv: ''
  en: '# White-headed Duck


    The white-headed duck is a compact diving duck measuring around 45 cm in length.
    Males are distinctive with their white head topped by a black crown, striking
    blue bill, and reddish-grey body plumage, while females display duller coloration
    and a darker bill. These birds favour lakes with open water and dense marginal
    vegetation for breeding.


    Behaviourally, the white-headed duck is an accomplished diver, spending much of
    its time beneath the surface feeding on aquatic vegetation supplemented with animal
    matter. When alarmed, it typically chooses to swim away from danger rather than
    take flight, making it relatively unobtrusive. The species is found across Spain,
    North Africa, Western Asia, and Central Asia, though its range has contracted
    significantly.


    Conservation is a major concern for this species, as populations continue to decline
    due to habitat loss and water pollution. The International Union for Conservation
    of Nature has classified it as endangered, highlighting the urgent need for wetland
    protection throughout its range to ensure its survival.'
migration:
  sv: ''
  en: '# Migration and Occurrence in Northern Europe


    The White-headed Duck is not a regular occurrence in Scandinavia or Northern Europe.
    This species is primarily distributed in southern regions, including Spain, North
    Africa, Western Asia, and Central Asia. While vagrant individuals have occasionally
    been recorded in northern European countries, the species does not have an established
    migration pattern through Scandinavia. Any sightings in Northern Europe would
    be exceptional and represent wandering individuals far outside their normal range
    rather than part of regular seasonal movements. The species is generally sedentary
    or exhibits limited movements within its core range in warmer regions.'
