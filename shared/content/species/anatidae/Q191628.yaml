description:
  sv: '# Fjällgås


    Fjällgåsen är en liten grå gås som är märkbar genom sin kompakta byggnad och relativt
    korta hals jämfört med andra gåsarter. Den har en vit panna och ansiktsmärkning
    som ger den sitt namn, samt gula ben och näbb. Fjällgåsen liknar grågåsen men
    är mindre och mer kompakt i proportionerna.


    Arten häckar i nordligaste Fennoskandien och Sibirien, på barmark och tundra i
    de kallaste områdena. Fjällgåsen är samhällig och söker sin föda på gräsrika marker
    där den betar på växter. Under flyttningen och på vinterkvarteren hittas den ofta
    tillsammans med andra gåsarter på öppna slätter och vid vattenhål.


    Fjällgåsens population har minskat drastiskt under 1900-talet, vilket gör arten
    till en sällsynt observerad fågel idag. Den återkommer årligen på samma rastplatser
    under sin årscykel, vilket är karakteristiskt för många gåsarter. Arten kan ibland
    skymtas bland större flockar av andra gåser, särskilt under höst- och vårflyttningen.'
  en: '# Lesser White-fronted Goose


    The lesser white-fronted goose is a small goose closely related to the larger
    greater white-fronted goose. It breeds in the northernmost reaches of the Palearctic
    region, though it has become a scarce breeder across much of Europe. Conservation
    efforts include reintroduction programs in northern regions.


    As its name suggests, it is smaller than its greater white-fronted cousin, with
    distinctive white markings on the forehead and face. The plumage is predominantly
    brown-grey on the body, with darker flight feathers. Its bills and feet are typically
    orange-yellow. In flight, it shows pale wing coverts contrasting with darker wings,
    making it identifiable at distance when compared to related species.


    This species is highly migratory, moving between its Arctic breeding grounds and
    wintering areas at lower latitudes. It feeds on grasses, sedges, and other vegetation,
    often grazing in flocks. The call is a higher-pitched honking than that of the
    greater white-fronted goose—a useful identification feature when multiple goose
    species are present. The species is typically seen in open habitats including
    wetlands, grasslands, and coastal areas during migration and winter months.'
migration:
  sv: Fjällgås är en flyttfågel som förekommer i Fennoskandien under häckningssäsongen.
    Arten häckar i nordligaste delen av regionen under sommaren. Under hösten migrerar
    fjällgåsen söderut för att övervinta i värmere klimat. Under våren återvänder
    den till sina häckningsområden i norr. Arten är således endast närvarande i Fennoskandien
    under sommarmånaderna, medan den är frånvarande under större delen av året på
    grund av sin långväga migration.
  en: '# Lesser White-fronted Goose (Fjällgås) in Scandinavia


    The Lesser White-fronted Goose is a scarce breeder in northern Scandinavia, with
    populations sustained partly through reintroduction efforts in Fennoscandia. This
    species breeds in the northernmost Palearctic regions during summer months. As
    a migratory species, it follows seasonal movement patterns typical of arctic-breeding
    geese, departing breeding grounds in autumn for wintering areas further south.
    However, the provided source text does not contain specific details regarding
    exact arrival and departure months, or precise overwintering locations in Northern
    Europe.'
