description:
  sv: ''
  en: '# Blue-winged Teal


    The blue-winged teal is a small dabbling duck belonging to the Anatidae family.
    It is one of the smaller members of its group, making it relatively compact compared
    to other dabbling ducks. The species is primarily found in North America, where
    it has an extensive breeding range spanning from southern Alaska eastward to Nova
    Scotia, and extending southward to northern Texas. During winter months, the species
    migrates to coastal regions along both the Pacific and Atlantic coasts, as well
    as further south into the Caribbean islands and Central America.


    This migratory pattern demonstrates the species'' adaptability to various wetland
    habitats across a wide geographic range. The blue-winged teal''s preference for
    seasonal movement between breeding grounds in northern regions and wintering areas
    in warmer southern locations is typical of many North American duck species. Its
    ability to utilize diverse aquatic environments throughout its range makes it
    a notable waterfowl species worth observing during both breeding and migration
    seasons.'
