description:
  sv: '# Myskand


    Myskand är en stor andart från familjen änder med ursprung i Mexiko och Sydamerika.
    Det finns både vilda och domesticerade former. Den vilda formen är svart med vita
    teckningar på vingarna, medan den domesticerade myskanka förekommer i olika färgvarianter.
    Fågeln är relativt stor och kraftig med ett karakteristiskt utseende.


    Arten är anpassad till både sötvattensmiljöer och brackvatten. Den är primärt
    aktiv under dagliga timmar och förekommer ofta nära skogar och vattendrag. Myskand
    är relativt tystlåten jämfört med många andra andarter, men producerar olika ljud
    för kommunikation.


    Ursprungligen begränsad till Mexiko och södra Amerika har myskanden expanderat
    sitt utbredningsområde kraftigt. Domesticerade former introducerades till andra
    världsdelar och har etablerat förvildade populationer, särskilt i Nordamerika
    där stabila bestånd nu finns etablerade i flera regioner.'
  en: '# Muscovy Duck


    The Muscovy duck is a large, distinctive duck native to the Americas, ranging
    from southern Texas and Mexico through Central and South America to Argentina
    and Uruguay. It has been extensively domesticated worldwide, and feral populations
    now occur in New Zealand, Australia, parts of the United States, and Central and
    Eastern Europe, where it sometimes establishes itself in urban and suburban waterways.


    The species is easily recognized by its size and unusual appearance. It has a
    dark, iridescent plumage, often with white patches on the wings and body depending
    on the individual. A characteristic feature is the bare, warty red facial skin
    around the eyes and bill, which is particularly prominent in males. Males are
    significantly larger and heavier than females, with a more pronounced head knob.


    Muscovy ducks are relatively quiet compared to other duck species, though males
    produce a distinctive hissing sound. They spend much time perching and roosting
    on trees and branches, being more arboreal than most ducks. It often feeds by
    dabbling in shallow water or grazing on land, consuming aquatic vegetation, seeds,
    and insects. The species prefers freshwater habitats and wetlands, and it nests
    in tree cavities or dense vegetation near water.'
migration:
  sv: 'Migrationsdata saknas för denna art.


    **Förklaring:** Källtexten behandlar endast myskandets ursprungliga utbredning
    i Amerika (från Mexiko till centrala Sydamerika) och förvildade populationer i
    USA och Nordamerika. Det finns ingen information om förekomst, migration eller
    säsongsvis närvaro i Skandinavien eller Nordeuropa. Därför kan jag inte skriva
    den efterfrågade guiden om arten i denna region.'
  en: '# Muscovy Duck in Northern Europe


    The Muscovy duck is not a naturally occurring species in Scandinavia or Northern
    Europe. However, feral populations descended from domesticated birds have established
    themselves locally in parts of Central and Eastern Europe, occasionally wandering
    into Scandinavian regions during warmer months. These birds are not migratory
    and do not have an established overwintering population in Northern Europe. Any
    sightings in Scandinavia represent escapes or releases from captive populations
    and should be considered vagrant or locally feral rather than part of a natural
    migration pattern.'
