description:
  sv: '# Bergand


    Bergand är en dykkand som tillhör familjen änder och förekommer som flyttfågel
    i de arktiska och subarktiska regionerna. Arten häckar på tundra och vid taigans
    norra gräns runt om i Arktis. Under senare år har bergand minskat kraftigt i antal,
    särskilt i vissa regioner som Östersjön, även om det globala beståndet fortfarande
    betraktas som livskraftigt.


    Berganden är en medelstor andart som är väl anpassad för att dyka efter föda.
    Arten kan återfinnas på både sötvattenssjöar under häckningstiden och på kustvatten
    under vintern. Som många flyttfåglar söker den sig till mildare klimat när den
    arktiska vintern närmar sig.'
  en: '# Greater Scaup


    The greater scaup is a mid-sized diving duck, noticeably larger than its close
    relatives the lesser scaup and tufted duck. Males display striking black-and-white
    plumage with a glossy green head, while females are predominantly brown with a
    white facial patch near the bill. Both sexes show pale grey flanks and wings in
    flight, creating a distinctive contrast with their darker bodies.


    These diving ducks are highly gregarious and often gather in substantial flocks,
    particularly during winter months. They feed by diving to the seabed, consuming
    molluscs, crustaceans, and aquatic plants. The species is relatively quiet, though
    males produce soft whistling calls during courtship, and females make growling
    sounds.


    The greater scaup breeds during summer across northern regions including Iceland,
    Scandinavia, northern Russia, Siberia, Alaska, and northern Canada. In winter,
    it migrates to coastal waters of Europe, eastern Asia, and North America, where
    it is commonly seen on sheltered bays, estuaries, and open water. It favours marine
    and brackish environments outside the breeding season, making it particularly
    associated with coastal habitats rather than inland waters.'
migration:
  sv: '# Bergand - Migration i Skandinavien


    Bergand är en flyttfågel som häckar cirkumpolärt i arktiska och subarktiska regioner.
    Under häckningstiden förekommer arten på tundra och i norra gränsen av tajgan.
    Som flyttfågel återvänder bergand till sina häckningsområden på våren och lämnar
    dessa på hösten för att övervintrera på lägre latituder. I Skandinavien och Nordeuropa
    förekommer arten främst under flyttningsperioderna samt under övervintringsperioden,
    då den söker upp kustnära områden och större sjöar där isen inte lägger sig.


    Migrationsdata saknas för denna art vad gäller exakta ankomst- och avgångsdatum
    för Skandinavien.'
  en: '# Greater Scaup Migration in Scandinavia


    The greater scaup is a summer breeding visitor to Scandinavia, arriving to breed
    during the summer months across Iceland, Scandinavia, and into northern Russia
    and Siberia. These diving ducks utilize freshwater lakes and coastal wetlands
    during the breeding season. As autumn approaches, populations begin their migration
    southward, abandoning Scandinavian breeding grounds for coastal wintering areas
    across Europe. The species spends the winter months on coastal waters of Europe,
    where ice-free conditions provide access to food resources. Return migration to
    northern breeding grounds occurs in spring as temperatures rise and ice begins
    to break up on northern freshwater systems.'
