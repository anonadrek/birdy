description:
  sv: '# Rödhuvad dykand


    Rödhuvad dykand är en dykande andart som tillhör familjen egentliga andfåglar.
    Den är känd för sitt karakteristiska utseende med en röd huvud- och halskropp
    som kontrasterar mot mörkare partier. Det är en kraftigt byggd fågel anpassad
    för att dyka efter föda i vattnet.


    Arten förekommer fläckvis i Europa och sträcker sig österut till Centralasien.
    Den är knuten till öppna eller vasskantade slättsjöar och vikar där den kan hitta
    lämpliga förhållanden för häckning och föda. Rödhuvad dykand är klassificerad
    som livskraftig av IUCN, vilket betyder att arten inte är hotad eller sårbar för
    närvarande.'
  en: '# Red-crested Pochard


    The red-crested pochard is a large diving duck found across a wide range from
    southern Europe through Central Asia to Mongolia. It inhabits lowland marshes
    and lakes, preferring steppe and semi-desert areas, particularly around the Black
    Sea region. The species is migratory, with northern populations wintering in north
    Africa, while others travel to the Indian subcontinent and Africa.


    This duck''s name derives from the golden-red colouring that distinguishes it
    from other pochards. Being a diving duck, it feeds by submerging underwater rather
    than dabbling at the surface. The species shows a preference for shallow wetland
    habitats where it can find aquatic vegetation and invertebrates.


    As a somewhat migratory species, the red-crested pochard follows seasonal patterns,
    with movements varying by population location. It is adapted to continental climates
    with distinct breeding and wintering periods, making it a regular visitor across
    its extensive range throughout Europe, Asia, and Africa.'
migration:
  sv: '# Rödhuvad dykand i Skandinavien och Nordeuropa


    Rödhuvad dykand är en irreguljär gäst i Skandinavien och övriga Nordeuropa. Arten
    häckar huvudsakligen längre söderut och österut i Europa, men förekommer sporadiskt
    norr om sitt normala utbredningsområde, särskilt under günstiga år. I Sverige
    observeras arten främst under hösten och vintern när några individer sprider sig
    norrut från sina övervintringsbiotoper längre söderut. Arten är ingen regelbunden
    övervintrare i Skandinavien utan förekommer främst som en sällsynt men återkommande
    tillfällig gäst.


    Källmaterialet innehåller dock begränsad specifik information om exakta ankomst-
    och avgångstider för denna art i Skandinavien/Nordeuropa. För detaljerad migrationsdata
    rekommenderas konsultation av omfattande regionala fågeldatabaser eller svenska
    ornitologiska källor.'
  en: '# Red-crested Pochard in Northern Europe


    The Red-crested Pochard is a rare and irregular visitor to Scandinavia and Northern
    Europe. While its main breeding range extends from southern Europe through the
    Black Sea region to Central Asia, northern populations are migratory and occasionally
    winter further south into North Africa. In recent decades, this species has shown
    increased vagrant occurrence in northern European countries, particularly during
    autumn migration and winter months, though it does not establish regular wintering
    populations in Scandinavia. Any sightings in the region typically represent individuals
    that have wandered northward from their usual Mediterranean or African wintering
    grounds.'
