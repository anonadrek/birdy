description:
  sv: '# Kricka


    Kricka är en av våra minsta andfåglar och tillhör gruppen simänder. Den förekommer
    vida spridd i Eurasien och är generellt vanlig. Det är en liten, smidig fågel
    som utanför häckningssäsongen kan samlas i stora, aktiva flockar på öppna vatten.


    Under häckningen söker krickan främst upp skyddade våtmarker. Det är en allätare
    som lever på frön och vattenlevande insekter. Fågeln är skicklig både på land
    och i vatten och rör sig behändigt mellan båda miljöerna.


    Även om arten globalt har ett livskraftigt bestånd, minskar antalet i Sverige
    märkbart. Sedan 2020 är krickan därför upptagen på Artdatabankens rödlista som
    sårbar art. Detta gör att observationer av arten blir allt mer värdefullt för
    dokumentationen av vår inhemska fågelfauna.'
  en: '# Green-winged Teal


    The green-winged teal is a small, agile duck found across northern regions. Males
    display striking plumage with a chestnut head marked by a distinctive green eye-stripe,
    contrasting sharply with a grey body and black-edged white breast. Females are
    more subdued, displaying mottled brown plumage. Both sexes show a small, neat
    profile compared to larger duck species, and in flight reveal a characteristic
    green speculum on the wing.


    This species is highly active and graceful, often seen in tight flocks that perform
    coordinated aerial maneuvers. It dabbles in shallow waters, readily tipping forward
    to feed on aquatic vegetation and invertebrates. The green-winged teal produces
    distinctive calls—males utter a clear, whistling sound while females make sharp
    quacking notes.


    The species breeds in northern areas, preferring open wetlands and marshes near
    water bodies. During migration and winter, it congregates in larger numbers on
    lakes, coastal bays, and sheltered water bodies. Its rapid wingbeats and swift,
    erratic flight make it challenging to follow visually. The green-winged teal remains
    common and widespread, making it a familiar sight to waterfowl observers throughout
    its range.'
migration:
  sv: '# Krickans förekomst i Skandinavien året runt


    Krickan är en regelbunden häckfågel i Skandinavien och Nordeuropa som anländer
    till sina häckningsområden under våren, vanligtvis i april-maj. Under häckningsperioden
    förekommer arten i skyddade våtmarker där den ruvar och uppfostrar sina ungar.
    Med hösten påbörjar krickorna sin dragning southward, och de flesta individer
    lämnar Skandinavien för att övervintra längre söderut i Västeuropa och omkring
    Medelhavet. Under denna tid kan arten bilda stora samlingsflockar. Ett mindre
    antal krickor stannar kvar eller återkommer redan på hösten om vädret och isläggningen
    tillåter det.'
