description:
  sv: '# Amerikansk bläsand


    Amerikansk bläsand är en simandfågel som utgör den nordamerikanska motsvarigheten
    till eurasisk bläsand. Det är en medelstor andart som tillhör familjen änder.


    Arten förekommer primärt i Nordamerika och kan ses på både sötvattens- och brackvattenhabitat.
    Amerikansk bläsand är en migrerande fågel som följer säsongsväxlingar, dock kan
    den påträffas i olika regioner beroende på årstid och väderförhållanden.


    För den intresserade fågelskådaren är denna art värd att lära känna, särskilt
    i sitt utbredningsområde där den kan observeras tillsammans med andra andarter
    vid olika vattendrag och våtmarker under lämpliga årstider.'
  en: "# American Wigeon\n\nThe American wigeon, also called the baldpate, is a dabbling\
    \ duck found across North America. It belongs to the genus Mareca, alongside other\
    \ wigeons, and serves as the New World equivalent of the Eurasian wigeon.\n\n\
    Male American wigeons are distinctive with their white foreheads and crowns, which\
    \ inspired the \"baldpate\" nickname. The head is predominantly green with a white\
    \ stripe running through the eye. The body displays a warm chestnut breast and\
    \ neck, contrasting with a pale grey back. Females are more subdued in coloration,\
    \ appearing greyish-brown overall. Both sexes show a characteristic pointed tail\
    \ and white belly.\n\nThese ducks are dabbling specialists, often seen tipping\
    \ forward in shallow water to feed on aquatic vegetation and seeds. They are notably\
    \ gregarious birds, frequently gathering in flocks, particularly during migration\
    \ and winter. American wigeons are also known for opportunistically stealing food\
    \ from diving ducks, a behaviour called kleptoparasitism. \n\nThe call is distinctive—males\
    \ produce a three-note whistle that sounds like \"whee-whoo-whee,\" while females\
    \ make harsh quacking sounds. They breed in prairie wetlands and marshes across\
    \ northern regions, and migrate to coastal and inland waterbodies for winter,\
    \ where they can be observed in mixed flocks with other duck species."
