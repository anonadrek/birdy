description:
  sv: '# Brunand


    Brunand är en medelstor dykand som kännetecknas av sitt karakteristiska utseende.
    Hanen är särskilt iögonfallande med rödbrun huvud, svart bröstkorg och grå rygg,
    medan honan är mer diskret brunaktig. Arten häckar i grunda vatten på låglänta
    områden och är förhållandevis tystlåten jämfört med många andra änder.


    Brunanden dykandes för att söka föda på botten, där den äter vattenväxter och
    småkryp. Under häckningstiden är arten beroende av näringsrika, grunda sjöar och
    träsk. På senare år har arten minskat dramatiskt och är nu listad som sårbar internationellt.
    I Sverige klassificeras den sedan 2020 som starkt hotad, vilket återspeglar en
    oroande utveckling för arten.


    Arten förekommer under höst- och vårflyttningen på olika vattendrag och sjöar,
    men kan även ses övervintrande på större vattenytor.'
  en: '# Common Pochard


    The common pochard is a medium-sized diving duck found across the Palearctic region.
    Males are striking with their chestnut-red head and neck contrasting sharply against
    a black breast and pale grey back, while females are duller brown overall with
    a lighter face patch. It is a true diving duck, submerging entirely to feed on
    aquatic vegetation and invertebrates rather than dabbling at the surface like
    some duck species.


    This duck breeds primarily in steppe regions of northern Europe and Siberia, favoring
    shallow lakes and marshes with abundant vegetation. During winter, it migrates
    southward and westward to milder regions, often gathering in large flocks on open
    water bodies. On water, it appears compact and sits quite low in the profile.
    The pochard is relatively quiet but produces soft grunting and whistling calls
    during breeding season.


    Breeding birds establish territories on freshwater wetlands with good vegetation
    cover, while wintering populations congregate on lakes, reservoirs, and coastal
    waters. The species is highly gregarious in winter, sometimes forming substantial
    flocks with other diving ducks, making it a familiar sight on suitable water bodies
    across much of Eurasia during the colder months.'
migration:
  sv: '# Brunand - Migration och förekomst i Nordeuropa


    Brunand är en flyttfågel som häckar i Palearktis under våren och försommaren.
    Arten förekommer i Sverige under häckningsperioden i grunda vatten, men exakt
    ankomst- och avgångstider framgår inte av tillgänglig källa. Som dykand är arten
    beroende av öppna vattenområden för sin överlevnad. Under senare år har bestånden
    minskat kraftigt i hela sitt utbredningsområde, vilket påverkar även förekomsterna
    i Skandinavien.


    Då brunanden klassificeras som en flyttfågel som häckar i norra Palearktis, antas
    den förlägga vintern på sydligare breddgrader, men specifik information om övervintringsplatser
    och exakta migrationstider för Skandinavien saknas i den tillhandahållna källtexten.'
  en: '# Common Pochard in Scandinavia and Northern Europe


    The common pochard is a migratory diving duck across Scandinavia and Northern
    Europe. It breeds primarily in steppe regions of Scandinavia during spring and
    summer months, typically arriving in April and May. The species winters farther
    south and west, vacating Scandinavian breeding grounds in autumn as temperatures
    drop. Migration occurs in autumn (September–October) when pochards depart northerly
    breeding areas, with populations moving toward milder wintering grounds in central
    and western Europe. Return migration to Scandinavian breeding territories begins
    in early spring as ice melts and water bodies become accessible again.'
