description:
  sv: '# Amerikansk kopparand


    Amerikansk kopparand är en liten, undersätsig dykand med karakteristiska styva
    stjärtfjädrar som ofta hålls upprätt. Hanen är omöjlig att misstas för: den har
    en vacker kopparröd dräkt, svart hjässa, vita kindpartier och en påfallande blå
    näbb. Honan är betydligt mer diskret i färgen med gråbrun dräkt och ett distinktivt
    streck på kinden.


    Arten simmar lågt i vattnet och dyker ofta för sin föda. Det är en ganska bullrig
    fågel med spännande ljud – honan producerar en snarande kallas och hanen olika
    pipande ljud, särskilt under häckningsperioden.


    Arten kommer ursprungligen från Nordamerika och Västindien, men har introducerats
    till Europa där den nu utgör ett allvarligt problem för bevarandet av den inhemska
    kopparanden genom hybridisering. Det vilda beståndet i Nordamerika minskar dock
    i antal, vilket utgör en växande bevaringsfråga för arten på sitt ursprungliga
    område.'
  en: '# Ruddy Duck


    The ruddy duck is a compact diving duck belonging to the stiff-tailed family,
    characterized by its distinctive rigid tail feathers held upright when swimming.
    Males display vibrant chestnut-red plumage on the body with a contrasting white
    face and black cap, while females are duller with brownish tones and a white cheek
    patch. It is a small, sturdy duck with a proportionally large head and short neck.


    This species is highly aquatic, spending most of its time on water where it dives
    expertly to feed on aquatic invertebrates and vegetation. It is often seen in
    small groups on lakes, ponds, and shallow coastal waters. The ruddy duck is native
    to the Americas, where it inhabits freshwater and brackish habitats across a wide
    range. It is notably silent outside the breeding season.


    The species gained notoriety in the mid-twentieth century when introduced populations
    established in Europe, particularly following escapes and releases from captivity.
    Outside its native range, the ruddy duck is now considered invasive and has prompted
    extensive eradication efforts in several countries to protect native wildfowl
    species and wetland ecosystems.'
migration:
  sv: '# Amerikansk kopparand - Utbredning i Skandinavien


    Migrationsdata saknas för denna art.


    Den amerikanska kopparanden är inte naturligt förekommande i Skandinavien eller
    Nordeuropa. Arten är ursprunglig från Nordamerika och Västindien, men har införts
    i Europa genom människans försorg. De europeiska populationer som finns är etablerade
    främst i södra och västra Europa och är inte migranter utan är istället stadiga
    eller delvis stadiga. I de få fall arten påträffas i nordiska länder rör det sig
    om enstaka individer eller flyktingar från västereuropeiska populationer, inte
    en återkommande eller regelbunden förekomst.'
