description:
  sv: ''
  en: '# Snow Goose


    The snow goose is a North American goose with two distinct colour forms. The white
    morph displays predominantly white plumage, which gives the species its name,
    while the dark morph—historically called the blue goose—shows darker plumage.
    Both forms may occur in the same population. The species belongs to the Anatidae
    family and was previously classified in its own genus but is now grouped with
    the gray geese in the genus Anser.


    Snow geese are medium-sized waterfowl with characteristic black wingtips visible
    in flight. They are highly gregarious birds, often seen in large flocks, particularly
    during migration. Their diet consists mainly of vegetation, and they favour wetland
    habitats including marshes, tundra, and agricultural areas. The species is known
    for its loud, distinctive honking calls, which become particularly vocal during
    flocking and flight.


    These geese undertake extensive migrations between their northern breeding grounds
    and wintering areas, making them conspicuous birds during passage periods. They
    are adaptable to various aquatic environments and have shown remarkable population
    recovery in recent decades, now numbering in the millions across North America.'
