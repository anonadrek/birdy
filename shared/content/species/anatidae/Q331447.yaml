description:
  sv: ''
  en: '# Marbled Duck


    The marbled duck is a medium-sized dabbling duck found across southern Europe,
    northern Africa, and western and central Asia. Its scientific name reflects its
    distinctive appearance: *Marmaronetta* refers to its marbled plumage pattern,
    while *angustirostris* describes its notably narrow bill—an adaptation that sets
    it apart from other ducks in its range.


    The species displays a subtle, mottled plumage throughout its body, giving it
    a soft, marbled appearance that provides excellent camouflage in shallow wetland
    habitats. Both sexes share similar pale, spotted plumage rather than the dramatic
    sexual dimorphism seen in many duck species. Its slender, pointed bill is particularly
    useful for dabbling and picking food from the water surface and margins.


    The marbled duck frequents shallow freshwater and brackish wetlands, including
    marshes, lagoons, and lake edges with emergent vegetation. It is generally a quiet
    species, less vocal than many ducks. It feeds by dabbling on shallow water and
    grazing on vegetation, often preferring to stay close to cover. The species is
    typically seen in small flocks or pairs, particularly during migration periods,
    though populations remain scattered and localized throughout its range.'
migration:
  sv: ''
  en: '# Marbled Duck in Northern Europe


    Migration data unavailable for this species.


    The marbled duck''s primary range extends across southern Europe, northern Africa,
    and western to central Asia, with no established populations in Scandinavia or
    Northern Europe. While vagrant individuals may occasionally appear during migration
    periods or dispersal events, this species does not form regular migratory populations
    through Scandinavian regions and should be considered a rare vagrant rather than
    a predictable seasonal visitor to northern European waters.'
