description:
  sv: ''
  en: '# Garganey


    The garganey is a small, elegant dabbling duck that breeds across much of Europe
    and the Palearctic region. It is highly migratory, with the entire population
    abandoning breeding areas each winter to migrate to Africa, India, Bangladesh,
    and Australasia, where it can form large flocks.


    In flight, the garganey is notably agile and distinctive, rising quickly from
    the water with a fast, twisting movement reminiscent of waders rather than typical
    ducks. This characteristic flight style makes it relatively easy to identify in
    action. The species prefers shallow wetland habitats where it can dabble for food.


    As a migratory species, the garganey''s presence is seasonal and largely dependent
    on local breeding and wintering ranges. Those in temperate regions will encounter
    this duck primarily during breeding season in spring and early summer, while winter
    sightings are unlikely in Northern Hemisphere locations outside of migration periods.
    Its small size and agile flight distinguish it from larger dabbling ducks in its
    range.'
migration:
  sv: ''
  en: '# Garganey Migration in Northern Europe


    The garganey is a strictly migratory species throughout Scandinavia and Northern
    Europe. Breeding birds arrive in spring, typically from April onwards, to establish
    populations across suitable wetland habitats. However, the entire Northern European
    population departs during autumn migration, with birds leaving by September to
    early October. The species winters entirely in Africa, India, Bangladesh, and
    Australasia, making it an obligate long-distance migrant that completely vacates
    the region during winter months. This complete absence during winter distinguishes
    the garganey from more resident dabbling duck species in the region.'
