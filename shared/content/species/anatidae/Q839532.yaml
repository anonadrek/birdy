description:
  sv: '# Bomullsdvärgand


    Bomullsdvärgand är en av världens minsta änder, med ett kompakt byggd och rundad
    kroppsform. Hanen är särskilt vacker med sin vita hals och övre bröst, medan huvud
    och rygg är glansigt gröna. Honan är mer diskret med gråbrun färgteckning. Båda
    könen har små röda prickar runt ögat och en kort, smal näbb anpassad för att plocka
    föda från växter.


    Arten förknippas med stillastående sötvattensvåtmarker där det finns riklig vegetation
    och vattenväxter. Bomullsdvärgandar är ofta relativt tama och kan ses i mindre
    flockar. De är dykande änder som söker sitt foder under vattenytan, där de äter
    växtdelar, frön och små vattenlevande djur.


    Arten är utbredd över stora delar av Asien och är talrik på sina habitater. Populationen
    tros öka, vilket tyder på att arten anpassar sig väl till sitt naturliga miljö
    och möjliga förändringar i denna.'
  en: '# Cotton Pygmy Goose


    The cotton pygmy goose is among the world''s smallest waterfowl, a diminutive
    perching duck adapted to life among aquatic vegetation. Its compact size and ability
    to roost and nest in trees distinguish it from larger duck species. The plumage
    includes distinctive white markings, particularly on the flight feathers, giving
    rise to the alternative name "white-quilled pygmy goose" in some regions.


    These ducks favour waterbodies of varying sizes where emergent and floating vegetation
    provides shelter and food. They are typically encountered in pairs or loose flocks,
    and despite their small stature, they are accomplished fliers capable of considerable
    dispersal, especially during winter months. Their breeding season aligns with
    local rainfall patterns, ensuring adequate resources for raising young.


    Cotton pygmy geese occupy a broad range across Asian and Southeast Asian wetlands,
    extending to northern Australia. Their preference for vegetated wetlands and arboreal
    roosting habits makes them well-adapted to diverse freshwater environments, from
    small ponds to extensive lake systems. Their wide dispersal range and habitat
    flexibility have enabled them to thrive across this extensive geographical distribution.'
