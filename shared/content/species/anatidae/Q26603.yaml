description:
  sv: '# Mindre sångsvan


    Mindre sångsvan är en medlem av svanfamiljen och en mindre version av sin närmare
    släkting sångsvanen. Det karakteriseras av en kortare hals och mindre gult på
    näbben jämfört med sångsvanen. Arten är vitfärgad och elegant, väl anpassad för
    sitt arktiska liv.


    Arten häckar cirkumpolärt på arktisk tundra i norra Ryssland och norra Nordamerika.
    Det är en vattenlevande art som förekommer på sjöar, lagöner och våtmarker under
    häckningssäsongen. Mindre sångsvan är klassificerad som livskraftig och dess population
    anses stabil.'
  en: ''
migration:
  sv: '# Mindre sångsvan – Förekomst i Skandinavien/Nordeuropa


    Mindre sångsvan är en sällsynt besökare i Skandinavien och Nordeuropa. Arten häckar
    på arktisk tundra långt norr om regionen och genomför långväga migrationskörningar
    mellan sina häckningsplatser och övervintringsområden. I nordeuropeisk kontext
    förekommer arten främst under hösten och våren som genomflyttare, när individer
    passerar genom området på väg mellan arktiska häckningsområden och sydligare övervintringsplatser.
    Observationer är sporadiska och arten är inte en regelbunden växtsäsongbesökare
    i området.'
  en: ''
