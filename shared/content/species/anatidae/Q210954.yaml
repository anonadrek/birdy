description:
  sv: '# Alförrädare


    Alförrädare är en liten ejder från en egen släkt och är väl anpassad för höga
    nordliga breddgrader. Det är en flyttfågel som häckar längs Norra ishavets kuster
    och övervintrar huvudsakligen i isfria vatten vid Berings hav och nedåt längs
    Stilla havskusten. En mindre andel av populationen övervintrar vid norra Europas
    kuster och i Östersjön.


    Arten är utpräglad högarktisk och förekommer endast i de kallaste maritima miljöerna.
    Under häckningsperioden återfinns det längs kusterna mellan stora arktiska halvöar
    och Alaska, medan det under vinterhalvåret samlas i större eller mindre mängder
    vid kusterna från Berings område söderut. En liten del av populationen stannar
    året runt eller översomrar på särskilda platser utan att häcka.


    Alförrädaren är starkt knuten till havet och representerar en specialiserad andfågel
    mycket väl lämpad för arctisk miljö och kallt vatten.'
  en: ''
migration:
  sv: '# Alförrädare – förekomst i Skandinavien och Nordeuropa


    Alförrädaren är en högarktisk flyttfågel som endast förekommer regelbundet i nordligaste
    Skandinavien. En mindre population övervintrar längs norra Norges kuster och i
    nordöstra Östersjön, medan en ännu mindre del av arten översomrar vid Varangerhalvön
    utan att häcka. Arten häckar långt norrut vid Norra ishavets kuster mellan Tajmyrhalvön
    och norra Alaska. Huvuddelen av populationen övervintrar i isfria vatten från
    Berings sund längs Stillahavskusten till södra Alaska och vidare söderut mot norra
    Japan. För observatörer i Norge och Sverige är arten endast sporadisk, främst
    under vinter- och övergångssäsongerna.'
  en: ''
