description:
  sv: ''
  en: '# Barrow''s Goldeneye


    Barrow''s goldeneye is a medium-sized sea duck with a distinctive bulbous head
    shape, from which its genus name derives (meaning "bullheaded" in Ancient Greek).
    Males display striking black and white plumage with iridescent dark head markings,
    while females are more subdued in grey and brown tones. The species is closely
    related to the common goldeneye, though it can be distinguished by its larger
    head profile and specific plumage patterns.


    These diving ducks are typically found in northern freshwater and coastal habitats,
    preferring clear, cold waters where they hunt for aquatic invertebrates and small
    fish. They are strong, agile fliers and spend much time on water, diving to forage
    on the lake or sea bed. The species is known for its rapid, whirring wingbeats
    in flight and produces various vocalizations, particularly during breeding season.


    Barrow''s goldeneye breeds in northern regions and migrates to coastal areas during
    winter months, though some populations remain year-round in suitable habitat.
    They are generally wary birds but can be observed in small groups or larger flocks,
    particularly during migration periods.'
