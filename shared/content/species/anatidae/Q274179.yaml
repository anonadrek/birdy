description:
  sv: '# Nilgås


    Nilgås är en stor afrikansk andfågel som tillhör samma släkte som gravänderna.
    Det är den enda nu levande arten i sitt släkte, Alopochen. Arten har på senare
    tid etablerat sig i Europa, där det betraktas som en invasiv art, medan det globalt
    sett minskar i antal.


    Nilgåsen är en stor fågel med karakteristiska drag som skiljer det från andra
    andfåglar. Arten föredrar områden nära vatten och är känd för att visa aggressiv
    territorialbeteende, särskilt under häckningstiden. Det är en relativt vocal fågel
    som ger ifrån sig olika lud när det kommunicerar med sina artfränder.


    Arten återfinns i Afrika, men har etablerat bestånd i Europa under senare år.
    Det är främst att hitta på öppna våtmarker, sjöar och älvar med omgivande gräsmark,
    där det kan föda sig och hålla till.'
  en: '# Egyptian Goose


    The Egyptian goose is a distinctive member of the duck and goose family, native
    to Africa but now found on several continents due to its popularity as an ornamental
    bird. It has been widely introduced to Europe, the United States, and other regions
    outside its original range. The species holds cultural significance, having been
    frequently depicted in ancient Egyptian art.


    This adaptable waterfowl inhabits various wetland environments including lakes,
    rivers, and marshes. Like other geese, it is a gregarious species, often seen
    in small to large flocks. The Egyptian goose has established feral populations
    in introduced ranges, where it can be observed year-round in suitable habitats.
    Its spread beyond Africa demonstrates the species'' ability to thrive in diverse
    environments, making it increasingly common in parks, wetland reserves, and coastal
    areas where it was deliberately released or escaped from captivity.'
migration:
  sv: 'Migrationsdata saknas för denna art.


    **Förklaring:** Källtexten innehåller endast information om att nilgåsen är en
    afrikansk andfågel som nyligen etablerat sig i Europa och klassificeras som invasiv,
    men presenterar ingen faktisk migrationsdata angående påkomst, avgång, eller övervintring
    i Skandinavien eller Nordeuropa.'
  en: '# Egyptian Goose (Alopochen aegyptiaca) in Scandinavia/Northern Europe


    The Egyptian Goose is not naturally occurring in Scandinavia or Northern Europe.
    This African waterfowl species has been introduced to Europe primarily through
    the ornamental bird trade, but it remains an exotic vagrant rather than an established
    migratory or resident population in the Nordic region. Any sightings in Scandinavia
    would represent escaped or feral individuals from captive populations in southern
    Europe, rather than natural range expansion or migration. The species is fundamentally
    adapted to African wetlands and lacks the migratory patterns typical of northern
    European waterfowl.'
