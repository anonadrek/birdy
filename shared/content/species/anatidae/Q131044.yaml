description:
  sv: '# Svart svan


    Svart svan är en stor och iögonfallande andfågel från Australien. Den kännetecknas
    av sitt helsvarta fjäderdräkt och röda näbb, vilket gör arten lätt att identifiera.
    Det är en elegant fågel med långt, krökt hals och kraftig kropp.


    Arten förekommer naturligt i Australien men har via människans försorg etablerat
    sig på många andra platser runt om i världen, där den bildat friflygande populationer.
    Svart svan är ofta social och kan ses i mindre eller större flockar, särskilt
    på större vattensamlingar där den förekommer. Arten är väl anpassad till sitt
    vattenhabitat och tillbringar mycket tid på vattnet.


    Beståndet anses vara livskraftigt och arten utgör ingen hotad eller sårbar population.
    Den har visat god förmåga att etablera sig i nya miljöer och har därmed blivit
    en välbekant fågel även långt från sitt ursprungliga utbredningsområde.'
  en: '# Black Swan


    The black swan is a large waterbird instantly recognizable by its entirely black
    plumage and distinctive red bill. It is a substantial species within the swan
    family, built for life on lakes, rivers, and coastal waters.


    This species exhibits nomadic behaviour across its range, with migration patterns
    that vary unpredictably depending on local climatic conditions. It is monogamous,
    and pairs work together to incubate eggs and raise their young. Both partners
    share equally in these breeding responsibilities, demonstrating strong pair bonds.


    The black swan inhabits waterways in the southeast and southwest regions of its
    range, where it can be encountered on both freshwater and brackish water bodies.
    Its striking appearance and graceful swimming make it a conspicuous waterbird
    where it occurs.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: '# Black Swan in Northern Europe


    Migration data unavailable for this species.


    The Black Swan is a native Australian species with no established natural occurrence
    in Scandinavia or Northern Europe. While occasional vagrants have been recorded
    in European waters, these represent rare dispersals rather than regular migration
    patterns. The species does not have a predictable presence in the region and should
    not be expected during any season in Northern European waters.'
