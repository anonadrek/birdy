description:
  sv: '# Vitkindad gås


    Vitkindad gås är en kompakt gås med karakteristisk fjäderdräkt i svart, vit och
    grå. Den har en ganska kort hals och är mindre än många andra gåsarter. Huvudet
    är vitt med svart på hjässa och nacke, medan halsen och bröstet är svart. Ryggen
    är grå med svarta fjädrar, och den vita stjärten är väl synlig under flykt.


    Det är en flyttfågel som häckar i Arktis men som sedan 1970-talet även förekommer
    på vissa platser i Skandinavien. Den söker sig till küstbundna miljöer för häckning,
    där den trivs på klipphyllor, gräsiga stränder, låga öar och flacka sandrevlar.
    Arten är växtätare och betar bland annat på vide och annan växtmaterial.


    Vitkindad gås är ofta en högljudd art med karakteristiska läten. Den påträffas
    framförallt längs kustområden och är en sociala fågel som ofta förekommer i flockar.'
  en: '# Barnacle Goose


    The barnacle goose is a striking black goose distinguished by its bold patterning
    of black and white plumage. Its face is predominantly white with a black cap and
    neck, while the back and wings are dark grey-black, creating a distinctive appearance
    that sets it apart from other goose species. The bird''s compact, relatively small
    size for a goose makes it recognizable in mixed flocks.


    This species is highly social and typically found in groups, ranging from small
    gatherings to large flocks, particularly during migration and winter. Barnacle
    geese favor open grassland and coastal habitats where they can graze on vegetation.
    They are vocal birds with a distinctive barking call that sounds somewhat like
    a dog''s bark, which helps identify them in the field.


    Genetically, the barnacle goose is most closely related to the cackling goose,
    despite superficial similarities to the brant goose. The species belongs to Branta,
    a genus of black geese characterized by extensive black in their plumage, distinguishing
    them clearly from the grey Anser geese. Barnacle geese are migratory, moving seasonally
    between breeding grounds in the north and wintering areas, where they gather in
    substantial numbers.'
migration:
  sv: '# Vitkindad gås – förekomst i Skandinavien


    Vitkindad gås är en flyttfågel som traditionellt häckar i Arktis, men sedan 1970-talet
    har arten etablerat sig även på vissa platser i Skandinavien. Under häckningstiden
    uppehåller sig fågeln i nära anslutning till kusten och förekommer i varierade
    biotoper som klipphyllor, gräsiga stränder, låga öar och flacka sandrevlar.


    Migrationsdata saknas för denna art.'
  en: '# Barnacle Goose in Northern Europe


    The Barnacle Goose is a migratory species that winters in Scandinavia and northern
    Europe, with populations following specific migration routes. Birds arrive in
    autumn, typically from September onwards, staging in Scotland and Denmark before
    moving south to wintering grounds in the Netherlands, Germany, and southern Scandinavia.
    Some populations winter in coastal areas of Norway and Sweden. Spring migration
    occurs from February through April, as geese return northward to their Arctic
    breeding grounds in Greenland, Svalbard, and Russia. Peak presence in Scandinavian
    regions occurs during autumn and spring passage periods, with numbers varying
    annually depending on weather conditions and food availability.'
