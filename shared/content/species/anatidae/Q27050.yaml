description:
  sv: '# Prutgås


    Prutgås är en liten gås som tillhör familjen egentliga andfåglar. Arten häckar
    i arktiska områden på både kontinenter och är känd för sina långa migrations­resor.
    Under vintermånaderna söker den sig till kusterna vid större hav för att föda
    sig.


    Prutgåsen är betydligt mindre än större gåsarter och kännetecknas av sitt mörka
    fjäderdräkt. Den trivs väl i öppna, kustnära miljöer där den kan hitta föda bland
    alger och vattenväxter. Arten är socialt lagd och ses ofta i mindre eller större
    flockar, särskilt under flyttningen mellan häcknings­ och övervintringsområdena.


    Idag betraktas prutgåsen som en livskraftig art med stabila populationer enligt
    IUCN:s klassificering. Arten är väl anpassad till sitt speciella liv mellan arktiska
    häckningsplatser och kustnära övervintringsområden runt världens större hav.'
  en: '# Brant Goose


    The brant is a small, dark goose with a distinctive appearance that makes it easily
    recognizable. It features a blackish head and neck with a characteristic white
    patch on the lower neck, contrasting sharply with its grey-brown body and white
    undertail coverts. The species is noticeably smaller and more compact than most
    other geese, making it well-suited to its coastal lifestyle.


    This goose is highly specialized for life along temperate sea-coasts, where it
    winters in substantial flocks. It feeds primarily on marine vegetation, particularly
    eelgrass and other coastal plants, making it unique among geese in its reliance
    on marine habitats. During breeding season, it undertakes impressive migrations
    to the high-Arctic tundra, where it nests in small colonies on sparse vegetation.


    The brant''s call is distinctive—a low, guttural "kronk" or "pruk" that carries
    across coastal waters and helps flocks maintain cohesion during flight. Three
    subspecies exist with slight variations in plumage and range, but all follow similar
    patterns of Arctic breeding and temperate-zone wintering along coastlines worldwide.'
migration:
  sv: '# Prutgås – Förekomst i Skandinavien och Nordeuropa


    Prutgås är en arktisk häckfågel som förekommer i Nordeuropa under migrationerna
    och vintern. Arten häckar i arktiska områden men drar sig söderut när vintern
    närmar sig. Under vintertid finns prutgåsen vid kusterna vid Nordsjön och Atlanten,
    vilket gör den till en regelbunden övervintrare och genomfågelgäst i skandinaviska
    och nordeuropeiska kustbälten. Ankomsten till området sker under höstmigration
    medan återgången till häckningsområdena i norr äger rum på våren.'
  en: '# Brant Goose Migration in Northern Europe


    The Brant Goose is a migratory species that winters along temperate coastal waters
    and breeds on high-Arctic tundra. In Scandinavia and Northern Europe, it is primarily
    a passage migrant and winter visitor. Populations arrive in autumn (September–October)
    from their Arctic breeding grounds, utilizing coastal areas and estuaries as key
    feeding and resting sites during migration. Winter populations concentrate along
    northern European coasts, particularly around Denmark, the Wadden Sea, and similar
    shallow coastal habitats where eelgrass and other marine vegetation provide essential
    food sources. Spring departure occurs in March–April as birds return northward
    to their breeding territories on Arctic tundra in Greenland, Svalbard, and northern
    Russia.'
