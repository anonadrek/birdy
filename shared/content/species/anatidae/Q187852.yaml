description:
  sv: '# Rödhalsad gås


    Rödhalsad gås är en mindre gåsart som häckar på den palearktiska tundran. Det
    är en flyttfågel där huvuddelen av världspopulationen övervintrar på låglanden
    i Rumänien och Bulgarien. Arten har en karakteristisk utseende med röd bröst och
    hals, vilket ger den sitt svenska namn.


    Arten är känd för sin migratory livscykel och är anpassad för att leva i öppna,
    gräsbevuxna miljöer. Det förekommer i större flockformationer, särskilt under
    vinter och under flyttningen mellan häcknings- och övervintringsområden.


    Rödhalsad gås kategoriseras som sårbar då populationen har minskat kraftigt under
    en kort tidsperiod. Denna nedgång gör arten till en fokusart för naturvårdande
    insatser och internationellt samarbete.'
  en: '# Red-breasted Goose


    The red-breasted goose is a striking and distinctly marked member of the goose
    family, native to Eurasian regions. It belongs to the genus Branta, which comprises
    several dark-plumaged goose species. This species is currently listed as vulnerable
    by conservation authorities, reflecting concerns about its population status.


    The red-breasted goose is notable for its bold and contrasting plumage pattern,
    which makes it highly recognizable among goose species. Its appearance is characterized
    by bright markings that distinguish it from other geese in its range. Like other
    Branta geese, it occupies open habitats and exhibits typical goose behaviour,
    including gregarious feeding and migration patterns.


    Due to its vulnerable conservation status, the species warrants attention from
    birdwatchers and conservationists. Further information about its specific calls,
    preferred habitats, and seasonal movements would enhance understanding of this
    distinctive goose species.'
migration:
  sv: '# Rödhalsad gås – Förekomst i Norden


    Rödhalsad gås är en flyttfågel som huvudsakligen förekommer i Skandinavien och
    Nordeuropa under genomflyttningsperioderna. Arten häckar på den palearktiska tundran
    längre österut och är endast en irregular besökare i norra Europa under vår och
    höst. Huvuddelen av världspopulationen övervintrar på låglanden i Rumänien och
    Bulgarien, varför arten endast passerar genom eller förekommer sporadiskt i Skandinavien
    under migrationen mellan häckningsområdena och övervintringsplatserna. Observationer
    i Sverige och övriga Norden är därför relativt sällsynta.'
  en: '# Red-breasted Goose in Scandinavia/Northern Europe


    The red-breasted goose is a rare vagrant to Scandinavia and Northern Europe, with
    no established regular migration pattern through the region. This species breeds
    in Arctic Siberia and winters primarily in the Black Sea and Caspian Sea regions.
    Occasional individuals or small groups may appear in Scandinavia during migration
    periods or winter, typically as rare records rather than predictable occurrences.
    When present, they are most likely to be observed in coastal areas or wetlands
    during autumn and winter months.


    The species does not have a consistent seasonal presence in Northern Europe, and
    sightings should be considered exceptional rather than routine. Any records in
    Scandinavian countries are generally documented as vagrants displaced from their
    normal migration routes.'
