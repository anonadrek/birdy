description:
  sv: '# Springhöna


    Springhöna är den mest utbredda arten inom familjen springhöns. Denna lilla fågel
    tillhör ordningen vadarfåglar trots sitt likartade utseende med hönsfåglar, vilket
    längre tid var oklart. Arten är möjligen utdöd i Europa och förekommer huvudsakligen
    i värmare regioner.


    Springhöna är en mycket liten och väl dold fågel som föredrar öppna, grässatta
    biotoper och tidiga snår. Det är en mycket krypande fågel som sällan flyger på
    längre sträckor och föredrar att springa undan när det hotas. Arten är främst
    aktiv på natten och tidig morgon när den söker föda bestående av frön och små
    ryggradslösa djur.'
  en: '# Common Buttonquail


    The common buttonquail is a small, quail-like bird belonging to the buttonquail
    family, though it is not closely related to true quails despite their similar
    appearance. It is also known by the names Kurrichane buttonquail and Andalusian
    hemipode, reflecting its distribution across different regions.


    This diminutive bird is cryptic and difficult to observe in the field. It inhabits
    grasslands and scrubby areas, preferring dense vegetation where it can move about
    on the ground with ease. The species is primarily terrestrial, spending most of
    its time foraging among grasses and low vegetation rather than taking to flight.


    The common buttonquail is more often heard than seen. Its distinctive call is
    a characteristic feature that aids identification, particularly during breeding
    season. The bird''s secretive nature and preference for remaining hidden in vegetation
    make it a challenging species for birdwatchers to locate, even in areas where
    it is relatively common. Its small size and cryptic plumage provide excellent
    camouflage in its preferred habitat.'
