description:
  sv: '# Ladusvala


    Ladusvala är en elegant och lätt igenkännbar fågel som tillhör svalorfamiljen.
    Den karakteriseras av sin blå ovansida, långstrackad silhuett och framför allt
    sin långt kluvna stjärt, som är mycket karakteristisk för arten. Vingarna är böjda
    och spetsiga, vilket ger fågeln en behändig flygstil. Ladusvalan är den mest spridda
    arten inom svalornas familj och förekommer på flera kontinenter.


    Arten är en aktiv jägare som fångar småinsekter under flykten med imponerande
    manövreringsförmåga. Ladusvalan ses ofta flyga lågt över öppna områden och nära
    människor. Den är känd för sitt glada, tjittrande läte och sina korta, skarpna
    rop. Arten är en långdistansflyttare och återvänder regelbundet till samma häckningsområden
    år efter år, där den bygger boar av lera.'
  en: '# Barn Swallow


    The barn swallow is the world''s most widespread swallow species, found on every
    continent and occasionally reported even in Antarctica. It is unmistakable in
    appearance, with glossy blue-black upperparts contrasting sharply with its buff-white
    underparts. Its most striking feature is the long, deeply forked tail, which it
    uses with remarkable agility when hunting insects in flight. The bird is highly
    acrobatic, sweeping through the air with elegant, darting movements to catch prey.


    These birds are highly vocal and social, often gathering in large flocks, particularly
    during migration. Their call is a cheerful, twittering song, frequently heard
    as they dart overhead. Barn swallows are strongly associated with human habitation,
    nesting in buildings, barns, and other structures where they construct mud nests.


    The species occurs in open and semi-open country worldwide, particularly near
    water sources and farmland where insects are abundant. It is a long-distance migrant
    in many regions, with populations shifting seasonally between breeding and wintering
    grounds.'
migration:
  sv: '# Ladusvala (Hirundo rustica) - Migration och förekomst i Nordeuropa


    Ladusvalan är en långdistansfågel som är en klassisk sommargäst i Skandinavien
    och Nordeuropa. Arten anländer under våren, vanligtvis från april till maj, efter
    att ha övervintrat i Afrika söder om Sahara. Under sommarmånaderna (juni-augusti)
    häckar ladusvalan utbrett över hela regionen, där den använder människans byggnader
    som häckningsplatser. I hösten, från augusti till september, börjar återflyttningen
    söderut när ungfåglarna är flygga, och arten är då helt frånvarande under vintermånaderna.'
  en: '# Barn Swallow Migration in Northern Europe


    The barn swallow is a long-distance migratory species in Scandinavia and northern
    Europe, arriving in spring (typically April-May) to breed throughout the region.
    Birds depart in late summer and early autumn (August-September), undertaking extensive
    migrations to sub-Saharan Africa where they overwinter. The species is entirely
    absent during winter months, with populations returning annually to breed in farmland,
    villages, and open habitats near water. Some variation occurs in arrival and departure
    dates depending on spring weather conditions and geographic location within Scandinavia.'
