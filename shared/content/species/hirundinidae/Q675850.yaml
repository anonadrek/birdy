description:
  sv: ''
  en: '# Brown-throated Martin


    The brown-throated martin is a small passerine belonging to the swallow family,
    widely distributed across Africa. This aerial insectivore shares characteristics
    typical of martins, catching insects in flight with impressive agility. Its plumage
    is relatively plain compared to some swallow species, with brown tones dominating
    its appearance, particularly on the throat—a feature that gives the species its
    distinctive common name.


    Little detailed information is available in standard references about the brown-throated
    martin''s specific calls and vocalizations, though like other martins it likely
    produces chirping and twittering sounds during flight and social interactions.
    It favours open habitats and airspace where it can hunt insects efficiently.


    The species was historically classified with both the grey-throated martin and
    the Madagascar martin as a single species, but taxonomic revision has recognized
    them as distinct. The brown-throated martin remains a common sight across suitable
    African habitats, though it is often overlooked due to its inconspicuous appearance
    and aerial habits.'
migration:
  sv: ''
  en: '# Brown-throated Martin in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Brown-throated Martin is a small African swallow with a wide distribution
    across the African continent. It does not naturally occur in Scandinavia or Northern
    Europe, and therefore no information regarding its migration patterns, overwintering
    behavior, or seasonal arrival in these regions can be provided. This species remains
    endemic to Africa year-round.'
