description:
  sv: '# Klippsvala


    Klippsvala är en liten svala som häckar i bergsområden från södra Europa till
    södra Asien. Arten är en skicklig flygare som ofta ses sväva längs klippväggar
    och byggnader. Det är övervägande en stannfågel i södra Europa, men populationer
    från norrare områden och från Asien är flyttfåglar som övervintrar söder om sitt
    häckningsområde.


    Arten bygger sitt bo under utskjutande klippor eller på byggnader, vilket blir
    allt vanligare. Klippsvalor är sociala fåglar som ofta ses i mindre flockgrupper,
    särskilt under flyttningstiden. De är anpassade för livet nära bergsväggar och
    urbana miljöer, där de hittar lämpliga platser för sina nästen.'
  en: '# Eurasian Crag Martin


    The Eurasian crag martin is a small swallow about 14 cm long, characterized by
    ash-brown upperparts contrasting with paler underparts. Its most distinctive feature
    is a short, square tail decorated with white patches visible on most feathers—brighter
    and more prominent than in closely related species. It also shows a different
    plumage tone compared to the three other species in its genus, making identification
    easier once this combination is learned.


    This species inhabits mountainous regions, where it breeds across southern Europe,
    northwestern Africa, and throughout the Palearctic zone. Behaviour typical of
    swallows—hunting insects in flight and utilizing cliff faces for nesting—characterizes
    this bird. Movement patterns vary by population: many European birds are resident
    year-round, while northern European populations and most Asian breeders migrate
    seasonally, dispersing to wintering grounds in northern Africa, the Middle East,
    or India.


    The crag martin''s preference for rocky, mountainous terrain distinguishes it
    from many other swallow species that favour open country or human habitation.'
migration:
  sv: '# Klippsvala – Förekomst i Skandinavien och Nordeuropa


    Klippsvala är en mycket sällsynt fågel i Skandinavien och Nordeuropa. Arten häckar
    huvudsakligen i södra Europa, och endast vissa nordliga populationer är flyttfåglar.
    De europeiska häckfåglarna som förekommer längre söderut är till stor del stannfåglar.
    De populationer som är flyttfåglar övervintrar i norra Afrika och Mellanöstern.
    I Skandinavien och Nordeuropa är arten endast en ytterst sporadisk tillfällig
    gäst och förekommer inte regelbundet under någon årstid.'
  en: '# Eurasian Crag Martin in Northern Europe


    The Eurasian Crag Martin''s occurrence in Scandinavia and Northern Europe is limited
    and irregular. While the species breeds in southern European mountains and across
    the Palearctic region, it does not establish regular breeding populations in Scandinavia.
    Some northern European populations are migratory, wintering in northern Africa
    and the Middle East, though Asian breeding populations migrate to India. Scandinavian
    records of this species would be considered vagrant or accidental occurrences
    rather than regular seasonal visitors, as the species'' main range remains south
    of the Nordic region.'
