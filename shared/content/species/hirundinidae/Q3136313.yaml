description:
  sv: '# Blek backsvala


    Blek backsvala är en mindre svalart som tillhör familjen svalor. Arten förekommer
    i delar av Asien, där den är utbredd från Kazakstan och Pakistan österut till
    Kina. Under vintermånaderna är fågeln flyttfågel och söker sig till södra Asien,
    med enstaka observationer även längre västerut.


    Arten behandlades tidigare som en del av den närbesläktade backsvalan men betraktas
    numera som egen art. Beståndet anses vara livskraftigt och arten utgör inte något
    bevarandeproblem.'
  en: ''
