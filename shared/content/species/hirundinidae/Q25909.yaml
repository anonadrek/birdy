description:
  sv: '# Backsvala


    Backsvalan är en liten, kolonihäckande svala med brungrå ovansida och vit undersida.
    Det är en behändig flygare som är väl anpassad för att jaga småinsekter i luften.
    Arten är utbredd över stora delar av norra halvklotet under häckningstiden och
    söker upp öppna landskap nära vatten där det finns lämpliga gräv­ningsplatser.


    Under hösten drar backsvalorna långt söderut för att övervinta i tropiska områden
    på södra halvklotet. Arten förekommer ofta i mindre eller större flockar, särskilt
    under flyttningen. Det globala beståndet anses livskraftigt, även om antalet individer
    minskar på många håll. Backsvalorna är lätta att känna igen på sina snabba, vingslag
    och karakteristiska flygteknik när de skär genom luften efter sitt fångade byte.'
  en: '# Sand Martin


    The sand martin is a small, migratory swallow with a distinctive appearance: brownish-grey
    upperparts and white underparts, with a characteristic dark band across the breast.
    It is noticeably slighter and shorter-winged than other swallows, giving it a
    more compact silhouette in flight. Despite its small size, it is an agile aerial
    hunter, darting swiftly after small insects with quick, erratic movements.


    These birds are highly social and colonial, often nesting in large groups within
    sandbanks and earthen cliffs where they excavate burrows. The sand martin''s call
    is a distinctive, dry, chattering note delivered in flight, quite different from
    the melodious song of some swallow relatives. Its behaviour is restless and energetic,
    constantly twittering as it hunts above water and open ground.


    The sand martin is a long-distance migrant with an enormous range. During summer,
    it breeds across the Northern Hemisphere from Europe eastward through Asia to
    the Pacific and throughout North America. In winter, populations retreat to Africa,
    southern Asia, and South America. It favours open country near water—lakes, rivers,
    and marshes—where it can hunt efficiently for flying insects. Its arrival in spring
    is often one of the earliest signs of the breeding season.'
migration:
  sv: '# Backsvala (Riparia riparia)


    Backsvalan är en långdistansmigrant som återvänder till Skandinavien och Nordeuropa
    under våren för att häcka. Arten anländer typiskt från april till maj efter övervintringen
    i tropiska områden på Afrikas södra delar. Under häckningsperioden från maj till
    augusti koloniserar backsvalorna sandiga bränningar vid vattendrag där de gräver
    sina bohål. I augusti och september börjar fåglar att samlas innan den långa höstmigrationen
    sätter igång mot de afrikanska övervintringsområdena. Arten är helt migrerande
    i norra Europa och förekommer inte under vintermånaderna.'
  en: '# Sand Martin (Riparia riparia) in Scandinavia/Northern Europe


    The sand martin is a summer visitor to Scandinavia and northern Europe, arriving
    in spring to breed across the region''s suitable habitats. These highly migratory
    birds winter in Africa, southern Asia, and South America, returning northward
    as temperatures warm. They typically arrive in late April to May and depart again
    in August through September during their southbound migration. The species breeds
    throughout the Holarctic region during summer months, making it a familiar sight
    near water bodies and sandy banks where they nest colonially. Their presence is
    strictly seasonal, with no individuals overwintering in northern European regions.'
