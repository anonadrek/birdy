description:
  sv: '# Hjälmpärlhöna


    Hjälmpärlhöna är en karakteristisk flocklevande hönsfågel som förekommer vilt
    över stora delar av Afrika söder om Sahara. Arten är också etablerad som domesticerad
    fågel i många delar av världen, särskilt i Frankrike och andra västerländska länder.


    Hjälmpärlhönan är en medelstor hönsfågel med en distinktiv utseende. Kroppen är
    överväxd med små vita prickar på mörk botten, vilket ger den ett karakteristiskt
    pärlaktigt utseende. Huvudet är relativt litet och naket, med en välvd hjälmliknande
    utväxt på hjässan – därav namnet.


    Som flocklevande fågel rör sig hjälmpärlhönan gärna tillsammans med andra individer
    och föredrar att söka föda på marken. Det är en aktiv fågel som ofta går och pickar
    efter olika födan. Arten är känd för sitt högljudda beteende – både vilda och
    domesticerade individer producerar karakteristiska, högljudda ljud som kan höras
    från större avstånd.'
  en: '# Helmeted Guineafowl


    The Helmeted Guineafowl is the most recognizable member of the guinea fowl family
    and the sole species in its genus. It is native to Africa, primarily in regions
    south of the Sahara Desert. The bird has been extensively introduced worldwide
    as a domesticated species, now found in the West Indies, North America, Colombia,
    Brazil, Australia, and Europe.


    The species is notable for its distinctive bare head topped with a prominent bony
    helmet-like casque, which gives it its common name. Its plumage is dark with white
    spots covering most of the body, creating a characteristic speckled appearance.
    These medium-sized birds are highly social and often seen in small flocks moving
    across open and semi-open habitats.


    Helmeted Guineafowl are known for their loud, distinctive calls—a harsh, repetitive
    cackling that carries across considerable distances. They are ground-feeders,
    foraging for seeds, insects, and vegetation. While native to African savannas
    and grasslands, introduced populations have adapted to various environments, often
    becoming established in farmland and open woodland areas where they roost in trees
    at night for protection.'
