description:
  sv: '# Dominikaneränka


    Dominikaneränka är en iögonfallande svartvit fågel där hanen är särskilt anmärkningsvärd
    för sina dramatiskt förlängda stjärtfjädrar. Denna fågel tillhör familjen änkor
    och är en av många arter inom denna grupp som är boparasiter – det vill säga att
    arten lägger sina ägg i andra fågels bon för att få dem att ta hand om ungarna.


    Arten förekommer naturligt i Afrika, men människan har introducerat den i flera
    andra världsdelar där den nu är etablerad. Dominikaneränkan är en medlem av ordningen
    tättingar och håller sig ofta i öppna och halvöppna habitat. De långa stjärtfjädrarna
    hos hanen spelar en viktig roll under parningen och görs väl synliga under flykt
    och baltsande.


    Som boparasit är dominikaneränkan helt beroende av värdarters villiga acceptans
    för att föröka sig, ett fascinerade exempel på hur vissa fåglar utvecklats för
    att utnyttja andra arternas föräldravård.'
  en: '# Pin-tailed Whydah


    The pin-tailed whydah is a small African songbird instantly recognizable by its
    extraordinary breeding plumage. Males in breeding condition display a dramatic
    long, needle-like tail that streams behind them in flight, creating a distinctive
    silhouette. The body is predominantly black and white, with the contrasting plumage
    making breeding males unmistakable. Non-breeding males and females lack the elongated
    tail and appear much more subdued in coloration.


    This species is found across much of Africa south of the Sahara, where it inhabits
    open grasslands and savanna regions. It is primarily a resident breeder throughout
    its range, remaining in suitable habitat year-round. The pin-tailed whydah is
    often observed in small flocks, particularly outside the breeding season, and
    it forages on the ground for seeds and insects.


    Like other whydahs, it is a brood parasite, laying its eggs in the nests of other
    bird species, primarily estrildid finches. The males are known for their conspicuous
    courtship displays, where they fly low over grassland with exaggerated wingbeats,
    showcasing their remarkable tail feathers to attract females.'
