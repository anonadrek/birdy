description:
  sv: '# Ökenpipare


    Ökenpipare är en liten vadarfågel som tillhör pipärsläktet. Den är en långdistansfågel
    som häckar från Turkiet österut till västra Kina. Under vintern sprider sig arten
    över ett stort område och förekommer då i östra Medelhavsområdet, Afrika, Asien
    och Australien.


    Arten påträffas endast tillfälligt i Europa och är mycket sällsynt i Sverige,
    där det hittills registrerats omkring 20 fynd. Ökenpiparen är klassificerad som
    livskraftig av IUCN och anses därför inte vara hotad.'
  en: '# Greater Sand Plover


    The Greater Sand Plover is a small wader belonging to the plover family. It is
    a compact, streamlined shorebird adapted for hunting on sandy and open ground
    habitats. The species was recently reclassified from the genus Charadrius to Anarhynchus,
    reflecting modern taxonomic understanding of plover relationships.


    Like other members of its genus, the Greater Sand Plover is an active forager,
    typically seen moving quickly across flat, sandy terrain where it hunts for small
    invertebrates. It often occurs in small flocks, particularly during migration
    and winter months. The species is highly mobile, ranging across multiple regions
    and varying its habitat use seasonally.


    Identifying features and specific behavioral details such as plumage patterns,
    size comparisons to similar species, vocalizations, and precise distribution patterns
    would benefit from consulting additional field guide sources. Amateurs interested
    in this species should note its preference for open, sandy environments and its
    restless, energetic foraging behavior characteristic of many plovers.'
migration:
  sv: '# Ökenpipare i Skandinavien/Nordeuropa


    Ökenpiparen är en mycket sällsynt gäst i Skandinavien och övriga Nordeuropa. Arten
    häckar i Asien och förekommer normalt inte i regionen under någon årstid. Dock
    påträffas den tillfälligt i Europa som en östlig strandgäst, och Sverige har dokumenterade
    fynd av arten. Dessa observationer är ovanliga och oregelbundna, varför arten
    inte utgör någon regelbunden del av Skandinaviens fågelfauna. De svenska funnen
    representerar således före detta spridning långt från artens normala utbredningsområde.'
