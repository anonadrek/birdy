description:
  sv: '# Ljungpipare


    Ljungpipare är en medelstor pipare som tillhör familjen pipare. Under häckningstiden
    bär den ett karakteristiskt guldgult fjäderdräkt med svarta partier på undersidan
    och ansiktet, medan den på hösten blir mer gråbrun och diskret. Fågeln är en skicklig
    löpare som ofta ses gå på marken eller stå stilla och lyssna efter bytesdjur.


    Ljungpiparen häckar på öppna, lågt växtäta miljöer som hedar, mossar och tundra
    i högre norr. Här söker den sin föda på marken, bestående av insekter och andra
    ryggradslösa djur. Under vintertid är fågeln migratorisk och flyttar söderut till
    västra Europa och Medelhavsregionen för att söka föda på mer öppna områden.


    Arten är globalt bedömd som livskraftig och uppvisar en stabil populationstrend.'
  en: '# European Golden Plover


    The European golden plover is a relatively large plover with distinctive golden-spangled
    plumage on its back and crown. It can be distinguished from its smaller cousins,
    the American and Pacific golden plovers, by its stockier build, shorter legs,
    and notably white rather than grey feathers in the armpit area. In breeding plumage,
    adults display striking black underparts bordered by a white stripe running from
    the forehead down the neck and along the flanks.


    This species favors open habitats including moorlands, grasslands, and tundra
    regions where it nests during the breeding season. It is a migratory bird, moving
    to coastal areas and lowland grasslands during winter. European golden plovers
    are typically seen singly or in small groups on the ground, where they forage
    for insects, spiders, and other invertebrates using their characteristic stop-and-peck
    feeding technique. They are alert and relatively approachable birds.


    The call is a distinctive, mournful whistle—"tlu-ee"—which is particularly audible
    during the breeding season. In flight, the bird appears compact and swift, showing
    the contrast between its dark upperparts and white underparts. These plovers are
    active both day and night, particularly during migration periods.'
migration:
  sv: '# Ljungpipare – årlig förekomst i Skandinavien


    Ljungpipare är en flyttfågel som häckar i norra Skandinavien och återvänder på
    våren för att reproducera sig på hedar, mossar och tundra. Fågeln anländer vanligtvis
    från april till maj efter att ha tillbringat vintern längre söderut. Under hösten,
    från augusti till oktober, påbörjar ljungpiparen sin återflyttning västerut mot
    Västeuropa och Medelhavsområdet där den övervintrar. Under vintertiden är arten
    således mycket sällsynt eller helt frånvarande från sitt nordiska häckningsområde.'
  en: '# European Golden Plover Migration in Scandinavia


    The European Golden Plover is a migratory species in Scandinavia and Northern
    Europe. Birds breeding in the region depart in autumn, typically from August onwards,
    heading to wintering grounds in southern Europe, North Africa, and the Mediterranean
    region. Return migration occurs in spring, with plovers arriving back at their
    breeding territories from March through May. Some individuals may overwinter in
    milder coastal areas of Northern Europe during favorable conditions, but the majority
    vacate breeding grounds during winter months.'
