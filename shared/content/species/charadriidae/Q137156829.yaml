description:
  sv: '# Svartbent strandpipare


    Svartbent strandpipare är en liten vadarfågel i pipfamiljen som förekommer på
    flacka sand- och lerstränder. Arten är utbredd i Europa och Nordafrika, och sträcker
    sig österut till Japan, med isolerade populationer i södra Indien och på Sri Lanka.


    Fågeln är anpassad till öppna, kala strandmiljöer där den kan röra sig fritt.
    Den förekommer främst i dessa karaktäristiska livsmiljöer, där den hittar föda
    längs vattnets kant.


    Beståndet av svartbent strandpipare minskar globalt, men anses trots det vara
    livskraftigt på världsbasis. I Sverige förändrades statusen märkbart – arten var
    tidigare en regelbunden häckfågel men klassificerades från 2002 som utdöd i landet.'
  en: '# Kentish Plover


    The Kentish plover is a small wader with pale plumage, a white underside, and
    a grey-brown back. Both sexes share dark legs and a dark bill, but males are distinctly
    more marked, displaying dark incomplete breast bands and dark patches on either
    side of the head, making this species sexually dimorphic. Its compact size and
    subtle coloration make it well-adapted to its preferred habitats.


    This species favours the shores of saline lakes, lagoons, and coastal areas, breeding
    across sand dunes, marshes, semi-arid deserts, and tundra environments. Its preference
    for open, often sparsely vegetated ground reflects its feeding and nesting requirements
    as a ground-nesting wader. The Kentish plover typically forages along waterline
    margins and bare ground, picking at small invertebrates.


    Like many plovers, it employs characteristic running-and-stopping behaviour while
    feeding. The bird is relatively inconspicuous, relying on its cryptic plumage
    for concealment, particularly important for a ground-nester. During breeding season,
    males become more territorial and vocal, though details of its specific calls
    would require additional sources.'
migration:
  sv: '# Svartbent strandpipare i Skandinavien/Nordeuropa


    Svartbent strandpipare förekom tidigare som regelbunden häckfågel i Sverige, men
    är sedan 2002 kategoriserad som utdöd i landet. Arten förekommer främst på flacka
    sand- eller lerstränder i Europa och Nordafrika, men förekommer inte längre som
    etablerad population i Skandinavien eller Nordeuropa. Historiskt sett hade arten
    säkerligen en säsongsmässig förekomst under häckningstid på lämpliga lokaler längs
    svenska kuster, men denna population är nu försvunnen.'
