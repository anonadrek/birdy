description:
  sv: '# Sumpvipa


    Sumpvipa är en vadare som tillhör familjen pipare. Den häckar i västra och centrala
    Asien, där den förekommer i grunda sumpmarker och fuktiga områden. Som flyttfågel
    sprider den sig delvis till södra Asien, Mellanöstern och nordöstra Afrika under
    övriga årstider.


    I Europa är sumpvipa en sällsynt gäst och endast ett tiotal fynd har registrerats
    i Sverige. Det är därför en art som väcker intresse bland fågelskådare när den
    observeras, då den ligger långt bort från sitt normala utbredningsområde.


    Det globala beståndet av sumpvipa anses vara livskraftigt och arten är inte hotad.
    För den intresserade fågelskådaren är sumpvipa en art att hålla ögonen öppna efter
    under våren och hösten, då migrationen är som mest aktiv.'
  en: '# White-tailed Lapwing


    The white-tailed lapwing is a wader belonging to the lapwing genus Vanellus. Its
    scientific name perfectly describes the species: *Vanellus*, derived from Medieval
    Latin meaning "winnowing fan" (referring to the bird''s wing movements), and *leucurus*,
    from Ancient Greek meaning "white-tailed."


    This lapwing is distinguished by its white tail, which contrasts with the darker
    plumage of related species. Like other lapwings, it displays characteristic behaviour
    typical of plovers, moving quickly across open ground with sudden stops. The species
    is adapted to wetland habitats and grasslands where it forages for invertebrates.


    The white-tailed lapwing is found across various regions where suitable wetland
    and open ground habitats exist. It prefers areas with water and bare or sparsely
    vegetated ground, making it a common sight in marshes, river floodplains, and
    irrigated fields during appropriate seasons.'
migration:
  sv: '# Sumpvipa i Skandinavien/Nordeuropa


    Sumpvipa är en mycket sällsynt gäst i Skandinavien och övriga Nordeuropa. Arten
    häckar i västra och centrala Asien och flyttar delvis till södra Asien, Mellanöstern
    och nordöstra Afrika. I Sverige har arten dokumenterats endast cirka tio gånger,
    vilket gör den till en mycket ovanlig vagrant. Arten förekommer inte regelbundet
    i regionen och utgör aldrig en naturlig del av den skandinaviska fågelfaunan under
    året. Möten med arten måste betraktas som tillfälliga vandringar långt utanför
    dess normala utbredningsområde.'
  en: 'Migration data unavailable for this species.


    The provided source text contains only taxonomic and etymological information
    about the White-tailed Lapwing, with no details regarding its occurrence, migration
    patterns, or seasonal distribution in Scandinavia or Northern Europe. To provide
    accurate information about this species'' migration and overwintering behavior
    in the region, additional sources with specific biogeographic and phenological
    data would be required.'
