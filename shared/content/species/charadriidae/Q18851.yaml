description:
  sv: '# Mindre strandpipare


    Mindre strandpipare är en liten pipare som återfinns över stora delar av Europa
    och Asien. Den är en flyttfågel som övervintrar i tropiska områden. Fågeln häckar
    på öppna, grusiga och sandiga marker, ofta längs insjöar och vattendrag. Det har
    blivit allt vanligare att arten också bosätter sig i människoskapade miljöer,
    vilket tyder på att den är anpassningsbar.


    Arten är globalt livskraftig enligt internationella bedömningar. Med sin förmåga
    att utnyttja olika typer av öppna, grus- och sandiga habitat har mindre strandpipare
    kunnat upprätthålla sina populationer väl. Denna flexibilitet när det gäller häckningsplats
    har gjort arten framgångsrik i sitt utbredningsområde.'
  en: '# Little Ringed Plover


    The Little Ringed Plover is a diminutive wading bird easily identified by its
    distinctive facial markings. It displays brown upperparts contrasting with a white
    forehead, breast, and belly. A striking black neckband encircles the lower neck,
    while a bold black eye-mask is framed by a conspicuous yellow eyering—a key feature
    distinguishing it from larger relatives.


    This species favors open gravel habitats during breeding season, particularly
    around freshwater environments such as gravel pits, river edges, and small islands.
    It is a migratory bird, shifting locations between breeding and wintering grounds.
    Its feeding behavior involves methodically foraging through muddy ground and shallow
    water margins for invertebrates.


    The bird''s diet comprises primarily insects and small worms, which it typically
    hunts by running across exposed ground and pausing to pick at prey items. It remains
    an active ground-feeder, well-adapted to open terrain with minimal vegetation.
    Its small size and lightweight frame make it ideally suited to moving swiftly
    across bare earth and gravelly substrates.'
migration:
  sv: '# Mindre strandpipare – Förekomst i Skandinavien


    Mindre strandpipare är en flyttfågel som förekommer i Skandinavien och Nordeuropa
    under häckningstiden på våren och sommaren. Arten ankommer till området under
    april-maj för att häcka i grusiga och sandiga marker vid insjöar och vattendrag.
    Under hösten, vanligtvis från augusti-september, påbörjar arten sin långväga migration
    söderut till tropiska övervintringsområden i Afrika och södra Asien. Fågeln är
    således helt frånvarande från Skandinavien under vintermånaderna.'
