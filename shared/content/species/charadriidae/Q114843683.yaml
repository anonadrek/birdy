description:
  sv: '# Tibetpipare


    Tibetpipare är en liten fågelart inom familjen pipare som förekommer i Centralasien.
    Det är närbesläktat med kamtjatkapipare och ökenpipare, arter som liknar varandra
    på flera sätt. Fram till nyligen klassificerades tibetpipare och kamtjatkapipare
    tillsammans som en gemensam art kallad mongolpipare, innan de separerades till
    två olika arter baserat på nyare kunskaper.


    Arten häckar i Centralasien där det är anpassat till de förhållanden som råder
    i regionen. För den som är intresserad av att observera denna art är det viktigt
    att söka i dess naturliga utbredningsområde i höglanden och öppna miljöer i Asien,
    där den tillsammans med sina närbesläktade arter utgör en del av det lokala fågelfaunan.'
  en: '# Tibetan Sand Plover


    The Tibetan sand plover is a small wader belonging to the plover family. It is
    a compact bird adapted for life in open, sparse habitats across high-altitude
    regions.


    This species breeds across extensive highland areas including the Pamir Mountains,
    Tian Shan mountain range, the Tibetan Plateau, and southern Mongolia. Following
    the breeding season, it undertakes a substantial migration southward. The species
    winters across a wide range in Africa, from the eastern to southern regions, and
    throughout south, east, and southeast Asia, making it a long-distance migratory
    bird.


    The Tibetan sand plover''s breeding and wintering ranges reflect its preference
    for open terrain and its remarkable capacity for long-distance travel between
    distant continents.'
migration:
