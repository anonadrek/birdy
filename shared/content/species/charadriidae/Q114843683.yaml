    **Förklaring:** Källtexten innehåller endast information om att Tibetpipare häckar
    i Centralasien och dess släktskap med andra pipare-arter. Det finns ingen information
    om förekomst i Skandinavien/Nordeuropa, migrationsmönster, övervintringsområden
    eller ankomstmånader. Därför kan jag inte tillhandahålla faktiska migrationsuppgifter
    för denna art i regionen.'
  en: '# Tibetan Sand Plover in Northern Europe


    The Tibetan Sand Plover does not occur in Scandinavia or Northern Europe. This
    species breeds in high-altitude regions of Central Asia, including the Pamir Mountains,
    Tian Shan, Tibetan Plateau, and southern Mongolia. During winter, it migrates
    to Africa and southern and southeastern Asia, where it remains until returning
    to its breeding grounds in spring. The species'' range is entirely restricted
    to Asia and Africa, making it absent from Scandinavian and Northern European territories
    year-round.'
