description:
  sv: '# Stäppvipa


    Stäppvipa är en akut utrotninghotad vadare från Eurasien. Arten häckar i stäpplandskapen
    i Ryssland och Kazakstan, men flyttar långt söderut när vintern närmar sig. Vintertid
    finns den i områden från Östafrika över Mellanöstern till nordvästra Indien.


    Stäppvipan är en medelstor pipare med karakteristisk tecknad huvud- och bröstmarkering.
    Under häckningstiden är den särskilt vacker med svarta och vita markeringar. Arten
    är oftast att se på öppna, släta marker där den söker föda på marken.


    Arten är mycket sällsynt i Sverige, där den endast registrerats elva gånger. Vid
    dessa tillfällen ses den ofta tillsammans med tofsvipor. Stäppvipans population
    har minskat dramatiskt under de senaste decennierna, och arten klassificerades
    som akut hotad av IUCN redan 2004. Orsaken till minskningen är inte helt klarlagd,
    men habitatförlust och miljöförsämringar på häcknings- och övervintringsplatserna
    anses spela en betydande roll.'
  en: '# Sociable Lapwing


    The Sociable Lapwing is a medium-sized wader belonging to the plover family, recognizable
    by its distinctive plumage featuring a black belly contrasting with lighter upperparts.
    This fully migratory species breeds across the steppes of Kazakhstan during the
    breeding season, then undertakes an impressive journey to winter grounds spanning
    the Middle East, the Indian subcontinent, Sudan, and occasionally Iberia in small
    numbers.


    As its name suggests, this lapwing is notably gregarious, often encountered in
    flocks rather than solitary. It shares the characteristic alert behavior and swift
    flight typical of plovers, foraging on open ground for invertebrates and small
    prey. The species has historically been called the black-bellied lapwing, a reference
    to its striking black abdominal markings that distinguish it from related plover
    species.


    The bird''s long-distance migration makes it dependent on suitable stopover sites
    and wintering habitats across its range. Like other plovers, it likely produces
    distinctive calls during breeding and migration periods, though these are less
    documented than in some related species. Its presence in any given location is
    determined entirely by seasonal movements, making timing crucial for observers
    hoping to encounter this impressive migratory wader.'
migration:
  sv: '# Stäppvipa – Förekomst i Skandinavien/Nordeuropa


    Stäppvipan är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    normalt i stäppområden i Ryssland och Kazakstan, medan den på hösten migrerar
    söderut till övervintringsområden från Israel till nordvästra Indien samt till
    nordöstra Afrika, framför allt i Etiopien, Eritrea och Sudan. Under höst- och
    vårflyttningen ses stäppvipan endast tillfälligt och sporadiskt utanför sitt ordinarie
    utbredningsområde. I Sverige har arten dokumenterats elva gånger, ofta tillsammans
    med andra vadare som tofsvipor. Dessa fynd representerar extrema avvikelser från
    artens normala migrationsmönster.'
  en: '# Sociable Lapwing in Northern Europe


    The Sociable Lapwing is a fully migratory species with only rare occurrences in
    Scandinavia and Northern Europe. This bird breeds in Kazakhstan and undertakes
    long-distance migration to winter in the Middle East, Indian subcontinent, and
    Sudan, with a tiny wintering population in Iberia. Occasional records in Northern
    Europe represent vagrant individuals well outside their normal migration routes
    rather than regular passage or established populations. Any sightings in Scandinavia
    would be exceptional and typically occur during spring or autumn migration periods
    when birds occasionally deviate from their primary migration corridors.'
