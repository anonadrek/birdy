description:
  sv: '# Sporrvipa


    Sporrvipa är en karakteristisk vadarfågel som tillhör familjen pipare. Den förekommer
    i östra Medelhavsområdet och i ett brett band som sträcker sig från Västafrika
    till Arabiska halvön, där den främst hittas i öppna och halvöppna biotoper nära
    vatten.


    Arten är lätt att känna igen på sitt iögonfallande utseende med svart och vit
    färgteckning. Det mest karakteristiska kännetecknet är de spetsiga sporrar som
    finns på vingarna – dessa gav arten sitt namn. Under flykten är den mycket påfallande
    med sin kontrasterande fjäderdräkt.


    Sporrvipa är en aktiv och högljudd fågel som ofta ses i par eller mindre grupper.
    Den är framför allt känd för sitt aggressiva beteende under häckningstiden, då
    den försvarar sitt revir energiskt mot intänkande. Arten föder sig på insekter
    och andra smådjur som den plockar från marken.'
  en: '# Spur-winged Lapwing


    The spur-winged lapwing is a distinctive wader belonging to the lapwing group
    within the Charadriidae family. It is a notably large member of this wader family,
    making it relatively easy to identify in the field compared to smaller shorebird
    species.


