description:
  sv: '# Kaspisk pipare


    Kaspisk pipare är en liten vadare i familjen pipare. Den häckar på öppna stepp-
    och halvökenmiljöer i Centralasien, från Kaspiska havet österut till västra Kina.
    Under vintern genomför arten en långflyttning till Afrika, där den söker upp större
    savannh- och fuktigare områden i östra och södra delen av kontinenten.


    I Europa är kaspisk pipare mycket sällsynt och uppträder endast sporadiskt som
    gäst. Antalet fynd är begränsat, och arten drar ofta uppmärksamhet när den observeras.
    Beståndet visar en nedåtgående trend, något som övervakas noga av ornitologer.
    Trots denna minskning anses populationen fortfarande livskraftig i helhet.


    För den som är intresserad av vadare är arten framför allt relevant som en potentiell
    raritet att hålla ögonen öppna efter, särskilt under migrationssäsongerna när
    fåglar förirrar sig längre västerut än normalt.'
  en: '# Caspian Plover


    The Caspian plover is a small wader belonging to the plover family. It is a ground-dwelling
    bird adapted to open habitats, displaying the characteristic features of plovers
    including a compact body and relatively short legs. The plumage patterns typical
    of this species help it blend into its preferred terrain.


    This plover inhabits grasslands and semi-arid regions across Asia, where it forages
    on the ground for invertebrates and small food items. Like other plovers, it likely
    employs the characteristic "run-and-stop" hunting technique, pausing periodically
    to locate prey. Its behaviour reflects adaptations to open country living, where
    visibility is important for detecting both food and potential threats.


    The species'' common name references the Caspian region, highlighting its geographic
    range within Asian territories. Despite its scientific name suggesting Indian
    origins as the type locality, the Caspian plover is distributed across various
    Asian habitats suitable to its ecological requirements as a ground-feeding wader.'
migration:
  sv: '# Kaspisk pipare – Förekomst i Skandinavien/Nordeuropa


    Kaspisk pipare är en mycket sällsynt gäst i Europa och därmed även i Skandinavien
    och Nordeuropa. Arten häckar i Centralasien och migrerar långväga till östra och
    södra Afrika för övervintering. Endast ett fåtal fynd har registrerats i Europa,
    inklusive tre observationer i Sverige. Arten förekommer således inte regelbundet
    i regionen utan är en mycket ovanlig tillfällig besökare.'
