description:
  sv: ''
  en: '# Red-wattled Lapwing


    The red-wattled lapwing is a large, ground-dwelling plover found across Asia.
    It is a distinctive wader that cannot perch, instead remaining on the ground where
    its cryptically patterned plumage provides camouflage. The species derives one
    colloquial name, the "did-he-do-it bird," from its characteristically loud alarm
    calls, which sound like those words and serve to alert other birds and animals
    to potential threats in the vicinity.


    The species is typically seen in pairs or small groups in open areas near water,
    though it sometimes gathers in larger flocks during the non-breeding season. It
    nests in simple ground scrapes, where it lays three to four well-camouflaged eggs.
    Both adults fiercely defend their nest, diving repeatedly at predators while calling
    loudly. The chicks are precocial, hatching ready to follow their parents immediately
    to feed. When danger threatens, the young instinctively crouch and hide low in
    grass or on bare ground, relying on their cryptic coloration for protection.'
