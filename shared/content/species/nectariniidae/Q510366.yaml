description:
  sv: ''
  en: '# Pygmy Sunbird


    The Pygmy Sunbird is the smallest member of the sunbird family, a diminutive nectarivore
    perfectly adapted for feeding on small flowers. It displays the characteristic
    iridescent plumage typical of sunbirds, with glossy green and purple markings
    that shimmer in sunlight. Its tiny, slightly curved bill is perfectly designed
    for probing deep into flowers to extract nectar and small insects, which form
    its primary diet.


    This species is highly active and restless, often seen flitting rapidly between
    flowering plants and shrubs. It is solitary or found in pairs, and like other
    sunbirds, it is territorial and aggressive despite its tiny size. The male''s
    call is a thin, high-pitched series of chirps and trills that are surprisingly
    loud for such a small bird.


    The Pygmy Sunbird inhabits open woodlands, savanna, and cultivated areas across
    sub-Saharan Africa. It prefers areas with scattered trees and flowering plants,
    avoiding dense forest interiors. The species is widespread throughout its range
    and generally common where suitable habitat exists, making it a familiar sight
    to birdwatchers across the African continent.'
