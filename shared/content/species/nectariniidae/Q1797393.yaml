  en: '# Purple Sunbird (Cinnyris asiaticus) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Purple Sunbird occurs in the Arabian Peninsula and South and Southeast Asia,
    with no established presence in Scandinavia or Northern Europe. This tropical
    and subtropical species is not known to occur as a resident, migrant, or vagrant
    visitor in Scandinavian or Northern European regions. Its range is restricted
    to warmer climates considerably south of these areas, making it irrelevant for
    Northern European bird guides.'
