description:
  sv: '# Purpursolfågel


    Purpursolfågeln är en liten, glänsande fågel i solfåglarfamiljen som förekommer
    från Arabiska halvön österut till Indokina. Arten är vida spridd över sitt utbredningsområde
    och klassificeras av IUCN som livskraftig.


    Denna art är en typisk solfågel anpassad för nektarsamling, med karakteristiska
    glinsande fjädrar. Purpursolfågeln förekommer i öppna och halvöppna habitat där
    det finns blommande växter, ofta i närhet till mänskliga bosättningar och odlingar.


    Arten är stabil i antalet och utgör ingen bevarandehänd för närvarande.'
  en: '# Purple Sunbird


    The purple sunbird is a tiny member of the sunbird family found across the Arabian
    Peninsula and South and Southeast Asia. Males display striking purple iridescence
    on their plumage, though in harsh sunlight they may appear entirely black—the
    iridescent sheen becomes visible only under better light conditions or on close
    inspection. Females are more subdued, with olive upperparts and yellowish underparts.


    This species is highly active and acrobatic, capable of hovering like a hummingbird
    to extract nectar from flowers, though it frequently perches at flower bases to
    feed. It forages primarily on nectar and insects, with insects becoming especially
    important during the breeding season when feeding young. The bird''s flight is
    fast and direct, enabling it to move rapidly between feeding sites.


    The purple sunbird typically inhabits gardens, scrubland, and open woodland areas
    where flowering plants provide abundant food sources. Its small size and quick,
    darting movements can make it challenging to observe, but patient watching of
    flowering trees and shrubs often rewards the birdwatcher with sightings of this
    jewel-like species.'
