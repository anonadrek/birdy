description:
  sv: '# Palestinasolfågel


    Palestinasolfågeln är en mycket liten fågel som tillhör familjen solfåglar. Det
    är en anpassad nektarätare med karakteristisk kroppsbygnad för familjen – spetsig
    näbb och kompakt kropp som gör det väl lämpad för att söka föda i blommor.


    Arten förekommer primärt i Mellanöstern, men har också en utbredd population i
    Afrika, där den är bosatt från östra delen av västra Afrika österut till Uganda
    och Sydsudan. Det är en lokalt förekommande art inom sitt stora utbredningsområde.


    Palestinasolfågeln klassificeras av IUCN som livskraftig, vilket indikerar att
    populationen är stabil och arten inte står inför några större bevaringsproblem
    för närvarande.'
  en: '# Palestine Sunbird


    The Palestine sunbird is a small passerine belonging to the sunbird family. It
    inhabits parts of the Middle East and sub-Saharan Africa. The species is also
    called the northern orange-tufted sunbird, distinguishing it from the similarly
    named orange-tufted sunbird found further south in Africa.


    This diminutive nectar-feeder shares the characteristic features of sunbirds:
    a slender, slightly curved bill adapted for probing flowers, and iridescent plumage
    that catches the light. Males display vibrant coloring with orange tufts, while
    females are more subdued. Like other sunbirds, it is highly active and acrobatic,
    moving rapidly between flowering plants in search of nectar and small insects.


    The Palestine sunbird holds cultural significance, having been adopted as the
    national bird by the Palestinian Authority in 2015. The species name *osea* derives
    from Ancient Greek, reflecting its scientific naming heritage.'
