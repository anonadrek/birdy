description:
  sv: '# Arabsolfågel


    Arabsolfågel är en liten fågelart i familjen solfåglar som förekommer på södra
    delen av Arabiska halvön. Arten urskiljs allt oftare som en egen art, fastän den
    traditionellt betraktades som en del av abessinsolfågel.


    Som medlem av solfåglarnas familj är det en anpassad nektarätare med en långslank
    näbb utformad för att suga nektar från blommor. Arten tillhör ordningen tättingar
    och delar många egenskaper med andra små, aktiva insektätare och nektarätare i
    denna grupp.


    Arten är endemisk för södra Arabiska halvön där den återfinns i sitt begränsade
    utbredningsområde.'
  en: ''
