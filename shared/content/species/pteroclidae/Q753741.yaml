description:
  sv: ''
  en: '# Pin-tailed Sandgrouse


    The pin-tailed sandgrouse is a medium-large bird with a distinctive silhouette.
    It possesses a small, pigeon-like head and neck contrasting with a sturdy, compact
    body. Its most striking features are long, pointed wings with white undersides,
    a notably elongated tail, and a swift, direct flight pattern that makes it easily
    recognizable in flight.


    This highly gregarious species is adapted to arid environments, breeding on dry,
    open, treeless plains and similar barren habitats. It displays fascinating behavior
    at dawn, when flocks gather to fly to watering holes—a critical daily ritual in
    its desert lifestyle. Its loud, repetitive call—a distinctive "kattar-kattar"—helps
    maintain group cohesion during these flights.


    Breeding pairs nest on the ground, creating simple scrapes where they lay two
    or three cream-colored eggs bearing cryptic markings for camouflage. Both males
    and females share incubation duties, an unusual cooperative behavior among sandgrouse.
    This species exemplifies remarkable adaptation to harsh, arid landscapes where
    water and vegetation are scarce.'
