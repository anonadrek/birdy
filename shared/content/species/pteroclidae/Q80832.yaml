description:
  sv: ''
  en: '# Spotted Sandgrouse


    The spotted sandgrouse is a ground-dwelling bird of arid regions across northern
    and eastern Africa, the Middle East, and parts of Asia extending to northwest
    India. It is a compact, swift-flying bird perfectly adapted to sparse, stony landscapes
    where it forages in small flocks for seeds and other plant matter. Its plumage
    provides excellent camouflage against rocky terrain.


    This gregarious, daytime-active species exhibits a distinctive daily routine:
    flocks spend mornings and afternoons feeding on the ground before flying to waterholes
    once daily to drink. During breeding season, pairs nest independently, laying
    eggs in simple depressions on stony ground. The chicks are precocial, leaving
    the nest shortly after hatching and immediately eating dry seeds. A remarkable
    adaptation ensures chick survival in arid conditions—the male saturates its belly
    feathers with water at the waterhole and returns to feed this moisture to the
    young, providing essential hydration when free water is unavailable.


    The species is currently listed as "least concern" by conservation authorities,
    indicating stable populations across its range.'
