description:
  sv: '# Brunbukig flyghöna


    Brunbukig flyghöna är en fågel från familjen flyghöns som förekommer i både Afrika
    och Asien. Arten är anpassad till livsförhållandena i halvöken och trivs ofta
    intill odlade fält där den kan söka föda på marken.


    Fågeln är väl utrustad för sitt torra levnadsmiljö och har utvecklat effektiva
    sätt att överleva i dessa klimat. Beståndet av brunbukig flyghöna anses vara livskraftigt
    och arten utgör ingen naturvårdsbekymring för närvarande.'
  en: '# Chestnut-bellied Sandgrouse


    The chestnut-bellied sandgrouse is a medium-sized member of the sandgrouse family,
    characterized by its distinctive warm chestnut underparts that give it its common
    name. Its plumage is predominantly sandy and mottled, providing excellent camouflage
    in arid environments. The species has the typical sandgrouse profile: streamlined
    body, pointed wings, and a small head.


    This bird is well-adapted to dry, open habitats across northern and central Africa,
    extending eastward into western and southern Asia. It exhibits both sedentary
    and nomadic behavior, meaning some populations remain year-round in their territories
    while others move seasonally in response to water and food availability. Like
    other sandgrouse species, it is highly dependent on access to water sources for
    drinking, often gathering at waterholes during dawn and dusk.


    Six recognized subspecies occur throughout its wide range, showing subtle variations
    in plumage coloration across different regions. The chestnut-bellied sandgrouse
    is typically found in semi-arid scrubland, desert edges, and grasslands where
    sparse vegetation dominates the landscape.'
migration:
  sv: 'Migrationsdata saknas för denna art.


    Brunbukig flyghöna är en afrikansk och asiatisk art som inte förekommer naturligt
    i Skandinavien eller Nordeuropa. Arten är hemma i halvöken och vid odlade områden
    i Afrika och Asien, och det finns ingen dokumenterad förekomst eller migration
    till nordeuropeiska regioner. För denna art saknas därför relevant migrationsdata
    avseende skandinavisk förekomst under året.'
  en: 'Migration data unavailable for this species.


    The source text provides no specific information about how Pterocles exustus occurs
    in Scandinavia or Northern Europe throughout the year, migration patterns, overwintering
    behavior, or arrival months. The species is described as sedentary and nomadic
    across northern and central Africa and western to southern Asia, but these regions
    do not include Scandinavian or Northern European territories. Therefore, reliable
    migration data for this species in the requested geographic area cannot be provided.'
