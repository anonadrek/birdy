description:
  sv: ''
  en: '# African Grey Hornbill


    The African grey hornbill is a widespread resident breeder across much of sub-Saharan
    Africa and the southwest of the Arabian Peninsula. This member of the hornbill
    family represents the diverse near-passerine birds predominantly found in tropical
    Old World regions.


    The species is characterized by its distinctive appearance typical of hornbills,
    though specific plumage details from the source remain limited. Like other hornbills,
    it likely displays the family''s characteristic features, though further description
    would require additional sources.


    The African grey hornbill has occasionally appeared outside its native range,
    with records of escaped or deliberately released individuals in Florida, USA.
    However, there is no evidence of established breeding populations in this introduced
    location, with any persistence likely dependent on continued releases or escapes
    rather than natural reproduction.'
migration:
  sv: ''
  en: '# African Grey Hornbill in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The African Grey Hornbill is a resident species of sub-Saharan Africa and the
    Arabian Peninsula, with no natural occurrence in Scandinavia or Northern Europe.
    While the species has appeared in Florida through human-mediated releases or escapes,
    there is no evidence of established breeding populations there or any presence
    in Nordic regions.'
