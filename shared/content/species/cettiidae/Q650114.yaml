description:
  sv: '# Cettisångare


    Cettisångare är en liten, diskret fågel och den enda europeiska medlemmen av familjen
    cettior. Den är svåridentifierad med sitt brunaktiga och gräsliknande utseende,
    vilket gör det lätt att förbise den i sin naturliga miljö.


    Arten är känd för sitt höga, markant rop som hörs särskilt under häckningstiden.
    Trots sitt lilla format producerar den överraskande kraftfulla ljud som ekar genom
    sitt habitat. Fågeln är mycket hemlighetsfull och verbös snarare än synlig – den
    föredrar att röra sig i tät vegetation där den är svår att få ögonkontakt med.


    Cettisångaren förekommer normalt från södra England och södra Europa österut till
    Afghanistan, samt i Nordafrika. Den ses huvudsakligen i våtmarker, vass och tätt
    buskage. Norrut från sitt vanliga utbredningsområde är den endast tillfällig och
    mycket sällsynt – endast tre fynd är registrerade i Sverige, vilket gör dessa
    observationer extra värdefulla för lokala fågelintresserade.'
  en: ''
migration:
  sv: '**Cettisångare (Cettia cetti) i Skandinavien**


    Cettisångaren är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten
    förekommer normalt inte regelbundet i regionen utan är istället en tillfällig
    besökare långt norr om sitt huvudsakliga utbredningsområde i södra och centrala
    Europa. I Sverige har arten endast noterats tre gånger, vilket understryker dess
    extrema sällsynthet i norr. Några bestämd migrationsmönster för arten i Skandinavien
    kan därför inte fastställas, då förekomsterna verkar vara sporadiska vandringar
    långt bortom artens normala område snarare än regelbundna migrationsmönster.'
  en: ''
