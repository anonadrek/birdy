description:
  sv: ''
  en: '# Western Rock Nuthatch


    The western rock nuthatch is a small passerine that inhabits rocky terrain across
    southeastern Europe and western Asia, with its range extending from Croatia eastward
    through Greece, Turkey, and into Iran. Unlike many migratory species, it is largely
    resident throughout the year, though some individuals disperse after breeding
    season.


    This nuthatch is well-adapted to rocky habitats, spending much of its time on
    steep cliffs and boulder-strewn slopes where it forages for insects and seeds.
    It moves with characteristic nuthatch agility, often working down rock faces in
    search of food. The bird is often seen in pairs or small family groups, particularly
    during breeding season when it excavates nest holes in suitable rock crevices.


    The western rock nuthatch is easily distinguished from other nuthatches by its
    association with bare rock rather than trees. Its call is distinctive and penetrating—a
    series of loud, rapid whistles that carry well across rocky valleys, making it
    conspicuous despite its modest size. The bird''s plumage is relatively subdued,
    with grey-blue upper parts and pale underparts, providing effective camouflage
    against the rocky slopes it inhabits.'
migration:
  sv: ''
  en: '# Western Rock Nuthatch in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Western Rock Nuthatch is a southern European and Middle Eastern species with
    a breeding range extending from Croatia through Greece, Turkey, and into Iran.
    It does not occur naturally in Scandinavia or Northern Europe. The species is
    largely resident throughout its range, with only minor post-breeding dispersal
    recorded. It should not be expected in Scandinavian bird guides as a regular visitor
    or migrant.'
