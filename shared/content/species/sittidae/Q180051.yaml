description:
  sv: '# Korsikansk nötväcka


    Korsikansk nötväcka är en liten medlem av nötväckfamiljen som är starkt knuten
    till Korsika, där den är endemit. Arten är relativt fåtalig och förekommer uteslutande
    på denna medelhavöar.


    Arten står på IUCN:s röda lista över hotade arter då populationen är minskande.
    Detta gör den till en särskilt intressant och värdefull art för ornitologer och
    fågelskådare som besöker regionen. Bevaringen av habitatet är avgörande för artens
    överlevnad.'
  en: '# Corsican Nuthatch


    The Corsican nuthatch is one of Europe''s smallest nuthatches, measuring just
    12 cm in length. It displays bluish-grey upperparts with greyish-white underparts,
    making it relatively subtle in appearance. The most distinctive feature is the
    male''s entirely black crown, which contrasts sharply with the female''s grey
    crown, allowing for easy sex identification in the field.


    This sedentary and territorial species shows little fear of observers and spends
    considerable time foraging high in Corsican pines, where it extracts seeds from
    cones with characteristic nuthatch precision. It supplements its diet with flying
    insects caught on the wing. The bird is generally quiet and unobtrusive, blending
    well with its preferred pine habitat.


    Breeding occurs between April and May, when pairs excavate nest cavities in the
    trunks of old pines. Females typically lay clutches of five to six eggs, with
    chicks fledging approximately three weeks after hatching. The species remains
    on its breeding territories year-round, making it a permanent resident of its
    restricted range within the island''s pine forests.'
