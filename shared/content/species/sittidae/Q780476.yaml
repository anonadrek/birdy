    en: Migration data unavailable for this species.


    ---


    **Förklaring:** Källtexten innehåller ingen information om förekomst i Skandinavien/Nordeuropa
    eller om migrationsmönster. Arten är endemisk för norra Algeriet i Afrika och
    förekommer inte naturligt i nordeuropeiska regioner. Därför kan ingen faktisk
    migrationsinformation presenteras.'
  en: 'Migration data unavailable for this species.


    The Algerian Nuthatch is a sedentary species with no regular migration patterns
    in Scandinavia or Northern Europe. In fact, this species is endemic to North Africa,
    specifically found in the mountainous regions of Algeria (the Kabylie region),
    and does not naturally occur in Scandinavian or Northern European territories.
    Its range is restricted to North African forests, where it remains year-round
    as a permanent resident rather than a migratory visitor.'
