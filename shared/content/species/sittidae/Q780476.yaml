description:
  sv: '# Kabylnötväcka


    Kabylnötväcka är en liten nötväcka som upptäcktes redan 1975 och är en av världens
    minst kända fågelarter. Det är en påtagligt lokalt förekommande fågel som finns
    mycket begränsat utbredd i norra Afrika.


    Arten är en typisk nötväcka med karakteristiska draghuvud- och näbbrörelser. Som
    övriga nötväckor är det en skicklig klättrare som söker föda på stammar och grenar.
    Arten är mycket liten och diskret i sitt beteende, vilket förklarar varför den
    upptäcktes så sent.


    Kabylnötväcka förekommer endast i ett mycket begränsat område i norra Afrika,
    där det häckar lokalt. Arten är starkt hotad på grund av sitt små utbredningsområde
    och är därför klassificerad som sårbar.'
  en: '# Algerian Nuthatch


    The Algerian nuthatch is a compact member of the nuthatch family, measuring just
    11.5–12.5 cm in length. Its upperparts are distinctly bluish-grey, providing good
    camouflage among coniferous woodland. Males are identifiable by a striking black
    patch on the front of the crown, while females lack this marking, making the species
    relatively straightforward to identify in the field.


    This sedentary species has adapted its diet to seasonal availability. During summer
    months, it actively forages for arthropods, picking them from bark and branches
    with characteristic nuthatch agility. As winter approaches and invertebrates become
    scarce, it switches to feeding on seeds, allowing it to remain resident year-round
    rather than migrate.


    The breeding season occurs in May and June, when pairs nest in tree cavities.
    The female lays three or four eggs and incubates them alone, while both parents
    collaborate in feeding the developing chicks. This species is endemic to mountainous
    regions where suitable woodland habitat exists, making it a specialist bird with
    a restricted range found only in specific upland areas with appropriate coniferous
    forest.'
migration:
