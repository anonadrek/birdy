description:
  sv: ''
  en: '# Krüper''s Nuthatch


    Krüper''s nuthatch is a small nuthatch, about 12.5 centimetres long, with distinctive
    plumage. It displays blue-grey upperparts, with a black crown on the front half
    of the head (less marked in females). A striking white stripe runs above the eye,
    contrasting with a dark eyestripe below. The underparts are blue-grey in males
    and buff-grey in females, with a characteristic large, crescent-shaped rufous
    patch across the breast.


    The species is primarily insectivorous during summer months, but shifts its diet
    to seeds in autumn and winter, showing a particular preference for pine seeds.
    It breeds between March and May, nesting in tree cavities. The female incubates
    a clutch of five to seven eggs while the male provides food. Both parents cooperate
    in feeding the fledglings once they hatch.


    Krüper''s nuthatch inhabits coniferous and mixed forests across its range, where
    it forages along tree trunks and branches in typical nuthatch fashion. It remains
    relatively inconspicuous despite its striking markings, often going unnoticed
    as it works methodically through the canopy searching for food.'
migration:
  sv: ''
  en: '# Krüper''s Nuthatch in Northern Europe


    Migration data unavailable for this species.


    Krüper''s Nuthatch is not a regular resident of Scandinavia or Northern Europe.
    The species'' breeding range is centered in the Mediterranean region and parts
    of western Asia, with populations found in countries such as Turkey, Greece, and
    the Levant. There are no established populations in Scandinavia or Northern Europe,
    and the species does not occur as a migrant or vagrant in these regions during
    any season of the year.'
