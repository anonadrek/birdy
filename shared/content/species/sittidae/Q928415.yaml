description:
  sv: ''
  en: '# Eastern Rock Nuthatch


    The eastern rock nuthatch is a member of the nuthatch family, distinguished by
    the characteristic features shared across this group of small, active foragers.
    It inhabits rocky terrain across a broad range spanning southwest and central
    Asia, from eastern Turkey extending eastward through the Caucasus region, into
    central Asian countries, and down toward northwestern areas of the Indian subcontinent.


    This species is adapted to life among cliff faces and rocky outcrops, where it
    searches for food in crevices and on stone surfaces. Like other nuthatches, it
    is an agile climber, capable of moving along vertical rock surfaces with ease.
    The bird is generally seen in pairs or small groups as it forages, probing into
    gaps and cracks in rock to extract insects and other invertebrate prey.


    The eastern rock nuthatch occupies arid and semi-arid regions with suitable rocky
    habitat. Some ornithological sources have referred to it as the Persian nuthatch,
    reflecting its distribution across parts of the Persian plateau and surrounding
    regions. It remains relatively specialized in its habitat requirements, preferring
    areas where exposed rock and cliff faces provide both foraging opportunities and
    shelter for nesting.'
