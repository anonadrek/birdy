description:
  sv: '# Östlig sammetshätta


    Östlig sammetshätta är en liten fågel i familjen sylvior som förekommer i västra
    Asien. Arten är klassificerad som livskraftig enligt IUCN.


    Fågeln är känd för att förekomma i tamariskskogar och buskskogar i sitt naturliga
    utbredningsområde. Även om arten främst är hemmahörande i västra Asien har den
    sporadiskt påträffats långt från sitt ordinarie område – tillfälliga fynd har
    dokumenterats i södra Europa, bland annat i Grekland och Italien.


    För den intresserade fågelskådaren är arten svår att observera utanför sitt hemland,
    men kännedomen om möjligheten till ovanliga fynd kan vara värdefull vid fågelskådning
    runt Medelhavet.'
  en: ''
migration:
  sv: '# Östlig sammetshätta – Förekomst i Norden


    Östlig sammetshätta är en västasiatic art som normalt inte förekommer i Skandinavien
    eller Nordeuropa. Arten är mycket sällan registrerad i regionen och betraktas
    som en tillfällig gäst. Några sporadiska observationer har dokumenterats i södra
    Europa, men arten är ytterst osannolik att påträffa i norra delen av kontinenten.
    För denna art finns ingen etablerad migrationsmönster eller regelbunden säsongsövervakning
    i skandinaviska länder.'
  en: ''
