description:
  sv: '# Atlassångare


    Atlassångare är en liten sylvia som häckar i nordvästra Afrika, framför allt i
    bergstrakter med sparsmäkrad växtlighet. Arten är i huvudsak stannfågel och lämnar
    sällan sitt häckningsområde.


    Fågeln är gråbrun till brungråfärgad på ovansidan med ljusare undersida. Det är
    en liten, diskret fågel som är lätt att förbise bland den torra markvegentationen
    där den vistas. Atlassångare är en aktiv och dold art som ofta rör sig lågt bland
    buskar och låg vegetation.


    Arten är klassificerad som livskraftig av IUCN, vilket indikerar en stabil populationssituation.
    Som stannfågel är den året runt närvarande i sitt begränsat utbredningsområde
    i Marocko, Algeriet och Tunisien.'
