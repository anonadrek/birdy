description:
  sv: '# Sardinsk sångare


    Sardinsk sångare är en liten sångare inom familjen sylvior. Det är en stannfågel
    med utbredning på Sardinien, Korsika och närliggande små öar i Medelhavet. Under
    vintern förekommer arten även i södra Italien och nordöstra Afrika.


    Arten var tidigare klassificerad tillsammans med balearisk sångare som en gemensam
    art, men behandlas nu som egen species. Sardinsk sångare kategoriseras av IUCN
    som livskraftig, vilket indikerar en stabil population utan större hotande faktorer.


    För ytterligare detaljer om fågels utseende, röst och beteende rekommenderas att
    konsultera fältguider specifikt inriktade på mediterraneanska fågelarter, då källtexten
    är begränsad.'
  en: ''
migration:
  sv: '# Sardinsk sångare i Nordeuropa


    Sardinsk sångare förekommer inte naturligt i Skandinavien eller Nordeuropa. Arten
    är en stannfågel på Sardinien, Korsika och närliggande medelhavsöar, där den är
    bosatt året runt. Under vintern sprider sig populationen något och påträffas då
    även i södra Italien och nordöstra Afrika. Arten utgör således ingen del av den
    nordeuropeiska fågelfaunan och har ingen migrationsmönster relevant för Skandinavien.'
  en: ''
