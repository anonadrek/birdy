  en: '# Arabian Warbler - Scandinavian/Northern European Occurrence


    Migration data unavailable for this species.


    The Arabian Warbler is a resident species of arid regions in northeastern Africa
    and the Arabian Peninsula, with no documented occurrence in Scandinavia or Northern
    Europe. Its range is restricted to countries such as Saudi Arabia, Yemen, Oman,
    Egypt, Sudan, and the Horn of Africa, where it inhabits dry savanna and acacia
    woodland. There are no records of this species migrating to or occurring in Scandinavian
    regions at any time of year.'
