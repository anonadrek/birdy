description:
  sv: '# Svarthakad sångare


    Svarthakad sångare är en liten tätting som tillhör familjen sylvior. Arten förekommer
    i sydöstra Europa och är en sällsynt gäst längre norrut. Det är en livskraftig
    art enligt IUCN:s bedömning.


    Arten är anpassad till sitt ursprungliga utbredningsområde i sydöstra Europa,
    men har dokumenterats dyka upp långt från sitt normala område, ända upp till Finland
    och Danmark. Detta tyder på att arten ibland genomför utvandringar eller sprider
    sig bortom sitt vanliga utbredningsområde, möjligtvis drivet av väderförhållanden
    eller andra miljöfaktorer.'
