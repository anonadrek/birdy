description:
  sv: '# Saharasångare


    Saharasångare är en liten fågel i sylviefamiljen som är hemmastad i ökenregioner
    i nordvästra Afrika. Det är en stannfågel som stannar året runt på sitt revir
    snarare än att migrera. Arten klassificeras som livskraftig enligt IUCN:s kategorier.
    Tidigare ansågs saharasångaren utgöra en underart till ökensångaren, men den räknas
    nu som egen art.


    För mer detaljerad information om utseende, läte och beteende rekommenderas att
    konsultera specialiserad fågellitteratur eller ornitologiska resurser, då källmaterialet
    inte innehåller dessa detaljer.'
  en: ''
migration:
  sv: 'Migrationsdata saknas för denna art.


    The source text only states that the species "breeds in deserts in northwestern
    Africa where it is a resident bird" (häckar i öknar i nordvästra Afrika där den
    är stannfågel). This indicates it is sedentary in its breeding range, but provides
    no information about occurrence in Scandinavia or Northern Europe, nor any migration
    patterns relevant to these regions. Therefore, migration data for this species
    in the context of Scandinavian/Northern European occurrence is unavailable.'
  en: ''
