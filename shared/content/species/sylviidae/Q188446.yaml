description:
  sv: '# Svarthätta


    Svarthätta är en medelstor sångare som tillhör familjen sylvior. Hanen är lätt
    att känna igen på sin svarta huvud­kappe, medan honan har en rödbrun hjässa. Båda
    könen är för övrigt gråbruna på ovansidan och ljusare på undersidan.


    Arten är en livlig och dold fågel som håller sig gärna i tät växtlighet. Den är
    en skicklig sångare med en vacker, mjuk melodi som hörs framför allt under häckningstiden.
    Svarthättan födosöker genom att söka efter insekter och små frön, ofta högt upp
    i buskage och träd.


    Arten förekommer vanligt som häckfågel i olika typer av skogshabitat och täta
    buskmarker. Nordliga populationer är flyttfåglar som söker sig till Medelhavsområdet
    och Afrika söder om Sahara när vintern kommer. Fåglar från väst- och södra Europa
    är ofta stannfåglar som finns kvar året runt. Svarthättan klassificeras som livskraftig
    och är inte hotad.'
  en: '# Eurasian Blackcap


    The Eurasian blackcap is a widespread and common warbler easily identified by
    its distinctive head cap. Males display a striking black cap contrasting with
    olive-grey upperparts and pale grey underparts, while females show a reddish-brown
    cap instead. The bird''s plumage is relatively uniform across its five subspecies,
    with both sexes presenting neat, clearly defined crowns. Its closest relative,
    the garden warbler, shares a similar song pattern but differs markedly in appearance.


    The blackcap''s song is one of its most appealing features—a rich, musical warbling
    that typically builds to a loud, high-pitched crescendo. In isolated areas such
    as mountain valleys, simpler song variations are occasionally heard. The bird
    is highly vocal during breeding season, making it conspicuous despite its preference
    for dense vegetation.


    It inhabits a variety of habitats across Europe, western Asia, and North Africa,
    ranging from woodland edges and scrub to gardens and parks. The blackcap is adaptable
    and frequently visits fruit-bearing bushes and hedgerows. While traditionally
    migratory, some populations now overwinter in northern regions, particularly around
    gardens where food supplements are available.'
migration:
  sv: '# Svarthätta i Skandinavien och Norra Europa


    Svarthätta är en vanlig häckfågel i Skandinavien och Norra Europa under våren
    och sommaren. Fåglarna anländer till området från april-maj och börjar häcka i
    löv- och blandskogs. Under hösten, från augusti-september, påbörjar de nordliga
    populationerna sin migration sydöver. Övervintringen sker huvudsakligen i Medelhavsområdet
    och Afrika söder om Sahara, där fåglarna tillbringar vintern innan de återvänder
    på våren. En mindre del av populationen i Väst- och Sydeuropa är stannfåglar som
    övervintar där de häckar.'
  en: '# Eurasian Blackcap in Northern Europe


    The Eurasian blackcap is a summer breeding visitor to Scandinavia and Northern
    Europe, arriving in late April and May. Populations breed across the region during
    spring and summer before departing southward in August and September to winter
    in sub-Saharan Africa and the Mediterranean basin. However, in recent decades,
    an increasing number of blackcaps have begun overwintering in Central and Northern
    Europe, particularly in milder areas, representing a significant shift in traditional
    migration patterns. This population expansion during winter months has been linked
    to changing climate conditions and increased availability of garden bird feeders.'
