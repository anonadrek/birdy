description:
  sv: '# Sammetshätta


    Sammetshätta är en liten tätting från familjen sylvior och är en typisk stannfågel
    i Medelhavsregionen. Det är en karakteristisk fågel med sitt namn efter det mörka,
    sammetsliknande huvudet – hanen bär en svart hjässa och kind medan honan har bruntare
    toner. Arten är liten och spenslig med en något upplyfad hållning.


    Arten förekommer huvudsakligen i låglänta miljöer inom sitt kärnområde och trivs
    bland täta buskage och låg vegetation. Det är en aktiv och livlig fågel som ofta
    hörs innan den ses. Sammetshätta har en distinkt, raspig sång som låter ganska
    högt för så liten fågel.


    Även om arten är stannfågel i Medelhavsområdet, där den är vanligt förekommande,
    förekommer det regelbundet enstaka fynd norr om det normala utbredningsområdet.
    Dessa vagabunderande individer har påträffats i alla nordiska länder förutom en.
    IUCN kategoriserar arten som livskraftig med en stabil population.'
  en: '# Sardinian Warbler


    The Sardinian warbler is a striking and common Mediterranean warbler with distinctive
    sexual dimorphism. The male is instantly recognizable with its black head, grey
    back, and white throat, while his most striking feature is the bright red eye-ring.
    Females are considerably duller, appearing brownish above with a greyish head
    and buff underparts. Plumage intensity varies between individuals and populations,
    particularly in the reddish tones on the flanks and underparts.


    This warbler is highly vocal, delivering a fast, rattling song that epitomizes
    the Mediterranean scrubland habitat where it breeds. Its energetic, chattering
    call is one of the region''s characteristic bird sounds. The species favors dense
    low vegetation and scrub, where it skulks and forages actively among the bushes.


    The Sardinian warbler is widespread and common throughout Mediterranean regions,
    making it a reliable sighting for birders visiting suitable habitat. Its combination
    of bold plumage, vocal activity, and preference for accessible scrubland make
    it one of the more conspicuous and rewarding warblers to observe in its range.'
migration:
  sv: Sammetshätta är huvudsakligen en stannfågel i Medelhavsregionen och är därför
    endast en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten påträffas
    endast enstaka gånger norr om sitt ordinarie utbredningsområde och har dokumenterats
    i alla nordiska länder utom Island. Dessa norska fynd representerar troligen individer
    som dragit för långt norrut under utbredningen eller irrgäster. I sitt huvudsakliga
    utbredningsområde kring Medelhavet är sammetshätten en permanent bosatt art som
    inte genomför längre migrationszügen.
  en: '# Sardinian Warbler in Northern Europe


    The Sardinian Warbler is primarily a resident or short-distance migrant of the
    Mediterranean region and does not regularly occur in Scandinavia or Northern Europe.
    This species is essentially absent from the Nordic countries throughout the year,
    as its range is confined to southern Mediterranean habitats. The bird is generally
    non-migratory or exhibits only limited seasonal movements within its Mediterranean
    breeding range, remaining in the region year-round or moving only locally between
    suitable scrubland and maquis habitats.'
