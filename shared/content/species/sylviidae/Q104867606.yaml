description:
  sv: '# Höksångare


    Höksängaren är en relativt stor och kraftig tätting med ett karakteristiskt gult
    öga. Den mest påfallande känneteckningen är den hökliknande tvärbandningen på
    undersidan, vilket har gett den dess namn. Fågeln har en kraftfull framtoning
    jämfört med många andra sångare.


    Arten häckar i östra Europa och västra Asien, där den föredrar igenväxande buskmarker.
    Under vintern är den långflyttare som drar till Östafrika för att söka föda. Under
    häckningstiden är höksångaren bosatt i täta buskbestånd där den söker föda och
    bygger bo.


    Enligt IUCN-klassificering är arten livskraftig på global nivå. Dock är den hotad
    i vissa randområden av sitt utbredningsområde, där populationerna är mindre stabila
    och mer sårbara för förändringar i habitatet.'
  en: '# Barred Warbler


    The Barred Warbler is a warbler species found across temperate regions of central
    and eastern Europe and western Asia, with populations wintering in tropical eastern
    Africa. This strongly migratory passerine undertakes considerable seasonal journeys
    between its breeding grounds and wintering quarters.


