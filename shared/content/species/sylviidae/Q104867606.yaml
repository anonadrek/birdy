migration:
  sv: '# Höksångare – Migration i Norden


    Höksångare är en långdistansflytt som häckar i östeuropa och västra Asien. Arten
    ankommer till häckningsområdena under våren och häckar i igenväxande buskmarker.
    Under hösten genomför den en omfattande migration västerut och söderut för att
    övervintra i Östafrika. I Sverige är arten hotad och förekommer endast sporadiskt
    i vissa randområden under häckningstiden. Fågeln är således inte närvarande i
    Skandinavien under vintermånaderna.'
  en: The Barred Warbler is a strongly migratory species that breeds across central
    and eastern Europe, including parts of Scandinavia. Birds arrive in spring from
    their tropical East African wintering grounds, typically during May. They establish
    breeding territories throughout the summer months before beginning their autumn
    migration, which occurs from August onwards. The species completely vacates Scandinavian
    breeding areas by September or early October as populations move south towards
    their African wintering grounds. The Barred Warbler is therefore absent from northern
    Europe during winter months, returning exclusively as a breeding visitor during
    the warmer season.
