description:
  sv: '# Törnsångare


    Törnsångaren är en medelstor sångfågel som tillhör familjen sylvior. Den är en
    klassisk medlem av sitt släkte med grå ovansida, vit undersida och karakteristisk
    röd ansiktsmask. Hanen under häckningstiden är särskilt påfallande med sin röda
    ansikte och halsmärkning, medan honan är mer diskret färgad.


    Denna art föredrar öppna landskap med låg vegetation, buskar och snår där den
    jagar småinsekter. Törnsångaren är en rastlös och aktiv fågel som ofta ses hoppa
    mellan buskarna. Under häckningstiden är hanen mycket vokal och framför en energisk,
    något raspig sång från exponerade platser. Arten är en långdistansflyttare som
    häckar över stora delar av sitt utbredningsområde under sommaren och återvänder
    till tropiska Afrika för att övervintra.


    Beståndet av törnsångare anses vara stabilt och arten ökar i antal inom mycket
    av sitt häckningsområde. Det gör den till en relativt vanlig och välanpassad art
    inom sitt ekologiska nisch.'
  en: '# Common Whitethroat


    The Common Whitethroat is a small, active warbler found breeding across temperate
    Europe and western Asia, with populations wintering in tropical Africa, Arabia,
    and Pakistan. It is a strongly migratory species, undertaking long-distance journeys
    between its breeding and wintering grounds.


    This small passerine is characterized by its distinctive appearance, featuring
    a grey head, buff-brown upperparts, and a notably white throat that gives the
    species its name. It is a restless, energetic bird, often seen skulking in dense
    vegetation and scrubby habitats where it forages for insects. The Common Whitethroat
    has a distinctive, scratchy song delivered from exposed perches or in short, fluttering
    display flights.


    The species prefers open woodlands, hedgerows, and scrubland with plenty of low
    vegetation for cover and breeding. It is commonly observed in farmland and cultivated
    areas with scattered bushes, where it nests low in dense shrubs. The Common Whitethroat''s
    breeding season involves elaborate territorial displays and vocalizations, particularly
    from males establishing and defending breeding territories.'
migration:
  sv: '# Törnsångare i Skandinavien och Nordeuropa


    Törnsångaren är en regelbunden häckfågel i Skandinavien och återstoden av Nordeuropa
    under sommaren. Arten anländer från sitt afrikanskt vinterkvarter under vårens
    senare del, vanligtvis april-maj, för att häcka i öppna landskap med buskar och
    snår. Under hösten, från augusti-september, påbörjar arten sin migration söderut
    mot tropiska Afrika där den tillbringar vintern. Beståndet i regionen är stabilt
    och ökar.'
  en: '# Common Whitethroat in Northern Europe


    The Common Whitethroat is a strongly migratory species in Scandinavia and Northern
    Europe. Birds arrive in spring from late April through May after wintering in
    tropical Africa, Arabia, and Pakistan. They breed throughout the region during
    the summer months, establishing territories in open scrubland and hedgerows. In
    late summer and early autumn, typically from July onward, they begin their southbound
    migration, departing Scandinavia by September to return to their African and Asian
    wintering grounds. The species is entirely absent from Northern Europe during
    winter months.'
