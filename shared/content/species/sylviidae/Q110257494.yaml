description:
  sv: '# Ökensångare


    Ökensångare är en liten tätting som häckar i halvöken och torr stäpp i Centralasien,
    från Kaspiska havet till Kina och Mongoliet. Under vintern flyttar arten till
    varmare områden från nordöstra Afrika via Arabiska halvön till Indien. Det är
    endast en sällsynt gäst i Västeuropa.


    Arten är liten och diskret, anpassad för sitt torra habitat. Som många andra sylvior
    är ökensångaren en försiktig fågel som föredrar att hålla till låg vegetation.
    Den är relativt vanlig inom sitt huvudutbredningsområde och klassificeras av IUCN
    som livskraftig.


    Ökensångaren är en långdistansflytt som följer årliga säsongmönster mellan sin
    häckningsområde i Centralasien och sina övervintringsplatser i södra och västra
    Asien samt Afrika.'
  en: '# Asian Desert Warbler


    The Asian desert warbler is a small, drab warbler of central and western Asia,
    breeding across arid regions and migrating to similar habitats in southwestern
    Asia and northeastern Africa during winter. It was recently split from the closely
    related African desert warbler, with which it shares an evolutionary history;
    the two species remain each other''s nearest relatives, though their exact affinities
    to other typical warblers remain unclear.


    This warbler is cryptically plumaged in browns and buffs, making it well-suited
    to desert environments. Females resemble richly coloured common whitethroats,
    a potential source of confusion for observers. The species is typically inconspicuous,
    favoring sparse scrubland and desert vegetation where it forages among low bushes
    and on the ground.


    Little detailed information is available on its vocalizations and behaviour, though
    like other desert warblers it is likely elusive and difficult to observe. The
    Asian desert warbler occupies a basal position within the genus Curruca, suggesting
    it represents a more ancestral form compared to many other typical warblers.'
migration:
  sv: '# Ökensångare i Skandinavien och Nordeuropa


    Ökensångare är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    i Centralasien och övervintrare i nordöstra Afrika, Arabiska halvön och Indien.
    Som sällsynt gäst i Västeuropa förekommer den endast sporadiskt inom regionen,
    utan något regelbundet migrationsmönster till Skandinavien. Observationer i Nord-
    och Västeuropa är mycket ovanliga och kan inte förutsägas enligt normala migrationsmönster
    för området.'
  en: '# Asian Desert Warbler (Curruca nana) in Northern Europe


    Migration data unavailable for this species.


    The Asian Desert Warbler breeds in central and western Asia and the extreme eastern
    edge of Europe, with populations migrating to southwestern Asia and northeastern
    Africa for winter. However, this species does not naturally occur in Scandinavia
    or Northern Europe during any season. Its range is confined to arid regions of
    Asia and does not extend into Scandinavian territories, making it irrelevant for
    a Northern European bird guide.'
