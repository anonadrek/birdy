  en: 'Migration data unavailable for this species.


    The Yemen Warbler is endemic to the Arabian Peninsula, occurring only on the southeastern
    slope of the Sarawat Mountains in Yemen and Saudi Arabia. Given its restricted
    range in tropical and subtropical dry forests of the Middle East, this species
    does not occur naturally in Scandinavia or Northern Europe, and therefore has
    no documented migration patterns relevant to the Nordic region.'
