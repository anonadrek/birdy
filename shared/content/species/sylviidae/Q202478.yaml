description:
  sv: '# Trädgårdssångare


    Trädgårdssångare är en liten och diskret fågel med brungröngrå fjäderdräkt som
    lätt kan förväxlas med andra små sångare. Den saknar markanta karaktärsdrag men
    är ändå möjlig att identifiera för den tränade ögatorn. Fågeln är talrik på sitt
    utbredningsområde och IUCN kategoriserar arten som livskraftig.


    Arten häckar i större delen av Europa och österut till västra Sibirien, där den
    föredrar tätare vegetation och buskiga miljöer. Under vintern genomför trädgårdssångaren
    en lång migrationsresa till tropiska Afrika för att söka föda. Fågeln är en aktiv
    förare som ofta ses hoppa mellan grenar när den jagar insekter, vilket är huvuddelen
    av dess diet.'
  en: '# Garden Warbler


    The garden warbler is a small, plain warbler that breeds across most of Europe
    and into western Siberia. It is characterised by uniform brown upperparts and
    dull white underparts, with a notably long tail and wings. Males and females look
    identical, as do juveniles, making this species notoriously difficult to distinguish
    from other unstreaked warblers in the field. Its two subspecies are very similar
    and interbreed where their ranges overlap.


    This warbler is an accomplished vocalist, producing a rich, melodic song that
    rivals that of its closest relative, the blackcap. The two species often compete
    for territory when breeding in the same woodland habitats. The garden warbler
    inhabits a variety of wooded and scrubby environments, where it hunts insects
    and forages for berries.


    Its lack of distinctive field marks means the garden warbler is often identified
    by process of elimination among similar species, combined with habitat and behaviour
    observations. Despite its plain appearance, its beautiful song makes it a sought-after
    species for birdwatchers and ornithologists studying warbler populations across
    its extensive Palearctic range.'
migration:
  sv: '# Trädgårdssångare – Förekomst i Skandinavien/Nordeuropa


    Trädgårdssångaren är en långflyttare som häckar i större delen av Europa, inklusive
    Skandinavien och Nordeuropa. Arten anländer till sitt häckningsområde under våren,
    typiskt från april-maj, efter sin långa övervintring i tropiska Afrika. Under
    hösten, från augusti-september, återvänder fågeln söderut för att undvika de kalla
    nordeuropeiska vintermånaderna. Under vintermånaderna förekommer arten inte i
    Skandinavien utan befinner sig istället i sitt afrikanska övervintringsområde.'
  en: '# Garden Warbler Migration in Scandinavia


    The Garden Warbler is a summer visitor to Scandinavia and northern Europe, arriving
    in late April and May to breed in woodland and scrubland habitats. Breeding populations
    are widespread across the region during the spring and summer months. In autumn,
    typically from August onwards, these warblers undertake a complete migration southward,
    departing Scandinavia by September. They winter in sub-Saharan Africa, primarily
    in savanna and woodland regions south of the Sahara. The species shows strong
    philopatry and annual site fidelity, with individuals returning to similar breeding
    territories each spring after their long-distance migration.'
