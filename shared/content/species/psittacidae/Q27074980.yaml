description:
  sv: ''
  en: '# Blue-crowned Parakeet


    The Blue-crowned Parakeet is a small parrot with predominantly green plumage and
    a distinctive bright blue crown, complemented by a pale beak. It measures approximately
    23 centimetres in length, making it a compact member of the parrot family.


    This species favors open and semi-open habitats, including savannas, woodlands,
    and forest margins. It deliberately avoids dense humid forests, preferring environments
    with scattered trees and more open canopy structure. The Blue-crowned Parakeet
    is highly social, typically found in pairs or small flocks that move actively
    through its chosen habitat while feeding and roosting.


    The species is widespread across much of northern and central South America, with
    populations established across a considerable geographic range. It feeds primarily
    on seeds, fruits, and vegetation, and like other parakeets, it is vocal and active
    during daylight hours. Its calls are characteristic sharp, screeching notes typical
    of conures. The Blue-crowned Parakeet remains relatively common throughout much
    of its natural range, where suitable open woodland habitat persists.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Blue-crowned Parakeet is a Neotropical species native to South America and
