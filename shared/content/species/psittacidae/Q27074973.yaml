description:
  sv: ''
  en: '# Nanday Parakeet


    The nanday parakeet is a medium-small parrot with predominantly green plumage
    that immediately catches the eye with its distinctive black hood covering the
    head and upper neck. Its name derives directly from this striking black facial
    marking. The bird displays bright red feathers on its thighs and under-tail coverts,
    creating a vivid contrast against the green body. It is native to continental
    South America, inhabiting open woodlands, grasslands with scattered trees, and
    cultivated areas.


    In behaviour, it is a highly social and gregarious species, typically seen in
    flocks that can be quite vocal and energetic. The nanday parakeet is active and
    acrobatic, spending much of its time foraging in trees for seeds, fruits, and
    vegetation. Its call is loud and characteristic—a distinctive series of screeches
    and chattering sounds that often announce its presence before it is seen.


    These parakeets are adaptable birds found in various habitats across their range,
    from humid lowlands to drier regions. They have become established as feral populations
    in some temperate areas outside their native range, testament to their hardiness
    and ability to thrive in diverse environments. Flocks can be observed flying swiftly
    through open country, their green bodies silhouetted against the sky.'
