description:
  sv: ''
  en: '# Mitred Parakeet


    The mitred parakeet is a medium-sized parrot native to South American mountain
    forests, where it inhabits regions in Argentina, Bolivia, and Peru. It has also
    established populations in Uruguay and, through introduction, in parts of the
    United States including California, Florida, and Hawaii.


    This social bird is highly gregarious, often seen in flocks that can be quite
    vocal and conspicuous in flight. It displays characteristic parakeet behaviour,
    moving rapidly through forest canopy and open woodlands while foraging for seeds,
    fruits, and vegetation. The species is active and energetic, with a preference
    for higher elevations in its native range.


    Like many parakeets, it produces loud, harsh calls that are distinctive in its
    habitats. Its adaptability to various environments has enabled it to thrive outside
    its native range, making it one of the more successful parrot introductions in
    temperate regions. The bird remains relatively common throughout its range, both
    native and introduced.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Mitred Parakeet is native to South America (Argentina, Bolivia, and Peru)
    and does not naturally occur in Scandinavia or Northern Europe. While the species
    has established populations in parts of the United States and Uruguay through
    human introduction, there is no documented evidence of this species occurring
    in Scandinavian or Northern European regions, whether as a migrant, vagrant, or
    established population. Therefore, information about its occurrence throughout
    the year in this region cannot be provided.'
