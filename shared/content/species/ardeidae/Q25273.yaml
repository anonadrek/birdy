description:
  sv: '# Gråhäger


    Gråhäger är en stor och imponerande häger som tillhör pelikanfåglarnas ordning.
    Det är en långbent vadare med slank hals, spetsig näbb och grå fjäderdräkt. Arten
    är ofta den enda hägerarten som förekommer i norra delen av sitt utbredningsområde.


    Gråhägern är en skicklig fiskare som står stilla i vattnet eller vadande längs
    stränder och sjöar för att snappa upp sitt byte. Det är en tystlåten fågel, men
    under häckningsperioden ger det fram olika läten från sitt häckningslokal. Arten
    uppträder oftast ensam eller i par, men samlas ibland vid rikliga födokällor.


    Gråhägern är vida spridd över Europa, Asien och Afrika. Den förekommer vid sjöar,
    vattendrag, kuster och våtmarker där det finns möjlighet att fiska. Populationen
    är relativt stabil i många områden, och fågeln är en känd skådeplaatts vid många
    växter där vadare söker föda.'
  en: '# Grey Heron


    The grey heron is a large, long-legged wading bird found across temperate regions
    of Europe, Asia, and parts of Africa. It is a striking bird with grey upperparts
    and a white underside, featuring a distinctive dark stripe running above each
    eye. Some northern populations migrate southwards in autumn, while others remain
    resident year-round in their territories.


    This patient hunter frequents wetland habitats including lakes, rivers, ponds,
    marshes, and coastal areas. It employs two distinct feeding strategies: standing
    motionless beside or in shallow water waiting for prey to pass, or slowly stalking
    through shallows with deliberate steps. It feeds predominantly on fish and other
    aquatic creatures captured with rapid strikes of its sharp bill.


    Grey herons are generally solitary or found in pairs, though they may gather at
    productive feeding sites. They produce a variety of harsh, croaking calls, particularly
    during breeding season. Their slow, ponderous flight with deeply bowed wings is
    distinctive, making them instantly recognizable as they travel between roosting
    and feeding areas. Their presence indicates healthy wetland ecosystems.'
migration:
  sv: '# Gråhäger – Förekomst i Skandinavien och Nordeuropa


    Gråhägern förekommer året runt i Skandinavien och Nordeuropa, men dess närvaro
    varierar säsongsvis. Under sommaren häckar arten utbredd över regionen, men många
    individer drar bort under hösten när vattnen börjar frysa till. Gråhäger som stannar
    kvar under vintern är ofta bundna till öppna vatten vid kuster, större sjöar och
    älvar. Återkomsten på häckningsplatserna sker tidigt på våren när isen börjar
    gå upp. Arten är många nordeuropeiska områdens enda hägerart och spelar därmed
    en viktig roll i våtmarksekosystemen.'
  en: '# Grey Heron Migration in Northern Europe


    The Grey Heron is primarily resident throughout much of Scandinavia and Northern
    Europe, with many birds remaining year-round in their territories. However, northern
    populations exhibit partial migration, with some individuals moving southward
    during autumn months as water bodies freeze over, reducing feeding opportunities.
    Birds typically return to breeding grounds in late winter and early spring, with
    peak arrival occurring in February through March. The timing of departure and
    return varies considerably depending on winter severity and local ice conditions,
    making this species an irregular migrant in the northernmost regions of its range.'
