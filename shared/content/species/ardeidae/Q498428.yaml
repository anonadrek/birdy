description:
  sv: '# Rishäger


    Rishägern är en sydasiatisk häger som förekommer från Persiska viken österut genom
    Indien och Sri Lanka till Myanmar. Den är en vanlig fågel vid olika typer av våtmarker,
    både kustområden och inlandsvatten.


    Till skillnad från många andra härfåglar ses rishägern ofta ute i öppna miljöer
    snarare än gömda i täta vassområden. Den är väl anpassad till sitt våtmarksekoystem
    och utgör ingen konservationsbrist enligt IUCN, som klassificerar arten som livskraftig.'
  en: '# Indian Pond Heron


    The Indian pond heron is a small heron found across a wide range from southern
    regions through the Indian subcontinent to nearby areas. It is widespread and
    common throughout its range, though easily overlooked due to its inconspicuous
    habits and preference for remaining close to water edges and human settlements.


    This species is a skilled hunter, stalking prey at the margins of small water
    bodies with patient, deliberate movements. It often roosts near human habitations,
    blending seamlessly into its surroundings. The bird''s cryptic behavior and modest
    size make it surprisingly easy to miss even when present in suitable habitat,
    earning it the alternative name "paddybird."


    The Indian pond heron favors shallow freshwater environments such as ponds, marshes,
    and small watercourses where it can hunt for fish, frogs, and aquatic invertebrates.
    Its adaptability to human-modified landscapes, including agricultural areas and
    village ponds, has enabled it to thrive across much of its range. The species
    remains one of the most abundant herons in its region despite being frequently
    overlooked by casual observers.'
migration:
