description:
  sv: ''
  en: '# Black-crowned Night Heron


    The black-crowned night heron is a medium-sized heron with a distinctive appearance:
    it has a black cap and back, pale underparts, and striking red eyes. In flight,
    it shows broad wings and a compact body shape. It is primarily nocturnal, remaining
    hidden in dense vegetation during the day and becoming active at dusk to hunt
    fish, frogs, and other aquatic prey in shallow water.


    This species is highly vocal at night, producing harsh, guttural calls that echo
    across wetlands. Its hunched posture when perched is characteristic, quite different
    from the upright stance of larger herons. The bird often stands motionless for
    extended periods while hunting, relying on patience to ambush prey.


    Found across much of the world, including parts of Europe, Asia, and both American
    continents, the black-crowned night heron inhabits wetlands, marshes, and lakesides
    with suitable cover. It typically nests in colonies, often in trees or reed beds
    near water. In Australasia, it is replaced by the closely related Nankeen night
    heron, with which it occasionally hybridises where their ranges overlap.'
migration:
  sv: ''
  en: '# Black-crowned Night Heron in Scandinavia/Northern Europe


    The Black-crowned Night Heron is a rare and irregular visitor to Scandinavia and
    Northern Europe, with no established breeding population in the region. Sightings
    occur primarily during late spring and autumn migration periods, typically from
    May onwards and again in August-September, when individuals disperse from their
    main breeding grounds in southern and central Europe. Most records come from coastal
    areas and wetlands. Winter occurrences are exceptional, as the species does not
    overwinter in Scandinavian latitudes. The species remains uncommon and unpredictable
    in the north, appearing mainly as a vagrant during migration rather than as a
    regular seasonal visitor.'
