description:
  sv: ''
  en: '# Yellow Bittern


    The yellow bittern is a small member of the heron family found across Asia. It
    breeds from the northern Indian subcontinent eastward through Russia and Japan
    to Indonesia. Most populations are resident year-round, though birds from northern
    regions undertake short migrations. Vagrants occasionally appear well outside
    the normal range, with records from Alaska.


    This compact bittern inhabits reed beds and marshy wetlands where it hunts small
    fish, frogs, and aquatic insects. It is a secretive, solitary bird more often
    heard than seen, remaining concealed within dense vegetation. Like other bitterns,
    it produces distinctive booming calls during breeding season.


    The species is characterized by its warm buff and yellow plumage with darker markings,
    giving it excellent camouflage among reeds and rushes. Its small size and cryptic
    habits make it challenging to observe, though patient watchers at suitable wetland
    habitats may glimpse it perched or slowly stalking through shallow water.'
migration:
  sv: ''
  en: '# Yellow Bittern (*Botaurus sinensis*) in Northern Europe


    Migration data unavailable for this species. The yellow bittern''s range extends
    from the Indian subcontinent eastward to the Russian Far East and Japan, with
    populations in Indonesia. While primarily resident throughout its range, some
    northern populations undertake short-distance migrations. However, the species
    has not been documented as a regular migrant or winter visitor to Scandinavia
    or Northern Europe, with only accidental vagrant records known from distant regions
    like Alaska.'
