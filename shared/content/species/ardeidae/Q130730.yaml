description:
  sv: ''
  en: '# Great Egret


    The great egret is a large, white heron found across tropical and warmer temperate
    regions worldwide, with four subspecies distributed throughout Asia, Africa, the
    Americas, and southern Europe. It has recently expanded its range northward into
    cooler European areas, indicating a shift in its distribution patterns.


    This species is highly social and colonial in its breeding habits. It builds stick
    nests in trees, often in large groups positioned close to water bodies. The great
    egret hunts in shallow water, stalking fish and other aquatic prey with characteristic
    deliberate movements. It is generally silent outside the breeding season, though
    it produces various calls during nesting, including croaks and bill-clattering
    sounds used in pair bonding and territorial displays.


    The bird''s pure white plumage makes it unmistakable among herons. It is noticeably
    larger and more robust than smaller white egret species, with a long neck, pointed
    yellow bill, and dark legs. During breeding season, it develops filoplumes—wispy
    plumes along the back and neck. It frequents wetlands, marshes, lake edges, and
    river valleys wherever shallow water provides good hunting opportunities.'
migration:
  sv: ''
  en: '# Great Egret (Ardea alba) in Northern Europe


    The Great Egret has historically been absent or extremely rare in Scandinavia
    and Northern Europe, being primarily a tropical and warm temperate species. However,
    in recent decades, the species has begun expanding its range northward into more
    northern areas of Europe, including Scandinavia. This range expansion is likely
    linked to climate change and increasing water temperatures. While the species
    now appears with growing frequency in southern Scandinavia during late summer
    and autumn, it remains primarily a summer visitor rather than a year-round resident.
    Regular overwintering in Northern Europe is still uncommon, with most individuals
    returning to southern regions or Africa during winter months.'
