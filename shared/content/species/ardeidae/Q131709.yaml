description:
  sv: '# Silkeshäger


    Silkeshäger är en liten vit häger från samma familj som större arter. Den är lätt
    att känna igen på sin vita färg och eleganta skepnad. Arten förekommer i Gamla
    världen och liknar snöhägern från Nya världen, men silkeshägern är densens närmare
    släkting.


    Historiskt jagades silkeshägern intensivt för sina vackra fjädrar, men arten har
    sedan dess återhämtat sig väl. Dagens bestånd anses vara livskraftigt och arten
    är långt ifrån hotad. Denna framgång är ett exempel på hur fågelpopulationer kan
    återställas när hot elimineras.'
  en: '# Little Egret


    The little egret is a small, elegant white heron with a distinctive slender black
    beak and long black legs. In western populations, it displays bright yellow feet
    that contrast sharply with its dark legs—a useful identifying feature. The bird''s
    refined appearance and graceful movements make it a pleasure to observe in suitable
    habitats.


    It is primarily an aquatic forager, hunting in shallow water and on land for small
    fish, crustaceans, and other prey. The little egret often feeds with deliberate,
    careful movements, stalking prey methodically. It is a colonial breeder, frequently
    nesting alongside other waterbirds. Pairs construct platform nests from sticks
    in trees, bushes, or reed beds, where females lay three to five bluish-green eggs.
    Both parents share incubation duties for about three weeks, and young fledge at
    around six weeks old.


    The little egret frequents shallow wetlands, coastal areas, and freshwater habitats
    where small prey is abundant. It has become increasingly common in many regions
    in recent decades, expanding its range northward and inland. The species is often
    seen singly or in small groups, though larger gatherings occur at favored feeding
    and roosting sites.'
migration:
  sv: Silkeshägern är en expansiv art i Europa och har under de senaste decennierna
    utökat sitt utbredningsområde norrut. I Skandinavien förekommer arten framför
    allt som sommargäst under våren och sommaren, med ankomst från april-maj. Under
    hösten drar fåglarna bort till sina övervintringsområden i Medelhavsregionen och
    Afrika. Genom miljöförbättringar och minskat jaktövergrepp har populationen ökat
    kraftigt, vilket möjliggjort en nordligare utbredning. Idag kan silkeshägern ses
    regelbundet längs Sveriges och Norwegens kustzoner under främst maj-september,
    även om förekomsten varierar mellan åren beroende på väderförhållanden.
  en: '**Migration data unavailable for this species.**


    The provided source text contains only information about the Little Egret''s physical
    characteristics, feeding behaviour, and breeding biology, with no details regarding
    its migration patterns, seasonal occurrence, or distribution throughout the year
    in Scandinavia or Northern Europe.'
