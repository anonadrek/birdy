description:
  sv: ''
  en: '# Little Heron


    The little heron is a diminutive member of the heron family, standing just 44
    centimetres tall. It inhabits both freshwater and saltwater environments across
    tropical regions of the Old World, ranging from western Africa through to Japan
    and Australia. It is predominantly sedentary, remaining in its preferred habitats
    year-round rather than undertaking long migrations.


    This species was historically classified as conspecific with the striated heron,
    but taxonomic revision has since recognized it as a distinct species. The little
    heron''s small size distinguishes it from most other herons, making it well-suited
    to hunting in confined spaces such as mangrove margins and densely vegetated wetlands
    where larger herons would be less effective.


    Further detailed information about its specific plumage patterns, vocalizations,
    and hunting behaviour would require additional sources beyond the introductory
    material provided.'
