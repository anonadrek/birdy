description:
  sv: ''
  en: '# Western Reef Heron


    The western reef heron is a medium-sized coastal heron with a variable appearance
    depending on geographic location and individual variation. It occurs in three
    main plumage forms: slaty-grey, pure white, and black with a white throat. The
    white form resembles the little egret but can be distinguished by its larger,
    paler bill. The grey form may be confused with the uncommon dark morph of the
    little egret, though the reef heron differs in size and structure. It is found
    in southern Europe, Africa, and parts of Asia, typically in coastal habitats.


    The western reef heron forages differently from the little egret, with distinctive
    hunting behaviour adapted to reef environments. Its behaviour and structural differences
    help separate it from similar species where ranges overlap. The species'' taxonomy
    remains somewhat debated, with some authorities considering different populations
    as subspecies of the little egret rather than a separate species.'
migration:
  sv: ''
  en: '# Western Reef Heron in Northern Europe


    The Western Reef Heron is not a regular occurrence in Scandinavia or Northern
    Europe. This species is primarily found in southern Europe, Africa, and parts
    of Asia with a mainly coastal distribution. While it occasionally appears as a
    vagrant in southern European regions, there is no established migration pattern
    or regular seasonal presence documented for Scandinavia or Northern Europe. Any
    sightings in these northern areas would represent rare or accidental occurrences
    rather than predictable migratory movements.'
