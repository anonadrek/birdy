description:
  sv: '# Rallhäger


    Rallhägern är en liten häger tillhörande familjen Ardeidae. Den häckar främst
    i Mellanöstern och Afrika, men förekommer även lokalt i Sydeuropa. Arten ses endast
    sällsynt utanför sitt naturliga utbredningsområde, och i Sverige har den dokumenterats
    vid omkring tjugo tillfällen.


    Globalt bedöms rallhägerns bestånd som livskraftigt, vilket innebär att arten
    inte utgör någon större bevarandehöjd. För den intresserade fågelskådaren är arter
    som denna ofta särskilt värdefulla att följa, då de utgör ovanliga fynd när de
    väl uppträder utanför sitt vanliga område.'
  en: '# Squacco Heron


    The Squacco Heron is a small heron measuring 44–47 cm in length with a wingspan
    of 80–92 cm. It is a species of Old World origin, breeding in southern Europe
    and the Greater Middle East. This diminutive heron inhabits wetland environments
    where it hunts for fish, frogs, and aquatic invertebrates in shallow waters.


    In appearance, the Squacco Heron displays subtle plumage that provides excellent
    camouflage among reed beds and marsh vegetation. Its small size and compact build
    distinguish it from larger heron species. When alarmed or in flight, it reveals
    white wings and back that contrast with its darker head and neck.


    The species is typically solitary or found in small groups, often remaining motionless
    for extended periods while hunting. It is a migratory bird, arriving at breeding
    grounds in spring and departing in autumn. The Squacco Heron''s quiet nature means
    it is often overlooked, though its presence can be detected by watching for movement
    in shallow water margins and wetland edges during dawn and dusk hours.'
migration:
  sv: '# Rallhäger – Förekomst i Skandinavien/Nordeuropa


    Rallhägern är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    främst i Mellanöstern och Afrika, med endast lokala populationer i Sydeuropa.
    I Sverige har den noterats vid omkring tjugo tillfällen och förekommer helt oregelbundet
    som en vagabund utanför sitt normala utbredningsområde. Det finns ingen etablerad
    migrationsmönster för arten i regionen, utan framförandet av rallhäger i norra
    Europa måste betraktas som sällsynta avvikelser från dess huvudsakliga distribution.'
  en: '# Squacco Heron in Northern Europe


    The Squacco Heron is a rare vagrant to Scandinavia and Northern Europe, with only
    occasional records from these regions. As a breeding species, it is primarily
    confined to southern Europe and the Greater Middle East, making sightings in Scandinavia
    exceptional rather than regular. When individuals do appear in Northern Europe,
    they typically occur during spring and autumn migration periods, likely representing
    overshooting or displaced birds from their main range. The species is not considered
    a regular migrant through Scandinavian territories and should be regarded as an
    accidental visitor to this region.'
