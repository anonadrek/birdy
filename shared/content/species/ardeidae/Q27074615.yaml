  en: '# Medium Egret Migration in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Medium Egret is a resident breeder in southern and eastern Asia and does not
    occur naturally in Scandinavia or Northern Europe. This species has a purely Asian
    distribution and would be extremely rare as a vagrant to the region. Therefore,
    there is no established migration pattern, overwintering population, or regular
