description:
  sv: '# Mellanhäger


    Mellanhäger är en mellanstora häger som tillhör familjen hägrar. Arten förekommer
    i södra och östra Asien, där den utgör en naturlig del av våtmarkernas fågelfauna.
    Fram till nyligen omfattade arten även den afrikanska gulnäbbade hägern och den
    australiska plymhägern, men dessa urskiljs nu allmänt som egna arter.


    Mellanhägers bestånd anses vara livskraftigt och arten är inte klassificerad som
    hotad. Som många andra hägrar är den väl anpassad till liv i eller nära vatten,
    där den söker föda bland vegetation och i grund vatten.'
  en: '# Medium Egret


    The medium egret is a medium-sized heron that occupies a taxonomic middle ground,
    with some ornithologists classifying it within the genus Egretta or Mesophoyx
    rather than Ardea. It is primarily a resident breeder across southern and eastern
    Asia, where it maintains populations year-round in suitable habitats.


    The species shares the typical heron body plan with long legs and neck adapted
    for wading in aquatic environments. Like other egrets, it likely displays the
    white or pale plumage characteristic of many egret species, though the source
    material does not detail specific plumage characteristics. Its intermediate size
    places it between smaller egrets and larger heron species, making it distinguishable
    in the field when compared directly with related species.


    As a resident breeder, the medium egret establishes breeding colonies in its Asian
    range rather than undertaking long migrations. It inhabits wetland environments
    suitable for hunting small fish and aquatic prey. Birdwatchers seeking this species
    in appropriate regions should focus on freshwater and coastal wetlands where heron
    communities congregate.'
