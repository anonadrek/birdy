description:
  sv: ''
  en: '# Redwing


    The redwing is a compact thrush, noticeably smaller than the song thrush, with
    distinctive russet-red flanks and underwing coverts that give it its common name.
    Its upper parts are warm brown, and it has a cream-coloured eyebrow stripe and
    spotted breast. In flight, the flash of red under the wings is characteristic
    and helps identify it even from a distance.


    Redwings are highly social birds, often seen in flocks, particularly during migration
    and winter. They forage on the ground for invertebrates and berries, moving with
    a characteristic hopping gait. Their diet shifts seasonally, with insects dominating
    in summer and autumn berries and fallen fruits becoming increasingly important
    as winter approaches.


    The redwing''s call is a distinctive thin, high-pitched "seep" often heard during
    migration. Its song, heard mainly on breeding grounds, is a pleasant, varied warble.
    The species is native to northern and eastern Europe and the wider Palearctic
    region, with many populations undertaking significant migrations to spend winter
    in milder areas.'
migration:
  sv: ''
  en: '# Redwing (Turdus iliacus) in Northern Europe


    The redwing is a migratory thrush species that breeds throughout Scandinavia and
    northern Europe during the breeding season. Populations arrive in spring, typically
    from March onwards, to establish territories in woodlands, scrublands, and gardens.
    In autumn, redwings undertake significant southwestward migrations, departing
    breeding areas from August through October to overwinter in western Europe, the
    Mediterranean region, and North Africa. Some individuals remain in Scandinavia
    during milder winters, particularly in coastal areas and regions with access to
    unfrozen food sources. Spring return migration occurs primarily in February and
    March as breeding birds reclaim northern territories.'
