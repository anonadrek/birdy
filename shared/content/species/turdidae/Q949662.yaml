description:
  sv: '# Guldtrast


    Guldtrast är en stor trast som häckar i tajgans skogar från Uralbergen österut
    till Japan. Vintertid företar arten en långväga flyttning söderut till sydöstra
    Asien. Utanför sitt ordinarie utbredningsområde är guldtrasten mycket sällsynt
    i västra Europa, även om den påträffas då och då under flyttning. I Sverige är
    arten mycket ovanlig och har endast noterats ett fåtal gånger.


    Denna trast tillhör en artkomplex där gränserna mellan närbesläktade former ännu
    inte är helt klarlagd. Vissa taxonomer inkluderar sydöstasiatiska bestånd inom
    arten, medan detta är omöjligt att fastställa med säkerhet. Beståndet ses globalt
    som livskraftigt, även om antalet individer minskar på grund av habitatförlust.


    Guldtrasten föredrar skogliga miljöer där den söker föda på marken efter insekter
    och andra små djur. För den intresserade observatören är arten främst relevant
    under höstens flyttningsperiod, då sällsynta fynd kan inträffa långt västerut
    från dess vanliga habitat.'
  en: ''
migration:
  sv: '# Guldtrast – Utbredning och flyttning i Norden


    Guldtrast är en östasiatisk art som förekommer mycket sällsynt i västra Europa,
    inklusive Sverige där endast sex fynd är dokumenterade. Arten häckar i tajgaskogarna
    från Uralbergen österut till Japan under sommaren. Under vintermånaderna migrerar
    guldtrasten söderut till sydöstra Asien för att övervinta. I Skandinavien och
    västra Europa uppträder arten endast sporadiskt som en mycket sällsynt tillfällig
    gäst, utan ett etablerat migrations- eller övernintringsbeteende i regionen.'
  en: ''
