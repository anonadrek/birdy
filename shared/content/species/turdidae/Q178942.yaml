description:
  sv: ''
  en: '# Mistle Thrush


    The mistle thrush is a large, stocky thrush with distinctive pale grey-brown upperparts
    contrasting with its greyish-white chin and throat. Its underparts are pale yellow
    to off-white, heavily marked with black spots. Sexes are similar in appearance,
    making identification straightforward. The bird is notably larger and paler than
    related thrush species, with a robust build suited to its foraging behaviour.


    Known for its remarkably loud and far-carrying song, the mistle thrush is celebrated
    for singing persistently even in poor weather—a trait that earned it the old name
    "stormcock." This bold, emphatic song is one of the best ways to locate the species,
    particularly during breeding season. The bird is generally confident and territorial,
    though it can be wary when approached on the ground.


    The mistle thrush is widespread across much of Europe, temperate Asia, and North
    Africa. It is a year-round resident across much of its range, but birds from northern
    and eastern populations migrate southward in winter, sometimes traveling in small
    flocks. It frequents open woodlands, parks, and cultivated areas where mistletoe
    and berries provide food sources throughout the year.'
migration:
  sv: ''
  en: '# Mistle Thrush (Turdus viscivorus) in Scandinavia and Northern Europe


    The Mistle Thrush is a year-round resident throughout much of Scandinavia and
    Northern Europe, though populations show distinct migration patterns. Northern
    and eastern populations migrate southward during winter months, often traveling
    in small flocks to escape harsh conditions. Birds from southern and western regions
    typically remain as residents year-round. Spring arrival occurs in March-April
    as migratory birds return to breeding territories, while autumn departures take
    place from September through November as northern populations head toward wintering
    grounds in more temperate regions.'
