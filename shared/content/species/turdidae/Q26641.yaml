description:
  sv: '# Ringtrast


    Ringtrast är en medelstor trast som häckar i bergstrakter i Europa och västra
    Asien. Det är en migratorisk art som övervintrar i Medelhavsområdet. Arten är
    klassificerad som livskraftig enligt IUCN.


    Ringtrasten har ett karakteristiskt utseende med mörk fjäderdräkt och en vit eller
    ljusgrå halsbindning som ger arten sitt namn. Denna ringformade markering är särskilt
    tydlig hos hannen. Honan är något brunare än hanen men behåller den typiska halsbindningen.


    Arten förekommer i öppen och bergig miljö, ofta på höga höjder, där den söker
    föda bland stenar och på klippor. Som många andra trastar lever ringtrasten på
    insekter och bär.'
  en: '# Ring Ouzel


    The ring ouzel is a medium-sized thrush measuring 23–24 centimetres and weighing
    90–138 grams. Males are unmistakable, predominantly black with a striking white
    crescent marking across the breast. Females are considerably browner and duller,
    while young birds may lack the pale chest markings entirely. This distinctive
    appearance makes identification straightforward in its range.


    The ring ouzel is primarily a high-altitude breeder across much of Europe, inhabiting
    open mountain areas with scattered trees and shrubs, particularly juniper and
    other treeline conifers, alongside rowan, bilberry, heather, and alpenrose. It
    is a migratory species, abandoning breeding grounds in autumn to winter in southern
    Europe, North Africa, and Turkey, where it favours mountainous terrain with juniper.


    Breeding pairs produce clutches of 3–6 pale blue or greenish-blue eggs with brown
    flecks. Females incubate almost exclusively, with eggs hatching after approximately
    13 days. The young fledge within 14 days and remain dependent on their parents
    for a further 12 days. The species'' specialisation for mountain habitats and
    migratory lifestyle reflect its adaptation to dramatic seasonal changes across
    its European range.'
migration:
  sv: Ringtrast är en långflyttare som häckar i Skandinaviens och Norr-Europas bergstrakter
    under sommaren. Arten anländer till häckningsområdena under vårens lopp, typiskt
    från april till maj. Under hösten påbörjar fåglarna sin migration söderut, och
    arten övervintrar i Medelhavsregionen från oktober till mars. Ringtrast är därmed
    endast en säsongsbesökare i norra Europa och förekommer inte under vinterns kallaste
    månader.
  en: '# Ring Ouzel in Scandinavia/Northern Europe


    The ring ouzel is a migratory thrush that breeds in mountainous regions of Scandinavia
    and northern Europe during the breeding season. Birds arrive at their breeding
    grounds in spring, typically from April onwards, after wintering in southern Europe,
    North Africa, and Turkey. They occupy high-altitude mountain areas with scattered
    trees and shrubs, particularly those featuring juniper and rowan. Following the
    breeding season, ring ouzels depart their northern breeding grounds in autumn
    to return to their winter quarters in the Mediterranean region and beyond. This
    species is therefore absent from Scandinavian mountains during winter months,
    making it a strictly seasonal visitor to the region.'
