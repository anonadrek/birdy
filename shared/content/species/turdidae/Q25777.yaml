description:
  sv: ''
  en: '# Fieldfare


    The fieldfare is a robust thrush with distinctive plumage: a blue-grey head and
    rump contrast sharply with its warm chestnut back, while the underparts are buff-white
    with heavy dark spotting on the breast and flanks. In flight, the pale rump is
    particularly striking. It breeds across northern Europe and the Palearctic in
    open woodlands and scrub, but is strongly migratory, with populations shifting
    southward during winter months.


    This active, sociable thrush feeds opportunistically depending on the season.
    During summer breeding months, it hunts molluscs, insects, and earthworms on the
    ground. In winter, it switches to berries, grain, and seeds, often forming loose
    flocks that move through open landscapes searching for fruiting bushes. It is
    characteristically noisy and alert, often drawing attention to itself.


    The fieldfare winters in large numbers across the United Kingdom, southern Europe,
    North Africa, and the Middle East, though it rarely breeds in the British Isles.
    Its sudden arrivals and departures mark the changing seasons in temperate regions,
    making it a familiar winter visitor to many observers.'
migration:
  sv: ''
  en: '# Fieldfare (Turdus pilaris) in Scandinavia/Northern Europe


    The Fieldfare is a strongly migratory thrush species throughout Scandinavia and
    Northern Europe. It breeds widely across the region during spring and summer in
    woodland and scrub habitats. In autumn, typically from September onwards, northern
    populations undertake substantial southward migrations, with many birds moving
    to the United Kingdom, Southern Europe, North Africa, and the Middle East to overwinter.
    However, significant numbers remain in Scandinavia during winter, particularly
    in areas with abundant berry crops. Spring return migration occurs from March
    through May as breeding birds recolonize northern territories. The species is
    omnivorous, feeding on insects and earthworms during the breeding season and shifting
    to berries, grain, and seeds during winter months when invertebrate prey becomes
    scarce.'
