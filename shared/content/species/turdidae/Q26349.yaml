description:
  sv: '# Taltrast


    Taltrast är en medelstora trast med brun ovansida och karakteristisk gulvit eller
    gulbrun undersida täckt av svarta prickar. Det är denna distinktiva teckoning
    som gör arten lätt att identifiera i fält. Arten förekommer över stora delar av
    Palearktis och är utbredd långt österut mot Bajkalsjön, där den delas upp i två
    till fyra underarter beroende på klassificering.


    Arten är välkänd för sin vackra, karakteristiska sång som består av upprepade
    musikaliska fraser. Sången är mycket igenkännlig och har genom historien inspirerat
    många poeter och skribenter. Taltrasten är aktiv och observant, ofta skyggt men
    inte alltid svårtillgänglig för den uppmärksamme fågelskådaren.


    Taltrasten förekommer i varierade miljöer med träd och buskar, från skogsbryn
    till parker och trädgårdar. Det är en art som värdesätts både för sitt utseende
    och framför allt för sin enastående sång.'
  en: '# Song Thrush


    The song thrush is a medium-sized thrush with warm brown upperparts and distinctive
    cream or buff underparts heavily spotted with black. It is a relatively compact
    bird with a rounded head and alert posture. Four recognized subspecies exist across
    its breeding range in the West Palearctic region.


    The bird is most notable for its remarkable song, which consists of repeated musical
    phrases delivered from prominent perches. This distinctive vocalization has inspired
    numerous literary references throughout history. The song thrush is generally
    a solitary or paired bird, though it may gather in small groups during migration
    or winter.


    It inhabits woodlands, gardens, parks, and scrubland where there is sufficient
    ground cover for foraging. The species feeds primarily on invertebrates, particularly
    earthworms and snails, which it locates by hopping on the ground and listening
    intently. It is a migratory species across much of its range, though some populations
    remain year-round residents in milder regions.'
migration:
  sv: '# Taltrast - Förekomst i Skandinavien och Nordeuropa


    Taltrast är en regelbunden flyttfågel i Skandinavien och övriga Nordeuropa. Arten
    återvänder till häckningsområdena under april-maj efter att ha övervintrare i
    västra och södra Europa samt Nordafrika. Under sommaren häckar taltrastar allmänt
    i större delen av Sverige, Norge och Danmark. Innan hösten påbörjar de sin flyttning
    mot sydväst, vanligen från augusti till september, för att tillbringa vintermånaderna
    i mildare klimat. Mindre antal individer stannar också över vintern i södra Skandinavien
    under gynnsamma år. Arten är således en typisk säsongsflytt med tydlig återkomst
    på våren och avgång på hösten.'
  en: '# Song Thrush in Northern Europe


    The Song Thrush is a summer breeding visitor to Scandinavia and much of Northern
    Europe, arriving in spring (typically March–April) to establish territories in
    woodland, gardens, and hedgerows. Populations breed throughout the region during
    the warmer months. As autumn approaches (August–September), northern breeding
    birds migrate southwestward to winter in milder regions of western and southern
    Europe, the Mediterranean basin, and North Africa. However, some individuals,
    particularly from southern breeding populations, may remain year-round in sheltered
    coastal and lowland areas. Winter presence in Scandinavia is sporadic and weather-dependent,
    with harsh conditions often forcing birds to depart or perish.'
