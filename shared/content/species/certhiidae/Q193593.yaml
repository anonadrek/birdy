description:
  sv: ''
  en: '# Eurasian Treecreeper


    The Eurasian treecreeper is a small, distinctive bird with a notably curved bill
    perfectly adapted for extracting insects from bark crevices. It displays cryptic
    brown and buff plumage on its upperparts with whitish underparts, providing excellent
    camouflage against tree trunks. Its long, stiff tail feathers serve as a crucial
    prop, allowing it to maintain balance while spiraling up tree trunks in its characteristic
    creeping manner.


    This species is solitary and rather inconspicuous, spending most of its time searching
    methodically along tree bark for food. It typically works upward in a spiral pattern,
    then drops to the base of another tree to repeat the process. In winter, it may
    join mixed feeding flocks with other small birds.


    The Eurasian treecreeper''s song provides the most reliable identification feature,
    as it closely resembles the similar short-toed treecreeper across much of its
    range. The call is a high, thin "tsee" or "tsuit" sound. It inhabits deciduous,
    coniferous, and mixed woodlands, parks, and gardens with mature trees throughout
    much of temperate Eurasia, showing preference for areas with rough-barked specimens
    that offer abundant foraging opportunities.'
migration:
  sv: ''
  en: '# Eurasian Treecreeper - Seasonal Occurrence in Scandinavia/Northern Europe


    The Eurasian treecreeper is a year-round resident throughout much of Scandinavia
    and Northern Europe, though populations show some seasonal movement. Northern
    breeding populations migrate southwestward in autumn, with birds departing breeding
    areas from September onwards. Return migration typically occurs from March through
    May, with birds re-establishing territories on their breeding grounds. Southern
    populations are largely sedentary, remaining throughout winter. The species is
    most abundant during the breeding season (April-July) in suitable woodland habitats,
    but some individuals persist through winter in northern regions where suitable
    sheltered forests provide sufficient foraging opportunities.'
