description:
  sv: '# Trädgårdsträdkrypare


    Trädgårdsträdkryparen är en liten fågel i familjen trädkrypare som förekommer
    i de varmare delarna av Europa och Nordafrika. Det är en skicklig klättrare som
    rör sig upp för trädstammar på jakt efter små insekter och spindlar. Fågeln är
    svårdifferentierad från sin närbesläktade släkting större trädkrypare, men är
    generellt något mindre med kortare näbb.


    Trädgårdsträdkryparen är en diskret fågel som ofta förbises på grund av sin små
    storlek och färgteckning som passar väl in bland barkskuggor. Det föredrar lövträd
    och fruktträdgårdar framför barrnål, vilket skiljer det från större trädkrypare.
    Under häckningsperioden kan fågeln höras med sitt höga, tunna läte. Det är en
    året-runt bosatt art i större delen av sitt utbredningsområde.'
  en: '# Short-toed Treecreeper


    The short-toed treecreeper is a small passerine found across woodlands in warmer
    regions of Europe and north Africa, with a generally more southerly distribution
    than its close relative, the common treecreeper. Where their ranges overlap, the
    short-toed treecreeper shows a preference for deciduous trees and lower altitudes,
    making habitat selection useful for field identification between the two similar
    species.


    This bird is mainly sedentary, though occasional vagrants appear beyond the regular
    breeding range. Its small size and behaviour of creeping methodically up tree
    trunks in search of insects are typical of treecreepers. The short-toed treecreeper
    can be challenging to distinguish from the common treecreeper in the field, requiring
    careful attention to plumage details, call notes, and habitat preference for reliable
    identification.'
migration:
  sv: '# Trädgårdsträdkrypare – Förekomst i Skandinavien och Nordeuropa


    Trädgårdsträdkryparen förekommer inte naturligt som etablerad häckfågel i Skandinavien
    eller övriga Nordeuropa. Arten är i huvudsak utbredd i de varmare tempererade
    delarna av Europa och Nordafrika, där den är mestadels stationär. Endast sporadiskt
    registreras arten som en vilsefluggen gäst i norra Europa, främst under hösten
    och vintern. De enstaka observationer som gjorts i Skandinavien utgör alltså undantag
    snarare än en regelbunden migration eller övervintringsförekomst.'
  en: '# Short-toed Treecreeper in Northern Europe


    The Short-toed Treecreeper is primarily a resident species throughout its European
    range, showing sedentary habits year-round in established breeding territories.
    In Scandinavia and Northern Europe, it occurs only as a vagrant outside its main
    distribution, which is centered in warmer southern and central European regions.
    The species does not undertake regular seasonal migrations like some other treecreeper
    species, though occasional individuals may wander beyond their normal range, particularly
    during dispersal periods.


    Being largely non-migratory, this species does not follow predictable arrival
    or departure patterns in northern areas. Its presence in Scandinavia remains exceptional
    rather than routine, reflecting its strong preference for the milder climates
    and deciduous woodland habitats of southern Europe. The species is not considered
    a regular winter visitor or migrant through the Nordic region.'
