description:
  sv: ''
  en: '# Plain Swift


    The plain swift is a medium-sized swift belonging to the Apodidae family. Though
    it superficially resembles barn swallows or house martins, it is not closely related
    to these passerine birds. The similarities between these groups represent convergent
    evolution, reflecting their comparable aerial lifestyles and hunting strategies.


    This swift shares the characteristic features of its family: a streamlined body
    adapted for swift, agile flight and a diet consisting entirely of insects caught
    in mid-air. Like other swifts, it spends most of its life airborne, only visiting
    land to breed and roost.


    The plain swift is distributed across its range in suitable habitats where it
    can hunt insects in open airspace. It typically inhabits areas near cliffs, mountains,
    or buildings that provide appropriate nesting sites. The species favors warm,
    dry regions where insect prey is abundant.'
