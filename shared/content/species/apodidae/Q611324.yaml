description:
  sv: '# Stubbstjärtseglare


    Stubbstjärtseglare är en mycket liten medlem av seglaarfamiljen med karakteristisk
    kort stjärt. Arten är närmast släkt med husseglaren och de två behandlades tidigare
    som en enda art. Den förekommer huvudsakligen i Afrika, Mellanöstern och Asien,
    men är mycket sällsynt längre norrut i Europa.


    Denna små fågel är en skicklig flygare som jagar insekter högt upp i luften. Den
    är mest aktiv under dagtid och spenderar mycket av sin tid på vingarna. Arten
    föredrar urbana områden och byggnadsmiljöer där den gärna häckar i kolonier.


    Stubbstjärtseglaren är en utpräglad långflyttare som söker sig till områden med
    gott om flygande insekter. På sitt hemmaplan i Afrika och Asien är den relativt
    vanlig, men endast mycket enstaka individer når fram till Europas nordligare delar.'
  en: '# Little Swift


    The little swift is a small, compact swift found across Africa and southwestern
    Asia, with populations occasionally appearing in southern Europe. It resembles
    other swifts in its streamlined, dark plumage adapted for rapid aerial hunting,
    though it is notably smaller than many congeners. The species is highly adaptable,
    thriving in both urban environments and at rocky cliff faces where it constructs
    nests characteristic of the swift family.


    Like all swifts, the little swift is an aerial insectivore, spending most of its
    time in flight pursuing insects. It favors open spaces and can be seen hawking
    across towns, villages, and natural rocky outcrops. The species nests communally
    in crevices and caves, employing the typical swift construction method.


    The little swift''s vocalizations are sharp and penetrating, typical of swifts,
    helping birds communicate during their swift, synchronized flights. Its small
    size and distinctive silhouette in flight distinguish it from larger swift species.
    The taxonomy of this group has recently been clarified, with what was formerly
    considered an eastern subspecies now recognized as the separate house swift species.'
migration:
  sv: '# Stubbstjärtseglare (Apus affinis) – Förekomst i Skandinavien


    Migrationsdata saknas för denna art.


    Stubbstjärtseglaren är en mycket sällsynt gäst i Skandinavien och övriga Nordeuropa.
    Arten är en afrikansk fågel med huvudsaklig utbredning söder om Sahara, Mellanöstern
    och södra Asien. I Sverige förekommer den endast undantagsvis – endast tre fynd
    har dokumenterats. Det finns ingen etablerad migrationsrutt eller övervintringsbestånd
    av denna art i vårt nordiska område, utan observationer bör betraktas som få och
    slumpmässiga avvikelser från artens normala utbredning.'
  en: '# Little Swift (Apus affinis) in Scandinavia/Northern Europe


    The Little Swift is extremely rare in Scandinavia and Northern Europe, occurring
    only as an exceptional vagrant. This species is primarily resident in Africa and
    southwestern Asia, with some breeding populations in southern Europe. Any records
    in Scandinavian countries would represent rare overshoots during dispersal or
    migration events, rather than regular seasonal occurrence. The species does not
    establish winter populations or regular breeding colonies in the Nordic region.
    Sightings are unpredictable and sporadic, making this swift essentially absent
    from the annual avifauna cycle of Northern Europe.'
