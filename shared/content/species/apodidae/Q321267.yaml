description:
  sv: '# Alpseglare


    Alpseglare är en av seglararnas största arter och kännetecknas av sitt kraftiga
    byggda, mörkbruna fjädrar och vita undersida. Med sin imponerande vingspännvidd
    är det en skicklig flugare anpassad för att jaga insekter högt upp i luften.


    Arten förekommer över ett stort geografiskt område från Medelhavsområdet österut
    till Indien, samt i stora delar av Afrika och på Madagaskar. Alpseglaren är en
    höghöjdsflugare som ofta ses cirkla högt upp i himlen när det jagar. Det är mycket
    luftbundet och tillbringar mycket av sitt liv i flykten.


    Arten kategoriseras av IUCN som livskraftig, vilket indikerar en stabil population.
    Alpseglare häckar ofta på klippor och höga bergsväggar, där det bygger sitt bo.
    Det är anpassat för ett liv i luften och är en imponerad seglare med snabb, elegant
    flygstil.'
  en: '# Alpine Swift


    The Alpine Swift is a large swift found across Africa, southern Europe, and Asia,
    breeding in mountainous regions from southern Europe through to the Himalayas.
    Like other swifts, it is highly adapted to an aerial lifestyle, spending most
    of its life airborne while hunting insects in its beak. The species possesses
    characteristically short legs designed for clinging to vertical rock surfaces,
    but rarely settles voluntarily on the ground.


    Alpine Swifts are migratory birds. Populations breeding in southern Europe undertake
    long journeys south to winter in southern Africa, demonstrating remarkable navigational
    abilities. These swifts are gregarious and often seen in groups, wheeling and
    diving through mountain valleys and gorges as they pursue flying insects. Their
    swift, powerful flight is distinctive, with rapid wingbeats punctuating graceful
    gliding movements.


    The species is typically observed in its preferred mountain habitat during breeding
    season, where it nests on high cliff faces and rocky outcrops. Its preference
    for vertical surfaces and aerial foraging means it is seldom encountered away
    from suitable terrain, but when present, its presence is often announced by its
    characteristic calls as birds communicate while in flight.'
migration:
  sv: Alpseglaren är en långdistansflygerare som förekommer i Skandinavien och Nordeuropa
    under sommarhalvåret. Arten anländer till häckningsområdena i södra Sverige och
    Norge från april till maj, efter att ha övervintrerat i Afrika söder om Sahara.
    Under hösten, från augusti till september, drar alpseglarna tillbaka mot sina
    afrikanska vinterkvartering. Arten är en sällsynt men regelbunden passage genom
    regionen, med sporadiska observationer också under hösten när ungfåglar och strykande
    individer kan påträffas längre norrut än häckningsområdena.
  en: '# Alpine Swift Migration in Northern Europe


    The Alpine Swift is a rare visitor to Scandinavia and Northern Europe, occurring
    primarily during migration periods in spring and autumn. The species breeds in
    southern European mountains and migrates to wintering grounds in southern Africa.
    Alpine Swifts occasionally overshooting their normal range appear in northern
    regions during spring migration (May-June) and less frequently in autumn. These
    birds do not establish regular breeding populations in Scandinavia, and sightings
    remain uncommon and irregular. They are strictly aerial foragers, rarely landing
    except at breeding sites, making them difficult to observe even when present in
    northern European airspace.'
