description:
  sv: '# Blek tornseglare


    Blek tornseglare är en fågelart inom familjen seglare och en sydligare närsläkting
    till den vanligare tornseglaren. Arten förekommer främst i Medelhavsområdet, i
    bergsregioner i Sahara och vidare österut till Pakistan. IUCN klassificerar den
    som livskraftig, vilket indikerar en stabil population.


    Som alla seglare är blek tornseglare mycket anpassad för flygande liv, där den
    tillbringar mycket av sin tid i luften. Den är något blekare än tornseglaren,
    vilket även sitt namn antyder. För den som är intresserad av att iaktta arten
    krävs kunskap om var den förekommer, då utbredningen är begränsad till värmare
    klimatregioner i söder och öster.'
  en: '# Pallid Swift


    The pallid swift is a small, aerial bird built for a life almost entirely in flight.
    Its name derives from its pale plumage, which distinguishes it from other swift
    species. Like all swifts, it possesses very short legs used solely for clinging
    to vertical surfaces such as cliff faces and buildings—it never settles voluntarily
    on the ground.


    This species is superbly adapted to an airborne existence, spending the vast majority
    of its life hunting insects on the wing. It catches prey directly in its beak
    while flying and even drinks water by skimming the surface of ponds and lakes
    without landing. Its rapid, agile flight allows it to pursue flying insects with
    remarkable precision.


    The pallid swift is found in warm regions where it exploits thermal updrafts to
    gain altitude with minimal effort. It typically nests on vertical cliff faces
    or in crevices on man-made structures, making it a characteristic summer visitor
    to suitable territories during the breeding season.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: '# Pallid Swift in Northern Europe


    The Pallid Swift is a rare and irregular visitor to Scandinavia and Northern Europe,
    with no established breeding population in the region. Sightings occur primarily
    during late spring and summer months (May-August), typically representing overshooting
    birds migrating northward from their Mediterranean and North African breeding
    grounds. These records are uncommon and unpredictable, making the species a notable
    vagrant rather than a regular seasonal migrant to Scandinavian waters and airspace.
    The species breeds in southern Europe and winters in sub-Saharan Africa, with
    only occasional individuals reaching northern latitudes during migration periods.'
