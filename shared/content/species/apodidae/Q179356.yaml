description:
  sv: '# Vitgumpseglare


    Vitgumpseglare är en afrikansk seglare som även förekommer i södra Spanien, där
    den häckar. Fågeln tillhör familjen seglare och är anpassad för liv i luften med
    sina långsmala vingar och liten kropp. Det vita på övergumpen är ett särskilt
    märke som skiljer arten från andra seglare.


    Arten är mest aktiv under dagtid då den jagar flygande insekter högt uppe i luften.
    Vitgumpseglare är en skicklig flugare som sällan behöver slå sig ned. Beståndets
    utveckling är positiv och arten anses livskraftigt.


    Vitgumpseglare förekommer huvudsakligen i Afrika söder om Sahara, men har successivt
    etablerat sig i södra Spanien. I sitt африkanskа utbredningsområde är fågeln en
    vanlig syn på lämpliga lokaliteter där den hittar föda och lämpliga häckningsplatser.'
  en: '# White-rumped Swift


    The white-rumped swift is a small, dark swift with a distinctive white rump patch
    that contrasts sharply with its otherwise blackish plumage. At first glance, it
    superficially resembles a house martin, but despite these visual similarities,
    the two are not closely related. The resemblance between swifts and swallows is
    a remarkable example of convergent evolution, where unrelated species have evolved
    similar features to suit comparable lifestyles—in this case, aerial insectivory
    and agile flight.


    As a true swift, the white-rumped swift is supremely adapted for life on the wing,
    spending much of its time hunting insects in flight. It is highly maneuverable
    and fast, though specific details about its vocalizations and exact behavioral
    patterns are limited in available sources. The species inhabits various regions
    across its range, typically seen in open and semi-open habitats where aerial insects
    are abundant.'
migration:
  sv: '# Vitgumpseglare (Apus caffer) – Förekomst i Nordeuropa


    Vitgumpseglare är en huvudsakligen afrikanskfågel som inte är naturlig i Skandinavien
    och Nordeuropa. Arten häckar normalt i Afrika samt i södra Spanien, men förekommer
    inte regelbundet i svenska eller övriga nordeuropeiska regioner under året. Arten
    är därför inte relevantför nordeuropeisk migrationsbeskrivning.


    **Migrationsdata saknas för denna art.**'
