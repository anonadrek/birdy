description:
  sv: '# Fregattstormsvala


    Fregattstormsvala är en liten stormfågel som placeras som enda art i sitt släkte
    inom familjen havslöpare. Arten är mycket liten och anpassad för livet på öppna
    havet.


    Denna lilla stormfågel förekommer på oceaner i tempererade och subtropiska områden.
    Som de flesta stormfåglar tillbringar den större delen av sitt liv till sjöss,
    där den härjlar över vågorna på jakt efter småfisk och andra små marina organismer.
    Under häckningstiden återvänder arten till sina kolonierna på kustnära öar.


    Fregattstormsvalan är en diskret fågel som är svår att observera när den inte
    är vid sitt häckningsställe. Som många andra stormfåglar är arten nattaktiv vid
    sina häckningsplatser för att undvika rovfåglar.'
  en: '# White-faced Storm Petrel


    The white-faced storm petrel is a small seabird belonging to the austral storm
    petrel family. As the sole member of its genus, it holds a distinctive taxonomic
    position among storm petrels. The species is distinguished by its characteristic
    pale facial markings, which contrast with its darker plumage.


    This petrel is widely distributed across both northern and southern hemispheres,
    favouring coastal and open ocean waters. It is particularly common around southern
    regions in oceanic zones, where it inhabits areas far from land during much of
    the year. Like other storm petrels, it is adapted to pelagic life, spending considerable
    time at sea hunting for small fish and crustaceans.


    The white-faced storm petrel typically exhibits the characteristic behaviour of
    storm petrels, including its distinctive flight pattern involving rapid wing beats
    and hovering movements close to the water''s surface. It is nocturnal at breeding
    colonies and remains largely elusive at sea, making observations challenging for
    birdwatchers. Its small size and oceanic habits mean it is encountered mainly
    by those venturing into offshore waters or during breeding season observations
    at island colonies.'
