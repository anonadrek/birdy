description:
  sv: '# Havslöpare


    Havslöpare är en liten havsfågel som tillhör familjen havslöpare. Med en global
    population på 12–30 miljoner individer är det en av världens talrikaste havsfåglar.
    Arten häckar vid Antarktis och är därför främst ett vintergästande besök för många
    håll på norra halvklotet under sommarmånaderna.


    Arten är mycket liten och har en mörk fjäderdräkt. Det är en typisk stormsvalä
    som är anpassad för ett liv på öppet hav, där den ofta ses glida lågt över vattenytan
    på sin eviga jakt efter små bytesdjur. Liksom andra stormsvalor är havslöparen
    en nattetid häckare och är mycket svår att observera då.'
  en: ''
migration:
  sv: '# Havslöpare (Oceanites oceanicus)


    Havslöparen är en antarktisk häckfågel som under sitt icke-häckningsperiod sprider
    sig över världshaven. Under norra hemisfärens sommar (juni–september) förekommer
    arten regelbundet i nordatlantiska vatten, inklusive vid Skandinaviens kustnära
    områden. Fågeln utgör ett klassiskt exempel på en långdistansflyttare som utnyttjar
    motsatta årstiders matsäkerhet på båda hemisfärerna. I nordeuropa iakttas arten
    främst från sommaren till tidig höst, då individer från de antarktiska häckningsplatserna
    når norra vatten under sitt årliga omöte.'
  en: ''
