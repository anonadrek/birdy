description:
  sv: '# Blåfink


    Blåfinken är en liten fågel som är endemisk för Kanarieöarna och utgör djursymbolen
    för ön Teneriffa. Arten tillhör familjen finkar och är närbesläktad med den vanligare
    boffinken.


    Blåfinken är en diskret fågel som föredrar bergiga områden på högre höjder. Den
    är känd för sin blåaktiga färgteckning, som skiljer den från andra finkar i regionen.
    Arten lever huvudsakligen av frön och små växter som den plockar från marken eller
    från låga växter.


    Denna endemiska art är ett viktigt kännetecken för Kanarieöarnas unika fauna och
    är väl känd bland fågelskådare som besöker regionen.'
  en: '# Tenerife Blue Chaffinch


    The Tenerife blue chaffinch is a striking finch endemic to a single island in
    the Canary Islands. Males display vibrant blue plumage, while females are considerably
    duller in coloration. The species is notably stocky and robust for a finch, with
    a strong bill suited to cracking seeds.


    This bird inhabits mountainous pine forests and rocky terrain, where it forages
    for seeds and insects. It is typically seen in small groups, often moving restlessly
    through vegetation. The call is a sharp, distinctive note, and its song comprises
    short, varied phrases delivered from exposed perches.


    The species holds cultural significance as a regional symbol, recognized alongside
    an iconic local tree. Due to its restricted range on a single island, the Tenerife
    blue chaffinch faces conservation considerations, though it remains locally common
    in suitable habitat within its limited distribution.'
