description:
  sv: '# Grancanariablåfink


    Grancanariablåfink är en nyligen erkänd och mycket hotad tätting som enbart förekommer
    på en specifik kanarieö. Det tillhör familjen finkar och är en sällsynt art med
    begränsad utbredning.


    Arten är anpassad till bergiga miljöer och förekommer i höglänta områden på sin
    hemö. Som medlem av finkfamiljen har det ett kraftigt näbb lämpat för frösömning.
    Grancanariablåfinken är en mycket hotad art med en liten population, vilket gör
    den till föremål för naturvårdsintresse och övervakning.'
  en: '# Gran Canaria Blue Chaffinch


    The Gran Canaria blue chaffinch is a striking finch endemic to the Canary Islands.
    Males display vibrant blue plumage on the head, back, and wings, while females
    and juveniles are more subdued with greenish-grey tones. It shares the characteristic
    robust, conical bill typical of finches, adapted for cracking seeds.


    This species inhabits the pine forests and scrublands of its island home, where
    it forages on the ground and in trees for seeds and small insects. It often feeds
    in small flocks, particularly outside the breeding season. The bird is typically
    active and acrobatic, moving nimbly among branches and vegetation.


    Little detailed information is available in accessible sources regarding its specific
    vocalizations and call repertoire. Like other chaffinches, it likely produces
    various calls during social interactions and breeding displays, though the exact
    characteristics remain less documented in popular literature.'
