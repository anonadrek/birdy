description:
  sv: ''
  en: '# African Chaffinch


    The African chaffinch is a small passerine finch belonging to the genus *Fringilla*.
    It inhabits deciduous forests and lowland areas across its range, which extends
    from southern Morocco through northwestern Libya, with an isolated population
    in the northeastern part of that country. The species also occurs on Mediterranean
    islands, making it the only *Fringilla* species found naturally in Europe.


    Outside the breeding season, the African chaffinch becomes more flexible in its
    habitat use, venturing into open landscapes such as weedy fields and olive groves.
    This seasonal shift in habitat preference reflects its adaptability to different
    food sources throughout the year. The species was historically considered to be
    African subspecies of the Common chaffinch, but is now recognized as a distinct
    species.


    Information about the bird''s specific appearance, vocalizations, and detailed
    behaviour is limited in the available source material.'
