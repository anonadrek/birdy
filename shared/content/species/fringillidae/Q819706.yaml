description:
  sv: ''
  en: '# Great Rosefinch


    The great rosefinch is a medium-sized finch with distinctive rosy-red plumage,
    particularly visible on the head, breast, and rump. Males display more vibrant
    colouration than females, which are duller with brownish tones. It is a stocky
    finch with a relatively strong bill adapted for seed-cracking.


    This species inhabits high-altitude tundra and temperate grassland regions across
    a vast range spanning central Asia, from the Caucasus eastward through the Himalayas
    to China. It is typically found in open, barren terrain and rocky slopes where
    sparse vegetation provides seeds for feeding.


    The great rosefinch is generally quiet but utters soft, chirping calls and a simple
    warbling song during breeding season. It often feeds on the ground in small flocks,
    moving methodically through grassland searching for seeds. In winter, it may descend
    to lower elevations in search of food, sometimes appearing in more sheltered valleys.'
