description:
  sv: ''
  en: '# Scottish Crossbill


    The Scottish crossbill is a small finch endemic to the ancient Caledonian Forests,
    making it one of only two land vertebrate species found nowhere else in the United
    Kingdom. It belongs to the finch family and shares the characteristic crossed
    mandibles of other crossbills, an adaptation perfectly suited to extracting seeds
    from conifer cones.


    This compact bird is adapted for life among evergreen trees, where it spends much
    of its time foraging. Like other crossbills, it has a distinctive bill structure
    where the upper and lower mandibles cross over one another, allowing it to prise
    open cone scales with remarkable efficiency. The bird''s plumage and overall appearance
    reflect its specialization in coniferous forests.


    The Scottish crossbill''s call and song are distinctive features that help identify
    it in the field, though details of its vocalizations require careful observation
    to distinguish from closely related crossbill species. It remains a sought-after
    species for birdwatchers interested in endemic birds and forest specialists, though
    finding it requires visiting its restricted habitat in suitable coniferous woodland
    during the right season.'
migration:
  sv: ''
  en: '# Scottish Crossbill (Skotsk korsnäbb) – Occurrence in Scandinavia/Northern
    Europe


    The Scottish Crossbill is endemic to Scotland''s Caledonian Forests and does not
    naturally occur in Scandinavia or Northern Europe. Being restricted to the United
    Kingdom, it is not part of the regular avifauna of Nordic or continental European
    countries. Therefore, migration patterns or seasonal occurrence in Northern Europe
    are not applicable to this species.


    Migration data unavailable for this species.'
