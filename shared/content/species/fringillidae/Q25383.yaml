description:
  sv: ''
  en: '# Eurasian Chaffinch


    The Eurasian chaffinch is a common and widespread small finch easily identified
    by its distinctive markings. Males are particularly striking, featuring a blue-grey
    cap, rust-red breast and underparts, with bold white wing bars and white outer
    tail feathers. Females are more subtly coloured but share the same white wing
    and tail markings, making them recognizable even without the male''s vibrant plumage.


    This species is highly vocal, with males singing from prominent, exposed perches—a
    behaviour linked to territorial defence and mate attraction. The song is a distinctive,
    energetic phrase, and the bird also produces characteristic calls. It is a familiar
    garden and woodland visitor across much of its range, often seen foraging on the
    ground or visiting feeders.


    The chaffinch is adaptable and occurs in diverse habitats including gardens, parks,
    farmland, and open woodland edges. Its combination of colourful plumage, vocal
    activity, and comfortable presence near human habitation makes it one of the most
    recognizable finches for amateur birdwatchers.'
migration:
  sv: ''
  en: '# Eurasian Chaffinch in Northern Europe


    The Eurasian chaffinch is a year-round resident in Scandinavia and Northern Europe,
    though populations fluctuate seasonally. Resident birds remain throughout the
    year, but they are supplemented by migratory populations from further north and
    east during autumn and winter months. Northern breeding populations migrate southwestward
    in September and October, seeking milder conditions. Spring return migration occurs
    from March to May, with males typically arriving before females to establish territories.
    Winter numbers in Scandinavia can be substantial, particularly in southern regions
    where food remains more accessible. These birds favor mixed woodlands and gardens
    where seeds and insects provide sustenance year-round.'
