description:
  sv: '# Mindre korsnäbb


    Mindre korsnäbb är en fågel i finkfamiljen som häckar över stora delar av barrskogsbältet
    på norra halvklotet. Den är inte en flyttfågel men genomför oregelbundna vandringar,
    särskilt under år då den förekommer långt söder om sitt normala utbredningsområde.


    Arten kännetecknas av ett proportionellt stort huvud och en helt unik näbb med
    korsande näbbspetsar – en perfekt anpassning för att plocka ut frön från tallkottar
    och granfrukter. De adulta fåglarna har kraftfullt färgad fjäderdräkt: hanarna
    är orange- till tegelröda medan honorna är gulgröna. Det förekommer dock stor
    variation i färg, näbbform och läte mellan olika populationer, vilket länge har
    väckt diskussioner om artindelningen.


    Denna specialiserade näbbteknik gör mindre korsnäbb till en säregen och intressant
    art för naturintresserade att söka upp i barrskogar, inte minst under år då vandrande
    individer dyker upp på nya platser.'
  en: '# Red Crossbill


    The red crossbill is a small finch with one of nature''s most distinctive features:
    crossed mandibles that overlap at the tip. This specialized bill is perfectly
    adapted for extracting seeds from conifer cones, its primary food source. Males
    display bright red or orange plumage, while females are duller yellow-green. Both
    sexes show darker wings and tail in contrast to their body coloring.


    These highly social birds are often found in flocks, particularly outside the
    breeding season. They are remarkably agile acrobats, using their unique bill to
    pry open cone scales with impressive precision. Their erratic movements through
    conifer forests can make them challenging to spot, though they often announce
    their presence with frequent calls.


    The red crossbill''s call is characteristic and distinctive—a sharp, staccato
    "jip-jip-jip" or "chit-chit-chit" that helps identify it in its preferred habitat
    of coniferous forests. It frequents areas dominated by spruce, pine, and fir trees,
    where food supplies are abundant. Their distribution and breeding timing are closely
    tied to cone crop availability, making them somewhat nomadic across their range.'
migration:
  sv: '# Mindre korsnäbb – Förekomst i Skandinavien och Nordeuropa


    Mindre korsnäbb är inte en klassisk flyttfågel, utan är överlag stationär eller
    genomför oregelbundna vandringar inom sitt utbredningsområde. Arten häckar över
    stora delar av barrskogsbältet på norra halvklotet, inklusive Skandinavien. Under
    vissa år, särskilt när frötillgången i hemregionerna är dålig, kan arten vandra
    långt söder om sitt normala utbredningsområde och förekomma långt ned i Europa.
    Dessa irruptioner är oregelbundna och kan variera kraftigt mellan åren beroende
    på frötillgången i norra skogarna.'
  en: '# Red Crossbill (Loxia curvirostra) in Scandinavia/Northern Europe


    The Red Crossbill is a year-round resident throughout much of Scandinavia and
    Northern Europe, though its presence and numbers fluctuate seasonally depending
    on food availability. Populations are largely sedentary, with birds remaining
    in coniferous forests where spruce and pine seeds are abundant. However, irregular
    irruptions occur when cone crops fail in core breeding areas, leading to unexpected
    influxes of crossbills into southern regions during autumn and winter months.
    Spring arrivals of breeding birds typically occur from March onwards, while some
    individuals from northern populations may move southward in September and October.


    Migration data unavailable for this species.'
