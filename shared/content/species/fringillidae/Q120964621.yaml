description:
  sv: ''
  en: '# Canary Islands Chaffinch


    The Canary Islands chaffinch is a finch species recently recognized as distinct
    from the widespread Eurasian chaffinch following genetic analysis in 2021. It
    is endemic to the Canary Islands, where it is largely resident year-round.


    The species shares similarities with its close relative, the Eurasian chaffinch,
    though morphological differences distinguish it as a separate species. Like other
    finches in the family Fringillidae, it is a relatively small songbird adapted
    to life in its island habitat.


    This chaffinch is thought to remain within its distribution throughout the year
    rather than undertaking long migrations. As an endemic species confined to the
    Canary Islands, it represents an interesting example of island speciation within
    the finch family.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Canary Islands chaffinch is endemic to the Canary Islands and does not occur
    naturally in Scandinavia or Northern Europe. The available source material indicates
    the species is largely resident within its island distribution, but provides no
    information regarding any movements within or outside the Canary Islands archipelago.
    No migration patterns relevant to Northern Europe can be documented for this species.'
