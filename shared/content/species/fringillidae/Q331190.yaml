description:
  sv: ''
  en: '# Two-barred Crossbill


    The two-barred crossbill is a small finch inhabiting coniferous forests across
    North America and the Palearctic region. It is distinguished by its unique crossed
    mandibles, an adaptation perfectly suited for extracting seeds from pine and spruce
    cones. Males display bright red or yellow plumage, while females are duller, appearing
    greenish-gray with streaking.


    This species has a preference for coniferous woodlands where it feeds primarily
    on seeds from conifer cones. It often moves in flocks, sometimes undertaking irregular
    movements or invasions into new territories when food becomes scarce in its breeding
    grounds. The two-barred crossbill is a relatively quiet bird, though it occasionally
    produces soft calls and simple songs.


    Identifying features include the characteristic crossed bill and prominent white
    wing bars that give the species its common name, visible on both males and females.
    These contrasting wing markings distinguish it from the closely related red crossbill,
    which lacks such prominent white markings. The two-barred crossbill is typically
    found in northern and montane coniferous forests, where it can often be observed
    hanging acrobatically from cone-laden branches while feeding.'
migration:
  sv: ''
  en: '# Two-barred Crossbill in Scandinavia/Northern Europe


    The two-barred crossbill is an irregular winter visitor to Scandinavia and northern
    Europe, with occurrence highly dependent on food availability in their breeding
    range. These birds breed in coniferous forests across the Palearctic, including
    parts of northern Scandinavia. During years when cone crops fail in their primary
    breeding areas, larger numbers irrupt southwestward into Scandinavia, typically
    arriving in autumn and winter months (October–March). In years of abundant food
    sources, few or no birds may venture into the region. This species is therefore
    considered an unpredictable vagrant rather than a regular migrant, with populations
    fluctuating considerably from year to year based on cone production cycles.'
