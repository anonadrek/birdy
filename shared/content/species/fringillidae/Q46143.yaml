description:
  sv: '# Rosenfink


    Rosenfink är en medelstor fink med ett karakteristiskt utseende som skiljer sig
    mellan könen och åldrar. Den adulta hanen är mycket iögonfallande med sin karmosinröda
    färg på bröstet och huvudet, medan honor och unga hanar har en mycket mer diskret
    olivbrun färgteckning med streckningar. Denna färgskillnad mellan könen gör arten
    lätt att identifiera när de ses tillsammans.


    Arten är känd för sin karakteristiska sång som påminner om en busvissling och
    är en viktig igenkänningsmarkör i fält. Rosenfinken hör till familjen finkar och
    har sitt största utbredningsområde i Sibirien och Centralasien, men har på senare
    tid koloniserat nya områden. Under de senaste decennierna har arten successivt
    spridit sig västerut till Östeuropa, Centraleuropa och Skandinavien, vilket gör
    den till en intressant art för observatörer i nordligare regioner.'
  en: ''
migration:
  sv: '# Rosenfink (Carpodacus erythrinus) – Förekomst i Skandinavien


    Rosenfink är en relativt nyanlländ art i Skandinavien som främst förekommer som
    sommargäst. Arten har under de senaste decennierna utökat sitt utbredningsområde
    västerut från Sibirien och Östeuropa. I Skandinavien anländer rosenfinkar typiskt
    sett under maj månad och stannar genom sommaren för häckning, innan de återvänder
    till sina övervintringsområden i Afrika och södra Asien under augusti-september.
    Arten är således en långdistansmigrant som ses endast under säsongen för häckning
    i våra nordiska regioner.'
  en: ''
