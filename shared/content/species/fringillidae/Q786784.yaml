description:
  sv: '# Azordomherre


    Azordomherre är en liten finkkäft som är endemisk för en enskild ö i Azorerna,
    vilket gör den till en sällsynt och begränsad art. Arten är klassificerad som
    sårbar enligt IUCN på grund av sitt mycket begränsade utbredningsområde.


    Denna tätting tillhör familjen finkar och har anpassat sig till den specifika
    miljön på sin hemö. Som många andra endemiska arter på isolerade öar är den känslig
    för miljöförändringar och habitatförlust. Arten är av stor betydelse för naturvården
    och utgör ett exempel på vikten av att bevara små och isolerade populationer av
    fåglar.'
  en: '# Azores Bullfinch


    The Azores bullfinch is a threatened finch species found exclusively on São Miguel
    Island in the Azores archipelago. This small passerine belongs to the true finch
    family and is locally known by the Portuguese name "priolo."


    Due to limited source information, specific details about its appearance, behaviour,
    and call are not available from the provided text. However, as a member of the
    bullfinch genus Pyrrhula, it likely shares characteristics typical of bullfinches,
    including a robust bill and compact body shape. The species inhabits a restricted
    range on a single island, which contributes to its conservation status as a threatened
    bird.


    The Azores bullfinch represents an important example of island endemism, where
    species evolve in isolation on small landmasses. Its threatened status highlights
    the vulnerability of island birds to habitat loss and other environmental pressures.'
