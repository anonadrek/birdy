description:
  sv: '# Arabisk guldvingefink


    Arabisk guldvingefink är en kraftig fink med en karakteristisk tjock näbb, anpassad
    för att knäcka hålla frön. Arten har guldgula vingar som är särskilt framträdande
    under flykten, vilket ger arten sitt namn. Fjäderdräkten är huvudsakligen grå
    med kontrastfulla vingmarkeringar.


    Arten förekommer endast i sydvästra hörnet på Arabiska halvön, där den lever i
    bergiga områden med gles växtlighet. Det är en tämligen fåtalig fågel som ofta
    ses i mindre flockar. Den är försiktig och kan vara svår att observera då den
    ofta håller sig i täta buskar och låga träd.


    Arten är kategoriserad som nära hotad av IUCN eftersom populationen är liten och
    minskar. Detta beror på habitatförstöring och klimatförändring i dess redan begränsade
    utbredningsområde. För en intresserad fågelskådare är arten en utmaning att se
    på grund av sitt begränsade område och sitt undvikande beteende.'
  en: ''
