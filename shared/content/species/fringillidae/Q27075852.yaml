description:
  sv: '# Hämpling


    Hämpling är en fågel inom familjen finkar och tillhör de mindre finkarterna. Den
    är sprallig och rörelserik och ses ofta i små flockar, särskilt under flyttningstiden.
    Hämlingen föredrar torrt och buskigt kulturlandskap, där den söker föda bland
    ogräs och växter.


    Arten har ett distinkt utseende med röd panna och röda partier på bröstet och
    undertäckarna hos hanen, medan honan är mer diskret brun. Röstandet är livligt
    och musikaliskt, ofta framfört under flygning. Hämlingen förekommer över större
    delen av Europa, västra Asien och Nordafrika, där den häckar. Nordliga och östliga
    populationer är flyttfåglar som drar västerut och söderut vintertid.


    Även om arten minskar i antal anses beståndet fortfarande livskraftigt. Hämlingen
    gynnas av en mosaikartad landsbygd med öppna arealer och växtmaterial som tärnekryddor
    och tistel – viktig föda både för arten själv och dess ungar.'
  en: '# Common Linnet


    The common linnet is a small finch with a distinctive appearance that varies between
    sexes. Males display a striking red forehead and breast, particularly during breeding
    season, while females and non-breeding males are more subdued in coloration with
    streaked plumage. It is a sociable bird, often seen in small flocks, especially
    outside the breeding season when it may gather in larger groups.


    This species derives its name from its preference for hemp and flax seeds, which
    it seeks out in weedy areas and on seed heads. It has a characteristic rapid,
    twittering call and produces a pleasant, warbling song during breeding season.
    The linnet''s flight is bouncy and undulating, typical of finches.


    The common linnet inhabits open and semi-open country, favoring scrubland, heathland,
    farmland edges, and areas with scattered vegetation where seed-bearing plants
    are abundant. It is found across a wide geographical range and is a common sight
    in suitable habitats, though populations may shift seasonally with some birds
    migrating while others remain resident year-round.'
migration:
  sv: '# Hämpling – Migration och förekomst i Skandinavien


    Hämpling är en partiell migrant som förekommer i Skandinavien huvudsakligen under
    häckningssäsongen. De nordliga och östliga populationerna, inklusive de skandinaviska,
    är flyttfåglar som trekker mot väst och sydväst under vintern. Arten ankommer
    till sina häckningsområden i Skandinavien under våren, vanligtvis från april-maj,
    och återvänder till sina övervintringsområden i västra Europa och Medelhavsregionen
    på hösten. Mindre antal kan dock övervintrar i södra Skandinavien under milda
    vintrar. Beståndet har minskat under de senaste decennierna, men anses fortfarande
    livskraftigt.'
  en: '# Common Linnet (Linaria cannabina) in Scandinavia/Northern Europe


    The Common Linnet is a summer breeding visitor to Scandinavia and northern Europe,
    arriving in late April and May to establish breeding territories. Populations
    breed across open habitats including heathland, wasteland, and cultivated areas
    throughout the region. During autumn, from August onwards, birds gradually depart
    southwestward, with most having left by October. The species is largely absent
    during winter months, though occasional overwintering individuals may occur in
    milder coastal areas of southern Scandinavia.


    Migration data unavailable for this species.'
