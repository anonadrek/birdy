description:
  sv: '# Citronsiska


    Citronsiska är en liten fink som hör till familjen finkar. Den förekommer i bergstrakter
    i sydvästra Europa och är klassificerad som livskraftig enligt IUCN. Arten förväxlades
    tidigare med korsikansk siska, som numera erkänns som en separat art.


    Arten är väl anpassad för bergsmiljöer där den hittas i sitt naturliga habitat.
    Som många andra finkar är citronsiska en mindre fågel med karakteristiska drag
    som är typiska för släktet. Arten är stabil i sina populationer och utgör ingen
    naturvårdskonflikt.'
  en: '# Citril Finch


    The citril finch is a small songbird belonging to the true finch family. It is
    a delicate species adapted to mountain environments, where it forages among seed-bearing
    plants and conifers. The bird''s plumage displays subtle coloration that provides
    effective camouflage in its alpine habitat.


    This finch is primarily a seed-eater, with a preference for small seeds from thistles
    and other low vegetation. It often feeds in small flocks, particularly outside
    the breeding season. The citril finch is acrobatic in flight, moving nimbly through
    trees and shrubs as it searches for food.


    The species is found in mountainous regions where suitable vegetation and altitude
    conditions exist. It typically inhabits areas with scattered conifers and alpine
    meadows, moving to lower elevations during winter months.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: '# Citril Finch Migration in Northern Europe


    The Citril Finch is primarily a resident and short-distance migrant in southern
    and central European mountains, with limited occurrence in Scandinavia and Northern
    Europe. In these northern regions, the species is rare and irregular, appearing
    mainly as a vagrant during migration periods or winter months. When present, individuals
    are typically found in late autumn and winter, having moved downslope or northward
    from Alpine breeding populations in response to harsh mountain conditions. The
    species does not establish regular populations in Scandinavia, making sightings
    exceptional rather than predictable. Any northern occurrences are generally associated
    with irruptive movements or unusual weather patterns that displace mountain populations.'
