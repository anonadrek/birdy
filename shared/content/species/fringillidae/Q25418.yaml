description:
  sv: '# Steglits


    Steglits är en liten och särskilt färggrann fågel som tillhör familjen finkar.
    Den kännetecknas av sitt iögonenfallande utseende med röd ansiktsmask, svart och
    vitt huvud samt gul vingbård som blir synlig under flykt. Kroppen är brun och
    vit, vilket gör arten lätt att identifiera även på avstånd.


    Arten är en vanlig häckfågel över stora delar av sitt utbredningsområde, som sträcker
    sig från norra afrika, genom europa och österut till södra Sibirien. Steglits
    förekommer framför allt i öppna, trädrika landskap, trädgårdar och fruktodlingar
    där det finns tillräckligt med föda. Fågeln är social och ofta att se i små flockar,
    särskilt under hösten och vintern då den söker föda tillsammans med andra arter.'
  en: '# European Goldfinch


    The European goldfinch is a striking small finch instantly recognizable by its
    brilliant red face mask contrasting sharply with black and white head markings.
    Its back is warm buff-brown, while the wings display distinctive broad bands of
    bright yellow with black feathering, making it unmistakable in flight. It is a
    delicate, elegant bird with a slender pointed bill adapted for extracting seeds
    from teasels and thistles.


    This highly social species is often seen in small flocks, particularly when feeding.
    It has a light, tinkling call and a cheerful, twittering song. The bird is acrobatic
    in its foraging behaviour, frequently hanging from seed heads while feeding. It
    prefers open habitats with scattered vegetation, orchards, gardens, and areas
    rich in seeding plants.


    Native to the Palearctic region of Europe, northern Africa, and western Asia,
    the European goldfinch has expanded its range considerably and is now found in
    many introduced locations worldwide, including Australia, New Zealand, Uruguay,
    and the United States. Its popularity in aviculture has contributed to its global
    spread. The species remains common across much of its native range and continues
    to adapt to human-modified landscapes.'
migration:
  sv: '# Steglits (Carduelis carduelis) i Skandinavien


    Steglitsen är en partiell flyttfågel i Norden. Den förekommer som häckfågel under
    sommarmånaderna, främst från april till september. I södra Skandinavien är arten
    mer stationär och vissa individer övervintar, särskilt om tillgången på frön från
    tistelväxter och andra växter är god. Huvuddelen av populationen drar dock söderut
    på hösten för att övervintra i södra Europa och Nordafrika. Vårtillströmningen
    börjar redan i mars när de första individerna återvänder från sina övervintringskvarter.
    Arten är mest talrik i öppna, trädrika miljöer, trädgårdar och odlingslandskap
    där det finns gott om föda.'
  en: '# European Goldfinch in Scandinavia and Northern Europe


    The European goldfinch is a partially migratory species in Northern Europe, with
    population movements varying by region. In Scandinavia, breeding birds arrive
    from late March through April, establishing themselves in open woodlands and gardens.
    During autumn, from August onwards, populations shift southward and westward,
    with most Scandinavian breeders departing by October. However, increasing numbers
    now overwinter in Northern Europe, particularly in milder coastal areas and urban
    gardens with adequate food sources like teasels and thistle seeds. Winter residents
    in Scandinavia tend to concentrate in southern regions, while northern populations
    migrate to southern Europe and the Mediterranean basin.'
