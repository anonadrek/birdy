description:
  sv: '# Sinairosenfink


    Sinairosenfink är en finkkärlingu som tillhör familjen finkar och förekommer i
    ett begränsat område i Mellanöstern. Arten är nationalfågel i Jordanien, vilket
    vittnar om dess betydelse för regionen.


    Arten kännetecknas av sin karakteristiska rosafärgade fjäderdräkt, särskilt på
    bröstet och huvudet. Hanarna är mer intensivt färgade än honorna, som har mer
    dämpade färgtoner. Det är en relativt liten fink med kraftig näbb anpassad för
    att äta frön.


    Sinairosenfink lever i bergiga och öppna miljöer med sparsam vegetation. Den håller
    sig ofta i smågrupper och ses därför gärna söka föda på marken eller i låga buskar.
    Arten är anpassad till torra förhållanden och är relativt vanlig inom sitt begränsade
    utbredningsområde i Mellanöstern.'
  en: '# Sinai Rosefinch


    The Sinai rosefinch is a small finch with striking sexual dimorphism. Males display
    a distinctive pink face and breast contrasting with a whitish forehead and crown,
    while females are considerably duller, showing pale gray-brown plumage overall
    with a whitish belly. This coloration helps the species blend into its arid surroundings.


    The species inhabits hot desert regions, where it is adapted to harsh, sparsely
    vegetated terrain. It feeds on seeds and small plant matter typical of desert
    flora. The Sinai rosefinch prefers areas with scattered shrubs and rocky outcrops
    that provide shelter and foraging opportunities in its arid habitat.


    This finch is found across the Sinai Peninsula and the Negev region of the Middle
    East. It holds cultural significance as the national bird of Jordan. The pale
    rosefinch is sometimes treated as a subspecies rather than a separate species,
    though taxonomic opinions vary. The Sinai rosefinch''s adaptation to extreme desert
    conditions makes it a notable inhabitant of one of the world''s most challenging
    environments.'
