description:
  sv: ''
  en: '# Red-fronted Serin


    The red-fronted serin is a tiny finch, measuring just 11–12 cm in length, making
    it one of the smaller members of its family. It inhabits high mountain regions,
    where it is well-adapted to challenging alpine environments. Its compact size
    and mountain preference distinguish it from many lowland finch species.


    This small passerine is characterized by its distinctive red forehead, which gives
    the species its common name. Like other serins, it likely feeds on small seeds
    and has the typical finch bill suited to extracting food from seed heads. Its
    behaviour and vocalizations are typical of alpine finches, though detailed information
    about its specific calls and habits requires further observation in its native
    high-altitude habitat.


    The species is found in mountainous terrain where vegetation is sparse and hardy
    plants dominate. Its preference for elevation means it occupies a specialized
    ecological niche, quite different from the lowland and woodland finches more commonly
    encountered at sea level.'
migration:
  sv: ''
  en: '# Red-fronted Serin in Northern Europe


    The Red-fronted Serin is an extremely rare vagrant to Northern Europe and Scandinavia,
    with no established migration pattern or regular occurrence in the region. This
    small finch species is primarily resident in high mountain regions of southern
    Europe and Asia Minor, far south of Scandinavian latitudes. Any sightings in Northern
    Europe would represent highly exceptional occurrences outside the species'' normal
    range, and the bird should not be expected as a regular migrant or winter visitor
    to this region.


    **Migration data unavailable for this species** in a Scandinavian context, as
    it does not form part of the region''s regular avifauna.'
