description:
  sv: ''
  en: '# Crimson-winged Finch


    The Crimson-winged Finch is a stocky, pale-colored finch distinguished by its
    notably heavy, dull yellowish bill. It is the sole member of its genus, Rhodopechys.
    The species exhibits subtle plumage variation across its range, which has led
    some authorities to recognize two distinct populations: the African and Asian
    forms, though it is typically treated as a single species.


    The finch inhabits rocky, semi-arid regions across North Africa and a broad swathe
    of Asia, extending from Turkey through to northeast Pakistan. It frequents arid
    and mountainous terrain where sparse vegetation provides foraging opportunities.
    Like other finches, it is social and often seen in small flocks, particularly
    outside the breeding season.


    The species'' heavy bill is specifically adapted for extracting seeds from tough
    plant material, a key aspect of its feeding behavior in harsh desert and montane
    environments.'
