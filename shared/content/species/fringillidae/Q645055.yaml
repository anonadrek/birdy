description:
  sv: ''
  en: '# Parrot Crossbill


    The parrot crossbill is a small finch with a distinctively robust build and powerful
    bill that crosses at the tips—an adaptation perfectly suited to extracting seeds
    from conifer cones. It is larger and heavier-billed than its close relative, the
    red crossbill, with males displaying warm reddish plumage and females showing
    greenish-yellow tones. The crossed mandibles are particularly prominent and give
    the species its characteristic appearance.


    This specialized feeder inhabits pine forests across northern and northeastern
    regions, where it moves nomadically in search of productive cone crops. It often
    feeds acrobatically while clinging to cones, using its powerful bill with remarkable
    precision. The parrot crossbill''s call is a distinctive, harsh "chup-chup" that
    differs from related crossbill species, helping observers distinguish it in the
    field.


    Though primarily a forest dweller, it occasionally ventures to lower elevations
    or more southerly areas during years of poor seed production. Its movements are
    largely determined by food availability rather than strict seasonal migration,
    making sightings unpredictable outside its core breeding range.'
migration:
  sv: ''
  en: The Parrot Crossbill is a resident and irruptive species in Scandinavia and
    northern Europe, with populations that breed in pine forests throughout the region.
    These birds are largely sedentary, remaining in their breeding areas year-round
    where food supplies permit. However, they are prone to irregular eruptions, particularly
    in autumn and winter, when seed crop failures in their northern breeding grounds
    force substantial populations to move southward into continental Europe and occasionally
    into southern Scandinavia. Such invasions are unpredictable and can vary greatly
    in magnitude between years, depending on cone availability in boreal pine forests.
    During favorable seed production years, most individuals remain resident throughout
    the winter months.
