description:
  sv: '# Långstjärtad rosenfink


    Långstjärtad rosenfink är en östasiatisk finke med karakteristisk långt utdragen
    stjärt. Den tillhör gruppen rosenfinkar och är relaterad till andra arter i släktet
    Carpodacus.


    Arten häckar i södra Sibirien, Kina, Nordkorea och norra Japan. I Europa förekommer
    den endast tillfälligt, och de flesta observationerna antas utgöra förrymda burfåglar
    snarare än naturligt förekommande individer.


    Långstjärtad rosenfink klassificerades tidigare som ensam art i sitt eget släkte,
    Uragus, men inkluderas numera tillsammans med andra rosenfinkar inom släktet Carpodacus.'
  en: ''
migration:
  sv: '# Långstjärtad rosenfink i Norden


    Långstjärtad rosenfink är en östasiatisk art som normalt förekommer i södra Sibirien,
    Kina, Nordkorea och norra Japan. Arten är mycket sällsynt i Europa och Skandinavien.
    De få fynd som gjorts i Europa anses huvudsakligen utgöra förrymda burfåglar snarare
    än naturliga migranter. Det finns således ingen etablerad migrationsmönster för
    denna art i Nordeuropa eller Skandinavien.


    Migrationsdata för naturlig förekomst i norra Europa saknas för denna art.'
  en: ''
