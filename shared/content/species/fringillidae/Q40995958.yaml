description:
  sv: ''
  en: '# Madeira Chaffinch


    The Madeira chaffinch is a small finch endemic to the island of Madeira in the
    North Atlantic. Once considered merely a subspecies of the Eurasian chaffinch,
    genetic and morphological analysis in 2021 elevated it to full species status.
    This distinction reflects subtle but meaningful differences that set it apart
    from its close relative.


    As a small passerine, the Madeira chaffinch shares the typical finch body plan
    and feeding habits characteristic of the family Fringillidae. While specifics
    of its plumage, behaviour, and vocalizations are not detailed in the available
    source material, it displays the characteristics expected of a chaffinch adapted
    to island life.


    The species is confined to its native island habitat, making it a notable example
    of Macaronesian endemism. Its local name, tentilhão, reflects the cultural presence
    of this bird among island residents.'
