description:
  sv: '# Murkrypare


    Murkrypare är en liten och karakteristisk fågel som är ensamstående art i sitt
    släkte. Den återfinns på höga höjder i bergstrakter över hela Eurasien, där den
    är anpassad till extrema miljöer.


    Denna lilla tätting är känd för sitt spektakulära utseende när den flyger – vingarna
    visar då en slående röd färg som kontrasterar mot den gråa huvudkroppen. På marken
    och när den vilar är färgerna mer diskreta. Fågeln är mycket specialiserad på
    att söka föda i bergstäder och sprickor, där den söker insekter och spindlar med
    sin spetsiga näbb.


    Murkrypare är en skicklig klättrare som gärna rör sig på bergväggar och klippor,
    vilket även namnet antyder. Familjetillhörigheten diskuteras fortfarande bland
    ornitologer, men fågeln utgör sin egen familj Tichodromidae. Den är en anpassad
    bergsfågel som bäst ses i höga alpina och subalpina bergstrakter där klimatet
    är hårt och biotopen begränsad.'
  en: '# Wallcreeper


    The wallcreeper is a distinctive small bird of high mountain regions across the
    Palearctic, from southern Europe eastward to central China. It is the sole living
    member of its genus and family, making it a unique species without close relatives.


    This striking bird features predominantly grey plumage with a contrasting black
    throat and bright crimson-red wings that become particularly conspicuous in flight.
    Its thin, slightly curved bill is adapted for probing into rock crevices. The
    wallcreeper displays acrobatic behaviour, creeping along steep cliff faces and
    rock walls with jerky, deliberate movements, rather like an insect. It uses its
    wing pattern extensively in displays, fluttering them to reveal the vivid red
    coloring.


    The wallcreeper''s call is a clear, piping whistle that echoes across mountain
    slopes. It inhabits rocky alpine and subalpine areas, preferring steep cliffs,
    gorges, and rocky outcrops where it forages for insects and spiders hidden in
    crevices. In winter, some populations descend to lower altitudes, occasionally
    appearing on stone buildings and quarries. The species is generally solitary and
    territorial, remaining largely inconspicuous except when its striking wing pattern
    flashes during display or flight.'
