  en: '# Wallcreeper (Tichodroma muraria) in Northern Europe


    The wallcreeper is an extremely rare visitor to Scandinavia and Northern Europe,
    with no established resident or regular migrant population in the region. This
    high-mountain specialist is primarily found in southern European alpine zones
    and typically does not occur north of the Alps during the breeding season. Occasional
    winter wanderers or vagrants have been recorded in northern areas during harsh
    weather conditions, when some individuals may descend to lower elevations and
    disperse northward from their core mountain ranges. Such occurrences remain highly
    irregular and unpredictable, making the species an exceptional sighting rather
    than a seasonal visitor to Scandinavia.'
