description:
  sv: '# Mellanspett


    Mellanspett är en medelstor hackspett med begränsad utbredning i västra och södra
    delen av Palearktis. Arten är väl anpassad för att söka föda i trädkronorna och
    föredrar grovbarkade grenar och stamdelar, där det finns gott om insektsföda.
    Traditionellt är mellanspetten starkt knuten till gamla ekomskogar, där den trivs
    särskilt väl. Under senare år har arten dock påvisats i naturliga lövskogar där
    andra trädslag dominerar, vilket visar på en viss flexibilitet i habitatval.


    Arten är något mindre än den välbekanta större hackspetten och kan skiljas från
    denna genom sitt utseende. Mellanspetten söker sin föda främst genom att hacka
    och söka i bark för att nå insekter och larver. Som många hackspettar är arten
    relativt skygg och kan vara svår att få syn på när den rör sig högt upp i trädkronorna.


    Denna specialiserade hackspett kräver skogar med gammal trädbestånd för att trivas
    optimalt, vilket gör arten känslig för intensiv skogsskötsel.'
  en: ''
migration:
  sv: '# Mellanspett - Förekomst i Skandinavien och Nordeuropa


    Mellanspett är en stationär art som förekommer året runt i sitt utbredningsområde,
    vilket omfattar delar av västra och södra Europa. I Skandinavien och övriga Nordeuropa
    är arten mycket sällsynt och oregelbunden. Den har en begränsad utbredning och
    är huvudsakligen knuten till områden med gamla, grovbarkade träd, särskilt ekar.
    Arten är övervintrad i sitt område och visar ingen markant migrationsaktivitet
    som många andra hackspettar.'
  en: ''
