description:
  sv: '# Iberisk gröngöling


    Iberisk gröngöling är en hackspett som är nära släkt med gröngölingen och förekom
    tidigare som underart till denna. Det är en art som är begränsad till Iberiska
    halvön, där det förekommer i lämpliga habitat.


    Arten minskar i antal, men beståndet anses trots detta vara livskraftigt. Som
    hackspett utgör det en integrerad del av skogekosystemen på sin utbredningsområde.


    För mer detaljerad information om utseende, beteende, läte och specifika habitat
    rekommenderas mer omfattande kilder, då grundinformationen är begränsad.'
  en: '# Iberian Green Woodpecker


    The Iberian green woodpecker is a medium-sized woodpecker found exclusively in
    the Iberian peninsula. It closely resembles the European green woodpecker but
    is readily distinguished by its plumage: it has minimal black markings on the
    head and displays a dusky (rather than jet-black) ring around each eye. Like other
    green woodpeckers, it is primarily a ground feeder, probing for ants and other
    invertebrates in grassland and open woodland habitats.


    Its vocalizations are distinctive and quite different from its closest relatives.
    The bird produces sibilant, hiss-like sounds—a characteristic that sets it apart
    acoustically. These calls are often delivered from perches or while foraging on
    the ground.


    The species inhabits open and semi-open landscapes, including grasslands, parkland,
    and woodland edges where it can access suitable feeding grounds. It remains relatively
    sedentary throughout its range, though local movements may occur seasonally.'
