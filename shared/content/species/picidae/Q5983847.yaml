  en: '# Picus sharpei in Northern Europe


    Migration data unavailable for this species.


    The Iberian Green Woodpecker is endemic to the Iberian Peninsula and does not
    occur in Scandinavia or Northern Europe. This species has a restricted range limited
    to Spain and Portugal, making it absent from all Nordic and Northern European
    countries throughout the year.'
