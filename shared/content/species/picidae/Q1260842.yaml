description:
  sv: ''
  en: '# White-winged Woodpecker


    The white-winged woodpecker is a member of the Picidae family, characterized by
    the pale or white wing patches that distinguish it from related woodpecker species.
    It inhabits temperate and subtropical forests across a broad range in central
    and western Asia, where it forages in woodland habitats typical of the region.


    This species occupies temperate forests and subtropical or tropical moist lowland
    forests throughout its range, preferring areas with suitable dead wood for foraging
    and nesting. The white-winged woodpecker follows the typical woodpecker lifestyle,
    using its specialized bill to excavate bark and wood in search of insects, and
    creating nesting cavities in suitable trees.


    Detailed information about its specific behaviour, vocalizations, and field identification
    features is limited in available sources, but like other woodpeckers, it likely
    produces diagnostic drumming sounds and calls used for communication and territorial
    display.'
