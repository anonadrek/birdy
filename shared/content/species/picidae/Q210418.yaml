description:
  sv: '# Tretåig hackspett


    Tretåig hackspett är en hackspett som förekommer över tajgaområdet i norra delen
    av Palearktis. Arten hittas även i ett antal isolerade bergsområden längre söderut.
    Tidigare klassificerades den nordamerikanska vedspetten tillsammans med tretåig
    hackspett, men den urskiljs numera oftast som egen art.


    Arten är anpassad till de kalla skogsområden där det finns gott om tall och gran.
    Tretåig hackspett är en specialist på att hacka i döda träd för att leta efter
    insekter och larver under barken. Det är en mindre hackspett med karakteristisk
    trefingad fot, vilket skiljer den från de flesta andra hackspettsarter som har
    fyra tår.'
  en: ''
migration:
  sv: '# Tretåig hackspett – Förekomst i Norden


    Tretåig hackspett är en året runt närvarande art i Skandinavien och förekommer
    i de nordliga skogsområdena. Den är stationär i sitt utbredningsområde och visar
    ingen typisk migrationsmönster. Arten stannar i sina revir under höst och vinter,
    där den söker föda i barrskogen. Under mindre hårt väder kan enskilda individer
    röra sig kortare sträckor för att hitta lämpliga födosöksområden.


    Migrationsdata saknas för denna art i praktisk bemärkelse, då den är icke-flyttande
    och året runt närvarande i sitt habitat.'
  en: ''
