description:
  sv: '# Vitryggig hackspett


    Vitryggig hackspett är en stor hackspett som är något större än större hackspett.
    Det karakteristiska draget är den vita ryggen, som särskiljer den från andra hackspettar.
    Arten förekommer transpalearktiskt från väster till öst över Europa och Asien,
    med ett omfattande utbredningsområde som sträcker sig från västra regioner till
    östra delar av kontinenten.


    Arten är idag listad som akut hotad, främst på grund av bristen på lämpliga biotoper.
    Vitryggig hackspett föredrar skogar med gamla träd där det finns möjlighet att
    söka föda. För att möta artens bevarandebehov är det viktigt att bevara och utveckla
    denna typ av naturmiljö.'
  en: ''
migration:
  sv: '# Vitryggig hackspett – Förekomst i Skandinavien


    Vitryggig hackspett är en stationär art som förekommer året runt i Skandinavien,
    där den är bosatt i de nordligaste delarna av regionen. Arten är inte migrerande
    och stannar kvar på sina revir även under vintermånaderna. I Sverige är arten
    mycket sällsynt och lokalt förekommande, främst i de äldre barrskogar där den
    hittar lämpliga biotoper för sitt leverne. Populationen är starkt minskad och
    arten är idag klassificerad som akut hotad.'
  en: ''
