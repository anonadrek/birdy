description:
  sv: '# Balkanspett


    Balkanspett är en hackspett som liknar större hackspett men är något mindre. Den
    har den typiska hackspettens rundade kropp med kraftigt näbb och kort, stel stjärt
    anpassad för att hänga i trädstammar. Fjäderdräkten är huvudsakligen svart och
    vit, med röda undertäckare under stjärten.


    Arten förekommer i östra och sydöstra Europa samt västra Asien, där den bebor
    löv- och blandskogs områden. Det är en aktiv fågel som speglar efter mat under
    löst bark på träd, särskilt på döda eller försvagsnade träd. Som andra hackspettar
    gör den även karakteristiska trumningar på träd för att markera revir och kommunicera.


    Balkanspett hörs framför allt genom sina trummande ljud och olika läten som uttrycks
    under häckningstiden. Arten är relativt svårsedd på större avstånd men kan upptäckas
    genom sitt beteende högt upp i träden, där den systematiskt söker efter insekter
    och larver.'
  en: ''
