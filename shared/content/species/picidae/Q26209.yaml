description:
  sv: '# Större hackspett


    Större hackspett är en medelstor hackspett med ett karakteristiskt brokigt utseende
    i svart, vitt och rött. Hanen har en röd undersida på stjärten och röd under stjärtens
    täckfjädrar, medan honan saknar denna röda färgning. Arten är kraftigt byggd med
    stark näbb, väl anpassad för att hacka i trädstammar.


    Arten förekommer vitt utbrett över Europa, norra Afrika och norra Asien. Medan
    större delen av populationen är stannfåglar som stannar året runt, är de individer
    som häckar i de kallaste nordligaste delarna av sitt utbredningsområde flyttfåglar
    som drar bort under vintermånaderna.


    Större hackspett är en aktiv fågel som ofta ses när den söker föda genom att hacka
    och krypa längs trädstammar och grenar. Den är relativt hänskydd men kan lockas
    till fågelmat på vintern.'
  en: '# Great Spotted Woodpecker


    The great spotted woodpecker is a medium-sized woodpecker immediately recognisable
    by its striking pied black and white plumage, combined with a distinctive red
    patch on the lower belly. Males and young birds display additional red markings
    on the neck or head, making them easy to distinguish. It is a compact, powerful
    bird well-adapted to its arboreal lifestyle.


    This species is found throughout much of the Palearctic region, including parts
    of North Africa. In most areas it is resident year-round, though northern populations
    may migrate when conifer cone crops fail. It is also known to wander occasionally,
    with some individuals turning up as vagrants far beyond their typical range.


    The great spotted woodpecker is highly vocal and active. It chisels energetically
    into tree bark to extract food and excavate nest holes. It also drums—producing
    rapid, percussive sounds—for contact and territorial advertisement. Like all woodpeckers,
    it possesses remarkable anatomical adaptations that allow it to withstand the
    intense physical stresses generated by its constant hammering action on wood.'
migration:
  sv: '# Större hackspett – Förekomst i Skandinavien


    Större hackspett är huvudsakligen en stannfågel i Skandinavien och Nordeuropa,
    vilket betyder att många individer stannar året runt. De populationer som häckar
    i de kallaste nordligaste delarna av sitt utbredningsområde visar dock migrativ
    beteende och drar sig söderut under de hårdaste vintermånaderna. I södra och mellersta
    Sverige, Norge och Danmark är arten i stor utsträckning bosatt året om, medan
    nordligare populationer kan visa visst flyttningsbeteende beroende på vintrarnas
    stränghet. Arten är således både stannfågel och delvis flyttfågel beroende på
    geografisk latitud.'
  en: '# Great Spotted Woodpecker in Northern Europe


    The Great Spotted Woodpecker is primarily resident throughout Scandinavia and
    Northern Europe, remaining year-round in most of its range. However, northern
    populations exhibit conditional migration patterns: birds may undertake southward
    movements during winters with poor conifer cone crops, their primary food source.
    This irruptive behavior means that migration timing is unpredictable and varies
    annually depending on seed availability. Some individuals also show wandering
    tendencies outside the breeding season, occasionally appearing in unexpected locations.
    Overall, the species is not a true regular migrant in the region but rather shows
    variable movements influenced by food availability.'
