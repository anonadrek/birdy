description:
  sv: ''
  en: '# Grey-headed Woodpecker


    The grey-headed woodpecker is a Eurasian member of the woodpecker family, distributed
    across Europe and extending eastward through the central and eastern Palaearctic
    to the Pacific Ocean, with its range also reaching south to the Himalaya and Malay
    Peninsula. It is one of three closely related green woodpecker species found in
    Europe, alongside the more commonly encountered European green woodpecker and
    the Iberian green woodpecker.


    Unfortunately, the provided source text contains limited details about the species''
    appearance, behaviour, vocalizations, and specific habitat preferences. To provide
    a comprehensive guide covering these essential aspects for birdwatchers, additional
    information would be required beyond what is currently available in the source
    material.'
migration:
  sv: ''
  en: '# Grey-headed Woodpecker (Picus canus) in Scandinavia/Northern Europe


    The grey-headed woodpecker is a rare and localized resident in Scandinavia and
    northern Europe, with its primary distribution centered in central and eastern
    regions. In the Nordic countries, it occurs irregularly and is largely absent
    from the westernmost areas. Populations are mainly sedentary, with birds remaining
    year-round in established territories, though northern populations may undertake
    limited movements during harsh winters. The species has shown range fluctuations
    historically, with occasional irruptive movements documented in response to severe
    weather conditions or food availability changes.


    Migration data unavailable for this species.'
