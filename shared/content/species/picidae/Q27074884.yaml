description:
  sv: '# Arabspett


    Arabspett är en hackspett som är endemisk för Arabiska halvön, vilket gör den
    till en fågel av särskilt intresse för ornitologer i regionen. Arten tillhör familjen
    hackspettar och är anpassad till de specifika miljöer som finns på denna geografiska
    region.


    Beståndet av arabspett är förhållandevis litet, och arten är klassificerad som
    nära hotad enligt internationella naturvårdsstandarder. Detta gör arten till ett
    fokus för bevarandeutsatser för att säkerställa att populationen inte försämras
    ytterligare.


    För den som är intresserad av hackspettar utgör arabspett ett intressant studiebjekt,
    främst på grund av sin begränsade utbredning och status som hotad art.'
  en: '# Arabian Woodpecker


    The Arabian woodpecker is a small member of the woodpecker family endemic to high
    mountain regions of the Arabian Peninsula. It is the only woodpecker species that
    breeds in this region, making it a distinctive and geographically unique bird.


    This species inhabits the mountainous terrain where it forages for insects in
    bark and wood, like other woodpeckers. Little detailed information is widely available
    about its specific plumage patterns, vocalizations, and detailed behavioral ecology
    compared to more studied woodpecker species.


    The Arabian woodpecker remains relatively little-known to general ornithologists,
    with its distribution restricted to limited mountain ranges in its native region.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: 'Migration data unavailable for this species.


    The Arabian Woodpecker is endemic to the Sarawat Mountains of Saudi Arabia and
    Yemen and does not occur in Scandinavia or Northern Europe. The source text provides
    no information about its movements, migration patterns, or seasonal distribution.
    This species is restricted to its native range in the Arabian Peninsula and would
    not be relevant for a Northern European bird guide.'
