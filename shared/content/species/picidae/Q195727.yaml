description:
  sv: '# Fjällig gröngöling


    Fjällig gröngöling är en hackspett som förekommer i bergiga regioner i Afghanistan,
    Pakistan och norra Indien. Det är en medelstor art inom familjen hackspettar.


    Arten är anpassad till höga bergsmiljöer och tros leva av insekter som det pickar
    fram ur barksprickor och ved, typiskt för hackspettar. Som många andra arter i
    familjen använder det säkerligen sitt starka näbb för att borra efter föda i träd.


    Gränsen för denna art ligger högt i höglandet, vilket gör den relativt svår att
    observera för de flesta fågelbeskare.'
  en: '# Scaly-bellied Woodpecker


    The scaly-bellied woodpecker is a member of the Picidae family found across the
    Indian subcontinent and adjoining mountainous regions. It inhabits areas ranging
    from arid foothills to temperate forests, typically at moderate to higher elevations
    where suitable woodland exists.


    This woodpecker derives its name from the distinctive scaled pattern on its underparts,
    which sets it apart from related species. Like other woodpeckers, it is superbly
    adapted for its specialist lifestyle, using its strong bill to excavate insects
    from bark and wood. It forages actively on tree trunks and branches, often working
    methodically through the available feeding opportunities.


    The species tends to be quieter and more retiring than many woodpeckers, though
    it produces typical woodpecker calls and the characteristic drumming sound when
    establishing territories or communicating with mates. It is generally encountered
    singly or in pairs rather than in flocks, moving through suitable habitat in search
    of food and nesting sites.'
