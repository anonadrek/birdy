    om migration, övervintering eller säsongsflytningar i Skandinavien eller Nordeuropa.
    Arten förekommer inte naturligt i dessa regioner.'
  en: '# Scaly-bellied Woodpecker – Occurrence in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Scaly-bellied Woodpecker is not known to occur in Scandinavia or Northern
    Europe. This species is endemic to the Indian subcontinent and adjoining regions,
    with its range restricted to Afghanistan, Iran, India, Nepal, Pakistan, and Turkmenistan.
    It does not migrate to or winter in Scandinavian or Northern European territories.'
