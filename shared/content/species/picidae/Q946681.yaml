description:
  sv: ''
  en: '# African Grey Woodpecker


    The African grey woodpecker is a widespread woodpecker species found throughout
    much of Sub-Saharan and equatorial Africa. It inhabits forested and bushy areas,
    where it makes its home in tree cavities, frequently selecting oil palms as nesting
    sites. The species is a resident breeder, laying two to four eggs per clutch.
    It remains common across its extensive range and is classified as of least concern
    for conservation status.


    While specific details about its appearance, vocalizations, and precise behavior
    are limited in the available source material, the African grey woodpecker''s prevalence
    in suitable woodland habitats makes it a relatively accessible species for birdwatchers
    in its range. Its preference for nesting in palm trees and natural forest cavities
    reflects its adaptation to diverse forest environments across the African continent.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The African Grey Woodpecker is a resident species throughout its Sub-Saharan and
    equatorial African range, with no documented migration patterns to or occurrence
    in Scandinavia or Northern Europe. This woodpecker is permanently established
    in its forest and bush habitats across Africa and does not undertake seasonal
    movements that would bring it to northern latitudes.'
