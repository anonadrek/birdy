description:
  sv: '# Spillkråka


    Spillkråka är en stor, nästan helsvart fågel inom familjen hackspettar och är
    Europas enda representant för sitt släkte. Det är en imponerande fågel som framför
    allt kännetecknas av sin massiva storlek och nästan helt svarta färg.


    Arten är starkt knuten till grov- och högstammig skog där den söker föda genom
    att hacka i döda och levande träd efter larver. Spillkråkan är en skicklig flugare
    trots sin stora kroppsvikt och rör sig ofta mellan stammar med karakteristiska
    dykningar.


    Arten är relativt tystlåten men ger från sig kraftiga, igenkännliga läten när
    den hackar eller flyger. Spillkråkan är generellt skygg och föredrar täta skogar,
    vilket gör den mindre vanlig att observera än mindre hackspettar, men dess stora
    hackgropar och imponerande närvaro gör den omöjlig att missa när den väl ses.'
  en: '# Black Woodpecker


    The black woodpecker is Europe''s largest woodpecker species and one of the largest
    in the world. It is a striking, all-black bird with a distinctive appearance that
    makes it unmistakable in the field. This powerful woodpecker inhabits mature,
    old-growth forests across the northern Palearctic, where it is a permanent resident
    that does not migrate. Its range has been expanding over recent decades.


    Black woodpeckers excavate impressively large tree cavities for nesting and roosting,
    and these holes subsequently provide crucial homes for numerous other bird and
    mammal species. The species feeds predominantly on carpenter ants, which it extracts
    from deadwood using its strong bill and long tongue. It is closely related to
    the pileated woodpecker of North America and fills an equivalent ecological role
    in European forests.


    The bird''s call is a loud, far-carrying drum-roll and distinctive vocalizations
    that help it communicate across its forest habitat. Observing one requires patience
    and access to suitable mature forest stands, where the sound of its powerful drumming
    and occasional sightings reward dedicated birdwatchers. Its presence indicates
    old-growth forest health and quality.'
migration:
  sv: '# Spillkråka i Skandinavien/Nordeuropa


    Spillkråka är en året runt boende art i Skandinavien och övriga Nordeuropa. Den
    är en stannfågel som inte genomför längre migrationer, utan stannar inom sitt
    revir även under vintermånaderna. Arten förekommer ganzåret i granskog och gammal
    barrskog där det finns tillräckligt med grova träd för hackning och bobygge. Under
    hårdare vintrar kan lokala förflyttningar förekomma, men arten återvänder till
    sina etablerade revir när förhållandena blir mer gynnsamma.'
  en: '# Black Woodpecker (Dryocopus martius) in Scandinavia/Northern Europe


    The Black Woodpecker is a non-migratory resident throughout Scandinavia and Northern
    Europe year-round. This species does not undertake seasonal migrations and maintains
    permanent territories in mature forest habitats across its range. Populations
    remain stable throughout winter months in northern regions where they are established,
    relying on their large size and ability to extract carpenter ants from trees even
    in harsh conditions. The species'' expanding range has led to increasing populations
    in Scandinavian countries, where it is now a permanent fixture in suitable old-growth
    and mature forest ecosystems.'
