description:
  sv: '# Snösparv


    Snösparven är en svartvit fågel med markanta kontraster i sin fjäderdräkt. Den
    är liten och tillhör familjen sporrsparvar. Fågeln är välkänd för sitt karakteristiska
    utseende med vita och svarta partier, vilket gör den lätt att identifiera.


    Arten häckar i arktiska områden där den trivs i de kallaste och mest ödsliga miljöerna.
    Under vintertid migrerar snösparven söderut och ses då i flockar på snötäckta
    områden och öppna landskap i tempererade, nordliga regioner. Den är ofta gregär
    och bildar gärna större sammanhängande grupper när den söker föda.


    Snösparven är klassificerad som minskat antal, men nedgången är inte tillräckligt
    kraftig för att arten ska betecknas som hotad. Populationen är relativt stabil
    trots de observerade trenderna över tid.'
  en: '# Snow Bunting


    The snow bunting is a striking Arctic specialist with a circumpolar breeding range
    across the northern hemisphere''s Arctic regions. It holds the distinction of
    being the world''s most northerly passerine species. Beyond its main Arctic habitat,
    small isolated populations persist on high mountain tops at lower latitudes, including
    a few alpine areas in Scotland and others along the Alaska-Yukon border.


    This small bunting is highly adapted to harsh, cold environments where few other
    songbirds venture. It breeds in sparse, rocky Arctic tundra and visits lower latitudes
    primarily during winter months, when birds from Arctic populations migrate southward.
    During migration and winter, it frequents open, windswept terrain including coastal
    areas, grasslands, and agricultural fields, often in small flocks.


    The snow bunting''s appearance and behaviour reflect its extreme habitat specialization,
    making it a remarkable example of a passerine pushed to the ecological limits
    of where songbirds can survive.'
migration:
  sv: '# Snösparv – Förekomst i Skandinavien


    Snösparven är en arktisk häckfågel som förekommer i norra Skandinavien under sommaren.
    Under vintern migrerar arten söderut och ses då i flockar i tempererade nordliga
    områden, inklusive Sverige och Norge. Fågeln ankommer till häckningsområdena på
    våren och drar bort under hösten när de arktiska områdena blir snötäckta. I Skandinavien
    är snösparven därför både sommargäst i högfjällen och vintergäst i de södra delarna
    av regionen.'
  en: '# Snow Bunting Migration in Northern Europe


    The Snow Bunting is a highly migratory Arctic specialist that breeds throughout
    the high Arctic and visits Scandinavia and northern Europe primarily during winter
    months. Birds from Arctic breeding populations migrate south in autumn, typically
    arriving in Scandinavia from September onwards, with numbers peaking through winter
    until March or April. They favor coastal areas, open terrain, and agricultural
    land where they feed on seeds and insects. Breeding occurs from May to July in
    the far north, though small resident populations maintain year-round presence
    on high Scottish mountains. By late spring, the majority depart northward to return
    to their circumpolar Arctic breeding grounds.'
