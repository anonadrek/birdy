description:
  sv: '# Garfågel


    Garfågeln var en flightlös havsfågel som tillhörde familjen alkor och levde i
    norra Atlanten. Den var utmärkt på dykningar och var helt anpassad för liv på
    havet. Arten utrotades under 1800-talet genom intensiv jakt – människor döda den
    för kött, dun, skinn och fett. Även insamling av ägg försvagade bestånden kraftigt.
    De två sista säkert dokumenterade exemplaren dödades den 3 juli 1844 vid ön Eldey
    utanför Islands kust, även om några opåverkade observationer rapporterades några
    år senare.


    Garfågeln är nu utdöd, men dess utseende och biologi är känd från museiexemplar
    som finns bevarade på flera institutioner runt om i världen.'
  en: '# The Great Auk


    The great auk was a large, flightless alcid that inhabited the Northern Hemisphere
    until its extinction in the mid-19th century. It was the sole modern member of
    its genus, Pinguinus, and despite sharing the name "penguin" with Southern Hemisphere
    birds, it was not closely related to them—rather, those penguins were named after
    it. The species first appeared around 400,000 years ago, surviving for hundreds
    of millennia before its relatively recent disappearance.


    Today, the great auk exists only in museum specimens and historical records, serving
    as a poignant reminder of human impact on wildlife. Its extinction marks the loss
    of a unique alcid that had evolved in the Northern Hemisphere''s cold waters,
    distinct from both its modern alcid relatives and the unrelated penguins of the
    south.'
