  en: 'Migration data unavailable for this species.


    The Great Auk (*Pinguinus impennis*) is an extinct species, having disappeared
    in the mid-19th century, so contemporary migration patterns cannot be documented.
    As a flightless alcid that inhabited northern Atlantic waters, historical records
    suggest it was present year-round in northern European waters, including Scandinavian
    regions, but detailed seasonal movement data are not available from reliable sources.'
