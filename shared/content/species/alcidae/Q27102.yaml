description:
  sv: '# Tordmule


    Tordmule är en fågel i alkorfamiljen och den enda levande arten i sitt släkte.
    Den är anpassad för livet till havs och förekommer längs norra Atlantens kuster,
    från nordöstra Nordamerika i väster till Vita havet i öster. Arten hittas även
    vid Island, Storbritannien och Frankrikes kuster.


    Tordmulen tillhör de alkorfåglar som är utmärkta dykare och simmare. Den är en
    havsspecialist som ofta ses på öppet vatten eller i större flockar. För den som
    vill se denna intressanta fågel krävs vanligtvis en båttur eller observation från
    kusten under de årstider då arten är närvarande i sitt utbredningsområde.'
  en: '# Razorbill


    The razorbill is a striking black-and-white seabird belonging to the auk family,
    and the sole surviving member of its genus. It is the closest living relative
    of the extinct great auk. This North Atlantic specialist is highly adapted for
    life at sea, spending much of the year far from land.


    Razorbills are distinguished by their characteristic compressed, blade-like black
    bill with a distinctive white line running along it—a feature that gives the species
    its name. The plumage is predominantly black above with a white belly and distinctive
    white facial patches that vary seasonally. It is a compact, sturdy bird built
    for diving, with relatively short wings and legs positioned far back on the body,
    making it an excellent swimmer but ungainly on land.


    These birds are highly colonial, gathering at sea cliffs and rocky coastlines
    to breed during the breeding season. They are accomplished divers, pursuing small
    fish and other prey underwater with agility. The razorbill''s call is a low, growling
    vocalization heard mainly at breeding colonies. Outside the breeding season, they
    disperse widely across northern Atlantic waters, often seen in pairs or small
    groups. Despite historical declines, razorbill populations have shown recovery
    in recent decades across much of their range.'
migration:
  sv: '# Tordmule – Utbredning och flyttning i Norden


    Tordmule är en nordatlantisk havsfågel som förekommer längs Skandinaviens och
    Norges kuster. Under häckningstiden finns arten vid steniga öar och klippor från
    Island och Storbritannien österut. I norra delen av sitt utbredningsområde, inklusive
    norskt och svenskt kustland, är tordmulen huvudsakligen en säsongsfågel som återvänder
    till häckningsplatserna under våren. Efter häckningen drar många fåglar ut till
    havet där de övervintrar i öppna oceaniska områden väster om Europa. Under vintermånaderna
    kan mindre antal individer påträffas längs skandinavisk kust, men arten är framför
    allt en sommargäst i inlandet och på norra breddgrader.'
  en: '# Razorbill (Alca torda) in Northern Europe


    The razorbill is a year-round North Atlantic seabird with populations breeding
    throughout Scandinavian and northern European coastal regions during summer months.
    These auks are primarily migratory, with breeding birds departing their cliff
    colonies in autumn to winter in offshore Atlantic waters. Most Scandinavian razorbills
    return to breeding sites between April and May, after spending winter months at
    sea from October through March. During winter, they disperse southward into the
    Atlantic, occasionally appearing in coastal waters further south. Some populations
    remain relatively sedentary in ice-free northern waters, though severe winters
    may force additional southward movement.'
