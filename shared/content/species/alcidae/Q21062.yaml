description:
  sv: '# Sillgrissla


    Sillgrissla är en medelstor havsfågel från familjen alkor med distinkt färgteckning.
    Båda könen är svarta eller mörkbruna på ryggen, huvudet och överside av vingarna,
    vilket skapar en markant kontrast mot den vita buken. Denna färgmönstring gör
    arten lätt igenkännlig på havet.


    Arten är en kolonihäckare som förekommer utmed kusterna i de norra delarna av
    Holarktis. Det är en återkommande fågel på många kustlokaler inom sitt utbredningsområde,
    där den ses ofta på öppet vatten nära häckningsöarna. Sillgrissla är välanpassad
    för ett maritimt liv och tillbringar mycket tid på sjön där den söker föda.'
  en: '# Common Murre


    The common murre is a large, stocky auk with a distinctive appearance suited to
    its marine lifestyle. It displays dark upperparts contrasting sharply with a white
    breast and underparts, and possesses a slender, pointed bill designed for catching
    fish underwater. During breeding season, some populations develop a white eye-ring
    and ear stripe, adding subtle elegance to its otherwise austere plumage.


    A truly oceanic bird, the common murre spends the majority of its year at sea
    in northern waters across both the Atlantic and Pacific. It is an excellent diver,
    pursuing small fish with remarkable agility beneath the waves. The species only
    comes ashore during the breeding season, gathering in enormous colonies on rocky
    cliff faces and islands. It nests directly on narrow ledges without constructing
    a nest, relying on a remarkable egg shape that prevents it from rolling off precarious
    perches.


    The common murre is highly vocal at breeding colonies, producing various calls
    including growls and trumpeting sounds that echo across the cliffs. Outside the
    breeding season, it remains largely silent at sea. Its circumpolar distribution
    in low-Arctic and boreal waters makes it a familiar sight to observers in coastal
    regions of northern latitudes.'
migration:
  sv: Sillgrissla är en övervintrande art i nordeuropeiska vatten. Arten häckar vid
    kusterna under sommaren och är tillsammans med andra alkfåglar bunden till marint
    habitat året runt. Under hösten och vintern sprider sig populationen ut mot öppna
    havsområden där de tillbringar tiden på vattnet. Individer från de nordliga häckningsområdena
    kan vandra längre söderut under de kallaste månaderna, men många stannar året
    om i närheten av sina häckningsrevir. Huvuddelen av året är arten således närvarande
    i skandinaviska farvatten och omgivande nordeuropeiska havsområden.
  en: '# Common Murre (Uria aalge) in Northern Europe


    The Common Murre is a year-round resident in Scandinavian and Northern European
    waters, with populations showing limited migration patterns. Birds breeding in
    northern regions typically move southward during winter to ice-free waters, particularly
    along the Norwegian coast, North Sea, and around the British Isles. Some populations
    remain relatively sedentary if open water persists throughout the year. Breeding
    birds return to their cliff colonies from March onwards, with egg-laying occurring
    in April-May. Outside the breeding season (August-February), murres disperse widely
    at sea, moving to deeper offshore waters where they remain until spring calling
    draws them back to traditional breeding sites.'
