description:
  sv: '# Spetsbergsgrissla


    Spetsbergsgrissla är en alcid som är nära släktad med sillgrisslan, men skiljer
    sig genom att häcka betydligt längre norrut. Det är en sällsynt fågel söder om
    sitt nordliga utbredningsområde. I Sverige har den noterats endast vid ett femtiotal
    tillfällen, vilket gör varje observation värdefull för fågelintresserade.


    Arten förekommer främst i höga nordliga breddgrader där det är lämpligt för häckning.
    Observationer av spetsbergsgrissla utanför sitt normala område är mycket ovanliga
    och ofta resultatet av väderomslag eller andra förhållanden som driver fågeln
    söderut från sitt hemland.'
  en: '# Thick-billed Murre


    The thick-billed murre is a member of the auk family, a group of diving seabirds
    adapted to cold oceanic environments. This species is distinguished by its stocky
    build and robust, pointed bill—features that give it its common name. It shares
    similarities with related auks but can be identified by its particularly heavy
    bill structure.


    Like other alcids, the thick-billed murre is a proficient diver, pursuing small
    fish underwater with remarkable agility. It spends much of its time at sea, coming
    ashore primarily during breeding season when it gathers in large colonies on rocky
    cliffs and islands. During winter, it disperses across northern ocean waters.


    The species exhibits regional variation, with populations differing in plumage
    intensity. The North Pacific subspecies is notably darker, with very deep black
    coloration. As a seabird, it is most commonly encountered during pelagic surveys
    or observed from coastal vantage points where breeding colonies congregate during
    the breeding season.'
migration:
  sv: '# Spetsbergsgrissla i Skandinavien och Nordeuropa


    Spetsbergsgrissla är en arktisk art som är bosatt i nordliga regioner året om.
    Den häckar i högnordiska områden, primärt på Spetsbergen och andra arktiska lokaler,
    och utgör en vanlig häckfågel i dessa områden. Under vintern stannar många populationer
    i eller närliggande de arktiska häckningsplatserna, där den söker föda på öppet
    hav. I Skandinavien och övriga Nordeuropa ses arten mycket sällan, och förekommer
    endast sporadiskt söder om sitt huvudsakliga utbredningsområde. I Sverige har
    arten dokumenterats endast omkring 50 gånger, vilket gör den till en ytterst sällsynt
    gäst för regionen. Denna begränsade förekomst söder om de arktiska häckningsområdena
    beror på artens starkt nordliga habitat-preferenser.'
  en: '# Thick-billed Murre (Uria lomvia) in Northern Europe


    The thick-billed murre is a year-round resident in Scandinavian and Northern European
    waters, particularly around Spitsbergen and other Arctic regions. This alcid species
    breeds during summer months on coastal cliffs and rocky islands, where colonies
    establish from May through August. Outside the breeding season, thick-billed murres
    remain largely within northern waters, undertaking modest southward movements
    during winter months as ice coverage increases. Some populations disperse to slightly
    more southern latitudes along Norwegian coasts, but most individuals remain at
    high northern latitudes throughout the year rather than undertaking extensive
    long-distance migration typical of many seabird species.'
