description:
  sv: ''
  en: '# Malachite Kingfisher


    The Malachite Kingfisher is a small river kingfisher found throughout sub-Saharan
    Africa, where it remains largely resident year-round, though it may shift location
    seasonally in response to climate changes. This compact bird is highly adapted
    to freshwater environments and hunts by perching on low branches or rocks overhanging
    water before diving swiftly to catch small fish and aquatic invertebrates.


    It is a striking bird with brilliant turquoise-blue upperparts that give it its
    common name, contrasting sharply with its rufous underparts and face. The crown
    is crested, adding to its distinctive silhouette. Its relatively long, pointed
    bill is perfectly designed for precision hunting in shallow water.


    The Malachite Kingfisher favors rivers, streams, and freshwater pools, typically
    in open or semi-open habitats rather than dense forests. It is most active during
    dawn and dusk, often perching motionless for extended periods while watching for
    prey movement. These kingfishers are usually solitary or seen in pairs and maintain
    territories along suitable waterways throughout their range.'
