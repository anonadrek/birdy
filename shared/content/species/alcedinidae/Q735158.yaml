description:
  sv: ''
  en: '# White-throated Kingfisher


    The white-throated kingfisher is a striking tree kingfisher with a turquoise back
    and wings contrasting sharply with its rufous-chestnut head and white throat and
    breast. It is widely distributed across Asia, from the Middle East through the
    Indian subcontinent to China and Indonesia, where it is largely resident throughout
    the year.


    Unlike many kingfisher species, this bird is highly adaptable and often hunts
    far from water, perching on wires, buildings, and trees while scanning for prey.
    It feeds on a diverse range of items including small reptiles, amphibians, crabs,
    small rodents, and even birds. This versatility allows it to thrive in both rural
    and urban environments.


    During breeding season, the white-throated kingfisher becomes notably vocal, calling
    loudly and persistently from prominent perches in the early mornings. Its distinctive
    loud, repetitive calls are often among the first sounds heard at dawn. This combination
    of striking appearance, versatile hunting habits, and conspicuous behaviour makes
    it one of Asia''s most recognizable kingfisher species.'
migration:
