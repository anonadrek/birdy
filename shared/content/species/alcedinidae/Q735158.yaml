  en: '# White-throated Kingfisher in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The White-throated Kingfisher is an Asian species with a range extending from
    the Sinai Peninsula through the Indian subcontinent to China and Indonesia. It
    is primarily a resident species throughout its range, with some populations undertaking
    only short-distance movements. This bird does not occur in Scandinavia or Northern
    Europe and is therefore not relevant to regional migration patterns or seasonal
