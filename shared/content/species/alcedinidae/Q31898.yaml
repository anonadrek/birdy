description:
  sv: '# Halsbandskungsfiskare


    Halsbandskungsfiskare är en kungsfiskare med vid utbredning från Röda havet till
    Stilla havet. Det är en medlem av familjen kungsfiskare inom ordningen praktfåglar.
    DNA-studier har visat att flera tidigare klassificerade underarter är egna distinkta
    arter, vilket har gjort att denna arts systematiska ställning har reviderats under
    senare tid.


    Arten återfinns i kustnära och deltamiljöer över sitt expansiva utbredningsområde,
    där det jagar små fiskar och havskräktur från exponerade utgångspunkter. Som många
    kungsfiskare är halsbandskungsfiskaren en skicklig bågjägare som dyker snabbt
    ned i vattnet för att fånga sitt byte.'
  en: '# Collared Kingfisher


    The collared kingfisher is a medium-sized tree kingfisher with a distinctive appearance
    featuring a prominent white collar that contrasts sharply with its darker head
    and back plumage. Known by several alternative names—white-collared, black-masked,
    and mangrove kingfisher—it displays considerable variation across its range, with
    several populations now recognized as separate species. The bird''s striking facial
    pattern and robust build make it relatively easy to identify in the field.


    This kingfisher inhabits a vast geographic range spanning from the Red Sea eastward
    across southern Asia and extending through the Indo-Pacific region to Melanesia.
    It is typically found in coastal and mangrove habitats, though it also frequents
    woodland and scrubland areas near water. The collared kingfisher perches alertly,
    watching for small fish, crustaceans, and other prey in shallow waters below.


    The species remains common throughout much of its range and has proven adaptable
    to various wetland environments. Its wide distribution and habitat flexibility
    have allowed populations to persist despite habitat changes, making it one of
    the more successful kingfisher species across its substantial range.'
