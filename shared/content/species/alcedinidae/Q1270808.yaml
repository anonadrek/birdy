description:
  sv: ''
  en: '# Grey-headed Kingfisher


    The grey-headed kingfisher is a widespread African kingfisher found across the
    continent from west to east and extending into southern Arabia. It occurs in suitable
    habitats from coastal regions to inland areas, inhabiting both mainland territories
    and offshore islands throughout its extensive range.


    This species belongs to the kingfisher family and is adapted to hunting in aquatic
    environments characteristic of kingfishers. Like other members of its family,
    it is specialized for diving and capturing prey from water, though specific details
    about its appearance, behaviour, and vocalizations would benefit from additional
    field observation guides. The bird''s distribution reflects its ability to exploit
    diverse wetland and waterside habitats across its broad geographic range, making
    it a relatively accessible kingfisher species for observers across much of Africa
    and the Arabian Peninsula.'
