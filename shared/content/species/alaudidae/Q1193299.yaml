description:
  sv: '# Ökenberglärka


    Ökenberglärka är en liten fågel som tillhör familjen lärkor. Den är väl anpassad
    till livet i ökenlandskap och förekommer i Nordafrika och delar av Mellanöstern,
    där den lever på karga och torra områden.


    Arten är kategoriserad som livskraftig av IUCN, vilket innebär att beståndets
    status för närvarande är stabil. Som många andra lärkor är det en jordnära fågel
    som söker föda på marken. För den intresserade fågelseeländaren erbjuder arten
    en glimt av öknens speciella fågelvärld, anpassad till hårt klimat och sparsamt
    växtliv.'
  en: ''
