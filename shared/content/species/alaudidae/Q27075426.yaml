description:
  sv: '# Sandlärka


    Sandlärka är en liten asiatisk lärka som är anpassad till öppen sandmiljö. Det
    är en diskret fågel som förekommer vid sandbankar längs vattendrag och i kustnära
    sanddyner. Arten trivs i torra, öppna landskap där vegetationen är sparsam och
    sandige eller grusiga ytor dominerar.


    Denna lärka är en markvandare som ofta rör sig på marken för att söka föda. Som
    många lärkarter har även sandlärkan en sång som den ofta framför från låga upphöjningar.
    Arten är anpassad för att smälta in i sin öppen sandmiljö.


    Sandlärkan förekommer från södra Iran österut till södra Myanmar. Arten anses
    ha ett stabilt bestånd, och dess population klassificeras som livskraftig.'
  en: '# Sand Lark (*Alaudala raytal*)


    The Sand Lark is a diminutive member of the lark family, noticeably smaller than
    its relative, the Short-toed Lark. As a small passerine bird, it shares the characteristic
    features typical of larks, though its compact size makes it one of the more delicate
    representatives of the group.


    This species is found across southern Asia, inhabiting arid and semi-arid regions
    where sparse vegetation provides suitable breeding and foraging habitat. Like
    other larks, it is adapted to open ground environments, where it searches for
    insects and seeds among sandy or stony terrain.


    Further details about the Sand Lark''s specific plumage patterns, vocalizations,
    and precise behavioral traits would require additional source material for an
    accurate description.'
