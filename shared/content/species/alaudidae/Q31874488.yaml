description:
  sv: '# Brunkronad lärka


    Brunkronad lärka är en relativt nyligen vetenskapligt urskild art inom lärkfamiljen.
    Den är en liten marklärka med karakteristisk rostbrun hjässa som ger arten sitt
    namn. Arten förekommer på båda sidor om Adenviken, på sydvästra Arabiska halvön
    samt i Afrikas horn, där den bebor torr och karg miljö.


    Som många andra lärkor är arten främst en markfågel som födosöker på marken. Den
    är klassificerad som livskraftig av IUCN, vilket indikerar att populationen för
    närvarande är stabil. Arten urskiljdes relativt nyligen från rostkronad lärka,
    vilken den tidigare behandlades som underart till. Denna taxonomiska förändring
    gjenspegler moderna genetiska och morfologiska studier som visat att de två taksa
    är tillräckligt skilda för att betraktas som egna arter.'
  en: '# Rufous-capped Lark


    The Rufous-capped Lark is a small passerine of the lark family, found in southwestern
    Arabia and the Horn of Africa. This diminutive bird is adapted to arid environments,
    inhabiting sparse, open ground with minimal vegetation where it can blend seamlessly
    into its surroundings.


    Like other larks, the Rufous-capped Lark is primarily terrestrial, spending much
    of its time on the ground foraging for insects and seeds. It is typically seen
    in small groups or pairs, moving quietly through its habitat. The bird''s behaviour
    reflects its preference for cryptic, ground-based living.


    The species displays the characteristic rufous coloring on its crown that gives
    it its English name, helping to distinguish it from related lark species. Its
    call and song are typical of larks, though detailed descriptions of its vocalizations
    require further observation in the field. The Rufous-capped Lark remains relatively
    inconspicuous within its range, making it a challenging species for observers
    to locate.'
