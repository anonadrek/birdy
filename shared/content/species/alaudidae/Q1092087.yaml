description:
  sv: '# Streckig ökenlärka


    Streckig ökenlärka är en liten medlem av lärkfamiljen som förekommer i Nordafrika.
    Det är en diskret fågel anpassad för öppen, torr miljö. Arten karakteriseras av
    en relativt liten storlek och streckad fjäderdräkt som ger den utmärkt kamouflage
    i sin naturliga habitat.


    Denna lärka är en terräng- och marksökande fågel som främst rör sig på marken.
    Det födosöker efter insekter och frön bland den glesa vegetationen i sin torra
    miljö. Som många lärkarter kan arten sjunga från marken eller från låga upphöjningar.


    Streckig ökenlärka är anpassad för att överleva i närmast öken- och halvökenhabitat.
    Det är en relativt stillsam fågel som ofta kan vara svår att skymta på grund av
    sin dunkla färg och marknära levnadssätt.'
