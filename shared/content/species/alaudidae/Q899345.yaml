description:
  sv: '# Härfågellärka


    Härfågellärka är en stor och långnäbbad lärka som är väl anpassad till liv i torra
    miljöer. Det karaktäristiska långnäbbade utseendet skiljer arten från andra lärksor
    och användes historiskt för att jaga insekter i sandig mark. Arten är färgad i
    jordiga toner som gör det väl kamouflerat i sin ökenhabitat.


    Arten förekommer i öknar och halvöknar över ett stort geografiskt område från
    nordvästra delar österut till södra Asien. Det trivs på öppen sandig och stenig
    mark där det söker föda på marken. Även om beståndet minskar gradvis anses det
    fortfarande vara livskraftigt och arten klassificeras inte som hotad.'
  en: '# Greater Hoopoe-Lark


    The Greater Hoopoe-Lark is a passerine bird adapted to the harshest environments.
    It is a breeding resident of arid and semi-desert regions, ranging from the Cape
    Verde Islands across northern Africa, through the Arabian Peninsula, and eastward
    to India and Afghanistan. The species inhabits open, sparsely vegetated landscapes
    where few other birds thrive.


    This lark is distinctly marked with striking plumage patterns that help it blend
    into desert surroundings. Its appearance includes characteristic markings that
    distinguish it from other desert larks, though detailed field marks are best confirmed
    through regional bird guides. Like other larks, it is primarily a ground-dwelling
    bird, foraging for insects and seeds among sparse vegetation and bare ground.


    The species was formerly called the Bifasciated Lark, a reference to its distinctive
    markings. It remains relatively specialized in its habitat preferences, being
    found almost exclusively in open desert and semi-desert terrain where vegetation
    is minimal. Its adaptations to such extreme environments make it a notable member
    of desert bird communities across its extensive range.'
migration:
