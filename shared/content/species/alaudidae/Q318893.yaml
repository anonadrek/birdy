description:
  sv: '# Svartlärka


    Svartlärka är en medlem av lärkfamiljen som skiljer sig från många andra lärkor
    genom sin mycket utmärkande sexuell dimorfism. Hanen är nästan helt svart med
    vita fläckar på vingarna, medan honan är betydligt ljusare med brungrå färgteckning.
    Arten är medelstor inom lärkfamiljen och anpassad för liv i öppet terräng.


    Arten häckar i stäpplandskap främst i sydöstra Ryssland och Kazakstan. Den är
    en kortflyttare som under vintern förflyttar sig något väster- och söderut för
    att hitta lämpliga förhållanden. I Sverige är arten en mycket sällsynt gäst och
    har endast dokumenterats en enda gång.


    Svartlärkan är olyckligtvis under starkt tryck från habitatförstöring. Det stäpplandskap
    där arten lever omvandlas i allt större omfattning till jordbruksmark, vilket
    har lett till dramatiska beståndsminsningar, särskilt i Europa där arten nu är
    närapå utgången som häckfågel. Globalt bedöms beståndet dock fortfarande vara
    livskraftigt, även om trenden är oroande.'
  en: ''
migration:
  sv: '# Svartlärka – Förekomst i Nordeuropa


    Svartlärka är en kortflyttare som häckar i stäpplandskapen i sydöstra Ryssland
    och Kazakstan. Under vintern rör sig arten något väster- och söderut från sina
    häckningsområden. I Skandinavien och övriga Sverige är svartlärka en mycket sällsynt
    gäst, med endast ett dokumenterat fynd i Sverige. Arten förekommer inte regelbundet
    i Nordeuropa och kan betraktas som en mycket ovanlig tillfällig besökare snarare
    än en etablerad migrant i regionen.'
  en: ''
