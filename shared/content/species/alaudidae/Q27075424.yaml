    occurrence, migration patterns, or seasonal distribution in Scandinavia or Northern
    Europe. Given its Mediterranean and North African distribution, this species would
    be outside its normal range in Scandinavian regions and would not be expected
    as a regular migrant or winter visitor to Northern Europe.'
