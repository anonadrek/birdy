description:
  sv: '# Medelhavslärka


    Medelhavslärka är en liten lärka från familjen lärkor. Arten förekommer runt Medelhavsregionen,
    på Kanarieöarna och i västra Mellanöstern. Det är en relativt nyligen urskilj
    art – tidigare klassificerades den tillsammans med turkestanlärka och sidenvägslärka
    under det gemensamma namnet dvärglärka. Dessa tre arter anses nu vanligen vara
    egna, distinkta arter.


    Som många andra små lärkor är medelhavslärkan välanpassad för sitt torra habitat.
    Medan arten är rätt liten jämfört med andra lärkor, delar den många av familjens
    karakteristiska drag och levnadssätt i öppna, kuperade terränger.'
  en: '# Mediterranean Short-toed Lark


    The Mediterranean short-toed lark is a small passerine belonging to the lark family.
    It inhabits arid and semi-arid regions across a vast range spanning from Atlantic
    coastal areas eastward through North Africa and the Mediterranean region to the
    Middle East. The species is widespread and common throughout its distribution,
    with populations showing no signs of decline, earning it a conservation status
    of "least concern."


    This diminutive lark favours open, dry habitats including stony ground, sparse
    scrubland, and desert margins where vegetation is minimal. It forages on the ground
    for seeds and insects, moving with quick, jerky movements characteristic of its
    family. Like other larks, it is primarily terrestrial and tends to remain inconspicuous
    until flushed.


    The species'' adaptability to harsh, arid environments across diverse regions—from
    Mediterranean coasts to desert areas—demonstrates its ecological flexibility and
    contributes to its successful status as one of the region''s common larks.'
