  en: '# Mediterranean Short-toed Lark in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Mediterranean Short-toed Lark is primarily a Mediterranean Basin species with
    its range extending from the Canary Islands through North Africa to the Middle
