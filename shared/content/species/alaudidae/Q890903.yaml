  en: 'Migration data unavailable for this species.


    The Raso lark is endemic to Raso islet in the Cape Verde Islands, located off
    the west coast of Africa, far south of Scandinavia and Northern Europe. This critically
    endangered species has an extremely restricted range and does not occur in Scandinavia
    or Northern Europe at any time of year. Therefore, migration patterns in this
    region are not applicable to this species.'
