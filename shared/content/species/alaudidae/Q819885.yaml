description:
  sv: '# Asiatisk kalanderlärka


    Asiatisk kalanderlärka är en medelstor lärka som häckar i öppna, torra landskap
    från Turkiet österut in i Centralasien. Arten är huvudsakligen flyttfågel och
    övervintar i större delen av Afrika och på den indiska subkontinenten.


    Den är mycket sällsynt i Västeuropa och har endast noterats ett fåtal gånger i
    Sverige. På sitt häckningsområde förekommer arten i stäppor och halvtorrt terräng
    där det växer låg vegetation. Som de flesta lärkor livnär det sig på frön och
    insekter.


    Arten är klassificerad som livskraftig av IUCN och populationen anses vara stabil.'
  en: '# Bimaculated Lark


    The Bimaculated Lark is a member of the lark family found across warm temperate
    regions from Turkey eastward into Central Asia. It serves as the eastern counterpart
    to the closely related Calandra Lark, occupying similar ecological niches across
    its range.


    This species inhabits open, arid landscapes typical of its continental distribution.
    Like other larks, it is well-adapted to ground-living and open-country environments
    where it forages for seeds and insects. The bird''s behavior and ecological preferences
    reflect its specialization for the semi-arid habitats of its range.


    Further details about its specific appearance, vocalizations, and detailed behavioral
    patterns would benefit from additional sources, as the available information is
    limited to its geographic distribution and taxonomic relationships.'
migration:
  sv: '# Asiatisk kalanderlärka – Förekomst i Norden


    Asiatisk kalanderlärka är en mycket sällsynt gäst i Skandinavien och Västeuropa.
    Arten är huvudsakligen stationär i sitt utbredningsområde från Turkiet österut
    in i Centralasien, där den häckar. Merparten av populationen utgörs dock av flyttfåglar
    som vintertid drar mot sydvästra vinterkvarteren från nordöstra Afrika till Indien.
    I Sverige är arten extremt ovanlig med endast sex dokumenterade fynd totalt, och
    den förekommer inte som någon regelbunden gäst eller övervintrare i området.'
  en: '# Melanocorypha bimaculata in Northern Europe


    Migration data unavailable for this species.


    The Bimaculated Lark breeds in warm temperate regions from Turkey eastward through
    Central Asia. This species does not occur in Scandinavia or Northern Europe during
    any season. As a resident or short-distance migrant of Central Asian steppes and
    semi-arid regions, the Bimaculated Lark remains outside the normal range of Northern
    European bird communities.'
