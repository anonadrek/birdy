description:
  sv: '# Sandökenlärka


    Sandökenlärka är en liten ökenlevande sångfågel som tillhör lärkfamiljen. Arten
    förekommer i ökenhabitat från Nordafrika österut till Pakistan, där den är anpassad
    till torr, stenig miljö. Beståndet minskar något men anses fortfarande vara livskraftigt.


    Arten är en diskret fågel som föredrar att hålla sig på marken i sitt ökenhabitat.
    Den är väl anpassad till sitt torra miljöval och återfinns där man söker efter
    små sångfåglar bland klippor och gles vegetation. Som många lärkarter är sandökenlärka
    en modest fågel som ofta är svår att se om man inte känner till var man ska leta.'
  en: '# Bar-tailed Lark


    The bar-tailed lark is a small desert lark found across a vast range from northwestern
    Africa through the Middle East to Pakistan. It inhabits hot, arid deserts and
    is generally common throughout much of its distribution, though patchily less
    common in some areas. The species faces no immediate threats and maintains a "least
    concern" conservation status, despite recent surveys indicating a gradual decline
    in overall numbers.


    This inconspicuous desert bird is well-adapted to harsh, barren environments where
    few other species thrive. Like other larks, it tends to be more easily heard than
    seen, preferring to forage on the ground among sparse vegetation and rocks. The
    bar-tailed lark''s cryptic coloration helps it blend seamlessly with desert surroundings,
    making visual identification challenging for observers. Its presence is often
    confirmed through its distinctive vocalizations rather than direct sightings.


    Those seeking this species should focus their efforts on appropriate arid habitats
    during the appropriate season for their region, though the bird''s wide distribution
    means it may be encountered across multiple desert zones within its range.'
