description:
  sv: '# Trädlärka


    Trädlärka är en liten och kompakt medlem av lärkfamiljen, betydligt mindre än
    sånglärkan. Den är den enda arten i sitt släkte Lullula och kännetecknas av sin
    behagliga utseende med diskreta färgmarkeringar typiska för lärkfamiljen.


    Arten häckar över ett stort geografiskt område från södra Skandinavien österut
    genom Europa till Turkmenistan, och förekommer även i norra Afrika. Den föredrar
    öppna och halvöppna biotoper. Under häckningsperioden är födan blandad med både
    insekter och frön, men under övriga årstider består näringen främst av frön. Denna
    anpassning gör arten relativt mobil och mindre beroende av insekttillgång än många
    andra lärksläkten.


    Trädlärkan är värd att lära känna för den som intresserar sig för lärkfamiljen
    och dess ekologiska roller i öppet landskap.'
  en: '# Woodlark


    The woodlark is a small member of the lark family and the sole surviving species
    in its genus. It inhabits a broad geographic range spanning most of Europe, the
    Middle East, western Asia, and north African mountains. Populations vary in their
    migratory behaviour: western birds are largely resident year-round, while eastern
    populations migrate southward during winter months.


    This passerine displays the characteristic features typical of larks, though it
    remains less familiar to many birdwatchers than its relatives. The woodlark''s
    ecology and habitat preferences reflect its adaptation to diverse environments
    across its extensive range, from lowland areas to mountainous terrain. Its presence
    varies seasonally depending on geographic location, making it a species of interest
    for both resident and visiting observers throughout its distribution.'
migration:
  sv: '# Trädlärka – förekomst i Skandinavien


    Trädlärkan förekommer som häckfågel i södra Skandinavien under våren och sommaren.
    Arten är en långdistanszigrare som övervintar i Nordafrika och återvänder till
    sina häckningsområden under mars-april. Under hösten migrerar populationerna söderut
    från juli till september för att undvika den nordiska vintern. I Sverige är trädlärkan
    främst förekommande i södra och mellersta delen av landet.'
  en: '# Woodlark in Scandinavia and Northern Europe


    The Woodlark is mainly resident across western Europe, including Scandinavia,
    where it does not undertake significant migrations. However, populations in eastern
    regions are migratory, moving southward during winter months. In Scandinavia and
    Northern Europe, the species is largely year-round, with resident birds remaining
    throughout winter in suitable habitat. Some movement may occur within the region
    in response to weather conditions, but the Woodlark does not perform the extensive
    long-distance migrations characteristic of many northern European bird species.
    Its sedentary nature in the western parts of its range means that individuals
    present in Scandinavian territories tend to stay rather than undertake seasonal
    journeys to distant wintering grounds.'
