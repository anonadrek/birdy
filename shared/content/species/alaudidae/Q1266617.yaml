description:
  sv: '# Dupontlärka


    Dupontlärka är en skygg och mycket svårsedd lärka som huvudsakligen förekommer
    på torra, steniga bergsluttningar med glest växtlighet. Det är en liten, diskret
    lärka med dämpad färgteckning som gör den mycket väl kamouflaord i sin naturliga
    miljö. Arten är märkt svårfångad även för erfarna fågelbeoökare.


    Dupontlärkan är främst aktiv under skymningen och natten, vilket gör den extra
    utmanande att observera. Den är mycket blyg och föredrar att stanna på marken
    där den rör sig försiktigt mellan stenar och låg växtlighet. Sången är musikalisk
    och karakteristisk, ofta framförd från en upphöjd position under tyst väder.


    Arten klassificerades 2020 som utrotningshotad, vilket återspeglar den kraftigt
    minskande populationen. Bevaringsinsatser är kritiska för att säkra arten för
    framtiden.'
  en: ''
