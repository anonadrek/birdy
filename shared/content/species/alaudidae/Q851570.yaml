description:
  sv: '# Lagerlärka (Galerida theklae)


    Lagerlärka är en medelstor lärka som förekommer i sydvästra Europa samt norra
    och östra Afrika. Det är en buskig fågel med spräcklig fjäderdräkt i brunt och
    grått, vilket gör den väl kamuflerad i sin torra miljö. Arten har en relativt
    kort svans och karakteristisk tofs på huvudet.


    Lagerlärkan lever på öppna, torra marker och förekommer ofta i kulturlandskap
    och på klippiga sluttningar. Det är en marksökande fågel som söker föda på backen,
    och det kan ses hur det hoppar omkring och söker efter insekter och frön. Arten
    är territoriell och sällan långväg migrering.


    Arten är känd för sitt varierade sång som ofta framförts från en upphöjd låg buske
    eller från marken. Lagerlärkan är mest aktiv under de kallare tiderna på dagen
    och håller sig gärna nära ris och låg växtlighet för skydd.'
  en: ''
