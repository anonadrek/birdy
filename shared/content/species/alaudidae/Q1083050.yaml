description:
  sv: ''
  en: '# Singing Bush Lark


    The Singing Bush Lark, also known as Horsfield''s Bush Lark, is a small lark species
    found across grasslands and open country throughout much of Australia and Southeast
    Asia. It belongs to the lark family (Alaudidae), known for their melodious songs
    and ground-dwelling habits.


    This species is a grassland specialist, preferring open habitats where it forages
    on the ground for insects and seeds. It is characterised by its typically larking
    appearance—modest plumage with streaked brown and buff tones that provide effective
    camouflage in its preferred grassland environment. Like other bush larks, it tends
    to be inconspicuous and easy to overlook unless it sings.


    The Singing Bush Lark is particularly notable for its voice, living up to its
    name with an attractive, warbling song often delivered from a prominent perch
    or during short flights. This vocal activity is often the best way to locate the
    species in its habitat. It is resident or nomadic depending on local rainfall
    patterns, moving through its range in response to grass growth and food availability.
    Birdwatchers seeking this species should focus on open grasslands and savanna-like
    areas during times when vegetation is actively growing.'
