description:
  sv: ''
  en: '# Turkestan Short-toed Lark


    The Turkestan Short-toed Lark is a small member of the lark family, historically
    grouped with the Mediterranean Short-toed Lark until genetic studies in 2020 confirmed
    them as separate species. Like other short-toed larks, it is compact and relatively
    inconspicuous, adapted to arid and semi-arid habitats where it blends into sandy
    and rocky terrain.


    This species inhabits open, dry landscapes across a broad range spanning from
    Ukraine and central Turkey through Central Asia and southern Siberia, extending
    east to south-central Mongolia and south to southern Afghanistan. It prefers sparse
    grassland and desert-steppe environments where low vegetation provides minimal
    cover. The bird''s behaviour is typical of larks: it spends much time on the ground,
    running rather than hopping, and takes flight only when necessary, often with
    a characteristic undulating flight pattern.


    Like other larks, the Turkestan Short-toed Lark has a melodious song delivered
    from the ground or during flight displays. Its relatively small size and cryptic
    coloration make it challenging to observe, though patient birdwatchers in its
    range may spot it perched briefly on low rocks or vegetation before it drops back
    to the ground to forage for seeds and insects.'
migration:
  sv: ''
  en: '# Turkestan Short-toed Lark in Northern Europe


    Migration data unavailable for this species.


    The Turkestan Short-toed Lark''s range extends from Ukraine and central Turkey
    through Central Asia and southern Siberia to south-central Mongolia and southern
    Afghanistan. While the species occurs in Ukraine, which borders Scandinavia and
    Northern Europe, there is no documented information regarding its occurrence,
    migration patterns, or seasonal movements specifically within Scandinavia or other
    parts of Northern Europe. The species appears to be primarily distributed in continental
    Asian and Central Asian regions, with its westernmost range in Ukraine.'
