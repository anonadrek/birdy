description:
  sv: '# Berglärka


    Berglärkan är en av världens mest utbredda lärkor och förekommer på båda sidor
    av Atlanten. Det är en kompakt fågel med karaktäristiska små "horn" på huvudet
    – små fjädertofsar som är särskilt synliga när fågeln är uppretad. Berglärkan
    har en gul och svart ansiktsmask, brun ovansida och ljus undersida.


    Berglärkan är en markfågel som föredrar öppna, kala miljöer såsom fjäll, tundra
    och steniga slätter. Det är mycket flyttfågel på många håll. Fågeln hoppar och
    springer på marken när den söker föda, ofta i små flockar under hösten och vintern.
    Under häckningstiden är hannar mycket synliga när de sjunger från marken eller
    under sin karakteristiska flygsång högt upp i luften.


    Berglärkan har en svag och spröd sång med många variationer. Locktonen är ett
    distinkt "tsip" eller "pjuuu" som är lätt att känna igen när fågeln är i rörelse.
    Berglärkan är allmänt förekommande inom sitt utbredningsområde och är ofta lätt
    att observera på lämpliga lokaler under höst och vinter.'
  en: '# Horned Lark


    The Horned Lark is a distinctive lark found throughout the northern hemisphere.
    Males in summer display characteristic feather tufts on their heads that resemble
    small horns, making identification straightforward during the breeding season.
    The species is more commonly called "Horned Lark" in the Americas and "Shore Lark"
    in Europe, the latter name reflecting its winter habit of frequenting coastal
    shorelines.


    This lark inhabits open, sparsely vegetated terrain across its wide range. It
    forages on the ground for seeds and insects, blending into barren landscapes with
    its subtle plumage. The bird''s call is a characteristic tinkling song, delivered
    in flight or from perches, which aids in locating it in open country where visual
    detection can be challenging.


    Populations vary seasonally and geographically, with birds shifting to different
    habitats as seasons change. Winter visitors to lower elevations and coastlines
    contrast with summer breeding populations in upland regions. Its adaptability
    to harsh, open environments—from arctic tundra to high moorlands and winter beaches—makes
    it a resilient species across its broad northern range.'
migration:
  sv: '# Berglärka (Eremophila alpestris) - Migration och övervintrimg i Nordeuropa


    Berglärkan är en omfattande trageant i Skandinavien och Nordeuropa. Arten anländer
    till sina häckningsområden på fjällen och kustslätterna vanligen under mars och
    april. Under sommaren häckar berglärkan på öppna, vegetationskarga habitat i högfjällsregioner.
    Hösten börjar fåglarna att dra söderut, och de flesta individer från Skandinavien
    är borta från häckningsområdena senast oktober-november.


    Arten övervintrarar dels genom att söka sig till lägre höjder och södra delar
    av sitt utbredningsområde, dels genom att migrera längre söderut till södra Sverige,
    Danmark och kontinentala Europa. Vissa mindre grupper kan dock stanna över vintern
    på snöfattiga områden med god tillgång till föda. Vinterobservationer från Skandinavien
    är därför inte ovanliga, särskilt under mildare vintrar.


    ---


    *Notering: Källtexten innehåller begränsad migrationsinformation. Svaren ovan
    baseras på allmän ornitologisk kunskap om arten.*'
  en: '# Horned Lark in Northern Europe


    The Horned Lark is a resident and migratory species across Scandinavia and Northern
    Europe, with populations showing variable movement patterns. Northern breeding
    birds migrate southward in autumn, with peak arrivals in coastal and lowland areas
    occurring from September through November. Some populations remain as winter residents
    in suitable open habitats, particularly on sandy shores, coastal areas, and windswept
    moorlands where food remains accessible. Spring migration back to breeding grounds
    in northern regions occurs from March through May. The species'' presence in winter
    along European shores is notable, as birds exploit ice-free coastal habitats and
    areas with minimal snow cover.'
