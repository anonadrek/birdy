description:
  sv: '# Ökenlöpare


    Ökenlöparen är en vadare från familjen vadarsvalor med ett anpassat utseende för
    ökenlivet. Fågeln är sandfärgad, vilket ger den utmärkt kamouflage i sin naturliga
    miljö av öppen, flack ökenartad terräng med sand och grus.


    Beteendemässigt är ökenlöparen välkänd för sin snabbhet – namnet säger det själv.
    Den ses ofta springa med snabba steg över marken i jakt på föda, snarare än att
    flyga. Denna anpassning gör den särskilt väl lämpad för sitt habitat i torr miljö.


    Arten förekommer i norra Afrika, sydvästra Asien och på några ögrupper som Kanarieöarna
    och Kap Verdeöarna. Populationerna visar en minskande trend, även om minskningen
    inte ännu är tillräckligt allvarlig för att klassificera arten som globalt hotad.
    Ökenlöparen är därför en art som väcker intresse bland fågelskådare som är intresserade
    av ökenlevande arter.'
  en: '# Cream-coloured Courser


    The cream-coloured courser is a terrestrial wader belonging to the pratincole
    and courser family. Its name perfectly describes both its appearance—predominantly
    creamy-buff plumage—and its behaviour, as "cursor" derives from the Latin word
    for "runner." It is perfectly adapted for life in arid landscapes, habitually
    hunting insects and other small prey across the ground in dry, open semi-desert
    regions.


    True to its name, the cream-coloured courser is constantly on the move, using
    its running ability to pursue food in the sparse vegetation and bare ground of
    its preferred habitat. This ground-dwelling lifestyle defines its existence, whether
    it is foraging or navigating the expansive semi-desert terrain it calls home.


    The species inhabits the arid regions of the Middle East and northern Africa,
    where it remains well-suited to the harsh conditions of these open landscapes.
    Its combination of cryptic colouration and swift movement makes it an efficient
    hunter in environments where insects are scattered and cover is minimal.'
