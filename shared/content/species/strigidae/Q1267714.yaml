description:
  sv: ''
  en: '# Pallid Scops Owl


    The Pallid Scops Owl is a diminutive member of the scops owl family, inhabiting
    arid regions from the Middle East across to west and central Asia. Like other
    scops owls, it is a small, compact bird with characteristic ear-tufts that give
    it a distinctive silhouette. Its plumage tends toward pale, sandy tones that provide
    effective camouflage in its dry habitat.


    This nocturnal hunter is primarily insectivorous, feeding on moths, beetles, and
    other invertebrates. It typically hunts from a perch, scanning for prey before
    pouncing with surprising agility. During daylight, the Pallid Scops Owl roosts
    in dense vegetation or tree cavities, where its cryptic coloration makes it difficult
    to detect.


    The species favors semi-arid woodlands, scrubland, and gardens with scattered
    trees. It is generally a resident or short-distance migrant depending on location,
    with breeding occurring in spring and early summer. While it can be locally common
    in suitable habitat, its nocturnal nature and preference for concealment mean
    it is more often heard than seen.'
