description:
  sv: '# Arabdvärguv


    Arabdvärguv är en mindre uggla från familjen egentliga ugglor som nyligen erkändes
    som egen art. Den förekommer på södra Arabiska halvön, där den tidigare klassificerades
    som en underart till afrikansk dvärguv. Arten skiljer sig dock genetiskt från
    sin nära släkting och uppvisar också distinkt skillnad i både dräkt och läten.


    Arten anses inte vara hotad enligt IUCN, och populationen bedöms som livskraftig.
    Arabdvärguv är därför en relativt väl situerad art inom sitt utbredningsområde,
    trots sitt begränsade geografiska område.'
  en: '# Arabian Scops Owl


    The Arabian scops owl is a small member of the Strigidae family, endemic to the
    Arabian Peninsula. With an estimated population of around 60,000 individuals,
    it remains relatively stable across its restricted range, which includes Saudi
    Arabia, Oman, and Yemen.


    As a diminutive owl, this species shares the characteristic features typical of
    scops owls, though detailed descriptions of its specific appearance, vocalizations,
    and behaviour are limited in the available source material. Like other scops owls,
    it is likely nocturnal and adapted to arid or semi-arid environments.


    The species is found exclusively in its native Arabian range, making it of particular
    interest to birders visiting the Middle East region who wish to observe endemic
    wildlife.'
migration:
  sv: '**Migrationsdata saknas för denna art.**


    Arabdvärguv är en art som är endemit på södra Arabiska halvön och förekommer inte
    naturligt i Skandinavien eller Nordeuropa. Den tillgängliga informationen fokuserar
    på artens utbredning i Arabien och dess taxonmiska status, men innehåller ingen
    information om migrationsvanor eller säsongsförekomst i norra regioner.'
  en: 'Migration data unavailable for this species.


    The Arabian Scops Owl is endemic to the Arabian Peninsula (Saudi Arabia, Oman,
    and Yemen) and does not occur naturally in Scandinavia or Northern Europe. Therefore,
    information about its occurrence, migration patterns, or seasonal distribution
    in these regions cannot be provided.'
