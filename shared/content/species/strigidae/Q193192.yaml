description:
  sv: '# Hökuggla


    Hökugglan är en unik uggla som utgör den enda levande arten i släktet Surnia.
    Det är en intressant fågel som skiljer sig från de flesta andra ugglor genom att
    vara delvis dagaktiv, vilket gör den möjlig att observera även under dagtimmar.


    Arten förekommer i de norra delarna av Nordamerika, Europa och Asien, där den
    är anpassad till kalla klimat. Hökugglans diet består huvudsakligen av små gnagare
    och mindre fåglar, vilka den jagar med skicklighet både dag och natt.


    Enligt IUCN är hökugglans bestånd livskraftigt, vilket indikerar att arten mår
    väl och inte är hotad för närvarande. För fågelintresserade erbjuder hökugglans
    dagaktivitet en god möjlighet att studera denna fascinerade rovfågel i sitt naturliga
    beteende.'
  en: '# Northern Hawk-Owl


    The northern hawk-owl is a medium-sized owl with a distinctive appearance and
    unusual behaviour for its family. It features a slender build, long tail, and
    striking facial disc, with dark upper parts contrasting against white underparts.
    Unlike most owls, it is remarkably diurnal, often hunting in daylight hours, which
    makes it more visible to observers than its nocturnal relatives.


    This species inhabits the boreal forests of high northern latitudes, where it
    remains year-round as a non-migratory resident. However, populations occasionally
    irrupt southward during food shortages, expanding their range unpredictably. It
    hunts small mammals and birds from exposed perches, employing swift, direct flight
    similar to a hawk—behaviour that inspired its common name.


    The northern hawk-owl is the sole living member of its genus, Surnia, within the
    typical owl family. Its active daytime habits and hawk-like hunting style make
    it a distinctive and relatively approachable owl, quite different from the secretive
    nocturnal owls more familiar to most observers.'
migration:
  sv: Hökugglan förekommer året runt i norra Skandinavien och är en del-flyttfågel.
    Arten stannar ofta kvar på sina häckningsområden under milder vintrar, men kan
    göra omfattande söktåg sydåt när gnagarpopulationerna minskar. Under dessa invasionsår
    påträffas hökugglor regelbundet långt söderut i Sverige och övriga Nordeuropa.
    Arten återvänder till sina nordliga häckningsrevir under våren när förutsättningarna
    förbättras.
  en: '# Northern Hawk-Owl in Scandinavia/Northern Europe


    The Northern Hawk-Owl is a non-migratory species that remains within its breeding
    range throughout the year across northern Scandinavia and boreal regions. However,
    it exhibits irregular irruptive movements southward during certain years, likely
    driven by fluctuations in food availability, particularly small mammal populations.
    These southward incursions can bring birds to central Scandinavia and occasionally
    further south into temperate Europe, though such movements are unpredictable rather
    than following a consistent seasonal pattern.


    This species is resident year-round in its core range in northern Fennoscandia
    and northern Russia, making it a permanent inhabitant of boreal forests rather
    than a seasonal migrant. The occasional irruptions southward represent the species''
    primary variation in distribution pattern, distinguishing it from true migratory
    owl species.'
