description:
  sv: '# Dvärguv


    Dvärguv är en av världens minsta uglor och tillhör släktet Otus. Det är en buskig,
    grå eller brunaktig fågel med påtagliga örontofsar som ger den sitt karakteristiska
    utseende. Arten förekommer huvudsakligen i Palearktis där den häckar, och det
    är en nattaktiv jägare som ofta är svår att upptäcka på grund av sin små storlek
    och goda kamouflage.


    Arten är känd för sitt karakteristiska, monotont tjutande läte som ofta hörs under
    häckningstiden. Fågeln har en mycket specifik roll i sitt ekosystem som nattlig
    rovfågel.


    Även om beståndet är livskraftigt visar arten en minskande trend i många delar
    av sitt utbredningsområde. Det är en mycket sällsynt gäst norr om sitt normala
    område – Sverige har registrerat endast ett tiotal fynd av denna art. Observationer
    här är alltid anmärkningsvärda för ornitologer och birdwatchere på grund av artens
    raritet i norden.'
  en: '# Eurasian Scops Owl


    The Eurasian Scops Owl is a small, compact owl belonging to the typical owl family.
    It is characterized by its diminutive size and cryptic plumage, which provides
    excellent camouflage in its woodland and scrubland habitats. The species is highly
    nocturnal and often heard before it is seen.


    This is a highly migratory species across much of its range, breeding from southern
    Europe eastwards to southern Siberia and the western Himalayas. During winter,
    most populations migrate to Africa south of the Sahara, though some birds remain
    year-round residents in Mediterranean regions where milder conditions permit.


    The Eurasian Scops Owl is renowned for its distinctive tremulous, whistled call—a
    characteristic sound of warm evenings in suitable habitat. It hunts small prey
    such as insects, spiders, and small mammals under cover of darkness, using its
    exceptional hearing to locate quarry.'
migration:
  sv: '# Dvärguv – förekomst i Skandinavien/Nordeuropa


    Dvärguv är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    huvudsakligen långt söder om denna region, och endast enstaka individer når Sverige
    och andra nordiska länder. Med endast omkring tio fynd i Sveriges historia är
    dvärguven en stor raritet för nordiska fågelskådare. När arten förekommer så långt
    norr om sitt vanliga utbredningsområde sker detta sporadiskt och oregelbundet,
    ofta under höstmigrationen när yngre eller vilsekomna fåglar kan driva långt från
    sina normala häckningsplatser i södra Europa och västra Asien.'
  en: '# Eurasian Scops Owl in Northern Europe


    The Eurasian Scops Owl is a migratory species with limited occurrence in Scandinavia
    and Northern Europe. It breeds in southern Europe and does not have an established
    breeding population in the Nordic region. However, vagrant individuals occasionally
    appear during migration periods, particularly in spring and autumn, as birds move
    between their Mediterranean breeding grounds and African wintering areas. Some
    populations resident in Mediterranean Europe remain year-round, but these southern
    populations do not extend into Scandinavia. Any sightings in Northern Europe would
    be exceptional and represent birds outside their normal range.'
