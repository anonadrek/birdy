description:
  sv: '# Kattuggla (Strix aluco)


    Kattugglan är en kompakt, medelstor uggla med två distinkta färgvarianter – antingen
    brun eller grå ovansida, medan undersidan är blek med mörka strimmor. Denna färgpolymorfism
    återfinns hos flera av dess elva erkända underarter. Det är en stannfågel som
    är mycket territoriell och försvarar sitt revir aggressivt, särskilt när det gäller
    skydd av bo och ungar mot potentiella predatorer.


    Arten är vanlig i skogar över stora delar av Eurasien och förlitar sig ofta på
    trädhålor för boplatser. Efter det att föräldrarna slutar mata ungarna är dessa
    på eget håll, och många årsungar svälter ihjäl om de inte lyckas hitta ett ledigt
    territorium. Denna höga dödlighet bland rekryter är karakteristisk för arten och
    påverkas kraftigt av tillgången på lämpliga revir i befolkningen.'
  en: '# Tawny Owl


    The tawny owl is a stocky, medium-sized owl with distinctive plumage that varies
    between individuals. It displays pale underparts with dark streaks, while its
    upper body may be either brown or grey. This coloration provides excellent camouflage
    in woodland settings, making it challenging to spot even when present.


    The species is highly territorial and non-migratory, remaining in its chosen area
    year-round. It nests in tree cavities, where it can effectively protect its eggs
    and young from predators. Tawny owls are fierce defenders of their territories,
    and this territorial nature has important consequences for young birds: those
    unable to secure their own vacant territory after leaving the nest often struggle
    to survive.


    Commonly found across woodlands in Europe and western Siberia, the tawny owl is
    well-adapted to woodland habitats where suitable nesting holes are available.
    Its presence indicates mature woodland with sufficient hollow trees, making it
    a valuable indicator of woodland health.'
migration:
  sv: '# Kattuggla (Strix aluco) - Förekomst i Skandinavien och Nordeuropa


    Kattugglan är en stannfågel som är året om bosatt i stora delar av Skandinavien
    och Nordeuropa. Den är mycket territoriell och återvänder till sitt revir under
    hela året. Till skillnad från många andra ugglorarter genomför kattugglan ingen
    regelrätt migration, utan stannar kvar även under hårda vintermånader. Populationen
    upprätthålls genom att ungfåglarna söker nya territorier efter att föräldrarna
    slutat mata dem, ofta med högre dödlighet hos de som inte lyckas etablera sig
    i lediga revir.'
  en: '# Tawny Owl (Strix aluco) in Northern Europe


    The Tawny Owl is a year-round resident throughout Scandinavia and northern Europe,
    being entirely non-migratory. Established pairs remain in their territories year-round,
    defending them vigorously against intruders. Young birds disperse from the nest
    in late summer and autumn, searching for unoccupied territories. If successful,
    they establish themselves locally for life; if not, mortality rates can be high,
    particularly during harsh winters. Population numbers in Scandinavia remain relatively
    stable due to the species'' ability to adapt to various woodland habitats and
    its efficient nocturnal hunting strategies.'
