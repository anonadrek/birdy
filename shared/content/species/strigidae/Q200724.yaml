description:
  sv: '# Lappuggla


    Lappugglan är en stor uggla som nästan når berguven i storlek. Den kännetecknas
    av sitt gråa fjäderdräkt och sitt karakteristiska utseende med stora diskformade
    ansikten. Arten förekommer i tajgaskogar på höga nordliga breddgrader runt jorden,
    där den är väl anpassad till skogarnas miljö och klimat.


    Lappugglans beteende är typiskt för rovfåglar – den är aktiv främst under skymningen
    och natten, då den jagar små däggdjur och andra byten. Arten är en skicklig jägare
    som kan höra sitt byte under snötäcket. Dess läte är karakteristiskt med djupa
    hootande rop.


    Globalt anses beståndet öka och är klassificerat som livskraftigt av IUCN. I Sverige
    är arten dock mycket fåtalig och klassificeras som sårbar. Den ses endast sporadiskt
    i norra landskapen där tajgaskogar förekommer.'
  en: '# Great Grey Owl


    The Great Grey Owl is the world''s largest owl by length, though it appears deceptively
    bulky due to its thick plumage and prominent facial disc. Its grey and white plumage
    provides excellent camouflage in snowy and forested habitats. The species has
    relatively small yellow eyes set within concentric circles of dark and light feathers,
    creating its distinctive appearance. Large ear tufts are absent, distinguishing
    it from some other owl species.


    This formidable predator hunts primarily at dusk and dawn, targeting small mammals
    such as voles and mice, which it locates using exceptional hearing. It often hunts
    from a perch, dropping silently onto prey in snow or grass. The Great Grey Owl''s
    calls include deep hooting and various other vocalizations used for territorial
    and breeding communication.


    Distributed across the Northern Hemisphere, the Great Grey Owl is the only Strix
    species found in both Eastern and Western Hemispheres, occupying boreal forests,
    taiga, and mixed woodland regions. It prefers areas with open clearings for hunting
    adjacent to dense forest cover. The species is generally sedentary, though some
    populations show irruptive movements during food shortages, occasionally appearing
    in more southern regions during harsh winters.'
migration:
  sv: '# Lappuggla - Förekomst i Skandinavien/Nordeuropa


    Lappugglan är en permanent bosatt art i Skandinavien och Nordeuropa, där den förekommer
    året runt i tajgaskogarna. Arten är stationär och genomför inga längre migrationer,
    utan stannar inom sitt revir under vintern. Under snörika vintrar kan det förekomma
    mindre lokala förflyttningar när födan blir svårtillgänglig, då fåglarna söker
    sig till områden med bättre jaktsförhållanden. I Sverige är arten mycket sällsynt
    och främst förekommer i norra regioner.'
  en: '# Strix nebulosa (Great Grey Owl) - Occurrence in Scandinavia/Northern Europe


    The Great Grey Owl is a resident species throughout Scandinavia and northern Europe,
    with populations that are largely non-migratory. In Scandinavia, the species is
    a year-round inhabitant of boreal and taiga forests, though some individuals may
    undertake irregular southward movements during winter months when food becomes
    scarce. The owl''s presence is consistent across all seasons, with breeding occurring
    in spring and early summer. Occasional irruptive movements can bring individuals
    further south into central Europe during harsh winters with poor rodent availability,
    but the core Scandinavian population remains relatively sedentary compared to
    many other northern bird species.'
