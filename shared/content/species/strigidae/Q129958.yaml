description:
  sv: ''
  en: '# Little Owl


    The Little Owl is a small, stocky owl found across much of temperate and warmer
    Europe, extending eastward through the Palearctic to Korea, and in North Africa.
    It has been successfully introduced to Britain and New Zealand, where it has become
    established.


    This compact owl is characterized by its rounded head without ear tufts, yellow
    eyes, and mottled grey-brown plumage that provides excellent camouflage. It is
    considerably smaller than most other owls in its range. The Little Owl is primarily
    nocturnal but will hunt during daylight hours, particularly at dusk and dawn.
    It feeds on small mammals, insects, and birds, often perching openly on posts
    or branches while hunting.


    The bird''s distinctive call is a loud, clear "kyew" or series of mewing sounds,
    often heard on spring and summer nights. It nests in cavities such as tree holes,
    cliffs, or buildings, laying 3-5 white eggs. The Little Owl occupies open woodlands,
    parkland, farmland with scattered trees, and cultivated areas with hedgerows.
    It remains largely sedentary throughout its range, defending territories year-round.'
migration:
  sv: ''
  en: '# Little Owl (Athene noctua) in Scandinavia/Northern Europe


    The Little Owl is a non-migratory or partial migrant species in Northern Europe.
    In Scandinavia, it is primarily resident year-round where established, with populations
    concentrated in southern regions. The species has expanded northward in recent
    decades, particularly in Sweden and Denmark. Birds in the northernmost parts of
    their Scandinavian range may undertake short-distance movements during severe
    winters, but most individuals remain within their territories throughout the year.
    Arrival or increased visibility typically occurs in spring months when breeding
    activity commences.'
