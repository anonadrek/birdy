description:
  sv: '# Kapuggla


    Kapugglan är en medelstor uggla som tillhör familjen egentliga ugglor. Arten förekommer
    lokalt i våtmarksområden i Afrika söder om Sahara samt på Madagaskar, där den
    är anpassad till fuktiga miljöer. En liten isolerad population finns också i nordvästra
    Afrika.


    Denna uggla är aktiv både dag och natt, vilket skiljer den från många andra ugglorarter.
    Den jagar över öppna våtmarksområden och använder sin utmärkta hörsel för att
    lokalisera byten i gräset och vegetationen. Kapugglan födosöker ofta från marken
    eller låga utgångspunkter och är väl anpassad för att jaga gnagare och andra små
    däggdjur som förekommer i vassrika områden.


    Arten är svårobserverad då den föredrar täta växtligheter och är aktiv under lågt
    ljus. För den intresserade fågelskådaren kräver det tålamod och kunskap om de
    våtmarkshabitat där arten förekommer för att få möjlighet att se eller höra denna
    diskreta uggla.'
  en: ''
