description:
  sv: '# Hornuggla


    Hornuggla är en medelstor uggla som tillhör familjen egentliga ugglor. Arten är
    känd för sina karakteristiska öronliknande fjädertoppar på huvudet, vilket är
    källan till dess namn. Den har en slank kroppsform med rostbrunt och gråtecknat
    fjäderdräkt som ger utmärkt kamouflage i sitt naturliga miljö.


    Hornugglan är en skicklig nattjägare som främst söker sin föda på små gnagare
    och fåglar. Den är till största delen en flyttfågel med en anmärkningsvärt stor
    utbredning över Europa, Asien och Nordamerika. Arten föredrar öppna och halvöppna
    landskap där den kan jaga effektivt.


    Globalt anses beståndet vara livskraftigt, och arten är välanpassad till sitt
    ekologiska nisch som nattuggla. Under häckningssäsongen är hornugglan territoriumskyddande
    och kan höras ropa sitt karakteristiska läte, särskilt under skymningen.'
  en: '# Long-eared Owl


    The long-eared owl is a medium-sized member of the typical owl family with a distribution
    spanning Europe, the Palearctic region, and North America. Its name derives from
    two distinctive feathered tufts atop its head that resemble ears, though these
    are not functional hearing organs. It is sometimes called the cat owl, a reference
    to its feline-like appearance.


    This species is an accomplished nocturnal hunter, typically active during darkness
    when it pursues small mammals and birds. In daylight, it roosts in dense cover,
    often remaining remarkably still and elongating its body to blend with surrounding
    vegetation. When alarmed, it adopts a distinctive upright posture that emphasizes
    its ear-tufts, making it appear taller and thinner.


    Long-eared owls favour open and semi-open habitats, including grasslands, heathland,
    and woodland edges where hunting opportunities are good. It often hunts over rough
    ground and low vegetation. The species is highly adaptable regarding breeding
    sites, frequently using abandoned nests of other birds rather than excavating
    its own. Its call is a distinctive series of soft hooting notes.'
migration:
  sv: '# Hornuggla (Asio otus) – Förekomst i Skandinavien


    Hornuggla är en flyttfågel som återfinns i Skandinavien och Nordeuropa både under
    häckningstid och på genomfart. Arten häckar i norra delarna och anländer till
    häckningsplatserna under våren, vanligtvis från mars–april. Under hösten påbörjar
    fåglarna sin migration söderut, och de flesta individer har lämnat Skandinavien
    innan vintern sätter in helt. Vissa populationer från östligare delar av Europa
    och Asien kan dock förekomma som gäster under vinterhalvåret.


    Hornugglans migration följer ett väl etablerat mönster där den huvudsakligen är
    en långdistansflyare, men antalet övervintrande individer kan variera mellan åren
    beroende på köldperioder och tillgång på föda.'
  en: '# Long-eared Owl in Northern Europe


    The Long-eared Owl is a migratory species across Scandinavia and Northern Europe.
    Birds breeding in these regions typically depart in autumn, with populations moving
    southwestward to overwinter in Central and Southern Europe, the Mediterranean
    region, and North Africa. Return migration occurs in spring, with birds arriving
    back to their northern breeding territories from March onwards. Some individuals
    may remain through winter in milder areas, but the majority of northern populations
    are absent during the coldest months. The species shows considerable variation
    in wintering location depending on breeding origin and winter severity.'
