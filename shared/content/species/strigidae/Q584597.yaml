description:
  sv: '# Ökenuv


    Ökenuv är en liten uggla som tidigare klassificerades som underart till berguv.
    Den är påfallande ljusare än sin större släkting och har en mer kompakt gestalt.
    Fågeln är anpassad för livet i öknar och torra klimat i Nordafrika och Mellanöstern.


    Arten förekommer huvudsakligen i ökenområden där den jagar små däggdjur och insekter
    under mörker. Som många ugglor är den nattaktiv och använder sitt utmärkta hörselsystem
    för att lokalisera byte i mörkret. Ökenuv är klassificerad som livskraftig av
    IUCN, vilket innebär att världsbeståndet är stabilt och inte hotas av utrotning.'
  en: ''
migration:
  sv: 'Migrationsdata saknas för denna art.


    **Förklaring:** Källtexten innehåller ingen information om ökenuven förekommer
    i Skandinavien eller Nordeuropa, eller någon information om migration, övervintringsområden
    eller ankomsttider. Arten beskrivs endast som förekommande i ökenområden i Nordafrika
    och Mellanöstern, vilket ligger långt söder om Skandinavien.'
  en: ''
