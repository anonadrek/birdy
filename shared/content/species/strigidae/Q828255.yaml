description:
  sv: ''
  en: '# Brown Fish Owl


    The Brown Fish Owl is a robust owl species belonging to the family Strigidae.
    It ranks among the most widespread and well-studied fish owls globally, with a
    distribution spanning from Turkey across South and Southeast Asia. This extensive
    range, covering over 7,000 kilometres, makes it the most common fish owl throughout
    its territory and contributes to its status as Least Concern on the IUCN Red List.


    The species inhabits forests and wooded wetlands, environments that provide suitable
    hunting grounds and nesting sites. Its preference for water-adjacent habitats
    reflects its specialised diet and hunting behaviour focused on aquatic prey. The
    Brown Fish Owl''s abundance and adaptability within these wetland ecosystems have
    made it a valuable subject for ornithological research compared to its rarer relatives.


    As one of four living fish owl species, the Brown Fish Owl''s successful distribution
    and population stability demonstrate its ecological resilience and hunting prowess
    in diverse wetland environments across its vast Asian and Turkish range.'
