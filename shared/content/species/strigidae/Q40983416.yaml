description:
  sv: ''
  en: '# Arabian Eagle-Owl


    The Arabian Eagle-Owl is a member of the true owl family found exclusively across
    the Arabian Peninsula. This species inhabits coastal regions and areas slightly
    inland, notably avoiding the most barren desert interiors. It favours wadis, cliffs,
    and canyon walls as preferred habitat, also nesting in large palms and other trees
    where available.


    Limited information exists on this owl''s appearance, behaviour, and vocalizations
    in readily available sources, though as an eagle-owl it likely shares characteristics
    with related species—including large ear tufts and powerful hunting capabilities.
    The Arabian Eagle-Owl remains relatively poorly studied compared to other regional
    raptors.


    The species'' preference for less arid zones and its association with rocky terrain
    and scattered vegetation makes it distinct from truly desert-adapted birds. Observers
    seeking this owl would have the best chances in coastal lowlands and foothills
    rather than in the peninsula''s interior deserts.'
