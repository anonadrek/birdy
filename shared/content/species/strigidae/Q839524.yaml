  en: 'Migration data unavailable for this species.


    The Spotted Owlet is a tropical Asian species with no natural occurrence in Scandinavia
    or Northern Europe. It is a resident breeder throughout its range in South and
    Southeast Asia, from Pakistan to Southeast Asia, showing no migratory behavior.
    The species is adapted to permanent residence in open habitats, farmland, and
    urban areas where it roosts year-round in tree cavities and building crevices.'
