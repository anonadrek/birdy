description:
  sv: '# Brahminuggla


    Brahminugglan är en liten asiatisk uggla som är vanligt förekommande i öppna miljöer.
    Arten har visat en anmärkningsvärd förmåga att anpassa sig till olika miljöer
    och trivs även i städer och människodominerade landskap. Detta gör den till en
    av de mer framgångsrika ugglorarterna inom sitt utbredningsområde.


    Arten är aktiv både dag och natt, vilket skiljer den från många andra ugglorarter.
    Brahminugglan föredrar öppna terränger som savannerartad habitat, trädgårdar och
    odlingslandskap. Den är en duktig jägare som fångår småkryp, insekter och små
    däggdjur under låga flygningar nära marken.


    Arten återfinns i sitt naturliga utbredningsområde i Asien, där populationerna
    är stabila och arten klassificeras som icke hotad.'
  en: '# Spotted Owlet


    The spotted owlet is a small owl inhabiting tropical regions across Asia. It readily
    adapts to human-dominated landscapes, thriving in farmland, gardens, and urban
    areas where it roosts communally in tree hollows, rock crevices, and building
    cavities. This sociable species typically rests in small groups, making it relatively
    conspicuous compared to many other owls.


    Breeding occurs in holes within trees or buildings, where females lay 3–5 eggs.
    The species displays considerable variation in plumage and size across its range,
    forming a superspecies complex with the very similar little owl. This variation
    reflects adaptation to diverse local environments throughout its extensive tropical
    Asian range.


    Being a common resident throughout its distribution, the spotted owlet has successfully
    embraced life alongside human settlements, making it one of the more accessible
    owl species for observers in suitable habitat.'
migration:
