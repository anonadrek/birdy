description:
  sv: ''
  en: '# Boreal Owl


    The boreal owl is a small member of the true owl family, distributed across the
    northern forests of the Northern Hemisphere. It is known by different names depending
    on region: boreal owl in North America, and Tengmalm''s owl in Europe and Asia,
    named after Swedish naturalist Peter Gustaf Tengmalm.


    This compact owl inhabits dense coniferous and mixed forests in boreal and subarctic
    regions. It is primarily nocturnal and hunts small mammals, particularly voles
    and shrews, from low perches within the forest canopy. The boreal owl is cryptic
    and elusive, making it challenging to observe in the field.


    Its call is a distinctive series of clear, whistled notes, often delivered at
    night during breeding season, which helps birders locate this secretive species.
    The owl''s small size and preference for remote forest habitats mean it remains
    relatively inconspicuous, even where present. Its occurrence is often confirmed
    more readily through its vocal activity than through direct sightings.'
migration:
  sv: ''
  en: '# Boreal Owl (Aegolius funereus) – Occurrence in Northern Europe


    The Boreal Owl is a resident and partial migrant throughout Scandinavia and northern
    Europe. Populations breeding in the taiga forests of northern Scandinavia are
    largely sedentary, though some individuals undertake irregular southward movements
    during winter, particularly in years when rodent populations crash. Birds from
    more eastern populations may migrate into Scandinavia during autumn and winter
    months. In core breeding areas, Boreal Owls remain year-round, but their presence
    at lower elevations and southern latitudes increases notably from October through
    March as northern birds shift southward seeking prey.'
