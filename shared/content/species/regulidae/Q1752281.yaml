description:
  sv: ''
  en: '# Madeira Firecrest


    The Madeira firecrest is a tiny passerine endemic to Madeira, formerly considered
    a subspecies of the common firecrest until genetic analysis confirmed it as a
    distinct species in 2003. It is a member of the kinglet family, a group of diminutive
    birds.


    This diminutive bird has green upperparts and whitish underparts with two white
    wingbars. Its distinctive head pattern features a black eye stripe, a short white
    supercilium, and a prominent crest. Males display an orange crest, while females
    show a yellow one, making sexing relatively straightforward in the field.


    The species differs from its common firecrest relative in both appearance and
    vocalisations, though specific call details are not extensively documented in
    available sources. As it is endemic to Madeira, it is found nowhere else in the
    world and represents a unique evolutionary lineage within the kinglet family.'
