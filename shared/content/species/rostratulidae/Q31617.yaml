description:
  sv: '# Rallbeckasin


    Rallbeckasin är en liten vadarfågel med karakteristisk utseende. Honan är märkbar
    genom sin praktfulla färgteckning med metallic grönglans på rygg och vingar, medan
    hanen är mer diskret färgad. Den korta, nedåtböjda näbben är en viktig igenkänningspunkt
    för arten.


    Arten har en unik beteendemässig särhet bland fåglar: den praktfulla honan uppvaktar
    hanen, som sedan ansvarar för alla ruggningsuppgifter. Detta är ett omvänt könsrollsmönster
    som förekommer hos bara ett fåtal fågelarter. Rallbeckasinen är activ på marken
    och letar föda bland fuktiga miljöer.


    Arten förekommer i fuktiga områden som sjöstränder och våtmarker med tät vegetation.
    Den är en diskret fågel som ofta håller sig dold i gräs och undervegetation, vilket
    gör den svår att observera trots sin iögonenfallande färgteckning hos hona.'
  en: '# Greater Painted-snipe


    The greater painted-snipe is a small wader with striking plumage, particularly
    in females, which are larger and more richly coloured than males. It inhabits
    wetland environments across Africa and southern Asia, favouring swamps and the
    margins of lakes and rivers where it can forage among shallow waters and vegetation.


    This species exhibits an unusual breeding system where females are polyandrous,
    mating with multiple males. The males take on the responsibility of incubating
    eggs and rearing chicks, while females focus on territory defence and reproduction.
    This role reversal is rare among waders and makes the greater painted-snipe particularly
    interesting to observe during breeding season.


    The bird''s compact size and cryptic colouration when at rest make it challenging
    to spot, despite its bold markings. Its preference for dense wetland habitats
    means it is often heard rather than seen, though patient observation in suitable
    locations can reward the keen birdwatcher with sightings of this unusual and fascinating
    species.'
