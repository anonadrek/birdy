description:
  sv: '# Storskarv


    Storskarven är en stor vattenlevande fågel som tillhör skarvfamiljen. Den förekommer
    på alla världens kontinenter utom Antarktis och Sydamerika, både vid kusten och
    i inlandet. Arten förekommer i flera underarter, vars migrationsbeteende varierar
    beroende på geografiska läget. De nordligaste populationerna är flyttfåglar, medan
    andra populationer endast drar sig undan extrema väderförhållanden eller istäcke,
    och vissa är helt stannfåglar under året.


    Storskarven är en mästerlig dykarfågel anpassad för livet i vatten. Den skiljer
    sig från sina släktingar – fregattfåglar, sulor och ormhalsfåglar – men delar
    många av deras vattenöverspecialiserade egenskaper. Arten går under flera namn
    i Svenska språket, inklusive ålkråka, havstjäder och kormoran, vilket återspeglar
    dess långa historia i människans medvetande.'
  en: '# Great Cormorant


    The great cormorant is a large, dark seabird found across much of the Northern
    Hemisphere, Australasia, and the Atlantic coast of North America. It is the most
    widespread member of the cormorant family, with populations breeding throughout
    the Old World in varied aquatic habitats.


    This species is predominantly black with a sleek, streamlined body perfectly adapted
    for diving and underwater pursuit of fish. Adults often display white patches
    on the head and neck during breeding season, along with a distinctive pale thigh
    patch. Its long neck, pointed bill, and characteristic hunched posture when perched
    make it readily identifiable.


    Great cormorants are highly aquatic birds, spending much of their time diving
    for fish in coastal waters, estuaries, and larger inland waterways. They are often
    seen in small to large flocks, sometimes perched with wings held open to dry their
    feathers—a characteristic behaviour among cormorants. The species is relatively
    silent but produces guttural calls at breeding colonies. It typically nests in
    colonies on cliffs, in trees near water, or on rocky outcrops, demonstrating remarkable
    adaptability to different breeding environments across its vast global range.'
migration:
  sv: '# Storskarv – Förekomst i Skandinavien/Nordeuropa


    Storskarven förekommer året runt i Skandinavien och Nordeuropa, men utbredningen
    varierar säsongsmässigt. De nordligaste populationerna är flyttfåglar som lämnar
    området under de kallaste månaderna, medan andra populationer är mindre migratoriska
    och endast drar sig undan då is och hårt väder gör området obeboeligt. Vissa individer
    är stannfåglar som blir året runt. De fåglar som är på flyttning avgör sina flyttplatser
    beroende på isläggning av vattnet och väderförhållandena, snarare än efter en
    strikt kalenderbaserad mönster.'
  en: '# Great Cormorant (Storskarv) in Northern Europe


    The Great Cormorant is a migratory and resident species across Scandinavia and
    Northern Europe. Populations breeding in northern regions migrate southward in
    autumn, typically departing between September and November, seeking ice-free waters
    in southern Scandinavia, the North Sea, and Atlantic coasts. Many individuals
    overwinter in these southern areas or further south along European coasts. Spring
    return migration occurs from February through April, with breeding populations
    re-establishing themselves at northern colonies. Some southern populations remain
    resident year-round. The species has shown increasing wintering populations in
    Scandinavian coastal regions in recent decades.'
