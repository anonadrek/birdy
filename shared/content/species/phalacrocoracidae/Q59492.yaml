description:
  sv: ''
  en: '# Reed Cormorant


    The reed cormorant, alternatively called the long-tailed cormorant, is a small
    member of the cormorant family found across sub-Saharan Africa and Madagascar.
    It is a resident species, remaining within its range year-round, though it undertakes
    seasonal movements in response to water levels and food availability. The bird''s
    name reflects its notably elongated tail, which distinguishes it from larger cormorant
    species.


    As a cormorant, it shares the family''s characteristic adaptations for diving
    and underwater pursuit of fish. Like other members of its family, it has dark
    plumage and the typical cormorant body shape—sleek and streamlined for aquatic
    hunting. The reed cormorant inhabits freshwater environments including lakes,
    rivers, and wetlands where reed beds and vegetation provide suitable habitat for
    breeding and foraging.


    This species is typically found in small groups or solitary birds in shallow water
    habitats, where it hunts by diving beneath the surface. Its presence indicates
    healthy freshwater ecosystems with adequate fish populations to support these
    specialized waterbirds.'
migration:
  sv: ''
  en: '# Reed Cormorant in Northern Europe


    The reed cormorant does not naturally occur in Scandinavia or Northern Europe.
    This species is endemic to Africa south of the Sahara and Madagascar, where it
    is largely resident year-round. While the species undertakes some seasonal movements
    within its African range, these are localized movements in response to water availability
    and breeding cycles. The reed cormorant''s range is confined to tropical and subtropical
    Africa and has no established presence in northern European regions, making it
    irrelevant to the avifauna of Scandinavia throughout the year.'
