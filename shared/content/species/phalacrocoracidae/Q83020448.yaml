description:
  sv: '# Toppskarv


    Toppskarven är en skarvart som förekommer utmed Europas och Nordafrikas kuster,
    samt i östra Medelhavet och Svarta havet. Arten häckade tidigare endast sporadiskt
    på den svenska västkusten, men etablerade sig senare som regelbunden häckfågel
    där. Globalt har beståndet minskat, men anses fortfarande vara livskraftigt.


    Denna skarvart är väl anpassad för sitt liv på havet och i kustnära områden, där
    den söker sitt föda genom dykningar. Som övriga skarvar är toppskarven en skicklig
    simmare och dykare som spenderar mycket tid i vattnet. Arten visar många av skarvfamiljens
    karakteristiska beteenden och anpassningar för ett vattenbaserat liv.'
  en: '# European Shag


    The European shag is a medium-sized cormorant found along rocky coastlines of
    western and southern Europe, southwestern Asia, and north Africa. It is the sole
    member of its genus, Gulosus, whose Latin name refers to the bird''s voracious
    appetite. Most birds remain in their breeding range year-round, though northern
    populations migrate seasonally.


    This sleek waterbird is predominantly dark, appearing almost black in plumage
    with a subtle green sheen. During breeding season, it develops a distinctive crest
    on its head. The shag has a long, slender neck and a relatively short tail compared
    to other cormorants. Its streamlined body is an adaptation for diving and swimming
    underwater in pursuit of fish.


    The shag is primarily a coastal species, preferring rocky shores and cliff faces
    where it nests in colonies. It is an accomplished diver, propelling itself underwater
    with powerful leg strokes to hunt for small fish, particularly sand eels and pouting.
    The bird is largely silent outside the breeding season but produces various guttural
    calls and hisses at nesting colonies. Its scientific species name honours the
    ancient Greek philosopher Aristotle, reflecting the bird''s historical significance
    in European natural history.'
migration:
  sv: '# Toppskarv i Skandinavien och Nordeuropa


    Toppskarven är en kustnära art som förekommer året runt längs Europas atlantiska
    och medelhavsregioner. I Skandinavien är arten en relativt ny häckfågel på den
    svenska västkusten, där beståndet har etablerat sig under de senaste decennierna.
    Arten är inte en långdistansmigrant utan stannar generellt i sitt utbredningsområde
    året om. Under häckningstiden koncentreras individerna till klippiga öar och strandområden
    längs kusten, medan de övriga årets tid förblir i närliggande havsområden. Toppskarven
    är därför en karakteristisk kustnär som inte genomför betydande migrationsporer
    jämfört med många andra nordiska fåglar.'
  en: '# European Shag Migration in Northern Europe


    The European Shag is a resident and partial migrant across Scandinavia and Northern
    Europe. Birds breeding in the northernmost parts of their range, particularly
    in Norway and Iceland, typically vacate these areas during winter months, moving
    southward to milder coastal waters. However, populations in more southern Scandinavian
    regions and around Britain often remain year-round, with only minimal seasonal
    movements. The species is primarily tied to rocky coastlines for both breeding
    and wintering, showing strong site fidelity to traditional breeding colonies and
    coastal territories.'
