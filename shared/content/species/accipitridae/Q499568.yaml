description:
  sv: ''
  en: '# Spanish Imperial Eagle


    The Spanish imperial eagle is a large, powerful raptor native to the Iberian Peninsula.
    It is a dark brown eagle with distinctive pale patches on the shoulders and upper
    back—features that earned it the alternative name "white-shouldered eagle" in
    older literature. These striking "epaulettes" are among its most recognizable
    characteristics, helping distinguish it from other large eagles in its range.


    This species is a formidable hunter adapted to open and semi-open landscapes.
    It hunts from the air, targeting medium-sized prey across its habitat. The bird
    is generally solitary or seen in pairs, often perched prominently or soaring at
    considerable heights while searching for food. Its behavior reflects the ecology
    of its native region, where it has evolved to thrive in specific environmental
    conditions.


    Little detailed information about vocalizations is provided in the source material,
    though like most eagles it likely produces calls during breeding and territorial
    interactions. This species remains restricted to the Iberian Peninsula, where
    conservation efforts have focused on protecting its population and suitable breeding
    habitats. The scientific name honors Prince Adalbert of Bavaria, commemorating
    his historical significance in the species'' identification and study.'
migration:
  sv: ''
  en: '# Spanish Imperial Eagle (Aquila adalberti) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Spanish Imperial Eagle is native to the Iberian Peninsula and does not naturally
    occur in Scandinavia or Northern Europe. This species is resident in its Mediterranean
    and Iberian range and has no established migration pattern to northern European
    regions. Therefore, no information on seasonal occurrence, arrival months, or
    overwintering in Scandinavian territories can be provided.'
