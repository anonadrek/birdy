description:
  sv: '# Ängshök


    Ängshök är en slank hökfågel som tillhör kärrhöksfamiljen. Arten häckar vitt spritt
    i Europa och Nordafrika, med utbredning österut till Kina. Under vinterhalvåret
    är den flyttfågel som söker sig till tropiska Afrika och Sydasien. I Sverige är
    ängshöken starkt hotad och ses endast sporadiskt under häckningstiden.


    Arten är en skicklig jägare som ofta ses glidflyga lågt över öppna landskap när
    den söker efter små däggdjur och fåglar. Ängshöken är något mindre än sin släkting
    tornfalkens storlek och kännetecknas av sin smala kroppsform som är väl anpassad
    för manövrering. Honan är större och mörkare än hanen.


    Populationen minskar globalt, men arten klassificeras fortfarande som livskraftig.
    Främsta hotet är förlust av lämpligt häckningshabitat och användningen av bekämpningsmedel
    som påverkar näringskedjan.'
  en: ''
migration:
  sv: '# Ängshök – Förekomst i Skandinavien


    Ängshök är en långflyttare som återvänder till Sverige och övriga Skandinavien
    under våren för att häcka. Fågeln anländer typiskt under maj månad och besätter
    sina häckningsområden i öppna landskap som ängar och mossar. Efter framgångsrik
    häckning påbörjar arten sin långa höstflyttning söderut i slutet av sommaren och
    under hösten, vanligtvis från augusti till september. Under vintermånaderna övervintrar
    ängshöken i tropiska Afrika och Sydasien, långt från sitt nordiska häckningsområde.
    Återkomsten till häckningsområdena sker därefter igen följande vår, vilket gör
    den till en säsongsvis förekommande art i regionen.'
  en: ''
