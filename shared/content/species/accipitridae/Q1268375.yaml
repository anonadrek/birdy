  en: '# White-eyed Buzzard in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The White-eyed Buzzard is a South Asian species with no documented occurrence
    in Scandinavia or Northern Europe. This medium-sized raptor is resident to its
    range in South Asia and does not migrate to European regions. Therefore, information
    about seasonal presence, arrival months, or overwintering in Scandinavia/Northern
    Europe cannot be provided, as this species does not occur there.'
