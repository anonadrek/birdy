description:
  sv: '# Vitögd vråk


    Vitögd vråk är en medelstor rovfågel från Sydöstasien som förekommer från sydöstra
    Iran österut genom Indien till Burma. Det är en medlem av hökfamiljen och tillhör
    ordningen hökfåglar.


    Denna vråk är anpassad för att jaga i öppna och halvöppna landskap där det kan
    ses sitta på torra grenar eller sväva högt upp i luften på jakt efter byten. Det
    karakteriseras av sina ljusa ögon, vilka ger arten sitt namn. Fågeln är en skicklig
    predator som följer sitt naturliga rovfågelbeteende.


    Beståndssituationen för vitögd vråk anses stabila och arten klassificeras som
    livskraftig, vilket innebär att populationen inte är hotad. Det återspeglar att
    arten har lyckats anpassa sig väl till sina naturliga habitat inom sitt utbredningsområde
    i Sydöstasien.'
  en: '# White-eyed Buzzard


    The white-eyed buzzard is a medium-sized hawk found across South Asia, easily
    identified by its distinctive white iris and rufous tail. Adults display a brown
    head and pale median coverts on the upper wings, with a white throat marked by
    a dark central stripe. Unlike true buzzards, it lacks prominent carpal patches
    beneath the wings, instead showing dark wing linings that contrast sharply with
    the paler flight feathers.


    This species is an active hunter, frequently spotted perching upright for extended
    periods before launching into thermal soaring flights in search of insects and
    small vertebrates. During the breeding season, it becomes particularly vocal,
    and observers may hear several birds calling as they circle together on thermals.
    This vocalisation is one of the most distinctive behavioural traits that can help
    identify it in the field.'
