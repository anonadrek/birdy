description:
  sv: '# Sparvhök


    Sparvhök är en liten rovfågel inom familjen hökar. Hanen är betydligt mindre än
    honan – upp till 25 procent mindre, vilket är en av de största storleksskillnaderna
    mellan könen inom fågelriket. Adulta hanar har blågrå ovansida och orangestreckad
    undersida, medan honor och ungfåglar är bruna på ovansidan med brunstreckade undersidor.
    Arten är specialiserad på att jaga fåglar, ofta i skogsmark, men förekommer även
    i många andra biotoper inklusive större städer.


    Sparvhöken är en snabb och smidig jägare som använder sin korta vingar och långa
    stjärt för att manövrerar bland träd och buskar. Den lever av sitt rov och jaggar
    framför allt mindre fåglar som sparvarna. Arten häckar i passande skogsområden
    och utgör en av Europas vanligaste rovfåglar.


    Sparvhöken förekommer från nordvästra Afrika till stora delar av det tempererade
    och subtropiska Eurasien, vilket gör den till en vitt utbredd art över ett stort
    geografiskt område.'
  en: '# Eurasian Sparrowhawk


    The Eurasian sparrowhawk is a small but formidable bird of prey with striking
    sexual dimorphism. Males display bluish-grey upperparts with orange-barred underparts,
    while females and juveniles are brown above with brown barring below. Remarkably,
    females can be up to 25% larger than males—one of the most extreme size differences
    between the sexes in any bird species. This size variation reflects their different
    hunting strategies: males typically pursue smaller prey like tits, finches, and
    sparrows, while females target larger birds such as thrushes and starlings, capable
    of killing prey weighing over 500 grams.


    Though the sparrowhawk specialises in woodland birds, it adapts readily to various
    habitats and has become increasingly common in gardens and urban areas, where
    it hunts at bird feeders and among shrubbery. Its agility and acceleration make
    it a formidable hunter in confined spaces. The species hunts by stealth, using
    woodland cover and hedgerows to approach prey before launching a swift attack
    with precise aerial manoeuvrability.'
