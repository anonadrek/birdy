description:
  sv: ''
  en: '# Short-toed Snake Eagle


    The short-toed snake eagle is a medium-sized raptor belonging to the hawk family
    Accipitridae, which encompasses diverse diurnal predators including kites, buzzards,
    and harriers. Its scientific name Circaetus gallicus derives from Ancient Greek
    origins: *kirkos* referring to a hawk and *aetos* meaning "eagle," while *gallicus*
    indicates its historical association with Gallia.


    This eagle is specialized for hunting snakes and other reptiles, which distinguishes
    it from many other raptors in its family. In appearance, it presents the characteristic
    features of a medium-sized eagle of prey. It hunts by soaring at height, scanning
    the ground below for movement, then diving to capture prey with its powerful talons.


    The species inhabits open and semi-open landscapes where it can hunt effectively,
    including steppes, grasslands, and areas with scattered trees. It tends to be
    a summer visitor to temperate regions, migrating to warmer areas during winter
    months. The short-toed snake eagle''s specialized diet and hunting behavior make
    it an important indicator species for healthy reptile populations in its range.'
migration:
  sv: ''
  en: '# Short-toed Snake Eagle in Scandinavia/Northern Europe


    The Short-toed Snake Eagle is a rare summer visitor to Scandinavia and northern
    Europe. Birds arrive in late spring (May) from their African wintering grounds,
    primarily appearing in southern Scandinavia and occasionally further north during
    migration periods. The species breeds sporadically in suitable habitat, including
    coastal and open woodland areas, though breeding records remain uncommon in the
    Nordic region. By late summer and autumn (August to September), these eagles depart
    for their African wintering grounds, with most individuals absent from Scandinavian
    waters by October. They do not overwinter in the region.'
