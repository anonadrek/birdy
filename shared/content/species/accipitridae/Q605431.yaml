description:
  sv: ''
  en: '# Crested Honey Buzzard


    The Crested Honey Buzzard is a fairly large raptor belonging to the hawk family,
    notably larger than its European relative. It exhibits sexual dimorphism, meaning
    males and females display different plumage patterns. The species comprises six
    subspecies distributed across its range.


    This raptor has an unusual and specialized diet, feeding primarily on the larvae
    of bees and wasps, which it extracts from honeycomb. This dietary specialization
    has given the species its common name. It hunts these insects with remarkable
    precision, making it a distinctive member of the raptor community despite sharing
    its family with more generalist hunters like eagles, kites, and harriers.


    The Crested Honey Buzzard inhabits woodland and forested regions across much of
    Asia. It can be identified by its characteristic crested appearance and relatively
    robust build. Like other honey buzzards, it is adapted for locating and raiding
    nests of bees and wasps, using its keen eyesight to spot suitable colonies before
    skillfully extracting the protein-rich larvae.'
