description:
  sv: '# Gabarhök


    Gabarhök är en liten rovfågel som förekommer uteslutande i Afrika. Det är en medlem
    av familjen hökar och tillhör ordningen hökfåglar. Arten är klassificerad som
    livskraftig enligt IUCN.


    Denna lilla hök är anpassad för jakt i öppen och halvöppen terräng. Det är en
    smidig rovfågel som bygger sitt reveir där det finns lämplig miljö för att hitta
    sitt byten. Arten är väl anpassad till afrikanska förhållanden och har utvecklats
    för att klara sina specifika jaktbehov.


    Gabarhöken är en relativt okänd art för många fågelskådare utanför Afrika, men
    utgör en viktig del av sitt lokala ekosystem som rovfågel.'
  en: ''
migration:
  sv: 'Migrationsdata saknas för denna art.


    (Gabarhöken är en afrikansk art som inte förekommer naturligt i Skandinavien eller
    Nordeuropa, varför migrationsinformation för denna region är irrelevant.)'
  en: ''
