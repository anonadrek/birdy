description:
  sv: ''
  en: '# Tawny Eagle


    The tawny eagle is a large bird of prey belonging to the booted eagle subfamily,
    identifiable by its heavily feathered legs. It displays warm brown plumage typical
    of its name. This opportunistic hunter inhabits open dry landscapes across much
    of Africa and the Indian subcontinent, favouring semideserts, steppes, and savanna
    plains, though it requires scattered trees rather than completely barren terrain.


    Remarkably adaptable in its feeding habits, the tawny eagle is among the most
    opportunistic of all booted eagles. It hunts a diverse range of prey actively
    and boldly, but equally readily scavenges carrion or steals food from other predators
    through kleptoparasitism. The species breeds as a resident, typically laying one
    to three eggs in stick nests built in tree crowns. It can live up to 16 years
    in the wild.


    Unfortunately, tawny eagle populations have declined dramatically throughout their
    range. Habitat loss from logging, climate change, persecution, and other human-caused
    mortality have pushed this once-numerous species towards possible extinction,
    making conservation efforts increasingly urgent.'
