description:
  sv: '# Svartvingad glada


    Svartvingad glada är en liten rovfågel inom hökfamiljen med mycket vid utbredning
    i Asien och Afrika. Under senare år har arten etablerat sig i sydvästra Europa
    och utvidgat sitt område norrut. Enskilda individer ses allt oftare längre norrut,
    och arten har registrerats flera gånger i Sverige sedan första dokumenterade funnet
    2004.


    Arten är på många håll en vanlig fågel med ett stabilt bestånd. Det är en småväxt
    rovfågel anpassad för att jaga på öppna terräer och från högt flugande position
    kunna nabbra sitt byte från marken eller luften.'
  en: '# Black-winged Kite


    The Black-winged Kite is a small, striking bird of prey with distinctive plumage
    combining white, grey, and black. It is immediately recognizable by its long wings,
    owl-like forward-facing eyes with striking red irises, and overall elegant proportions.
    This gives it an unusually refined appearance compared to many raptors.


    The species is best known for its remarkable hovering behaviour over open grasslands,
    a technique it shares with smaller kestrels. It hunts primarily in these open
    habitats, though it occasionally ventures onto grassy slopes in elevated regions.
    The Black-winged Kite is not migratory but moves nomadically in response to weather
    patterns and food availability, showing particular adaptability when rodent populations
    surge. It can raise multiple broods in a single year, an unusual ability among
    birds of prey.


    The kite''s range spans the Palearctic and Afrotropical regions. Notably, populations
    in southern Europe have expanded significantly in recent decades, benefiting from
    agricultural development and livestock farming, and the species has recently established
    itself in Southwest France. Its capacity to exploit changing environmental conditions
    demonstrates considerable ecological flexibility.'
migration:
  sv: '# Svartvingad glada i Skandinavien/Nordeuropa


    Svartvingad glada är en art som tradicionalt förekommer i Asien och Afrika, men
    har under senare år expanderat sitt utbredningsområde in i sydvästra Europa och
    norrut mot Frankrike. I Skandinavien är arten mycket sällsynt och förekommer främst
    som kringflygande individ. Det första svenska funnet registrerades 2004, och sedan
    dess har arten påträffats allt oftare längre norrut. Arten är inte etablerad som
    häckande eller övervintrande i regionen utan utgörs av sporadiska observationer
    av individer som sprider sig från sydvästra Europa.'
  en: '# Black-winged Kite in Northern Europe


    The Black-winged Kite is a non-migratory species showing nomadic movements in
    response to weather and food availability. Historically rare in Scandinavia and
    Northern Europe, this kite has expanded its range northward in recent decades,
    with populations increasing in southern Europe. While traditionally absent from
    or extremely rare in Scandinavian regions, occasional sightings have been recorded,
    particularly in southern parts of the Nordic countries. The species remains predominantly
    a bird of southern and central European grasslands and open plains. Any northern
    European occurrences would likely represent dispersing individuals or range expansion
    events rather than established migratory patterns typical of the region''s raptors.'
