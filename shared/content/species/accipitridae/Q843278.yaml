description:
  sv: ''
  en: '# Dark Chanting Goshawk


    The dark chanting goshawk is a medium-sized raptor with predominantly grey plumage
    and striking orange-red cere and legs that make it distinctive in flight. It has
    a relatively long tail and shorter, rounded wings adapted for maneuvering through
    woodland and savanna environments. The species is notably vocal for a raptor,
    producing loud, far-carrying calls that give it its common name.


    This goshawk inhabits open woodlands, savannas, and semi-arid regions across much
    of sub-Saharan Africa, with a small declining population persisting in southern
    Morocco. It hunts from perches or while soaring, preying on small mammals, birds,
    and reptiles. The species is often seen perched conspicuously on dead trees or
    termite mounds, where it calls frequently during the day—a behavior unusual among
    most hawks.


    The dark chanting goshawk remains relatively common throughout much of its range,
    though the isolated North African population faces ongoing conservation concerns.
    Its vocal nature and habit of hunting from exposed perches make it more conspicuous
    than many other raptors in its habitat.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Dark Chanting Goshawk is a resident species of sub-Saharan Africa and southern
    Arabia, with no regular occurrence in Scandinavia or Northern Europe. The species
    is not migratory within its African range and does not naturally reach Nordic
    or northern European territories. Therefore, migration patterns specific to Scandinavian
    regions cannot be documented.'
