description:
  sv: '# Bengalgam


    Bengalgam är en stor rovfågel i hökarfamiljen som hör hemma i Syd- och Sydostasien.
    Det karakteriseras av sin vita övygge, vilket är särskilt framträdande under flykten.
    Arten är en kraftfull flygare och framträder ofta i större flockar.


    Bengalgam är en necrófag som förlitar sig på att söka föda från döda djur. Historiskt
    sett var det världens vanligaste rovfågel med flera miljoner individer på 1980-talet.
    Arten har dock genomgått en dramatisk nedgång sedan dess.


    Populationen har kollapsat på grund av förgiftning från diklofenak, ett veterinärmedicin
    som användes på boskap. Denna exponering har varit ödesdigert för arten. År 2018
    uppskattas populationen till färre än 15 000 individer, och internationella naturvårdsunionen
    IUCN klassificerar bengalgam som akut hotad sedan år 2000. Arten står inför en
    kritisk framtid utan omfattande bevarandeansträngningar.'
  en: '# White-rumped Vulture


    The white-rumped vulture is a large Old World vulture found across South and Southeast
    Asia. It is critically endangered, with fewer than 6,000 mature individuals remaining
    globally—a catastrophic decline from several million in the 1980s when it was
    the world''s most abundant large raptor.


    The species is identified by its dark brown plumage contrasted with a white rump
    patch, which gives it its name. Like other vultures, it is superbly adapted for
    soaring flight, with broad wings and a lightweight skeleton that allow it to search
    vast areas for carrion. It feeds almost entirely on the remains of dead animals,
    playing a crucial ecological role as a scavenger.


    The primary threat to the species is poisoning from diclofenac, a anti-inflammatory
    drug used in livestock medicine. When vultures feed on carcasses of treated animals,
    the drug causes fatal kidney failure. Conservation efforts have focused on phasing
    out diclofenac and establishing vulture restaurants where safe food is provided.
    Breeding programmes in captivity offer hope for eventual population recovery,
    though the species faces an uncertain future without continued intensive intervention.'
