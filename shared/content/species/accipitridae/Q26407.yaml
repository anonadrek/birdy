description:
  sv: ''
  en: '# Rough-legged Buzzard


    The rough-legged buzzard is a medium-large bird of prey belonging to the hawk
    family. It inhabits arctic and subarctic regions during the breeding season, then
    migrates southward to escape the harsh winters. This migratory pattern takes it
    across North America, Europe, and Asia, making it a widespread northern species.


    In appearance, the rough-legged buzzard is robust and substantial, with the characteristic
    feathering on its legs that gives it its name—an adaptation to cold climates.
    It hunts over open terrain, often hovering in place while scanning the ground
    for small mammals and other prey. Its flight style is distinctive and methodical,
    making it relatively easy to identify in the field.


    The species has been known by various common names throughout history, including
    "rough-legged falcon," a term found in early ornithological works. Today, "rough-legged
    buzzard" is the standard name in European usage, while "rough-legged hawk" prevails
    in North America, reflecting the regional nomenclature differences for birds in
    the hawk family.'
migration:
  sv: ''
  en: '# Rough-legged Buzzard (Buteo lagopus) in Scandinavia


    The Rough-legged Buzzard is a migratory species in Scandinavia, breeding in arctic
    and subarctic regions during the summer months before undertaking long-distance
    southward migration in autumn. Birds typically arrive on breeding grounds in northern
    Scandinavia from April onwards, establishing territories across tundra and moorland
    habitats. During winter months (October-March), the species is largely absent
    from the region, having migrated south to lower latitudes where food remains more
    accessible. Occasional individuals may overwinter in southern Scandinavia during
    mild winters, though this is not typical. Spring return migration occurs progressively
    northward through March and April.'
