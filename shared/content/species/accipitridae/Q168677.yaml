description:
  sv: '# Grågam


    Grågam är en stor rovfågel som tillhör familjen hökar och representerar gamla
    världens gamar. Det är en imponerande fågel med mörk fjäderdräkt, och det förekommer
    lokalt i södra Europa samt i södra Asien ända till Kina och Tibet.


    Arten har genomgått intressanta populationstrender. I Europa ökar antalet grågamar,
    vilket representerar en positiv utveckling för arten. Motsatt trend ses dock i
    Asien, där populationen minskar. Globalt klassificeras grågamen som nära hotad,
    vilket återspeglar de utmaningar arten står inför på ett världsomfattande plan.


    Grågamen är en arktypisk gamart som söker föda över stora områden från höga höjder
    där det kan observeras seglande på termiska luftströmmar.'
  en: '# Cinereous Vulture


    The cinereous vulture is an enormous raptor and the largest vulture in the Old
    World. It measures 1.2 metres in body length with a wingspan reaching 3.1 metres,
    and weighs up to 14 kilograms. It is predominantly dark brown to blackish in plumage,
    with a relatively bare head adapted for feeding on carrion without soiling its
    feathers.


    This vulture is a soaring specialist, spending much of its day riding thermal
    currents at great heights while searching for dead animals. It often hunts cooperatively
    with other vultures, and at carcasses it dominates smaller species due to its
    massive size and strength. The bird is largely silent, though it may produce hisses
    and grunts around food.


    The cinereous vulture is distributed across temperate Eurasia, inhabiting mountainous
    and open regions where it can find suitable updrafts for soaring flight. It prefers
    areas with rocky cliffs for nesting and requires extensive wilderness with sufficient
    food availability, making it sensitive to habitat loss and poisoning from contaminated
    carcasses.'
migration:
  sv: '**Grågam - Förekomst i Norden**


    Grågam är en mycket sällsynt gäst i Skandinavien och Northern Europa. Arten förekommer
    normalt i södra Europa och södra Asien, men är inte en stannfågel eller vanlig
    migrant i nordiska regioner. Observationer från Norden är mycket ovanliga och
    representerar huvudsakligen vagabunderande individer långt från artens normala
    utbredningsområde. Arten har ingen etablerad migrationsrutt genom eller till Skandinavien.


