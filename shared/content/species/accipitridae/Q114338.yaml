description:
  sv: ''
  en: '# Levant Sparrowhawk


    The Levant sparrowhawk is a compact bird of prey, measuring 32–38 cm in length
    with a wingspan of 65–75 cm. Females are noticeably larger than males, though
    less dramatically so than in the closely related Eurasian sparrowhawk. Adult males
    display distinctive blue-grey plumage on the upperparts with dark wingtips, while
    the underparts feature reddish barring. Females tend to be browner above.


    This small raptor hunts with agility and speed, taking small birds and occasionally
    insects in flight. It favours open and semi-open habitats where it can manoeuvre
    swiftly through the air. The species is migratory in parts of its range, moving
    seasonally between breeding and wintering grounds. Its hunting style is characteristic
    of sparrowhawks, relying on surprise and quick acceleration rather than sustained
    pursuit.


    Little detailed information is readily available about its vocalizations and specific
    behaviour compared to more widely studied sparrowhawk species, though it shares
    many habits with its close relatives. The Levant sparrowhawk inhabits woodland
    edges, cultivated areas, and scrubland across portions of southern Europe and
    western Asia, where keen observers may spot it perched watchfully or coursing
    low over vegetation in search of prey.'
