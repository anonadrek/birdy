description:
  sv: ''
  en: '# Steppe Eagle


    The steppe eagle is a large bird of prey belonging to the "booted eagles"—a subfamily
    characterized by feathering that extends down the legs to the toes. This species
    was historically considered closely related to the tawny eagle, and the two were
    once classified as a single species. However, pronounced differences in morphology
    and anatomy led to their separation into distinct species, a division supported
    by molecular studies.


    The steppe eagle is adapted for hunting across open terrain, with powerful build
    and the characteristic leg feathering of its subfamily. It inhabits expansive
    grasslands and semi-arid regions where it hunts for small mammals, birds, and
    other prey. Its hunting behaviour and ecological preferences reflect its specialization
    for life in open landscapes.


    The steppe eagle''s range spans Central Asia and adjacent regions, with populations
    undertaking seasonal migrations. Its distinctive silhouette and size make it recognizable
    to birdwatchers observing raptors in appropriate habitat.'
migration:
  sv: ''
  en: '# Migration of the Steppe Eagle in Northern Europe


    The Steppe Eagle is a rare visitor to Scandinavia and Northern Europe, appearing
    primarily during spring and autumn migration periods. This species is a long-distance
    migrant that breeds in Central Asian steppes and winters in Africa and the Indian
    subcontinent. In Northern Europe, sightings are irregular and typically occur
    in September through October during southward migration, with occasional spring
    records in April-May. The species does not establish breeding populations in the
    region and does not overwinter in Scandinavia.'
