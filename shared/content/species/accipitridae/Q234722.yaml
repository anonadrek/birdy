description:
  sv: '# Hökörn


    Hökörn är en medelstor rovfågel inom familjen hökar. Det är en vida spridd art
    som förekommer på flera kontinenter. Arten karakteriseras av mörk fjäderdräkt
    med ljusare markering på undersidan, särskilt på huvudet och nacken. Under flykt
    är hökörn smidig och manöverduglig med relativt korta vingar och lång stjärt.


    Hökörn är en skicklig jägare som ofta ses cirklande högt över öppna landskap och
    bergiga områden där det söker efter andra fåglar och små däggdjur. Det är en påtaglig
    rovfågel som ofta jagar genom snabba anfall från luften. Arten häckar i klippor
    och höga träd, ofta returning till samma bo år efter år.


    Hökörnens globala population klassificeras som livskraftig, men antalet minskar
    snabbt. Arten är känslig för förföljelse, habitatförlust och miljögifter. Världsomfattande
    är det fortfarande en relativt vanlig rovfågel, men dess minskning är en växande
    miljökoncern.'
  en: ''
