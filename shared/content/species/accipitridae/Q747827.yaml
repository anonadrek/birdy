description:
  sv: '# Klippörn


    Klippörn är en stor rovfågel i familjen hökar som förekommer främst i Afrika söder
    om Sahara, men även på Arabiska halvön. Den är huvudsakligen knuten till klippiga
    bergstrakter, savann och halvöken där miljön erbjuder bra jaktförhållanden.


    Arten är specialiserad på att jaga klippgrävling, vilket utgör huvuddelen av dess
    diet. Klippörn är en effektiv jägare som patrullerar sina revir högt upp i luften
    och använder sin styrka och precision för att fånga sitt byte. Den är väl anpassad
    till sitt habitat och har ett stabilt bestånd.


    Fågeln föredrar öppna och kuperade terränger där den kan få överblick och möjlighet
    att anfalla sitt byte från höga höjder. Klippörn är ofta att se när den seglar
    majestätiskt över bergiga områden och torra landsdelar.'
  en: ''
migration:
  sv: '# Klippörn (Aquila verreauxii) - Förekomst i Skandinavien/Nordeuropa


    Migrationsdata saknas för denna art.


    Klippörn är en huvudsakligen afrikansk och mellanöstern fågel som inte förekommer
    naturligt i Skandinavien eller Nordeuropa. Arten är stationär eller delvis flyttfågel
    inom sitt naturliga utbredningsområde i Afrika söder om Sahara och på Arabiska
    halvön, men har ingen etablerad förekomst i nordeuropeiska regioner. För information
    om denna arts säsongsvariation rekommenderas att konsultera fältguider fokuserade
    på afrikansk fågelfauna.'
  en: ''
