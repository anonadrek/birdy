description:
  sv: ''
  en: '# Long-legged Buzzard


    The long-legged buzzard is a large raptor of the Buteo genus, widely distributed
    across Eurasia and North Africa, from southeastern Europe through East Africa
    to the Indian subcontinent. It is a robust and powerful hunter, though somewhat
    sluggish in overall behaviour compared to other raptors. The species takes its
    name from its notably long legs, which are a key identifying feature in the field.


    This buzzard is an adaptable predator, primarily hunting small mammals such as
    rodents, gerbils, ground squirrels, voles and rats. It also regularly takes reptiles,
    birds, insects and carrion, making it a generalist feeder suited to varied environments.
    It nests on diverse surfaces including cliffs, rocky outcrops and trees, displaying
    typical buzzard breeding behaviour.


    The long-legged buzzard inhabits open and semi-open landscapes across its wide
    range, from lowlands to moderate elevations. Its population remains stable, and
    it is classified as Least Concern by the IUCN. The species'' adaptability to different
    habitats and flexible diet contribute to its success across such a broad geographic
    range.'
