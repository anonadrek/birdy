description:
  sv: '# Brun kärrhök


    Brun kärrhök är en medelstor rovfågel som tillhör högenfamiljen. Hannen är gråbrun
    med ljusare huvud och axlar, medan honan är mörkare och större. Arten kännetecknas
    av långa vingar och lång stjärt, vilket ger den en behändig framfart när den jagar
    över öppna områden.


    Arten söker sin föda – huvudsakligen fåglar, små däggdjur och grodor – genom att
    sväva lågt över sumpmarker och vassrika sjöar. Den är aktiv både på dagen och
    vid skymning. Brun kärrhök har en karakteristisk läte, ett högt pipande som hörs
    under häckningsperioden.


    Arten häckar i jordbruksmarker och vid sjöar med riklig vegetation i stora delar
    av Europa och Asien. Under vintern migrerar den till varmare regioner. Den är
    världsvid klassificerad som livskraftig och bibehålls i många naturskyddsområden
    för att säkra arten långsiktiga överlevnad.'
  en: '# Western Marsh Harrier


    The Western Marsh Harrier is a large bird of prey found across temperate and subtropical
    regions of western Eurasia and adjacent Africa. It is a member of the harrier
    family, distinguished by its characteristic long wings and tail that enable graceful,
    buoyant flight low over wetland habitats. Males typically display pale plumage
    on the head and breast, while females and juveniles are considerably darker with
    striking cream-coloured markings on the head and shoulders—features that aid in
    field identification.


    This harrier hunts by quartering slowly over reed beds, marshes, and open water,
    scanning for small mammals, birds, and occasionally reptiles. It is an agile predator,
    capable of sudden acceleration to snatch prey from the ground or shallow water.
    The species roosts communally in winter, often gathering in large numbers at favoured
    wetland sites.


    The Western Marsh Harrier inhabits wetland environments including reed beds, marshes,
    and lakeshores where it nests on the ground among dense vegetation. Its call is
    a sharp, piercing cry, typically delivered during displays or territorial encounters.
    Formerly, several geographically separated populations were considered part of
    a single "marsh harrier" species, but these are now recognized as distinct species
    found in eastern Asia, Australasia, and the Indian Ocean region.'
migration:
  sv: '# Brun kärrhök i Skandinavien och Nordeuropa


    Brun kärrhök är en flyttfågel som anländer till Skandinavien och Nordeuropa under
    våren för att häcka i vassrika sjöar och våtmarker. Arten häckar i stora delar
    av Europa från april-maj till augusti-september. Under hösten påbörjar fåglarna
    sin långväga migration söderut, och de övervintering inte i Skandinavien eller
    Nordeuropa utan drar istället till Medelhavsområdet, Afrika söder om Sahara, Mellanöstern
    och Sydasien. Återkomsten till häckningsområdena sker på nytt under vårmånaderna.
    Arten är således endast närvarande som häckfågel under växtsäsongen i denna nordliga
    del av sitt stora utbred­ningsområde.'
  en: '# Western Marsh Harrier (Circus aeruginosus) in Scandinavia/Northern Europe


    The Western Marsh Harrier is a summer visitor to Scandinavia and Northern Europe,
    arriving in spring to breed in extensive reed beds and wetland habitats. These
    birds typically return to their breeding grounds from April onwards after wintering
    in Africa and southern Europe. They depart in autumn as their wetland habitats
    freeze over, with most individuals having left by September or October. During
    migration periods, they may be observed in suitable wetland areas across the region
    as they pass through.


    Migration data for this species'' specific timing and overwintering locations
    within Northern Europe is limited in the provided source material. For comprehensive
    information about local population trends and precise arrival/departure dates
    in particular Scandinavian regions, additional ornithological sources would be
    recommended.'
