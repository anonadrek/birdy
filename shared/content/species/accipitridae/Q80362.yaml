description:
  sv: '# Brun glada


    Brun glada är sannolikt världens vanligaste rovfågel och förekommer vitt utbredd
    över Europa, Asien, Afrika och Australien. Arten tillhör hökarfamiljen och är
    väl anpassad till att leva i närheten av människan.


    I tropiska områden ses brun glada ofta i stora antal, särskilt vid soptippar och
    avstjälpningsplatser där den söker föda. Arten är mycket opportunistisk när det
    gäller mat och utnyttjar gärna människans avfallsområden. Detta gör den till en
    framgångsrik rovfågel som trivs väl i urbaniserade miljöer.


    Arten är känd för sin skicklighet i luften och sitt distinktiva flygbeteende med
    karakteristisk vingslängning under segling.'
  en: '# Black Kite


    The black kite is a medium-sized raptor and likely the world''s most abundant
    bird of prey. It belongs to the hawk family, which encompasses numerous diurnal
    raptors. With global population estimates reaching 6.7 million individuals, it
    is remarkably widespread, though some regional populations have experienced significant
    declines or fluctuations in numbers.


    As a skilled hunter, the black kite exploits diverse habitats and food sources,
    contributing to its success across much of the world. Its adaptability and widespread
    distribution make it a familiar sight to birdwatchers in many regions, though
    conservation efforts remain important for maintaining stable populations where
    numbers have become vulnerable.'
migration:
  sv: '# Brun glada i Skandinavien och Nordeuropa


    Brun glada är en sällsynt besökare i Skandinavien och Nordeuropa. Arten förekommer
    framför allt under hösten som en genomflyttare, särskilt i södra Sverige och Danmark,
    där enstaka individer observeras under augusti till oktober. Arten är huvudsakligen
    häckvåg från Sydeuropa och Medelhavsregionen. Under vinterhalvåret övervintrarar
    brun glada i Afrika och södra Asien, medan några få individer sporadiskt dyker
    upp under senhösten och vintern i nordliga delen av sitt gamla världsutbredningsområde.'
  en: '# Black Kite (*Milvus migrans*) in Northern Europe


    The Black Kite is a rare and irregular visitor to Scandinavia and Northern Europe,
    appearing primarily during spring and autumn migration periods. While the species
    is a long-distance migrant across much of its Eurasian range, it does not establish
    regular breeding populations in Scandinavian countries. Occasional sightings occur
    in southern Scandinavia, particularly during May and September, likely representing
    birds dispersing from breeding grounds in central and eastern Europe. Overwintering
    in the region is extremely rare, as the vast majority of populations migrate to
    Africa.'
