description:
  sv: ''
  en: '# White-tailed Eagle


    The white-tailed eagle is a massive bird of prey and one of the largest eagles
    in its range. It belongs to the family Accipitridae, which encompasses hawks,
    kites, and harriers. This species is one of eleven sea eagles in the genus Haliaeetus,
    distinguished by its characteristic white tail feathers that contrast with darker
    plumage on the body and wings. The bird''s powerful build and impressive wingspan
    make it unmistakable in flight.


    Primarily a hunter of fish and waterfowl, the white-tailed eagle is strongly associated
    with aquatic habitats, particularly large lakes and coastal areas. It hunts by
    soaring at considerable heights before diving to snatch prey from the water''s
    surface with its formidable talons. The species is monogamous and builds enormous
    stick nests that are reused and added to annually, eventually becoming massive
    structures.


    Widely distributed across temperate Eurasia, the white-tailed eagle inhabits regions
    with suitable freshwater or marine environments and mature forests for nesting.
    It has alternate names including sea eagle, erne, and gray sea eagle, reflecting
    its widespread distribution and the varied traditions of different cultures across
    its range.'
migration:
  sv: ''
  en: '# White-tailed Eagle in Northern Europe


    The White-tailed Eagle is a regular winter visitor and passage migrant throughout
    Scandinavia and Northern Europe. Populations from eastern Europe and Russia migrate
    westward during autumn, arriving in Nordic countries from September onwards, with
    peak numbers occurring through winter months. Some individuals remain year-round,
    particularly in coastal areas where open water provides hunting opportunities.
    Spring departure occurs gradually from March through May as birds return to their
    breeding grounds in Eastern Europe and Russia. In recent decades, recolonization
    efforts have established small breeding populations in parts of Scandinavia, particularly
    Sweden and Norway, with these resident birds showing more limited seasonal movements
    compared to migratory populations.'
