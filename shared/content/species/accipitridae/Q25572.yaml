description:
  sv: '# Blå kärrhök


    Blå kärrhök är en medelstor rovfågel som tillhör familjen hökar. Arten häckar
    i våtmarker och jordbrukslandskap över stora delar av norra Europa och Asien.
    Hanarna är gråblå till ljusgrå på ovansidan med vita undersidor, medan honorna
    och ungfåglarna är bruna med ljusare streckad undersida. En viktig igenkänningsmärke
    är de vita teckningarna på övergumpen, som syns väl när fågeln flyger.


    Blå kärrhök är en skicklig jägare som glider lågt över marken när den söker efter
    bytesdjur, främst mindre fåglar och gnagare. Arten är mycket elegant i flykten
    med långa vingar och långa stjärt. Den är långsvansad och smäcker jämfört med
    andra rovfåglar.


    Beståndet av blå kärrhök har minskat under senare tid, men arten anses fortfarande
    ha en livskraftig global population. Fågeln är huvudsakligen migratorisk över
    mycket av sitt utbredningsområde och söker upp både öppna landskap och våtmarker
    för häckning och övervintering.'
  en: '# Hen Harrier


    The hen harrier is a medium-sized bird of prey that hunts over open habitats including
    marshes, grasslands, and moorland. It displays striking sexual dimorphism: males
    are noticeably smaller with grey and white plumage and black wingtips, while females
    are larger and predominantly brown with buff, barred underparts. Both sexes share
    a characteristic white rump patch, particularly prominent in females and juveniles—a
    useful field mark when watching it quarter low over open ground in its distinctive,
    graceful hunting style.


    This species is migratory across much of its range, vacating higher-altitude breeding
    grounds in winter to move south. In milder regions, some birds remain year-round
    residents. It breeds in open areas such as marshes and grasslands across Eurasia.
    The hen harrier''s slender build and buoyant flight distinguish it from other
    large raptors, making it relatively distinctive once observed in its preferred
    open habitats.'
migration:
  sv: '# Blå kärrhök - Förekomst i Nordeuropa


    Blå kärrhök är en migrerande art som häckar i norra Europa under sommaren och
    flyttar söderut för att övervintra. I Skandinavien anländer arten vanligtvis på
    våren, från april till maj, när den återvänder från sina övervintringskvartar
    i södra Europa och Afrika. Under hösten påbörjar fåglarna sin avresa från juli
    och in i september. Arten är således endast en säsongsboende häckfågel i nordiska
    regioner och förekommer inte reguljärt under vintermånaderna, då den söker upp
    märre snöfria områden med bättre tillgång till bytesdjur.'
  en: '# Hen Harrier (Circus cyaneus) in Northern Europe


    The Hen Harrier is a migratory raptor in Scandinavia and northern regions, though
    migration patterns vary by location. Birds breeding in northern Eurasia migrate
    southward in autumn, typically departing by September and October, leaving higher
    altitudes largely empty during winter. Spring arrival occurs from March onwards
    as temperatures rise. In milder areas such as southern Britain and France, some
    populations remain resident year-round. Northern populations breeding in open
    marshes and grasslands vacate their territories, moving to southern Europe and
    beyond to avoid harsh winter conditions when prey becomes scarce.'
