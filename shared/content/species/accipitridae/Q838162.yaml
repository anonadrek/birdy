description:
  sv: ''
  en: '# Lappet-faced Vulture


    The lappet-faced vulture is a massive Old World vulture, distinguishable by its
    large, bare head and neck adorned with prominent fleshy lappets—loose folds of
    skin that give the species its distinctive appearance. It is the sole surviving
    member of its genus Torgos and belongs to the Accipitridae family, which encompasses
    eagles, kites, buzzards, and hawks.


    Unlike its superficially similar New World vulture cousins, the lappet-faced vulture
    relies less on an acute sense of smell for locating food. Instead, it depends
    on keen eyesight to spot carrion across open landscapes. It is typically seen
    soaring at considerable heights, scanning the ground below for feeding opportunities.


    This species inhabits arid and semi-arid regions where it searches for larger
    carcasses. Its size and powerful build allow it to dominate other vultures at
    feeding sites, making it a formidable scavenger in its range.'
