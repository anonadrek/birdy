description:
  sv: ''
  en: '# Pallid Harrier


    The pallid harrier is a slender bird of prey belonging to the harrier family.
    It resembles other harrier species but is notably streamlined, with long, narrow
    wings and a long tail that aid its agile, low-level hunting style. Males are pale
    grey above with darker wing markings, while females and juveniles are brown with
    streaked underparts.


    This harrier hunts small mammals, birds, and insects by coursing low over open
    grassland and steppe habitats, relying on speed and surprise to catch prey. It
    quarters ground methodically with buoyant, graceful flight. The species is migratory,
    breeding across southern eastern Europe, central Asia, and Iran during spring
    and summer months before moving to winter grounds in India and southeast Asia.


    The pallid harrier was historically rare in western Europe, but sightings have
    increased in recent years, making it an occasional but noteworthy vagrant to Great
    Britain and western Europe. Breeding has recently expanded westward, with pairs
    successfully nesting in the Netherlands and Spain in recent years—significant
    range extensions for the species. It favours open terrain including grasslands,
    agricultural fields, and semi-desert regions.'
migration:
  sv: ''
  en: '# Pallid Harrier in Northern Europe


    The Pallid Harrier is a rare vagrant to Scandinavia and Northern Europe, with
    no regular occurrence pattern. This species breeds in southern eastern Europe
    and central Asia, wintering primarily in India and southeast Asia. While occasional
    sightings have been documented in Great Britain and western Europe, the species
    does not establish breeding populations in Scandinavian regions. Recent breeding
    attempts in the Netherlands (2017) and Spain (2019) represent exceptional events
    rather than indicators of range expansion northward. Any observations in Northern
    Europe would constitute noteworthy sightings for local bird communities.'
