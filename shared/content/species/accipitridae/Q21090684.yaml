description:
  sv: '# Större skrikörn


    Större skrikörn är en rovfågel som tillhör familjen hökar, tillsammans med alla
    örnar. Det är en art som häckar från Östeuropa och österut mot Kina. Populationen
    är fåtalig och minskar i antal, vilket gör arten hotad globalt. Enligt IUCN är
    större skrikörn klassificerad i hotkategorin sårbar, vilket indikerar att arten
    står inför betydande naturskyddsutmaningar.'
  en: '# Greater Spotted Eagle


    The greater spotted eagle is a large, dark-brown bird of prey belonging to the
    hawk family. It measures approximately 65-72 centimetres in length with a wingspan
    reaching up to 1.9 metres. Adults are uniformly dark brown, sometimes appearing
    almost black, with faint spotting on the wings and body that gives the species
    its name. The bird has relatively short, broad wings and a medium-length tail,
    characteristic features that aid identification in flight.


    A migratory species, the greater spotted eagle travels between breeding grounds
    in eastern Europe and Asia and wintering grounds in Africa and the Middle East.
    It favours open and semi-open habitats including steppes, forests, and cultivated
    areas where it hunts for prey from perches or in flight. The eagle typically feeds
    on small mammals, birds, and amphibians, hunting with deliberate, powerful flight.


    During breeding season, the species produces various calls including harsh screams
    and yelping sounds. It nests in tall trees or on rocky outcrops, constructing
    large stick nests that may be reused and enlarged over successive years. The greater
    spotted eagle requires extensive, relatively undisturbed territories for successful
    breeding and migration, making it susceptible to habitat loss and human disturbance.'
migration:
  sv: '# Större skrikörn - förekomst i Skandinavien/Nordeuropa


    Större skrikörn är en östeuropeisk art som endast förekommer mycket sporadiskt
    i Skandinavien och Nordeuropa. Arten häckar från Östeuropa österut och är därför
    en ytterst sällsynt gäst i vårt område. Under flyttningen kan enstaka individer
    observeras, särskilt under höstdragningen när ungfåglar sprider sig från häckningsområdena.
    Det finns dock ingen etablerad population eller regelbound förekomst i Skandinavien.
    Eventuella observationer är slumpartat förekommande vagabunder som anländer från
    sina östeuropeiska häckningsområden.'
  en: '# Greater Spotted Eagle (*Clanga clanga*) in Scandinavia/Northern Europe


    The Greater Spotted Eagle is a rare but regular migrant through Scandinavia and
    Northern Europe, appearing primarily during spring and autumn migration periods.
    This large raptor breeds in eastern Europe and western Asia, with populations
    passing through the region en route to and from African wintering grounds. Birds
    typically arrive in spring (April-May) and depart in autumn (August-September),
    making sightings in Scandinavia relatively uncommon. The species does not establish
    breeding populations in Northern Europe and does not overwinter in the region,
    occurring only as a transient visitor during migration corridors.'
