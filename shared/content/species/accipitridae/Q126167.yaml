description:
  sv: '# Lammgam (Gypaetus barbatus)


    Lammgam är en imponerande gam som skiljer sig från andra gamarter genom sin täta
    befjädring på huvud och hals – ett unikt drag inom gamsläktet. Det är en stor
    rovfågel med mörka vingar och ofta rostfärgad undersida, särskilt på bröstet och
    buken. Huvudet är karakteristiskt ljust med mörka ögonstreck, och arten har en
    distinktiv tuft av långa fjädrar under underkäken, vilket förklarar dess namn.


    Arten förekommer i bergiga regioner på flera kontinenter, framför allt i höga
    fjällmiljöer där det finns gott om termiska uppvindningar. Lammgam är en skicklig
    flygare som seglandes högt i luften och söker efter mat. Det är huvudsakligen
    en benätare – det flyger ner kadaver från bergssidor för att dela upp skelettet
    och äter därefter bennötet.


    Globalt anses lammgamens population vara livskraftig, men i vissa regioner är
    arten allvarligt hotad. Framför allt i södra världsdelarna och på vissa bergsmassiv
    har populationen minskat kraftigt.'
  en: '# Bearded Vulture


    The bearded vulture is an enormous bird of prey distinguished by its pale plumage,
    dark flight feathers, and characteristic facial markings that resemble a dark
    moustache and chin patch. It is notably the only known vertebrate with a diet
    consisting of 70–90% bone, which it locates by soaring at great heights over mountainous
    terrain. The bird drops large bones onto rocks from considerable altitude to crack
    them open, accessing the nutritious marrow inside—an adaptation reflected in one
    of its alternative names, ossifrage, meaning "bone-breaker."


    This vulture inhabits remote, rugged mountainous regions across parts of Europe,
    Asia, and Africa. It is typically observed soaring solitarily or in pairs, riding
    thermal currents with deliberate, measured wing-beats. The bearded vulture''s
    calls are relatively quiet compared to other vultures, consisting of occasional
    whistles and mews.


    With impressive wingspans exceeding nine feet, it can sustain flight for extended
    periods while searching for carrion. Its specialization on bone—a food source
    largely ignored by other scavengers—allows it to fill a unique ecological niche,
    though this dependence on bone-rich kills makes it vulnerable to habitat loss
    and reduced carrion availability in modern landscapes.'
migration:
  sv: '# Lammgam (Gypaetus barbatus) i Skandinavien/Nordeuropa


    Migrationsdata saknas för denna art.


    Lammgam är en bergbeboende rovfågel som inte förekommer naturligt i Skandinavien
    eller Nordeuropa. Arten är utbredda i bergiga områden i södra Europa, Asien och
    Afrika. I de få fall där arten observerats i Skandinavien rör det sig om mycket
    sällsynta villoflygare eller möjliga spridningsindivider från sydeuropeiska populationer.
    För denna arts förekomst i sitt naturliga utbredningsområde krävs höga bergsmässor
    och specifika klimatiska förhållanden som inte finns i norra Europa.'
  en: '# Bearded Vulture (Gypaetus barbatus) in Scandinavia/Northern Europe


    The Bearded Vulture is an extremely rare vagrant to Scandinavia and Northern Europe,
    with no established resident or regular migratory population in the region. Historically,
    this species was present in Alpine areas and parts of southern Europe, but it
    has been absent from Scandinavia for centuries. Occasional sightings occur when
    young birds disperse from populations in the Alps or other southern European ranges,
    but these remain exceptional records rather than regular occurrences. The species
    requires mountainous terrain and is adapted to much warmer climates than typical
    Northern European conditions, making permanent establishment or regular seasonal
    migration to this region highly unlikely.'
