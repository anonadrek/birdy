description:
  sv: '# Strandskata


    Strandskata är en stor och kompakt vadare som är lätt att känna igen på sin karakteristiska
    färgdräkt. Den har svart fjäderdräkt på rygg och huvud, vilket kontrasterar starkt
    mot den vita delen på bröst och buk. Näbben är framträdande orangeröd och benen
    är rosafärgade, vilket gör arten svår att förväxla med andra vadare.


    Det är en moverad art som häckar längs kusterna i västra Europa, centrala Eurasien
    och nordöstra Asien. Merparten av populationen är flyttfåglar som återvänder till
    häckningsplatserna under våren. Arten förekommer främst i strandnära miljöer där
    den söker föda.


    Strandskata tillhör familjen strandskator och är den mest spridda arten inom sin
    familj globalt. Den är en skicklig vadare som är väl anpassad för livet längs
    vattenbrynen.'
  en: '# Eurasian Oystercatcher


    The Eurasian oystercatcher is an unmistakable wader with striking black and white
    plumage, a long straight orange-red bill, and distinctive red eyes. Its relatively
    short, dull pink legs complete the striking appearance. While the sexes look similar
    overall, females have noticeably longer bills than males.


    This species is a specialist feeder on molluscs, particularly mussels and oysters,
    which it expertly opens with its powerful bill. It inhabits coastal areas and
    is often seen singly or in small groups along rocky shores, beaches, and mudflats.
    The bird is highly vocal, producing loud, piercing calls that carry well across
    open terrain. Its flight is direct and swift, often displaying white wing patches
    and white back markings in contrast to its dark upper parts.


    Eurasian oystercatchers are found across much of coastal Europe and Asia, typically
    favouring rocky or sandy coastlines rather than densely vegetated areas. They
    are partly migratory, with northern populations moving south during winter months,
    while some populations remain year-round residents in milder regions.'
migration:
  sv: '# Strandskata – Förekomst i Skandinavien


    Strandskata är en flyttfågel som förekommer längs Skandinaviens och Nordeuropas
    kuster. Arten häckar under sommaren längs västkusten och återvänder på våren,
    vanligtvis från april och framåt. Under hösten börjar fåglarna dra söderut, ofta
    redan från juli-augusti, för att övervinta längre söderut vid västeuropeiska kuster.
    En del individer stannar dock år-runt i södra Skandinavien under milda vintrar.
    Populationen är migratorisk och följer främst kustnära livsmiljöer där de söker
    föda bland stenar och sand.'
  en: '# Eurasian Oystercatcher Migration in Northern Europe


    The Eurasian oystercatcher is a migratory wader across Scandinavia and Northern
    Europe. Breeding populations arrive in spring (March-April) to establish territories
    along coastal areas and river systems. During summer months, they breed throughout
    much of Scandinavia and northern regions. In autumn (August-September), populations
    begin their southward migration, with most birds departing northern areas by October
    to overwinter in milder coastal regions of western and southern Europe, North
    Africa, and along Mediterranean shores. Some individuals may remain in ice-free
    coastal areas during mild winters, but the majority vacate Scandinavian regions
    entirely during the colder months.'
