description:
  sv: '# Iberisk gransångare


    Iberisk gransångare är en liten insektsätande lövsångare som tidigare betraktades
    som en underart till gransångaren men numera erkänns som egen art. Det är en diskret
    fågel som kräver uppmärksam observation för att identifieras säkert.


    Arten förekommer på Iberiska halvön, där det lever i skogshabitat och buskskogsområden.
    Det är en aktiv liten fågel som ofta rör sig genom lövet på jakt efter små insekter.
    Iberisk gransångare skiljer sig från närbesläktad gransångare genom subtila skillnader
    i fjäderdräkt och röst, vilket kräver erfarenhet att särskilja under fältobservation.


    Arten utgör en stabil population och anses ha ett livskraftigt bestånd. För den
    intresserade fågelskådaren erbjuder Iberisk gransångare en intressant utmaning
    när det gäller identifikation bland annat lövsångararter i sitt utbredningsområde.'
  en: '# Iberian Chiffchaff


    The Iberian chiffchaff is a small leaf warbler belonging to the Phylloscopidae
    family. It breeds in southwestern Europe and northwestern Africa, then migrates
    to winter in western Africa south of the Sahara Desert. Like other chiffchaffs,
    it is a compact warbler with relatively subdued plumage that blends well with
    its leafy habitat.


    This species favors scrubland and open woodlands where it forages actively among
    vegetation for small insects and other invertebrates. Its behaviour is typical
    of leaf warblers—restless and energetic, often seen flicking through foliage as
    it hunts. The call is characteristic of the chiffchaff group, though it can be
    distinguished from closely related species by those familiar with the genus.


    The Iberian chiffchaff is best located during its breeding season in suitable
    Mediterranean and semi-arid habitats. As a long-distance migrant, it is absent
    from its breeding grounds during winter months, making it a seasonal visitor to
    its range rather than a year-round resident.'
