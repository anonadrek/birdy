description:
  sv: '# Videsångare


    Videsångare är en liten asiatisk lövsångare som häckar främst på tajgan i sydöstra
    Sibirien. Under vintermånaderna flyttar arten långt söderut till Sydostasien för
    att söka föda. I Europa är videsångaren en sällsynt men regelbunden besökare som
    återkommer år efter år.


    I Sverige förekommer arten årligen under höstflyttningen, då den syns framför
    allt i slutet av september och oktober. Som många lövsångare är videsångaren en
    liten och ganska slät fågel som ofta håller till i buskar och låg vegetation när
    den registreras här. Den kan då skilja sig från andra liknande lövsångare genom
    sin karaktäristiska utseende och beteende, även om arten kräver uppmärksam iakttagelse
    för att säkert identifieras.'
  en: ''
migration:
  sv: '# Videsångare – Förekomst i Nordeuropa


    Videsångare är en asiatisk art som förekommer i Nordeuropa främst under höstmigrationen.
    Arten häckar på tajgan i sydöstra Sibirien och genomför regelbundna flyttningar
    till Sydostasien för övervintering. I Sverige och övriga Europa är videsångaren
    en sällsynt men återkommande gäst som dyker upp årligen under sen september och
    oktober, då ungfåglar och några vuxna individer sprider sig västerut under sitt
    höstdrag mot sina sydöstasiatiska övervintringsområden.'
  en: ''
