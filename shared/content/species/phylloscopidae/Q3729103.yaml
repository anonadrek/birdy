description:
  sv: '# Berggransångare


    Berggransångare är en liten lövsångare som förekommer i bergstrakter på två skilda
    platser i Asien – i Kaukasusregionen och omkring Kashmir. Det är en påfallande
    liten fågel anpassad till höga höjder, där den trivs i de bergiga miljöerna.


    Som många andra lövsångare är berggransångaren en diskret fågel med svåra identifikanskännetecken.
    Det är en välutvecklad migrant som söker upp sina bergiga häckningsplatser under
    värmen för att sedan försvinna under den kallare årstiden. Arten är närmast okänd
    för många fågelskådare utanför sitt begränsade utbredningsområde, men för dem
    som lyckas observera arten i sina naturliga bergsmiljöer erbjuder den en fascinerande
    inblick i högläntas fågelvärld.'
  en: '# Mountain Chiffchaff


    The mountain chiffchaff is a small leaf warbler inhabiting high-altitude regions
    in the Caucasus and Tian Shan mountains. It is an altitudinal migrant, descending
    to lower elevations during winter months. The nominate subspecies resembles the
    Siberian chiffchaff but can be distinguished by its finer, darker bill, browner
    upperparts, and buff-coloured flanks. The darker subspecies lorenzii appears warmer
    and more richly coloured than the nominate race.


    Vocally, the mountain chiffchaff''s song is nearly identical to the common chiffchaff,
    making field identification by song challenging. However, its call is distinctly
    different—a weak "psew" that differs noticeably from related species. The two
    subspecies show subtle vocal differences from each other, suggesting some degree
    of reproductive isolation.


    Despite overlapping with the common chiffchaff in small areas of the Western Caucasus,
    the mountain chiffchaff maintains reproductive isolation, with interbreeding occurring
    rarely if at all. Genetic analysis confirms it is a distinct species, differing
    from similar taxa in vocalisations, external morphology, and DNA sequences.'
