description:
  sv: '# Lövsångare


    Lövsångare är en liten, gröngul lövsångare som tillhör familjen Phylloscopidae.
    Det är en av Europas talrikaste fågelarter, med uppskattningsvis 100 miljoner
    par endast på kontinenten. Arten är en långflyttare som häckar i norra och tempererade
    Europa och Asien under våren och sommaren, medan huvuddelen av beståndet övervintrar
    söder om Sahara.


    Lövsångaren är en diskret och aktiv småfågel som tillbringar mycket tid i träd
    och buskar där det söker efter småinsekter. Det är blygt till temperamentet och
    kan vara svårt att få bra syn på, särskilt när det håller sig högt uppe i lövverket.
    Arten är känd för sitt distinktiva, rullande och melodiöst sång som ofta börjar
    långsamt och sedan accelererar. Dess kallrop är ett mjukt, tvåstavigt "hu-it".


    Även om arten fortfarande är talrik, har beståndet minskat under senare år. Lövsångaren
    föredrar öppen lövskog, parklandskap och områden med riklig vegetation där det
    kan hitta föda och byggbostad.'
  en: '# Willow Warbler


    The willow warbler is a small, delicate leaf warbler found across northern and
    temperate regions from Ireland to eastern Siberia. It is one of Europe''s most
    common warblers, recognizable by its olive-green upperparts and pale underside,
    though it can be difficult to distinguish from the chiffchaff in the field. The
    bird is notably slim and active, constantly moving through foliage as it forages
    for insects.


    This species is celebrated for its pleasant, melodious song—a characteristic descending
    warble that gives the bird its English name. The call is a soft, short "hoo-it"
    sound. The willow warbler''s behaviour is restless and energetic, rarely remaining
    still for long as it hunts among leaves and twigs.


    The species is strongly migratory, undertaking one of the longest journeys of
    any European warbler. It arrives in breeding areas in spring and departs in late
    summer, with the vast majority of the population wintering in sub-Saharan Africa.
    During migration and breeding season, it favours open woodlands, scrubby habitats,
    and areas with scattered trees and shrubs, where its insect prey is abundant.'
migration:
  sv: '# Lövsångare – Förekomst i Skandinavien och Nordeuropa


    Lövsångaren är en långflyttare som häckar utbrett i Skandinavien och övriga Nordeuropa
    under sommaren. Arten anländer från sitt övervintringsområde söder om Sahara på
    våren, typiskt från april och framåt. Under häckningssäsongen är lövsångaren en
    av regionens talrikaste fågelarter, med uppemot miljoner häckande par enbart i
    Europa. På hösten påbörjar arten sin långa migration söderut, och merparten av
    populationen lämnar Nordeuropa för att övervinta i Afrika. Endast enstaka individer
    kan påträffas under vintermånaderna i norra delen av sitt utbredningsområde.'
  en: '# Willow Warbler Migration in Scandinavia


    The Willow Warbler is a summer breeder throughout Scandinavia and Northern Europe,
    arriving from sub-Saharan African wintering grounds in late April through May.
    Peak breeding occurs from June to July across boreal and temperate forests. This
    highly migratory species is almost entirely absent during winter months, with
    the population departing between August and September for their African wintering
    grounds. A few stragglers may linger into October, but regular sightings cease
    by November. Return migration begins in spring, with the first birds reappearing
    in late April, making this species a reliable indicator of the Northern European
    breeding season.'
