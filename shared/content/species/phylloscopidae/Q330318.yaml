description:
  sv: ''
  en: '# Yellow-browed Warbler


    The yellow-browed warbler is a small leaf warbler that breeds across the eastern
    Palearctic region. It is a strongly migratory species, with populations traveling
    vast distances between breeding and wintering grounds. The species winters primarily
    in tropical South Asia and Southeast Asia, though small numbers occasionally reach
    western Europe during migration, making it a rare but notable visitor to some
    regions outside its main range.


    This warbler is characteristic of its family, the Phylloscopidae, and shares the
    typical features of leaf warblers: a diminutive size and an active, restless demeanor
    as it forages among vegetation. The yellow-browed warbler was historically classified
    within the broader Old World warbler assemblage before being reclassified within
    its own distinct family, reflecting modern taxonomic understanding of these Asian
    songbirds.'
migration:
  sv: ''
  en: '# Yellow-browed Warbler (Tajgasångare) in Northern Europe


    The yellow-browed warbler is a highly migratory species that breeds in the eastern
    Palearctic and winters primarily in tropical South Asia and Southeast Asia. In
    Scandinavia and Northern Europe, it occurs as a rare but regular passage migrant,
    particularly during autumn migration. Small numbers occasionally overwinter in
    western Europe, including Scandinavia, though such occurrences are uncommon. Spring
    arrivals are typically recorded from April onwards as birds return to their breeding
    grounds in eastern regions, while autumn passage peaks from August through October
    as populations move southwestward to their winter quarters.'
