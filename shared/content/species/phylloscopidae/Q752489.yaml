description:
  sv: '# Bergsångare


    Bergsångare är en mycket liten fågel som tillhör familjen lövsångare. Det är en
    svåridentifierad art med diskret utseende i gråbrunt och gulgrönt. Fågeln är aktiv
    och rörlig, ofta skuggan i träd och buskar där det gärna söker föda bland bladen.


    Arten häckar i sydvästra Europa, från Portugal till Italien, samt i nordvästra
    Afrika. Under vintern flyttar bergsångaren långt söderut till tropiska Västafrika.
    Norr om sitt normala utbredningsområde är det mycket sällsynt, med endast ett
    tjugotal säkra observationer dokumenterade under många år.


    Bergsångaren klassificeras som livskraftig och står inte på någon röd lista. Det
    är en art för den erfarne fågelbeskådare som behärskar identifikationen av lövsångare,
    då den lätt kan förväxlas med närbesläktade arter inom sin familj.'
  en: ''
migration:
  sv: '# Bergsångare i Skandinavien och Nordeuropa


    Bergsångare är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten häckar
    normalt i sydvästra Europa, från Portugal till Italien, och förekommer endast
    sporadiskt norr om sitt huvudsakliga utbredningsområde. I Sverige har arten registrerats
    vid ungefär 13 säkra observationstillfällen. Under vintern migrerar bergsångaren
    till tropiska Västafrika för att överninta. De observationer som görs i nordligare
    regioner representerar således vagabunderande individer eller möjliga överflyttningar
    från huvudpopulationen under migrationstiden.'
  en: ''
