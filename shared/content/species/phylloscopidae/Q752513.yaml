description:
  sv: '# Kungsfågelsångare


    Kungsfågelsångaren är en mycket liten insektsätande lövsångare med vida utbredningsområden.
    Den häckar i sydöstra Sibirien och genomför långa migrationsvagnar till sydöstra
    Asien för att övervintra. Trots det stora avståndet dyker arten regelbundet upp
    i Europa, särskilt under höstflyttningen, och påträffas årligen i Sverige där
    mellan 20 och 70 fynd registreras varje år.


    Arten är klassificerad som livskraftig av IUCN och förefaller därmed att klara
    sig väl populationsmässigt trots sina långa flyttningsvägar.'
  en: ''
migration:
  sv: '**Kungsfågelsångare i Skandinavien/Nordeuropa**


    Kungsfågelsångare är en regelbunden höstgäst i Sverige och övriga Nordeuropa,
    trots att arten häckar långt bort i sydöstra Sibirien. Under höstflyttningen i
    augusti–oktober påträffas den årligen i Sverige, vanligtvis med mellan 20 och
    70 observationer per år. Arten övervintar i sydöstra Asien (sydöstra Kina och
    Vietnam) och återvänder till häckningsområdena under våren. Kungsfågelsångaren
    är således främst känd som en genomflyttande höstgäst i Skandinavien och Nordeuropa,
    då den regelbundet observeras under sin södergående migration.'
  en: ''
