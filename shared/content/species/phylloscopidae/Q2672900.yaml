description:
  sv: '# Kaukasisk lundsångare


    Kaukasisk lundsångare är en liten lövsångare som häckar i bergstrakter från Kaukasus
    österut genom norra Iran och Centralasien till Afghanistan. Under vintern är arten
    migrerad och återfinns huvudsakligen i Indien. Det är en mycket sällsynt gäst
    i Europa och endast ett fynd är känt från Sverige (Öland 2003).


    Arten behandlades tidigare som underart till lundsångare men har nu egen artstatus.
    Arten klassificeras av IUCN som livskraftig. För den intresserade fågelskådaren
    är arten praktiskt taget omöjlig att möta utanför sitt naturliga utbredningsområde
    i södra och västra Asien.'
  en: '# Green Warbler


    The Green Warbler is a small leaf warbler belonging to the Phylloscopidae family.
    It is found in the Caucasus Mountains in southeastern Europe, where it inhabits
    forested regions.


    This species is characterized by its greenish plumage, which helps it blend seamlessly
    with vegetation. Like other leaf warblers, it is an active forager, gleaning insects
    from foliage as it moves through trees and shrubs. Its behavior is typical of
    the genus—restless and acrobatic, often seen hanging from branches while searching
    for food.


    The Green Warbler''s call and song are distinctive features useful for identification.
    As with many warblers in this family, vocalizations are important for locating
    the species in dense woodland habitat where visual identification can be challenging.
    Observers should listen carefully for its characteristic sounds while watching
    for the bird''s characteristic leaf-gleaning behavior among trees and bushes in
    its montane range.'
migration:
  sv: '# Kaukasisk lundsångare – Förekomst i Skandinavien


    Kaukasisk lundsångare är en ytterst sällsynt gäst i Skandinavien och övriga Europa.
    Arten häckar i Kaukasus, norra Turkiet, norra Iran, Uzbekistan och Afghanistan.
    Under vintern flyttar den huvudsakligen till Indien. I Sverige är arten endast
    dokumenterad genom ett enda fynd på Öland år 2003, vilket understriker hur mycket
    en vagabund denna asiatiska lövsångare är långt västerut. Arten förekommer normalt
    inte i nordeuropeiska regioner under någon årstid.'
