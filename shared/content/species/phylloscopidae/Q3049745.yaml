description:
  sv: '# Grönvingad sångare


    Grönvingad sångare är en lövsångare som främst förekommer i östra Afrika, med
    utbredning även till sydvästra delen av Arabiska halvön. Arten är hemmastadd i
    bergsskogar där den lever bland trädens lövverk.


    Fågeln är en mindre sångare med karakteristiska gröna vingar som ger arten sitt
    namn. Den är anpassad för ett liv högt upp i träden, där den söker föda bland
    löven och grenarna. Som många lövsångare är den en aktiv och livlig fågel som
    rör sig snabbt genom vegetationen.


    Beståndet av grönvingad sångare har visat en nedåtgående trend, men arten anses
    fortfarande ha ett livskraftigt bestånd. Den är därmed inte klassificerad som
    hotad, trots minskningen i antal. Arten är huvudsakligen knuten till höglänta
    bergsmiljöer där lämpliga skogstyper finns.'
  en: ''
