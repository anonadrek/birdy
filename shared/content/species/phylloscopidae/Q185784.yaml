description:
  sv: '# Gransångare


    Gransångare är en mycket liten lövsångare med diskret olivbrun och gulgråaktig
    färgteckning. Det är en obetydlig fågel både till utseende och storlek, vilket
    kan göra den svår att identifiera i fält. Näbben är smal och spetsig, väl anpassad
    för att plocka små insekter från löv och grenar.


    Arten är aktiv och rörig, ständigt i rörelse medan det söker föda bland trädkronorna.
    Gransångaren är en migrativ art som återvänder till häckningsområdena relativt
    tidigt på våren. Det karakteristiska lätet är ett enkelt "chiff-chaff, chiff-chaff"
    – ett monotont återkommer tvåstavigt läte som arten är döpt efter.


    Gransångaren häckar i öppen skogsmark och lövskogar över större delen av Europa,
    samt i delar av Asien. Det är mycket vanligt förekommande inom sitt utbredningsområde.
    Under vinterhalvåret migrar det till södra och västra Europa, södra Asien och
    norra Afrika för att söka föda på varmare platser.'
  en: '# Common Chiffchaff


    The common chiffchaff is a small leaf warbler found across northern and temperate
    woodlands throughout Europe and the Palearctic region. It is a relatively common
    and widespread species, favoring open woodland habitats where it hunts actively
    among foliage.


    This diminutive warbler is best identified by its repetitive and distinctive call,
    which gives the species its common name—a clear "chiff-chaff" or "chiff-chaff-chiff"
    pattern that is easy to recognize once learned. The call is diagnostic and often
    the best way to locate it in the field.


    In appearance, the chiffchaff is a small, drab warbler with olive-brown upperparts
    and pale underparts, making it somewhat challenging to distinguish from similar
    species without hearing its voice. It is an active forager, constantly moving
    through low vegetation and picking insects from leaves. The species breeds in
    open woodlands and is migratory in much of its range, though some populations
    winter in temperate areas, making it sometimes visible year-round depending on
    location.'
migration:
  sv: '# Gransångare - Säsongsförekomst i Skandinavien och Nordeuropa


    Gransångaren är en flyttfågel som återkommer till Skandinavien och Nordeuropa
    för att häcka under våren och sommaren. Arten ankommer vanligtvis från sina övervintringsområden
    i södra och västra Europa, södra Asien och norra Afrika under april-maj. Den häckar
    i öppen skogsmark i större delen av Europa och stannar under häckningsperioden.


    I höst påbörjar gransångarna sin återvandring söderut från augusti-september för
    att övervintra i sina sydligare hemområden. Under vintermånaderna är arten frånvarande
    från de nordliga delarna av sitt utbredningsområde, men återkommer konsekvent
    år efter år för att reproducera sig i samma häckningsmiljöer.'
  en: '# Common Chiffchaff in Scandinavia/Northern Europe


    The Common Chiffchaff is a migratory warbler with populations in Scandinavia showing
    typical spring and autumn movements. Birds arrive in northern Europe from late
    March to April, establishing territories in woodlands and scrubland. They breed
    throughout the region during summer months before departing in August and September
    for their wintering grounds in southern Europe, the Mediterranean, and North Africa.
    Some individuals may occasionally overwinter in milder western areas, though this
    remains uncommon. The species is typically absent from Scandinavia during winter
    months, with breeding birds representing the summer population.'
