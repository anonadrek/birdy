description:
  sv: '# Myrspov


    Myrspov är en karakteristisk vadarfågel med långt, svagt uppåtböjt näbb och höga
    ben. Under häckningstid bär arten rostfärgad fjäderdräkt på huvud, hals och bröst,
    medan undersidan är gulvit. På hösten blir färgerna mattare och gråare. Fågeln
    är cirka 37-41 cm lång.


    Arten häckar på tundran i norra Eurasien och nordvästra Alaska, där den föredrar
    öppna, fuktiga miljöer. Myrspov är känd för att genomföra några av djurrikets
    längsta icke-avbrutna flygningar mellan häckningsplatser och vinterkvarter – en
    prestation som är unik bland de flesta fågelarter.


    Under födosöket stickar myrspoven sitt långa näbb i märg och djupt i marken för
    att leta efter maskar och andra evertebrater. På rastplatser hittar man den ofta
    i flock tillsammans med andra vadarfåglar. Arten har minskat kraftigt i antal,
    särskilt i den östra delen av sitt utbredningsområde, och klassificeras av IUCN
    som globalt nära hotad.'
  en: '# Bar-tailed Godwit


    The bar-tailed godwit is a striking large wader with a distinctive long, slightly
    upturned bill and long legs built for wading. During breeding season, it displays
    rich red plumage, making it unmistakable in its Arctic habitat. In non-breeding
    plumage, it appears more subdued with greyish-brown tones. It feeds on bristle-worms
    and shellfish, probing coastal mudflats and estuaries methodically.


    This species is renowned for its extraordinary migratory behaviour. Populations
    breed across Arctic coasts and tundra from Scandinavia eastward to Alaska. After
    breeding, they undertake one of nature''s most remarkable journeys, with some
    populations flying non-stop across the Pacific Ocean to overwinter in temperate
    and tropical coastal regions of Australia and New Zealand. The Pacific population''s
    migration is the longest known non-stop flight of any bird, covering vast distances
    without pausing to feed—a testament to remarkable physiological adaptation.


    The bar-tailed godwit is typically observed on coastal mudflats and estuaries,
    particularly during migration periods and winter. Its presence at these wetland
    habitats makes it a rewarding sighting for wader enthusiasts, though its time
    in any given location is often brief given its migratory nature.'
migration:
  sv: '# Myrspov – Förekomst i Skandinavien/Nordeuropa


    Myrspov är en långdistansflyttare som häckar på fjälltundran i norra Skandinavien
    och Ryssland under sommaren. Arten anländer till häckningsområdena i maj-juni
    efter sin återfärd från vinterkvarten. Under hösten, från juli-september, påbörjar
    fåglarna sin migration southåt mot mediterrana och afrikanska vinterkvarter, där
    de stannar under vintermånaderna. Arten ses därför endast i Skandinavien under
    häckningssäsongen och under korta passager under flyttningstiderna, särskilt under
    hösten då de passerar igenom på väg söderut.'
  en: '# Bar-tailed Godwit (Limosa lapponica) in Scandinavia


    The bar-tailed godwit is a highly migratory Arctic breeder that occurs in Scandinavia
    during the breeding season, nesting on coastal tundra and Arctic regions. Birds
    arrive in spring to breed, then depart in late summer and autumn for their wintering
    grounds in temperate and tropical coastal regions. Scandinavian populations undertake
    remarkable long-distance migrations, with some individuals traveling thousands
    of kilometers to reach wintering areas. The species is present in northern Scandinavia
    from late spring through mid-autumn, with arrival typically occurring in May and
    departure in August-September.'
