description:
  sv: '# Fläckdrillsnäppa


    Fläckdrillsnäppa är Nordamerikas vanligaste vadare och är systerart till den europeiska
    drillsnäppan. Det är en liten snäppa som kännetecknas av sina karakteristiska
    gungande kroppsrörelser när det förflyttar sig på marken. Under häckningssäsongen
    bär den tydliga bruna fläckar på undersidan, vilket är ursprunget till dess namn.


    Arten känns igen på sin stela, snabb flykt tätt ovanför vattenytan – ett beteende
    den delar med drillsnäppan. Det är mycket aktiv och nervös till sitt väsen, ständigt
    i rörelse när det jagar efter små insekter, kräftdjur och andra små djur längs
    stränder och gräsbevuxna partier vid vatten.


    Fläckdrillsnäppa är en sällsynt gäst i Europa, även i Sverige. Den förekommer
    främst under höstens flyttning. IUCN klassificerar arten som livskraftig globalt.
    För den intresserade fågelskådaren är det en exotisk raritet värd att leta efter
    under senare sommaren och hösten vid lämplig livsmiljö.'
  en: '# Spotted Sandpiper


    The spotted sandpiper is a small shorebird belonging to the sandpiper family.
    It shares the genus *Actitis* with the common sandpiper, and the two species have
    largely replaced each other geographically across their respective ranges. Interestingly,
    when spotted sandpipers occasionally stray beyond their normal territory, they
    may settle among common sandpiper populations and produce hybrids between the
    two species.


    This species is characterized by its compact size and spotted plumage, which gives
    it its distinctive name. Spotted sandpipers are typically found near freshwater
    habitats such as streams, rivers, lake margins, and pond edges, where they forage
    along shorelines. They are active, restless birds often seen bobbing their tails
    as they move about. Their call is a sharp, distinctive whistle.


    The species breeds across much of North America, with populations migrating to
    wintering grounds in Central and South America. During breeding season, spotted
    sandpipers exhibit unusual breeding behavior where females may mate with multiple
    males, leaving each to incubate a clutch of eggs—a reversal of typical bird sex
    roles.'
