description:
  sv: '# Sandlöpare


    Sandlöpare är en liten snäppa som häckar cirkumpolärt i Arktis. Under större delen
    av året är den en rastlös migrant som passerar genom stora delar av Europa och
    Nordamerika på vägen mellan sina häckningsområden och övervintringsplatser i Afrika,
    Sydamerika och Australien.


    Under flyttningen ses sandlöparen ofta på stränderna där den snabbt springer fram
    och letar efter föda i vattenkanten. Det är en liten och gråvit fågel med karakteristiska
    snabba rörelser. Arten är välanpassad för ett liv på både arktiska tundror och
    kustzonen, och den är en av världens längsta migranters med sina långa flyttvägar
    över flera kontinenter.'
  en: '# Sanderling


    The sanderling is a tiny, pale wading bird notable for its extreme Arctic breeding
    range, nesting on the coldest tundra north of the 5°C July isotherm. It is among
    the world''s most northerly breeding birds, with only a handful of pairs breeding
    at its southernmost European locality. Despite this remote breeding habitat, it
    is an extraordinary long-distance migrant, with populations wintering across South
    America, southern and western Europe, Africa, and Australia.


    In winter, the sanderling is highly gregarious, often forming large flocks on
    coastal mudflats and sandy beaches. Its pale plumage and small size make it distinctive
    in these coastal settings, where it typically feeds in energetic, fast-moving
    groups. The species'' remarkable migratory journey—connecting Arctic breeding
    grounds with distant wintering sites—represents one of the most impressive feats
    of endurance among wading birds.'
migration:
  sv: '# Sandlöpare i Skandinavien


    Sandlöparen är en långdistansflyttare som passerar genom Skandinavien och Nordeuropa
    under sina två årliga migrationsvandringr. Arten häckar i Arktis men övervintrar
    på fjärran håll i Afrika, Sydamerika och Australien. Under våren och hösten ses
    sandlöpare regelbundet på nordeuropeiska kuster och strandar när fåglar migrerar
    mellan sina häcknings- och övervintringsområden. Arten är således inte stadbo
    i regionen utan förekommer främst under genomflyttningsperioderna under april-maj
    och juli-september.'
  en: '# Sanderling (Calidris alba) in Scandinavia/Northern Europe


    The sanderling is an extreme Arctic breeder with only a handful of pairs nesting
    in Svalbard, Europe''s northernmost breeding locality. As a long-distance migrant,
    it arrives in northern Scandinavia during late spring (May-June) for the brief
    breeding season on the coldest tundra. Following breeding, populations undertake
    extensive southward migrations beginning in July-August, wintering across southern
    Europe, Africa, and beyond. During migration and winter, sanderlings are highly
    gregarious, congregating in large flocks on coastal mudflats and sandy beaches
    throughout Scandinavia and southern Europe before departing for distant wintering
    grounds in warmer regions.'
