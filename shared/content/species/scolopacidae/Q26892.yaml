description:
  sv: '# Roskarl


    Roskarl är en liten vadare med karakteristisk mosaikartad fjäderdräkt i rött-brunt,
    svart och vitt. Under häckningstiden är den särskilt färgrik med kontrastrik teckning
    på huvud och bröst. Det är en mycket aktiv fågel som ofta ses vända på stenar
    och skräp längs strandlinjen för att leta efter föda – en beteende som gett den
    sitt namn. Roskarlens kort och kraftig näbb är väl anpassad för denna sökstrategi.


    Arten förekommer huvudsakligen i Arktis och norra Europa under häckningstiden.
    Under flyttning och vinter är den mycket spridd och kan påträffas vid nästan alla
    kuster världen över. Den föredrar steniga och sandig strandmiljöer. Roskarlens
    läte är ett distinkt, klickande "kut-a-dit" som ofta hörs från fåglar i flock.


    Populationen minskar oroande och arten är klassificerad som nära hotad globalt.
    I Sverige är situationen ännu allvarligare, där arten numera är starkt hotad och
    endast återstår i mycket reducerad antal.'
  en: ''
migration:
  sv: '# Roskarl i Skandinavien och Nordeuropa


    Roskarl är en flyttfågel som häckar i Arktis och norra Europa. Under våren anländer
    fågeln till sina häckningsområden, medan den under hösten drar söderut för att
    övervinta vid kusterna. Under flyttningsperioderna kan roskarl observeras vid
    nästan alla kuster i världen, inklusive Skandinaviens och Nordeuropas strandlinjer.
    I Sverige är arten mer eller mindre genomflyttande och ses främst vid kusterna
    under våren och hösten, då den passerar på väg mellan sina arktiska häckningsplatser
    och övervintringsområden vid mer sydliga kuster.'
  en: ''
