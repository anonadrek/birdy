description:
  sv: '# Grönbena


    Grönbena är en liten vadarfågel som tillhör familjen snäppor. Den är en utpräglad
    flyttfågel som häckar från norra Europa till östra Asien och övervintrar i Afrika
    och södra Asien samt Australien. Under flyttningen uppträder den ofta i mindre
    flockar vid våtmarker och kustområden, där den är en karakteristisk syn under
    våren och hösten.


    Arten är välanpassad för sitt livssätt som en långdistansflyttare och hittas ofta
    på fuktiga lador och vid vattendrag under rastpausen under migrationen. Grönbena
    är en alert och rörig fågel som ofta ses hoppa mellan stenar eller vada på grunt
    vatten medan den söker föda.'
  en: '# Wood Sandpiper


    The wood sandpiper is a small wader and the tiniest member of the shank genus.
    It belongs to the sandpiper family and is found across Eurasia. Unlike many related
    species that favour coastal habitats, the wood sandpiper shows a distinct preference
    for freshwater and wetland environments, making it more of an inland bird than
    its maritime cousins.


    As a small, long-legged wader, it shares the characteristic proportions of shanks—notably
    elongated legs suited for wading through shallow water. It typically frequents
    marshes, lake margins, and other freshwater wetlands where it can probe soft substrates
    for invertebrate prey. The species is often seen in loose flocks, particularly
    during migration periods, when it may visit temporary pools and flooded fields.


    The wood sandpiper''s call is a distinctive, sharp, three-note whistle that helps
    identify it even at a distance. In flight, it displays pale wing bars and a white
    rump patch, features that distinguish it from similar small waders.'
migration:
  sv: '# Grönbena – Förekomst i Skandinavien/Nordeuropa


    Grönbena är en utpräglad flyttfågel som återkommer till Skandinavien och Nordeuropa
    för häckning under våren. Arten anländer vanligen i maj och häckar från norra
    delen av regionen. Under hösten påbörjar fågeln sin långa flyttning mot övervintringplatserna
    i södra Afrika, södra och sydöstra Asien samt Australien. Under migrations­perioderna,
    både våren och hösten, uppträder grönbena ofta i mindre flockar vid våtmarker
    och kustområden, där den rastar innan fortsatt färd.'
  en: '# Wood Sandpiper Migration in Scandinavia


    The Wood Sandpiper is a migratory species in Northern Europe, arriving in Scandinavia
    during spring migration (typically May) to breed in wetland habitats. It is a
    summer visitor, breeding across northern and central Scandinavia in boreal regions.
    The species vacates Scandinavian breeding grounds in late summer and autumn (August-September),
    undertaking long-distance migration southward to winter in Africa and southern
    Eurasia. Wood Sandpipers do not overwinter in Scandinavia or Northern Europe.
    During passage periods, they may be encountered at wetland sites across the region
    as they move between breeding and wintering grounds.'
