description:
  sv: '# Mosnäppa


    Mosnäppa är en mycket liten vadarfågel som tillhör familjen snäppor. Den är betydligt
    mindre än de flesta andra vadare och har ett kompakt, diskret utseende. Fågeln
    karakteriseras av sin lilla storlek och nedåtböjda näbb, vilket gör den lätt att
    skilja från närbesläktade arter.


    Till skillnad från många andra Calidris-vadare ses mosnäppa sällan i större flockar.
    Den rastar ofta ensam eller i små grupper i våtmarker i inlandet, snarare än på
    öppna strandpartier. Detta beteende gör den mindre framträdande än många andra
    vadarfåglar.


    Arten häckar från norra Europa och österut genom norra Asien. Under vintermånaderna
    flyttar den till tropiska Afrika och södra Asien. Dess globala bestånd anses vara
    livskraftigt. För att få syn på mosnäppa krävs ofta tålamod och uppmärksamhet
    på lämpliga rastplatser, då den lätt kan överses på grund av sin diskreta natur.'
  en: ''
migration:
  sv: '# Mosnäppa (Temminck''s Stint) – Förekomst i Skandinavien


    Mosnäppa är en flyttfågel som häckar i norra Europa och återvänder efter häckningstiden.
    Arten migrerare långväga söderut till tropiska Afrika och södra Asien för att
    övervintra, vilket innebär att den är helt frånvarande från Skandinavien under
    vintermånaderna. Under våren återkommer fågeln för att häcka i sitt nordeuropeiska
    utbredningsområde. Till skillnad från många andra vadare förekommer mosnäppa sällan
    i större flockar, utan rastar istället oftare i mindre grupper i våtmarker i inlandet
    under genom- och utflyttningsperioderna.'
  en: ''
