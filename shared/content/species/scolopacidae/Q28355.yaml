description:
  sv: '# Dammsnäppa


    Dammsnäppa är en ganska liten vadare som liknar sina närmaste släktingar grönbenan
    och rödbenan. Fågeln är särskilt karakteristisk för sitt långsmala utseende med
    tunna, långa ben och en spetsig, rät näbb. Under häckningsperioden förekommer
    den i öppna våtmarker på flack terräng, framför allt i tajga och på stäpp från
    östligaste Europa till Centralasien.


    Under flyttningen är dammsnäppa relativt vanlig västerut genom Europa och påträffas
    regelbundet i bland annat Sverige. Arten trivs i grunt vatten och på fuktiga marker
    där den födosöker genom att picka vid vattenytan. Dammsnäppa är en ganska tystlåten
    fågel jämfört med många andra vadare.


    Populationen minskar gradvis, men arten anses trots detta vara livskraftig globalt.
    I Sverige har arten etablerat sig som häckfågel vid flera tillfällen, vilket visar
    på artens förmåga att kolonisera nya områden under lämpliga förhållanden.'
  en: '# Marsh Sandpiper


    The marsh sandpiper is a small wader belonging to the shank family, notably slender
    and delicate in build. It favors open grassy steppe and taiga wetlands, breeding
    across a vast range from easternmost Europe eastward to the Russian Far East.
    During migration and winter, it disperses to wetland habitats across Africa, Asia,
    and Australasia.


    This species is distinguished by its fine, straight bill and relatively long,
    greenish legs—features typical of shanks adapted for probing shallow water and
    wet ground. Its plumage is predominantly pale grey-brown above with white underparts,
    and it shares the characteristic white rump visible in flight that the ancient
    Greeks noted in their descriptions of wading birds.


    Marsh sandpipers are generally quiet birds, though they produce sharp, distinctive
    calls when alarmed or in flight. They are typically seen singly or in small groups,
    often wading in shallow marshes, pools, and muddy margins where they feed on small
    invertebrates. Occasionally, they associate with other shank species during migration
    and wintering periods.'
migration:
  sv: '# Dammsnäppa – förekomst i Norden


    Dammsnäppa är en östeuropeisk och centralasiatisk art som under flyttningen regelbundet
    påträffas i västra Europa, inklusive Sverige. Arten häckar på våtmarker i tajga
    och stäpp från östligaste Europa till Centralasien, men har också dokumenterat
    häckat vid flera tillfällen i Sverige. Under våren och hösten ses fågeln därför
    regelbundet under sina migrationströvor genom våra nordiska områden när den förflyttar
    sig mellan sina östliga häckningsplatser och övervintringsområden i södra Afrika
    och södra Asien.'
  en: '# Marsh Sandpiper in Scandinavia/Northern Europe


    The Marsh Sandpiper is a rare vagrant to Scandinavia and Northern Europe, with
    no established breeding population in the region. This small wader primarily breeds
    in eastern European and Asian wetlands, far from regular Scandinavian range. Occasional
    sightings occur during migration periods, particularly in late spring (May) and
    autumn (August-September), when birds dispersing from eastern breeding grounds
    may appear as vagrants in northern European wetlands and coastal areas. Most records
    are sporadic and unpredictable, making this species an uncommon but noteworthy
    find for birdwatchers in the region.'
