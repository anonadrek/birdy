description:
  sv: '# Dvärgbeckasin


    Dvärgbeckasin är en liten medlem av snäppfamiljen och är betydligt mindre än sina
    närmare släktingar enkelbeckasin och dubbelbeckasin. Trots det yttre likheter
    med dessa arter utgör den sitt eget släkte och är genetiskt närmare släkt med
    morkullor. Fågeln häckar på myrar i norra regioner och sprider sig österut till
    östra Ryssland. Under vintermånaderna är den en långflyttare som söker sig till
    sydligare områden från södra Europa till Sydostasien, med populationer även i
    Centralafrika.


    Arten är klassificerad som livskraftig enligt IUCN och tycks kunna hålla sina
    populationer stabil. För den som vill observera denna lilla snäppfågel krävs ofta
    tålamod och ett intresse för våtmarksmiljöer där den vistas under häckningssäsongen.'
  en: '# Jack Snipe


    The jack snipe is the smallest member of the snipe family, instantly recognizable
    by its compact, stocky build. It is the sole species in its genus, Lymnocryptes,
    and possesses distinctive anatomical features that set it apart from other snipes
    and woodcocks, including a characteristic sternum structure.


    One of the jack snipe''s most notable behaviours is its continuous bobbing motion,
    moving up and down in a rhythmic pattern that is quite different from other waders.
    This distinctive habit, combined with its diminutive size, makes it relatively
    easy to identify in the field once observed.


    The jack snipe inhabits wet, marshy habitats where it feeds on invertebrates in
    soft ground. It is generally a secretive bird, often remaining concealed among
    vegetation, though its characteristic bobbing action can betray its presence to
    attentive observers.'
migration:
  sv: '# Dvärgbeckasin – Förekomst i Skandinavien


    Dvärgbeckasinen häckar på myrar i norra Skandinavien under sommarmånaderna. Det
    är en migrationsart som flyttar söderut på hösten för att övervintra. Huvudsakliga
    övervintringsområden ligger i södra Europa, Centralafrika och Sydostasien. Under
    våren återvänder arten till sina häckningsområden i nordiska myrkomplex. Dvärgbeckasinen
    är en ganska dold fågel som ofta förbises, men under dragperioderna kan individer
    observeras på fuktigare lokaler under genomflyttningen mellan nord och syd.'
  en: '# Jack Snipe Migration in Northern Europe


    The jack snipe is a migratory wader with a complex distribution pattern across
    Scandinavia and Northern Europe. During winter months, small numbers overwinter
    in southern Scandinavia and coastal areas, though the species is primarily absent
    from the region during the coldest periods. Spring arrival occurs from March onwards
    as birds return from wintering grounds in southern Europe and North Africa to
    breed in northern wetlands. The breeding season extends through summer, with birds
    occupying boggy habitats across northern latitudes. Autumn migration begins in
    August and September, with most populations departing for wintering areas by October,
    making the jack snipe a typical passage migrant through much of the region rather
    than a permanent resident.'
