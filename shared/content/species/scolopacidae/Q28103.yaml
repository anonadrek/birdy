description:
  sv: '# Svartsnäppa


    Svartsnäppa är en elegant vadarfågel som genomgår en spektakulär dräktförändring
    mellan årstiderna. Under häckningstiden bär den en helsvart fjäderdräkt, vilket
    gav arten sitt namn. I vinterdräkt blir utseendet helt annorlunda – då är den
    gråvit färgad med iögonfallande röda ben och näbb. Detta gör den lätt att identifiera
    när den inte är i häckningstolk.


    Arten häckar i nordligaste Europa och norra Asien, främst i myrmarker och sumpskogar.
    Som flyttfågel åker den långt söderut på vintern och hittas då vid kustnära miljöer
    runt Medelhavet, i södra Asien och ibland även i tropiska Afrika. I Sverige är
    svartsnäppa en genomflyttare på våren och hösten, men beståndet minskar oroande.


    Vid förflyttningen ses den ofta i små flockar vid strandsöm och grund vatten,
    där den söker föda genom att peck eller stöka i bottnen. Även om arten globalt
    bedöms ha ett livskraftigt bestånd, är det svenska antalet minskande och arten
    är klassificerad som nära hotad.'
  en: '# Spotted Redshank


    The spotted redshank is a medium-sized wader belonging to the Scolopacidae family.
    During breeding season, it develops distinctive dark plumage with white spotting,
    while in winter it becomes noticeably paler and greyer. The bird has long reddish
    legs and a long, slightly downcurved bill, features that aid identification in
    the field.


    This species breeds across northern Scandinavia and the northern Palearctic regions,
    favouring wetland habitats. It is a long-distance migrant, departing breeding
    grounds in autumn to winter in the Mediterranean, southern British Isles, France,
    tropical Africa, and tropical Asia. The bird occasionally appears as a vagrant
    to Australia and North America.


    When feeding, the spotted redshank often wades in shallow water, sometimes immersing
    itself deeply while probing for invertebrates. It is generally more active and
    vocal than many other redshank species. The bird can be encountered on coastal
    mudflats, estuaries, and inland wetlands during migration and winter periods,
    often in small flocks or mixed groups with other wader species.'
migration:
  sv: '# Svartsnäppa i Norden


    Svartsnäppan är en flyttfågel som häckar i nordligaste Europa och norra Asien.
    Under häckningstiden är den helsvart, medan den i vinterdräkten är gråvit med
    röda ben. För att undvika de hårda nordiska vintrar migrera svartsnäppan söderut,
    där den övervintra i Medelhavsområdet och södra Asien, ibland även i tropiska
    Afrika. Arten återkommer till sina häckningsrevir under våren för att reproducera
    sig i de nordligaste delarna av Europa.'
  en: '# Spotted Redshank Migration in Northern Europe


    The Spotted Redshank breeds across northern Scandinavia and the northern Palearctic
    during the breeding season. This wader species is a long-distance migrant, departing
    breeding grounds in late summer and autumn to winter in warmer regions including
    the Mediterranean, southern British Isles, France, tropical Africa, and tropical
    Asia. Birds return to Scandinavian breeding areas in spring to complete their
    annual cycle. The species is occasionally recorded as a vagrant in Australia and
    North America, indicating occasional long-distance dispersal events beyond their
    typical migration routes.'
