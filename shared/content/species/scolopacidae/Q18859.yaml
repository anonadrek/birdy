description:
  sv: '# Rödbena


    Rödbena är en medelstor vadarfågel som kännetecknas av sina karakteristiska röda
    ben och röda näbbrot, vilket gör den lätt att identifiera. Det har en relativt
    långsmal näbb, grågott fjäderdräkt och betydligt ljusare undersida. Under flykten
    är vitfläckar på vingarna mycket iögonfallande.


    Arten förekommer i stora delar av Europa och Asien, norr om Himalaya och österut
    till Kina. I västra delen av sitt utbredningsområde är många populationer stannfåglar
    eller kortflyttare, medan övriga flyttar till Mellanöstern, Indien, Sydostasien
    och Afrikas kuster för att övervintra.


    Rödbena är mycket vokal och har ett karakteristiskt ljud som kan beskrivas som
    ett högt, klargörande tjut. Det hittas främst i strandängar både längs kusten
    och i våtmarker inåt landet, men även i fjällmiljöer. Det är en talrik art som
    förekommer i olika våtmarkhabitat där det kan ses födosöka i grund vatten eller
    på blöt mark.'
  en: ''
migration:
  sv: '# Rödbena – Förekomst i Skandinavien och Nordeuropa


    Rödbena är en vanlig vadarfågel i Skandinavien och Nordeuropa med variabel flyttbeteende.
    De flesta populationer är flyttfåglar som återvänder till häckningsområdena under
    april-maj och avgår på hösten i augusti-september. Fåglarna övervintrar huvudsakligen
    i Mellanöstern, Sydeuropa och längs Afrikas kuster. En mindre del av populationen,
    särskilt i Västeuropa, stannar året runt eller genomför endast kortare förflyttningar.
    Arten förekommer i strandängar, våtmarker och fjällmiljöer under häckningstiden.'
  en: ''
