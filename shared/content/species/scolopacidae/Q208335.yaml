description:
  sv: ''
  en: '# Red Phalarope


    The red phalarope is a small wader that breeds throughout Arctic regions across
    both North America and Eurasia. It is highly migratory, following an unusual strategy
    for waders by undertaking long oceanic journeys rather than hugging coastlines.
    It winters at sea in tropical ocean waters, spending much of its life away from
    land.


    This phalarope is distinctive among waders for its maritime habits. Unlike most
    relatives that favour shallow coastal waters or inland wetlands, it is adapted
    to pelagic life, swimming buoyantly on open ocean. Its small size, combined with
    its distinctive plumage patterns that change seasonally between breeding and non-breeding
    seasons, makes it identifiable even at sea.


    The red phalarope''s reliance on oceanic migration routes and offshore wintering
    grounds sets it apart from other wader species. Birdwatchers may encounter it
    during migration periods when it occasionally appears on inland waters or coastlines,
    though its natural habitat remains the open ocean where it feeds in loose flocks
    throughout much of the year.'
migration:
  sv: ''
  en: '# Red Phalarope Migration in Northern Europe


    The Red Phalarope is a rare but regular passage migrant through Scandinavian waters,
    primarily during spring and autumn migration periods. This species breeds in Arctic
    regions and migrates predominantly along oceanic routes rather than inland flyways,
    making it difficult to observe from land. In northern Europe, Red Phalaropes may
    be encountered during May and August-September as they travel between Arctic breeding
    grounds and tropical ocean wintering grounds. They are most likely to be seen
    from coastal areas or during stormy weather when birds are blown inland from their
    marine migration routes. Very few individuals overwinter in northern waters, as
    this species winters exclusively at sea in tropical oceans, making it essentially
    absent from Scandinavian regions during winter months.'
