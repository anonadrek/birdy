description:
  sv: '# Skogssnäppa


    Skogssnäppa är en liten vadarfågel som tillhör familjen snäppor. Den är en elegant
    vadare med mörk överside och vitaktig underside. Fågeln kännetecknas av sitt karakteristiska
    utseende med vita ögonring och en distinkt vit stjärt med mörka tvärband, vilket
    är särskilt tydligt under flykt.


    Arten häckar i våtmarker inom barrskogsområden i norra Europa och Asien, där den
    föredrar fuktig mark nära skogar. Under vintern är skogssnäppan en långdistansflyktare
    som drar söderut till södra Europa, södra Asien och tropiska Afrika. Under flyttningen
    kan den ses på rastplatser vid våtmarker och bäckar.


    Skogssnäppan är en talrik art med stabila bestånd globalt. Den är en skicklig
    och snabb flugare med karakteristiska vingslag och kan höras framför allt under
    häckningstiden med sitt tjattrande läte.'
  en: ''
migration:
  sv: Skogssnäppa är en migrerande vadarfågel som häckar i våtmarkerna i barrskogsområdena
    i norra Europa och Asien under sommaren. Arten är en långdistansflytt som övervintrarar
    långt söderut. Under hösten lämnar fåglarna sina häckningsområden för att dra
    till södra Europa, västra Asien och tropiska Afrika där de stannar under vintermånaderna.
    På våren återvänder skogssnäpporna till sina nordiska häckningsområden. Beståndet
    är talrikt och anses stabilt.
  en: ''
