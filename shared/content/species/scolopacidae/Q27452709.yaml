description:
  sv: '# Prärielöpare


    Prärielöparen är en liten vadare som tillhör familjen snäppor. Arten är markant
    mindre än många andra vadare och kännetecknas av sitt gräs- och bufféfärgade dräkt
    med undertoner av rostfärg på bröstet. Kroppen är kompakt och benen relativt långa
    för storleken.


    Arten häckar lokalt i nordöstra Ryssland och nordligaste Nordamerika, men observeras
    regelbundet under fåglarnas flyttningsperioder i Europa. Prärielöparen föredrar
    öppna miljöer som gräsmarker och tundra där den söker föda på marken. Den ses
    ofta ensam eller i mindre grupper.


    Prärielöparen är tyvärr hotad och antalet individer har minskat kraftigt under
    senare år. Arten betraktas numera som utrotningshotad, vilket gör varje observation
    värdefull för övervakningen av populationen.'
  en: '# Buff-breasted Sandpiper


    The buff-breasted sandpiper is a small, compact shorebird with warm buff-coloured
    underparts that give the species its common name. Its back is mottled brown and
    grey, providing effective camouflage in its preferred habitats. The bird has relatively
    long legs for its size and a straight, slender bill suited to picking food from
    the ground.


    This species inhabits open grasslands and barren plains, where it forages deliberately
    on the ground for small invertebrates and insects. During migration and winter,
    it favours short-grass areas and burnt or recently grazed fields. The buff-breasted
    sandpiper is notably tame and approachable compared to many other shorebirds,
    often allowing close observation before flushing.


    The bird''s call is generally quiet, consisting of soft, low trills and whistles.
    It breeds in arctic regions and undertakes a lengthy migration to reach wintering
    grounds in South America, making it a long-distance migrant. During spring migration,
    males perform elaborate aerial displays, flying high with rapid wingbeats while
    calling to establish territories and attract females.'
migration:
  sv: Prärielöparen är en mycket sällsynt gäst i Skandinavien och Nordeuropa. Arten
    häckar långt bort i nordöstra Ryssland och nordligaste Nordamerika, men ses regelbundet
    under flyttningen genom Europa, vilket tyder på att den passerar genom vår region.
    Då arten är utrotningshotad och har minskat drastiskt i antal är observationer
    mycket sporadiska. Exakta ankomst- och avgångsmånader för Skandinavien saknas
    dock i tillgänglig källa.
