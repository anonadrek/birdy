description:
  sv: '# Kärrsnäppa


    Kärrsnäppa är en liten vadare som tillhör familjen snäppor och är en av de vanligaste
    småvadarna på norra halvklotet. Det är en flyttfågel med vid utbredning och delas
    in i nio underarter. Arten häckar på höga nordliga breddgrader och överintrar
    längre söderut, vilket gör den bekant inom stora delar av sitt utbredningsområde.


    Under häckningsperioden utvecklar kärrsnäppa en karakteristisk svart fläck på
    buken, vilket skiljer den från många andra småvadare. Under övervintringen blir
    färgteckningen mindre markant och mer enhetligt grå. Fågeln är anpassad för att
    söka föda i fuktiga miljöer, där den genomsöker mjuk botten efter små ryggradslösa
    djur.


    Kärrsnäppa är en vanlig och påtaglig fågel på sina häcknings- och övervintringsplatser,
    där det ofta förekommer i små flockar. Arten föredrar våtmarker och kustområden,
    där flera individer kan observeras tillsammans under passage och övervintering.'
  en: '# Dunlin


    The dunlin is a small wader belonging to the sandpiper family, distinguished by
    its compact size and pointed bill. In breeding plumage, it displays a striking
    black belly patch contrasting with rufous-brown upperparts and grey flanks. Non-breeding
    birds appear more uniformly grey-brown. It is one of the most common waders across
    its range, often seen in flocks that perform coordinated aerial manoeuvres.


    This species inhabits a variety of wet habitats including coastal mudflats, salt
    marshes, estuaries, and inland marshes during migration and winter. During breeding
    season, it favours tundra, moorland, and boggy areas at high latitudes. The dunlin
    is highly migratory, with populations undertaking impressive long-distance movements
    between Arctic breeding grounds and temperate or tropical wintering areas.


    The dunlin feeds by probing in mud and shallow water for small invertebrates,
    often seen with other waders. Its call is a distinctive thin, reedy note, and
    males produce a characteristic trilling song during breeding displays. Recognition
    can be aided by its relatively short legs and the characteristic feeding posture
    with a slightly drooped bill.'
migration:
  sv: '# Kärrsnäppa - Förekomst i Skandinavien/Nordeuropa


    Kärrsnäppa är en klassisk flyttfågel som förekommer i Skandinavien främst under
    häckningstiden på våren och sommaren. Arten anländer till sina nordiska häckningsplatser
    i april-maj efter vintervistelsen i sydligare områden. Under hösten genomför arten
    en omfattande återflyttning söderut i augusti-september, då ungfåglar och adulta
    individer drar mot övervintringsområden längs Atlantens kuster och vid Medelhavet.
    En mindre del av populationen kan övervintra längs Skandinaviens västra kuster
    under mildare vintrar, men majoriteten är helt bosatt som flyttfågel med två årliga
    massförflyttningar.'
  en: '# Dunlin in Scandinavia/Northern Europe


    The Dunlin is a migratory wader that occurs throughout Scandinavia in varying
    numbers depending on the season. During breeding season (April–August), populations
    are found across northern Scandinavia and Russia, where they nest in arctic and
    subarctic wetlands. In autumn, these breeding birds migrate southward, with peak
    passage occurring in August and September. Some individuals remain in Scandinavia
    during winter, particularly in coastal areas of southern Scandinavia where they
    feed in estuaries and sheltered bays, while others continue to winter grounds
    in western and southern Europe or Africa. Spring return migration typically occurs
    from March onwards, with birds gradually recolonizing breeding territories through
    May.'
