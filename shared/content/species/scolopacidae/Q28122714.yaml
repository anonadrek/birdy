description:
  sv: '# Brushane


    Brushane är en snäppa med slående sexuell dimorfism – hanen är betydligt större
    än honan och bär under häckningstiden en unik praktdräkt med stora, individuellt
    varierande halskragar i många färger. Denna variation mellan hanarna är mycket
    ovanlig bland fåglar. Honan är däremot diskret färgad i brunt och beige. Arten
    förekommer på våtmarker i kallare regioner under häckningssäsongen.


    Brushanen är en mobil art som förflyttar sig mellan häckningsplatserna och övervintringsbiotoper.
    Arten är idag klassificerad inom släktet *Calidris* tillsammans med andra mindre
    vadare, en förändring från tidigare när den utgör en helt egen art inom sitt eget
    släkte *Philomachus*.'
  en: ''
migration:
  sv: '# Brushane – Förekomst i Skandinavien/Nordeuropa


    Brushane är en migrerande art som förekommer i Skandinavien och Nordeuropa framförallt
    under våren och hösten. Arten häckar i våtmarker i kallare områden av Europa,
    inklusive delar av Skandinavien, där den anländer under vårmånaderna för att reproducera
    sig. Under hösten drar fåglarna bort när häckningsperioden avslutas. Arten övervintar
    inte regelbundet i Skandinavien utan söker sig till mildare klimatzoner under
    vinterhalvåret. Brushanen är därför en klassisk långdistansmigrant som endast
    är närvarande under de värmare delarna av året i norra Europa.'
  en: ''
