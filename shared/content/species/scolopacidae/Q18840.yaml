description:
  sv: '# Gluttsnäppa


    Gluttsnäppa är en långflyttande vadare som häckar på myrar i skogslandskapet i
    norra palearktis. Den är närmast släkt med den amerikanska större gulbenan och
    tillhör familjen snäppor.


    Arten kännetecknas av sitt utpräglat långflyttande beteende och genomför årligen
    långa migrationer mellan sina häckningsområden och övervintringsplatser. Som vadare
    är den anpassad för att söka föda på blöta marker och vid vattenbrynen, där den
    matar sig på småkryp och andra smådjur.


    Den globala populationen av gluttsnäppa anses vara livskraftig, vilket indikerar
    att arten inte står inför några omedelbara bevarandeproblem. Dess förmåga att
    anpassa sig till olika biotoper under både häckning och övervintering har varit
    viktig för artens framgång.'
  en: '# Common Greenshank


    The common greenshank is a graceful wader with a distinctive appearance and behaviour.
    It displays long greenish legs and a slightly upturned bill, with grey-brown plumage
    above and white underparts. In flight, its white rump is particularly noticeable.
    The bird is notably active and alert, frequently bobbing its tail and moving restlessly
    through its habitat.


    This species inhabits damp marshy environments, favouring wetland areas where
    it hunts for small fish, insects, and crustaceans. It often wades in shallow water,
    probing and pecking with its upturned bill. The greenshank is known for its loud,
    distinctive three-syllable call, often described as "chew-chew-chew" or similar
    variants, which it uses to maintain contact with other birds.


    The common greenshank is found across northern breeding grounds during summer
    months, migrating to coastal and inland wetlands in warmer regions during winter.
    It is frequently observed as a passage migrant in spring and autumn, making it
    a regular sight at suitable wetland locations during migration periods. The species
    often associates with other waders at favoured feeding sites.'
migration:
  sv: '# Gluttsnäppa – Förekomst i Skandinavien och Nordeuropa


    Gluttsnäppa är en utpräglad långflyttare som häckar i norra delen av Palearktis,
    inklusive Skandinavien, på myrar i skogslandskap. Arten ankommer till häckningsområdena
    på våren och återvänder till sina övervintringsplatser i södra världsdelar under
    hösten. Som långflyttare är gluttsnäppan endast närvarande under häckningssäsongen
    i nordiska regioner. Arten ses regelbundet på vårvandringen april–maj och på höstvandringen
    juli–september när den passerar genom området mellan sina nordiska häckningsplatser
    och mediterranea övervintringsområden.'
