description:
  sv: '# Smalnäbbad simsnäppa


    Smalnäbbad simsnäppa är en mycket liten vadarfågel som häckar i arktiska områden
    och övervintrar till havs i tropiska och subtropiska vatten. Under häckningstiden
    är honan färgstarkare än hanen med en rödaktig hals och nacke, medan båda könen
    är gråaktiga under övervintringen. Fågeln är en skicklig simmare med kompakt byggnad
    och relativ kort näbb.


    Arten uppvisar ett unikt könsystem där honan är dominant och häckar med flera
    hanar. Efter att ha lagt ägg överlåter honan helt ruvning och vård av ungarna
    till hanen. En karakteristisk beteende är födosökningstekniken: fågeln simmar
    i små cirklar på grunt vatten för att skapa en virvel som tvingar byten upp till
    ytan.


    Under växtationen ses smalnäbbad simsnäppa vid våtmarker och mindre vattensamlingar.
    Det är en långdistansflyttfågel som efter häckningen samlas i stora flockar ute
    till havs innan den återvänder till häckningsområdena. Arten är relativt vanlig
    på sina häckningsplatser men sparsamt förekommande på genomfart.'
  en: '# Red-necked Phalarope


    The red-necked phalarope is a small wader with a distinctive appearance that changes
    seasonally. During breeding season, it displays a russet-red neck and upper breast,
    contrasting with a grey back and white underparts. In non-breeding plumage, it
    becomes predominantly grey and white. It has a notably fine, straight bill adapted
    for picking food from the water''s surface.


    This phalarope exhibits unusual behaviour for a wader: it spends winters at sea
    on tropical oceans rather than in traditional coastal wintering grounds. It breeds
    across Arctic regions of North America and Eurasia during summer months, making
    it a highly migratory species that undertakes impressive long-distance journeys
    between breeding and wintering areas.


    On water, the red-necked phalarope often spins rapidly in circles to create feeding
    currents that bring food particles to the surface. It is highly aquatic and graceful
    in its movements. The species produces quiet calls and is generally inconspicuous,
    though breeding birds are more vocal. It is typically found on open water, coastal
    areas, and occasionally on inland lakes and pools during migration periods.'
migration:
  sv: Smalnäbbad simsnäppa är en långdistansflyttfågel som häckar cirkumpolärt i arktiska
    områden under sommaren. Arten anländer till sina häckningsplatser i Skandinavien
    och Nordeuropa under maj-juni för att reproducera sig i våtmarker och mindre vattensamlingar.
    Efter häckningssäsongen påbörjar fåglarna sin höstflyttning i juli-augusti, då
    de vandrar långt söderut för att övervintring i stora flockar ute till havs i
    tropiska och subtropiska områden. Fåglarna återvänder därefter till arktiska häckningsplatser
    följande vår, vilket gör arten till en utpräglad säsongflyttare som saknas från
    Skandinavien under vintern.
  en: '# Red-necked Phalarope in Scandinavia


    The red-necked phalarope is a summer breeding visitor to Scandinavia and northern
    Europe, arriving in late May and June to breed in Arctic and subarctic wetlands.
    After breeding concludes in July and August, these birds undertake an exceptional
    long-distance migration, departing northern regions in August and September. Unlike
    most waders that winter in coastal areas, red-necked phalaropes are highly pelagic,
    wintering far out at sea in tropical oceans, particularly in the Arabian Sea and
    off Peru. They do not overwinter in northern Europe and are absent during winter
    months, returning to breeding grounds the following spring to complete their remarkable
    annual cycle.'
