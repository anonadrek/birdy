description:
  sv: '# Sibirisk beckasin


    Sibirisk beckasin är en vadarfågel från familjen snäppor som huvudsakligen förekommer
    i Asien. Arten häckar i Sibirien och drar sedan söderut för att övervinta i södra
    och sydöstra Asien. I Europa är arten mycket sällsynt och uppträder endast som
    en ytterst ovanlig gäst – endast två fynd har dokumenterats, båda från Italien.


    Arten är starkt bunden till sitt asiatskt utbredningsområde och utgör en raritet
    för europeiska fågelbeskådare. Beståndet anses för närvarande vara livskraftigt
    och stabilt.'
  en: ''
migration:
  sv: '# Sibirisk beckasin – Förekomst i Skandinavien/Nordeuropa


    Sibirisk beckasin är en mycket sällsynt gäst i Europa och förekommer endast undantagsvis
    i Skandinavien och Nordeuropa. Arten häckar i Sibirien och övervintrar i södra
    och sydöstra Asien. De mycket få europeiska fynden – endast två dokumenterade
    observationer, båda från Italien – visar att arten mycket sällan når västerut
    under sin migration. För Skandinavien och Nordeuropa bör arten betraktas som en
    extraordinär vagabund snarare än en regelbunden förekomst.'
  en: ''
