description:
  sv: ''
  en: '# Yellow-billed Stork


    The yellow-billed stork is a large African stork with distinctive plumage and
    a striking yellow bill. It displays white and black feathering with bare red facial
    skin around the eyes, making it readily identifiable in the field. The bird''s
    long legs and neck are characteristic of storks, enabling it to wade through shallow
    waters.


    This species is primarily a wader, feeding in wetland habitats where it hunts
    fish, frogs, and other aquatic prey. It often feeds in small flocks, using a characteristic
    feeding technique of stirring the water with its feet to disturb prey. The yellow-billed
    stork is generally silent but occasionally produces bill-clattering sounds, particularly
    during breeding season.


    The species is widespread throughout sub-Saharan Africa, inhabiting lakes, rivers,
    marshes, and floodplain wetlands. It also occurs in Madagascar. The bird''s presence
    is closely linked to water availability, making seasonal wetlands and flood plains
    particularly important habitats. Its distribution extends across much of the continent
    south of the Sahara Desert, though local populations fluctuate with rainfall patterns
    and water levels.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Yellow-billed Stork is an African species with no established occurrence in
    Scandinavia or Northern Europe. As a sub-Saharan African resident, it does not
    migrate to or occur naturally in Scandinavian regions during any season. Therefore,
    migration patterns relevant to Northern Europe cannot be documented for this species.'
