description:
  sv: '# Blåkindad stork


    Blåkindad stork är en medelstor afrikan stork som tillhör släktet egentliga storkar,
    tillsammans med den vita och svarta storken. Den är mindre än sina närmaste släktingar
    och kännetecknas av sin karakteristiska blåfärgade hud på kinderna, vilket är
    mycket framträdande på det annars mörkfärgade huvudet.


    Arten förekommer över stora delar av Afrika söder om Sahara, där den trivs i olika
    öppna miljöer som savanner och gräsmarker. Som många storkar är den en migratorisk
    art som följer regntiderna för att hitta bästa förutsättningar för födosökning.
    Den lever gärna i kolonier tillsammans med andra storkar och födosökande fåglar.


    Blåkindad stork är en stillsam fågel utan särskilt utvecklad röstförmåga, vilket
    är typiskt för många storkarter. Den födosöker på marken efter små djur och andra
    föda som den hittar när den vattnar omkring i sitt habitat.'
  en: ''
