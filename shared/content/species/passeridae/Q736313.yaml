description:
  sv: ''
  en: '# Rock Sparrow


    The rock sparrow is a small passerine in the sparrow family, distinguished by
    its pale plumage and modest size. It inhabits barren, rocky hills across a broad
    geographic range, from Atlantic islands through southern Europe and western North
    Africa, extending eastward across central Asia to Mongolia and northern China.


    This species shows interesting migration patterns depending on location. Western
    populations remain resident year-round, while Asian birds often migrate southward
    or descend to lower mountain altitudes during winter months. The rock sparrow
    is well-adapted to rocky, arid terrain where vegetation is sparse, making it a
    characteristic bird of harsh, exposed landscapes.


    The species maintains this distinctive ecological niche across its extensive range,
    with populations distributed from lower elevations to considerable heights in
    mountainous regions. Its ability to thrive in challenging, rocky environments
    demonstrates its specialized adaptation to these particular habitats across diverse
    geographic areas.'
migration:
  sv: ''
  en: '# Rock Sparrow in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Rock Sparrow''s range extends from the Iberian Peninsula and North Africa
    through southern Europe to central Asia and China, but Scandinavia and Northern
    Europe lie well outside its natural distribution. The species is resident in the
    western portions of its range, while some Asian populations undertake altitudinal
    migrations or move southward during winter. However, there are no established
    records of Rock Sparrows occurring regularly in Scandinavian or Northern European
    regions.'
