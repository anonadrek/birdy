description:
  sv: ''
  en: '# Iago Sparrow


    The Iago sparrow is a small sparrow endemic to the Cape Verde archipelago, measuring
    just 12.5–13 centimetres in length. Females and young birds display brown plumage
    with black markings above and a dull grey underside, distinguished by a prominent,
    pale supercilium (eyebrow stripe). Males are more striking, with a brighter underside
    and bold black and chestnut stripes adorning their head, creating a distinctive
    facial pattern.


    This species is vocal, with males and females producing somewhat different variations
    of chirps. The vocalizations are primarily chirping sounds rather than complex
    songs, typical of many sparrows. The bird''s behaviour and ecology remain relatively
    understudied compared to more widespread sparrow species.


    The Iago sparrow is found exclusively within the Cape Verde archipelago in the
    eastern Atlantic Ocean, making it a species of restricted range and particular
    interest to birdwatchers visiting the islands.'
migration:
  sv: ''
  en: '# Iago Sparrow in Northern Europe


    The Iago sparrow does not occur in Scandinavia or Northern Europe. This species
    is endemic to the Cape Verde archipelago, located in the eastern Atlantic Ocean
    near western Africa, and does not migrate to northern regions. Its range is restricted
    to these islands year-round, making it absent from Scandinavian territories entirely.


    Migration data unavailable for this species in a Northern European context.'
