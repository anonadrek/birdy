description:
  sv: ''
  en: '# Sudan Golden Sparrow


    The Sudan golden sparrow is a small sparrow found across sub-Saharan Africa. It
    is highly valued in aviculture, where it is commonly known as the golden song
    sparrow due to its attractive appearance and pleasant vocalizations. The species
    is closely related to the Arabian golden sparrow, and the two are sometimes grouped
    together as a single species called the "golden sparrow."


    This bird is particularly popular in the cage bird trade, reflecting its appeal
    to bird enthusiasts. Its popularity in captivity suggests it possesses characteristics—whether
    visual plumage, behaviour, or song—that make it desirable as a kept bird. The
    species'' presence across sub-Saharan Africa indicates it is well-adapted to various
    habitats throughout this region.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Sudan Golden Sparrow is a resident bird of sub-Saharan Africa with no documented
    migration patterns relevant to Scandinavia or Northern Europe. This species does
    not naturally occur in these regions and is only found in captivity through the
    aviculture trade, where it is kept as a cage bird. Therefore, information about
    seasonal occurrence, arrival months, or overwintering in Northern European regions
    cannot be provided.'
