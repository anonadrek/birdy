description:
  sv: '# Saxaulsparv


    Saxaulsparven är en centralasiatisk tätting som tillhör familjen sparvfinkar och
    är en av de större arterna i denna grupp. Med en längd på 14–16 centimeter och
    vikt på 25–27 gram är den en ansenlig sparv. Arten har en karakteristisk grå och
    sandfärgad brun fjäderdräkt med ljusbrun tars som gör den relativt lätt att identifiera
    även för dilettanten.


    Honan har en mindre anslående färgdräkt än hanen och saknar dennes svarta huvudteckning,
    men arten är ändå distinkt nog i samtliga dräkter för att inte lätt förväxlas
    med andra arter. Saxaulsparven har ett jämförelsevis mjukt och musikaliskt kvittrande
    lockläte. Övriga ljud från arten består av sång och överflygningsläte som hjälper
    till vid identifikationen i fält.'
  en: '# Saxaul Sparrow


    The saxaul sparrow is a relatively large member of the sparrow family, measuring
    14–16 centimetres and weighing 25–32 grams. Both sexes display dull grey to sandy
    brown plumage with pale brown legs. Females are noticeably duller than males,
    with less striking head markings and bill coloration. Males are characterized
    by bold black stripes on the head, creating a distinctive pattern that makes this
    species unlikely to be confused with any other sparrow.


    The saxaul sparrow''s vocalizations are notably softer and more musical than those
    of many sparrows, featuring a gentle chirping call, a distinct song, and a recognizable
    flight call. It inhabits parts of Central Asia, where it is adapted to arid environments.
    The species'' appearance, particularly the striking head markings of males, combined
    with its musical voice, makes it a distinctive presence within its range.'
