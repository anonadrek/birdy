description:
  sv: ''
  en: '# White-winged Snowfinch


    The white-winged snowfinch is a small passerine bird belonging to the sparrow
    family, despite its misleading common name suggesting it is a finch. It is a specialist
    of high-altitude alpine and mountain habitats, where it has adapted to harsh,
    snowy conditions that would challenge most other bird species.


    This snowfinch is characterized by its predominantly white and grey plumage, with
    distinctive white patches on its wings that give it its name. It is well-suited
    to life in mountainous terrain, where it forages on the ground for seeds and insects,
    often searching among rocks and sparse vegetation. The bird''s behavior reflects
    its mountain environment—it is typically seen moving in small flocks, particularly
    during winter months when it may descend slightly to lower elevations to find
    food.


    The species is generally quiet, though it does produce soft calls within its social
    groups. It is found in high mountain ranges across Europe and Asia, inhabiting
    rocky slopes and barren terrain above the tree line where few other birds venture.
    Its presence indicates the presence of true alpine habitat, making it a characteristic
    species of Europe''s highest mountain ranges and similar terrain across the continent''s
    interior.'
migration:
  sv: ''
  en: '# Montifringilla nivalis - Seasonal Occurrence in Northern Europe


    The White-winged Snowfinch is primarily a resident of high mountain regions and
    does not typically occur in Scandinavia or Northern Europe during regular migration
    patterns. This species is largely sedentary within its alpine habitat in southern
    and central European mountains. When it does occur in northern regions, it is
    generally as a vagrant or during exceptional winter movements from higher elevations
    in response to severe snow conditions. The bird''s presence in Scandinavia would
    be rare and irregular, with any sightings representing dispersal from its core
    mountain range rather than established seasonal migration. Its occurrence in Northern
    Europe is not part of a predictable annual cycle.'
