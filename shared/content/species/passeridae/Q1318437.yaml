  en: '# Dead Sea Sparrow in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Dead Sea Sparrow is a resident species of arid and semi-arid regions in West
    Asia, Afghanistan, and eastern Iran, with no established presence in Scandinavia
    or Northern Europe. This species does not occur in these regions either as a regular
    migrant, winter visitor, or breeding bird. Its range is confined to warm, dry
    habitats far south of Scandinavian latitudes.'
