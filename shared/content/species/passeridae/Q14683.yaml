description:
  sv: '# Gråsparv


    Gråsparven är en av världens mest spridda fågelarter och tillhör familjen sparvfinkar.
    Det är en liten, robust fågel som har följt människan i över 10 000 år och trivs
    väl i närheten av bebyggelse. Idag finns gråsparven på nästan alla kontinenter,
    då människan introducerat arten långt bort från dess ursprungliga utbredningsområde
    i Europa och Asien.


    Arten förekommer framför allt i människans närhet – vid bostäder, gårdar och andra
    bebyggelse. Det är en social fågel som ofta ses i flockar, särskilt vid framför
    allt sädesmagasin, möllor och andra platser där det finns mat. Gråsparven är mycket
    anpassningsbar och trives väl i urbana miljöer. Världspopulationen uppskattas
    till omkring 500 miljoner individer, vilket gör det till en av de vanligaste fågelpopulationerna
    på jorden.'
  en: '# House Sparrow


    The house sparrow is a small, compact bird measuring around 16 cm in length, weighing
    between 24–39.5 grams. Sexual dimorphism is evident: males display striking black,
    white, and brown markings, while females and juveniles are duller, with pale brown
    and grey plumage. It belongs to the sparrow family Passeridae and is one of approximately
    25 species in the genus Passer.


    Originally native to most of Europe, the Mediterranean Basin, and much of Asia,
    the house sparrow has become the world''s most widely distributed wild bird. Both
    intentional and accidental human introductions have established populations across
    Australasia, Africa, and the Americas. This remarkable expansion reflects the
    species'' remarkable adaptability to human-modified landscapes and urban environments,
    making it a familiar sight to people worldwide.'
