    occurrence in Scandinavia/Northern Europe. According to the instructions, when
    source text contains no migration information, the standard phrase should be returned.'
  en: '# House Sparrow (Passer domesticus) in Scandinavia/Northern Europe


    The House Sparrow is a year-round resident throughout most of Scandinavia and
    Northern Europe, showing minimal migration patterns. However, populations in the
    northernmost regions may undertake partial migrations, with some individuals moving
    southward during the harshest winter months, while others remain sedentary. The
    species is highly adapted to urban and agricultural environments, where it finds
    shelter and food sources that sustain it through winter. Breeding occurs from
    spring through summer, with birds establishing territories and raising multiple
    broods before the onset of winter.'
