description:
  sv: ''
  en: '# Hamerkop


    The hamerkop is a distinctive medium-sized waterbird with brown plumage and an
    unmistakable silhouette. Its most striking feature is its large head, which bears
    a prominent crest and long, heavy bill that combine to create a hammer-like profile—the
    origin of its name. It is the only living member of the family Scopidae, and genetic
    research has revealed it is most closely related to pelicans and the shoebill,
    rather than to storks as previously thought.


    Hamerkops are highly adaptable waterbirds, inhabiting diverse wetland environments
    including estuaries, lakesides, fish ponds, riverbanks, and rocky coasts. They
    are generally sedentary, though they undertake local movements in response to
    water availability. The species is found across mainland Africa, Madagascar, and
    parts of Arabia, making it relatively widespread throughout its range.


    Little is detailed about their specific behaviours and vocalizations in the source
    material, though they are known to be solitary or found in pairs rather than in
    flocks. Their presence is often betrayed by their distinctive appearance and preference
    for shallow waters where they forage.'
migration:
