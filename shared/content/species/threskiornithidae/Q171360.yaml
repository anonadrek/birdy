description:
  sv: ''
  en: '# Eurasian Spoonbill


    The Eurasian spoonbill is a distinctive wading bird instantly recognizable by
    its unique spatulate bill—flattened and broadened at the tip like a spoon. It
    is a large, predominantly white bird with long legs and a graceful neck, making
    it unmistakable in wetland habitats. During breeding season, adults develop a
    crest on the head and acquire pale yellow markings on the neck and breast.


    This species frequents shallow waters where it feeds by sweeping its spoon-shaped
    bill side-to-side through the water to catch small fish, crustaceans, and aquatic
    invertebrates. It is generally quiet but may produce grunting calls and bill-clattering
    sounds, particularly at breeding colonies. The bird is gregarious, often seen
    in flocks, especially during migration and winter.


    The Eurasian spoonbill is native to Europe, Africa, and Asia, with populations
    across a wide range. Northern breeding populations are migratory, moving south
    during winter months, while more southerly birds may be resident year-round. It
    prefers reed beds, marshes, and coastal wetlands, where it nests colonially in
    trees or reed stands.'
migration:
  sv: ''
  en: '# Eurasian Spoonbill Migration in Scandinavia


    The Eurasian Spoonbill is a partial migrant in Northern Europe, with populations
    breeding in Scandinavia and other northerly regions undertaking significant southward
    movements during winter. Birds from northern breeding areas migrate to wintering
    grounds in southern Europe, Africa, and Asia, vacating their breeding territories
    as water bodies freeze. Spring arrival typically occurs from March onwards as
    conditions improve and breeding wetlands become ice-free. Northern populations
    show stronger migratory tendencies than their more southern counterparts, which
    may remain year-round in milder regions where water remains accessible throughout
    winter.'
