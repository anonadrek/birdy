description:
  sv: ''
  en: '# African Spoonbill


    The African spoonbill is a distinctive long-legged wading bird belonging to the
    ibis and spoonbill family. Its most notable feature is its characteristic flattened,
    spoon-shaped bill, which it uses to feed by sweeping through shallow water. The
    bird has white plumage with a bare facial patch, and its legs are long and adapted
    for wading in wetland habitats.


    This species is found across Africa and Madagascar, frequenting shallow lakes,
    river deltas, and coastal wetlands where it hunts for fish, crustaceans, and other
    aquatic prey. The African spoonbill typically feeds in groups, often in the company
    of other wading birds. It nests colonially, building stick nests in trees or reed
    beds near water.


    The bird is generally silent but produces occasional croaking sounds and bill-clattering
    displays during breeding season, particularly when establishing territories or
    interacting with mates. Its widespread distribution across the continent reflects
    its adaptability to various wetland environments, making it a familiar sight in
    suitable habitats throughout its range.'
migration:
  sv: ''
  en: '# African Spoonbill (*Platalea alba*) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The African spoonbill is an African and Madagascan species with no established
    occurrence in Scandinavia or Northern Europe. The source text confirms its distribution
    is restricted to sub-Saharan Africa and Madagascar, including countries such as
    South Africa, Botswana, Kenya, and Mozambique. There is no information regarding
    any presence, migratory patterns, or seasonal movements in Scandinavian or Northern
    European regions.'
