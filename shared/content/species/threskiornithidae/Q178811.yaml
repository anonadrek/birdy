description:
  sv: ''
  en: '# Glossy Ibis


    The glossy ibis is a distinctive water bird named for its curved, sickle-shaped
    bill—a feature reflected in both its scientific and common names. It belongs to
    the ibis and spoonbill family (Threskiornithidae). The bird''s plumage appears
    dark and iridescent in good light, giving it a glossy appearance that sets it
    apart from other ibis species.


    Glossy ibises are gregarious birds, often seen in small to large flocks, particularly
    during migration and winter months. They feed in shallow wetlands, marshes, and
    coastal areas, using their specialized curved bills to probe into mud and water
    for invertebrates, small fish, and other prey. The birds walk deliberately through
    shallow water with a characteristic forward-leaning posture.


    It is primarily a water bird found in freshwater and brackish wetlands, though
    it readily adapts to various aquatic habitats. Its range has expanded significantly
    in recent decades, appearing in areas where it was previously uncommon or absent.
    The species is migratory in many regions, undertaking long-distance movements
    between breeding and wintering grounds. Flocks in flight present a striking silhouette
    with their extended necks and pointed bills held horizontal.'
migration:
  sv: ''
  en: '# Glossy Ibis in Scandinavia/Northern Europe


    The Glossy Ibis is a rare vagrant to Scandinavia and Northern Europe, with no
    established breeding population in the region. Sightings are sporadic and typically
    occur during spring and autumn migration periods, when individuals occasionally
    wander northward from their main European breeding grounds in southern regions.
    Winter occurrences are exceptional, as the species cannot survive prolonged freezing
    conditions. Most northern records come from late April through September, with
    peak observations during May and August-September. The species remains unpredictable
    in Scandinavian waters, appearing irregularly rather than as a regular migrant.


    Migration data unavailable for this species.'
