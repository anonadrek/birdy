description:
  sv: '# Helig ibis


    Helig ibis är en art inom familjen ibisar och tillhör ordningen pelikanfåglar.
    Det är en stor vadare med långt, nedåtböjt näbb och vita fjädrar på huvuddelen
    av kroppen, med svarta fjädrar på vingarna och stjärten. Arten förekommer huvudsakligen
    i Afrika söder om Sahara, där den hittas i våtmarker, sjöar och flodkanter.


    Arten är gregär och uppträder ofta i flockar, särskilt under matning och på sovplatser.
    Det födosöker genom att staka omkring i grunt vatten eller på land och söker föda
    som små fiskar, kräftdjur, insekter och andra smådjur. Arten är anpassad till
    olika miljöer och kan ses både i naturliga och urbana områden.


    En betydande utveckling är att fåglar som rymt från fångenskap har etablerat frilevande
    populationer i delar av Europa. Dessa populationer har vuxit under senare år och
    utgör en potentiell invaderande art på vissa platser.'
  en: '# African Sacred Ibis


    The African sacred ibis is a wading bird belonging to the ibis family. It inhabits
    much of Africa, with small populations also found in parts of Iraq, Iran, and
    Kuwait. The species holds significant historical importance, having been revered
    in ancient Egyptian religion where it was associated with the deity Thoth. Notably,
    the species is now extirpated from Egypt itself.'
migration:
  sv: '# Helig ibis - Förekomst i Norden


    Helig ibis förekommer inte naturligt i Scandinavia eller Nordeuropa. Arten är
    hemhörig i Afrika söder om Sahara. De europeiska förekomster som finns dokumenteras
    från rymmade fåglar från fångenskap, och dessa populationer är etablerade i södra
    och västra Europa, långt från Skandinavien. Arten är därför inte en relevant migrant
    eller övervintrare för nordeuropeiska fågeltäckare.'
  en: '# African Sacred Ibis in Northern Europe


    The African Sacred Ibis does not naturally occur in Scandinavia or Northern Europe.
    This species is native to Africa and the Middle East, with its range limited to
    parts of Africa, Iraq, Iran, and Kuwait. While the species has established invasive
    populations in some parts of Europe (notably in France and Italy) through escaped
    or released captive birds, it does not have a natural presence in Scandinavian
    or Northern European regions and therefore does not exhibit migration patterns
    relevant to these areas.'
