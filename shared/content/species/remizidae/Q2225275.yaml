description:
  sv: ''
  en: '# White-crowned Penduline Tit


    The white-crowned penduline tit is a small songbird belonging to the penduline
    tit family. It inhabits temperate and subtropical regions across central and eastern
    Asia, favouring areas with suitable vegetation and water sources.


    This species is characterized by its distinctive white crown, which contrasts
    sharply with darker plumage on the back and wings. Like other penduline tits,
    it is a diminutive bird with a compact build adapted for gleaning insects from
    foliage and branches. Its behaviour is typical of the family—active and acrobatic,
    often observed foraging among reeds, shrubs, and trees, sometimes hanging upside
    down while searching for food.


    The white-crowned penduline tit occurs in open woodland, scrubland, and reed beds
    across its range, with populations found at varying elevations depending on local
    geography and season. It prefers areas near water and vegetation-rich habitats
    where it can hunt insects and small invertebrates. Like many penduline tits, it
    builds a characteristic pendulous nest suspended from branches—a remarkable feat
    of engineering that protects eggs and chicks from predators.'
