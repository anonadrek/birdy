description:
  sv: '# Pungmes


    Pungmes är en liten fågel i familjen pungmesar som förekommer fläckvist i Europa
    och Asien, ofta nära vattendrag och våtmarker. Det mest karakteristiska hos arten
    är dess anmärkningsvärda bo – en pungformad konstruktion som hängs i lövträd tätt
    intill vattnet. Boet är ett mesterverk av fågelarkitektur och används ofta bara
    en gång innan fågeln överger det.


    Arten är svår att observera då den ofta håller sig gömd i täta buskage och rörväxter.
    Pungmesen är mycket liten och diskret i sitt uppträdande. Globalt sett är beståndet
    stabilt och livskraftigt, men i Sverige är situationen allvarligare – arten är
    sedan 2020 klassificerad som akut hotad enligt Artdatabankens röda lista. Förlusterna
    av lämpliga våtmarksmiljöer utgör ett växande hot mot arten.'
  en: '# Eurasian Penduline Tit


    The Eurasian penduline tit is a small passerine found across the western Palearctic
    region, with populations displaying interesting migratory patterns. Birds in northern
    areas migrate seasonally, while those in southern regions remain resident year-round,
    making their presence dependent on latitude and climate conditions.


    This diminutive bird inhabits wetland environments, particularly reed beds and
    riverside vegetation where it builds its distinctive hanging nest. The species
    is adapted to life among reeds and aquatic plants, foraging for small insects
    and seeds. Its behavior reflects its ecological niche, moving actively through
    vegetation as it searches for food throughout the day.


    The penduline tit''s small size and subtle coloring allow it to blend into its
    wetland habitat, though attentive observers can spot it with patience. Its presence
    indicates healthy reed bed ecosystems, making it a valued indicator species for
    wetland conservation. The bird''s remarkable architectural skill—constructing
    elaborate suspended nests—demonstrates remarkable adaptation to its specialized
    environment.'
migration:
  sv: '# Pungmes (Remiz pendulinus) – Förekomst i Skandinavien


    Migrationsdata saknas för denna art.'
  en: '# Eurasian Penduline Tit in Scandinavia/Northern Europe


    The Eurasian Penduline Tit is a migratory species in northern Europe, including
    Scandinavia, where populations do not remain year-round. Birds breeding in this
    region depart during autumn migration to overwinter in southern areas within the
    western Palearctic. Spring arrival in Scandinavian breeding areas occurs as temperatures
    rise and suitable reed-bed habitats become accessible. In contrast, populations
    inhabiting southern parts of the species'' range remain resident throughout the
    year, never undertaking significant migrations.'
