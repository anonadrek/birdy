description:
  sv: '# Svarthuvad pungmes


    Svarthuvad pungmes är en liten asiatisk fågel som tillhör familjen pungmesar.
    Den är närbesläktad med pungmesen och behandlas ibland som en underart av denna.
    Fågeln förekommer i vass- och sävbälten i Centralasien, där den är anpassad till
    dessa våtmarksmiljöer.


    Arten är känd för sin karakteristiska svarta huvud­märkning, som skiljer den från
    närbesläktade arter. Som övriga pungmesar är det en mycket liten fågel med en
    spetsig näbb som är väl utformad för att söka föda bland vegetation.


    Svarthuvad pungmes lever i stora vassområden och sävbälten där den söker sin föda
    bland vass­stänglar och kärrvegetation. Den är huvudsakligen utbredd i olika delar
    av Centralasien från västerligare områden österut.'
  en: '# Black-headed Penduline Tit


    The black-headed penduline tit is a small member of the penduline tit family found
    exclusively in Central Asia. It inhabits reed beds along lakes and rivers, though
    its distribution is fragmented across this vast region. Remarkably, it remains
    one of the least studied birds in Central Asia, with much still unknown about
    its behaviour, ecology, and movements.


    Due to limited documentation, detailed accounts of its appearance and calls are
    sparse. However, as a penduline tit, it likely shares characteristics common to
    the genus, including small size and a preference for reed-bed habitats where it
    constructs its distinctive suspended, pouch-like nest. The "black-headed" in its
    name presumably refers to dark plumage on the crown, though comprehensive descriptions
    of its field marks are not well established in available sources.


    This species'' poorly-known status makes it a fascinating subject for ornithologists
    and birdwatchers willing to venture into remote Central Asian wetlands. Any observations
    of this elusive bird contribute valuable information to our understanding of this
    cryptic and understudied species.'
