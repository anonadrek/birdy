description:
  sv: ''
  en: '# Pheasant-tailed Jacana


    The pheasant-tailed jacana is a distinctive wader with exceptionally long toes
    and nails that allow it to walk effortlessly across floating vegetation in shallow
    lakes and wetlands. During breeding season, it displays elegant plumage with a
    dark body, white neck, and notably long tail feathers that give the species its
    name. In non-breeding plumage, it appears considerably duller. This species is
    unique among jacanas for undertaking long-distance seasonal migrations across
    tropical Asia, from Yemen eastward to the Philippines.


    It forages by walking delicately on aquatic plants or swimming while searching
    for invertebrate prey. The pheasant-tailed jacana exhibits unusual breeding behaviour:
    females are noticeably larger than males and are polyandrous, meaning they mate
    with multiple males. Each male within a female''s territory incubates and raises
    separate clutches of eggs, a remarkable division of parental duties that reduces
    the female''s burden.


    This jacana inhabits shallow wetlands, rice paddies, and lakes with abundant floating
    vegetation throughout tropical Asian regions. Its seasonal movements make it an
    unpredictable visitor in parts of its range, though it may be locally common during
    appropriate seasons in suitable habitat.'
migration:
  sv: ''
  en: '# Pheasant-tailed Jacana in Northern Europe


    Migration data unavailable for this species.


    The pheasant-tailed jacana is a tropical Asian species found from Yemen to the
    Philippines, with no established presence in Scandinavia or Northern Europe. While
    the species is noted for undertaking seasonal movements and long-distance migrations
    within its tropical range, it does not naturally occur in Northern European waters
    or habitats.'
