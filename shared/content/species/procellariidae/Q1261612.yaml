description:
  sv: '# Kapverdepetrell


    Kapverdepetrell är en havsfågel som tillhör familjen liror. Arten är endemisk
    och häckar endast på en mycket begränsad lokal. Det är en relativt liten stormfågel
    som är anpassad för liv på öppet hav.


    Arten klassificerades tidigare tillsammans med desertapetrell som en enda art
    under namnet atlantpetrell, men betraktas nu som en separat art. Kapverdepetrell
    är kategoriserad som nära hotad enligt IUCN, vilket indikerar att populationen
    eller utbredningen är begränsad och kräver uppmärksamhet.


    Som typisk havsfågel spenderar arten mycket tid över havet mellan häckningsperioderna.
    Det är en fågel för den erfarne fågelskådaren, då den är svår att iaktta på grund
    av sin begränsade geografiska förekomst och sitt uteliv på öppna vatten.'
  en: ''
