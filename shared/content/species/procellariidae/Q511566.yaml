description:
  sv: ''
  en: '# Yelkouan Shearwater


    The Yelkouan shearwater is a small, dark seabird belonging to the shearwater family.
    It is primarily dark grey or blackish above with a paler underside, making it
    identifiable at sea when observed closely. It is a relatively compact shearwater
    with narrow, pointed wings adapted for efficient flight over ocean waters.


    This species is highly pelagic, spending most of its life at sea and returning
    to land only to breed. It is an agile flier, using dynamic soaring techniques
    to glide low over wave tops in search of small fish and squid. The bird is typically
    seen in small flocks, particularly in coastal and offshore waters of its range.
    Like other shearwaters, it is nocturnal at breeding colonies, coming ashore after
    dark to avoid predators.


    The Yelkouan shearwater was historically considered part of a larger polytypic
    species but is now recognized as a distinct monotypic species. It breeds in colonies
    on rocky islands and coastal cliffs, where it nests in burrows or crevices. The
    species favors temperate to subtropical oceanic environments, typically encountered
    in deeper waters beyond the continental shelf during the breeding season and in
    more coastal regions outside the breeding period.'
