description:
  sv: '# Madeirapetrell


    Madeirapetrell är en liten, hotad havsfågel som tillhör familjen liror. Det är
    en endemit för Madeira och häckar högt uppe i bergsregioner på ön. Arten är mycket
    svårstudierad på grund av sitt begränsat utbredningsområde och sin dolda livsstil.


    Under häckningssäsongen är madeirapetrell nattaktiv vid sina bo på höga höjder.
    Utanför denna period lever arten helt pelagiskt till havs, men forskare vet ännu
    inte exakt var den vistas då eller vilka sökvägsmönster den följer. Denna osäkerhet
    om dess marina habitat gör arten speciellt intressant för ornitologer.


    Madeirapetrell räknas som hotad på grund av sitt små population och begränsade
    utbredning. Bevarandearrangemang på Madeira är viktiga för artens överlevnad.'
  en: ''
