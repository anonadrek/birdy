description:
  sv: ''
  en: '# Cape Verde Shearwater


    The Cape Verde shearwater is a medium-large seabird belonging to the petrel family.
    It is endemic to the Cape Verde archipelago, where it is known locally as the
    cagarra. This shearwater is adapted for life at sea, spending most of its time
    over the Atlantic Ocean off the coast of West Africa.


    As a specialist ocean dweller, it feeds on fish and squid captured during its
    flights over open water. The species exhibits typical shearwater behaviour, using
    a distinctive flight pattern characterized by rapid wing beats interspersed with
    gliding on stiff wings held close to the body. It nests in burrows or crevices
    on land, returning to breeding colonies primarily at night to avoid predators.


    The Cape Verde shearwater is relatively vocal at its breeding sites, producing
    various calls and growling sounds during the breeding season. However, it remains
    quiet during its time at sea. Its restricted range makes it dependent on the archipelago''s
    islands for breeding, making it vulnerable to environmental changes and human
    disturbance in its limited habitat.'
