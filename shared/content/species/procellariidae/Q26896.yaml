description:
  sv: '# Stormfågel


    Stormfågeln är en robust havsfågel tillhörande familjen liror. Fågeln häckar cirkumpolärt
    i subarktiska och arktiska områden, men förekommer även i Västeuropa. Tillsammans
    med sydstormfågeln utgör den släktet Fulmarus inom ordningen stormfåglar.


    Arten är klassificerad som livskraftig enligt IUCN och utgör en väl etablerad
    bestånd i sitt utbredningsområde. Som en típisk havsfågel är stormfågeln väl anpassad
    för sitt livsrum på öppna haven, där den tillbringar huvuddelen av sitt liv mellan
    häckningssäsongerna.'
  en: '# Northern Fulmar


    The Northern Fulmar is an abundant seabird of subarctic North Atlantic and North
    Pacific waters, occasionally appearing far south of its normal range. It displays
    considerable variation in plumage, with light-morph birds featuring white heads
    and bodies with grey wings and tail, while dark-morph Arctic populations appear
    uniformly grey. Intermediate plumages are common. Though superficially gull-like
    in appearance, it belongs to the family Procellariidae, which encompasses petrels
    and shearwaters, rather than the gull family.


    The species is well-adapted to life at sea, spending much of its time in open
    ocean habitats. It breeds in coastal colonies, returning to nesting sites with
    strong site fidelity. Fulmars are skillful fliers, using dynamic soaring techniques
    to traverse vast ocean expanses with minimal energy expenditure. They feed on
    fish, squid, and other marine organisms, often scavenging behind fishing vessels.
    The species'' population has expanded significantly over recent decades, likely
    due to increased food availability from fisheries discards.'
migration:
  sv: '# Stormfågel – Förekomst i Skandinavien/Nordeuropa


    Stormfågeln är en circumpolar art som förekommer året om i nordeuropeiska farvatten,
    med koncentrationen större under vintermånaderna då fler individer söker sig mot
    mindre isiga kustområden. Arten häckar på klippor och berg i arktiska och subarktiska
    regioner, inklusive områden kring Island, Norska kusten och andra nordliga lokaler.
    Efter häckningssäsongen vandrar stormfåglar ut på öppet hav, där de tillbringar
    höst och vinter. Många individer övervintrarar i eller nära sitt häckningsområde,
    särskilt om isförhållandena tillåter tillgång till öppet vatten.'
  en: '# Northern Fulmar (Fulmarus glacialis) in Scandinavia/Northern Europe


    The Northern Fulmar is a year-round resident in Scandinavian and northern European
    waters, though its presence varies seasonally. These seabirds breed on cliff colonies
    throughout the region during spring and summer months, with populations concentrated
    along the Norwegian, Faroese, and Icelandic coasts. Outside the breeding season,
    fulmars disperse widely across the North Atlantic, with some birds undertaking
    extensive movements southward into temperate waters during autumn and winter.
    However, many individuals remain in northern waters year-round, making the species
    a characteristic feature of Scandinavian seascapes throughout the annual cycle.'
