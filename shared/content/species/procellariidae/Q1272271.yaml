  en: '# Barolo Shearwater


    The Barolo shearwater is a small member of the shearwater family, distinguished
    by its compact size and streamlined build adapted for life at sea. It closely
    resembles other small shearwaters but can be identified by subtle differences
    in plumage patterns and overall proportions when seen in flight.


    This species is primarily pelagic, spending much of its time over open ocean waters
    where it hunts for small fish and squid. It breeds colonially on rocky islands
    and coastal cliffs, nesting in burrows or crevices during the breeding season.
    Like other shearwaters, it is largely nocturnal at breeding colonies, coming ashore
    under cover of darkness to avoid predation.


    The Barolo shearwater''s vocalizations include various calls and cries made at
    night around breeding sites, though it remains relatively silent when at sea.
    It inhabits the North Atlantic, with breeding populations established on remote
    islands. Outside the breeding season, it may disperse across wider ocean areas,
    though it remains primarily within cooler northern waters. Its distribution and
    breeding habits make it a specialist of specific island ecosystems.'
