description:
  sv: ''
  en: '# Sooty Shearwater


    The sooty shearwater is a medium-large seabird belonging to the shearwater family.
    It presents a uniformly dark plumage that appears almost entirely sooty-brown
    to blackish, with paler underwings that can be visible in flight. This coloration
    distinguishes it from many relatives and aids identification at sea.


    As a pelagic species, it spends much of its life over open ocean waters, where
    it demonstrates the characteristic flight pattern of shearwaters—swift, dynamic
    flying close to wave surfaces with minimal wingbeats, appearing to shear over
    the water. It feeds on fish and squid, often congregating in large numbers at
    productive feeding grounds.


    The species is known in some regions by its Māori name, tītī. It undertakes extensive
    migrations and has been traditionally harvested as a food source, though it remains
    widespread across ocean habitats. Its dark appearance and streamlined silhouette
    make it a distinctive sight for those observing seabirds in offshore environments.'
migration:
  sv: ''
  en: '# Sooty Shearwater Migration in Northern Europe


    The Sooty Shearwater is a regular but scarce visitor to Scandinavian and Northern
    European waters during the boreal summer months. These long-distance migratory
    seabirds breed in the Southern Hemisphere, primarily around New Zealand and southern
    Australia, before undertaking one of the longest migrations in the animal kingdom.
    They arrive in northern waters from June through August, dispersing widely across
    the North Atlantic and North Sea as they feed on small fish and squid during the
    northern summer. By autumn, they depart for their return journey south, with most
    individuals leaving by September. The species does not overwinter in the region.'
