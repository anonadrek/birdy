description:
  sv: ''
  en: '# Great Shearwater


    The Great Shearwater is a substantial member of the shearwater family, characterized
    by its robust build and distinctive flight pattern. It displays dark upper parts
    contrasting with a lighter underside, and possesses the characteristic long, narrow
    wings typical of shearwaters. This adaptation allows for the species'' efficient,
    dynamic flight style—rapid wingbeats alternating with gliding—which it uses to
    traverse vast oceanic distances.


    During breeding season, it gathers in large colonies on rocky islands in the south
    Atlantic, where it nests in burrows or rock crevices. Outside this period, the
    species becomes a truly pelagic traveler, ranging extensively throughout Atlantic
    waters in search of food. It feeds primarily on fish and squid, often following
    fishing vessels or gathering where food concentrates.


    The Great Shearwater is generally quiet at sea but becomes vocal at breeding colonies,
    producing various calls during night-time activity. Its breeding biology is typical
    of shearwaters—it raises a single chick annually, with both parents sharing incubation
    and chick-rearing duties. The species undertakes remarkable trans-oceanic migrations,
    making it a remarkable example of seabird adaptation to open ocean life.'
migration:
  sv: ''
  en: '# Great Shearwater (Större lira) in Scandinavia/Northern Europe


    The Great Shearwater is a migratory seabird that occurs in Northern European waters
    primarily during the boreal summer and autumn months. After breeding in the South
    Atlantic during the Southern Hemisphere''s breeding season, these birds undertake
    an extensive transequatorial migration, dispersing northward into the North Atlantic
    during the Northern Hemisphere''s summer and autumn. In Scandinavian and Northern
    European waters, Great Shearwaters are typically observed from late spring through
    autumn, with peak occurrence during summer months. They are absent during winter
    when they return to their Southern Atlantic breeding grounds, making them a regular
    seasonal visitor rather than a year-round resident.'
