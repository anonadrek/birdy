description:
  sv: ''
  en: '# Magnificent Frigatebird


    The magnificent frigatebird is the largest member of the frigatebird family, measuring
    89–114 centimetres in length with an impressive wingspan of 2.17–2.44 metres.
    Males are entirely black with a distinctive inflatable red throat pouch used during
    courtship displays, while females are larger with white underparts contrasting
    with their dark upperparts. It is one of the fastest birds in the world, capable
    of flying at speeds up to 153 kilometres per hour.


    This seabird is supremely adapted to aerial life, with long, angled wings and
    a deeply forked tail that make it extraordinarily manoeuvrable. It hunts by diving
    swiftly to snatch fish and squid from the water''s surface, and is also notorious
    for harassing other seabirds to force them to drop their catches—a behaviour called
    kleptoparasitism. The species is highly social and often seen in flocks.


    The magnificent frigatebird occurs over tropical and subtropical waters of the
    Americas, ranging from northern Mexico to Peru on the Pacific coast and from Florida
    to southern Brazil in the Atlantic. Populations also inhabit remote island groups
    in both oceans. It typically remains at sea but visits coastal areas and islands
    for breeding and roosting.'
migration:
  sv: ''
  en: '# Magnificent Frigatebird in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Magnificent Frigatebird is a tropical and subtropical seabird occurring primarily
    along American coasts and island populations in the Atlantic and Pacific. It does
    not naturally occur in Scandinavia or Northern Europe, as its range is restricted
    to warmer waters between Mexico and Brazil, and around the Galápagos and Cape
    Verde islands. There is no established migration pattern involving Northern European
    waters or seasonal occurrence in this region.'
