description:
  sv: '# Krushuvad pelikan


    Krushuvad pelikan är en stor vattenlevande fågel som tillhör familjen pelikaner.
    Det är en av världens största pelikanarter med en imponerande vingspännvidd. Fågeln
    har vit eller gråvit fjäderdräkt och karakteriseras av sin stora, långsträckta
    näbb med en stor hakvåt under, vilket är typiskt för pelikaner. Under häckningssäsongen
    kan det utveckla en karakteristisk krusning på huvudet och övre halsen, från vilket
    namnet kommer.


    Krushuvad pelikan förekommer främst i större vattendrag, sjöar och kustnära områden
    från östra Medelhavsregionen österut till Kina. Det är en fågel som lever i mindre
    kolonier och är starkt beroende av områden med rik fisktillgång. Under flygning
    framstår det som en imponerande silhuett med sitt stora näbb och vida vingar.
    Arten är ofta social och ses ofta i grupper, särskilt vid födosökning där det
    förlitar sig på att dyka och fånga fisk tillsammans med andra pelikaner.


    Krushuvad pelikan är relativt sällsynt inom sitt utbredningsområde och är klassificerad
    som sårbar på grund av habitatverlust och förlust av fiskbestånd.'
  en: '# Dalmatian Pelican


    The Dalmatian pelican is the largest member of the pelican family and among the
    heaviest flying birds in the world. It boasts an impressive wingspan of 2.7 to
    3.2 metres, making it one of the largest soaring birds. Despite its considerable
    size, it demonstrates graceful, buoyant flight and typically travels in synchronised
    flocks, often moving in coordinated patterns across the sky.


    This species inhabits a vast range across Central Eurasia, extending from the
    eastern Mediterranean westward to the Taiwan Strait in the east, and from the
    Persian Gulf southward to Siberia in the north. It is a short-to-medium-distance
    migrant, moving between breeding grounds and overwintering areas with seasonal
    changes. The pelican''s large range encompasses diverse aquatic habitats, including
    coastal waters, large lakes, and river deltas where it hunts for fish.


    The plumage is predominantly white with pale grey markings on the wings. It shares
    the characteristic large bill and throat pouch typical of pelicans, which it uses
    to catch fish while diving or surface-feeding. The species is generally silent,
    though it occasionally produces guttural sounds at breeding colonies.'
