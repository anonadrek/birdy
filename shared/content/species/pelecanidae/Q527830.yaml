description:
  sv: ''
  en: '# Pink-backed Pelican


    The pink-backed pelican is a large waterbird belonging to the pelican family.
    It inhabits swamps and shallow lakes across Africa and southern Arabia, where
    it is a permanent resident and breeds in these wetland environments. The species
    was formerly present in Madagascar but is now extinct there.


    Like other pelicans, it is a substantial bird with the characteristic large bill
    and throat pouch used for catching fish. The plumage displays soft pink and white
    tones, particularly on the back, which gives the species its distinctive common
    name. It is a gregarious bird, often seen in flocks on open water where it hunts
    cooperatively with other pelicans.


    The pink-backed pelican feeds primarily on fish, which it catches by diving or
    dabbling at the water''s surface. It prefers shallow waterways where prey is abundant
    and accessible. These pelicans are social breeders, typically nesting in large
    colonies in trees or on islands within their wetland habitats. The species remains
    fairly common throughout much of its African range, though specific population
    trends vary by region.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Pink-backed Pelican is an African and southern Arabian species with no established
    presence or migration patterns in Scandinavia or Northern Europe. It is a resident
    breeder in African wetlands and does not occur in northern European regions throughout
    the year.'
