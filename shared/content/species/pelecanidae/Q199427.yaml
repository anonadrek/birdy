description:
  sv: ''
  en: '# Great White Pelican


    The great white pelican is one of the largest pelican species, featuring predominantly
    white plumage with black flight feathers visible when the wings are spread. During
    breeding season, adults develop subtle peachy or rosy tinges on their plumage,
    particularly around the head and neck. The bird''s most distinctive feature is
    its enormous pale bill with a large expandable pouch beneath, used for scooping
    fish from the water.


    These pelicans are highly social birds, often seen in flocks both on the water
    and in flight. They are strong, buoyant fliers that ride thermal currents with
    minimal effort. They breed colonially in swamps and shallow lakes across southeastern
    Europe, Asia, and Africa, nesting on the ground or in trees depending on the habitat.
    During breeding season, they gather in large congregations where they perform
    synchronized displays and communal fishing behaviours.


    The great white pelican is relatively quiet compared to other water birds, though
    it produces occasional croaks and grunts, particularly during breeding activities.
    Outside the breeding season, birds disperse to coastal and inland waterways where
    fish are abundant, making them fairly nomadic in their distribution patterns.'
migration:
  sv: ''
  en: '# Great White Pelican (Pelecanus onocrotalus) - Occurrence in Scandinavia/Northern
    Europe


    The Great White Pelican is an extremely rare vagrant to Scandinavia and Northern
    Europe. This species breeds in southeastern Europe, Asia, and Africa, far south
    of the region''s typical range. While occasional individuals have been recorded
    in northern European countries during migration periods, these are exceptional
    sightings rather than regular occurrences. The species does not establish breeding
    populations or regular wintering grounds in Scandinavian waters. Any observations
    in the region represent significant ornithological records and are typically documented
    as rare wanderings during spring or autumn migration, when birds may disperse
    northward from their core breeding and wintering areas.'
