description:
  sv: '# Svartvit stare


    Svartvit stare är en asiatisk stare inom familjen starar. Arten förekommer huvudsakligen
    i Sydasien, särskilt i Indien och Myanmar. Historiskt räknades östligare populationer
    till samma art, men dessa utgör numera egna arter – thaistare och jallastare.
    Svartvit stare har också introducerats till flera andra regioner, däribland Arabiska
    halvön, Taiwan och Japan, där den nu är etablerad.


    Denna stare är en fågel som är väl anpassad till både naturliga och människopåverkade
    miljöer. Det är en gregär art som ofta ses i flockar, speciellt under utanför
    häckningstiden. Arten är relativt allmän inom sitt naturliga utbredningsområde
    och har visat god anpassningsförmåga till sitt införda utbredningsområde.


    *Baserat på information från Wikipedia är detaljerna om utseende, röst och beteende
    begränsade i källtexten.*'
  en: '# Indian Pied Myna


    The Indian pied myna is a starling found across the Indian subcontinent. It displays
    striking black and white plumage that distinguishes it from related species. This
    bird typically moves about in small flocks rather than alone, showing a preference
    for open terrain on plains and low foothills where it forages for food.


    The species readily adapts to human settlements and is frequently observed in
    and around cities and villages. However, it is notably more cautious than the
    common myna and does not venture as boldly into urban environments. It produces
    a variety of calls characterized by liquid notes, contributing to the soundscape
    of its habitat.


    The Indian pied myna occupies a similar ecological niche to other mynas across
    its range but maintains distinct behavioral differences. Its association with
    open country and settlement edges, combined with its gregarious nature and distinctive
    vocalizations, makes it a recognizable member of the starling family throughout
    the Indian subcontinent.'
