description:
  sv: '# Svartstare


    Svartstare är en fågel i familjen starar som är nära släkt med den vanligare staren.
    Den förekommer i sydvästra Europa och nordvästra Afrika samt på flera öar i Medelhavet.
    Fågeln är en medelstor stare med helt svart fjäderdräkt utan vita fläckar, vilket
    särskiljer den från staren.


    Svartstaren lever i öppna och halvöppna landskap där den ofta ses i små flockar
    eller ensam. Den är en aktiv och livlig fågel som födosöker på marken eller i
    låg vegetation, där den letar efter insekter och annat föda. Som många starar
    är det en högljudd fågel med varierad sång och olika läten.'
  en: '# Spotless Starling


    The spotless starling is a medium-sized passerine closely related to the common
    starling but with a distinctly more limited range. It inhabits the Iberian Peninsula,
    northwestern Africa, southernmost France, and the Mediterranean islands of Sicily,
    Corsica, and Sardinia. Unlike its widespread relative, the spotless starling is
    largely non-migratory, remaining in its territories year-round.


    As its name suggests, the spotless starling lacks the white spotting characteristic
    of common starlings, displaying instead plumage that is predominantly glossy black.
    This feature makes it relatively straightforward to distinguish from similar species
    within its range. The bird shares many behavioral traits with common starlings,
    being gregarious and adaptable to various habitats, though details of its specific
    calls and social behaviors warrant closer observation in the field.'
migration:
  sv: 'sv: Migrationsdata saknas för denna art.


    en: Migration data unavailable for this species.'
  en: '# Spotless Starling in Northern Europe


    The Spotless Starling is not a regular occurrence in Scandinavia or Northern Europe.
    This species is largely non-migratory and maintains a restricted year-round range
    in the Mediterranean region, including the Iberian Peninsula, Northwest Africa,
    southern France, and islands such as Sicily, Corsica, and Sardinia. Any sightings
    in Scandinavian or Northern European countries would be exceptional vagrants far
    outside the species'' normal range. Birdwatchers in these regions should not expect
    to encounter this species during any season.'
