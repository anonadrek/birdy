description:
  sv: '# Brinkmajna


    Brinkmajna är en sydasiatisk starl som har etablerat sig även i Kuwait. Fågeln
    har fått sitt namn från sin karakteristiska häckningsvana – den bygger sina bon
    i flodnära sandbankar, där den gräver hålor för sitt boende.


    Arten tillhör stlarfamiljen och förekommer främst i låglänta områden nära vattendrag.
    Brinkmajnan är anpassad för ett liv längs floder och bäckar, där den hittar både
    föda och lämpliga häckningsplatser i sandiga sluttningar. Arten är en del av de
    många starar som finns i sydasien och representerar en intressant exempel på en
    fågel som är helt beroende av specifika habitattyper för sin reproduktion.'
  en: '# Bank Myna


    The bank myna is a small starling found across the northern plains of South Asia,
    with its range gradually extending southwards. It closely resembles the common
    myna but is noticeably smaller and greyer on the underside. The most distinctive
    feature is the brick-red naked skin patch behind its eyes, contrasting sharply
    with the yellow patch found on the common myna. It also shows a slight tuft of
    feathers, giving it a subtle resemblance to the jungle myna.


    Bank mynas are highly social birds, typically seen in flocks on open plains, often
    within towns and cities where human settlements provide suitable habitats. They
    are most famous for their remarkable nesting behaviour: they excavate burrows
    into the earthen banks of rivers and breed together in large colonies. This colonial
    nesting habit is the origin of their common name.


    The species remains relatively common across its range in northern and central
    India, making it a familiar sight to birdwatchers in suitable habitat.'
