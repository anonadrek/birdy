description:
  sv: ''
  en: '# Brahminy Starling


    The Brahminy Starling is a member of the starling family found across the Indian
    subcontinent. It typically occurs in open habitats on plains, where it is usually
    observed in pairs or small flocks rather than solitary individuals or large groups.


    This starling prefers relatively open terrain where it can forage on the ground
    and in low vegetation. Its social behaviour of staying in small groups makes it
    moderately conspicuous in its preferred habitats, though it is not as gregarious
    as some other starling species.


