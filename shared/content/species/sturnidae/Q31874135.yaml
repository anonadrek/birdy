description:
  sv: '# Vinmajna


    Vinmajna är en medlemi familjen starar och utgör en nyligen urskild art som tidigare
    klassificerades som underart till Acridotheres burmannicus. Det är en medelstor
    stare med karakteristiska drag som särskiljer det från närbesläktade arter.


    Arten förekommer i olika habitat där det förlitar sig på sitt typiska starbeteende.
    Som övriga majna är det en mycket social fågel som ofta ses i flockar, särskilt
    utanför häckningssäsongen. Det är främst en boende i låglandet och förekommer
    i varierade miljöer där det söker föda tillsammans med andra individer av samma
    eller närbesläktade arter.


    För den intresserade fågelbeskådaren kan vinmajna vara en spännande observation,
    särskilt när man studerar de olika majnaarterna och deras utbredning. Artseparationen
    från burmannusmajan är relativt ny, vilket gör denna fågel till ett viktigt exempel
    på hur vetenskaplig förståelse för arter utvecklas över tid.'
  en: ''
