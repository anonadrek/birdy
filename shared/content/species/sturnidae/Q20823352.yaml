description:
  sv: '# Rosenstare


    Rosenstaren är en medelstor stare som tillhör familjen starar. Fågeln är en flyttfågel
    som normalt förekommer på stäpper och i halvöken öster om Svarta havet ner till
    Tien Shan-bergen. Under vintermånaderna söker den sig framförallt till Indien
    och tropiska Asien för att övervintra.


    Arten är klassificerad som livskraftig enligt IUCN:s värdering, vilket indikerar
    att populationen är stabil och inte hotas av utdöende. Rosenstaren är väl anpassad
    till sitt biotopval i öppna och halvöppna landskap där det finns tillräckligt
    med föda och häckningsplatser.'
  en: '# Rosy Starling


    The rosy starling is a striking passerine belonging to the starling family, distinguished
    by its distinctive plumage that combines black and soft rose-pink coloration.
    It was recently elevated to its own monotypic genus, Pastor, following genetic
    studies that separated it from the genus Sturnus, though the full extent of its
    closest relatives remains uncertain.


    Like other starlings, the rosy starling is a gregarious and active bird, often
    seen in small to large flocks during migration and winter. It forages on the ground
    and in trees, feeding opportunistically on insects, seeds, and fruits depending
    on seasonal availability. The species is generally vocal, producing a variety
    of chattering calls and song phrases typical of starlings, though less musical
    than some relatives.


    The rosy starling breeds across parts of southeastern Europe and Asia, with populations
    showing considerable year-to-year variation in breeding range and abundance. During
    migration and winter, it ranges more widely across Asia and occasionally reaches
    Europe. The species favours open and semi-open habitats including grasslands,
    agricultural areas, and scrubland, where it can be encountered singly or in impressive
    flocks alongside other starling species.'
migration:
  sv: '# Rosenstare – Förekomst i Skandinavien/Nordeuropa


    Rosenstaren är en flyttfågel som normalt inte häckar i Skandinavien eller Nordeuropa,
    utan är huvudsakligen utbredd på stäpper och i halvöken öster om Svarta havet.
    Under hösten migrerar arten söderut för att övervintra framför allt i Indien och
    tropiska Asien. Sporadiska observationer förekommer dock ibland i norra Europa
    under höstmigrationen, då individer förvandrar från sitt asiatiska utbredningsområde.
    Dessa är att betrakta som vaganter snarare än regelbundna besökare i regionen.'
  en: '# Rosy Starling in Northern Europe


    The Rosy Starling is an irregular vagrant to Scandinavia and Northern Europe,
    with no established resident or regular migratory population in the region. Records
    are sporadic and typically occur during late summer and autumn months (August–October),
    representing birds that have wandered northwestward from their primary breeding
    range in Central Asia and wintering grounds in the Indian subcontinent. These
    appearances are unpredictable and may follow successful breeding seasons or periods
    of population expansion. The species does not form a regular part of the Scandinavian
    avifauna and should be considered a rare, occasionally recorded visitor rather
    than a predictable migrant.'
