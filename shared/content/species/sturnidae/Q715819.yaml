description:
  sv: '# Kinesisk majna


    Kinesisk majna är en medelstor stare från Asien som numera finns etablerad på
    flera platser världen över. Det är en kraftig fågel med mörk, nästan svart fjäderdräkt
    och en karakteristisk uppräst tofs på huvudet. Vita fläckar syns på vingarna,
    särskilt synliga då fågeln flyger. Det har gula ben och en gul ring runt ögat.


    Arten är mycket social och ses ofta i större eller mindre flockar, framför allt
    i bebyggelse och städer. Det är en aktiv fågel som rör sig på marken och i träd
    där det söker föda. Kinesisk majna är högljudd och producerar en rad skrapiga
    och olika läten.


    Arten förekommer huvudsakligen i urbana och halvöppna miljöer där det har kunnat
    etablera sig. Det var ursprungligen begränsat till Asien men har via transport
    med människor spridits till flera världsdelar.'
  en: '# Crested Myna


    The crested myna is a starling native to southeastern China and Indochina, instantly
    recognizable by the distinctive tuft of feathers on its forehead that gives the
    species its name. It is also known as the Chinese starling.


    As a member of the starling family, it shares typical starling characteristics,
    though specific details about its plumage, size, behaviour, and vocalizations
    are not available from the source provided. Interested observers wishing to learn
    more about this species'' appearance, feeding habits, social behaviour, and calls
    would benefit from consulting specialized regional bird guides or ornithological
    references focused on Asian starlings.


    The crested myna inhabits its native range in southeastern Asian regions where
    it can be encountered in appropriate habitats.'
