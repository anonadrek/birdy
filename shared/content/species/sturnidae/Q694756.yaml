description:
  sv: '# Ametiststare


    Ametiststare är en liten och färgglad medlem av starfamiljen som förekommer i
    Afrika söder om Sahara samt på delar av Arabiska halvön. Fågeln är mycket vacker
    med sitt distinktiva utseende.


    Denna art är vanligt förekommande i sitt utbredningsområde och är därför inte
    svårt att se för den som vistas rätt plats. Som medlem av starfamiljen delar den
    många typiska drag med sina släktingar, inklusive sitt beteende och levnadssätt.


    För den som är intresserad av att möta ametiststaren rekommenderas det att söka
    upp lämpliga habitat inom dess kända utbredningsområde i Afrika söder om Sahara.'
  en: '# Violet-backed Starling


    The violet-backed starling is a small, strikingly beautiful starling measuring
    just 17 cm. It is highly sexually dimorphic: males display a brilliant iridescent
    violet-blue back, head, and wings, contrasting sharply with a white belly, while
    females are more subdued with olive-brown upperparts and white underparts. It
    is the sole member of its genus.


    This species inhabits woodlands and savannah forest edges across mainland sub-Saharan
    Africa. It is rarely encountered on the ground, preferring to feed and perch in
    trees and elevated locations. The violet-backed starling is typically seen moving
    through canopy and mid-storey levels, often in small groups or pairs.


    Little detail is provided in the source about its call and specific behaviour
    beyond its arboreal habits and ground avoidance, so these aspects warrant further
    research in field guides for complete identification in the field.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: '# Violet-backed Starling in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Violet-backed Starling is an African species found in sub-Saharan woodlands
    and savannah forest edges. It does not occur naturally in Scandinavia or Northern
    Europe, and therefore no migration patterns for this region can be documented.'
