description:
  sv: '# Stare (Sturnus vulgaris)


    Staren är Europas vanligaste och mest utbredda starart. Det är en mindre fågel
    än koltrast, med spetsiga vingar och mörk fjäderdräkt. I sommardräkt glänser fjädrarna
    metalliskt, vilket är ett utmärkande drag. Staren kan förväxlas med koltrast,
    men är mindre och har en helt annan kroppsform med spetsiga snarare än rundade
    vingspetsar.


    Det är en mycket ljudlig fågel, särskilt när den uppehåller sig i flockar. Sången
    är omusikalisk men väldigt varierad, och staren är känd för sin utmärkta förmåga
    att härma olika ljud från sin omgivning – en egenskap som omtalas redan i klassisk
    litteratur.


    Staren ses ofta öppet på gräsmattor och i samhällen och städer, där den livligt
    söker efter föda. Den är en högst anpassningsbar fågel som trivs väl nära människan
    och är framträdande i både lantliga och urbana miljöer.'
  en: '# Common Starling


    The Common Starling is a medium-sized black passerine about 20 cm long with a
    distinctive glossy plumage that shows a metallic sheen. Its appearance changes
    seasonally: in winter the black feathers are heavily speckled with white spots,
    while summer birds appear more uniformly dark. The legs are pink, and the bill
    shifts from black in winter to bright yellow in summer. Young birds are considerably
    browner than adults, making them easy to distinguish in mixed flocks.


    This species is renowned for its exceptional vocal abilities. It is a skilled
    mimic, capable of imitating other bird species and various sounds from its environment—a
    talent documented since ancient times in classical literature. Its natural calls
    include whistles and varied chattering notes, often delivered from prominent perches
    or in flight.


    Common Starlings are highly social and gregarious birds, typically seen in flocks
    that can number from small groups to massive congregations. They frequent open
    woodlands, parks, gardens, and urban areas, feeding on the ground where they probe
    and peck for invertebrates and seeds. The species is widespread and adaptable,
    thriving in both natural and human-modified landscapes.'
migration:
  sv: '**Staren i Skandinavien och Nordeuropa**


    Staren är en vanlig fågel i Skandinavien och Nordeuropa, men migrationsmönstret
    varierar mellan populationer. Många stärs som häckar i norra Skandinavien är flyttfåglar
    som överinterar längre söderut i Europa, medan populationer i södra Skandinavien
    ofta är stannfåglar eller delvis moves. Ankomsttiden för återvändande fåglar infaller
    vanligtvis i februari-mars, medan avflyttningen sker under augusti-september.
    Under vintermånaderna bildas stärs ofta stora sovsamlingar, särskilt i urban miljö
    där de utnyttjar byggnadernas värme.


    *Notering: Källtexten innehåller begränsad migrationsinformation. Denna text baseras
    på allmän kunskapsgrund om arten.*'
