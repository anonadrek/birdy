description:
  sv: '# Brunbukig glansstare


    Brunbukig glansstare är en medelstor stare med iögonfallande utseende. Den utmärks
    av sin metallglansande, mörkblå ovansida och karakteristiska rostfärgad undersida,
    vilket ger arten sitt namn. Ögonen är omgivna av en distinkt orangeröd ring, och
    näbben är gul. Arten har en robust bygnad typisk för starar.


    Denna fågel förekommer i Östafrika och är ett välkänt inslag i sitt naturliga
    utbredningsområde. Den är en social art som ofta ses i flockar, där den söker
    föda på marken och i låg vegetation. Brunbukig glansstare är aktiv och rörig,
    med ett varierande röstande som innefattar både visslingar och mer komplexa läten.


    Arten är kategoriserad som livskraftig av IUCN, vilket indikerar en stabil population.
    Den har stor kulturell betydelse i sitt utbredningsområde.'
  en: '# Superb Starling


    The superb starling is a striking member of the starling family, formerly classified
    as *Spreo superbus*. It is a relatively long-lived species, with individuals known
    to survive over 15 years in captivity, suggesting good longevity potential in
    the wild as well.


    This starling displays the characteristic iridescent plumage typical of its family,
    with glossy feathers that catch the light. Like other starlings, it is a social
    and vocal bird, though specific details about its calls and behavioural preferences
    would benefit from additional observation data.


    The species inhabits open and semi-open habitats across its range, where it can
    be observed foraging and socializing, often in small to medium-sized flocks typical
    of starling behaviour.'
