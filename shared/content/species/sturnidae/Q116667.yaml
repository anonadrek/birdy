description:
  sv: '# Brunmajna


    Brunmajna är en medelstor tätting med karakteristisk utseende. Den har mörkbrun
    fjäderdräkt med vita vingar- och stjärtpartier som blir särskilt tydliga under
    flykten. Arten har gult ansikte och orangefärgat näbbparti, vilket ger den ett
    distinktivt utseende jämfört med andra starar.


    Arten är högljudd och socialt levande, ofta förekommande i små flockar. Det är
    en anpassningsbar fågel som ursprungligen hemmahörde i öppna skogsområden i södra
    och sydöstra Asien, men som har visat stor förmåga att etablera sig i människodominerande
    miljöer. Idag ses brunmajna vanligt i parker och trädgårdar där den söker föda
    på marken eller bland träd.


    Brunmajna har introducerats till många världsdelar och etablerat sig i frilevande
    populationer långt bort från sitt ursprungliga utbredningsområde. Arten är känd
    för sitt bullriga beteende och sina varierande ljud som den använder inom flockens
    sociala interaktioner.'
  en: '# Common Myna


    The Common Myna is a medium-sized starling native to Asian open woodlands that
    has become highly successful in urban settings. It is an omnivorous bird with
    a strong territorial nature, readily adapting to human-dominated landscapes where
    it forages on the ground and in trees for insects, fruits, and seeds.


    The species is characterized by its brown plumage, distinctive yellow facial skin
    patches, and yellow legs, making it relatively easy to identify. It is a bold
    and gregarious bird, often seen in small flocks perched conspicuously on wires,
    rooftops, and trees. The Common Myna is notably vocal, producing a variety of
    loud, harsh calls and whistles that are characteristic of its confident, assertive
    behavior.


    As an adaptable generalist, the Common Myna thrives in parks, gardens, and cultivated
    areas throughout its native range in Asia. It has become increasingly common in
    urban and suburban environments, where it competes aggressively with other birds
    for food and nesting sites. Its combination of distinctive appearance, bold temperament,
    and vocal presence makes it a frequently observed garden visitor across much of
    Asia.'
