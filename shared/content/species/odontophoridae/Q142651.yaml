description:
  sv: '# Vitstrupig vaktel


    Vitstrupig vaktel är en medelstor vaktel inom familjen tofsvaktlar. Det är en
    markfågel med kompakt byggnad, karakteristisk rostbrun och svart teckning på huvudet.
    Hanen har en vit strupe och ögonbrynsstreck, medan honan är mer dov brunaktig.
    Det är en väldig liten fågel som håller sig huvudsakligen på marken.


    Arten är känd för sitt genomträngande och igenkännligt läte som låter som sitt
    namn "bob-white" - ett tvåstavigt visselpjussel som ofta hörs under paringssäsongen.
    Fågeln förekommer naturligt i större delar av ett stort geografiskt område, men
    har minskat märkbart i antal och klassificeras nu som nära hotad av IUCN. Den
    lever på öppen eller glest bevuxen mark där den söker föda på marken.


    Arten har introducerats på flera platser utanför sitt naturliga utbredningsområde,
    och självförsörjande populationer har etablerats på vissa lokaler. Det är en boende
    fågel som ses året runt på lämpliga lokaliteter.'
  en: '# Northern Bobwhite


    The northern bobwhite is a ground-dwelling quail native to North America, with
    its range extending from Canada through the United States and Mexico to Cuba.
    Despite belonging to the New World quail family, it differs markedly from Old
    World quails and pheasants. The bird''s common name derives directly from its
    distinctive, clear whistling call—a loud "bob-white" that carries across open
    habitats and is one of the species'' most recognizable features.


    Though secretive by nature, the northern bobwhite remains one of the most familiar
    quails in eastern North America, largely because it is often the only quail species
    present in its range. It frequents grasslands, brushy areas, and open woodlands
    where it can forage on the ground for seeds and invertebrates.


    Unfortunately, the species has faced significant population declines over recent
    decades. Habitat degradation and loss have caused northeastern populations to
    drop by approximately 85% between 1966 and 2014, with this decline continuing
    across its entire range. Conservation of open grassland habitats is critical for
    the species'' long-term survival.'
