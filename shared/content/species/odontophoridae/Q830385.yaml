description:
  sv: '# Kalifornientofsvaktel


    Kalifornientofsvaktel är en medelstor vaktel från familjen tofsvaktlar. Den är
    lätt igenkännlig på sin karakteristiska huvud­topp – en framåtlutande fjäderbunt
    som framför allt är framträdande hos hannarna. Fjäderdräkten är övervägande gråbrun
    med en distinktivy svart och vit huvudteckning. Undersidan är ljusare, ofta med
    rostfärgade toner på sidan.


    Arten är aktiv på marken och lever gärna i tät vegetation och busmark. Det är
    en social fågel som ofta ses i mindre flockar, särskilt utanför häckningstiden.
    Kalifornientofsvaktel matar sig på frön, gräs och insekter som det plockar upp
    från marken.


    Arten häckar naturligt i västra Nordamerika, men har introducerats och förvildats
    på flera andra håll i världen. Den föredrar semi-öppna landskap med låg vegetation
    och buskap.'
  en: '# California Quail


    The California quail is a small, plump ground-dwelling bird easily identified
    by its distinctive forward-drooping crest of six feathers. Males are strikingly
    marked with a dark brown cap, black face, grey-blue chest, and light brown belly,
    while females and immatures are duller grey-brown overall. Both sexes display
    brown flanks with white streaks. The species is closely related to Gambel''s quail,
    which occupies more southerly regions and sports a longer, brighter crest without
    the California quail''s characteristic scaly appearance.


    These social birds are typically found in small groups, foraging on the ground
    for seeds, plants, and insects. They prefer scrubby, open habitats with scattered
    cover where they can move between feeding and roosting areas. California quails
    are relatively sedentary, though they may move locally in response to seasonal
    changes.


    The species is vocal, with males producing a distinctive three-note call that
    sounds like "chi-ca-go." This call is particularly prominent during breeding season.
    The quail''s ground-nesting habits and preference for open country make it adaptable
    to various habitats from coastal scrub to chaparral foothills. Its popularity
    as both a game bird and symbol—it was designated the state bird of California
    in 1931—reflects its cultural significance to the region.'
