description:
  sv: ''
  en: '# Crab-plover


    The crab-plover is a distinctive coastal wader occupying its own genus and family,
    making it a remarkable bird from a taxonomic perspective. It stands apart from
    typical waders by being more closely related to gulls and auks than to plovers
    and sandpipers, despite its common name. This unusual classification reflects
    unique characteristics that set it apart in the shorebird world.


    One of the most fascinating aspects of the crab-plover''s biology is its reproductive
    strategy. Unlike most other waders, it employs geothermal energy to incubate its
    eggs, utilizing ground warmth rather than relying solely on parental body heat.
    This adaptation suggests the species has evolved specialized breeding behaviors
    suited to its coastal habitat.


    As a coastal specialist, the crab-plover frequents shorelines and tidal areas
    where it forages for food. While detailed descriptions of its appearance and vocalizations
    would benefit from additional sources, its monotypic status—being the sole member
    of both its genus and family—underscores its evolutionary significance and distinct
    ecological niche among the world''s waders.'
