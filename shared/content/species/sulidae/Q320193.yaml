description:
  sv: ''
  en: '# Brown Booby


    The brown booby is one of the most common and widespread seabirds in tropical
    waters worldwide. A large member of the booby and gannet family, it is highly
    gregarious and typically seen foraging in flocks over inshore waters at low altitude.
    The species is an accomplished plunge-diver, dropping spectacularly from the air
    to catch small fish, particularly when prey is driven to the surface by larger
    predators.


    Brown boobies have distinctive appearance with contrasting dark upperparts and
    pale underparts. Their behavior is notably different from some relatives—they
    commute and forage close to the water rather than far offshore, making them relatively
    accessible for observation. Unlike other boobies, they nest exclusively on the
    ground and prefer to roost on solid structures such as rocks, posts, or mangroves
    rather than resting on the water surface.


    These highly social birds are often encountered in small to large flocks, especially
    in areas with productive fishing grounds. Their combination of accessibility,
    communal habits, and acrobatic hunting style makes the brown booby a rewarding
    species for seabird enthusiasts to observe and study.'
migration:
  sv: ''
  en: '# Brown Booby (Sula leucogaster) in Northern Europe


    Migration data unavailable for this species.


    The Brown Booby has a pantropical range and does not occur naturally in Scandinavia
    or Northern Europe. This species is a tropical and subtropical seabird found in
    warm ocean waters around the equator and between the Tropics of Cancer and Capricorn.
    It does not migrate to or overwinter in Scandinavian or Northern European waters,
    as these regions fall far outside its normal geographic distribution and climatic
    requirements.'
