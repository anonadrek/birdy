description:
  sv: ''
  en: '# Masked Booby


    The masked booby is the largest member of the booby family, reaching 75–85 cm
    in length. It displays striking plumage: bright white body contrasting sharply
    with black wings, black tail, and a distinctive dark face mask. The long, pointed
    yellowish bill, elongated neck, and slender wings are typical features of the
    booby family, giving it a streamlined appearance perfectly adapted for diving.


    This seabird is found across tropical oceans worldwide, though it is absent from
    the eastern Atlantic and eastern Pacific regions. It is a highly specialized marine
    hunter, diving dramatically from the air to catch fish and squid. The masked booby''s
    behaviour is typically pelagic, spending much of its time at sea, though it returns
    to land for breeding.


    The sexes look identical, making field identification straightforward once the
    bird is observed. Its distinctive appearance—the dark face mask particularly striking
    against the white head and body—makes it readily recognizable among other boobies.
    The masked booby''s combination of size, striking coloration, and elegant proportions
    mark it as one of the ocean''s most impressive diving seabirds.'
