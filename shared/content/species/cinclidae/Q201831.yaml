description:
  sv: '# Strömstare


    Strömstaren är en karakteristisk fågel vid rinnande vatten, där den är känd för
    sin unika förmåga att både simma och dyka bland täthingarna. Den förekommer utbredd
    i Europa samt i bergstrakter i västra och centrala Asien. Fågeln är anpassad för
    liv vid forsar och fall, där den hittar sin föda i de snabbrinnande bäckar och
    älvar den bebor.


    Arten är enligt IUCN klassificerad som livskraftig med stabila populationer. Strömstaren
    är en fullt kompetent undervattensdykare som använder både vingar och ben för
    att röra sig under vattnet när den söker föda bland stenarna på botten. Dess wasserfödda
    andedräkt och robusta byggnad gör den väl anpassad för denna levnadsväg i kalla,
    turbulenta vattendrag.'
  en: '# White-throated Dipper


    The white-throated dipper is a stocky, aquatic passerine found across Europe,
    the Middle East, Central Asia, and the Indian subcontinent. It is characterized
    by its compact build and distinctive plumage, which varies among several subspecies,
    particularly in the coloration of the pectoral band across its chest.


    This dipper is highly specialized for an aquatic lifestyle, often observed foraging
    in fast-flowing streams and rivers. It is renowned for its ability to walk underwater
    on the riverbed while searching for invertebrate prey. The species has a characteristic
    bobbing behavior and moves with considerable agility both in and out of water.


    The white-throated dipper''s call is a sharp, metallic sound, which it uses to
    communicate with other individuals. It is typically seen singly or in pairs along
    suitable waterways, particularly in upland and mountainous regions where clear,
    well-oxygenated water is abundant.'
migration:
  sv: '# Strömstare - Förekomst i Norden


    Strömstare är en året runt närvarande art i Skandinavien och Nordeuropa, även
    om populationerna är något mindre talrika under vintermånaderna. Arten är starkt
    bunden till rinnande vatten med forsar och fall, där den kan hitta öppet vatten
    även under kallaste vintrar. I södra Skandinavien är strömstaren huvudsakligen
    stationär, medan populationer från norra delen av utbredningsområdet kan göra
    kortare flyttningar söderut under hårdare vintrar. Arten återkommer till sina
    häckningsvatten redan från senare delen av februari och mars när ismjölkningen
    sätter i gång.'
  en: '# White-throated Dipper (Cinclus cinclus) in Scandinavia/Northern Europe


    The White-throated Dipper is a year-round resident throughout much of Scandinavia
    and Northern Europe, though populations show altitudinal and local movements.
    Northern populations may partially migrate southward during winter months when
    waters freeze, while birds in milder regions remain largely sedentary. In Scandinavia,
    dippers are found along fast-flowing rivers and streams where they maintain territories
    year-round, relying on unfrozen sections for feeding. They typically return to
    established breeding territories from February onwards, initiating breeding by
    March or April depending on latitude and weather conditions.'
