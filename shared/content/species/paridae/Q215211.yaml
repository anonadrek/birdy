description:
  sv: '# Talltita


    Talltita är en liten mes som är vida spridd över Europa och norra Asien, med undantag
    för sydvästra delarna av kontinenten. Fågeln är mycket svår att skilja från sin
    närbesläktade släkting gransisen, och båda arterna är ofta mycket likartade i
    sitt utseende.


    Talltitan föredrar att vistas i mindre skogar med björk och asp, där den gärna
    söker föda bland grenarna och på marken. Under häckningsperioden gräver den själv
    sitt eget hål i mjuka stubbar eller döda träd, vilket skiljer den från många andra
    mesarter. Arten är relativt dold till sin natur och kan vara svår att få syn på
    trots sitt begränsade utbredningsområde.


    Fågeln är främst iakttagbar i norra och centrala områden med lämplig habitat,
    framför allt i fuktig skogsmark.'
  en: '# Willow Tit


    The willow tit is a small songbird with distinctive grey-brown and off-white plumage,
    marked by a black cap and bib. It closely resembles the marsh tit but shows a
    preference for coniferous forests, allowing it to breed farther north across temperate
    and subarctic regions of Europe and the Palearctic. Most populations are resident
    year-round, with birds remaining in their territories rather than migrating seasonally.


    This species is well-adapted to life in conifers and other wooded habitats where
    it forages for insects and seeds. It is a common and widespread breeder throughout
    its range, making it a familiar bird to observers in suitable woodland environments.
    The willow tit''s ability to thrive in northern forests reflects its ecological
    specialization compared to related species, establishing it as an important member
    of boreal and temperate woodland bird communities.'
migration:
  sv: Talltita är en året runt närvarande art i Skandinavien och övriga Nordeuropa.
    Arten är stationär och genomför ingen längre migration, utan övervintar inom sitt
    utbredningsområde. Talltitan förekommer ganzåret i barr- och blandskogar från
    låglanden upp till bergsregioner. Under hösten och vintern kan lokala rörelser
    förekomma när fåglarna söker föda, men arten återvänder till sina revir för häckningen.
    Populationen i Norden är därför relativt stabil under alla årstider.
  en: '# Willow Tit in Northern Europe


    The Willow Tit is a resident species throughout Scandinavia and northern Europe,
    with most populations remaining year-round in their breeding territories. Unlike
    many other northern passerines, the Willow Tit does not undertake significant
    migration, instead staying put through winter months. This non-migratory behavior
    is facilitated by the species'' adaptation to coniferous forests, where it can
    find sufficient food resources during harsh winters. Some populations may show
    limited local movements in severe winters, but these are not true migrations.
    The species is a widespread and common breeder across temperate and subarctic
    Europe, establishing permanent or semi-permanent territories that birds defend
    throughout the year.'
