description:
  sv: '# Hyrkanmes


    Hyrkanmes är en liten mes inom familjen mesar som urskiljer sig från närbesläktade
    arter genom sitt utseende, läten och genetisk bakgrund. Den är närmare släkt med
    arter som talltita och entita än med balkanmesen, vilken den tidigare klassificerades
    som underart till.


    Arten förekommer endast i berglövskogar i begränsade områden i norra Iran och
    närliggande Azerbajdzjan, där den är anpassad till sin speciella bergiga miljö.
    Det är en fågel för den som söker efter mindre utforskade arter i sitt område.'
  en: '# Caspian Tit


    The Caspian tit is a small passerine bird belonging to the tit family. It is one
    of the most range-restricted tit species, with its population concentrated in
    the deciduous mountain forests of a specific region, with only limited extension
    beyond its core range. This restricted distribution makes it a particularly noteworthy
    species among tit species worldwide.


    The bird inhabits deciduous mountain forests in its native range. Its specialized
    habitat preferences and limited geographic range mean it is encountered only in
    a specific forest ecosystem. The species'' dependence on these particular forest
    conditions has shaped its population distribution and makes it an important indicator
    of forest health in its region.


    Due to its highly restricted range and specialized habitat requirements, the Caspian
    tit remains relatively poorly known compared to more widespread tit species. Its
    conservation status reflects the significance of protecting the deciduous mountain
    forests upon which it depends for survival.'
