description:
  sv: ''
  en: '# Marsh Tit


    The marsh tit is a small Eurasian songbird measuring around 12 cm long and weighing
    just 12 grams. It is easily identified by its distinctive black crown and nape
    contrasting with pale cheeks, combined with a brown back and greyish-brown wings
    and tail. This compact bird belongs to the tit family and is closely related to
    several other Poecile species, including the willow tit.


    The marsh tit can be challenging to distinguish from the willow tit, particularly
    in northern regions where the two species are strikingly similar in appearance.
    Historically, they were not recognized as separate species until 1897. Between
    8 and 11 subspecies are recognized across its Eurasian range, with plumage varying
    slightly between populations.


    The species inhabits deciduous and mixed woodlands, reed beds, and scrubby areas
    where it forages actively among vegetation. It shares similar behaviour and ecological
    preferences with its close relatives, though specific details about its call and
    feeding habits would provide additional insight into distinguishing it from congeners
    in the field.'
migration:
  sv: ''
  en: '# Marsh Tit in Northern Europe


    The Marsh Tit is a year-round resident throughout much of Scandinavia and Northern
    Europe, with populations showing limited migration. Birds in northern regions
    may undertake partial migrations during harsh winters, moving southward to milder
    areas, while populations in southern Scandinavia tend to be largely sedentary.
    The species favors wetland habitats with dense vegetation, where it remains present
    throughout the year, though local movements can occur in response to food availability
    and winter severity. Northern populations may show increased movement between
    October and March.'
