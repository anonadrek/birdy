description:
  sv: '# Svartmes


    Svartmes är en liten mes som förekommer över stora delar av Europa och Asien.
    Det är en typisk barrskogsfågel som trivs särskilt bra i skogar med gran och tall,
    men återfinns även i blandad skog och parker med barrträd.


    Arten är lätt att identifiera på sitt karakteristiska utseende med svart huvud
    och vita fläckar på nacken, vilket ger det ett distinkt mönster. Det har också
    vita kinder och en vit streck längs ryggen. Kroppen är grå och undersidan ljus.
    Svartmesen är aktiv och rörig, ofta i små flockar, särskilt under höst och vinter.
    Det söker föda bland grenarnas yttre delar och är skickligt på att hämta små insekter
    och frön.


    Kallelsen är karakteristisk och tvådelad, ofta beskriven som "si-si" eller liknande
    ljud. Det varierar sitt läte och kan höras året runt.'
  en: '# Coal Tit


    The coal tit is a small passerine belonging to the tit family, Paridae. It is
    a widespread and common resident breeder found throughout forests across the temperate
    to subtropical Palearctic region, including North Africa. The species was formerly
    separated from the black-crested tit, which is now recognized as part of this
    species.


    The coal tit is characterized by its distinctive plumage, featuring dark upperparts
    contrasted with lighter underparts. It inhabits wooded areas where it forages
    actively among branches and foliage, often joining mixed feeding flocks during
    winter months. The bird is highly mobile and acrobatic, using its relatively short
    tail for balance as it searches for insects and seeds.


    In its preferred forest habitats, the coal tit plays an important ecological role
    as both insectivore and seed disperser. Its behavior reflects adaptability to
    various woodland types, from dense coniferous and mixed forests to more open deciduous
    woodlands. The species remains a familiar sight to birdwatchers across its extensive
    range wherever suitable forested habitat persists.'
migration:
  sv: '# Svartmes – säsongsvistelse i Norden


    Svartmesen är en stannfågel som förekommer året runt i Skandinavien och Nordeuropa,
    där den är bosatt i barrskogsmiljöer. Under vintermånaderna är populationen ofta
    något större än under sommaren, delvis på grund av invandring från östra delen
    av sitt utbredningsområde. Fågeln är mycket mobil och genomför omfattande lokala
    förflyttningar under höst och vinter, då den söker mat i olika skogshabitat. Även
    om den är en etablerad standare följer den inte en strikt migration utan förflyttar
    sig snarare beroende på födotillgång.'
  en: '# Coal Tit (Periparus ater) in Northern Europe


    The Coal Tit is a year-round resident throughout Scandinavia and Northern Europe,
    where it breeds in coniferous and mixed forests. Unlike many passerines, this
    species does not undertake long-distance migrations and remains present during
    winter months. Populations may show local movements and altitudinal shifts in
    response to food availability and harsh weather conditions, but birds generally
    stay within or near their breeding territories year-round. The species is well-adapted
    to northern winters, utilizing its behavior of caching seeds for survival during
    periods of food scarcity.'
