  en: '# African Blue Tit (Cyanistes teneriffae) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The African Blue Tit is not a regular occurrence in Scandinavia or Northern Europe.
    This species is endemic to northern Africa, Pantelleria in Italy, and the Canary
    Islands, with established populations on Tenerife and Gran Canaria. It inhabits
    temperate forests within its range but does not have documented migration patterns
    involving Scandinavian or broader Northern European regions. Any sightings in
    northern latitudes would represent exceptional vagrants rather than regular seasonal
    movements.'
