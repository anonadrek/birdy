description:
  sv: '# Koboltmes


    Koboltmes är en liten mesar som är närbesläktad med blåmesen. Det kännetecknas
    av sin blå och gul färgsättning, liknande blåmesen men med egna särdrag. Arten
    är relativt liten och behändig, väl anpassad för att röra sig mellan grenar och
    vegetation.


    Arten förekommer i Nordafrika och i Kanarieöarna, där det lever i olika habitattyper.
    Det är en aktiv fågel som ofta ses söka föda bland löv och kvistar. Som andra
    mesar är koboltmes en social fågel som kan förekomma ensam eller i små grupper.


    Beståndet av koboltmes anses vara livskraftigt, och arten klassificeras inte som
    hotad. Arten urskildes länge som en del av blåmesen men behandlas numera vanligen
    som egen art baserat på sitt eget utseende och sitt utbredninsområde.'
  en: '# African Blue Tit


    The African blue tit is a small member of the Paridae family found in temperate
    forest habitats across northern Africa and certain Mediterranean islands. It closely
    resembles the Eurasian blue tit but was recognized as a distinct species relatively
    recently, having previously been classified together with its European counterpart.


    This species is particularly noted for its island populations, which have made
    it valuable for evolutionary research. It remains common in its range, especially
    on the larger islands where it inhabits suitable woodland environments. The bird''s
    accessible populations have attracted considerable scientific attention, contributing
    to broader understanding of how island species develop and adapt over time.


    Like other tits, the African blue tit is an active, social bird of forested areas,
    though detailed information about its specific plumage patterns, vocalizations,
    and behavioral characteristics would benefit from direct field observation.'
