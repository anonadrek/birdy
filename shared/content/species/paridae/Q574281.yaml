description:
  sv: '# Balkanmes


    Balkanmes är en medlem av mesfågelfamiljen som förekommer i sydöstra Europa och
    sydvästra Asien. Den är anpassad till varierade habitat och återfinns i bergsskogar,
    buskmarker, olivlundar och fruktträdgårdar. Arten är något mindre utpräglad än
    många andra mesar när det gäller ljud och beteende – den är relativt tystlåten
    och tillbakadragen jämfört med sina släktingar.


    Som medlem av mesfamiljen är balkanmes en liten, aktiv fågel. Den födosöker ofta
    metodiskt i växtligheten och är dock inte lika högljudd eller iögonenfallande
    som många andra mesfåglar. Denna större diskrethet gör den mindre påtaglig än
    exempelvis blåmes eller större mes, trots att den är närvarande i sitt utbredningsområde.


    IUCN klassificerar balkanmes som livskraftig, vilket indikerar att populationen
    är stabil och arten inte står inför några allvarliga hotkällor för närvarande.'
  en: '# Sombre Tit


    The Sombre Tit is a small passerine belonging to the tit family, closely related
    to other chickadees and tits found across Europe and Asia. This species inhabits
    the southeastern parts of Europe and extends into southwest Asia, where it occupies
    mixed and deciduous woodlands, particularly in mountainous regions.


    In appearance, the Sombre Tit resembles other members of its family, though it
    displays subtle characteristics that distinguish it from related species. Like
    typical tits, it is compact and active, moving through trees with agility as it
    forages for insects and seeds.


    The species is generally quiet compared to some of its relatives, though it does
    produce various calls used for communication with other members of its species.
    It is typically seen in small groups, especially outside the breeding season,
    gleaning food from bark and foliage. The Sombre Tit remains relatively inconspicuous
    in its preferred habitats, making it a species that requires patience and careful
    observation to locate and study in the field.'
