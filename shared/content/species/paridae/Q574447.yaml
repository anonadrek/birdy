description:
  sv: '# Lappmes


    Lappmes är en liten mesart som skiljer sig från sina släktingar genom sitt nordligaste
    utbredningsområde. Det är dessutom den enda mesarten som förekommer på tre kontinenter
    – Europa, Asien och Nordamerika. Arten är anpassad för de hårda klimatförhållandena
    i norr och har utvecklat strategier för att överleva de långa, kalla vintrar.


    Fågeln förekommer främst i gammal, gles barrskog där det finns gott om döda träd
    och stubbar som erbjuder mat och häckningsplatser. Den återfinns också i fjällbjörkskog
    i mindre omfattning. Arten är utpräglad nordlig och söks där villkoren är lämpliga
    för sina speciella habitat-krav.


    Beståndet av lappmes minskar gradvis, men på global nivå bedöms arten fortfarande
    vara livskraftig och långsiktigt stabil. Det minskande antalet kan förklaras av
    förändringar i skogshabltaten och klimatförändringarna som påverkar dess nordiska
    utbredningsområde.'
  en: '# Grey-headed Chickadee


    The grey-headed chickadee, also known as the Siberian tit, is a small passerine
    belonging to the tit family. It is a specialist of coniferous forests, inhabiting
    subarctic regions across Scandinavia and the northern Palearctic, with populations
    extending into northern North America. Unlike many northern birds, it is largely
    resident year-round, with most individuals remaining in their territories rather
    than migrating seasonally.


    This chickadee is well-adapted to harsh boreal conditions and is typically found
    in conifer-dominated habitats where it forages for food throughout the year. Its
    dependence on these specific forest types makes it an indicator species for the
    health of subarctic ecosystems. The species maintains relatively stable populations
    across its wide range, demonstrating its successful adaptation to some of the
    coldest inhabited regions in the Northern Hemisphere.'
migration:
  sv: '# Lappmes – Förekomst i Skandinavien och Nordeuropa


    Lappmes är en permanent bosatt art i Skandinavien och Nordeuropa. Fågeln är icke-flyttande
    och stannar året om i sitt utbredningsområde, främst i de nordligaste delarna
    av regionen där den förekommer i gammal, gles barrskog och fjällbjörkskog. Det
    finns ingen säsongsväxling i förekomsten – populationerna är stationära och flyttar
    inte längre söderut under vintermånaderna. Detta gör lappmes till en av få mesar
    som är väl anpassad för att övervintras under de hårdaste nordiska klimatförhållandena.'
  en: '# Poecile cinctus – Year-round Resident


    The grey-headed chickadee is a permanent resident throughout its Scandinavian
    range, showing little to no migratory behavior. This hardy species remains in
    subarctic Scandinavia and northern Palearctic regions year-round, maintaining
    stable populations despite harsh winter conditions. As a specialist of conifer
    forests, it is well-adapted to surviving cold winters in northern latitudes without
    the need for seasonal migration. Most individuals are sedentary, staying within
    their breeding territories throughout all seasons.'
