description:
  sv: ''
  en: '# Variable Wheatear


    The Variable Wheatear is a small songbird belonging to the flycatcher family.
    It inhabits arid and semi-arid regions across a vast range spanning from the Middle
    East through Central Asia and into the Indian subcontinent. The species favours
    rocky hillsides, mountainous terrain, and desert margins where sparse vegetation
    provides suitable habitat.


    This wheatear is an active, ground-dwelling bird that forages for insects and
    small invertebrates. It typically perches on rocks or low vantage points, from
    which it watches for prey or potential threats. The bird''s behaviour reflects
    its adaptation to open, exposed landscapes where visibility is essential for survival.


    The Variable Wheatear''s call is characteristic of its family, delivering sharp,
    distinctive notes that carry well across open ground. Like other wheatears, it
    tends to be alert and wary, often taking flight when disturbed. The species is
    found across its broad geographic range in suitable habitat, though specific populations
    may be migratory or resident depending on local conditions and seasonal food availability.'
