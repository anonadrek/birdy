description:
  sv: ''
  en: '# African Stonechat


    The African stonechat is a small Old World flycatcher with a distinctive appearance
    that reflects its scientific name "collared rock-dweller." Males are particularly
    striking, displaying a black head with a prominent white collar and orange-rufous
    breast, while females are duller with brown and buff tones. Both sexes share the
    characteristic upright posture typical of stonechats, often perching on exposed
    rocks, low vegetation, or fence posts where they scan for insects.


    This species is an active, restless hunter, frequently dropping to the ground
    to catch prey and returning to prominent vantage points. Its behaviour and habitat
    preferences—rocky outcrops, grasslands, and scrubland—have earned it its colloquial
    name. The call is sharp and distinctive, resembling stones being struck together,
    which also contributes to its common English name.


    The African stonechat is found throughout sub-Saharan Africa and adjacent regions,
    where it inhabits open, rocky terrain. It prefers areas with scattered vegetation
    that provide both hunting perches and nesting opportunities, making it a characteristic
    bird of arid and semi-arid landscapes.'
migration:
  sv: ''
  en: '# African Stonechat - Occurrence in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The African Stonechat is a sub-Saharan African species with no established presence
    in Scandinavia or Northern Europe. This bird is endemic to Africa and does not
    occur regularly in the Nordic region or broader Northern European area. Therefore,
    no meaningful information about seasonal migration, overwintering, or arrival
    patterns in Scandinavian territories can be provided.'
