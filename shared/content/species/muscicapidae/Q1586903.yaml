description:
  sv: ''
  en: '# Mourning Wheatear


    The Mourning Wheatear is a small passerine belonging to the Old World flycatcher
    family. It is one of 14 wheatear species found across northern Africa and the
    Middle East, regions where it has adapted to arid and semi-arid environments.


    This bird is characterized by its distinctive plumage pattern, which typically
    features dark upperparts contrasting with lighter underparts—a coloration that
    reflects its mourning-inspired common name. Like other wheatears, it is an active
    ground forager, often seen perching on rocks or low vegetation as it hunts for
    insects and small invertebrates.


    The Mourning Wheatear favors open, rocky habitats and desert margins where sparse
    vegetation provides adequate foraging opportunities. It shares behavioural traits
    common to wheatears, including a preference for exposed perches from which it
    can survey its territory and watch for prey movement.'
