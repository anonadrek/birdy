description:
  sv: '# Stentrast


    Stentrast är en bergslevande fågel som häckar i södra delar av Europa och nordvästra
    Afrika. Tidigare klassificerades den som trast, men genetiska studier visade att
    arten faktiskt tillhör familjen flugsnappare. Det är en sällsynt gäst norr om
    sitt normala utbredningsområde, med endast några få fynd registrerade i norden.


    Arten är mycket sällsynt att påträffa utanför sitt hemområde, där det endast dokumenterats
    ett fåtal observationer. IUCN klassificerar arten som livskraftig med stabil population.
    Stentrasten föredrar bergiga terränger och höglandet där den lever på bergsklipper
    och öppna bergssidor.'
  en: '# Common Rock Thrush


    The Common Rock Thrush is a striking chat species that breeds across southern
    regions from west to east, with populations wintering far south in Africa. This
    bird is a strong migrant, undertaking substantial seasonal journeys. It appears
    as an uncommon visitor to northern areas, where sightings are noteworthy for birdwatchers.


    The species favors rocky, mountainous habitats where it hunts for insects and
    small prey. It is known for its vibrant plumage, though specific details on appearance
    would benefit from additional descriptive sources. Its behaviour includes typical
    chat-like foraging and perching on exposed rocks.


    The Common Rock Thrush''s range has contracted somewhat in recent decades, primarily
    due to habitat loss in peripheral areas. However, the species remains relatively
    stable globally and is not considered threatened. It continues to breed successfully
    across its core range in suitable rocky terrain.'
migration:
  sv: '# Stentrast (Monticola saxatilis) – Förekomst i Nordeuropa


    Stentrast är en mycket sällsynt gäst i Scandinavia och övriga Nordeuropa. Arten
    häckar i södra Europa och är en långdistansmigrant som övervintrar i Afrika. Då
    den huvudsakligen förekommer i södra och mellaneuropeiska bergsmiljöer, ligger
    dess naturliga utbredning långt söder om Skandinavien. Några få observationer
    har dock gjorts i Sverige, vilket tyder på sporadiska fellokaliseringar under
    migration eller på hösten. Arten påträffas inte regelbundet i regionen.'
  en: '# Common Rock Thrush in Scandinavia/Northern Europe


    The Common Rock Thrush is a strongly migratory species that is an uncommon visitor
    to northern Europe, including Scandinavia. Birds wintering in Africa migrate northward
    through the continent in spring, with occasional individuals reaching Scandinavian
    regions during this period. These sightings are irregular and unpredictable rather
    than part of an established regular occurrence. All populations winter in Africa
    south of the Sahara, meaning any individuals present in northern Europe during
    summer months would be transient visitors rather than breeding residents. Autumn
    migration carries birds southward again toward their African wintering grounds.'
