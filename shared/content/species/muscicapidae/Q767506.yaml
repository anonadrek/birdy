description:
  sv: '# Jemenstenskvätta


    Jemenstenskvätta är en liten fågel i flugsnappfamiljen som tidigare klassificerades
    tillsammans med höglandsstenskvättan under ett gemensamt namn. Denna art är nu
    definierad i begränsad mening, vilket skiljer den från närbesläktade former.


    Arten är anpassad till stenig terräng och öppen miljö där den söker föda genom
    att hoppa på marken. Som medlem av flugsnappfamiljen älskar arten att fånga insekter
    både från luften och från marken. Jemenstenskvätta är en aktiv och vaksam fågel
    som ofta vilar på höga punkter för att spana efter både mat och möjliga faror.


    Arten förekommer i sitt naturliga utbredningsområde där den är stationär eller
    delvis flyttande beroende på säsong och förhållanden.'
  en: '# Buff-breasted Wheatear


    The buff-breasted wheatear is a small Old World flycatcher distinguished by its
    warm buff and reddish coloring on the breast and underparts, contrasting with
    darker upperparts. Like other wheatears, it displays characteristic pale rump
    and tail patterns visible in flight, which aid identification in the field.


    This species favors rocky, mountainous terrain with sparse vegetation, where it
    hunts insects from exposed perches. It typically forages on the ground or makes
    short sallies to catch prey in the air, displaying the characteristic upright
    posture and frequent tail-bobbing behavior common to wheatears.


    The buff-breasted wheatear is endemic to a limited highland range, making it a
    species of conservation interest due to its restricted distribution. Amateur birders
    seeking this bird will need to explore appropriate high-altitude habitats within
    its known range, where it can be observed during suitable seasons.'
