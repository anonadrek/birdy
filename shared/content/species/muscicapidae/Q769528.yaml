description:
  sv: '# Persisk stenskvätta


    Persisk stenskvätta är en liten tätting som tillhör släktet stenskvättor inom
    familjen flugsnappare. Arten klassificerades tidigare tillsammans med kurdstenskvätta
    som en enda art, men behandlas numera som separat. Bestånd av persisk stenskvätta
    anses vara stabilt och livskraftigt.


    Arten är anpassad för sitt habitat i stenig terräng, där det framför allt söker
    föda bland markvegetationen. Persisk stenskvätta är en migratorisk art som återfinns
    i sitt utbredningsområde under passande årstider.'
  en: '# Red-tailed Wheatear


    The red-tailed wheatear is a small passerine bird found in mountainous regions
    of south-west and central Asia. It belongs to the wheatear genus Oenanthe, recently
    reclassified from the thrush family into the Old World flycatcher family. The
    species was historically considered a subspecies of the Kurdish wheatear before
    being recognized as a distinct species.


    This wheatear inhabits rocky, elevated terrain where it forages for insects and
    other small prey typical of its flycatcher family. Like other wheatears, it is
    an active and alert bird, often perching on stones and low vegetation while hunting
    for food. The "red-tailed" or "rusty-tailed" in its common names refers to distinctive
    coloration in the tail, a key identifying feature when observing the bird in the
    field.


    Further details about its specific plumage patterns, vocalizations, and seasonal
    movements would require additional source material beyond the introductory information
    provided.'
