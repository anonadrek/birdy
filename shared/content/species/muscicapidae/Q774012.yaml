description:
  sv: '# Diademrödstjärt


    Diademrödstjärten är en nordafrikansk fågel som tillhör flugsnapperfamiljen. Det
    är en liten tätting som huvudsakligen förekommer i Nordafrika, där det är bosatt.
    Arten är mycket sällsynt i Europa och noteras då endast sporadiskt, bland annat
    under migration. Beståndets status anses enligt internationella bedömningar vara
    tillfredsställande och livskraftigt.


    För den som är intresserad av att observera denna art är det praktiskt taget uteslutet
    att träffa den i norra Europa, där den bara förekommer helt undantagsvis. En möjlighet
    att se arten är istället att besöka dess hemtrakter i Nordafrika, där den är mer
    regelbundet förekommande. Trots sitt begränsade utbredningsområde i Europa anses
    arten inte vara hotad globalt.'
  en: ''
