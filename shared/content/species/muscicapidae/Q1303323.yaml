description:
  sv: '# Kurdstenskvätta


    Kurdstenskvätta är en berglevande fågel inom familjen flugsnappare. Arten häckar
    i bergstrakter från sydöstra Turkiet till sydvästra Iran. Tidigare klassificerades
    kurdstenskvätta tillsammans med persisk stenskvätta som en enda art, men dessa
    behandlas nu som två skilda arter.


    Beståndet av kurdstenskvätta är relativt begränsat, men anses ändå vara stabilt
    och livskraftigt. Fågeln är anpassad för liv i höglänta, steniga miljöer där den
    hittar lämpliga häckningsplatser och föda. Som medlem av släktet stenskvättor
    delar den många egenskaper med andra arter inom denna grupp, främst en förkärlek
    för öppna bergsmiljöer.'
  en: '# Kurdish Wheatear


    The Kurdish wheatear is a distinctive member of the wheatear family, characterized
    by its chestnut or reddish rump—a feature that gives rise to several of its alternative
    names. Like other wheatears, it is a small, upright-standing bird adapted to open
    terrain. The species has historically shared taxonomic uncertainty with the red-tailed
    wheatear, which was once considered a subspecies but is now typically treated
    as separate, though the two populations may interbreed in some regions. Age-related
    plumage variation adds complexity to identification, with younger birds potentially
    displaying intermediate coloring that can create confusion in the field.


    The Kurdish wheatear inhabits rocky hillsides and arid scrubland across its range
    in western Asia. It favors open ground where it can perch conspicuously and hunt
    insects in characteristic wheatear fashion. Like its relatives, it is an active,
    ground-feeding bird that uses exposed perches to scan for prey and watch for potential
    threats. The species remains relatively understudied compared to some wheatears,
    and detailed information about its vocalizations and precise behavioral patterns
    remains limited in general ornithological literature.'
migration:
  sv: '# Kurdstenskvätta – Förekomst i Skandinavien/Nordeuropa


    Kurdstenskvätta förekommer inte naturligt i Skandinavien eller Nordeuropa. Arten
    är en bergsboendes stennötskvätta som är begränsad till Mellanöstern, där den
    häckar från sydöstra Turkiet till sydvästra Iran. Arten är därför inte relevant
    för nordeuropeiska fågelguider då den aldrig eller endast mycket undantagsvis
    når skandinaviska eller nordeuropeiska områden.'
  en: Migration data unavailable for this species.
