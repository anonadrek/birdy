description:
  sv: ''
  en: '# Atlas Pied Flycatcher


    The Atlas pied flycatcher is a striking black-and-white flycatcher endemic to
    northwestern Africa as a breeding species. It belongs to the Muscicapidae family
    and is one of four black-and-white flycatcher species found in the Western Palearctic
    region.


    Like other pied flycatchers, it displays the characteristic contrasting plumage
    typical of its genus, making it distinctive in its range. The species inhabits
    suitable woodland and forest habitats where it hunts insects in flight, employing
    the quick, agile movements characteristic of flycatchers.


    This species is primarily seen in its breeding range in northwestern Africa, where
    it occupies appropriate woodland and montane forest environments. Its presence
    is largely seasonal, tied to breeding activities in its restricted geographic
    range.'
