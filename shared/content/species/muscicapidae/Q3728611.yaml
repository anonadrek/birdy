description:
  sv: '# Arabstenskvätta


    Arabstenskvätta är en liten tätting som tillhör flugsnappfamiljen. Arten förekommer
    uteslutande på södra Arabiska halvön, där den är endemisk. Dess exakta taxonomiska
    status har diskuterats bland ornitologer, då den står nära släktingen stenskvätta
    och dessa två arter kan möjligen representera populationer av samma art snarare
    än två distinkta arter.


    Beståndet av arabstenskvätta anses för närvarande vara livskraftigt och hotas
    inte av någon omedelbar utrotningsrisk. Arten är väl anpassad till de torra miljöer
    som dominerar sitt utbredningsområde.'
  en: '# Arabian Wheatear


    The Arabian wheatear is a small insectivorous bird belonging to the Muscicapidae
    family, closely related to other wheatear species. It is endemic to arid and semi-arid
    regions of the Arabian Peninsula, inhabiting rocky slopes, desert scrubland, and
    sparse vegetated areas where it hunts for insects among stones and low vegetation.


    Like other wheatears, it is an active, ground-dwelling bird that characteristically
    bobs its tail and darts between perches while foraging. It favours open terrain
    with minimal cover, allowing it to spot prey and potential threats easily. The
    species feeds primarily on insects and other small invertebrates caught on the
    ground or in short flights.


    Due to limited information in widely available sources, specific details about
    its plumage patterns, distinctive calls, and detailed seasonal behaviour remain
    less well-documented than some other wheatear species. Birdwatchers visiting suitable
    habitat in its restricted range may encounter it, particularly during breeding
    season when it is more vocal and territorial.'
