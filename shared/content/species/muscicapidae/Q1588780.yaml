description:
  sv: ''
  en: '# Little Rock Thrush


    The little rock thrush is a diminutive passerine, measuring just 15-16 centimetres,
    making it the smallest member of the Muscicapidae family. The male displays striking
    plumage with a blue-grey head, throat, and upper mantle contrasting sharply with
    bright orange-red underparts. Its blackish tail feathers, tipped and centered
    to form an inverted T-shape, are particularly distinctive. The female is considerably
    duller and paler than the male, with more subdued coloration throughout.


    This species favours rocky terrain interspersed with trees and occasionally ventures
    near human settlements. It is readily confused with various redstart species due
    to its characteristic tail-trembling behaviour, a distinctive habit it employs
    frequently. The species inhabits arid and semi-arid regions across northeastern
    Africa and the Arabian Peninsula, where it actively forages among rocky outcrops
    and sparse vegetation.


    The little rock thrush remains relatively inconspicuous despite its striking male
    plumage, often perching quietly on rocks before making quick foraging movements.
    Its small size and preference for rocky habitats make it well-adapted to harsh,
    sparsely vegetated environments where few other thrushes venture.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Little Rock Thrush is an African species with a range limited to East Africa
    and the Arabian Peninsula (Eritrea, Ethiopia, Kenya, Oman, Saudi Arabia, Somalia,
    South Sudan, Tanzania, Uganda, and Yemen). It does not naturally occur in Scandinavia
    or Northern Europe, and the source text contains no information about migration
    patterns or seasonal movements relevant to this region.'
