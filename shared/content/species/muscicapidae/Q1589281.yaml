description:
  sv: '# Vitgumpad buskskvätta


    Vitgumpad buskskvätta är en buskskvätta som tillhör familjen flugsnappare. Arten
    har en omstridd systematik inom sitt släkte. Det är en relativt liten fågel med
    karakteristisk färgteckning, där det vita på bakdelen är särskilt utmärkande.


    Arten häckar i tempererade delar av Asien samt i nordöstra Europa ner till östra
    Ukraina. I Sverige förekommer vitgumpad buskskvätta endast som tillfällig gäst,
    vilket gör att den är en sällsynt och eftertraktad observation för många fågelskådare.'
  en: '# Siberian Stonechat


    The Siberian stonechat is a small Old World flycatcher recently recognized as
    a distinct species. It belongs to the Muscicapidae family, though it was historically
    classified among thrushes due to its thrush-like characteristics. This migratory
    bird breeds across the East Palearctic region, including the easternmost areas
    of Europe, before undertaking substantial migrations to wintering grounds in the
    Old World tropics.


    The species exhibits the typical compact, alert posture characteristic of stonechats.
    Like other members of its genus, it is likely an active forager, hunting insects
    in its favored habitats. Its call patterns and plumage details follow the general
    stonechat template, though specific field marks distinguish it from closely related
    species.


    Birdwatchers encountering this species would need to observe it in appropriate
    seasonal and geographic contexts—during breeding season in higher latitudes and
    temperate regions, or in tropical wintering areas during the cold months. Its
    recent validation as a separate species means field identification requires careful
    attention to distinguishing features compared to related stonechats.'
migration:
  sv: Vitgumpad buskskvätta är en sällsynt och tillfällig gäst i Sverige. Arten häckar
    primärt i tempererade delar av Asien och nordöstra Europa till östra Ukraina.
    I Skandinavien förekommer arten endast sporadiskt, främst under höst- och vintermånaderna
    när några individer kan irra västerut från sina asiatiska häckningsområden. Det
    är framför allt under oktober-november som vitgumpad buskskvätta observeras i
    Sverige, då arten utgör en opåräknelig vintergäst. Arten är inte etablerad som
    häckfågel i Skandinavien och återvänder inte regelbundet till regionen.
  en: '# Saxicola maurus (Siberian Stonechat) in Scandinavia


    The Siberian Stonechat is a rare vagrant to Northern Europe rather than a regular
    migrant. This species breeds in the far eastern Palearctic and winters in tropical
    regions of the Old World, placing Scandinavia well outside its typical range.
    Occasional individuals may appear during migration periods, particularly in spring
    and autumn, but such sightings are exceptional. The species does not maintain
    regular populations in Northern Europe and should not be expected as a seasonal
    visitor to Scandinavian habitats.'
