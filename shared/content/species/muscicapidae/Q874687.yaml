description:
  sv: '# Munkstenskvätta


    Munkstenskvätta är en liten tätting som tillhör släktet stenskvättor inom familjen
    flugsnappare. Arten är starkt knuten till ökenlandskap och förekommer från Sudan
    österut till Pakistan. I Europa är den mycket sällsynt och har endast noterats
    två gånger, båda gångerna i Grekland.


    Arten anses ha ett livskraftigt bestånd inom sitt naturliga utbredningsområde
    i de stora ökenzonen. Munkstenskvätta är väl anpassad till det torra klimatet
    i sin hemregion och lever i miljöer med glesa växter och stenig mark där det finns
    gott om insekter att jaga.'
  en: '# Hooded Wheatear


    The hooded wheatear is a small insectivorous passerine belonging to the Old World
    flycatcher family. It is a wheatear, a group of compact songbirds adapted to open,
    often rocky habitats. Like other wheatears, it has a characteristic upright posture
    and restless, energetic behaviour, frequently flitting between perches as it hunts
    for insects. The bird''s plumage is distinctive, featuring dark and pale markings
    that give it a "hooded" appearance, though exact coloration patterns vary between
    individuals and populations.


    This species is found across arid and semi-arid regions, typically in stony, sparsely
    vegetated terrain where it can move nimbly across the ground and among rocks.
    It shares the typical wheatear habit of perching prominently on elevated points
    to watch for prey, then dropping to catch insects in flight or on the ground.
    The hooded wheatear''s call and song are characteristic of the genus, though specific
    vocal details are not widely documented in general literature.


    The bird is migratory in much of its range, following seasonal patterns tied to
    insect availability in its harsh preferred habitats. It nests in crevices among
    rocks or in abandoned burrows, taking advantage of the shelter these provide.'
