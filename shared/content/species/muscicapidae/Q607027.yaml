description:
  sv: ''
  en: '# Rufous-tailed Scrub Robin


    The rufous-tailed scrub robin is a medium-sized member of the flycatcher family,
    characterized by its distinctive rufous (reddish-brown) tail, which is particularly
    noticeable in flight. The plumage is warm brown above with a paler underside,
    giving it good camouflage in scrubby habitats. It is an active, rather restless
    bird, often seen hopping on the ground or perching low in bushes where it hunts
    for insects and small invertebrates.


    This species breeds around the Mediterranean region and extends eastward to Pakistan.
    A separate population occurs south of the Sahara, from the Sahel region through
    to Somalia, sometimes considered a distinct subspecies. The bird is partially
    migratory, with northern populations wintering in Africa or India, while some
    southern African populations may be resident year-round.


    Rufous-tailed scrub robins are typically found in dry, scrubby terrain, including
    cultivated areas with scattered bushes. They are very rare visitors to northern
    Europe, appearing only as exceptional vagrants. The species favors habitats with
    low vegetation where it can forage on the ground or move through dense brush with
    ease.'
migration:
  sv: ''
  en: '# Cercotrichas galactotes – Occurrence in Scandinavia/Northern Europe


    The Rufous-tailed Scrub Robin is an extremely rare visitor to Scandinavia and
    northern Europe. This species is partially migratory, with populations breeding
    around the Mediterranean and wintering primarily in Africa and India. Given its
    primary range in southern Europe and Africa, sightings in Scandinavia are exceptional
    and unpredictable vagrant records rather than regular occurrences. The species
    does not establish breeding populations or predictable migration routes through
    northern Europe.'
