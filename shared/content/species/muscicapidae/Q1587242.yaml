description:
  sv: ''
  en: '# Canary Islands Stonechat


    The Canary Islands Stonechat is a small resident bird endemic to Fuerteventura,
    where it is locally known as the Caldereta. It belongs to the flycatcher family
    and remains year-round on its island home, never migrating.


    Little detailed information is available in standard references about this bird''s
    specific appearance, behaviour, and vocalizations. However, like other stonechats,
    it likely perches conspicuously on low shrubs and rocks, sallying out to catch
    insects in flight or gleaning them from vegetation. Its diet probably consists
    mainly of invertebrates, supplemented with berries when available.


    The species was once more widespread across the Canary Islands but is now restricted
    to Fuerteventura, making it a species of conservation concern due to its limited
    range and small population. Habitat loss and degradation on its island home pose
    ongoing threats to its survival.'
migration:
  sv: ''
  en: '# Canary Islands Stonechat (Saxicola dacotiae) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Canary Islands Stonechat is a sedentary resident bird endemic to Fuerteventura
    in the Canary Islands, with no documented occurrence in Scandinavia or Northern
    Europe. This species does not migrate and does not naturally occur in northern
    European regions. Its range is restricted to its island habitat year-round, making
    it irrelevant for ornithological study in Scandinavian contexts.'
