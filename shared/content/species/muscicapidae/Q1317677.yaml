description:
  sv: '# Akaciaflugsnappare


    Akaciaflugsnappare är en liten flugsnappare som förekommer i ett smalt band söder
    om Sahara i Afrika samt på sydvästra Arabiska halvön. Arten är anpassad till de
    halvtorra miljöer där den lever bland spridda träd och buskvegetation.


    Som flugsnappare är arten en skicklig insektsjägare som fångar sitt byte genom
    snabba, riktade flugningar från en utsiktpost. Den är därför ofta att se på exponerade
    grenar där den sitter uppmärksamt och spanar efter passerade insekter. Arten trivs
    i öppna och halvöppna landskap med glesa trädbeskåd, där den kan röra sig effektivt
    mellan olika jaktplatser.


    Arten är relativt diskret i sitt beteende men är vidare känd bland berörda fågelintresserade
    i sitt utbredningsområde. Som många flugsnappare är den främst en sommargäst eller
    flyttfågel i delar av sitt område, medan den kan förekomma året runt i mer sydliga
    delar av sin utbredning.'
  en: '# Gambaga Flycatcher


    The Gambaga flycatcher is a member of the flycatcher family, characterized by
    the typical adaptations of insectivorous birds in this group. It inhabits dry
    woodland and scrubland environments, favoring areas with low to medium canopy
    height rather than dense forests.


    This species occurs sparsely across arid and semi-arid regions, showing a patchy
    distribution within suitable habitat. It is adapted to subtropical and tropical
    dry forests, dry savannas, and thorny shrublands where it hunts insects in flight.
    The bird''s preference for open woodland with scattered trees reflects its feeding
    ecology as an aerial insectivore.


    The Gambaga flycatcher remains relatively poorly documented compared to many other
    African birds, with limited detailed information available about its specific
    behavior, calls, and appearance in general ornithological literature.'
