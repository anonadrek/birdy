description:
  sv: '# Bergrödstjärt


    Bergrödstjärt är en medelstor fågel i flugsnappfamiljen som förekommer i högre
    bergstrakter. Arten hittas från Kaukasus och österut genom Centralasien till Himalaya,
    där den är anpassad för livet i bergsmiljöer.


    Fågeln är en insektätare som jagar flygande insekter efter flugsnappares klassiska
    sätt. Som många medlemmar av sin familj använder den sig av snabba och skickliga
    manövrar för att fånga sitt byte i luften. Arten är därmed väl anpassad för sitt
    liv bland bergens höga höjder.


    För mer detaljerad information om bergrödstärtens utseende, beteende och läten
    rekommenderas att konsultera fågellitteratur med utförligare beskrivningar av
    denna bergspecialiserade fågel.'
  en: '# Güldenstädt''s Redstart


    Güldenstädt''s redstart, also called the white-winged redstart, is a small flycatcher
    inhabiting high mountain regions across a vast range from the Caucasus eastward
    through Central Asia to the Altai. It occupies rocky alpine and subalpine terrain
    in Afghanistan, the Himalayas, Pamir, Tian Shan, and surrounding mountain systems.


    Like other redstarts, it is a striking bird with distinctive plumage featuring
    white wing patches that give it one of its common names. The species is an active
    insectivore, characteristic of the flycatcher family, hunting in its rocky mountain
    habitat. Its behavior and calls reflect adaptations to high-altitude living, though
    specific details of its vocalizations and breeding habits remain less documented
    than some lowland relatives.


    This redstart is primarily a resident of remote, elevated terrain, making it a
    challenging species to observe. Its distribution spans multiple countries across
    southwestern and central Asia, always in mountainous regions where few other birds
    venture. Birdwatchers seeking this species must be prepared for high-altitude
    fieldwork in some of the world''s most challenging landscapes.'
