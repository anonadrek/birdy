  en: '# Güldenstädt''s Redstart Migration in Northern Europe


    Migration data unavailable for this species.


    Güldenstädt''s redstart is a high-mountain species of the southwestern and central
    Palearctic, occurring in the Caucasus, Karakoram, Pamir, Himalaya, Tian Shan,
    and Altai ranges. Its distribution extends across Afghanistan, Armenia, Azerbaijan,
    Bhutan, China, Georgia, India, Iran, Kazakhstan, Mongolia, Nepal, Pakistan, Russia,
    Tajikistan, Turkmenistan, and Uzbekistan. The species does not regularly occur
    in Scandinavia or Northern Europe.'
