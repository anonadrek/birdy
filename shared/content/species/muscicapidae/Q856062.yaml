description:
  sv: '# Svart stenskvätta


    Svart stenskvätta är en liten fågel som tillhör flugsnappfamiljen. Den är en stenskvätta,
    en grupp som tidigare klassificerades tillsammans med trastar men numera förs
    till flugsnappare.


    Arten förekommer på Iberiska halvön och i nordvästra afrika, där den bebor steniga
    och karga miljöer. Arten är fåtalig och beståndet minskar, även om det anses vara
    relativt livskraftigt. Med sitt namn hintad på ett svart yttre skiljer sig svart
    stenskvätta från sina närmaste släktingar, och dess anpassning till öppen stenmark
    gör den välkänd för den som söker fåglar i torra, kuperade terränger.'
  en: '# Black Wheatear


    The black wheatear is a small passerine in the Old World flycatcher family, found
    in the Iberian Peninsula and western North Africa. This striking bird is predominantly
    black or very dark grey, with white markings on the rump and tail that are particularly
    noticeable in flight. The contrast between its dark plumage and pale rear end
    makes it relatively easy to identify among wheatear species.


    Black wheatears favour rocky, arid habitats with sparse vegetation, where they
    forage on the ground for insects and other invertebrates. They are active, alert
    birds that often perch on rocks or low outcrops, making short flights to catch
    prey. Like other wheatears, they frequently bob and move with jerky, energetic
    movements.


    The species is less commonly encountered than some of its relatives, remaining
    in its preferred ranges year-round or making only short-distance movements. It
    tends to favour more barren, stony terrain than many other wheatears, requiring
    specific habitat conditions. While details on its calls and song are limited in
    available sources, like other wheatears it likely produces sharp, distinctive
    sounds typical of the genus.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: 'Migration data unavailable for this species.


    The Black Wheatear is a resident bird of the Iberian Peninsula and western North
    Africa, with no established presence or migration patterns documented in Scandinavia
    or Northern Europe. This species does not occur in these regions during any season
    of the year.'
