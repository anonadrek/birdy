description:
  sv: '# Västlig medelhavsstenskvätta


    Västlig medelhavsstenskvätta är en liten, vacker stenskvätta som förekommer i
    sydöstra Europa och sydvästra Asien. Arten hade länge behandlats tillsammans med
    sin östliga motsvarighet, men urskildes som egen art 2019. Hanen är särskilt påfallande
    med sitt svart-vitrandade dräkt, medan honan är mer diskret färgad i grå och beiga
    nyanser.


    Arten föredrar öppna, torra miljöer som klippareas och steniga slopor med gles
    växtlighet. Det är en flitig jägare som ofta ses hoppa mellan stenarna på marken
    när den söker efter insekter och andra små djur. Under flyktfasen är det vita
    på ryggen och stjärten väldigt påfallande.


    Västlig medelhavsstenskvätta är främst aktiv under våren och sommaren i sitt utbredningsområde.
    Det är en livlig och rastlös fågel som ofta sitter uppsittare på höga stenar eller
    låga buskar för att speja efter mat.'
  en: ''
migration:
  sv: '# Västlig medelhavsstenskvätta – förekomst i Skandinavien/Nordeuropa


    Västlig medelhavsstenskvätta är en mycket sällsynt gäst i Skandinavien och förekommer
    normalt inte där. Arten är hemhörig i sydöstra Europa och sydvästra Asien, långt
    söder om Nordens geografiska område. Endast sporadiska observationer från skandinaviska
    länder är dokumenterade, och dessa utgör undantag snarare än regel. Arten är inte
    etablerad som stamgäst eller övervintrare i nordiska regioner.


    Migrationsdata saknas för denna art i skandinavisk kontext, då arten inte utgör
    en regulär del av nordeuropeisk fågelfauna. För information om artens migrationsmönster
    i sitt huvudsakliga utbredningsområde hänvisas till källtexter fokuserade på Medelhavsregionen
    och västra Asien.'
  en: ''
