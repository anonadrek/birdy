description:
  sv: '# Blåtrast


    Blåtrast är en fågel från familjen flugsnappare, inte trastar som namnet kan föreslå.
    Det är en medelstor fågel med karakteristisk blå färg på hane och grå-brun färg
    på hona.


    Arten föredrar bergiga och klippiga miljöer där den ofta ses sitta uppsittande
    på stenar eller låga växtlighet. Blåtrasten är en aktiv jägare som flyger ut från
    sin sittplats för att fånga insekter i luften, typiskt för flugsnappare. Den är
    också känd för sitt ganska högt ljud och sitt territoriebetonande beteende.


    Arten förekommer i bergiga och torra regioner med stenbunden terräng. Blåtrast
    är Maltas nationalfågel, vilket återspeglar dess betydelse i vissa Medelhavsregioner.'
  en: '# Blue Rock Thrush


    The Blue Rock Thrush is a striking Old World flycatcher with distinctive plumage.
    Males display vibrant blue coloring on the head, back, and wings, contrasting
    sharply with orange-rufous underparts, while females are more subdued with greyish-brown
    tones. This medium-sized bird inhabits rocky terrain and mountainous regions across
    a wide range.


    It favors steep cliffs, rocky slopes, and gorges where it hunts for insects and
    small prey, typically catching food in short sallies from exposed perches. The
    species is relatively solitary and somewhat shy, though males can be quite vocal
    during breeding season. Its call and song are melodious and distinctive, often
    delivered from prominent rocks.


    The Blue Rock Thrush breeds across southern regions from the Mediterranean east
    through Central Asia to northern China and Malaysia. It prefers open, arid landscapes
    with exposed rock formations and minimal vegetation, making it a characteristic
    bird of harsh, mountainous terrain. During winter, some populations migrate to
    lower elevations or more southern areas, while others remain resident year-round
    in milder climates.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: '# Blue Rock Thrush (Monticola solitarius) in Northern Europe


    The Blue Rock Thrush is an extremely rare vagrant to Scandinavia and Northern
    Europe, with no established breeding or regular wintering populations in the region.
    This species is primarily resident in southern European and Mediterranean regions,
    where it breeds in rocky mountainous habitats. Occasional individuals have been
    recorded in northern Europe during migration periods, typically in autumn and
    spring, but such sightings are exceptional and unpredictable. The species does
    not form a regular migratory pattern through Scandinavia and should be considered
    a very rare and irregular visitor rather than a typical seasonal migrant to this
    region.'
