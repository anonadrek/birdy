description:
  sv: '# Tajgablåstjärt


    Tajgablåstjärten är en liten tätting som tillhör flugsnappfamiljen. Den är en
    återkommande men mycket sällsynt häckfågel i nordliga delarna av landet, där den
    främst förekommer i inlandsområdena. Arten häckar från Finland österut genom Ryssland
    och ner till Japan.


    Fågeln är en flyttfågel som övervintrar huvudsakligen i Sydostasien. Under häckningsperioden
    lever den i norrländska skogar, men under vintern söker den sig till varmare områden.
    IUCN klassificerar arten som livskraftig, och det finns ingen omedelbar risk för
    dess bestånd.


    Historiskt behandlades tajgablåstjärten tillsammans med himalayablåstjärten som
    en enda art under namnet blåstjärt, men de är numera erkända som två separata
    arter. Denna klassificering hjälper till att bättre förstå fördelningen och egenskaperna
    hos dessa nära släktade fåglar.'
  en: '# Red-flanked Bluetail


    The red-flanked bluetail is a small passerine belonging to the Old World flycatcher
    family. This diminutive bird is characterized by its distinctive blue coloration
    on the tail and rump, contrasting with warmer orange-red flanks that give it one
    of its common names. Its compact size and active, restless demeanor make it a
    challenging subject to observe, as it tends to remain in dense vegetation.


    This species breeds in mixed coniferous forests across northern Asia, parts of
    central Asia, and northeastern Europe, where it inhabits woodland with substantial
    evergreen coverage. It is highly migratory, spending winters in southeast Asia,
    the Indian subcontinent, the Himalayas, Taiwan, and northern Indochina, where
    it frequents forest undergrowth and scrubland habitats. During migration periods,
    it may appear in unexpected locations as it travels between breeding and wintering
    grounds.


    The red-flanked bluetail is primarily insectivorous, foraging in typical flycatcher
    fashion, though detailed information about its specific vocalizations and call
    patterns requires further observation in the field.'
migration:
  sv: '# Tajgablåstjärt – Förekomst i Skandinavien


    Tajgablåstjärten är en långdistansflyttare som huvudsakligen häckar i Rysslands
    tajgaskog, men har under senare år etablerat sig som en mycket sällsynt häckfågel
    i norra Norrlands inland i Sverige. Under vintern migerar arten långt österut
    till Sydostasien för att undvika de nordiska kallperioderna. Arten återkommer
    till häckningsområdena på våren efter sin långa södervägen, vilket gör den till
    en typisk långdistansflyttare bland småfåglar i norr.'
  en: '# Red-flanked Bluetail (Tarsiger cyanurus) in Northern Europe


    The red-flanked bluetail is a rare but regular vagrant to Scandinavia and Northern
    Europe, with occasional records particularly in autumn migration. While breeding
    occurs in northeastern Europe and northern Asia, Scandinavian sightings represent
    birds moving between breeding grounds in the east and wintering areas in southeast
    Asia and the Indian subcontinent. These eastern birds are strongly migratory,
    typically arriving at breeding grounds in spring and departing by autumn. In Northern
    Europe, individuals are most likely encountered during fall migration, particularly
    from August to October, when young birds may disperse westward. Winter records
    are exceptionally rare in Scandinavia, as the species vacates temperate regions
    entirely.'
