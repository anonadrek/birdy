description:
  sv: ''
  en: '# Black Redstart


    The black redstart is a small Old World flycatcher found across a wide range of
    rocky habitats from the British Isles to central China, extending south to North
    Africa. It is a year-round resident in milder regions, though populations breeding
    in northern and eastern areas migrate seasonally.


    This compact bird favors rocky terrain and mountainous landscapes where it can
    perch and hunt insects. Its behaviour is characteristically active and alert,
    flitting between exposed vantage points as it catches prey in flight. The species
    is often seen on rocky outcrops, cliffs, and similar open ground where vegetation
    is sparse.


    The black redstart''s name refers to its distinctive plumage features, which help
    identify it in its preferred rocky habitats. Its small size and active foraging
    style make it a characteristic inhabitant of the rocky regions throughout its
    broad Eurasian and North African range.'
migration:
  sv: ''
  en: '# Black Redstart in Scandinavia/Northern Europe


    The black redstart is a partial migrant in northern Europe, with populations showing
    distinct seasonal patterns. Northern and eastern birds migrate southward in autumn,
    typically departing between September and October, while some individuals overwinter
    in milder coastal regions of southern Scandinavia and the British Isles. Spring
    arrival occurs from March onwards as birds return to breeding territories. In
    Scandinavia, the species is primarily a summer breeder in suitable rocky habitats,
    with populations concentrated in southern regions where mild winters allow limited
    overwintering. The species exhibits flexibility in migration timing and distance,
    depending on local weather conditions and food availability.'
