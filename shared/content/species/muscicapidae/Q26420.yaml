description:
  sv: ''
  en: '# Northern Wheatear


    The Northern Wheatear is a small, active passerine that breeds across open, rocky
    landscapes throughout much of the northern hemisphere. It is notably migratory,
    with populations traveling vast distances between breeding grounds in Europe,
    Asia, and parts of North America to winter in Africa. The species favors sparse,
    stony terrain where it can nest in rock crevices or abandoned burrows.


    This insectivorous bird is characteristically restless and alert, often perching
    prominently on rocks or low vegetation as it hunts. It has a distinctive appearance
    with pale underparts, a dark eye-mask, and a striking white rump that is conspicuous
    in flight. Males display warmer buff and orange tones on the head and back, while
    females are duller overall.


    The Northern Wheatear is typically found in open country with minimal vegetation,
    including moorland, tundra, and stony hillsides. It forages on the ground and
    in low brush, catching insects in flight or gleaning them from vegetation. During
    breeding season, the species is vocal and animated, though details of its specific
    calls and song would benefit from field observation of live individuals.'
migration:
  sv: ''
  en: '# Northern Wheatear (Stenskvätta) in Scandinavia/Northern Europe


    The Northern Wheatear is a long-distance migratory species in Scandinavia, breeding
    during summer months in open, stony habitats across the region. Birds arrive in
    spring from their African wintering grounds, typically from April onwards, and
    depart again in late August through September for their trans-African migration.
    All northern populations are obligate migrants, spending the winter months exclusively
    in Africa, making them absent from Scandinavia during the colder season. The species
    is adapted to extreme latitudes and migration routes, with some Greenlandic and
    North American populations utilizing the longest migration routes of any songbird
    relative to body size.'
