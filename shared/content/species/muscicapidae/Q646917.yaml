description:
  sv: '# Cypernstenskvätta


    Cypernstenskvätta är en liten tätting som tillhör familjen flugsnappare och är
    endemisk för Cypern, där den förekommer året om, även om den flyttar till nordöstra
    afrika på vintern. Arten utgör en egen population på ön, vilket gör den unik för
    denna region.


    Trots sitt begränsade utbredningsområde, begränsat till Cypern, anses beståndet
    vara livskraftigt och stabilt. Detta tyder på att arten kan upprätthålla en hållbar
    population inom sitt relativt lilla geografiska område.'
  en: '# Cyprus Wheatear


    The Cyprus wheatear is a small passerine, measuring 14–15 cm in length, belonging
    to the Old World flycatcher family. It was long considered a subspecies of the
    pied wheatear until taxonomic revision in 1982 established it as a distinct species,
    primarily based on differences in measurements, song characteristics, and the
    absence of sexual plumage dimorphism—meaning males and females appear essentially
    identical.


    This species exhibits the typical wheatear characteristics of a compact, alert
    songbird. Like other wheatear species, it likely inhabits open, rocky terrain
    and scrubland habitats. The Cyprus wheatear''s song and call patterns distinguish
    it from closely related species, making vocalization an important identification
    feature for observers.


    The bird''s classification history—moving from the thrush family Turdidae to the
    Old World flycatcher family Muscicapidae—reflects evolving understanding of passerine
    relationships based on modern genetic and behavioral evidence. Today it is recognized
    as an endemic or near-endemic species with a restricted range, making it of particular
    interest to regional birdwatchers and ornithologists studying Mediterranean and
    Middle Eastern avifauna.'
migration:
  sv: '# Cypernstenskvätta – förekomst i Norden


    Cypernstenskvätta är endemisk för Cypern och förekommer inte naturligt i Skandinavien
    eller Nordeuropa. Arten är en långdistansflygtare som under vintern migrerar till
    nordöstra Afrika. För Sverige, Norge och Danmark är denna art därför inte relevant
    ur ett migrationssynpunkt, då den helt saknar förekomst i dessa länder under året.'
  en: '# Cyprus Wheatear Migration in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Cyprus Wheatear is a resident or summer breeder endemic to Cyprus and nearby
    regions of the eastern Mediterranean. There is no documented occurrence or migration
    pattern in Scandinavia or Northern Europe. This species has a highly restricted
    range centered on Cyprus and does not participate in the long-distance migrations
    characteristic of other wheatear species found in northern regions.'
