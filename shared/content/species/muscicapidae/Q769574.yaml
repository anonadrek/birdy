description:
  sv: '# Svartvit stenskvätta


    Svartvit stenskvätta är en asiatisk fågel som tillhör flugsnappefamiljen. Den
    är anpassad för liv i torra, klippiga miljöer och förekommer året runt från Iran
    till Pakistan samt på sydöstra Arabiska halvön. Arten är klassificerad som livskraftig
    enligt IUCN.


    Denna stenskvätta trivs i steniga och bergiga terräng där den söker föda bland
    klipporna och stenblocket. Som många stensskvätor är den aktiv och alert, ofta
    perchad på höga punkter där den spanar efter insekter eller andra förutsättningar.
    Den är anpassad för ett liv i dessa karga miljöer där få andra fåglar trivs lika
    bra.'
  en: ''
migration:
