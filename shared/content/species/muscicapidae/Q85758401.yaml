description:
  sv: '# Östlig medelhavsstenskvätta


    Östlig medelhavsstenskvätta är en liten tätting som tillhör familjen flugsnappare.
    Den förekommer i sydöstra Europa och sydvästra Asien, där den lever i öppna och
    halvöppna miljöer med stenig terräng.


    Arten behandlades länge som en underart till medelhavsstenskvättan men urskildes
    som egen art år 2019. Den liknar sin västra släkting medelhavsstenskvättan, men
    skiljer sig genom sina karaktäristiska märken, särskilt de mörka öron- och ansiktsmärkena
    som ger arten sitt namn.


    Arten föredrar buskland och steniga områden där den söker föda på marken. Liksom
    andra stenskvättor är den aktiv och rörlig, ofta observerad på låga utpostar eller
    på marken.'
  en: ''
migration:
  sv: '# Migrationsdata saknas för denna art.


    Källtexten innehåller ingen information om hur denna art förekommer i Skandinavien
    eller Nordeuropa under året, eller om dess migrationsmönster. Arten behandlas
    främst som sydeuropeisk och sydvästasiatisk, men utan specifika uppgifter om nordeuropeisk
    förekomst eller säsongsväxling kan ingen faktagrundad beskrivning av dess fenologi
