description:
  sv: "# Atlasstenskvätta\n\nAtlasstenskvätta är en nordafrikansk tätting som tillhör\
    \ familjen flugsnappare. Den behandlades traditionellt som underart till stenskvättan,\
    \ men urskiljs numera allt oftare som egen art. \n\nArten är nära släkt med stenskvättan\
    \ och liknar denna till utseendet, men har sina egna karakteristika som skiljer\
    \ den åt. Som de flesta stenskvätor är det en flyttfågel som föredrar öppna och\
    \ karga miljöer. Arten ses framför allt i bergiga och steniga terränger där den\
    \ jagar små insekter från marken och låga buskar.\n\nFör den som är intresserad\
    \ av att urskilja denna art från den närbesläktade stenskvättan krävs kunskap\
    \ om deras subtila skillnader i fjäderdräkt och beteende. Atlasstenskvätta är\
    \ en faszinerande exempel på hur taxonomin inom fågelvärlden ständigt utvecklas\
    \ när forskare får bättre möjlighet att studera och jämföra populationer."
  en: '# Atlas Wheatear


    The Atlas wheatear is a small passerine bird in the flycatcher family, formerly
    classified as a subspecies of the northern wheatear before being recognized as
    a distinct species in 2021. It is also called the black-throated wheatear or Seebohm''s
    wheatear.


    This species breeds in the Maghreb region of North Africa and undertakes a seasonal
    migration to the western Sahel for winter. Like other wheatears, it likely inhabits
    open, rocky terrain where it can forage on the ground and use elevated perches
    for scanning. As a small flycatcher, it probably feeds on insects and other invertebrates,
    though specific details of its behaviour and distinctive field marks are not provided
    in the available source material.


    The Atlas wheatear''s separation as a distinct species represents recent taxonomic
    refinement within the wheatear genus, reflecting updated understanding of North
    African bird populations.'
