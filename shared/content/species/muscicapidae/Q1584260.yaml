description:
  sv: '# Berberstenskvätta


    Berberstenskvätta är en liten tätting som numera klassificeras inom familjen flugsnappare.
    Arten förekommer i Nordafrika och västra Asien, där den är anpassad till de torra
    bergiga miljöerna i dessa regioner. Beståndet anses vara livskraftigt och arten
    utgör ingen naturvårdskoncern.


    Arten är en typisk stenkvatta med karakteristisk färgteckning. Det är en aktiv
    fågel som ofta ses hoppa på marken och från stenblock, där den letar efter insekter.
    Arten föredrar öppna, steniga terränger och klippiga områden. Som många stenkvattor
    har arten ett distinkt samtalande läte.


    Berberstenskvätta är möjlig att observera för den som reser i dess utbredningsområde
    och söker aktivt på lämpliga lokaler med stenig, tämligen bar miljö.'
  en: '# Red-rumped Wheatear


    The red-rumped wheatear is a small passerine in the flycatcher family, inhabiting
    arid and semi-arid regions of North Africa and the Middle East. It is a ground-dwelling
    species typically found in rocky, open terrain where it forages for insects and
    small invertebrates. The bird''s name derives from its distinctive buff or reddish
    rump, which contrasts with its darker upperparts and provides useful field identification.


    This wheatear is an active, restless bird that spends much of its time on the
    ground, frequently perching on rocks or low vegetation. It hunts by spotting prey
    from exposed positions, often making short flights to catch insects. Like other
    wheatears, it displays characteristic tail-flicking behavior and tends to be wary,
    typically remaining at a distance from observers.


    The species'' vocalizations include a simple warbling song and various contact
    calls, though it is generally less vocal than some congeners. Seasonally migratory
    populations move between breeding grounds and winter ranges, though some birds
    remain resident year-round in their range. Its preference for open, barren habitats
    makes it well-adapted to the harsh desert and semi-desert environments it frequents.'
