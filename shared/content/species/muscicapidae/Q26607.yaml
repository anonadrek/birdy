description:
  sv: '# Grå flugsnappare


    Grå flugsnappare är en liten och diskret fågel med gråbrun ovansida och smutsvit
    undersida. Arten tillhör familjen flugsnappare och har ett oansenligt utseende
    som gör den lätt att förbise i naturen. Även dess läten är svaga och diskreta,
    vilket bidrar till dess återhållsamma framtoning.


    Arten är en klassisk flugsnappare som ofta ses sitta på exponerade grenar, där
    den spanar efter insekter. När ett byte upptäcks kastas den sig ut i luften med
    snabba utfall för att fånga flygtande insekter. Det är denna karakteristiska jaktbeteende
    som är det säkraste sättet att identifiera arten i sitt naturliga beteende.


    Grå flugsnappare häckar i västra Asien och stora delar av Europa, men inte på
    Island. Arten är en långdistansflyktare som vintertid drar söderut till Afrika
    under Sahara. I Sverige är den mycket talrik och utgör landets tionde vanligaste
    fågelart. Arten ses i olika typer av öppna skogsområden och kategoriseras av IUCN
    som livskraftig.'
  en: '# Spotted Flycatcher


    The spotted flycatcher is a small, inconspicuous passerine belonging to the Old
    World flycatcher family. It possesses subtle grey-brown plumage with faint streaking
    on the crown and breast, making it somewhat understated in appearance despite
    its accomplished hunting abilities.


    This species is renowned for its characteristic feeding behaviour, sallying from
    a perch to snatch insects mid-air with impressive precision, often returning to
    the same vantage point. It favours open woodland edges, gardens, and parks where
    insects are readily available. The bird''s call is a thin, high-pitched note,
    and it produces a quiet, rather inconsequential song.


    The spotted flycatcher breeds across most of Europe and throughout the Palearctic
    region eastward to Siberia. It is a long-distance migrant, arriving late in spring
    and departing early in autumn to winter in Africa and southwestern Asia. Sadly,
    populations have undergone significant declines across parts of its breeding range
    in recent decades, reflecting broader concerns about insect availability in modified
    landscapes.'
migration:
  sv: '# Grå flugsnappare – Utbredning och migration i Norden


    Grå flugsnapparen är en klassisk sommargäst i Skandinavien och övriga Europa.
    Arten häckar i västra Asien och stora delar av Europa, men återfinns inte på Island.
    Under vintertid genomför den en långväga migration söderut och övervintrarar i
    Afrika söder om Sahara. I Sverige anländer arten typiskt under maj månad för att
    häcka i olika öppna skogstyper. Efter häckningen, från juli och framåt, påbörjar
    ungfåglar och sedan vuxna sin återvänd mot Afrika, där de spenderar vintermånaderna
    innan nästa vårs återkomst till häckningsområdena.'
  en: '# Spotted Flycatcher Migration in Northern Europe


    The Spotted Flycatcher is a summer visitor to Scandinavia and Northern Europe,
    arriving in late May and early June to breed. It departs in August and September,
    heading south on its long migration to wintering grounds in sub-Saharan Africa
    and southwestern Asia. The species is entirely migratory throughout its northern
    European range, with no birds remaining to overwinter in Scandinavia or other
    northern regions. This small flycatcher relies on aerial insects for food, making
    year-round residence in the north impossible.'
