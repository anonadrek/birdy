description:
  sv: '# Vitryggig stenskvätta


    Vitryggig stenskvätta är en tätting i familjen flugsnappare som förekommer på
    karga högplatåer och bergssluttningar i västra Asien. Arten är sällsynt i Europa
    med bara ett fåtal dokumenterade fynd. Beståndet anses vara livskraftigt.


    Arten är väl anpassad för sitt höglänta habitat där vegetationen är sparsam. Den
    ses ofta på öppna bergsområden där den söker föda bland stenar och låg växtlighet.
    Som flugsnappare använder den ofta en karakteristisk jagtteknik där den flyger
    ut från en upphöjd plats för att fånga flygande insekter.


    För den intresserade fågelskådaren är vitryggig stenskvätta en mycket lokal och
    svårfunnen art som kräver resa till dess specifika utbredningsområden i västra
    Asien för att observeras.'
