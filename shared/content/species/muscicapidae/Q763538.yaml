description:
  sv: '# Nunnestenskvätta


    Nunnestenskvätta är en liten stenskvätta som tillhör familjen flugsnappare. Arten
    häckar från sydöstra Europa och österut till Kina, medan den flyttar till östra
    afrika under vintermånaderna. I övriga delar av Europa är det en ovanlig tillfällig
    gäst – det har registrerats omkring 60 fynd i Sverige. Fågeln klassificeras av
    IUCN som livskraftig.'
  en: '# Pied Wheatear


    The pied wheatear is a small insectivorous passerine that belongs to the Old World
    flycatcher family. It breeds across central Asia, from the southeastern edge of
    Europe eastward to China, making it a migratory species that travels considerable
    distances seasonally. During winter, populations relocate to India and northeastern
    Africa. The species is an extremely rare vagrant to western Europe, appearing
    only occasionally outside its normal range.


    As with other wheatears, the pied wheatear is adapted for catching insects, hunting
    actively in open habitats. Its plumage follows the characteristic wheatear pattern,
    though specific details of its appearance would be needed from additional sources
    for a complete description. The species favors open terrain typical of central
    Asian landscapes, where it can forage effectively and maintain visibility of approaching
    threats or prey.


    Birdwatchers in western Europe should consider any wheatear sighting carefully,
    as pied wheatears are sufficiently uncommon in these regions to warrant documentation.
    The species'' preference for its traditional breeding and wintering grounds means
    sightings elsewhere remain exceptional events.'
migration:
  sv: '# Nunnestenskvätta – förekomst i Skandinavien


    Nunnestenskvätta är en sällsynt tillfällig gäst i Sverige och övriga Skandinavien.
    Arten häckar i sydosteuropeiska regioner och migrerarbort till Afrika under vintern.
    I Sverige finns endast omkring 60 dokumenterade fynd, vilket indikerar att arten
    endast passerar genom området vid migration. Den är ingen regelbunden förekommande
    art i Skandinavien och förekommer endast sporadiskt under flyttningsperioder.'
  en: '# Pied Wheatear (Oenanthe pleschanka) in Northern Europe


    The Pied Wheatear is a migratory species with a central Asian distribution that
    only rarely reaches Scandinavia and Northern Europe. This bird occurs from southeastern
    Europe eastward to China, making Northern Europe well outside its typical range.
    It is considered a very rare vagrant to western Europe, including Scandinavia.
    The species winters in India and northeastern Africa, undertaking long-distance
    migrations between its breeding grounds in central Asia and wintering quarters.
    Given its extreme rarity in the Nordic region, it should be regarded as an accidental
    visitor rather than a regular seasonal occurrence in Northern European birding
    records.'
