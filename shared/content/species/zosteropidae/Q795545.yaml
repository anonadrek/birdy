description:
  sv: ''
  en: '# Indian White-eye


    The Indian white-eye is a small passerine with a distinctive appearance that makes
    identification straightforward. It features a characteristic white eye-ring that
    gives the family its name, combined with yellowish upperparts and a compact body
    typical of white-eyes. These birds are relatively inconspicuous despite their
    neat markings, blending well into their favoured habitat.


    This species is a resident breeder found in open woodland across the Indian subcontinent.
    It is highly social, typically foraging in small, active groups as it moves through
    vegetation. Its diet consists primarily of nectar and small insects, which it
    gleans from flowers and foliage with characteristic quick movements. The bird''s
    behaviour is typical of white-eyes: restless, acrobatic, and often seen hanging
    upside-down while feeding.


    The Indian white-eye''s range was historically more extensive, formerly extending
    eastwards to Southeast Asia, Indonesia, and Malaysia, but taxonomic revision has
    reclassified eastern populations as a separate species. Today, this species is
    restricted to the Indian subcontinent, making the common name geographically accurate
    once more.'
