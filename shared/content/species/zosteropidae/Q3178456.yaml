description:
  sv: ''
  en: '# Abyssinian White-eye


    The Abyssinian white-eye is a small passerine belonging to the white-eye family,
    characterized by the distinctive white eye-ring that gives the group its name.
    It is native to north-eastern Africa and the southwestern Arabian foothills, where
    it inhabits savanna regions.


    This tiny bird is primarily found in its natural range across north-eastern Africa
    and adjacent Arabian areas. Like other white-eyes, it is an active forager, typically
    seen moving through vegetation in search of insects and small food items. The
    species remains relatively common within suitable habitat, though specific details
    about its vocalizations and detailed plumage patterns would benefit from field
    observation.'
