description:
  sv: '# Gråhakedopping


    Gråhakedopping är en vattenlevande doppingfågel som förekommer i tempererade områden
    på norra halvklotet. Arten är en flyttfågel som tillhör släktet Podiceps, doppingarnas
    geografiskt mest spridda grupp. Det finns två underarter: den västpalearktiska
    nominatformen och P. g. holbollii från Nordamerika och östra Sibirien, vilken
    är något större.


    Under häckningstiden föredrar gråhakedopping grunda vegetationsrika sötvattenmiljöer
    som sjöar, våtmarker och dammar. Under övervintrningen söker arten sig främst
    till lugna kustnära havsvatten, även om vissa individer kan övervintras på större
    sjöar. Arten tillhör doppingfåglarna, där skäggdopping är dess närmsta släkting.'
  en: '# Red-necked Grebe


    The red-necked grebe is a distinctive aquatic bird found across temperate regions
    of the northern hemisphere. During breeding season, it favours shallow freshwater
    habitats including lakes, marshes, and fish-ponds. As a migratory species, it
    shifts to coastal waters for winter, preferring calm ocean bays and sheltered
    areas just beyond the wave zone, though some populations winter on large inland
    lakes instead.


    This grebe is well-adapted to aquatic life, spending most of its time on water.
    Its appearance changes seasonally—during breeding, it displays the characteristic
    reddish-brown neck that gives the species its common name, contrasting with a
    darker cap and pale cheeks. In winter plumage, these colours become more subdued.
    Like other grebes, it is an excellent swimmer and diver, using its legs positioned
    far back on its body to propel itself underwater when hunting for fish and aquatic
    invertebrates.


    The red-necked grebe is generally a quiet bird, though it becomes more vocal during
    the breeding season, producing various calls and duets with its mate. Observers
    are most likely to encounter this species on open water, where it maintains a
    low profile, often disappearing beneath the surface with minimal disturbance.'
migration:
  sv: '# Gråhakedopping – Migration och förekomst i Skandinavien/Norra Europa


    Gråhakedopping är en flyttfågel som förekommer i tempererade regioner på norra
    halvklotet. Under häckningssäsongen söker arten sig till grunda, vegetationsrika
    sötvattenmiljöer som sjöar, våtmarker och dammar. Till hösten migrerar gråhakedoppingen
    mot kusterna för övervintering. Arten övervintrar huvudsakligen i lugna havsvatten
    längs kusterna, även om vissa individer stannar på större sjöar under vintermånaderna.
    I Skandinavien är arten främst en sommarfågel som ankommer för att häcka under
    våren.'
  en: '# Red-necked Grebe in Northern Europe


    The red-necked grebe is a migratory species in Scandinavia and northern Europe,
    breeding on shallow freshwater lakes and marshes during spring and summer months.
    Birds arrive at breeding grounds typically from April onwards after wintering
    in coastal waters. Following the breeding season, populations depart for their
    wintering grounds in autumn, usually from September onwards. During winter, red-necked
    grebes favor calm coastal waters just beyond wave zones, though some individuals
    may remain on large, ice-free lakes. The species shows typical northern hemisphere
    migration patterns, vacating northern breeding areas as waters freeze while exploiting
    temperate coastal regions for overwintering.'
