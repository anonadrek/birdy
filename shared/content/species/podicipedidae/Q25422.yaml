description:
  sv: '# Skäggdopping


    Skäggdopping är en elegant vattenlevande fågel som tillhör familjen doppingar.
    Under häckningstiden bär hannen och honan påfallande huvudprydnader - långt svart
    hår på huvudet och rostfärgade "öron" på sidorna av nacken. Kroppen är långsträckt
    och silvervit undertill. Utanför häckningstiden är färgteckningen mer diskret
    grå och vit.


    Det är en duktig dykare som förvärvar sitt föda genom att dyka efter små fiskar.
    På vattnet är fågeln elegant och rörlig, men på land rör det sig opraktiskt då
    benen är placerade långt bak på kroppen. Skäggdopping håller ofta ett visst avstånd
    till människor och är ganska försiktig.


    Arten häckar över stora delar av Europa och Centralasien, men förekommer även
    lokalt i Afrika, Australien och på Nya Zeeland. De flesta populationer är kortflyttande
    och söker sig mellan olika vattenbiotoper under året.'
  en: '# Great Crested Grebe


    The great crested grebe is an elegant water bird distinguished by its striking
    plumage of black, orange-brown, and white markings. During breeding season, it
    develops distinctive head crests and ear tufts that give the species its common
    name. The bird''s streamlined body is perfectly adapted for its aquatic lifestyle,
    with legs positioned far back on its body for efficient diving and swimming.


    This grebe is renowned for its elaborate courtship displays, which involve synchronised
    dances and intricate movements performed by paired birds. These spectacular interactions
    are central to the species'' breeding behaviour and help strengthen pair bonds.
    The bird is primarily aquatic, spending much of its time on water hunting for
    small fish and aquatic invertebrates.


    The great crested grebe inhabits freshwater lakes, reservoirs, and larger ponds
    with adequate vegetation and open water for diving and displaying. It is found
    across temperate regions of Europe, Asia, Africa, and Oceania, with populations
    varying seasonally as some birds migrate to coastal waters during winter months.'
migration:
  sv: Skäggdopping är en kortflyttande art som häckar över stora delar av Europa och
    Centralasien. Merparten av populationen är flyttfåglar, men många individer är
    kortflyttande och övervintrar relativt nära häckningsområdena. I Skandinavien
    anländer skäggdoppingar vanligtvis på våren för att häcka, medan många fåglar
    drar bort på hösten. Arten är dock känd för att en del individer kan stanna kvar
    även under vintermånaderna på istäckta eller öppna vattendrag, särskilt längre
    söderut i sitt utbredningsområde.
  en: '# Great Crested Grebe Migration in Northern Europe


    The Great Crested Grebe is a summer breeding visitor to Scandinavian lakes and
    reservoirs, arriving in April and May as ice melts. Birds breed throughout the
    region during summer months, constructing floating nests on larger freshwater
    bodies. In autumn, starting from September, populations begin their southward
    migration, with most birds departing by November to winter in coastal waters of
    western Europe and the Mediterranean. Some individuals may remain in ice-free
    areas of southern Scandinavia during mild winters, but the majority abandon northern
    breeding grounds before waters freeze. Return migration peaks in March and April
    when breeding lakes become accessible again.'
