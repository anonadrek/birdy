description:
  sv: '# Fjällabb


    Fjällabb är den minsta arten inom labbfamiljen och är lätt igenkännlig på sin
    eleganta gestalt. Den är en långflyttare som häckar cirkumpolärt i fjäll- och
    tundraområden under sommaren. Under vintern återfinns arten på havet på södra
    halvklotet, där den tillbringar större delen av året långt från land.


    Arten är anpassad för liv över havet och på fjällen. Fjällabben är erkänd för
    sitt aggressiva beteende under häckningstiden, då det vigoröst försvarar sitt
    revir. Det jagar huvudsakligen genom att förfölja och tvinga andra fåglar att
    släppa sitt byte – en teknik som kallas kleptoparsitism. Arten är därför ofta
    att se i närheten av andra sjöfåglar och fiskätare.


    Fjällabben är kategoriserad som livskraftig av IUCN, vilket betyder att arten
    för närvarande inte är hotad. Med sin anpassning till hårt väder och stora årliga
    migreringar visar arten en imponerande förmåga att klara livets utmaningar i både
    arktiska miljöer och på de världsomfattande haven.'
  en: ''
migration:
  sv: Fjällabb är en långflyttande art som häckar cirkumpolärt i Skandinaviens och
    Nordens fjäll- och tundraregioner under sommaren. Arten anländer till häckningsområdena
    under slutet av maj och juni efter sin långa vårflyttning från södra halvklotet.
    Under hösten, typiskt från augusti till september, påbörjar fjällabben sin övergång
    till vinterkvarter ute på öppna hav söder om ekvatorn. Under vintermånaderna är
    arten helt frånvarande från nordiska områden och återkommer inte förrän påföljade
    vår för att reproducera sig i arctiska tundra- och fjällmiljöer.
  en: ''
