description:
  sv: ''
  en: '# Great Skua


    The great skua is a large, robust seabird comparable in size to a herring gull,
    with dark brownish plumage and distinctive pale patches on its wings that are
    particularly visible in flight. It possesses a powerful, hooked bill adapted for
    its predatory lifestyle.


    This species is primarily a hunter of fish, catching prey at the sea surface with
    impressive agility. It also employs a remarkable hunting strategy of pursuing
    other seabirds and forcing them to disgorge their catches—a behavior known as
    kleptoparasitism. It is an aggressive and bold bird, particularly during the breeding
    season when it defends its territory vigorously against intruders.


    The great skua produces harsh, barking calls and mewing sounds, particularly when
    nesting. It is found in offshore and coastal waters, breeding in northern regions
    and migrating to more southerly seas during winter. It is often seen alone or
    in small groups at sea, though it may gather in larger numbers at productive fishing
    areas and around trawlers.'
migration:
  sv: ''
  en: '# Great Skua (Storlabb) in Northern Europe


    The Great Skua is a migratory seabird in Scandinavia and Northern Europe. Breeding
    populations are found in Iceland, the Faroe Islands, and northern Scotland, with
    smaller numbers in Scandinavia. Birds arrive at breeding grounds from late March
    through April. After breeding, most populations migrate southward in late summer
    and autumn, departing by September-October to winter in the Atlantic, primarily
    off West Africa and the Mediterranean. Some individuals may overwinter in northern
    waters during milder years. Return migration occurs in spring, with birds reappearing
    at northern breeding sites from March onwards, making them a seasonal visitor
    to most Scandinavian regions.'
