description:
  sv: '# Bredstjärtad labb


    Bredstjärtad labb är en medelstor labb som tillhör familjen labbar. Arten häckar
    cirkumpolärt i arktiska regioner över Nordamerika, Europa och Asien. Under vintern
    söker den sig bort från häckningsområdena och tillbringar tiden till havs på södra
    halvklotet.


    Arten är klassificerad som livskraftig av IUCN, vilket betyder att populationen
    är stabil och arten inte hotas av utdöing. Som övriga labbar är det en skicklig
    flygare som ofta observeras över öppna havsområden under sina flyttningar mellan
    nord och söder.'
  en: '# Pomarine Jaeger


    The pomarine jaeger is a powerful seabird belonging to the skua family. It is
    a migratory species that spends winters at sea in tropical ocean waters, traveling
    between breeding and non-breeding ranges seasonally.


    As an ambitious amateur birdwatcher, you should know that pomarine jaegers are
    skilled hunters and pirates of the open ocean. They are notably larger and more
    robust than some related jaeger species, with distinctive plumage patterns that
    vary by age and season. In breeding plumage, adults display characteristic elongated
    tail feathers that project prominently beyond the tail, a feature particularly
    visible in flight. The species exhibits polymorphic coloring, with both lighter
    and darker morphs occurring in populations.


    These aggressive seabirds are known for their predatory behavior, pursuing other
    seabirds to force them to drop or regurgitate food—a behavior called kleptoparasitism.
    They are vocal during breeding season, producing various calls and sounds, though
    they are generally quieter at sea. Watch for pomarine jaegers in oceanic habitats
    during migration periods and in tropical seas during winter months, where they
    can be spotted from ships or coastal vantage points during passage.'
migration:
  sv: '# Bredstjärtad labb – Förekomst i Nordeuropa


    Bredstjärtad labb är en långdistansmigrant som häckar cirkumpolärt i arktiska
    regioner och övervintrerar på södra halvklotet. I Skandinavien och övriga Nordeuropa
    förekommer arten endast under våren och hösten som genomflyttande fågel när den
    passerar mellan häckningsområdena i norra Arktis och sina övervintringsplatser
    långt söderut på öppet hav. Arten ses därför inte regelbundet under hela året
    i regionen utan är en säsongsbesökare begränsad till migrations­perioderna.'
  en: '# Pomarine Jaeger in Scandinavia


    The Pomarine Jaeger is a migratory seabird that visits northern Scandinavian waters
    during the breeding season, typically arriving in May and June. It breeds in Arctic
    regions, including parts of northern Scandinavia and Russia, before undertaking
    a lengthy migration southward in late summer and autumn. The species winters at
    sea in tropical oceans, remaining absent from Scandinavian waters from approximately
    September through April. These skilled predatory seabirds return to their breeding
    grounds in spring, making them a seasonal presence in northern European waters
    rather than year-round residents.'
