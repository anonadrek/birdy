description:
  sv: '# Trana (Grus grus)


    Tranan är en stor, långbent och långhalsad fågel som tillhör familjen tranor.
    Den är en flyttfågel som häckar från Skandinavien och Östeuropa österut till norra
    Kina och östra Ryssland. Arten är lätt att identifiera tack vare sin imponerande
    storlek och karakteristiska kroppsform med långt hals och ben.


    En av tranans mest spektakulära beteenden är dess parningsdans, som genomförs
    på specifika lekplatser på våren då fåglarna är på väg till häckningsplatserna.
    Dansen är en imponerande skådning med graciösa rörelser och hopp. Tranan har ett
    mycket stort utbredningsområde och en stabil global population, vilket gör den
    klassificerad som livskraftig enligt internationella naturvårdsorganisationer.


    Arten förekommer i många myter, folkloristiska berättelser och används ofta som
    symbol i olika kulturer. Detta vittnar om betydelsen denna majestätiska fågel
    har haft för människan genom historien.'
  en: '# Common Crane


    The Common Crane is a medium-sized crane of elegant proportions, distinguished
    by its grey plumage, black neck and head markings, and striking red patch on the
    crown. Standing tall with a long neck and legs, it shares some similarities with
    herons but is notably more robust. The species inhabits wetlands, marshes, and
    open grasslands across a broad range spanning from northern Europe to eastern
    Asia, with populations undertaking significant migrations between breeding and
    wintering grounds.


    In behaviour, Common Cranes are highly social birds, often seen in pairs or flocks,
    particularly during migration and winter. They are renowned for their spectacular
    synchronized dancing displays, involving leaping, bowing, and running movements
    that strengthen pair bonds. Their call is one of their most characteristic features—a
    loud, trumpeting bugle sound that carries across great distances and serves to
    maintain flock cohesion.


    Common Cranes are primarily seen in open wetland habitats, favouring boggy areas,
    reed beds, and shallow water systems for breeding. They prefer more open terrain
    than many other water birds, and their presence often signals healthy wetland
    ecosystems. Though facing local extinctions in parts of their range historically,
    populations remain stable overall, making it one of the few crane species not
    classified as threatened globally.'
migration:
  sv: '# Trana (Grus grus) i Skandinavien och Nordeuropa


    Tranan är en långflyttande fågel som häckar i Skandinavien och Östeuropa. Under
    våren söker sig tranorna till sina specifika häckningsplatser från sina övervintringskvarter,
    ofta i södra Europa och Afrika. Arten är känd för att följa traditionella flygtvägar
    och stannar vid utvalda lekplatser där de genomför sina spektakulära parvisdanser
    innan häckningen påbörjas. På hösten återvänder tranorna från sina nordliga häckningsområden
    för att övervintra på varmare breddgrader.'
  en: '# Common Crane (Grus grus) in Scandinavia and Northern Europe


    The Common Crane is a migratory species in Northern Europe, with populations breeding
    across Scandinavia and Eastern Europe during spring and summer. Birds begin arriving
    at breeding grounds from March onwards, following their northward migration from
    African wintering grounds. Peak breeding occurs from April through June, with
    pairs establishing territories in wetland habitats. As autumn approaches in August
    and September, cranes initiate their southward migration, with most birds departing
    Scandinavian breeding areas by October to reach their primary wintering grounds
    in North Africa and the Mediterranean region. Some smaller populations may occasionally
    overwinter in milder coastal areas of southern Scandinavia and Western Europe,
    but the vast majority of Northern European cranes are long-distance migrants that
    spend only the breeding season in the region.'
