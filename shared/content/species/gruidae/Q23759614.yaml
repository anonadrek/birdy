description:
  sv: '# Jungfrutrana


    Jungfrutrana är familjen tranors minsta art. Den kännetecknas av sin eleganta
    silhuett och grå fjäderdräkt med mörkare vingar. Typiska drag är den vita halsen
    och ansiktet samt de karakteristiska vita fjädertöftarna vid örat, som ger fågeln
    sitt svenska namn.


    Arten häckar över ett stort område från Svarta havet österut till Mongoliet och
    nordöstra Kina. Vintertid är den en långflyttare som drar till områden kring Indien
    och Afrika söder om Sahara. I Sverige är jungfrutrana en mycket sällsynt tillfällig
    gäst som endast noterats ett tjugotunn exemplar gånger. I Europa förekommer den
    endast sporadiskt utanför sitt normala utbredningsområde.


    Fågeln livnär sig genom att beta på växtmaterial och insekter i öppna, gräsbevuxna
    landskap. Som all tranor är den en social fågel som ofta ses i flockar under flyttningen.'
  en: '# Demoiselle Crane


    The demoiselle crane is a migratory species found across central Eurasia, with
    populations ranging from the Black Sea eastward to Mongolia and northeastern China,
    plus a small breeding group in Turkey. Western populations winter in Africa, while
    Asian birds migrate to the Indian subcontinent for the season.


    This crane holds symbolic importance in Indian culture, where it is traditionally
    known as koonj or kurjaa. The species is notable for its long-distance migrations,
    undertaking substantial journeys between breeding and wintering grounds each year.
    Its presence across such vast territories and its cultural significance make it
    an important species throughout its range.'
migration:
  sv: '# Jungfrutrana – Förekomst i Norden


    Jungfrutrana är en mycket sällsynt besökare i Skandinavien och Nordeuropa. Arten
    häckar långt österut från Svarta havet till Mongoliet och nordöstra Kina, och
    flyttar sedan till övervintringsområden vid Indien och Afrika söder om Sahara.
    I Sverige har arten endast noterats vid 14 tillfällen, vilket bekräftar att den
    är en helt tillfällig gäst i vår region. Jungfrutrana förekommer dock regelbundet
    långt söder om Norden och når sällan så långt norrut som till Skandinavien.'
  en: '# Demoiselle Crane in Northern Europe


    The Demoiselle Crane is not a regular species in Scandinavia or Northern Europe.
    This species is primarily found in central Eurasia, ranging from the Black Sea
    through Mongolia to Northeast China, with a small breeding population in Turkey.
    While migratory, the species winters in Africa (western populations) or the Indian
    subcontinent (Asian populations), and its migration routes do not typically include
    Northern Europe. Any sightings in Scandinavia would be extremely rare vagrants
    outside the species'' normal range.'
