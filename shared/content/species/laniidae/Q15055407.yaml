description:
  sv: '# Turkestantörnskata


    Turkestantörnskata är en medelstor törnskata från Centralasien. Den är nära släkt
    med flera andra törnskator och liknar isabellatörnskata, men är en egen art. Fågeln
    häckar i Centralasien under sommaren och övervintrar huvudsakligen i östra Afrika.
    Mycket sällan påträffas den i Europa, främst under höstmånaderna när den strova
    omkring på migration.


    Som andra törnskator är det en rovfågel som jagade på mindre fåglar och insekter.
    Den är aktiv och observant, ofta sittande på exponerade platser där den spejare
    efter byte. Turkestantörnskan förekommer i öppna och halvöppna habitat där den
    kan följa sina bytesdjur från höga utgångspunkter.


    I Europa är arten så pass ovanlig att den betraktas som en randföreteelse, men
    återkommer återkommande under höstflyttningen. För den nyfikne fågelbeskådare
    utgör varje iakttagelse av denna centralasiatisk gäst en märkvärd observation.'
  en: '# Red-tailed Shrike


    The red-tailed shrike is a member of the shrike family, a group of predatory songbirds
    known for their hooked bills and hunting prowess. It was previously classified
    as the same species as both the isabelline shrike and the red-backed shrike but
    is now recognized as a distinct species.


    Unfortunately, the available source material provides limited information about
    this species'' appearance, behaviour, vocalizations, and distribution. To provide
    accurate details about its plumage, hunting methods, calls, and preferred habitats,
    additional reliable sources would be needed. Interested birders seeking comprehensive
    information about the red-tailed shrike''s identification features and where it
    can be encountered are encouraged to consult specialized ornithological references
    or regional bird guides.'
migration:
  sv: '# Turkestantörnskata i Skandinavien/Nordeuropa


    Turkestantörnskata är en mycket sällsynt gäst i Skandinavien och övriga Nordeuropa.
    Arten häckar i Centralasien och övervintrar huvudsakligen i östra Afrika. Endast
    mycket tillfälliga observationer förekommer i Europa, framför allt under höstmigration
    när enstaka individer sporadiskt dyker upp. Det finns ingen regelbunden förekomst
    eller etablerad migrationsmönster genom Nordeuropa, utan all förekomst här är
    att betrakta som vagrant eller felnavigerad. Arten är således ingen regelbunden
    årstidspåfågel i regionen.'
  en: 'Migration data unavailable for this species.


    The provided source text contains only taxonomic classification information and
    does not include any data regarding the occurrence, migration patterns, or seasonal
    distribution of the Red-tailed Shrike in Scandinavia or Northern Europe. To provide
    accurate migration information for this species in the region, more detailed ornithological
    sources would be required.'
