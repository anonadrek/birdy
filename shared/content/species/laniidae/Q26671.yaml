description:
  sv: ''
  en: '# Red-backed Shrike


    The red-backed shrike is a striking carnivorous passerine belonging to the shrike
    family. Males display a distinctive appearance with a bright rufous-red back,
    grey head, and black face mask, while females are duller with brownish tones.
    It is a medium-sized bird with a notably hooked bill adapted for hunting small
    prey.


    This species is highly predatory, hunting insects, small birds, and rodents from
    prominent perches. It often impales its prey on thorns or barbed wire—a characteristic
    behaviour of shrikes—creating a "larder" for later consumption. The red-backed
    shrike typically perches conspicuously on bushes and low trees, making quick sorties
    to catch passing prey.


    The bird is migratory, breeding across a broad range from western Europe eastwards
    to central Russia. It favours open and semi-open habitats with scattered vegetation
    and thorny bushes. After breeding, it winters in eastern and southern Africa,
    undertaking a remarkable long-distance migration. During the breeding season,
    it produces a pleasant warbling song, though it also utters harsh, scolding calls
    when alarmed or defending territory.'
migration:
  sv: ''
  en: '# Red-backed Shrike in Scandinavia/Northern Europe


    The Red-backed Shrike is a summer visitor to Scandinavia and Northern Europe,
    arriving in late May and early June to breed. It winters in tropical and southern
    Africa, making it a long-distance migrant. Breeding pairs establish territories
    in open and semi-open habitats across southern Scandinavia and central Europe.
    The species departs breeding grounds in late August and September, undertaking
    a substantial southbound migration to African wintering grounds. No Red-backed
    Shrikes overwinter in the Nordic region.'
