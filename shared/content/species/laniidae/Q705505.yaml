description:
  sv: ''
  en: '# Iberian Grey Shrike


    The Iberian grey shrike is a member of the shrike family, closely related to the
    great grey shrike. Its plumage is generally similar to that species, though with
    some distinguishing features. Despite their resemblance and shared range in some
    areas, the two species maintain separate identities—they do not interbreed and
    occupy different habitats where they occur together.


    Like other shrikes, the Iberian grey shrike is a predatory songbird adapted to
    hunting smaller birds and large insects. It shares the typical shrike build and
    aggressive hunting behaviour of its family. Where the two related species overlap
    geographically, habitat preferences keep them apart, with the Iberian grey shrike
    favouring particular terrain suited to its specific ecological needs.


    The species remains relatively understudied compared to its more widespread relative,
    but birdwatchers in suitable regions may encounter it in appropriate habitats.
    Its separation from the great grey shrike is a useful reminder of how closely
    related bird species can coexist while maintaining distinct evolutionary paths.'
migration:
  sv: ''
  en: '# Iberian Grey Shrike (Lanius meridionalis) – Occurrence in Scandinavia/Northern
    Europe


    Migration data unavailable for this species.


    The Iberian grey shrike is a southern European species with a restricted range
    centered on the Iberian Peninsula and parts of the Mediterranean region. It does
    not occur in Scandinavia or Northern Europe as a regular resident or migrant.
    This species is sedentary or shows only local movements within its Mediterranean
    and southern Iberian habitat, remaining absent from northern European regions
    throughout the year.'
