description:
  sv: ''
  en: '# Great Grey Shrike


    The great grey shrike is a large, predatory songbird with striking plumage that
    makes it easily recognisable. Both males and females display pearly grey upperparts
    contrasted with pure white underparts, and a distinctive black eye-mask that runs
    across the face. This bold facial pattern, combined with its robust build, gives
    it a formidable appearance befitting its predatory nature.


    A skilled hunter, the great grey shrike hunts small birds, rodents, and large
    insects from open perches, often impaling its prey on thorns or barbed wire—a
    characteristic behaviour of shrikes. It tends to be rather solitary and perches
    conspicuously while scanning for food, making it relatively easy to spot when
    present. The species is typically found in open or semi-open habitats with scattered
    trees and bushes, where it can maintain clear sight lines for hunting.


    The great grey shrike forms a superspecies with several related southern populations,
    including the Iberian grey shrike, Chinese grey shrike, and American loggerhead
    shrike. Its call is described as harsh and varied, though details of its vocalisation
    are less prominent than those of more vocal songbirds. Overall, it remains a distinctive
    and impressive predator of open landscapes.'
migration:
  sv: ''
  en: '# Great Grey Shrike in Scandinavia


    The Great Grey Shrike is a winter visitor and passage migrant to Scandinavia,
    arriving from eastern European and Asian breeding grounds in autumn. Birds begin
    appearing in September and October, with populations peaking during winter months.
    Some individuals remain through the coldest periods, particularly in southern
    Scandinavia, while others move further south or continue to milder regions. Spring
    departure occurs from March through May as birds return to breeding territories.
    The species prefers open habitats with scattered trees and bushes, where it hunts
    small birds and rodents from prominent perches.


    Migration data in the provided source text is insufficient to provide complete
    details about specific arrival and departure timing or the full extent of movements
    throughout the annual cycle in Northern Europe.'
