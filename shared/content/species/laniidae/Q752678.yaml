description:
  sv: '# Isabellatörnskata


    Isabellatörnskata är en medelstor törnskata med karakteristisk ljus, gulbeige
    färgton över hela kroppen. Arten tillhör familjen törnskator och är mycket nära
    släkt med andra asiatiska tårnekator samt den europeiska törnskatan.


    Arten är en långdistansflyktare som häckar på höglandet under sommaren. Där jagar
    den små fåglar, insekter och andra ryggradslösa djur från öppen, buskrik terräng.
    Under vintermånaderna söker den sig söderut till fuktigare klimatzoner. Som många
    törnskator är även denna art känd för sitt rovljusbeteende och förmåga att spetta
    sitt byte på taggar och törnbuskar.


    Isabellatörnskata påträffas bara undantagsvis i västra Europa, främst under höst-
    och vinterperioderna, men globalt anses beståndet vara stabilt och livskraftigt.'
  en: '# Isabelline Shrike


    The isabelline shrike is a member of the shrike family, a group of predatory songbirds
    known for their hooked bills and hunting prowess. Until recently, it was classified
    as the same species as the red-backed shrike and red-tailed shrike, but is now
    recognized as distinct.


    It inhabits an extensive range across central Asia, from regions near the Caspian
    Sea eastward through to north and central China, extending southward to the Qaidam
    Basin. The species is migratory, breeding in its Asian range during summer months
    before undertaking a substantial southward migration. It overwinters in Africa
    and the Arabian Peninsula, making it a long-distance traveler between continents.


    Like other shrikes, it is an active hunter, using its distinctive hooked bill
    to capture prey. The species favors open and semi-open habitats where it can hunt
    effectively. Further details about its specific appearance, vocalizations, and
    behavior patterns would benefit from additional field guide sources, as the available
    information focuses primarily on its taxonomy and geographic distribution.'
migration:
  sv: '# Isabellatörnskata i Skandinavien/Nordeuropa


    Isabellatörnskata är en mycket sällsynt gäst i Skandinavien och övriga Nordeuropa.
    Arten häckar i Mongoliet och västra Kinas högslätter och övervintra i södra Asien
    och östra Afrika. Den påträffas endast tillfälligt i västra Europa, främst under
    höstmigrationen. I Skandinavien förekommer arten sporadiskt under hösten som en
    vagrant eller feltrasserande individ. Det finns ingen regelbunden migration till
    eller genom området, utan observationer utgör undantag snarare än regel.'
  en: '# Isabelline Shrike Migration in Northern Europe


    The Isabelline Shrike is not a regular occurrence in Scandinavia or Northern Europe.
    This species breeds in central Asia, between the Caspian Sea and north-central
    China, and migrates south to overwinter in Africa and Arabia. While vagrant individuals
    occasionally reach Europe during migration or winter dispersal, the species does
    not have an established migratory route through or regular presence in Northern
    Europe. Any sightings in Scandinavia would represent rare vagrants far outside
    their normal range rather than part of a regular seasonal pattern.'
