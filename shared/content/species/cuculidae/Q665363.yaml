description:
  sv: '# Skatgök


    Skatgök är en sydeuropeisk och afrikansk gök som tillhör familjen gökar. Det är
    en häckningsparasit som lägger sina ägg hos andra fåglar, framför allt hos skagor.
    Arten är betydligt större än många andra gökar och har en karakteristisk utseende
    med grå och svart färgteckning.


    Skatgöken är känd för sin speciella reproduktionsstrategi där honan lägger sina
    ägg i andra fåglarnas bon. Detta gör arten helt beroende av värdarten för att
    sina ungar ska få mat och omvårdnad. I Sverige är skatgöken en mycket sällsynt
    gäst som observeras endast undantagsvis, främst under vårflyttningen eller i samband
    med väderomslag.'
  en: '# Great Spotted Cuckoo


    The Great Spotted Cuckoo is a distinctive member of the cuckoo family, sharing
    its order with roadrunners, anis, and coucals. It is a striking bird characterized
    by its spotted and barred plumage, which sets it apart from many other cuckoo
    species. The bird displays bold patterning across its wings and body, making it
    relatively easy to identify in the field.


    Like other cuckoos, the Great Spotted Cuckoo is a brood parasite, laying its eggs
    in the nests of other bird species rather than building its own nest. It has a
    characteristic loud, distinctive call that helps identify it in areas where it
    occurs. The species is typically found in open woodlands, scrubland, and cultivated
    landscapes where suitable host species are present.


    The Great Spotted Cuckoo inhabits regions across southern and central areas of
    its range, often seen perching openly on branches or in trees. It feeds primarily
    on insects and caterpillars. The bird''s behavior, combined with its eye-catching
    spotted plumage and vocal nature, makes it a notable and recognizable species
    where it is present.'
