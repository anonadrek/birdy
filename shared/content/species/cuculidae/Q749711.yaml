description:
  sv: ''
  en: '# Senegal Coucal


    The Senegal coucal is a medium-sized member of the cuckoo family, sharing its
    order with roadrunners and anis. It inhabits lightly-wooded areas and savannah
    regions across central and southern Africa. This distinctive bird is well-adapted
    to its environment, favouring open woodland and grassland habitats where it can
    hunt effectively.


    Unlike many cuckoos, the Senegal coucal is a ground-forager, moving deliberately
    through vegetation in search of prey. It tends to be rather skulking in behaviour,
    preferring to stay close to cover. The species has a characterful presence when
    observed, though it often requires patience to see well due to its habit of remaining
    within dense vegetation.


    The Senegal coucal produces a distinctive deep, resonant call that is often heard
    before the bird is seen—a rolling, booming sound that echoes through its savannah
    habitat. This vocal performance is one of the most reliable ways to locate the
    species in the field, particularly during breeding season when calling is most
    frequent.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Senegal coucal is a resident bird of central and southern Africa and does
