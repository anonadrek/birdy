  en: '# Jacobin Cuckoo in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Jacobin Cuckoo is a tropical and subtropical species found in Africa and Asia,
    with no established occurrence in Scandinavia or Northern Europe. This partially
    migratory species is associated with monsoon rains in India but does not naturally
    range into the Nordic region or broader Northern Europe. Any records from these
    areas would represent rare vagrants far outside the species'' typical distribution
    rather than regular migratory patterns.'
