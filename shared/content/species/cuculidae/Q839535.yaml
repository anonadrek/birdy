description:
  sv: '# Jakobinskatgök


    Jakobinskatgök är en gök som förekommer på två olika kontinenter – i södra Asien
    och Afrika – vilket är ovanligt för en fågel. Den tillhör familjen gökar tillsammans
    med många andra liknande arter.


    Som gök parasiterar jakobinskatgök troligen på andra fåglar, vilket innebär att
    honan lägger sina ägg i andra fåglarnas nästen istället för att bygga egna. Den
    har anpassat sig till denna levnadsväg genom evolution, precis som övriga gökar.


    Arten är mindre dokumenterad än många andra gökar när det gäller sitt exakta utseende,
    beteende och läte för amatörbirdwatchern. För den som är intresserad av att lära
    sig mer rekommenderas fältguider och lokala observatörer i området där arten förekommer.'
  en: '# Jacobin Cuckoo


    The Jacobin cuckoo is a striking member of the cuckoo family, found across Africa
    and Asia. It is recognizable by its pied plumage—contrasting black and white markings—and
    distinctive crested head, which gives it an unmistakable silhouette. The bird
    is partially migratory, with populations shifting seasonally across its range.


    This species is perhaps best known for its cultural significance in India, where
    its arrival has traditionally been interpreted as a harbinger of the monsoon rains.
    The timing of its appearance coincides with the onset of these crucial rains,
    making it an important seasonal marker. It features prominently in Indian mythology
    and poetry, associated with a legendary bird known as the chātaka.


    Like other cuckoos, the Jacobin cuckoo is a brood parasite, relying on other bird
    species to raise its young. It inhabits open woodlands, scrublands, and cultivated
    areas throughout its range, where it hunts insects and other prey. Its adaptability
    to various habitats has enabled it to thrive across its broad African and Asian
    distribution.'
