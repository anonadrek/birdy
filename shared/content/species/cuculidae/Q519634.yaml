description:
  sv: ''
  en: '# Diederik Cuckoo


    The Diederik Cuckoo is a small member of the cuckoo family, distinguished by its
    striking emerald-green and black plumage with brilliant golden spotting on the
    wings and back. Its compact size and iridescent coloration make it unmistakable
    in flight, particularly in good light where its metallic sheen becomes apparent.
    The bird''s underparts are predominantly white or pale, contrasting sharply with
    its darker upperparts.


    Like other cuckoos, it is a brood parasite, laying its eggs in the nests of weaver
    birds and other suitable hosts rather than raising its own young. It is generally
    solitary or seen in pairs, moving through woodland and scrub habitats with quick,
    darting flight. The species is active and restless, often perching openly on branches
    where it can be surprisingly conspicuous despite its small size.


    The Diederik Cuckoo''s call is distinctive and far-carrying—a repetitive, metallic
    "dee-dee-dee-rik" that gives the bird its common name. This vocal nature makes
    it easier to locate by sound than by sight. It inhabits open woodlands, thornbush,
    and cultivated areas across much of its range, where it can be encountered during
    the breeding season when males are most vocal.'
