description:
  sv: '# Gök


    Gök är en medelstor fågel inom familjen gökar, känd för sitt karakteristiska lockläte
    som låter som "gök-gök" – namnet kommer direkt från detta ljud. Fågeln är främst
    brungrå till grå på ovansidan med vitaktig undersida och ofta med mörka band på
    bröstet och buken. Det finns också en mer rostbrun variant. Gök är en skicklig
    flugare med långsmala vingar och en ganska lång stjärt.


    Arten är framför allt känd för sitt speciella häckningsbeteende: istället för
    att bygga egna bon lägger gök sina ägg i andra fåglars bo, en process som kallas
    häckningsparasitism. Ungarna växer upp omhändertagna av värdföräldrarna. Gök är
    en långdistansflyttare som återvänder på våren med sitt ikoniska läte, som hörs
    från april till juni.


    Arten ses i öppna och halvöppna miljöer, ofta från exponerade pinnar och tråd
    där den uthärdar sitt välkända "gök-gök-läte" för att markera territorium.'
  en: '# Common Cuckoo


    The Common Cuckoo is a sleek, grey-backed bird roughly the size of a small hawk,
    with barred underparts and a long tail. Its appearance superficially resembles
    a sparrowhawk, which may help deter potential predators. It is a migratory species,
    breeding across temperate regions and wintering in Africa.


    This species is famous for its brood-parasitic behaviour—females lay their eggs
    in the nests of smaller host birds, leaving them to raise the young. The cuckoo''s
    distinctive two-note call, from which its name derives, is often heard in late
    spring and early summer, though the bird itself can be elusive and difficult to
    spot despite its vocal presence. Males typically call from prominent perches or
    in flight.


    The Common Cuckoo inhabits open woodland, farmland, and scrubby areas where suitable
    host species are abundant. It forages for insects and caterpillars while perched
    or in flight, and is generally solitary outside the breeding season. Though widespread
    across much of its range, it is often detected by ear rather than sight.'
migration:
  sv: Göken är en långdistansflyger som återvänder till Skandinavien under våren,
    vanligtvis mellan april och maj. Den övervintringar i Afrika söder om Sahara och
    anländer därefter till sina häckningsområden i hela Skandinavien. Under sommaren,
    fram till juli-augusti, häckar göken genom parasitism i andra fåglarnas bon. I
    slutet av augusti och början av september påbörjar arten sin långa återflyttning
    söderut till sina afrikanska övervintringsområden, där den stannar under resten
    av året fram till nästa vår.
  en: 'Migration data unavailable for this species.


