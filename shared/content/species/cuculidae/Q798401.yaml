description:
  sv: ''
  en: '# Asian Koel


    The Asian koel is a sleek member of the cuckoo family found across the Indian
    subcontinent, China, and Southeast Asia. Males are glossy black with a distinctive
    red eye, while females are brown and heavily streaked, making them superficially
    resemble their crow hosts. It is a brood parasite, laying eggs in the nests of
    crows and other birds, which unknowingly raise the young koels as their own.


    Unlike most cuckoos, adult Asian koels are largely frugivorous, feeding primarily
    on berries and other fruit. They are most conspicuous during breeding season when
    males produce a loud, repeated "ko-el" call—the source of the bird''s name. The
    call often intensifies during dawn and dusk, making the otherwise elusive bird
    relatively easy to locate by ear.


    The Asian koel favours wooded areas, gardens, and cultivated regions where suitable
    host birds and fruiting trees are found. Its reliance on crow species for breeding
    and its preference for fruit-bearing plants means it occurs in both open and forested
    habitats throughout its range, though it remains most commonly heard rather than
    seen.'
migration:
  sv: ''
  en: '# Asian Koel (Eudynamys scolopaceus) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Asian koel is native to the Indian subcontinent, China, and Southeast Asia.
    It does not naturally occur in Scandinavia or Northern Europe, and therefore no
    seasonal occurrence pattern exists for this region. This tropical cuckoo species
    has no documented migration into or through Scandinavian territories.'
