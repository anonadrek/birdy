description:
  sv: ''
  en: '# White-browed Coucal


    The white-browed coucal is a cuckoo species found across sub-Saharan Africa. It
    prefers densely vegetated habitats with thick undergrowth and scrub, including
    suitable coastal areas where dense cover provides shelter and foraging opportunities.


    This species is adapted to terrestrial life among low vegetation. It moves through
    its preferred habitat with the characteristically deliberate movements of ground-dwelling
    coucals, hunting for prey within the protective cover of dense scrub. The white
    brow marking gives the species its common name and helps distinguish it from related
    coucals in its range.


    The white-browed coucal is occasionally difficult to observe due to its preference
    for dense habitats, though its presence can be detected through its calls. Like
    other coucals, it is primarily a secretive bird, spending much of its time moving
    through undergrowth rather than in open areas.'
