description:
  sv: '# Järnsparv


    Järnsparven är en liten tätting med brunaktig fjäderdräkt och distinkt järngrått
    huvud. Den skiljer sig från andra små fåglar genom sin tunna, insektsätande näbb.
    Arten förekommer i tempererade områden i Europa och Asien, där den häckar upp
    till trädgränsen i skogsmarker och tät buskvegetation.


    Denna art är väl anpassad för liv bland täta snår, där den ofta håller sig dold.
    Det är framför allt under sångtillfällena som järnsparven blir mer synlig. Sången
    är karakteristisk – monoton och silvrig med höga frekvenser som skiljer den från
    många andra små fåglar.


    Järnsparven är alätare som födosöker på insekter, spindlar och daggmaskar under
    växtsäsongen. På vintern kompletteras födan med bär och frön. Intressant är att
    arten uppvisar ett ovanligt parningssystem där honan parar sig med flera hanar.
    Arten är inte hotad och uppskattas som livskraftig.'
  en: '# Dunnock


    The dunnock is a small, unobtrusive passerine found throughout temperate Europe
    and into Asian Russia, with established populations in New Zealand following introduction.
    It represents the most widespread member of the accentor family, unlike most of
    its relatives which inhabit mountain regions.


    This compact bird presents subtle plumage featuring grey-brown tones that blend
    easily into hedgerows and garden settings. Its understated appearance—lacking
    bold markings or vibrant colours—contributes to its often-overlooked status despite
    being relatively common across its range.


    Dunnocks typically favour scrubby habitats, particularly hedgerows, gardens, and
    bramble patches, where they forage quietly on the ground for insects and seeds.
    They remain relatively inconspicuous in behaviour, moving methodically through
    low vegetation with a characteristic jerky gait. The dunnock''s song is a short,
    cheerful warble delivered from low perches, providing one of the more reliable
    ways to locate this otherwise elusive species. Despite their modest appearance
    and retiring nature, dunnocks are remarkably successful birds, adapting well to
    human-modified landscapes and maintaining stable populations across much of their
    range.'
migration:
  sv: '# Järnsparv – Säsongsförekomst i Norden


    Järnsparven är en delvis flyttfågel i Skandinavien och Nordeuropa. Arten häckar
    i regionen under våren och sommaren, där den anländer från mars till april. Under
    vintermånaderna utgör järnsparven en mindre övervintrare i södra delen av sitt
    utbredningsområde, medan större delen av populationen drar bort sydvästut till
    Medelhavsregionen och Södra Europa. Många individer påträffas dock året runt i
    mildare delar av Skandinavien, särskilt vid kusten och i städer där födan är tillgänglig.
    Från september och framåt börjar höstflyttningen, och säsongen är över senast
    i oktober.'
