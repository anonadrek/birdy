description:
  sv: '# Helenaastrild


    Helenaastrild är en liten, graciös tätting från familjen astrilder med ursprung
    i Afrika. Arten har förvildats och etablerat sig i olika delar av världen där
    den blomstrar väl. IUCN kategoriserar den som livskraftig, vilket talar för dess
    anpassningsförmåga och framgång.


    Denna lilla fågel är känd för sitt karakteristiska utseende med sin röda ansiktsmask
    och ögonring, vilket gör den lätt igenkännlig. Kroppen är övervägande grå med
    rostfärgade partier, och vingarna har en fin struktur. Det är en social fågel
    som ofta ses i mindre flockar, särskilt under rastperioder då den håller sig nära
    vattenkällor.


    Helenaastrild föredrar öppna och halvöppna habitat med låg vegetation där den
    kan söka frön, vilket är dess huvudsakliga föda. Den är en skicklig flygare trots
    sin små storlek och kan observeras när den fladdrar snabbt mellan växtsamlingar.
    Arten är relativt anspråkslös och adaptiv, vilket förklarar dess framgång vid
    introduktioner utanför sitt ursprungliga område.'
  en: '# Common Waxbill


    The common waxbill is a small estrildid finch native to sub-Saharan Africa. Its
    popularity in the aviculture trade has led to introductions across the globe,
    and it now occurs over an estimated 10 million square kilometres worldwide.


    This diminutive bird is characterized by its delicate appearance typical of waxbills.
    It favours grassland and scrubland habitats where it forages for small seeds.
    The species is notably social, often seen in small flocks that move actively through
    vegetation with quick, jerky movements.


    The common waxbill has proven particularly adaptable to captive conditions and
    remains one of the most popular estrildid finches in aviculture due to its ease
    of care and breeding. Its establishment in introduced ranges demonstrates its
    flexibility as a species.'
migration:
  sv: '# Helenaastrild (Estrilda astrild)


    Migrationsdata saknas för denna art.


    Helenaastrild är en ursprungligen afrikansk art som inte förekommer naturligt
    i Skandinavien eller Nordeuropa. De förvildade populationer som finns i världen
    utgår från undsluppna fåglar från fångenskap och är etablerade i varmare klimat
    än vad Nordeuropa erbjuder. Arten är anpassad till permanenta territorier i Afrika
    och har ingen naturlig migrationsbenägenhet som skulle möjliggöra övervintering
    i svenska eller nordeuropeiska förhållanden.'
  en: 'Migration data unavailable for this species.


    The Common Waxbill is a sub-Saharan African species with no established presence
    or migration patterns in Scandinavia or Northern Europe. While it has been introduced
    to various regions worldwide and maintains feral populations in some areas, there
    is no documented evidence of this species occurring naturally or as an established
    population in Scandinavian or Northern European territories. Its range remains
    primarily confined to Africa and introduced populations in warmer climates elsewhere.'
