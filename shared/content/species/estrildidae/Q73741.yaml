description:
  sv: ''
  en: '# Red Avadavat


    The red avadavat is a sparrow-sized finch of the family Estrildidae, named after
    the city of Ahmedabad in Gujarat, from where it was historically exported into
    the pet trade. Males display striking colourful plumage during breeding season,
    making the species highly popular in aviculture. Females and non-breeding males
    are considerably duller.


    It inhabits open fields and grasslands across tropical Asia, where it feeds primarily
    on grass seeds. The bird breeds during the monsoon season in the Indian subcontinent,
    constructing small woven nests in grass or low vegetation. Outside the breeding
    season, red avadavats are often found in small flocks, moving between feeding
    areas.


    The species produces a characteristic tinkling call and a soft, musical song.
    Its small size, active behaviour, and preference for open habitats make it relatively
    conspicuous in suitable terrain, though its movements are swift and restless.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


