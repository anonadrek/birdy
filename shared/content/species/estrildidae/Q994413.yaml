description:
  sv: ''
  en: '# African Silverbill


    The African silverbill is a small finch belonging to the estrildid family. It
    was formerly classified as the same species as the Asian Indian silverbill but
    is now recognized as a distinct African species. This bird is characterized by
    its small size and distinctive silvery bill, which gives it its common name.


    The African silverbill is a common resident breeding bird found throughout dry
    savanna habitats south of the Sahara Desert. It favors arid and semi-arid regions
    where it feeds and nests. Beyond its native African range, this species has been
    introduced to various other parts of the world, including Portugal, Qatar, and
    the United States, where some populations have become established.


    As a typical estrildid finch, it is a gregarious bird often found in small flocks.
    Its adaptability to dry conditions and success in introduced ranges make it a
    notable species in aviculture and ornithology.'
migration:
  sv: ''
  en: '# African Silverbill - Occurrence in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The African Silverbill is a resident bird of dry savanna habitats south of the
    Sahara Desert and does not naturally occur in Scandinavia or Northern Europe.
    While the species has been introduced to some countries including Portugal, there
    is no documented evidence of established populations or regular occurrence in
    Scandinavian or broader Northern European regions. Any observations in these areas
    would represent escaped captive birds rather than wild migratory populations.'
