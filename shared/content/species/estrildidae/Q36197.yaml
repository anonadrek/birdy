description:
  sv: '# Fjällig munia


    Fjällig munia är en liten tätting som tillhör familjen astrilder. Arten återfinns
    i Sydasien och Sydostasien, där den är relativt vanlig i sitt utbredningsområde.
    Tidigare gick arten under namnet muskotfink.


    Arten är en typisk representant för astridlerfamiljen med sin lilla storlek och
    karakteristiska utseende. Som namnet antyder har fjällig munia ett fjälligt eller
    skaligt mönster på bröstet, vilket är ett distintivt drag för arten. Denna färgteckning
    gör den relativt lätt att identifiera jämfört med andra muniaarter.


    Fjällig munia förekommer ofta i flockar och är anpassad till att leva i olika
    typer av habitat inom sitt utbredningsområde. Arten är framför allt en kornätare
    som söker föda på marken tillsammans med andra finkliknande fåglar. Som många
    andra muniaarter är den social till sin natur och ses ofta tillsammans med andra
    arter.'
  en: '# Scaly-breasted Munia


    The scaly-breasted munia is a sparrow-sized finch native to tropical Asia. It
    takes its name from the distinctive scale-like feather markings that pattern its
    breast and belly, creating an intricate, patterned appearance. Adults are predominantly
    brown on the upperparts, with a notable dark, conical bill that is characteristic
    of seed-eating finches.


    This species exhibits considerable variation across its range, with 11 recognized
    subspecies that differ subtly in size and coloration. The scaly-breasted munia
    is highly social and typically encountered in flocks, often feeding on seeds in
    grasslands and scrubland habitats. It remains relatively common throughout tropical
    Asian regions, making it a familiar sight where it occurs.


    The species has become well-known in the pet trade, where it is marketed as the
    nutmeg mannikin or spice finch due to its attractive plumage and small, manageable
    size. Despite its popularity in captivity, it remains abundant in its native range.'
migration:
  sv: 'Migrationsdata saknas för denna art.


    Migration data unavailable for this species.


    ---


    **Förklaring:** Källtexten innehåller endast information om att Fjällig munia
    förekommer i Sydasien och Sydostasien, men ger ingen information om förekomst
    i Skandinavien/Nordeuropa eller migrationsbeteende. Arten är en tropisk art som
    inte naturligt förekommer i norra Europa, varför migrationsdata för denna region
    inte är relevant.'
  en: 'Migration data unavailable for this species.


    The Scaly-breasted Munia is native to tropical Asia and lacks documented migration
    patterns in Scandinavian or Northern European contexts. This species does not
    naturally occur in these regions and is only found in captivity through the pet
    trade, where it is sometimes called the nutmeg mannikin or spice finch. No established
    wild populations or seasonal movements in Northern Europe have been recorded for
    this tropical finch species.'
