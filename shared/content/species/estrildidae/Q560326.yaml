description:
  sv: ''
  en: '# Red-billed Firefinch


    The red-billed firefinch is a small seed-eating bird belonging to the estrildid
    family. It is a resident breeder across most of Sub-Saharan Africa, occupying
    an extensive range spanning approximately 10 million square kilometres. The species
    is primarily sedentary, remaining in its territories year-round.


    Historically, attempts were made to introduce the red-billed firefinch to other
    regions. An introduction to Egypt did not establish permanently, with that population
    now extinct. However, a separate introduction to southern Algeria has proven more
    successful, with the population there currently expanding northward into new territories.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Red-billed Firefinch is a resident bird throughout its Sub-Saharan African
    range, meaning it does not undertake regular migrations. As a small estrildid
    finch, it remains in its breeding territories year-round rather than making seasonal
    movements between regions. The species does not occur naturally in Scandinavia
    or Northern Europe, and therefore there is no relevant information regarding its
    occurrence in these regions throughout the year.'
