description:
  sv: '# Guldbröstad tigerfink


    Guldbröstad tigerfink är en liten fågel i familjen astrilder. Det är en африkansk
    art som förekommer söder om Sahara och även i västra Jemen, där arten troligen
    introducerats av människan. IUCN klassificerar arten som livskraftig.


    Arten är anpassad till sitt område och verkar fungera väl i sitt naturliga utbreitningsområde.
    Det är en representant för familjen astrilder, som omfattar små, ofta färgglada
    finkar med karakteristiska egenskaper och ofta komplext färgmönster.'
  en: '# Orange-breasted Waxbill


    The orange-breasted waxbill is a tiny, sparrow-like finch with distinctive features
    that make it recognizable in the field. It displays dark olive-green plumage overall,
    with a striking orange breast and bright red bill. The reddish iris adds to its
    characteristic appearance. Males are noticeably more colourful than females, sporting
    a red rump, scarlet eyebrow stripe, and dark barring on whitish flanks. Females
    are duller and smaller, lacking the male''s prominent eyebrow marking.


    This species is also known as the zebra waxbill, reflecting its small size and
    refined appearance typical of waxbills. It inhabits open grasslands and savanna
    areas where it forages for seeds. The bird is generally inconspicuous despite
    its colourful plumage, often seen in small flocks moving through vegetation. Its
    behaviour and preference for specific habitats make it a rewarding species for
    patient birdwatchers to locate and observe, particularly in appropriate seasonal
    conditions.'
