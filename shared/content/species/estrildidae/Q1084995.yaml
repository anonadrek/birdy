description:
  sv: '**Orangekindad astrild**


    Orangekindad astrild är en liten fågel i familjen astrilder. Den förekommer naturligt
    i Afrika söder om Sahara, men har genom mänsklig påverkan spridits till flera
    andra länder världen över.


    Arten är karakteriserad av sitt namn – den har distintiva orangefärgade kindpartier
    som utgör ett slående kännetecken. Fågeln är liten och zierlig, vilket är typiskt
    för astrilder.


    Orangekindad astrild förekommer både i sitt naturliga utbredningsområde i Afrika
    och i introduerade populationer på andra kontinenter.'
  en: '# Orange-cheeked Waxbill


    The orange-cheeked waxbill is a small estrildid finch widely distributed across
    western and central Africa, inhabiting a vast range spanning approximately 3.6
    million square kilometers. It is a common species throughout its natural range.


    This diminutive finch is characterized by its distinctive orange cheeks, which
    give it its common name. The plumage features subtle coloration typical of waxbills,
    with a combination of warm tones that help identify it in the field. Its small
    size and delicate build are typical of the genus.


    The species frequents grasslands, savannas, and cultivated areas where seeds are
    abundant. It typically occurs in pairs or small flocks, often seen foraging close
    to the ground. Like other waxbills, it feeds primarily on small grass seeds and
    other minute food items. The species is generally tolerant of human-modified landscapes
    and can be encountered in agricultural zones alongside its natural habitat preferences.
    Its abundance and adaptability make it a relatively easy species to observe throughout
    its African range.'
migration:
  sv: Migrationsdata saknas för denna art.
  en: 'Migration data unavailable for this species.


    The Orange-cheeked Waxbill is native to western and central Africa and does not
    occur naturally in Scandinavia or Northern Europe. This small estrildid finch
    is a resident species throughout its African range with no migratory populations
    documented. Therefore, there is no seasonal occurrence pattern to describe for
    this species in Northern European regions.'
