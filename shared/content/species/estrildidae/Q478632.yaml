description:
  sv: '# Trefärgad munia


    Trefärgad munia är en liten fågel som tillhör familjen astrilder. Den är inhemsk
    i södra Asien, framför allt på Indiska subkontinenten, men har spridits världen
    över genom introduktion av människan.


    Denna lilla fågel är lätt att känna igen på sitt karakteristiska utseende med
    sin trefärgade färgteckning. Den förekommer både i sitt naturliga utbredningsområde
    och i introducerade populationer runt om i världen, där den ofta ses i flockar
    i öppna och halvöppna biotoper.'
  en: '# Tricoloured Munia


    The tricoloured munia is a small estrildid finch with distinctive plumage. Adults
    display a striking black head contrasting sharply with chestnut-brown upperparts
    and white underparts. Immature birds are considerably duller, with pale brown
    upperparts, buff-coloured underparts, and critically, they lack the dark head
    of adults—a feature that can make them challenging to distinguish from similar
    species like the scaly-breasted munia.


    This species is native to the Indian subcontinent and southern China, where it
    inhabits grasslands and cultivated areas. It has also become established in the
    Caribbean following introduction to islands including Trinidad, Jamaica, Cuba,
    and Puerto Rico. The tricoloured munia is a social bird, often seen in small flocks
    foraging for grass seeds and grain on open ground. Its call is a soft, tinkling
    song typical of munias, though relatively inconspicuous.


    When observing this species, pay particular attention to the head pattern—the
    black head of breeding adults is the most reliable identification feature, while
    immatures require careful comparison with similar species to confirm identification.'
