  en: '# Grey Hypocolius - Scandinavian Occurrence


    Migration data unavailable for this species.


    The Grey Hypocolius is a resident of dry semi-desert regions in northern Africa,
    Arabia, Afghanistan, Pakistan, and western India. It does not occur naturally
    in Scandinavia or Northern Europe. While the species is known to undertake seasonal
    migrations within its native range, moving southward during winter months, it
    has no documented occurrence in Scandinavian territories at any time of year.'
