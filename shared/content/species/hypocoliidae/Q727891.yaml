description:
  sv: '# Hypokolius (Grey Hypocolius)


    Hypokolius är en fascinerande fågel som utgör en egen familj inom tättsläktet
    och är nära släkt med sidensvansar. Det är en medelstor fågel med elegant utseende
    och grå fjäderdräkt. Arten förekommer i delar av Mellanöstern, där den återfinns
    i täta buskage och träd.


    Fågeln är till sitt väsen ganska diskret och livnär sig på frön och bär. Det rör
    sig ofta i smågrupper eller små flockar, särskilt under vintermånaderna. Hypokolius
    är en lugn och försiktig fågel som inte lätt uppmärksammar sig själv.


    Arten är relativt okänd för de flesta fågelskådare utanför sitt naturliga utbredningsområde,
    men för den intresserade amatören erbjuder den en spännande möjlighet att få se
    en av världens mest enskilda fågelfamiljer.'
  en: '# Grey Hypocolius


    The grey hypocolius is a distinctive small passerine with a notably slender build
    and long tail. It represents the sole member of its own family, Hypocoliidae,
    making it taxonomically unique. The bird''s appearance is characterized by elegant,
    understated plumage suited to arid environments.


    This species inhabits dry semi-desert regions across northern Africa, the Arabian
    Peninsula, Afghanistan, Pakistan, and western India. It is highly social, typically
    seen in flocks that move together through its range. The hypocolius is primarily
    frugivorous, foraging extensively on fruit, though it supplements its diet with
    insects. During winter months, it undertakes southward migrations in search of
    better food availability. While migrating, flocks are frequently observed feeding
    on the fruit of *Salvadora persica*, a drought-resistant tree common throughout
    its range.


    The hypocolius exemplifies adaptation to arid environments through its gregarious
    behavior and flexible diet, allowing it to exploit seasonal fruit availability
    across semi-desert landscapes.'
