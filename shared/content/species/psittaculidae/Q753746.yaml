description:
  sv: ''
  en: '# Alexandrine Parakeet


    The Alexandrine parakeet is a medium-sized parrot native to South Asia and Southeast
    Asia. It is the largest member of its genus and takes its name from Alexander
    the Great, who famously transported these birds from Punjab to Europe and the
    Mediterranean, where they became prized possessions of royalty and nobility.


    These parakeets are striking birds with predominantly green plumage, featuring
    a characteristic pink breast and neck patch in males. They have a powerful curved
    bill adapted for cracking seeds and nuts, and a long tail that aids balance while
    moving through trees. The species is highly social and typically found in small
    flocks, though larger groups may gather at feeding sites. It feeds on fruits,
    seeds, and vegetation, often visiting cultivated areas.


    The Alexandrine parakeet is quite vocal, producing loud, harsh calls and screeching
    sounds that carry well through their forested habitat. These birds are intelligent
    and active, spending much of the day foraging and interacting with flock members.
    They inhabit open woodlands, scrub forests, and cultivated regions where suitable
    food is available, showing considerable adaptability to human-modified landscapes.'
migration:
  sv: ''
  en: '# Alexandrine Parakeet in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Alexandrine Parakeet is native to South Asia and Southeast Asia and does not
    naturally occur in Scandinavia or Northern Europe. While the species has historical
    significance in European culture due to Alexander the Great''s role in transporting
    birds westward, there is no documented wild population or regular migration pattern
    involving this species in Scandinavian or Northern European regions.'
