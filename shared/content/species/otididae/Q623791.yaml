  en: '# Arabian Bustard (Ardeotis arabs) – Migration and Occurrence in Scandinavia/Northern
    Europe


    Migration data unavailable for this species.


    The Arabian bustard is a resident species of the Sahel region in Africa and southwestern
    Arabia, with no documented occurrence in Scandinavia or Northern Europe. This
    species does not migrate to or through Scandinavian territories and has no established
    presence in the region throughout the year.'
