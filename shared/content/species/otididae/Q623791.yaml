description:
  sv: '# Arabtrapp


    Arabtrapp är en större fågel i trappfamiljen som förekommer i ett band söder om
    Sahara, från Mauretanien till Somalia, samt på Arabiska halvön i Jemen. Arten
    är huvudsakligen afrikansko, men dess förekomst sträcker sig även till Mellanöstern.


    Arten karakteriseras av sin imponerande storlek och kraftiga bygnad typisk för
    trappar. Som många trappar är den anpassad för livet i öppna, halvöppen terräng
    där den kan röra sig på marken med långsamma, måtfulla steg.


    Arabtrappen står inför utmaningar i sitt bestånd. IUCN listar arten som nära hotad
    eftersom den minskar i antal på grund av två huvudsakliga hot: jakt och habitatförstörelse.
    Dessa faktorer påverkar populationen negativt över dess utbredningsområde och
    utgör ett växande naturvårdsproblem för arten.'
  en: '# Arabian Bustard


    The Arabian bustard is a large, robust bustard belonging to the genus Ardeotis,
    characterized by the substantial body size typical of this group. It exhibits
    the typical bustard morphology, with a heavily built frame suited to its terrestrial
    lifestyle.


    This species inhabits semi-arid and arid regions, favoring open grasslands and
    sparse scrubland where it can move easily on the ground. It is found across the
    Sahel region of Africa and in southwestern Arabia, where it ranges through suitable
    habitat. The Arabian bustard remains relatively little studied, and many details
    of its behavior and vocalizations are not widely documented. Like other bustards,
    it is primarily terrestrial, spending most of its time on the ground rather than
    in flight.


    The species appears to be fairly typical within its genus in terms of ecology
    and general behavior patterns, though comprehensive information about its specific
    call characteristics and detailed behavioral displays remains limited in popular
    literature. It represents an interesting member of the bustard family, adapted
    to the harsh, open environments it inhabits.'
migration:
