description:
  sv: '# Fiskgjuse


    Fiskgjusen är en hökfågel som är en av världens mest spridda arter inom sin familj.
    Den är speciellt anpassad för fiske och lever uteslutande av fisk som den tar
    från vattenytan med sina kraftiga klor. Fiskgjusen har utvecklat unika anpassningar
    för att kunna dyka och gripa sitt byte direkt från vattnet.


    Fiskgjusen är en stor rovfågel med imponerande flygförmåga. Det är en långvingad
    fågel som ofta ses kretsa högt över vatten på jakt. När det upptäcker ett lämpligt
    byte dyker det snabbt ned mot vattenytan för att fånga fisken.


    Beståndet av fiskgjusen anses livskraftigt och tros öka i antal. Arten ses främst
    i närheten av större vatten där det finns gott om fisk, såsom sjöar, älvar och
    kustområden.'
  en: '# Osprey


    The osprey is a large, distinctive bird of prey found across the world. Reaching
    over 60 centimetres in length with a wingspan approaching two metres, it is unmistakable
    in flight. It displays brown upperparts contrasting with a predominantly greyish
    head and underparts, making it recognizable at considerable distances.


    Highly specialized for its diet, the osprey is an expert fish-hunter. It hunts
    by diving from considerable heights into water bodies, plunging feet-first to
    snatch fish from the surface with its specialized talons. It is a diurnal hunter,
    active during daylight hours and often seen hovering over water before diving.
    The osprey typically nests near water bodies, building large stick nests that
    it may use and maintain for many years.


    The osprey''s vocalizations include high-pitched calls, particularly around the
    nest site during breeding season. When alarmed or defending territory, it produces
    sharp, distinctive whistles that carry well over water. Its diet consists almost
    exclusively of live fish, which it hunts in shallow waters and larger water bodies
    throughout its range.'
