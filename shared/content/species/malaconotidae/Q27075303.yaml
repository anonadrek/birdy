description:
  sv: '# Svartkronad tchagra


    Svartkronad tchagra är en fågel i familjen busktörnskator och den enda arten från
    denna familj som förekommer i Nordafrika och Asien. Det är en medelstor tätting
    som främst uppehåller sig i buskiga och tätt växtbevuxna miljöer.


    Arten är en stillsam fågel som ofta håller till i täta buskar och låg vegetation,
    där det gärna söker föda bland grenverket. Det är inte särskilt framträdande i
    sitt beteende och kan vara svårt att observera på grund av sitt val av habitat.
    Svartkronad tchagra föredrar områden med varierad växtlighet där det kan dölja
    sig medan det söker efter sitt foder.


    Denna art är utbredd i sitt geografiska område och förekommer där förhållandena
    är lämpliga för arten.'
  en: '# Black-crowned Tchagra


    The black-crowned tchagra is a bushshrike belonging to the family Malaconotidae,
    which was historically classified within the shrike family Laniidae before being
    recognized as a distinct group. This passerine bird shares evolutionary ties with
    true shrikes but occupies its own taxonomic family.


    Unfortunately, the available source material provides limited information about
