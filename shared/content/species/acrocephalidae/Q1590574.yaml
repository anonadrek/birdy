description:
  sv: '# Orientsångare


    Orientsångare är en asiatisk fågel i familjen kärrsångare som häckar i norra Mellanöstern
    och södra Centralasien. Under vintermånaderna förflyttar sig arten till Östafrika.
    I Europa är orientsångaren mycket sällsynt och har endast noterats vid några tillfällen
    i ett fåtal länder.


    Arten är klassificerad som livskraftig enligt IUCN, vilket indikerar att populationen
    är stabil. Som medlem av familjen kärrsångare är det en mindre fågel som liknar
    andra sångare inom denna familj.'
  en: ''
migration:
  sv: '# Orientsångare (Hippolais languida) i Skandinavien och Nordeuropa


    Orientsångaren är en asiatisk art som inte förekommer i Skandinavien eller övriga
    Nordeuropa under normal omständighet. Arten häckar i norra Mellanöstern och södra
    Centralasien, medan den under vinterhalvåret flyttar till Östafrika. I Europa
    förekommer arten endast som en mycket sällsynt gäst, med dokumenterade fynd endast
    från Bulgarien, Nederländerna och Cypern. Arten återkommer alltså inte återkommande
    till Skandinavien eller övriga Nordeuropa under någon årstid under normala förhållanden.'
  en: ''
