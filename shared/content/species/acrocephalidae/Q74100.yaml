description:
  sv: ''
  en: '# Clamorous Reed Warbler


    The Clamorous Reed Warbler is a medium-sized Old World warbler with warm brown
    upper parts and pale underparts, giving it a streaked appearance typical of reed
    warblers. Its brownish plumage provides effective camouflage among reed beds and
    wetland vegetation. Despite its modest appearance, it is notably vocal and delivers
    loud, repetitive calls that are characteristic of the species and often heard
    before the bird itself is spotted.


    This species is highly associated with reed beds, marshes, and wetland habitats
    where it hunts for insects and small invertebrates. It remains largely concealed
    within dense vegetation, making visual observation challenging. The Clamorous
    Reed Warbler breeds across a wide range spanning from northeastern Africa through
    the Middle East and central Asia to southern China and Southeast Asia. A distinct
    subspecies is found as an endemic race on the island of Sri Lanka.


    The species is migratory in northern parts of its range but remains resident year-round
    in southern regions. It typically nests in reed beds, constructing a cup-shaped
    nest suspended among reed stems. Its loud, distinctive vocalizations serve as
    the most reliable means of detecting its presence in suitable wetland habitats.'
migration:
