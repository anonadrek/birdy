description:
  sv: '# Stäppsångare


    Stäppsångaren är en liten och diskret gråbrun sångare som tillhör familjen rörsångare.
    Den är svår att skilja från många andra små sångare, men kännetecknas av sin relativt
    enfärgade, grågråbrun dräkt utan tydliga markerings. Fågeln är liten och kompakt
    med kort stjärt.


    Arten häckar från den europeiska delen av Ryssland österut till västra Mongoliet
    och västra Kina. Den har på senare år etablerat en mindre population även i Finland.
    Under vintern flyttar stäppsångaren huvudsakligen till Indien. I Sverige är den
    en tillfällig gäst som kan observeras vid långväga flyttningar.


    Stäppsångaren är en diskret fågel som ofta hålls till tät vegetation. Den söker
    föda lågt bland buskar och låg växtlighet. Arten är känd för sitt livliga beteende
    och rörlighet när den jagar insekter. IUCN kategoriserar arten som livskraftig,
    vilket indikerar en stabil population.'
  en: '# Booted Warbler


    The Booted Warbler is a small passerine belonging to the reed and tree warbler
    family. It breeds across Eastern Europe and western Asia before undertaking long
    migrations to wintering grounds in south Asia. The species appears as a regular
    vagrant to Western Europe, making occasional appearances outside its normal range.


    This diminutive warbler shares characteristics typical of its family, though specific
    details about its appearance, behaviour, and vocalizations are limited in available
    sources. Like other members of the Acrocephalidae family, it is likely an active
    forager among vegetation, though further information would be needed to fully
    describe its feeding ecology and habitat preferences in detail.'
migration:
  sv: '# Stäppsångare – Förekomst i Skandinavien


    Stäppsångaren är en mycket sällsynt fågel i Skandinavien och Sverige, där den
    förekommer som tillfällig gäst. Arten häckar huvudsakligen från europiska Ryssland
    österut till västra Mongoliet och västra Kina, men har på senare tid etablerat
    en liten population i Finland. Under vintermånaderna flyttar stäppsångaren huvudsakligen
    till Indien för att övervintra. De få observationer som gjorts i Sverige utgör
    sannolikt spridningsindivider under flyttningsperioderna.'
  en: '# Booted Warbler in Scandinavia/Northern Europe


    The Booted Warbler is a rare vagrant to Scandinavia and Northern Europe rather
    than a regular migratory species. This Eastern European and western Asian breeder
    winters in south Asia, with its primary range lying well south and east of Scandinavia.
    Occasionally, individuals appear in Western Europe during migration periods, making
    records in Scandinavian countries exceptional rather than predictable. When sightings
    do occur, they typically happen during spring or autumn migration windows as birds
    disperse from their breeding grounds. The species should not be expected as a
    regular seasonal visitor to the region.'
