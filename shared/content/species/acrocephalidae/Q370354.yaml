description:
  sv: '# Saxaulsångare


    Saxaulsångaren är en ljust gråbrun sångare med ett diskret utseende som passar
    väl för sitt hemland. Den tillhör rörsångarfamiljen och är en medelstor sångare
    med en förhållandevis lång stjärt. Fågeln är svår att särskilja från närbesläktade
    arter i fält.


    Arten häckar främst i västra Centralasien, ofta i täta buskområden och saxaulfält,
    varifrån dess svenska namn kommer. Under hösten övervintrare den på Indiska halvön,
    där den håller sig i öppen vegetation. I Europa är saxaulsångaren mycket sällsynt
    och endast observerad vid några enstaka tillfällen.


    Saxaulsångaren behandlades tidigare som samma art som stäppsångaren under det
    gemensamma namnet gråsångare. IUCN kategoriserar arten som livskraftig, vilket
    tyder på att populationen är stabil.'
  en: ''
migration:
  sv: '# Saxaulsångare (Iduna rama) i Norden


    Saxaulsångaren är en mycket sällsynt gäst i Europa och förekommer således ytterst
    sporadiskt i Skandinavien och Nordeuropa. Arten häckar främst i västra Centralasien
    och övervintrar på Indiska halvön, vilket innebär att den ligger långt från våra
    nordiska områden under båda årstiderna. De få observationer som gjorts i regionen
    representerar troligtvis överblivna eller vilsekomna individer under flyttningstiderna,
    men arten utgör ingen regelbunden del av den skandinaviska fågelfaunan.'
  en: ''
