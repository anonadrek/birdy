description:
  sv: '# Macchiasångare


    Macchiasångaren är en ljusbrun medelstor sångare som tillhör familjen rörsångare.
    Den kännetecknas av sin diskreta färgteckning som passar väl in i den torra, buskig
    miljön den föredrar.


    Arten häckar på Iberiska halvön och i Nordafrika, där den förekommer i Marocko,
    Tunisien, Algeriet och Libyen. Den är en flyttfågel som under vintertid migrerar
    till Västafrika söder om Sahara. Macchiasångaren föredrar täta buskar och buskmark
    där den söker föda och bygger sitt bo.


    Tidigare klassificerades macchiasångaren som en underart av eksångaren, men den
    behandlas numera som en egen art. Arten har ett livskraftigt bestånd och anses
    inte vara hotad.'
  en: '# Western Olivaceous Warbler


    The western olivaceous warbler is a small, inconspicuous warbler belonging to
    the Acrocephalidae family. It shares the genus Iduna with other tree warblers
    and was historically grouped with the eastern olivaceous warbler before modern
    taxonomy separated them into distinct species. The bird is alternatively known
    as the isabelline warbler.


    This species exhibits the typical behaviour of acrocephaline warblers, though
    detailed information about its appearance, vocalizations, and habitat preferences
    requires further source material. Like many warblers in its family, it is likely
    a small, subtly coloured bird adapted to particular vegetation types. Observers
    interested in identifying this species should consult field guides specific to
    their region, as the western olivaceous warbler occupies particular geographic
    ranges where it can be distinguished from related species.'
migration:
  sv: '# Macchiasångare – Förekomst i Skandinavien/Nordeuropa


    Macchiasångare förekommer inte naturligt i Skandinavien eller övriga Nordeuropa.
    Arten häckar på Iberiska halvön och i Nordafrika (Marocko, Tunisien, Algeriet
    och Libyen), och övervintrerar i Västafrika söder om Sahara. Som långdistansmigrant
    slutför den en årlig flyttning mellan sitt häckningsområde och sitt vinterkvarter.
    Arten är därför endast av akademiskt intresse för nordeuropeiska fågelbeskrivningar
    och registreras endast som extremt sällsynt vagare i norra Europa.'
