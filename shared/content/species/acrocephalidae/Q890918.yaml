description:
  sv: ''
  en: '# Cape Verde Warbler


    The Cape Verde warbler is a small Old World warbler belonging to the Acrocephalidae
    family. As a species adapted to wetland habitats, it inhabits well-vegetated valleys
    across several islands, deliberately avoiding drier regions. It shows a preference
    for reedbeds and similar dense vegetation where it constructs suspended nests.


    This warbler breeds in specific island locations, laying clutches of two to three
    eggs in its carefully woven nests suspended among reeds. The species has experienced
    range changes over time, having previously occupied areas where it no longer breeds.
    Its dependence on well-vegetated valleys and reedbeds makes it vulnerable to habitat
    loss and environmental changes affecting these specialized wetland ecosystems.


    The Cape Verde warbler represents an important part of the endemic birdlife of
    its island range, with conservation of its remaining breeding sites being crucial
    for the species'' survival.'
