description:
  sv: '# Busksångare


    Busksångaren är en liten sångfågel från familjen rörsångare. Den är diskret och
    svår att särskilja från närbesläktade arter, med gråbrun ovansida och ljusare
    undersida. Fågeln är aktiv och rörig, ofta gömd i tätt vegetation där den gärna
    håller till.


    Busksångaren har en karakteristisk sång som består av snabba, repetitiva fraser
    – ofta kallad "tjattrande" – som tjänar till att göra den hörd trots att den stannar
    gömda i buskvegetationen. Fågeln är främst aktiv under skymningen och tidig morgon.


    Arten häckar från Sverige och österut till Bajkalsjön, Mongoliet och västra Kina,
    där den föredrar fuktig vegetations- och rörbevuxen miljö. Under vintern migrerar
    den till Indien och Sri Lanka. Arten klassificeras som livskraftig av IUCN och
    utgör ingen bevaringsbetydelse för närvarande.'
  en: ''
migration:
  sv: '# Busksångare – Förekomst i Nordeuropa


    Busksångare är en långdistansflyttare som häckar i Sverige och övriga delar av
    sitt nordeuropeiska utbredningsområde. Arten ankommer till häckningsområdena under
    våren för att sedan föröka sig. När häckningsperioden avslutas initieras höstflyttningen,
    varvid fåglarna lämnar Skandinavien och övriga nordiska regioner. Arten övervintar
    långt bort i Indien och Sri Lanka, varför den inte förekommer i Nordeuropa under
    vintermånaderna.'
  en: ''
