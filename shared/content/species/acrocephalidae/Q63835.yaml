description:
  sv: '# Olivsångare


    Olivsångare är en tätting i familjen rörsångare och det största medlemmet i sitt
    släkte. Arten häckar i sydöstra Europa och det västligaste Asien, där den förekommer
    i lämpliga biotoper under sommarmånaderna.


    Arten är en migrationsvandrare som lämnar sina häckningsområden för att övervintra
    på andra håll. Som medlem av rörsångfamiljen är olivsångare en insektätare som
    uppsöker områden med lämplig vegetation för födosök och häckning.'
  en: '# Olive-tree Warbler


    The olive-tree warbler is a small passerine belonging to the reed and tree warbler
    family. It is a migratory species with a breeding range in southeast Europe and
    the Near East, undertaking long-distance migrations to winter across eastern and
    southern Africa, from Kenya southward to South Africa.


    The species is adapted to its woodland and scrubland habitats, where it forages
    and nests during the breeding season. Like other members of its family, it is
    primarily insectivorous, gleaning food from vegetation. Its movements between
    breeding and wintering grounds follow the seasonal patterns typical of Old World
    warblers, allowing it to exploit different resource-rich environments throughout
    the year.


    Observers interested in this species should look for it in appropriate olive-tree
    and scrub habitats within its range during the breeding season, while those watching
    African locations may encounter it during the winter months when substantial populations
    arrive from their European breeding grounds.'
migration:
  sv: 'sv: Migrationsdata saknas för denna art.


    en: Migration data unavailable for this species.'
  en: '# Olive-tree Warbler in Scandinavia/Northern Europe


    The Olive-tree Warbler is not a regular occurrence in Scandinavia or Northern
    Europe. This species breeds in southeast Europe and the Near East, well south
    of the Scandinavian region. As a long-distance migrant, it winters in eastern
    and southern Africa from Kenya to South Africa, following a migration route that
    does not typically include Northern Europe. Any sightings in Scandinavia would
    represent vagrant individuals far outside their normal range and breeding distribution.'
