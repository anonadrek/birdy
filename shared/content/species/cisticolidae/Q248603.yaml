description:
  sv: '# Nilprinia


    Nilprinia är en liten fågel i familjen grässångare. Den erkändes som egen art
    år 2021, då den tidigare hade behandlats tillsammans med den östligare dvärgprinian
    under det gemensamma namnet streckad prinia. De två arterna är närbesläktade men
    utgör nu två skilda arter.


    Arten är känd för sitt livliga beteende och förekommer framför allt i torra och
    halvöppna habitat. Nilprinia är en aktiv och rörig fågel som ofta syns i låg växtlighet
    där den söker föda. Liksom andra grässångare är det en relativt blyg art som kan
    vara svår att få syn på trots sitt aktiva väsen.'
  en: '# Graceful Prinia


    The graceful prinia is a small warbler belonging to the Cisticolidae family, characterized
    by its delicate, streamlined appearance typical of grass warblers. It is a resident
    breeder found across northeastern Africa and southern Asia, inhabiting regions
    from Egypt and Somalia eastward to Saudi Arabia.


    This diminutive species favors open grassland and scrubland habitats where it
    hunts for small insects among vegetation. The graceful prinia is an active forager,
    often seen moving restlessly through low growth. It tends to be a permanent resident
    throughout its range, remaining in breeding territories year-round rather than
    undertaking seasonal migrations.


    The bird''s vocalizations are characteristic of the wren-warblers, with sharp,
    scratchy calls that reflect its common alternative name, the streaked wren-warbler.
    Its plumage displays subtle streaking patterns that provide effective camouflage
    within its grassland environment, blending readily with dry vegetation and sparse
    scrub.'
