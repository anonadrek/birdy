description:
  sv: ''
  en: '# Streaked Weaver


    The streaked weaver is a weaver bird distributed across South and Southeast Asia,
    inhabiting countries from Bangladesh and Nepal westward to Pakistan, and eastward
    through Myanmar, Thailand, and Vietnam to Indonesia. It has also been introduced
    to Qatar and the United Arab Emirates. This species is less commonly encountered
    than the closely related baya weaver, with which it shares similar overall appearance.


    The key distinguishing feature of the streaked weaver is its streaked underparts,
    which differentiate it from the baya weaver. Like other members of the weaver
    family, it is an accomplished builder of intricate woven nests. The species typically
    favors reed beds, wetland margins, and cultivated areas where suitable vegetation
    provides both feeding and nesting opportunities. It often occurs in small to moderate-sized
    flocks, particularly outside the breeding season.


    Despite its wide distribution across Asian wetlands and agricultural regions,
    the streaked weaver remains relatively inconspicuous and less frequently observed
    than several other weaver species in its range. Its preference for dense reed
    growth and marshy habitats means it may be easily overlooked by casual birdwatchers,
    though patient observation in suitable wetland areas can yield rewarding sightings.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Streaked Weaver is a resident bird of South and Southeast Asia, with no established
    occurrence or migration patterns documented for Scandinavia or Northern Europe.
    This species is endemic to regions including India, Bangladesh, Thailand, Vietnam,
    and other Asian countries, remaining far outside the natural range of Northern
    European birds. There are no records of this weaver appearing in Scandinavian
    territories during any season.'
