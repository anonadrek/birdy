description:
  sv: '# Svarthuvad vävare


    Svarthuvad vävare är en tätting som tillhör familjen vävare och förekommer naturligt
    i Afrika söder om Sahara. Arten har även introducerats till södra Portugal, där
    en etablerad frilevande population nu finns.


    Arten är en mindre fågel med karakteristiska färgteckning. Det är en medlem av
    vävarfamiljen, som är känd för sin skickliga nästvävning. Svarthuvad vävare är
    framför allt en afriansk art, men dess närvaro i Portugal visar hur vissa fågelarter
    kan etablera sig långt utanför sitt ursprungliga utbredningsområde när de kommer
    till nya miljöer.


    Arten är anpassad till sitt naturliga habitat i Afrika söder om Sahara, där den
    förmodligen förekommer i olika typer av vegetationsmiljöer typiska för vävare.
    Som många medlemmar av vävarfamiljen är det en social fågel som ofta förekommer
    i mindre eller större grupper.'
  en: '# Black-headed Weaver


    The black-headed weaver is a small weaver species found in damp tropical habitats
    across Africa. It is a resident breeder, meaning populations remain year-round
    in their territories rather than migrating. The species is also known as the yellow-backed
    weaver, a reference to the coloring visible on its back.


    This weaver frequents wetland areas and other damp environments where it can find
    suitable nesting sites and food. Like other members of the weaver family, it is
    known for constructing intricate woven nests, though specific details about its
    appearance, vocalizations, and detailed behavior patterns would benefit from field
    observation or more specialized ornithological sources.


    The species represents one of Africa''s diverse weaver populations adapted to
    tropical wetland ecosystems.'
