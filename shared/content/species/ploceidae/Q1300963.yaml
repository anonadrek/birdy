description:
  sv: ''
  en: '# Yellow-crowned Bishop


    The Yellow-crowned Bishop is a striking African weaver with dramatic seasonal
    plumage changes. During breeding season, males display a distinctive appearance
    with bright yellow and black plumage, while females retain predominantly brown
    coloration year-round. This sexual dimorphism is particularly pronounced in breeding
    males, making them unmistakable during this period. Outside the breeding season,
    males become less vibrant, resembling females more closely.


    These birds are found across Africa south of the Sahara in suitable habitats,
    typically in grasslands and reed beds. They are social birds often seen in small
    groups, particularly when feeding. Four subspecies are recognized, distributed
    across different regions of the African continent, each showing slight variations
    in plumage intensity and distribution patterns.


    The species'' striking breeding plumage and distinctive appearance make it a notable
    sight for birdwatchers during the appropriate season. Their association with wetland
    and grassland habitats means they are most readily observed in these environments,
    where their seasonal transformations can be particularly dramatic and visible.'
