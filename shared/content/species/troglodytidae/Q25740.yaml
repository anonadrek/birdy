description:
  sv: '# Gärdsmyg


    Gärdsmyg är en mycket liten brun tätting som genast känns igen på sin korta, upprätta
    stjärt. Fågeln är kompakt byggd med rynklig fjäderdräkt och lever mestadels av
    insekter som det plockar från vegetation och bark.


    Arten är mycket livlig och rörig i sitt beteende, med snabba, spretiga rörelser
    när det söker föda. Gärdsmyget är en ihärdig försvarare av sitt revir och kan
    verka överraskande aggressivt för sin storlek. Arten har en kraftfull och överraskande
    högljudd sång för en så liten fågel, ofta levererad från väl dolda platser i tät
    vegetation.


    Gärdsmyget är utbrett och återfinns i många olika miljöer där det finns tät växtlighet
    – i trädgårdar, buskskogar, heteromt terräng och nära människobygder. Det är en
    året-runt-bosättare i många områden, även om populationerna kan variera kraftigt
    efter hårda vintrar.'
  en: '# Eurasian Wren


    The Eurasian wren is a diminutive insectivorous bird and the only wren species
    found across the Old World, inhabiting Eurasia and North Africa. It is instantly
    recognizable by its very short, often-erect tail, short neck, and relatively long
    thin bill. The plumage is russet-brown above with paler buff-brown underparts,
    finely barred with darker markings throughout, and a distinctive cream-buff stripe
    above the eye. Males and females are identical in appearance.


    This energetic bird frequents dense vegetation, woodland edges, hedgerows, and
    scrubland where it forages actively for insects and spiders among leaf litter
    and undergrowth. It moves with characteristic jerky, mouse-like hops and frequently
    cocks its tail upright. Despite its tiny size, the wren is remarkably bold and
    pugnacious.


    The wren''s call is striking—a loud, explosive trill that seems disproportionate
    to its diminutive body. This penetrating song is delivered from exposed perches
    and serves to establish territory. The species is found across much of temperate
    and boreal regions, though populations in northern areas may migrate southward
    during harsh winters. It remains one of Europe''s most familiar garden birds.'
migration:
  sv: '# Gärdsmyg – förekomst i Skandinavien året runt


    Gärdsmyget är en året runt bosatt art i Skandinavien och övriga Nordeuropa. Även
    om huvuddelen av populationen är stationär, förekommer viss västvandring under
    hösten, där nordliga populationer från Skandinavien och Ryssland förflyttar sig
    västerut. Arten är känslig för hårda vintrar, vilket kan orsaka omfattande dödelighet
    under extrema väderförhållanden. Under våren återvänder övervintrade individer
    gradvis till sina häckningsområden från mars till april.


    Gärdsmyget förekommer året om i olika delar av sitt utbredningsområde, men övervintringsområdet
    varierar mellan milder västra kuster och kallare inre delar. Den är främst aktiv
    i tätare vegetation och buskmark där den söker skydd och föda.'
  en: '# Eurasian Wren in Northern Europe


    The Eurasian Wren is a resident species throughout Scandinavia and Northern Europe,
    present year-round. Northern populations show partial migration, with some individuals
    moving southward during harsh winters, while others remain in their territories.
    Wrens are highly adaptable to cold climates and can survive winter by sheltering
    in dense vegetation, hedgerows, and man-made structures. Spring arrivals and autumn
    departures are less pronounced than in many migratory species, as populations
    are bolstered by resident birds that do not leave. In southern Scandinavia, wrens
    are more likely to be permanent residents, whereas northern populations may show
    greater seasonal movement depending on weather severity.'
