description:
  sv: ''
  en: '# Senegal Thick-knee


    The Senegal thick-knee is a stone-curlew belonging to the wader family Burhinidae,
    easily recognized by its distinctively long, thick legs with prominent joints.
    These legs are typically yellow or greenish in colour, giving the bird its characteristic
    appearance and scientific name. It is a member of a specialized group of waders
    adapted to terrestrial rather than aquatic environments.


    The species is primarily nocturnal and crepuscular, being most active during dawn,
    dusk, and night hours. It forages on the ground for invertebrates and other small
    prey, moving with a characteristic upright posture. When disturbed, it tends to
    freeze or run rather than immediately taking flight, relying on its cryptic plumage
    for camouflage in its natural habitat.


    The Senegal thick-knee inhabits open and semi-open environments, preferring stony
    or sandy ground with sparse vegetation. It is found across sub-Saharan Africa
    in appropriate habitat, though specific distribution details would require additional
    sources beyond the provided text. Its nocturnal habits make it challenging to
    observe, though its presence may be detected through its distinctive calls during
    night hours.'
