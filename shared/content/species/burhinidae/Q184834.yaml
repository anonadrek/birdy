description:
  sv: '# Tjockfot


    Tjockfoten är en skymnings- och nattaktiv vadarfågel som skiljer sig från många
    andra vadare genom att det föredrar torra, sandiga områden. Den är den nordligaste
    arten inom familjen tjockfotar och har ett omfattande utbredningsområde som sträcker
    sig över stora delar av Europa, norra Afrika och sydvästra Asien. Fågeln är mestadels
    aktiv under skymningen och på natten, vilket gör den svår att observera under
    dagtid.


    Tjockfotens läte påminner slående om storspovens kraftiga rop, vilket återspeglas
    i det engelska namnet Stone Curlew. Denna karakteristiska röst är ofta det första
    tecknet på fågelns närvaro. Arten förekommer regelbundet utanför sitt normala
    utbredningsområde och ses årligen på migration, bland annat i Sverige där den
    är en återkommande besökare.


    Globalt anses tjockfoten vara livskraftig enligt IUCN, men arten har genomgått
    en kraftig minskning inom Europa. Detta gör den till ett exempel på en fågel som
    förutsätter särskilda habitatkrav och är känslig för förändringar i sitt miljöer,
    trots att den inte är klassificerad som hotad på världsbasis.'
  en: ''
migration:
  sv: '# Tjockfot – Förekomst i Skandinavien och Nordeuropa


    Tjockfoten är en sällsynt besökare i Skandinavien och förekommer regelbundet norr
    om sitt huvudsakliga utbredningsområde. Arten ses årligen i Sverige, särskilt
    under våren och sommaren när den anlander från sina övervintringskvarteren i södra
    Europa och norra Afrika. Tjockfoten är en flyttfågel som övervintra söder om Medelhavet
    och återvänder till nordeuropeiska områden under häckningssäsongen. I Skandinavien
    är arten dock alltid en ovanlig gäst snarare än en etablerad häckare, och observationer
    är begränsade till sporadiska upptäckter under lämpliga årstider.'
  en: ''
