description:
  sv: ''
  en: '# Great Stone-curlew


    The great stone-curlew is a large, distinctive wader belonging to the thick-knee
    family. It inhabits tropical regions across southern Asia, from the Indian subcontinent
    through South-east Asia, where it remains year-round as a resident breeder.


    This species favors open, stony habitats where it blends remarkably well with
    its surroundings through cryptic plumage. It is primarily nocturnal and crepuscular,
    becoming most active during dawn, dusk, and night hours. The bird is relatively
    solitary or found in small groups, spending much of the day resting motionless
    in shaded spots.


    Little detailed information is provided in the source material regarding its specific
    appearance beyond its large size, call characteristics, or precise behavioral
    preferences. However, like other stone-curlews, it likely feeds on invertebrates
    and small vertebrates, hunted primarily during low-light periods. Observers seeking
    this species should focus on open, sparsely vegetated ground in appropriate tropical
    regions during early morning or evening hours, when it becomes more conspicuous
    and vocal.'
