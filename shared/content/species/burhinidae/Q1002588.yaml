description:
  sv: ''
  en: '# Spotted Thick-knee


    The spotted thick-knee is a distinctive wader belonging to the Burhinidae family,
    found across tropical regions of central and southern Africa. Known locally as
    the spotted dikkop or Cape thick-knee, it is characterized by its notably thick
    legs and sturdy build adapted to terrestrial habitats.


    This species is primarily nocturnal and crepuscular, being most active during
    dawn, dusk, and night hours. It frequents open and semi-open habitats, including
    grasslands and scrubland areas where it can forage for invertebrates and small
    vertebrates on the ground. Its behaviour is typically cautious and alert, relying
    on camouflage and remaining still when threatened.


    The spotted thick-knee produces distinctive calls, particularly during evening
    and night, which help identify it in the field. Its plumage provides effective
    camouflage in its preferred habitats, with mottled patterns that break up its
    outline. The species is generally solitary or found in pairs, and it nests on
    the ground in simple scrapes. While details of its exact appearance and vocalizations
    would benefit from field observation, it remains a challenging but rewarding species
    for dedicated bird enthusiasts to locate and observe in its natural range.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Spotted Thick-knee is a resident species of tropical Africa with no established
    occurrence in Scandinavia or Northern Europe. The source material indicates it
    is native to central and southern African regions only, with no mention of migratory
    movements toward or presence in northern European territories. Therefore, information
    about its occurrence in Scandinavia throughout the year cannot be provided.'
