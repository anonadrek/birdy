description:
  sv: ''
  en: '# Abyssinian Roller


    The Abyssinian roller is a striking member of the roller family found across tropical
    Africa''s Sahel belt, south of the Sahara. It inhabits this region year-round
    in the south, though northern populations migrate southward after the wet season,
    making them short-distance migrants that follow seasonal rainfall patterns.


    This species is characterized by vibrant plumage typical of rollers, with bold
    coloration that makes it conspicuous in its savanna and open woodland habitats.
    The Abyssinian roller is an active flyer, often seen hunting from exposed perches
    where it watches for prey before diving to catch insects in mid-air—a hunting
    technique that gives the roller family its distinctive name.


    The bird''s call is a distinctive harsh, grating sound, often delivered from prominent
    perches or in flight. It prefers relatively open country where it can spot and
    pursue prey effectively, avoiding dense forest. Its presence and movements are
    closely tied to the availability of insects and local weather patterns, making
    it a seasonal presence in some areas and a permanent resident in others.'
migration:
  sv: ''
  en: '# Abyssinian Roller in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Abyssinian Roller is a tropical African species with no established presence
    in Scandinavia or Northern Europe. It breeds in the Sahel region south of the
    Sahara and does not occur naturally in northern European regions. While northern
    African populations undertake short-distance migrations southward after breeding,
    this movement is confined to tropical Africa and does not extend to Scandinavia
    or Northern Europe. This species is entirely absent from the Nordic region throughout
    the year.'
