description:
  sv: '# Irakskriktrast


    Irakskriktrast är en medelstor tätting som tillhör familjen fnittertrastar. Arten
    har en begränsad utbredning och förekommer endast i Mellanöstern, där den är anpassad
    till de specifika miljöer som finns i denna region.


    Arten anses vara livskraftig trots att populationen minskar. Irakskriktrast är
    därför inte klassificerad som hotad enligt internationella bevaringskriterier,
    men det är viktigt att övervaka utvecklingen för att säkerställa att arten inte
    försämras ytterligare framöver.'
  en: '# Iraq Babbler


    The Iraq babbler is a member of the Leiothrichidae family, a group of small to
    medium-sized songbirds. This species is endemic to reed bed habitats within the
    Tigris-Euphrates Valley region, where it has adapted to life among dense aquatic
    vegetation.


    The bird is found across a limited geographic range that encompasses parts of
    the Middle East, preferring the thick reed beds and marshland environments that
    characterize its preferred habitat. Its dependence on these specific wetland ecosystems
    makes it particularly vulnerable to habitat degradation and water management changes
    in its region.


    Like other babblers, the Iraq babbler is likely a social species, though detailed
    behavioral accounts are limited in general literature. The reed bed habitat it
    favors provides both shelter and feeding opportunities among the dense plant growth.
    More specific information about its appearance, vocalizations, and detailed behavior
    patterns would require consulting specialized ornithological field guides focused
    on Middle Eastern avifauna.'
