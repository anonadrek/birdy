description:
  sv: '# Afghanskriktrast


    Afghanskriktrast är en asiatisk fågel som tillhör familjen fnittertrastar. Den
    förekommer i västra Asien och har sitt utbredningsområde från Irak till Pakistan.
    Arten är nära släkt med orientskriktrast, och vissa taxonomer behandlar den som
    en del av den arten.


    Denna fågel är anpassad till de torra och halvöppna habitat som karakteriserar
    sitt utbredningsområde. Som medlem av fnittertrastarfamiljen är den socialdriven
    och ses ofta i små grupper. Som många fåglar inom familjen är den en aktiv och
    livlig fågel med typiska beteenden för trastar.


    För den som är intresserad av asiatisk fågelfauna utgör afghanskriktrast ett exempel
    på de många arter som förekommer i regionens torra områden.'
  en: '# Afghan Babbler


    The Afghan babbler is a member of the Leiothrichidae family, a group of Asian
    songbirds known for their vocal abilities and social behaviour. This species was
    historically classified as a subspecies of the common babbler before being recognized
    as a distinct species.


    The Afghan babbler is found across a range spanning from southeastern Iraq through
    to southwestern Pakistan, inhabiting arid and semi-arid regions of this broad
    geographic band. Like other babblers, it is likely a gregarious bird, typically
    found in small flocks rather than solitary individuals. The species shares behavioural
    characteristics typical of its family, being active and vocal birds that communicate
    frequently within their groups.


    Further details about its specific appearance, vocalizations, and exact habitat
    preferences would require additional field guide sources, as the available information
    focuses primarily on its taxonomic status and distribution range.'
