description:
  sv: ''
  en: '# Golden Nightjar


    The golden nightjar is a nightjar species found across the Sahel region of northern
    Sub-Saharan Africa. Like other members of the Caprimulgidae family, it is a nocturnal
    insectivore adapted for hunting flying insects in low light conditions.


    This species shares the characteristic features of nightjars: a streamlined body,
    large eyes, and a wide gape for capturing insects in flight. The plumage displays
    golden and buff tones that provide effective camouflage in its arid habitat. During
    the day, it rests on the ground or among branches, where its cryptic coloration
    makes it difficult to spot.


    The golden nightjar is primarily crepuscular and nocturnal, becoming active at
    dusk to hunt aerial insects. Like other nightjars, it produces distinctive vocalizations,
    though specific details of its call are not widely documented. It inhabits open
    and semi-open landscapes typical of the Sahel, including scrubland and sparse
    woodland areas. Its preference for arid regions distinguishes it from many other
    nightjar species found in more heavily vegetated habitats.'
