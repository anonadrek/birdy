description:
  sv: ''
  en: '# Red-necked Nightjar


    The red-necked nightjar is Europe''s largest nightjar species, distinguished by
    its rufous-tinged neck and head markings that give it its common name. Like other
    nightjars, it possesses cryptic plumage with mottled grey-brown tones that provide
    excellent camouflage against bark and leaf litter. The species has the characteristic
    broad mouth and flattened head typical of its family, adapted for catching insects
    in flight during twilight hours.


    This nocturnal hunter is primarily crepuscular and nocturnal, remaining hidden
    during daylight on the ground or perched lengthwise on branches. It feeds on flying
    insects captured in aerial pursuits, using its wide gape to engulf prey. The bird''s
    call is a distinctive churring sound, often delivered from perches at dusk and
    throughout the night.


    The red-necked nightjar breeds across Iberia and North Africa during the warmer
    months, favouring dry, rocky terrain and woodland edges. It is a long-distance
    migrant, wintering in the savannas and open woodlands of tropical West Africa
    before returning to breeding grounds in spring. It is rarely seen by day due to
    its cryptic habits and nocturnal nature, though its presence can be detected by
    its characteristic calls during breeding season.'
migration:
  sv: ''
  en: '# Red-necked Nightjar - Scandinavian Occurrence


    The red-necked nightjar is extremely rare in Scandinavia and Northern Europe.
    This species breeds in Iberia and North Africa, with populations wintering in
    tropical West Africa. Given its southern breeding range and African wintering
    grounds, it does not naturally occur in Scandinavian territory during any season.
    Any records in Scandinavia would represent exceptional vagrants far outside the
    species'' normal range. The bird''s migratory pathway between Iberian breeding
    grounds and West African wintering areas lies well south of Northern Europe.'
