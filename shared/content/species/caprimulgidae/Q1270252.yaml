description:
  sv: ''
  en: '# Plain Nightjar


    The plain nightjar is a cryptically plumaged nocturnal bird found across the Sahel,
    Sudan, the Horn of Africa, and southwestern Arabian Peninsula, with populations
    migrating to lower latitudes during certain seasons. It exhibits grey-brown, brown,
    and rufous color morphs, providing excellent camouflage against its preferred
    habitat. Sexual dimorphism is evident: males display distinctive white spots on
    the primary feathers and conspicuous white corners on the tail, while lacking
    white on the throat. Females present a subtler appearance with buffy-brown wing
    spots and absence of white tail markings.


    Like other nightjars, this species is primarily nocturnal and aerial, hunting
    insects in flight during darkness. Its preferred habitats include open and semi-open
    terrain with sparse vegetation. The bird''s behavior and vocalizations are typical
    of nightjars, though specific call descriptions require additional sources for
    detailed information.


    For birders seeking this species, knowledge of seasonal movements and habitat
    preferences is essential. The plain nightjar''s cryptic coloration means visual
    identification relies heavily on distinguishing the white markings in males and
    the overall plumage patterns, making flashlight work valuable during nocturnal
    searches in appropriate habitats.'
migration:
  sv: ''
  en: '# Plain Nightjar in Northern Europe


    Migration data unavailable for this species.


    The Plain Nightjar is an African species with a breeding range confined to the
    southern Sahel, southern Sudan, the Horn of Africa, and southwestern Arabian Peninsula.
    Its migratory movements are limited to lower latitudes within Africa, including
    central Congo and northern Tanzania. This species does not occur in Scandinavia
    or Northern Europe during any season and therefore has no relevance to northern
    European avifauna or seasonal occurrence patterns.'
