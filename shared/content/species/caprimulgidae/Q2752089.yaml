description:
  sv: '# Sindnattskärra


    Sindnattskärra är en asiatisk nattskärra som främst förekommer från sydvästra
    Iran till nordvästra Indien. Det är en livskraftig art enligt IUCN:s bedömning.


    Som andra nattskärror är sindnattskärran en nattaktiv insektätare som är väl anpassad
    för sitt levnadssätt. Arten föredrar torra och halvöppna miljöer där den kan jaga
    flygande insekter under skymningen och natten. Det är en diskret fågel som är
    svår att iaktta under dagen, då den vilar på marken eller på grenar där dess kamouflerade
    fjäderdräkt gör den nästan omöjlig att upptäcka.


    Som många nattskärror har sindnattskärran ett karakteristiskt samtal som ofta
    hörs under kvällen och natten. Arten är huvudsakligen stationär eller återvändande
    besökare i sina utbredningsområden, beroende på säsong och lokala förhållanden.'
  en: ''
