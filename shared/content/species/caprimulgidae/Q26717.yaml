description:
  sv: '# Nattskärra


    Nattskärra är en liten, mörkgrå fågel med tätt mönstrad fjäderdräkt som ger utmärkt
    kamouflage mot trädbark. Det är en utpräglad nattaktiv art som är activ framför
    allt under skymningen och natten. Fågeln har stora ögon anpassade för svagt ljus
    och ett brett bett perfekt för att fånga flygande insekter.


    Arten jagar med elegant och vig flugning, ofta över öppna eller halvöppna områden.
    Under dagen vilar det på marken eller längs grenar, där dess färgning gör det
    nästan omöjligt att upptäcka. Nattskärra är känd för sitt karakteristiska ljud
    – ett långt, tremolande, maskinliknande trillande som hörs särskilt vid gryning
    och skymning.


    Arten häckar i Eurasien och nordvästra Afrika, ofta i glesa skogar, ljunghedar
    och på torra, öppna marker. Det är en långflyttare som återvänder från sitt afrikaniska
    övervintringsområde för att häcka under sommaren. Även om arten inte är sällsynt
    där det förekommer lämplig miljö, kan det vara svårt att observera på grund av
    dess hemliga levnadssätt och nattaktiva vanor.'
  en: '# European Nightjar


    The European nightjar is a nocturnal and crepuscular bird found across Europe
    and the Palearctic, wintering in sub-Saharan Africa. Its densely patterned grey
    and brown plumage provides excellent camouflage during the day, when it rests
    motionless on the ground or along branches. In flight at night, males reveal distinctive
    white patches in the wings and tail, making them more visible. The species'' cryptic
    appearance and nocturnal habits make daytime observation challenging.


    This bird is best located by listening for its characteristic churring call delivered
    at dusk and through the night. The sound resembles a prolonged, rolling trill.
    European nightjars are typically found in open or sparsely vegetated habitats
    such as heathland, moorland, and woodland edges. Active predators of flying insects,
    they pursue their prey in fast, erratic flight during darkness. Six subspecies
    exist across the range, with birds becoming progressively smaller and paler toward
    the eastern limits of distribution. All populations are migratory, abandoning
    breeding grounds as insect availability declines in autumn.'
migration:
  sv: Nattskärran är en långflygare som anländer till Skandinavien och Nordeuropa
    under våren, typiskt från april till maj. Arten häckar i större delen av regionen
    under sommarmånaderna, särskilt i öppna och halvöppna biotoper med ljung och gamla
    granar. I augusti och september påbörjar populationen sin långstrackade höstmigrering
    söderut mot övervintringskvarteren i Afrika söder om Sahara. Under vintermånaderna
    är arten helt frånvarande från nordiska områdena. Nattskärran är således en typisk
    sommargäst i Skandinavien och Nordeuropa.
  en: '# European Nightjar in Northern Europe


    The European Nightjar is a summer breeding visitor to Scandinavia and Northern
    Europe, arriving in late May and June after wintering in sub-Saharan Africa. This
    strictly migratory species departs in August and September to return to its African
    wintering grounds, making it a long-distance trans-Saharan migrant. The species
    is entirely absent during winter months. Males arrive slightly before females,
    and both sexes depend on warm nights for their insectivorous feeding, making them
    sensitive to cool weather patterns during their breeding season in northern regions.'
