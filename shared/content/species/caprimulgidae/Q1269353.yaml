description:
  sv: ''
  en: '# Nubian Nightjar


    The Nubian Nightjar is a member of the nightjar family, specialized for nocturnal
    insect hunting. Like other nightjars, it possesses cryptic plumage and a wide
    mouth adapted for catching flying insects in darkness. Its precise appearance
    and distinctive calls reflect adaptations to its specific desert and salt marsh
    habitats.


    This species inhabits salt marshes across arid regions of northeast Africa and
    the Arabian Peninsula. It is primarily nocturnal, becoming active at dusk when
    it hunts for insects. As with most nightjars, it likely has a characteristic churring
    or repetitive call used during breeding season, though detailed behavioral descriptions
    are limited in general sources.


    The Nubian Nightjar''s distribution is restricted to salt marsh and coastal environments
    in hot, dry climates, where it exploits the abundance of nocturnal insects. Its
    specialized habitat requirements and nocturnal habits make it relatively inconspicuous
    despite its range, and it remains less documented than many other nightjar species.'
