description:
  sv: ''
  en: '# Montane Nightjar


    The montane nightjar is a small nightjar inhabiting upland regions of Central
    and Eastern Africa, where it is locally common. Like other nightjars, it is a
    nocturnal insectivore with cryptic plumage that blends well with rocky and wooded
    mountain habitats, making it difficult to spot during daylight hours.


    This species is primarily active at dawn and dusk, when it hunts flying insects
    in the characteristic nightjar manner—catching prey mid-flight with its wide gaping
    mouth. It is most easily detected by its distinctive call, a repetitive churring
    or churr-churr sound that males produce from elevated perches at night during
    the breeding season.


    The montane nightjar typically inhabits mountainous terrain with suitable rocky
    outcrops and scattered vegetation, avoiding both dense forests and open plains.
    It prefers altitudes where montane woodland meets more open country, making it
    a characteristic bird of highland regions across its African range.'
