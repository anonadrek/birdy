description:
  sv: '# Skäggmes


    Skäggmes är en säregen och lättkänd fågel som trots sitt namn inte är närmare
    släkt med mesarna utan snarare med lärkor. Det är en medelstor fågel med karakteristisk
    utseende: hannen har en grå huvud- och ryggfärgning med vita kinder och ett påfallande
    svart "mustaschband" under ögat, vilket ger arten sitt namn. Honan är mer diskret
    brunaktig. Arten förekommer i vassrika våtmarker och är bunden till täta vassbestånd
    där den födosöker och häckar.


    Skäggmesen är en rörig och lika ofta hörbar som sedd fågel. Det utter ett karakteristiskt
    "tsching" eller "tschak" som hörs långt ut över vassbeltet. Under häckningstiden
    är hannen mycket aktiv och ses ofta sitta exponerat på vassknopparna.


    Arten påträffas i Europa och österut till Östkina, men har som svensk häckfågel
    en ganska begränsad utbredning med starkast fästen i vissa stora våtmarkskomplex.
    Sedan 1960-talet har den etablerat sig allt bättre som häckfågel i Sverige. Globalt
    anses beståndet vara stabilt och livskraftigt.'
  en: '# Bearded Reedling


    The bearded reedling is a distinctive small passerine with a notably long tail
    and striking appearance. Males display a striking black "moustache" marking on
    the face, while females and immatures are duller in coloration. Its compact body
    and proportionally elongated tail give it a characteristic silhouette as it moves
    through reed beds.


    This species inhabits reed beds near water across the temperate regions of Eurasia,
    where it forages for insects and reed seeds. It is an active, acrobatic feeder,
    often clinging to reed stems in small flocks, particularly outside the breeding
    season. The bearded reedling is relatively sedentary, though populations in northern
    areas may undertake seasonal movements.


    The bird''s call is distinctive and easily recognized—a sharp, diagnostic "ping"
    or metallic contact call that is frequently heard before the bird is seen. During
    breeding season, males produce a quiet, rambling song. Unique among small passerines,
    the bearded reedling is the sole member of its family, Panuridae, lacking close
    relationships to tits or parrotbills despite historical taxonomic associations
    with these groups.'
migration:
  sv: '# Skäggmes i Skandinavien och Nordeuropa


    Skäggmes är en vassbunden fågel som sedan 1960-talet etablerat sig som häckfågel
    i Sverige, framför allt vid större våtmarker som Tåkern. Arten är övervintrad
    och flyttfågel i regionen, där populationen påverkas kraftigt av vintrarnas stränghet.
    Under milda vintrar kan betydande antal stanna kvar, medan stränga vintrar orsakar
    omfattande flyttningar söderut. Huvudhäckningsperioden är under sommarmånaderna,
    då arten återvänder till sina vassrika biotoper.


    Arten förekommer också som genomflyttare och tillfällig gäst på andra platser
    i Skandinavien under höst- och vårmigrationerna. Den fortsatta etableringen av
    skäggmesen i Nordeuropa har varit en positiv utveckling för arten regionalt, trots
    att den globalt betraktas som mindre känslig för beståndsnedgångar.'
  en: '# Bearded Reedling in Scandinavia/Northern Europe


    The Bearded Reedling is a rare and irregular visitor to Scandinavia and Northern
    Europe, with occurrence highly dependent on winter severity and reed bed availability.
    In milder winters, small numbers may overwinter in southern Scandinavian reed
    beds, particularly in Denmark and southern Sweden. However, the species is primarily
    associated with temperate Eurasian reed beds and is not a regular resident. Autumn
    immigration occasionally occurs as birds disperse from continental breeding areas,
    especially during population increases. Spring sightings are uncommon in the region,
    with any breeding attempts being sporadic and localized.'
