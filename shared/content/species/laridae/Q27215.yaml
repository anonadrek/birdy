description:
  sv: ''
  en: '# Black Tern


    The Black Tern is a small tern belonging to the gull family, characterized by
    its compact size and dark plumage. During breeding season, it displays distinctive
    black underparts and a grey back, creating a striking appearance quite different
    from other tern species. In non-breeding plumage, it becomes considerably paler,
    with white underparts and a grey back.


    This species is highly aerial and acrobatic in its hunting behaviour, swooping
    and diving over water to catch small fish and aquatic insects. It breeds in freshwater
    inland habitats such as marshes, lakes, and river deltas across Europe, Western
    Asia, and North America. The Black Tern is a long-distance migrant, departing
    breeding grounds in autumn to winter along the coastal regions of Africa and South
    America.


    Observers encountering Black Terns should look for their characteristic rapid,
    jerky flight style and their tendency to feed in small flocks, often working over
    shallow water. The species is most readily identified during the breeding season
    when its dark plumage is most prominent.'
migration:
  sv: ''
  en: '# Black Tern (Chlidonias niger) – Occurrence in Scandinavia/Northern Europe


    The Black Tern is a summer visitor to Scandinavia and Northern Europe, arriving
    in late spring (May-June) to breed in freshwater marshes, lakes, and wetlands.
    It is a migratory species that departs in late summer and early autumn (August-September)
    to winter in coastal regions of West Africa. The species does not overwinter in
    Northern Europe, making it entirely absent during winter months. Breeding populations
    are most common in southern Scandinavia, with numbers declining northward.'
