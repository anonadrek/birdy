description:
  sv: ''
  en: '# Greater Crested Tern


    The greater crested tern is a large tern with distinctive plumage that aids identification.
    Its upperparts are a striking dark battleship-grey, contrasting with white underparts.
    A notable feature is its white forehead, which remains visible even during breeding
    season, setting it apart from closely related species. The bill is greenish-tinged
    yellow, another useful identifying characteristic. In flight, this tern appears
    powerful and streamlined, befitting its swift movements.


    This species inhabits tropical and subtropical coastlines, nesting in dense colonies
    on islands and coastal areas. It is highly migratory, with populations breeding
    across the Indian Ocean and Pacific regions dispersing widely after the nesting
    season. It hunts fish by diving into coastal and offshore waters, typically operating
    in flocks that follow prey movements seasonally.


    The greater crested tern''s breeding colonies are notably noisy and active, where
    it shares space with other seabirds. Its presence indicates productive marine
    environments. Outside the breeding season, it becomes more solitary or occurs
    in small groups, wandering extensive distances from breeding grounds in search
    of abundant food resources.'
migration:
  sv: ''
  en: '# Greater Crested Tern in Northern Europe


    The Greater Crested Tern is a tropical and subtropical species with no established
    presence in Scandinavia or Northern Europe. This large tern breeds in colonies
    across the Indian Ocean, Pacific, and around South Africa, with populations dispersing
    widely after nesting. However, the species'' range does not extend to Northern
    European waters, and it is not documented as a regular migrant or occasional vagrant
    to Scandinavian regions. The bird remains confined to warmer Old World waters
    throughout the year.


    **Migration data unavailable for this species** (in the context of Northern Europe/Scandinavia).'
