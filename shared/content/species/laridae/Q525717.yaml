description:
  sv: ''
  en: '# Brown Noddy


    The brown noddy is the largest member of the noddy family within the gull and
    tern group (Laridae). It is readily distinguished from its closest relative, the
    black noddy, by its noticeably larger size and distinctly dark brown plumage rather
    than black. This tropical seabird enjoys a worldwide distribution across warm
    ocean regions, occurring from the Pacific islands to the Indian Ocean and into
    Atlantic waters.


    Brown noddies are highly colonial birds with a preference for elevated nesting
    sites on coastal cliffs or in low trees and shrubs, though they occasionally nest
    on the ground. Each breeding pair typically produces a single egg per season.
    The species is adapted to marine life and is commonly seen in tropical coastal
    and oceanic habitats where it feeds on small fish and squid.


    As a widespread tropical species, the brown noddy remains relatively common throughout
    its range, though conservation efforts in certain regions help protect important
    populations and their breeding colonies.'
