description:
  sv: '# Rosenmås


    Rosenmås är en liten mås som är närmast släkt med dvärgmåsen. Den häckar i Arktis
    och är mycket sällsynt i nordvästra Europa, där den endast påträffas sporadiskt.
    I Sverige finns det dokumenterade omkring 25 fynd av arten.


    Arten är klassificerad som livskraftig enligt IUCN:s bedömning, vilket innebär
    att populationen för närvarande inte är hotad. Rosenmåsen återfinns främst i de
    arktiska häckningsområdena men kan ibland ses långt från sitt hemområde under
    migration eller vintern.'
  en: ''
migration:
  sv: 'Rosenmås är en arktisk häckare som endast undantagsvis förekommer i Skandinavien
    och Nordvästra Europa. Arten häckar långt norrut i Arktis och är mycket sällsynt
    längre söderut. I Sverige har arten dokumenterats genom totalt 25 fynd, vilket
    gör den till en extremt ovanlig gäst. Då källmaterialet inte innehåller specifik
    information om migrationsmönster, ankomstmånader eller övervintringsvanor för
    arten i norra Europa, kan dessa detaljer inte beskrivas utifrån tillgänglig källa.


    Migrationsdata för rosenmås i Skandinavien och Nordvästra Europa saknas i det
    tillhandahållna källmaterialet.'
