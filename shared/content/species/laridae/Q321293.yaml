  en: '# Roseate Tern Migration in Northern Europe


    The Roseate Tern is a rare summer visitor to Scandinavian and Northern European
    waters. This migratory species arrives in spring during the breeding season, typically
    from May onwards, and departs in autumn. The species winters in African waters,
    particularly off West Africa, making it a long-distance trans-equatorial migrant.
    In Northern Europe, breeding populations are extremely limited and fragmented,
    with only small numbers occasionally recorded in coastal areas during the summer
    months. The species has declined significantly throughout its range, and sightings
    in Scandinavia are now uncommon and irregular compared to historical records.'
