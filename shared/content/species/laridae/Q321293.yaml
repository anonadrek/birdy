description:
  sv: '# Rosentärna


    Rosentärna är en liten tärnart som är vida spridd men förekommer endast lokalt.
    Till utseendet är den mycket lik fisktärnan och silvertärnan, vilket kan göra
    artbestämningen utmanande. Det karakteristiska draget är den rosafärgade nyansen
    på undersidan hos vuxna fåglar i häckningsdräkt, vilket också gett arten sitt
    namn.


    Rosentärnan tillhör familjen måsfåglar och är en vadare som är beroende av vatten
    för sin näring. Arten är livskraftig enligt IUCN:s bedömning, vilket indikerar
    att populationen för närvarande inte är hotad eller i någon större risk.'
  en: '# Roseate Tern


    The roseate tern is a slender, elegant tern distinguished by its pale grey upperparts
    and white underparts. During breeding season, it displays a delicate rosy flush
    on the breast that gives the species its name. It is notably streamlined compared
    to other terns, with long, pointed wings and a deeply forked tail that extends
    well beyond the wingtips in flight.


    This species is a skilled aerial hunter, plunging into water to catch small fish
    with precision. It is highly social, typically nesting in colonies on coastal
    islands and rocky outcrops. The roseate tern is a migratory species, moving between
    breeding and wintering grounds seasonally. It vocalizes with sharp, distinctive
    calls that are higher-pitched than those of related terns.


    The roseate tern inhabits coastal waters and islands in temperate and tropical
    regions worldwide. It prefers shallow marine areas and estuaries where small fish
    are abundant. This species has experienced population declines in some regions
    due to habitat loss and human disturbance at breeding sites, making conservation
    efforts important for its long-term survival.'
