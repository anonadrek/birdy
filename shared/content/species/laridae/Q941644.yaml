description:
  sv: '# Mindre noddy


    Mindre noddy är en brunsvart tärnliknande fågel som tillhör måsfågelfamiljen.
    Det är en relativt liten art med karakteristisk mörk färgteckning som gör det
    lätt att urskilja från närbesläktade arter. Fågeln är anpassad för livet på havet
    och förekommer på tropiska öar i Indiska oceanen, där det häckar.


    Som tärnfågel är mindre noddy en skicklig flygare som ofta ses jaga små fisk nära
    vattenytan. Det är en social fågel som ofta observeras i små flockar. Arten förlitar
    sig på närmare bestånd av små fiskar för sin föda och är därför knuten till områden
    med rik tillgång på bytesdjur.


    Beståndet av mindre noddy anses vara livskraftigt och arten utgör ingen naturvårdsbekymring
    för närvarande. Det är främst känt från tropiska havsöar där det bygger bon och
    reproducerar sig under året.'
  en: '# Lesser Noddy


    The lesser noddy, also called the sooty noddy, is a small seabird belonging to
    the gull family. It is characterized by dark plumage, though specific details
    about its appearance remain limited in standard references. Like other noddies,
    it is a tern-like bird adapted to coastal marine environments.


    This species inhabits coastal waters and islands across the Indian Ocean region,
    being found in areas near Comoros, Kenya, India, the Maldives, Mauritius, the
    Seychelles, Somalia, Sri Lanka, and the United Arab Emirates. It typically nests
    in colonies on small islands and coastal outcrops within its range.


    The lesser noddy feeds on small fish and crustaceans caught in shallow coastal
    waters, diving from the air to capture prey. Like related noddy species, it is
    generally quiet compared to other seabirds, though it produces calls during breeding
    season. Its name derives from its characteristic head-nodding displays, particularly
    during courtship and territorial interactions.'
