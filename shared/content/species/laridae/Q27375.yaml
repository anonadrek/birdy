description:
  sv: ''
  en: '# Glaucous Gull


    The glaucous gull is a massive gull species, ranking as the second-largest in
    the world. Its name derives from Latin, with "hyperboreus" meaning "northern,"
    reflecting its Arctic origins. The term "glaucous" refers to its distinctive grey
    plumage coloration.


    This large gull displays pale grey-white wings and back, with a powerful, heavy
    bill suited to its predatory and scavenging lifestyle. It is a robust bird built
    for harsh polar environments, with thick plumage for insulation against extreme
    cold. Adults show the typical gull pattern of dark eyes and yellow-orange eye-rings,
    though immatures appear paler and less distinctly marked.


    The glaucous gull inhabits Arctic and sub-Arctic regions, favoring coastal areas,
    ice floes, and tundra landscapes. It is highly adaptable, feeding opportunistically
    on fish, marine mammals, eggs, and carrion. This species is a powerful flier capable
    of covering vast distances across polar regions. It is often seen in loose flocks,
    particularly during winter migrations when some populations move to temperate
    coasts. The glaucous gull is generally silent outside the breeding season, though
    it produces typical gull calls—loud, harsh cries—when breeding or defending food
    sources.'
migration:
  sv: ''
  en: '# Glaucous Gull in Scandinavia/Northern Europe


    The Glaucous Gull is primarily an Arctic and subarctic breeder. In Scandinavia,
    it occurs mainly as a winter visitor and passage migrant, particularly along coastal
    areas. Northern populations breed in the high Arctic and move southward during
    autumn, with numbers increasing along Scandinavian coasts from October through
    March. Some birds remain year-round in northern regions, while others migrate
    further south to more temperate European coasts when ice conditions intensify.
    The species is irregular in occurrence, with numbers fluctuating based on food
    availability and winter severity.'
