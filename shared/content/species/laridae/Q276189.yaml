description:
  sv: '# Svarthuvad mås


    Svarthuvad mås är en medelstor mås som tillhör familjen måsfåglar. Arten kännetecknas
    av sitt karakteristiska utseende med svart huvud under häckningstiden, vilket
    ger den sitt namn. Under övriga delar av året är huvudet vitt eller delvis vit.


    Arten häckar nästan uteslutande i Europa och förekommer vid kustnära områden och
    inlandsvatten. Även om antalet svarthuvade måsar totalt sett har minskat, expanderar
    arten gradvis mot norr, och häckningar har noterats i Sverige under senare år.
    Detta utgör en intressant geografisk utökning av artens utbredning.


    Enligt IUCN klassificeras svarthuvad mås som livskraftig, vilket innebär att arten
    inte utgör ett större naturvårdsbekymmer för närvarande. Som typisk mås är det
    en anpassningsbar fågel som utnyttjar både marina och terrestriska habitat för
    föda och häckning.'
  en: '# Mediterranean Gull


    The Mediterranean gull is a small gull with distinctive plumage. In breeding plumage,
    it features a black hood covering the head and upper neck, contrasting sharply
    with white underparts and pale grey wings. Non-breeding birds show a white head
    with dark ear patches. It has a relatively slender bill and red-orange legs, giving
    it an elegant appearance compared to larger gull species.


    This gull is primarily a fish-eater, as suggested by its scientific name derived
    from the Ancient Greek words for "fish" and "eagle." It inhabits coastal regions,
    favouring harbours, lagoons, and sandy shores where it feeds on small fish and
    marine invertebrates. The species is often seen in small flocks, particularly
    around fishing ports and coastal developments.


    The Mediterranean gull''s call is characteristically higher-pitched and more melodious
    than that of larger gulls, with a distinctive mewing quality. It breeds colonially,
    nesting on islands, flat rooftops, and occasionally ground sites in coastal areas.'
migration:
  sv: '# Svarthuvad mås – förekomst i Skandinavien


    Svarthuvad mås är en nordvandring art som under senare decennier har expanderat
    sitt utbredningsområde norrut. Arten häckar numera regelbundet i Sverige, vilket
    är ett relativt nytt fenomen. Under häckningstiden förekommer arten framför allt
    vid kustnära områden och större insjöar i södra och mellersta Sverige. Efter häckningstiden
    flyttar många individer söderut till mediterranea och atlantiska områden för övervintering,
    medan vissa mindre populationer kan stanna i västra Europa under mildare vintrar.
    Arten återkommer till häckningsområdena under våren, vanligtvis från april–maj.'
  en: '# Mediterranean Gull Migration in Northern Europe


    The Mediterranean Gull has expanded its range northward significantly since the
    late 20th century and now occurs regularly in Scandinavia and Northern Europe,
    particularly during breeding season and autumn migration. Birds arrive in spring
    (April-May) to breed in scattered colonies, with populations increasing in southern
    Scandinavia and along northern European coasts. Most individuals are migratory,
    departing in autumn (August-October) to winter in southern regions, though some
    remain in mild winters along ice-free coastal areas. Winter presence is irregular
    and depends on weather conditions, with sightings becoming increasingly frequent
    as the species continues its northward range expansion.'
