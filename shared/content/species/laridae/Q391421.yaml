description:
  sv: ''
  en: '# Slender-billed Gull


    The slender-billed gull is a mid-sized gull with a notably elongated bill that
    distinguishes it from related species. It is primarily found breeding in scattered
    colonies around the Mediterranean Sea and the northern Indian Ocean, where it
    inhabits islands and coastal lagoons. Most of the population exhibits migratory
    behaviour, moving southward during winter months to reach regions across North
    Africa and India in search of food and suitable conditions.


    Outside its core range, the slender-billed gull is rarely encountered, though
    occasional vagrants have been recorded in western Europe and other distant locations.
    Its preference for specific breeding habitats makes it a relatively localized
    species compared to more widespread gull populations. The bird''s ecological role
    is closely tied to coastal and marine environments, where it forages and breeds
    in typically small, scattered groups on protected islands and lagoon systems.'
migration:
  sv: ''
  en: '# Slender-billed Gull in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Slender-billed Gull is not a regular species in Scandinavia or Northern Europe.
    This Mediterranean and Indian Ocean breeder is primarily distributed around the
    Mediterranean basin and wintering grounds extending to North Africa and India.
    While the source text mentions that "a few birds have wandered to western Europe,"
    it provides no specific information about occurrences, timing, or patterns in
    Scandinavia or Northern Europe. The species should be considered a vagrant to
    the region at best, with no documented regular migration or overwintering in these
    northern latitudes.'
