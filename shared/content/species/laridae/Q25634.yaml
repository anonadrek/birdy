description:
  sv: ''
  en: '# Black-headed Gull


    The black-headed gull is a small, highly adaptable gull species found across much
    of the Palearctic region, breeding from Europe through Asia and in smaller populations
    along coastal eastern Canada. It is predominantly migratory, with most birds moving
    southward for winter, though significant numbers remain year-round in the milder
    climate zones of northwestern Europe. Its breeding range and wintering distributions
    have made it one of the more widespread gull species across its geographic range.


    This species is characterized by its relatively small size compared to other gulls.
    During breeding season, adults display a distinctive dark brown head, which contrasts
    sharply with their white body and pale grey wings. In non-breeding plumage, the
    head becomes white with dark ear patches. The bill is red, as are the legs, adding
    to its striking appearance.


    The black-headed gull is highly gregarious and vocal, often gathering in noisy
    flocks both at breeding colonies and at feeding sites. It readily adapts to urban
    environments and inland habitats, not limiting itself to coastal areas. Its diet
    varies opportunistically, ranging from small fish and invertebrates to human food
    waste, making it a familiar sight in harbours, parks, and city centres throughout
    its range.'
migration:
  sv: ''
  en: '# Black-headed Gull (Chroicocephalus ridibundus) in Scandinavia/Northern Europe


    The Black-headed Gull is a migratory species throughout much of Scandinavia and
    northern Europe, with populations showing varying strategies. Most birds migrate
    southward to winter in milder regions, departing breeding grounds in autumn. However,
    a significant portion of the population remains year-round in the milder coastal
    areas of northwestern Europe, including parts of Scandinavia. This species breeds
    widely across the Palearctic region and is common in northern European breeding
    habitats during spring and summer months.'
