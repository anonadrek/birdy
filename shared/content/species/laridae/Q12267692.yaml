description:
  sv: '# Småtärna


    Småtärna är familjen måsfåglarnas minsta art. Den utmärks av sin lilla storlek
    och karakteristiska häckningsdräkt med svart hjässa och vit panna. Näbben är gul
    med svart spets, vilket gör arten lätt att identifiera. Under vintermånaderna
    blir huvudet övervägande vitt.


    Arten har en mycket vid utbredning och förekommer vid kusttrakter runt Afrika,
    Europa, Asien och Australien samt på öar i Stilla havet. Det finns nära besläktade
    arter som den amerikanska småtärnan och persiska småtärnan, vilka tidigare klassificerades
    som underarter av småtärnan.


    Som en liten tärnart är småtärnan väl anpassad för sitt livssätt vid kusterna,
    där den jagar små fiskar genom att dyka från luften. Arten är känd för sin omständiga
    häckning på öppna strander och ölänken.'
  en: '# Little Tern


    The little tern is a small seabird belonging to the tern family (Laridae), characterized
    by its diminutive size relative to other tern species. Its scientific name reflects
    its appearance: Sternula is a diminutive form of Sterna, while albifrons refers
    to its white forehead. The species was formally described in 1764 and later reclassified
    into the genus Sternula when larger terns were grouped separately under Sterna.


    As one of the smallest terns, it displays the typical tern profile with a streamlined
    body adapted for its piscivorous lifestyle. Like other terns, it likely exhibits
    characteristic hovering and diving behavior to capture small fish from the water''s
    surface. The little tern''s compact size and specialized hunting technique distinguish
    it from its larger relatives.


    The species occupies coastal and wetland habitats across its range, where it exploits
    shallow waters for feeding. Its small stature and specific ecological niche differentiate
    it within the diverse tern family, making it recognizable to observers familiar
    with seabird identification.'
migration:
  sv: '# Småtärna - Utbredning i Skandinavien och Norra Europa


    Småtärna är en flyttfågel som förekommer vid kusterna i Skandinavien och Norra
    Europa under häckningssäsongen. Arten anländer under försommaren för att häcka
    vid lämpliga lokaliteter vid havet och större inlandsvatten. Under hösten påbörjar
    småtärnan sin långväga migration söderut för att övervintra i värmere regioner,
    främst i Afrika. Arten är således endast närvarande under de värmare månaderna
    och är helt frånvarande under vintermånaderna.'
