description:
  sv: '# Guineatärna


    Guineatärna är en havsfågel i familjen måsfåglar som förekommer längs Västafrikas
    kuster. Den behandlades tidigare som underart till kungstärnan, men genetiska
    studier har visat att den faktiskt är närmare besläktad med iltärnan.


    Som övrig tärna är det en elegant fiskeätare som är anpassad för att jaga på havet.
    Det söker föda genom att dyka efter små fiskar i kustnära vatten. Till utseendet
    är det en större tärna med karakteristiska drag från måsfågelfamiljen.


    Guineatärnan är framför allt en kustbunden art som återfinns i västafrikanska
    havsregioner där det kan observeras både när det fiskar och när det vilar på eller
    i närheten av vattnet.'
  en: '# West African Crested Tern


    The West African crested tern is a member of the gull and tern family, distinguished
    only recently as a separate species from the New World royal tern in 2020. It
    is a seabird adapted for coastal marine environments, sharing characteristics
    typical of larger tern species.


    As a crested tern, it displays the characteristic features of its genus, with
    a streamlined body built for diving and fishing. The species inhabits coastal
    waters where it hunts small fish by plunging from the air into the sea. Like other
    terns, it is a graceful flier with pointed wings and a forked tail, allowing for
    the precise aerial maneuvers needed to locate and capture prey.


    This species is found along the West African coast, where it occupies marine and
    coastal habitats. Its separation as a distinct species reflects regional variation
    adapted to Atlantic waters off this region. Further details about its appearance,
    vocalizations, and specific behavioral patterns would require additional ornithological
    sources, as the available information focuses primarily on its recent taxonomic
    reclassification.'
