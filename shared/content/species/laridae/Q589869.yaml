description:
  sv: ''
  en: '# Sooty Gull


    The sooty gull is a species within the gull family, characterized by its dark
    plumage that distinguishes it from many lighter-colored gull species. It inhabits
    coastal and marine regions across a broad geographic range spanning the Red Sea,
    Arabian Gulf, Indian Ocean, and eastern African coasts. The species frequents
    shallow waters, harbors, and coastal areas where it hunts for fish and other marine
    prey.


    In behavior, the sooty gull is typically gregarious, often seen in flocks, particularly
    at feeding sites and roosting areas. Like other gulls, it is an opportunistic
    feeder with adaptable foraging habits. The species is known for its vocal nature,
    producing various calls that are characteristic of gulls, though specific call
    descriptions are limited in available sources.


    The sooty gull maintains populations across its extensive range from the Middle
    East through to East Africa and the Indian subcontinent, showing preference for
    warmer coastal waters. It was historically classified within the genus *Larus*
    alongside other gulls before taxonomic revision placed it in *Ichthyaetus*. The
    species is named after the German naturalist Wilhelm Hemprich, who contributed
    significantly to natural history studies during his scientific expeditions in
    the region during the early 19th century.'
migration:
  sv: ''
  en: 'Migration data unavailable for this species.


    The Sooty Gull''s distribution is restricted to the Middle East, North Africa,
    and Indian Ocean regions. There is no documented occurrence of this species in
    Scandinavia or Northern Europe, either as a resident, migrant, or vagrant. The
    species is entirely absent from the Nordic region and has no relevance to Scandinavian
    bird guides.'
