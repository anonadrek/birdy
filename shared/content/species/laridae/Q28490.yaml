description:
  sv: '# Tygeltärna


    Tygeltärna är en liten tärna som förekommer i tropiska och subtropiska hav världen
    över. Det är en övervägande marin art som endast tillfälligt påträffas långt från
    sitt normala utbredningsområde. I Europa är arten sällsynt, och endast två fynd
    har registrerats i Sverige, vilket gör den till en mycket osannolik gäst i nordliga
    vatten.


    Arten är klassificerad som livskraftig av IUCN, vilket indikerar att populationen
    är stabil och inte hotad. Som de flesta tärtor är det en skicklig fiskare som
    jagar små fiskar från luften. Tygeltärnan tillhör familjen måsfåglar, som omfattar
    måsar, tärnor och skäror.


    För den som är intresserad av fågelskådning är arten framför allt relevant som
    en sällsynt vagrant i norra regioner, snarare än en art att förvänta sig under
    normala omständigheter.'
  en: '# Bridled Tern


    The bridled tern is a small seabird belonging to the gull family, found across
    tropical ocean regions worldwide. Its name derives from the distinctive white
    line running across its face, resembling a bridle, which contrasts sharply with
    its darker plumage. Like other terns, it is a graceful flier with pointed wings
    adapted for hunting over open water.


    This species is primarily pelagic, spending much of its time at sea hunting small
    fish and marine invertebrates by plunge-diving into the water. It typically nests
    in colonies on remote islands and coastal areas, preferring rocky outcrops or
    sandy beaches away from human disturbance. The bridled tern is generally quieter
    than many tern species, though it produces harsh calls when defending nesting
    territory or alarmed.


    The bird''s slender build and streamlined profile make it perfectly adapted to
    life over tropical and subtropical oceans, where it is most commonly encountered.
    During breeding season, it returns to traditional nesting sites, often sharing
    islands with other seabird species.'
migration:
  sv: Tygeltärna är en tropisk och subtropisk art som normalt förekommer i varma havsområden
    långt söder om Skandinavien. Arten är mycket sällan påträffad i Nordeuropa och
    Sverige, där den endast dokumenterats genom ett par tillfälliga fynd. Det finns
    ingen regelbunden migration till eller genom Skandinavien, och arten kan endast
    betraktas som en ytterst sällsynt vagrant i regionen. Observationer i norra Europa
    är slumpmässiga och opålitliga, utan något mönster vad gäller säsong eller frekvens.
  en: 'Migration data unavailable for this species.


    The provided source text contains no information about the occurrence, migration
