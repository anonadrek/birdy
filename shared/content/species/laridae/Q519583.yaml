description:
  sv: "# Rödnäbbad trut\n\nRödnäbbad trut är en sällsynt trut som förekommer endemiskt\
    \ kring Medelhavet. Arten är medelstor och kännetecknas av sitt markanta röda\
    \ näbb, som är dess mest iögonenfallande karaktäristikum. Det har en slank kroppsform\
    \ typisk för måsfåglar i familjen Laridae.\n\nArten har genomgått en turbulent\
    \ bevarandestatus – efter en kraftig nedgång under senare delen av 1900-talet\
    \ har den delvis återhämtat sig, men minskar åter i antal. IUCN klassificerar\
    \ rödnäbbad trut som sårbar (VU), vilket återspeglar artens osäkra framtidsutsikter.\
    \ \n\nTaxonomiskt skildes arten tidigare inte från andra truter i släktet Larus,\
    \ men placeras numera tillsammans med bland annat svarthuvad trut och svarthuvad\
    \ mås i släktet Ichthyaetus. Denna omklassificering återspeglar nya fylogenetiska\
    \ insikter om måsfåglarnas släktskapsförhållanden."
  en: ''
migration:
  sv: 'Migrationsdata saknas för denna art.


    Rödnäbbad trut är endemisk för Medelhavsregionen och förekommer inte naturligt
    i Skandinavien eller Nordeuropa under någon årstid. Arten häckar uteslutande kring
    Medelhavet och saknar därför relevant migrationsmönster för nordeuropeiska förhållanden.'
  en: ''
