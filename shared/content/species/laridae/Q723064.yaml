description:
  sv: '# Ismås


    Ismåsen är en högarktisk måsfågel som är helt vit i fjäderdräkten, vilket gör
    den mycket distinkt. Den är en liten till medelstor måsfågel med ett kompakt utseende
    och mörka ögon som kontrasterar mot den snövita plumagen.


    Arten är starkt knuten till höga breddgrader och förekommer normalt långt norrut.
    Den dyker dock upp oregelbundet söder om sitt huvudsakliga utbredningsområde,
    vilket är en intressant aspekt av artens spridningsmönster. I sydligare regioner
    är sådana observationer mycket ovanliga och anses noterbara för fågelskådare.


    Ismåsen står inför omfattande populationsminskningar i delar av sitt utbredningsområde,
    varför arten klassificeras som nära hotad enligt internationella bedömningar.
    Denna utveckling gör arten särskilt intressant att följa för den som är engagerad
    i fågelskydd och artövervakning.'
  en: '# Ivory Gull


    The ivory gull is a small, distinctive gull and the only member of its genus.
    It inhabits the high Arctic regions with a circumpolar distribution, breeding
    across Greenland, the northernmost parts of North America, and Eurasia. True to
    its name, the species is predominantly white in plumage, making it well-adapted
    to its icy habitat where it remains as a resident breeder rather than migrating
    seasonally.


    This arctic specialist occupies some of Earth''s most inhospitable environments,
    where few other gulls venture. Its small size and pure white coloration distinguish
    it from larger gull species found in more temperate regions. The ivory gull''s
    presence in these extreme polar regions reflects its specialized adaptations to
    life among pack ice and frozen landscapes, where it feeds and nests during the
    breeding season.'
migration:
  sv: '# Ismås - Förekomst i Skandinavien


    Ismåsen är en högarktisk art som normalt förekommer långt norr om Skandinavien.
    I regionen uppträder arten endast tillfälligt och sporadiskt, framför allt under
    höst och vinter när ismåsar ibland förflyttar sig söderut från sitt huvudsakliga
    utbredningsområde. I Sverige har ismåsen noterats vid omkring 25 tillfällen, huvudsakligen
    längs Västkusten. Dessa observationer är oregelbundna och kan inte betraktas som
    en regelbunden migrationsmönster, utan snarare som tillfälliga utbrytningar från
    sin normalutbredning i den höga norden.'
  en: '# Ivory Gull in Scandinavia/Northern Europe


    The Ivory Gull is a high Arctic specialist with a circumpolar distribution. In
    Scandinavia and Northern Europe, it occurs primarily as a rare winter visitor
    and vagrant. During breeding season, populations are found in the most northern
    Arctic regions, including areas around Greenland and the northernmost parts of
    Eurasia. In winter, some individuals disperse southward, occasionally reaching
    Scandinavian coasts and northern European waters, though sightings remain uncommon.
    The species is not a regular migrant through the region but appears sporadically
    during harsh Arctic winters when food shortages may force birds to seek alternative
    feeding areas further south.'
