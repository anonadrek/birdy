description:
  sv: ''
  en: '# Whiskered Tern


    The whiskered tern is a small, elegant tern belonging to the gull family. In breeding
    plumage, it displays a distinctive dark grey back and wings with a blackish cap
    and face, contrasting sharply with its white cheeks and underparts—features that
    give the species its common name. In non-breeding season, it becomes much paler
    and greyer overall. It is notably more compact and short-winged than many tern
    species, with a relatively short, pointed bill.


    This tern favors freshwater and brackish wetland habitats, including lakes, marshes,
    and river deltas where it hunts small fish and aquatic insects. It typically feeds
    by dipping to the water surface rather than plunge-diving like some tern species,
    and often forages in loose flocks. Its call is a distinctive harsh, chattering
    sound.


    The whiskered tern is migratory across much of its range, breeding in temperate
    and subtropical regions during spring and summer before dispersing or migrating
    to warmer areas. It nests in colonies, constructing simple nests on floating vegetation
    or islands. The species occurs across southern Europe, Asia, and Africa, with
    populations varying seasonally in different regions.'
migration:
  sv: ''
  en: '# Whiskered Tern in Scandinavia/Northern Europe


    The Whiskered Tern is a rare vagrant to Northern Europe and Scandinavia, with
    only occasional records in the region. This species is primarily a summer breeder
    across southern and central Europe, Asia, and Africa, and does not form a regular
    migratory population through Scandinavian waters. When individuals do appear in
    Northern European waters during summer months, they represent dispersing birds
    or occasional overshoots from their core breeding range further south. The species
    is not known to overwinter in Scandinavia or Northern Europe.'
