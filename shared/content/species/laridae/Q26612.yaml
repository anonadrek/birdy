description:
  sv: '# Tretåig mås


    Tretåig mås är en medelstor mås som tillhör familjen måsfåglar och är mycket vanlig
    i Nordatlanten. Den är en typisk kolonihäckare som föredrar klippiga kusthabitat
    och öppna vatten. Arten är anpassad för livet till sjöss och ses ofta i större
    antal långt från land.


    Tretåig mås har vit undersida och ljusgrå rygg. Det karaktäristiska för arten
    är dess korta ben och de tunna, smala vingar som gör den mycket manöverbar i luften.
    Den har svart på huvudet under häckningstiden och en gul näbb med rött på spetsen.
    Ungfåglar är mörkare märkta och utvecklar adultkläder under sitt första eller
    andra år.


    Arten är mycket vokal vid kolonier och har en karakteristisk skarp, högljudd rop
    som låter som "kitti-wake" – från vilket det engelska namnet härstammar. Det är
    en skicklig flygare som jagat små fisk och bläckfiskar från ytan. I Sverige är
    arten begränsad till ett fåtal lokaler som häckfågel, men den är ett vanligt inslag
    bland måsfåglar vid kusterna under olika årstider.'
  en: '# Black-legged Kittiwake


    The black-legged kittiwake is a seabird belonging to the gull family. It takes
    its English name from its distinctive and shrill call—a loud ''kittee-wa-aaake,
    kitte-wa-aaake''—which is one of the most recognizable sounds in its habitat.
    The bird is named to distinguish it from the red-legged kittiwake, though in many
    regions it is simply called the kittiwake.


    The species was scientifically described by Carl Linnaeus in 1758 as *Larus tridactylus*.
    It remains a characteristic seabird of northern waters, where its vocal presence
    and distinctive calls make it relatively easy to identify for those familiar with
    coastal environments.'
migration:
  sv: '# Tretåig mås – Förekomst i Norden


    Tretåig mås är en nordatlantisk art med begränsad häckningsutbredning i Sverige.
    Som häckfågel förekommer arten huvudsakligen på ön Nidingen utanför norra Halland,
    där den första gången noterades häcka 1967. Historiskt häckade arten även vid
    Luossajärvi i Kiruna, men denna population försvann då LKAB torrlade delen av
    sjön. Idag observeras arten endast sporadiskt i området.


    Migrationsdata saknas för denna art enligt den tillgängliga källtexten.'
  en: '# Black-legged Kittiwake (Rissa tridactyla) in Northern Europe


    Migration data unavailable for this species.'
