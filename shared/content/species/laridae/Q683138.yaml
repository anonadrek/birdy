description:
  sv: '# Armenisk trut


    Armenisk trut är en stor trut som tidigare klassificerades som underart till gråtruten
    innan den erkändes som egen art. Det är en fåtalig art, men dess bestånd bedöms
    som livskraftigt och stabil.


    Arten förekommer huvudsakligen i bergstrakter och omkring saltvattensområden i
    Kaukasusregionen och Mellanöstern. Det är en karakteristisk stor mås som främst
    återfinns i denna begränsade del av världen. Trots att individantalet är lågt
    jämfört med andra måsarter, lyckas arten upprätthålla ett fungerande bestånd i
    sitt utbredningsområde.


    För den intresserade fågelskådaren representerar armenisk trut ett exempel på
    hur närbesläktade arter kan ha evolution isär och bli erkända som distinkta arter
    genom genetisk och morfologisk forskning.'
  en: '# Armenian Gull


    The Armenian gull is a large gull inhabiting the Caucasus region and the Middle
    East. It was long considered a subspecies of the European herring gull before
    being elevated to species status, though some taxonomic authorities continue to
    group it with the yellow-legged gull, reflecting ongoing debate about its classification.


    As a large gull, it likely shares characteristics typical of heavy-bodied gulls,
    with the robust build and strong bill associated with its family. The species
    inhabits specific regions within its range, typically favoring suitable aquatic
    and coastal habitats where gulls congregate.


    Despite its recognition as a distinct species, relatively little detailed information
    about its specific appearance, behaviour, and vocalizations is widely documented
    in standard references, which has contributed to taxonomic uncertainty surrounding
    this gull.'
