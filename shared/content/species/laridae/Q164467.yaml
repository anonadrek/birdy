description:
  sv: '# Dvärgmås


    Dvärgmås är världens minsta mås och är en elegantare och spädare fågel än sina
    större släktingar inom måsfamiljen. Den kännetecknas av sitt lilla format, smala
    vingar och lätt byggnad som gör den mycket vig i luften.


    Arten förekommer utspritt över Europa och norra Asien, med mindre förekomster
    även i Nordamerika. Den är en mobil art som följer sitt utbud av små fiskar och
    kräftdjur, och kan ses både vid kuster och inlandsvatten. Arten tycks öka i antal,
    vilket gör att beståndet bedöms som livskraftigt och inte hotat.'
  en: '# Little Gull


    The little gull is the world''s smallest gull species, belonging to the family
    Laridae. It is the only member of its genus, Hydrocoloeus. This diminutive gull
    is primarily found across the Palearctic region, with occasional small colonies
    established in North America.


    During breeding season, the little gull inhabits freshwater lakes and marshes,
    where it nests in colonies. It is migratory, spending winters at sea where it
    takes advantage of coastal and offshore feeding opportunities. The species'' small
    size distinguishes it from all other gulls, making identification relatively straightforward
    in the field.


    The little gull''s breeding and wintering ecology reflects adaptation to different
    habitats throughout the year. Its preference for freshwater breeding grounds contrasts
    with its pelagic winter lifestyle, allowing it to exploit seasonal resources across
    diverse environments.'
migration:
  sv: '# Dvärgmås - Förekomst i Nordeuropa


    Dvärgmås är en flyttfågel som förekommer i Skandinavien främst under migration
    och sommaren. Arten häckar spritt i norra Europa och ankommer till Nordeuropa
    från april-maj efter sin övervintering i sydligare områden. Under hösten, från
    augusti till oktober, drar fågeln igen söderut för att övervintring i Medelhavsregionen
    och Nordafrika. En mindre del av populationen kan ses under vintermånaderna längs
    mindre hårt frusnä Östersjöns kuster. Arten föredrar kustnära och inlandsvattenområden
    under både passage och häckningsperioden.'
  en: '# Little Gull (Hydrocoloeus minutus) in Northern Europe


    The Little Gull is a migratory species in Scandinavia and Northern Europe, with
    breeding populations concentrated around freshwater lakes and marshes during the
    summer months. Birds typically arrive in breeding areas from April onwards and
    depart again by late September or October. During winter, the species vacates
    inland waters and moves to coastal marine environments, where flocks can be observed
    on northern seas. Some individuals may remain in ice-free coastal areas throughout
    milder winters, but the majority migrate southward to wintering grounds in Atlantic
    and Mediterranean regions. The species shows strong site fidelity, with established
    breeding colonies in Scandinavia attracting returning birds annually.'
