description:
  sv: '# Svarthuvad trut


    Svarthuvad trut är en stor trut inom familjen måsfåglar. Den är märklig för sin
    karakteristiska svarta huvud under häckningstiden, vilket skiljer den från många
    andra trutar. Kroppen är kraftig och väl proportionerad, anpassad för sin livsstil
    vid vattenförekomster.


    Arten häckar i större kolonier vid sötvattensbiotoper, där den är beroende av
    lämpliga växtplatser och miljöer för sitt fortplantningsarbete. Under övervintringen
    söker den sig till kustnära områden där den lever tillsammans med andra trut-
    och måsfågelarter.


    Denna trut är en långflyttare som återkommande migrerar mellan sina häckningsområden
    och övervintringsplatser. Det gör den till en påtaglig art för den som observerar
    fågelvärlden under olika årstider, särskilt då den rör sig längs större vattendrag
    och kustlinjer under sina säsongsbundna resor.'
  en: ''
migration:
  sv: '# Svarthuvad trut


    Svarthuvad trut är en stor asiatisk trut som primärt förekommer långt söder om
    Skandinavien. Arten häckar vid sötvattensbiotoper i Asien och migrerar sesongsvis
    till övervintringskvarteren vid kusterna av östra Medelhavsområdet, Arabiska halvön
    och Indien. Då arten är stationär inom sitt asiatiska och medelhavska utbredningsområde
    och saknar etablerad närvaro i Nordeuropa, förekommer den inte regelbundet i Skandinavien
    under året.'
  en: ''
