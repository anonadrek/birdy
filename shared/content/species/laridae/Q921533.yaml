description:
  sv: ''
  en: '# White-cheeked Tern


    The white-cheeked tern is a small tern belonging to the Laridae family. Its distinctive
    white cheeks contrast sharply with its darker plumage, making it identifiable
    among other tern species. Like other terns, it is a slender, graceful seabird
    adapted for hunting small fish over coastal waters.


    This species inhabits warm coastal regions around the Red Sea, extending eastward
    along the Horn of Africa to Kenya, and across the Persian Gulf to the Iranian
    coast, Pakistan, and western India. It favors shallow marine environments where
    it hunts by plunging into the water to catch small fish. The white-cheeked tern
    typically feeds in small groups or loose flocks, displaying the characteristic
    tern behaviour of hovering above the water before diving.


    As a tropical and subtropical species, it remains in or near its coastal range
    year-round, rarely venturing far inland. Birdwatchers seeking this species should
    focus on coastal areas and shallow bays within its geographic range, particularly
    in warm months when activity levels are highest.'
