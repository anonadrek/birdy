description:
  sv: '# Vitvingad tärna


    Vitvingad tärna är en liten tärnart inom familjen måsfåglar och tillhör släktet
    träsktärnor. Fågeln häckar från östra Europa och sträcker sig österut till Centralasien,
    där den föredrar öppna vattenområden med kärrvegetation. Under vintern är den
    en långflytt som migrerar till Afrika, södra Asien samt Australien och Nya Zeeland.


    Under häckningstiden är vitvingad tärna lätt att identifiera med sitt mörka grå
    och svarta fjäderdräkt på huvudet och kroppen, medan vingarna är karakteristiskt
    vita och kontrastar starkt mot den övriga fjäderdräkten. Utanför häckningstiden
    är den blekare och mer diskret i färgteckningen. Arten är en smidig fiskare som
    dyker från luften för att fånga små fiskar.


    Arten är en sällsynt men återkommande gäst norr om sitt huvudsakliga utbredningsområde
    i Europa och har även påträffats i Nordamerika. IUCN klassificerar vitvingad tärna
    som livskraftig.'
  en: '# White-winged Tern


    The white-winged tern is a small tern belonging to the gull family. As its name
    suggests, it displays distinctive white wings that contrast with its darker plumage,
    making it identifiable even in flight. The species inhabits freshwater environments
    across Europe, Africa, Asia, and Australia, where it hunts for small fish and
    aquatic insects.


    This tern is highly aerial and graceful, often seen hovering over water before
    plunging to catch prey. It is generally gregarious, frequently appearing in small
    flocks, particularly during migration periods. The bird favors lakes, marshes,
    and river systems rather than coastal areas, distinguishing it from some related
    tern species. Its call is relatively quiet compared to other terns, though it
    becomes more vocal during breeding season.


    The white-winged tern is a long-distance migrant, with populations shifting seasonally
    across continents. It nests colonially on floating vegetation or islands within
    freshwater habitats. Outside the breeding season, it becomes more dispersed, and
    vagrants occasionally appear in unexpected locations, making it of interest to
    birdwatchers across its vast range.'
migration:
  sv: '# Vitvingad tärna i Skandinavien/Nordeuropa


    Vitvingad tärna är en sällsynt men återkommande gäst i Skandinavien och övriga
    Nordeuropa. Arten häckar främst i östra Europa och flyttar längre söderut under
    vintern. De exemplar som förekommer norr om sitt normala häckningsområde är genomflyttare
    eller enstaka besökare. Arten övervintrar i Afrika, södra Asien samt Australien
    och Nya Zeeland, varför den helt saknas från Nordeuropa under de kalla månaderna.
    Sightings i Skandinavien är sporadiska och förekommer huvudsakligen under våren
    och hösten då fåglar är på väg mellan häcknings- och övervintringsområdena.'
  en: '# White-winged Tern in Scandinavia/Northern Europe


    The white-winged tern is a rare vagrant to Scandinavia and Northern Europe. This
    species breeds in freshwater wetlands across southern Russia and Central Asia,
    well south of the regular range of Northern European breeding birds. During migration
    periods, particularly in late summer and autumn, small numbers occasionally appear
    in Scandinavian waters as overshooting individuals or during dispersal movements.
    Records are irregular and unpredictable, with sightings concentrated mainly in
    coastal areas and larger inland water bodies during August and September.


    This species does not establish regular wintering populations in Northern Europe,
    as it migrates to African wintering grounds. Most Scandinavian observations represent
    transient visitors rather than established populations, making the white-winged
    tern an uncommon but noteworthy sighting for regional birdwatchers.'
