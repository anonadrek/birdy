description:
  sv: '# Skräntärna


    Skräntärna är en stor tärna med en karaktäristisk utseende. Den har en grof, blodröd
    näbb som är väl utvecklad för att fånga fisk. Flygningen liknar måsarnas snarare
    än andra tärnors – den är kraftfull och mindre gärdig än hos mindre tärnar. Det
    är en global art som häckar på alla kontinenter utom Sydamerika, ofta vid större
    vattendrag och havsområden.


    Arten är väl känd för sina hesa och barska läten, som skiljer den från andra tärnor.
    Skräntärnan är en skicklig fiskare som dyker från luften för att fånga sitt byte.
    Under häckningstiden är den mycket försvarande av sitt territorium.


    I Europa är populationen störst vid Östersjön och Kaspiska havet, med mindre bestånd
    vid Svarta havet och enstaka par vid Ladoga. Arten förordrar större, öppna vattenområden
    och kan ofta ses hovra över vatten innan den dyker ned för att fånga fisk.'
  en: '# Caspian Tern


    The Caspian Tern is the world''s largest tern species, distinguished by its substantial
    size compared to other terns. It displays the characteristic tern features: a
    streamlined body built for diving, pointed wings, and a forked tail. The bird
    typically shows a dark cap on its head, white underparts, and pale grey upper
    wings. Its heavy, powerful bill is notably larger and more robust than those of
    smaller tern species, reflecting its position at the top of the tern size hierarchy.


    This species has a subcosmopolitan but scattered distribution across the globe,
    making it a remarkable traveller despite being monotypic within its genus with
    no recognized subspecies. The Caspian Tern is primarily a fish-eater, hunting
    by plunge-diving into water bodies with considerable force. It favours coastal
    and inland waters, including estuaries, large lakes, and reservoirs where suitable
    fish populations exist. Its presence is often announced by harsh, grating calls
    that differ markedly from the more delicate vocalizations of smaller terns.


    The species tends to be solitary or found in small groups rather than in the large
    colonies typical of many tern species. Its large size and powerful hunting capabilities
    make it an impressive sight for birdwatchers across its wide-ranging habitat.'
migration:
  sv: Skräntärnan är en långdistansmigrant som övervintrarar i Afrika och södra Asien.
    Arten anländer till sina häckningsplatser i Östersjöområdet under våren, typiskt
    från april till maj. Under häckningssäsongen från maj till augusti är skräntärnan
    bosatt i Skandinavien och övriga Östersjöregionen. Efter häckningen påbörjas höstmigrationen
    under augusti-september när fåglarna drar söderut mot sina övervintringsområden.
    Skräntärnan är således en kortvarig sommargäst i Norden och ses endast sporadiskt
    under övriga årstider.
  en: '# Caspian Tern Migration in Northern Europe


    The Caspian Tern is a migratory species that visits Scandinavia and Northern Europe
    primarily during the breeding season. Birds arrive in spring to establish breeding
    colonies at suitable coastal and inland wetland sites. The population present
    during summer months departs in autumn to overwinter in southern regions, including
    coastal areas of Africa and the Mediterranean. In Scandinavia, the species is
    essentially absent during winter months, with sightings during migration periods
    (spring and autumn) being relatively uncommon compared to resident tern species.'
