description:
  sv: '# Vitögd mås


    Vitögd mås är en mås som är endemisk för kustområdena kring Röda havet. Det är
    en närbesläktad art till sotmåsen, vilket båda arterna delar sitt utbredningsområde.
    Arten är anpassad till dessa specifika kustzoner och förekommer där under året.


    Vitögd måsen är en karakteristisk måsfågel som är väl anpassad till sitt marina
    miljö. Som många måsarter lever den av fisk och andra marina födan som det kan
    få från havet och kustlinjen. Arten ses regelbundet längs kusterna i sitt begränsat
    utbredningsområde, där det tillsammans med andra måsarter utgör en viktig del
    av det marina ekosystemet.'
  en: '# White-eyed Gull


    The white-eyed gull is a small gull species endemic to the Red Sea region. It
    belongs to the gull family and is most closely related to the sooty gull. The
    species takes its name from its distinctive pale eye, which contrasts with its
    darker plumage.


    This gull inhabits coastal waters and islands within its limited range. It shares
    characteristics typical of gulls, though its small size distinguishes it from
    many larger gull species. The white-eyed gull has historically been classified
    within the genus *Larus*, though taxonomic arrangements for gulls have evolved
    over time.


    The species currently maintains a stable population and is classified as Least
    Concern by the IUCN. However, it faces significant threats from human activity
    and environmental degradation. Oil pollution poses a particular risk to this endemic
    species, given its dependence on the marine environment and restricted geographic
    distribution.'
