description:
  sv: ''
  en: '# White-breasted Waterhen


    The white-breasted waterhen is a distinctive rail with dark slate-grey plumage
    contrasting sharply with its clean white face, breast, and underparts. It is a
    compact waterbird, readily identified by this striking colour pattern. It moves
    deliberately through wetlands with its tail held characteristically upright, and
    is notably bolder and more conspicuous than many of its rail relatives.


    This species is largely active during twilight hours, though it may emerge in
    open marshes and shallow water habitats throughout the day. It frequents reed
    beds, drainage ditches, and wetland margins, and adapts well to disturbed areas
    including drains near human settlements. During breeding season, which follows
    the first rains, it produces loud, repetitive croaking calls—often given from
    dense vegetation.


    The white-breasted waterhen is widely distributed across South and Southeast Asia,
    where it inhabits freshwater and brackish wetlands. It remains relatively common
    throughout its range where suitable habitat persists.'
