description:
  sv: ''
  en: '# Purple Swamphen


    The purple swamphen is a large, colourful rail with striking plumage dominated
    by deep purple and blue tones on its head, neck, and underparts, contrasting with
    a greenish back. It has a massive red bill and red frontal shield on the face,
    along with long red legs. The bird is unmistakable in appearance due to its vibrant
    colouration and substantial size among rail species.


    This species inhabits freshwater wetlands including reed beds, marshes, and swampy
    areas with dense vegetation. It is largely terrestrial compared to many other
    rails, often walking openly through reed beds and vegetation rather than skulking
    in cover. The purple swamphen feeds on plants, seeds, and occasionally invertebrates
    and small animals, foraging both on land and in shallow water.


    The species is vocal, producing loud, distinctive calls including harsh croaks
    and cackles that carry across wetland habitats. It has been split into several
    regional species across Africa, Asia, Australia, and the Pacific. The western
    swamphen occurs in southwest Europe and northwest Africa, while other populations
    are found across sub-Saharan Africa, the Indian subcontinent, Southeast Asia,
    and Australasia. It typically favours areas with permanent or semi-permanent water
    and extensive wetland vegetation.'
migration:
  sv: ''
  en: '# Purple Swamphen (Porphyrio porphyrio) in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Purple Swamphen does not occur in Scandinavia or Northern Europe as part of
    its natural range or migration patterns. The western subspecies (*Porphyrio porphyrio*)
    is restricted to southwestern Europe and northwestern Africa, making it geographically
    far removed from Scandinavian latitudes. This tropical and subtropical rail species
    is not adapted to northern climates and would not be expected as a regular visitor
    or vagrant to the region.'
