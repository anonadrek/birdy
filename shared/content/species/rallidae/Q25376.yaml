description:
  sv: '# Sothöna


    Sothöna är en vattenlevande fågel med karakteristisk utseende. Den har en rundad
    kroppsform täckt av skiffersvart fjäderdräkt. Näbben är vitaktig och saknar fjädrar
    på pannan, där det istället finns en framträdande pannsköld. När sothönan simmar
    nickar den stadigt med huvudet, vilket är ett typiskt beteende hos arten.


    Arten förekommer över stora delar av världen. Populationen häckar i Nordafrika,
    Europa och Central­asien ner till Japan, samt i södra hemisfären till Australien
    och Nya Zeeland. Vissa populationer är stannfåglar och stannar året om på sina
    häckningsplatser, medan individer från kallare områden migrerar söderut under
    vintern för att undvika frusen mark och vatten.


    Sothönan tillhör familjen rallar och delas ofta in i fyra geografiska underarter,
    något som återspeglar dess vidsträckta utbredning över både gamla och nya världen.'
  en: '# Eurasian Coot


    The Eurasian coot is a distinctive waterbird easily recognized by its slaty-black
    plumage, glossy black head, and striking white bill with a characteristic white
    frontal shield on the forehead. Males and females look virtually identical. It
    belongs to the rail and crake family and is a widespread species found across
    Europe, Asia, Australia, New Zealand, and parts of North Africa.


    This coot is commonly seen on freshwater lakes, reservoirs, and rivers where it
    forages for aquatic vegetation and invertebrates. It is often found in small flocks,
    particularly outside the breeding season. On water, it swims readily and dives
    expertly to reach food sources below the surface. When alarmed, it can run across
    the water with characteristic splashing movements to become airborne.


    The Eurasian coot is a vocal species with a variety of calls, though it is generally
    less noisy than some of its relatives. Its presence is a familiar feature of many
    wetland habitats, where its dark silhouette and white shield make it one of the
    easiest waterbirds to identify at a distance.'
migration:
  sv: '# Sothöna – Förekomst i Nordeuropa


    Sothönan är en deltidsmigrant i Skandinavien och Nordeuropa. De populationer som
    häckar i norra och centraleuropeiska områden är flyttfåglar som vanligtvis anländer
    till häckningsområdena under vårens gång, typiskt från mars till april. Under
    hösten drar dessa fåglar söderut för att övervintra i mildare klimat. Sydligare
    populationer är ofta stannfåglar och stannar året runt på sina häckningsplatser.
    I de kallaste norra delarna av sitt utbredningsområde är sothönan således endast
    närvarande under häckningssäsongen.'
  en: '# Eurasian Coot in Scandinavia and Northern Europe


    The Eurasian Coot is a common resident and migratory species throughout Scandinavia
    and Northern Europe, with populations showing variable patterns depending on latitude
    and winter severity. Northern breeding populations migrate southward in autumn,
    typically departing from September through November, with birds wintering in more
    temperate regions of Europe and around the Mediterranean. Southern and central
    Scandinavian populations are often partial migrants, with some individuals remaining
    year-round on ice-free waters, while others undertake shorter migrations. Spring
    return to breeding areas generally occurs from February through April as water
    bodies thaw.


    Migration data unavailable for this species.'
