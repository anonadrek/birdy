description:
  sv: '# Dvärgsumphöna


    Dvärgsumphöna är en mycket liten fågel inom rallerfamiljen och är en av världens
    minsta arter i denna grupp. Den är vida spridd och förekommer på flera kontinenter,
    från Europa och Afrika till Asien och Australien, där den påträffas även långt
    söderut till Nya Zeeland.


    Arten är starkt knuten till grunda våtmarker där den lever bland vegetation. I
    norra Europa är dvärgsumphöna en sällsynt gäst, och i Sverige finns endast ett
    tiotal dokumenterade fynd. Den är därför en påtaglig raritet för svenska birdwatchare
    och väcker alltid uppmärksamhet när den observeras.'
  en: ''
migration:
  sv: Dvärgsumphöna är en mycket sällsynt gäst i Skandinavien och förekommer endast
    sporadiskt i norra Europa. Arten är en långdistansmigrant som huvudsakligen är
    hemmastadd i värmare regioner i Europa, Afrika och Asien. I Sverige finns endast
    ett tiotal dokumenterade fynd, vilket indikerar att arten besöker regionen endast
    mycket undantagsvis. När dvärgsumphöna förekommer i norra Europa torde det vara
    under hösten eller våren under migrations­perioder, men arten är så sällsynt att
    regelbundna ankomst- och avgångsmånader för Skandinavien inte kan fastställas.
  en: ''
