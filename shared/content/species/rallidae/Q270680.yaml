description:
  sv: ''
  en: '# Little Crake


    The Little Crake is a diminutive waterbird belonging to the rail family, with
    "parva" reflecting its Latin name meaning "small." It represents one of the tiniest
    members of the Rallidae family, making it easily overlooked in wetland habitats.


    Little Crakes are secretive and elusive birds, preferring to remain hidden among
    dense vegetation in marshes, reed beds, and shallow wetlands. They are skilled
    swimmers and divers despite their small size, moving quietly through aquatic plants.
    The species was historically classified within the genus Porzana before taxonomic
    revision placed it in its current genus.


    The bird''s behaviour emphasizes stealth and concealment rather than conspicuous
    display. Little Crakes typically forage in shallow water and mud, hunting for
    small invertebrates, seeds, and plant matter. Their cryptic nature means they
    are more often heard than seen, particularly during breeding season when they
    become more vocal. Due to their preference for dense cover and retiring habits,
    observation requires patience and knowledge of their preferred wetland environments.'
migration:
  sv: ''
  en: '# Little Crake (Zapornia parva) - Occurrence in Scandinavia/Northern Europe


    The Little Crake is a rare summer visitor to Scandinavia and Northern Europe,
    with breeding records concentrated in southern regions. Birds typically arrive
    in late April or May after wintering in Africa, with the breeding season extending
    through June and July. The species favors freshwater wetlands, reed beds, and
    marshes with dense vegetation for nesting and feeding.


    Autumn migration begins in August and September as breeding birds depart northward
    populations, with most individuals returning to African wintering grounds by October.
    The Little Crake is an uncommon but regular passage migrant in some areas, though
    sightings remain unpredictable. Winter records in Scandinavia are exceptional,
    as the species is almost entirely migratory in the region.'
