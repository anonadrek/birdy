description:
  sv: '# Oceanstormsvala


    Oceanstormsvalan är en liten fågel i familjen stormsvalor som förekommer över
    öppet vatten långt från land. Den är en utpräglad havsfågel som tillbringar större
    delen av sitt liv till sjöss och endast kommer i land för att häcka.


    Arten häckar på olika öar utspridda över Atlanten och Stilla havet. Den är en
    minskat i antal, men beståndet bedöms fortfarande som livskraftigt. Oceanstormsvalan
    är en nattaktiv häckfågel som återvänder till sina boplatser under mörka timmar
    för att undvika rovfåglar.'
  en: '# Band-rumped Storm Petrel


    The band-rumped storm petrel is a small seabird belonging to the storm petrel
    family. It can be identified by its distinctive pale rump band, which contrasts
    with its otherwise dark plumage. This feature gives the species its common name
    and helps distinguish it from related storm petrels at sea.


    This species is highly adapted to oceanic life, spending much of its time over
    deep waters far from land. It feeds on small fish and marine organisms, which
    it picks delicately from the water''s surface while in flight. The bird is typically
    seen alone or in small scattered groups, though it may congregate where food is
    abundant.


    Band-rumped storm petrels are nocturnal visitors to their breeding colonies, coming
    ashore under cover of darkness to nest in rocky crevices and burrows on offshore
    islands. During the day, they remain at sea. Their calls at night consist of distinctive
    purring and chittering sounds. Outside the breeding season, little is known about
    their movements and behaviour at sea, as they are elusive and difficult to observe
    in their oceanic habitat.'
