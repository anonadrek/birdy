description:
  sv: '# Stormsvala


    Stormsvala är en liten havsfågel som är lätt att känna igen på sitt helsvarta
    färgteckning. Det enda undantaget är ett brett vitt band över övergumpen och ett
    vitt band på vingundersidan, vilket blir synligt när fågeln flyger. Stormsvalan
    har en fyrkantig stjärt och en karakteristisk fladdrande, fladdermusaktig flygt
    som skiljer den från många andra sjöfåglar.


    Arten häckar huvudsakligen på öar längs Europas västkust, där det finns stora
    kolonier på flera platser. Under häckningstiden är det möjligt att skilja olika
    underarter åt genom sitt förekomstområde, men utanför häckningstiden är dessa
    populationer praktiskt taget omöjliga att särskilja i fält. Stormsvalan spenderar
    mycket tid ute på öppet vatten och ses ofta när det flyger lågt över vågorna på
    sin karakteristiska sätt.'
  en: '# European Storm Petrel


    The European storm petrel is a tiny seabird, barely larger than a sparrow, making
    it one of the smallest petrels. Its plumage is entirely black except for a distinctive
    broad white rump patch and white markings on the underwings. The tail is notably
    square-shaped. In flight, it appears remarkably bat-like with rapid, fluttering
    wingbeats as it bounces low over the water surface, often appearing to patter
    across waves with its feet.


    This species breeds primarily on islands in northern regions, with particularly
    large populations in certain island groups off the northern European coast. A
    separate Mediterranean population inhabits different islands further south. The
    birds are highly pelagic, spending most of their lives far out at sea away from
    land, making them challenging to observe. They typically return to breeding colonies
    only under cover of darkness.


    The European storm petrel''s nocturnal habits and small size make it difficult
    for most observers to encounter, even in areas where it breeds abundantly. At
    sea, identification can be confirmed by the characteristic white rump and underwing
    markings combined with its distinctive flight pattern. The species demonstrates
    remarkable site fidelity, returning to the same breeding islands year after year.'
migration:
  sv: '# Stormsvala - Förekomst i Nordeuropa


    Stormsvala är en pelagisk art som huvudsakligen förekommer utanför Europas kuster.
    Den häckar på öar i Nordatlanten, framför allt på Färöarna, Storbritannien, Irland
    och Island. Som en typisk havsfågel är stormsvalan knuten till havet under större
    delen av året. Under häckningssäsongen, som inträffar under vår och sommar, är
    fågeln landfast på sina häckningsöar. Efter reproduktionen genomför arten en långväga
    migration söderut mot atlantiska farvattnen och Medelhavsregionen under höst och
    vinter, där populationen inte har samma tydliga häckningskoncentration.'
  en: '# European Storm Petrel in Northern Europe


    The European storm petrel is a summer breeder throughout Scandinavia and northern
    Europe, with major breeding populations in Iceland, the Faroe Islands, and the
    British Isles. These small seabirds arrive at their northern breeding colonies
    in spring, typically from May onwards, after wintering at sea in Atlantic waters.
    They depart breeding sites in autumn, with most birds leaving by September to
    return to their oceanic wintering grounds off the coasts of western Africa and
    in the Atlantic. Storm petrels are highly pelagic outside the breeding season,
    remaining at sea throughout winter.'
