description:
  sv: ''
  en: '# Cape Verde Storm Petrel


    The Cape Verde storm petrel is a small seabird belonging to the storm petrel family,
    highly adapted to life at sea in the Atlantic Ocean. It was historically grouped
    with the band-rumped storm petrel but is now recognized as a distinct species
    by major ornithological authorities.


    This oceangoing petrel inhabits waters around the Cape Verde islands, where it
    spends much of its time far from land. Like other storm petrels, it is a diminutive,
    dark-plumaged bird well-suited to marine environments. The species feeds on small
    fish and crustaceans picked from the water''s surface.


    Storm petrels are notoriously difficult to observe and identify at sea due to
    their small size and elusive behaviour. The Cape Verde storm petrel remains relatively
    poorly studied compared to other seabirds, and detailed information about its
    specific calls, breeding habits, and seasonal movements is limited. Its taxonomy
    was clarified only through modern ornithological research, demonstrating how much
    remains to be learned about these ocean-dwelling specialists.'
