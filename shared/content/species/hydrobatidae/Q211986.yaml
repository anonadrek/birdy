description:
  sv: '# Klykstjärtad stormsvala


    Klykstjärtad stormsvala är en liten fågel i familjen stormsvalor som förekommer
    i både Stilla havet och Atlanten. Arten är hotad och minskar kraftigt i antal,
    vilket gör den utrotningshotad.


    Denna lilla stormsvala är svårstudierad på grund av sin storlek och sitt livsätt
    ute på öppet hav. Det är en pelagisk art som tillbringar större delen av sitt
    liv långt från land, där det jagar små bytesdjur vid vattenytan. Arten är mest
    aktiv under skymningen och natten, vilket försvårar observationer ytterligare.


    För en intresserad fågelskådare är klykstjärtad stormsvala en utmanande art att
    se, då den håller sig långt från kusten under större delen av året. Bästa möjligheten
    är under pelagiska båtexpedititioner på mörka hav långt från land, särskilt under
    säsonger när arten är mer aktiv.'
  en: ''
