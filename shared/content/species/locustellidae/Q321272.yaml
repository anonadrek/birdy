description:
  sv: "# Vassångare\n\nVassångare är en liten, diskret gräsfågel med brunaktig fjäderdräkt\
    \ och vit strupe. Den är svår att upptäcka i sitt naturliga habitat bland täta\
    \ sälgbuskage och rörskogen där den håller sig gömd. Arten har en karakteristisk,\
    \ nästan insektliknande sång som beskrivs som en långdragen drill - ett monotont\
    \ ljud som ofta hörs under skymningen och natten.\n\nArten häckar i feuktig miljö\
    \ med riklig vegetation, särskilt i områden med rörskogar och buskmark. Den är\
    \ mycket återhållsam och vistas normalt lågt i växtligheten. Vassångare migrerar\
    \ mellan Europa och västra Asien som häckningsområde och söker sig till Afrika\
    \ för övervintering. \n\nUnder senare decennier har arten etablerat sig som häckfågel\
    \ i sitt område, och populationen bedöms som stabil enligt IUCN. För den som vill\
    \ få syn på denna fågel krävs tålamod och kunskap om dess föredragna biotoper."
  en: ''
migration:
  sv: Vassångare är en flyttfågel som häckar i Europa och västra Asien. Arten koloniserade
    Sverige på 1990-talet och har därefter etablerat sig som häckfågel i landet. Under
    hösten migrerar vassångaren söderut till Afrika för att övervintra, där den finns
    från Etiopien och Sudan och längre söderut. Arten återvänder till sina häckningsområden
    under våren för att reproducera sig under sommarmånaderna.
  en: ''
