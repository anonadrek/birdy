description:
  sv: '# Träsksångare


    Träsksångare är en liten sångare inom familjen gräsfåglar. Arten häckar i ett
    omfattande område från nordvästra Ryssland österut till Kamtjatka och Japan. Under
    vintermånaderna är den en flyttfågel som drar till södra och sydöstra Asien, där
    den förekommer från Indien till Indonesien.


    I Västeuropa är träsksångaren en sällsynt gäst och ses endast under passage. Arten
    är relativt okänd för de flesta birdare utanför sitt regelbundna utbredningsområde.
    IUCN kategoriserar den som livskraftig, vilket tyder på att populationen är stabil.


    Mer detaljerad information om artens utseende, beteende och läten kräver ytterligare
    källor, då den tillgängliga texten fokuserar på utbredning och migrationsmönster.'
  en: '# Lanceolated Warbler


    The lanceolated warbler is a small, streaked warbler with brownish plumage and
    distinctive spear-shaped markings on its breast—a characteristic that gives the
    species its name. It is compact and cryptic in appearance, designed for life among
    dense vegetation.


    This is a shy, elusive bird that favors reed beds, marshes, and tall grass habitats.
    It is highly migratory, breeding across a vast range from northeastern European
    Russia eastward through the Palearctic to northern Japan, then withdrawing to
    Southeast Asia for winter. Like other members of its genus, the lanceolated warbler
    produces an insect-like song reminiscent of a grasshopper''s call—indeed, the
    genus name Locustella derives from the Latin word for grasshopper.


    The species is best located by listening for its distinctive reeling song during
    the breeding season. It tends to remain low in vegetation and can be difficult
    to observe directly, preferring to skulk rather than perch openly. Birdwatchers
    seeking this species should focus on appropriate wetland habitats where tall reeds
    and grasses provide good cover.'
migration:
  sv: '# Träsksångare i Norden


    Träsksångare är en långdistansmigrant som förekommer mycket sällan i Skandinavien
    och Västeuropa. Arten häckar i Ryssland långt österut och övervintrar i södra
    och sydöstra Asien, från Indien till Indonesien. De få iakttagelser som görs i
    Sverige och övriga Västeuropa utgörs av vilsefåglar under höstmigrationen, framför
    allt under september och oktober. Arten är således endast en sällsynt tillfällig
    gäst i nordeuropeisk region.'
  en: '# Lanceolated Warbler (Träsksångare)


    The Lanceolated Warbler is a migratory species with limited occurrence in Scandinavia
    and Northern Europe. It breeds across the Palearctic from northeastern European
    Russia eastward to northern Japan, with populations occasionally reaching the
    northwesternmost parts of its range. As a long-distance migrant, it winters in
    Southeast Asia. In Scandinavian regions, this species appears only as a vagrant
    or rare passage migrant during spring and autumn migration periods, with sightings
    most likely in coastal areas during May and August-September. Regular breeding
    does not occur in Northern Europe.'
