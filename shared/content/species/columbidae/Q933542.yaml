description:
  sv: ''
  en: '# Laurel Pigeon


    The Laurel Pigeon is a medium-sized pigeon endemic to the Canary Islands, where
    it inhabits laurel forests—ancient woodlands that provide its primary habitat.
    This species is notably the official animal symbol of one of the islands in the
    archipelago.


    The bird is characterized by its distinctive white tail, which contrasts with
    its darker plumage and gives the species its alternative common name. Like other
    pigeons, it has a compact body suited to forest living. Its behaviour is typical
    of woodland pigeons, feeding on seeds and fruits found within the forest canopy
    and understory.


    The Laurel Pigeon''s calls are characteristic cooing sounds common to pigeons,
    though details specific to this species are limited. As a forest specialist, it
    remains relatively inconspicuous within its preferred laurel woodland habitat,
    making it a species of particular interest to birdwatchers visiting these unique
    island ecosystems. Its dependence on laurel forest makes it an indicator species
    for the health of these specialized woodland environments.'
