description:
  sv: '# Skogsduva


    Skogsduvan är en medlem av familjeen duvor som är utbredd i västra och centrala
    delarna av palearktis. Det är en ganska skygg art som huvudsakligen lever av frön.
    Arten föredrar att häcka i trädhålor och är en flyttfågel, vilket innebär att
    merparten av populationen migrerar säsongsvis.


    Arten ses främst på öppna och halvöppna miljöer där det finns både betes- och
    odlingsmark. Skogsduvan söker ofta föda på marken och är kända för sitt diskreta
    beteende. Arten är mindre framträdande än många andra duvor och undviker gärna
    människor och täta bosättningar.'
  en: '# Stock Dove


    The stock dove is a medium-sized member of the pigeon family found across the
    western Palearctic region, from central Scandinavia in the north to northwestern
    Africa in the south. It is the type species of its genus, Columba, making it scientifically
    significant among pigeons.


    The species exhibits different migration patterns depending on location. Western
    and southern populations remain resident year-round, while birds breeding in the
    colder northeastern parts of its range migrate seasonally to escape harsh winters.
    This flexibility in movement patterns reflects the stock dove''s adaptation to
    varying climate zones across its extensive geographic distribution.


    The stock dove typically inhabits open woodlands, farmland, and coastal areas
    where it can find suitable nesting sites and food sources. Its widespread presence
    throughout much of Europe and beyond makes it a familiar sight to many birdwatchers,
    though detailed information about its specific appearance, vocalizations, and
    behaviour would benefit from direct field observation or specialized ornithological
    sources.'
migration:
  sv: '# Skogsduva (Columba oenas) – migration i Nordeuropa


    Skogsduvan är främst en flyttfågel som återvänder till Skandinavien och Nordeuropa
    under våren för att häcka. Arten förekommer i västra och centrala Palearktis och
    merparten av populationen migrerar säsongsvis. Skogsduvor anländer till häckningsområdena
    under april-maj och återvänder för att övervintra i södra områden under hösten.
    Arten föredrar att häcka i trädhålor och lever främst av frön, vilket gör den
    beroende av tillgången på lämpliga föda och boplatser under året.'
  en: '# Stock Dove (Columba oenas) - Scandinavian Distribution


    The Stock Dove occurs throughout Scandinavia with distinct seasonal patterns.
    Western and southern Scandinavian populations are largely resident year-round,
    though some movement occurs during winter months. However, northeastern populations,
    particularly in northern Sweden and Finland, are migratory, departing in autumn
    to escape harsh winters and returning in spring. Birds typically arrive in Scandinavia
    from March onwards, with breeding activity throughout summer. Wintering birds
    concentrate in milder western and southern regions, while breeding populations
    occupy woodlands and parkland across the region.'
