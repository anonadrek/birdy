description:
  sv: '# Mörk turturduva


    Mörk turturduva är en afrikansk duvfågel som huvudsakligen förekommer i bergsskogar
    i östra Afrika och på den sydvästra Arabiska halvön. Arten tillhör familjen duvor
    och är klassificerad som livskraftig vad gäller beståndsstatus.


    Arten är anpassad till bergsmiljöer där den söker föda och bygger sitt bo. Som
    många duvor är arten social och kan ses både individuellt och i mindre grupper.
    Det är en medelstor duva med mörkare fjäderdräkt jämfört med många andra turturduvor
    – en egenskap som återspeglas i dess namn.


    Denna duvart spelar en viktig roll i sina bergiga hemtrakter och utgör en del
    av det biologiska mångfaldet i dessa bergsskogar.'
  en: ''
