description:
  sv: '# Olivduva


    Olivduva är en medlem av duvfamiljen och förekommer i bergstrakter över stora
    delar av Afrika söder om Sahara. Arten har ett stabilt bestånd och anses inte
    vara hotad.


    Olivduvan är en medelstor duva med en karakteristisk olivfärgad fjäderdräkt som
    ger arten sitt namn. Den är välanpassad för livet i bergiga områden där den ofta
    ses sitta i träd eller på klippor. Som de flesta duvor är arten socialt lagd och
    kan förekomma i mindre flockar, särskilt vid vattenhål och betesmarker.


    Arten är känd för sitt mjuka, sorglösa ropande som ofta hörs från bergskogen på
    mornar och kvällar. Olivduvan föredrar högre belägna skogshabitat och är därför
    ofta svårare att observera än låglandsduvorna. Den är omnöjsam när det gäller
    föda och äter främst frön och växtmaterial som den plockar från marken eller från
    träden.'
  en: '# African Olive Pigeon


    The African olive pigeon is a resident pigeon found across eastern and southern
    Africa, with isolated populations in western regions and the Arabian Peninsula.
    It is locally common but shows a patchy distribution, reflecting its specific
    habitat preferences. The species is monotypic, meaning birds throughout its range
    show no significant geographical variation.


    This pigeon favors forested and woodland environments where it can find suitable
    food and breeding sites. It remains in its territories year-round rather than
    migrating seasonally. While locally abundant in suitable areas, the species''
    discontinuous range reflects its dependence on particular forest conditions, creating
    notable gaps where habitat becomes unsuitable.


    The African olive pigeon is a moderate-sized pigeon that blends into its woodland
    surroundings. Observers in appropriate habitats may encounter it feeding or perched
    in trees, though it can be inconspicuous among foliage. Its preference for specific
    forest types makes it a sought-after species for birdwatchers exploring suitable
    woodland areas within its range.'
