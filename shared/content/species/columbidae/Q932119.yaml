description:
  sv: ''
  en: '# Yellow-eyed Pigeon


    The yellow-eyed pigeon is a member of the pigeon family, distinguished by its
    pale plumage and characteristic yellow eye-ring. It is a migratory species that
    breeds across a broad range of mountainous and semi-arid regions in Central and
    South Asia during the breeding season. In winter, it moves to lower elevations
    in adjacent areas, seeking more favorable conditions.


    Sadly, this species has experienced significant population declines over recent
    decades, primarily due to hunting pressure. As a result, it is classified as vulnerable
    by the International Union for Conservation of Nature. The yellow-eyed pigeon
    inhabits arid and semi-arid terrain, typically favoring rocky slopes and open
    woodlands where it can nest and forage. Like other pigeons, it feeds on seeds
    and grains found on the ground and in vegetation.


    Observers wishing to see this species should focus on appropriate habitat during
    its seasonal movements, though declining numbers make sightings increasingly challenging.
    Conservation of its breeding and wintering grounds remains important for the species''
    survival.'
