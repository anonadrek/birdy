description:
  sv: "# Gulbukig grönduva\n\nGulbukig grönduva är en liten till medelstor duva som\
    \ förekommer i Afrika strax söder om Sahara samt på sydvästra Arabiska halvön.\
    \ Arten tillhör familjen duvor och är anpassad till sitt varma klimat.\n\nArten\
    \ är grönfärgad, vilket är typiskt för många duvor i denna region. Den gula bukmarkeringen\
    \ utgör ett distinktivt kännetecken som särskiljer den från närbesläktade arter.\
    \ \n\nGulbukig grönduva förekommer främst i torra och halvtorra miljöer där det\
    \ finns lämplig vegetation. Som andra duvor är arten frugivör och söker sin föda\
    \ i träd och buskar. Arten är en typisk fågel för sitt biotopval i området söder\
    \ om Sahara."
