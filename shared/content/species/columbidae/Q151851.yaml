description:
  sv: '# Långstjärtsduva


    Långstjärtsduvan är en mycket liten duva som kännetecknas av en markant långt
    utdragen stjärt, vilket ger arten sitt namn. Detta gör den lätt att identifiera
    trots sitt lilla format. Arten är spridd över ett brett geografiskt område och
    förekommer huvudsakligen i Afrika samt på närliggande områden runt Arabiska halvön.
    Populationen verkar stabil och ökar i antal.


    Arten är anpassad till sin miljö och trivs väl i sitt utbredningsområde. Den är
    vida spridd över sitt ursprungliga område och har visa tecken på ökande antal,
    vilket tyder på att arten mår bra och kan anpassas till varierande förhållanden.'
  en: '# Namaqua Dove


    The Namaqua dove is an exceptionally small pigeon, distinctly diminutive compared
    to other members of the dove family. It is the sole species within its genus,
    Oena, making it taxonomically unique. The bird''s compact size and streamlined
    build reflect adaptations suited to arid and semi-arid environments.


    This species inhabits a wide geographic range across Sub-Saharan Africa, extending
    into parts of Arabia and Madagascar. It typically favours dry, open habitats including
    scrubland, grassland, and cultivated areas, where it forages for seeds on the
    ground. The Namaqua dove is generally inconspicuous and often goes unnoticed in
    its sparse habitat until it takes flight.


    With its small frame and characteristic flight pattern, the species displays the
    typical dove behaviour of explosive takeoff when disturbed. Like other doves,
    it feeds primarily on seeds picked from the ground, often visiting water sources
    during dry periods. The species'' abundance and adaptability to various arid regions
    make it a relatively common sight across much of its range, though its small size
    and preference for open ground means observers must watch carefully to locate
    it.'
migration:
  sv: 'Migrationsdata saknas för denna art.


    **Förklaring:** Källtexten innehåller ingen information om långstjärtduvans förekomst
    i Skandinavien eller Nordeuropa, och ingen migrationsdata ges. Arten beskrivs
