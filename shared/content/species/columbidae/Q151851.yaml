    förekomst i södra Levanten. Det finns ingen grund för att skriva om nordeuropeisk
    förekomst eller migration för denna art.'
  en: 'Migration data unavailable for this species.


    The provided source text contains no information about the Namaqua Dove''s occurrence
    in Scandinavia or Northern Europe, nor any details about migration patterns, overwintering,
    or seasonal movements in these regions. This species is native to Sub-Saharan
    Africa, Arabia, and Madagascar, and would not be expected to occur naturally in
    Scandinavia or Northern Europe.'
