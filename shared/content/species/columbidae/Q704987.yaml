description:
  sv: ''
  en: '# Oriental Turtle Dove


    The Oriental turtle dove is a medium-sized dove with rufous-tinged plumage and
    subtle patterning variations across its wide Asian range. It belongs to the Columbidae
    family and displays geographical variation, with at least six recognized subspecies
    showing differences in plumage markings. The species is predominantly granivorous,
    spending much of its time foraging on the ground for seeds and grains.


    Behaviorally, the Oriental turtle dove shows distinct migratory patterns depending
    on latitude. Populations breeding in higher latitudes undertake southward migrations
    during winter, while those inhabiting tropical regions remain sedentary year-round.
    This flexibility in movement has allowed the species to maintain a broad distribution
    stretching from Central Asia eastward across Asia to Japan. Occasionally, vagrants
    appear in North America, indicating occasional long-distance dispersal beyond
    its established range.


    The species'' preference for ground foraging and seed-eating lifestyle makes it
    relatively inconspicuous, though its presence can often be detected through its
    distinctive calls. It typically frequents open woodlands, scrublands, and cultivated
    areas where seeds are readily available, making it adaptable to various habitats
    across its range.'
migration:
  sv: ''
  en: '# Streptopelia orientalis in Northern Europe


    The Oriental Turtle Dove is a rare vagrant to Scandinavia and Northern Europe,
    with only occasional records. The species is not a regular migrant through the
    region. Given its native range extending from Central Asia eastward to Japan,
    any individuals recorded in Scandinavia represent exceptional dispersal events
    rather than established migration patterns. While populations in higher latitudes
    of their Asian range migrate southward during winter months, the species shows
    no consistent migratory presence in Northern European territories. Sightings remain
    sporadic and unpredictable.'
