description:
  sv: '# Ringduva


    Ringduvan är Europas största och mest utspridda duvart. Den är en robust fågel
    med blågrå fjäderdräkt, som kännetecknas av två vita fläckar på halsen – en markering
    som förklarar dess namn. Arten förekommer i de flesta skogstyper och har under
    senare år vuxit in i människans miljö, där den nu är vanlig i parker, trädgårdar
    och urbana områden.


    Ringduvan är en lugn och ofta långsam flygare som föredrar att glida mellan träd.
    Den är ofta påtaglig genom sitt välkända, tjutande rop som låter som "kru-kru-kru-kruu".
    Arten lever huvudsakligen av frön och växtdelar, och flyger ofta ned till marken
    för att söka föda.


    Detta är en art som fortsätter att anpassa sig väl till förändrade miljöer och
    återfinns således i allt fler trädgårdar och bebodda områden runt om i sitt utbredningsområde.'
  en: '# Common Wood Pigeon


    The common wood pigeon is a large pigeon found throughout the western Palearctic
    region. It belongs to the genus Columba, alongside closely related species such
    as the rock dove. This species is notably adaptable and has a flexible diet, feeding
    primarily on plant material including cereals, seeds, and buds, which makes it
    an important agricultural pest in many areas.


    Despite being extensively hunted across much of its range, the common wood pigeon''s
    population numbers remain robust and stable. Its ability to exploit cultivated
    crops and natural food sources has enabled it to thrive even under hunting pressure.
    The species demonstrates considerable resilience, suggesting its reproductive
    success and adaptability outpace the impact of human control measures.'
migration:
  sv: Ringduvan är en året runt närvarande art i stora delar av Skandinavien och Nordeuropa,
    även om populationen varierar säsongsvis. Under hösten migrerar många ringduvor
    från norra och östliga delar av utbredningsområdet söderut för att övervinta i
    mildare klimat, medan andra populations-grupper är stationära eller endast gör
    kortare förflyttningar. Ankomsten till häckningsområdena sker vanligtvis under
    mars och april, då ringduvorna återvänder från sina övervintringsplatser. I södra
    Skandinavien och Danmark förekommer arten året om, medan populationerna i norr
    är mer migrerande.
  en: '# Common Wood Pigeon (Columba palumbus) in Northern Europe


    The Common Wood Pigeon shows variable migration patterns across Scandinavia and
    Northern Europe. Populations in southern regions are largely resident year-round,
    while northern breeding populations migrate southwestward to wintering grounds
    in western and central Europe during autumn months. Birds typically depart breeding
    areas in September-October and return in March-April. In Scandinavia, some individuals
    remain through winter in milder coastal areas, but harsh winters often force northern
    populations to migrate. The species has shown increasing winter residency in recent
    decades, likely linked to climate warming and increased food availability in agricultural
    areas.'
