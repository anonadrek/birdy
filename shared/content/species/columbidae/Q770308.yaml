description:
  sv: '# Madeiraduva


    Madeiraduva är en endemisk duva som endast förekommer på ön Madeira. Arten är
    huvudsakligen jämngrå med ett karakteristiskt rosalila skimrande bröst. Den silvergrå
    halsfläcken, avsaknaden av vita tvärband på vingovansidan och dess annorlunda
    stjärtteckning skiljer den tydligt från ringduvan, som är dess närmsta släkting.


    Arten har ett karakteristiskt lockläte – ett sexstavigt "hoande" som är svagare
    och i en lägre ton än ringduvans. I flykten upplevs madeiraduvan som relativt
    tung och storstjärtad, med ett snabbt och rakt flygmönster.'
  en: '# Trocaz Pigeon


    The Trocaz Pigeon is a handsome, medium-sized pigeon endemic to Madeira. It is
    predominantly grey with a distinctive pinkish breast and a striking silvery patch
    on the neck. These features, combined with its lack of white wing markings, clearly
    separate it from its close relative, the Common Wood Pigeon. The bird has a notably
    long tail and bulky build, yet despite this rather heavy appearance, it is surprisingly
    agile in flight, moving swiftly and directly through the air.


    The Trocaz Pigeon''s call is one of its most characteristic features—a gentle,
    six-note cooing that is noticeably weaker and lower-pitched than the more familiar
    calls of the Common Wood Pigeon. This softer vocalisation is often the first sign
    of the bird''s presence in its woodland habitat. The species is closely related
    to the Common Wood Pigeon and is thought to be its descendant, adapted to island
    life.


    As an endemic species found nowhere else in the wild, the Trocaz Pigeon is a special
    subject for birdwatchers visiting Madeira, where it inhabits laurel forests and
    other suitable woodland areas.'
