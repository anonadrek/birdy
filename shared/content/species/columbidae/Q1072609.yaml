description:
  sv: ''
  en: '# Red-eyed Dove


    The red-eyed dove is a widespread and common dove species found throughout Sub-Saharan
    Africa. It is a medium-sized dove with distinctive plumage featuring soft grey
    and vinous tones, though its most striking feature is its bright red eye-ring,
    which gives the species its name. The bird''s appearance is relatively understated
    compared to some other dove species, but the red orbital ring provides a clear
    identification mark for observers.


    Like other doves, the red-eyed dove is primarily a ground and low-level forager,
    feeding on seeds and grain. It is a social species often seen in small flocks,
    particularly in woodland and savanna habitats. The bird''s call is a characteristic
    cooing sound typical of doves, which helps identify it in areas where multiple
    dove species may occur together.


    The species remains abundant across its range and shows no signs of decline, having
    been assessed as Least Concern on the IUCN Red List since 2004. It adapts well
    to various habitats within Sub-Saharan Africa and has benefited from human settlement
    in some regions where grain and seeds are more readily available.'
