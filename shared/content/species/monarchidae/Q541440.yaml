description:
  sv: '# Afrikansk paradismonark


    Afrikansk paradismonark är en liten fågel i familjen monarker som förekommer i
    Afrika söder om Sahara och på södra Arabiska halvön. Det är en elegant insektätare
    med karakteristisk utseende – honan är främst grå och vit medan hanen uppvisar
    mer dramatisk färgprakt med kastanjebrunt på huvudet och vita delar kombinerat
    med mörkare fjäderdräkt. Arten är känd för sitt aktiva jaktbeteende då den snabbt
    navigerar genom vegetationen på jakt efter små insekter i luften.


    Afrikansk paradismonark är en framträdande medlem av monarkfamiljen och anpassad
    för liv i träden och busktäta miljöer. Arten ses ofta högt upp i kronorna där
    den rör sig rastlöst mellan grenar. Arten är känd för sitt karakteristiska rop
    som ofta hörs före fågeln själv blir synlig bland lövverket.'
  en: '# African Paradise Flycatcher


    The African Paradise Flycatcher is a striking medium-sized flycatcher immediately
    recognizable by its extraordinary tail streamers in males, which commonly extend
    more than twice the bird''s body length. Males display bold chestnut and rusty
    upper parts contrasting with grey to blue-grey underparts and head. The mature
    male''s head is particularly distinctive—glossy black with greenish highlights—while
    the beak and bare facial wattle ring match the surrounding plumage. Females are
    similar but noticeably less showy, with paler heads and more modest tail feathers
    lacking the male''s dramatic streamers.


    This bird is primarily an insectivore, foraging actively through woodland and
    forest canopy. It exhibits characteristic flycatcher behaviour, sallying out to
    catch prey in flight with agility that belies its impressive tail ornamentation.
    The species occurs across sub-Saharan Africa in suitable woodland and forest habitats,
    though specific range and call characteristics would benefit from additional sources
    for complete guide coverage.'
