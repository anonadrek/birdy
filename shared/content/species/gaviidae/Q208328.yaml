description:
  sv: ''
  en: '# Yellow-billed Loon


    The yellow-billed loon is the largest member of the loon family, easily identified
    by its distinctive long, straw-yellow bill with a straight culmen that gives it
    a characteristically uptilted appearance. Breeding adults display striking plumage
    with a black head, white underparts, and a chequered black-and-white mantle. In
    non-breeding season, the bird becomes considerably drabber, though it retains
    white on the chin and foreneck, making seasonal identification important.


    As a member of the diver family, it is a highly specialized waterbird adapted
    for diving and pursuing aquatic prey. The species favours remote northern waters
    and is typically encountered in arctic and subarctic regions. Like other loons,
    it is most at home in the water and rarely comes ashore except to breed. The yellow
    bill remains the most reliable field mark for distinguishing this species from
    other, smaller loons, particularly in distant views or non-breeding plumage when
    other features are less pronounced.'
migration:
  sv: ''
  en: '# Yellow-billed Loon (Gavia adamsii) in Northern Europe


    The yellow-billed loon is a rare visitor to Scandinavian waters, occurring mainly
    during winter months and migration periods. This arctic breeder is typically encountered
    in northern Scandinavian coastal areas from November through March, when individuals
    move south from their high-arctic breeding grounds in Russia and northern Siberia.
    Most sightings involve non-breeding birds in winter plumage. Spring migration
    back to breeding territories occurs from March to May, though sightings remain
    uncommon and irregular. The species does not establish breeding populations in
    Scandinavia and is best regarded as an occasional winter visitor to Norwegian
    and northern Swedish coasts, with far fewer records in southern regions.'
