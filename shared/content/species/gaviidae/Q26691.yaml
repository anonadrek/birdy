description:
  sv: '# Smålom


    Smålom är en vattenlevande fågel som tillhör familjen lommar och är en utpräglad
    flyttfågel. Den är en av de mest spridda lommarna och förekommer över stora delar
    av den norra tempererade zonen på båda sidor av Atlanten. Arten är anpassad för
    liv i vatten och är en skicklig dykare.


    Under häckningssäsongen är smålomen lätt att identifiera på sitt röda halsbälte,
    som kontrasterar mot dess mörkare övre delar. Under övriga årstider blir färgningen
    mer diskret och gråaktig. Som övrig lom är smålomen relativt stor och långsträckt
    i kroppsformen, med placering av benen långt bak på kroppen.


    Arten är känd för sitt karakteristiska rop, ett skallande läte som kan höras från
    sjöar under häckningen. På sina häckningsplatser förekommer smålomen på både större
    sjöar och mindre vattendrag i norra regioner, medan den övriga årstiden tillbringar
    på havet eller större sötvattensystem. Som flyttfågel pendlar den mellan sitt
    häckningsområde och sina övervintringsplatser.'
  en: '# Red-throated Loon


    The red-throated loon is the smallest member of the loon family, measuring 55-67
    centimetres in length. During breeding season, it displays a distinctive reddish
    throat patch against grey upperparts and white underparts. In winter plumage,
    it becomes a nondescript greyish-white bird, losing the bold throat marking. This
    migratory species breeds primarily in Arctic regions and winters in northern coastal
    waters, making it the most widely distributed of all loons across the Northern
    Hemisphere.


    Red-throated loons are highly specialized fish-eaters, though they occasionally
    consume amphibians, invertebrates, and plant material. They are monogamous birds
    that form long-term pair bonds. Both members of a breeding pair share responsibilities
    equally, building nests together, incubating eggs, and caring for young after
    hatching. Their aquatic lifestyle is reflected in their streamlined bodies and
    powerful swimming ability, adapted for pursuing fish underwater with considerable
    agility and speed.'
migration:
  sv: Smålom är en utpräglad flyttfågel som återvänder till Skandinavien och Nordeuropa
    under våren, typiskt från april till maj, för att häcka vid mindre insjöar och
    fjällvattendrag. Under hösten påbörjar arten sin migration söderut, vanligtvis
    från augusti-september, för att övervinta i tempererade havsområden längs Atlanten
    och Medelhavet. Arten är därmed endast närvarande som häckfågel under sommarmånaderna
    i norra Europa, medan den under vinterperioden finns i sydligare västra och södra
    kustvatten.
  en: '# Red-throated Loon in Northern Europe


    The red-throated loon is a migratory species found throughout Scandinavia and
    northern coastal regions. It breeds in Arctic areas during the breeding season,
    displaying its distinctive red throat patch. In autumn, these birds migrate southward
    to winter in northern coastal waters, including the waters around Scandinavia.
    They return to breeding grounds in spring as ice melts and freshwater habitats
    become available. During winter months, the birds lose their characteristic throat
    coloring and appear predominantly grey and white. This highly migratory pattern
    ensures the species occupies suitable habitats year-round across the Northern
    Hemisphere.'
