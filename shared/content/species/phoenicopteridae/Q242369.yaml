description:
  sv: ''
  en: '# Lesser Flamingo


    The lesser flamingo is the smallest flamingo species, distinguishable by its compact
    size and deep crimson plumage, which intensifies during breeding season. It has
    the characteristic flamingo bill with a distinctive black tip and pale base, adapted
    for filter-feeding on algae and small organisms in shallow waters.


    This highly social species occurs in large flocks across sub-Saharan Africa and
    western India, frequenting shallow alkaline and saline lakes where food is abundant.
    Lesser flamingos are gregarious birds, often gathering in enormous numbers that
    can number in the hundreds of thousands. Their vocalizations include various honking
    and nasal calls used for communication within flocks.


    Occasionally, individual birds are reported outside the species'' regular range,
    though these are typically considered vagrant individuals rather than established
    populations. The lesser flamingo''s preference for specific alkaline lake habitats
    makes it dependent on particular wetland environments for survival.'
migration:
  sv: ''
  en: '# Migration in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Lesser Flamingo is a sub-Saharan African and Indian species with no established
    presence in Scandinavia or Northern Europe. While occasional birds are reported
    north of their core range, these are considered vagrants rather than regular migrants.
    There is no documented pattern of seasonal occurrence, overwintering, or predictable
    arrival in Northern European regions.'
