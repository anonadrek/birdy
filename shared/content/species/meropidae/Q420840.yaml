  en: '# Asian Green Bee-eater in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Asian Green Bee-eater is distributed across Asia from Iran through the Indian
    subcontinent to Vietnam, with no documented occurrence in Scandinavia or Northern
    Europe. This species exhibits resident or short-distance seasonal movements within
    its Asian range, but does not migrate to or occur in Northern European regions.
    Consequently, there is no relevant information regarding its presence, migration
    patterns, or seasonal occurrence in Scandinavian territories.'
