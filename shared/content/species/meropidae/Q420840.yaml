description:
  sv: '# Orientbiätare


    Orientbiätare är en liten fågel i biätarfamiljen som tidigare klassificerades
    som underart till grön dvärgbiätare men betraktas nu som egen art. Det är en elegant
    fågel anpassad för sitt insektsätande levnadssätt.


    Orientbiätaren kännetecknas av sin gröna färgtoning och kompakta kropp, typisk
    för biätarfamiljen. Som namnen avslöjar liknar det grön dvärgbiätaren men utgör
    nu en separat taxon. Arten är huvudsakligen aktivt jagande, där detSnappar efter
    insekter – framför allt bin och andra små flygande insekter – ofta från en frågställande
    sittplats.


    Arten förekommer framför allt i östliga delar av sitt utbredningsområde. Det är
    en fågel som återfinns i öppnare och semiöppna habitat där insektsutbudet är tillräckligt
    för att försörja arten. Liksom andra biätare har orientbiätaren ofta ett karakteristiskt
    rop som kan användas för identifikation. Med sin aktiva jagarbeteende och iögonfallande
    flygande framträder den ofta synbar för iakttagare i lämpligt habitat.'
  en: '# Asian Green Bee-eater


    The Asian green bee-eater is a small, slender bird with predominantly green plumage,
    making it well-adapted to blending into vegetation. Several regional subspecies
    exhibit subtle plumage variations, though all share the characteristic streamlined
    body and pointed bill typical of bee-eaters. Its elegant appearance and graceful
    movements make it a rewarding species to observe.


    This species feeds almost exclusively on insects, particularly bees and other
    flying arthropods, which it catches deftly in flight using swift, darting maneuvers.
    Unlike many bee-eaters, it does not require proximity to water and is found in
    grasslands, thin scrub, and open woodland habitats across its range. It is largely
    resident or undertakes only short-distance seasonal movements.


    The Asian green bee-eater is widely distributed throughout Asia, from coastal
    southern Iran eastward across the Indian subcontinent and into Southeast Asia,
    reaching Vietnam. Its adaptability to various open habitats within this broad
    range makes it a relatively common species where it occurs, though it may be easily
    overlooked due to its small size and preference for perching quietly among vegetation.'
