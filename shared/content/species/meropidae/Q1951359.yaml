description:
  sv: ''
  en: '# Blue-cheeked Bee-eater


    The blue-cheeked bee-eater is a striking member of the bee-eater family, recognizable
    by its distinctive blue facial patches that give the species its name. This aerial
    insectivore is superbly adapted for catching flying insects, including bees and
    wasps, which it pursues with agile, darting flight.


    This species breeds across a broad range from eastern Turkey through the Middle
    East to Kazakhstan and India. It is highly migratory, with most populations wintering
    in tropical Africa, though some birds remain year-round residents in the Sahel
    region. The species occasionally appears as a rare vagrant beyond its normal range,
    with sightings most frequently reported in southern Europe, particularly Italy
    and Greece.'
migration:
  sv: ''
  en: '# Blue-cheeked Bee-eater in Northern Europe


    The Blue-cheeked Bee-eater is a rare vagrant to Scandinavia and Northern Europe,
    occurring only as an occasional stray north of its regular breeding range in North
    Africa and the Middle East. This strongly migratory species winters in tropical
    Africa, making any appearances in northern regions highly exceptional rather than
    part of an established migration pattern. Records in Northern Europe are exceptionally
    uncommon, with the species being far more likely to appear as a vagrant in Mediterranean
    regions such as Italy and Greece than in Scandinavian countries.'
