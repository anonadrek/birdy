description:
  sv: '# Sahelbiätare


    Sahelbiätare är en liten fågel i familjen biätare med gräsgrön färgtoning på fjädrarna.
    Det är en elegant insektätare som specialiserat sig på att jaga flygande insekter,
    särskilt bin och andra småflyg. Som medlem i biätarfamiljen har arten den typiska
    spetsiga näbb som är väl anpassad för denna jaktmetod.


    Arten livnär sig genom att fånga insekter i luften med snabba, smidiga rörelser.
    Det är en aktiv fågel som ofta ses från exponerade platser där det ger god överblick
    för jakten. Sahelbiätaren förekommer i öppna och halvöppna biotoper med låg vegetation.


    Arten urskildes tidigare från grön dvärgbiätare men anses allt oftare utgöra en
    egen art med sitt eget utbredningsområde. Som många biätare är det en migratorisk
    art som rör sig säsongsvis mellan olika regioner för att följa insekternas säsongsväxlingar.'
  en: '# African Green Bee-eater


    The African green bee-eater is a small, elegant member of the bee-eater family
    found across the arid Sahel region of Africa. Its striking appearance features
    predominantly green plumage that provides excellent camouflage in its semi-desert
    habitat. Like other bee-eaters, it is specially adapted for catching insects in
    flight, with a streamlined body and pointed wings that enable swift, agile aerial
    maneuvers.


    This species is highly specialized in hunting, as its name suggests, feeding primarily
    on bees and other flying insects which it catches with impressive precision during
    fast, darting flights. It typically hunts from exposed perches or while in flight,
    sallying out to snatch prey from the air. The bird''s behaviour is characteristic
    of bee-eaters: social and often seen in small groups or loose colonies.


    The African green bee-eater''s range spans the arid grasslands and semi-desert
    zones of the Sahel belt, where it inhabits open scrubland and sparse acacia woodland.
    Notably, the species has expanded its range northward over recent decades, now
    occurring in areas where it was previously absent, demonstrating adaptability
    to changing environmental conditions in its region.'
