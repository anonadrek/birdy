description:
  sv: ''
  en: '# Tawny Pipit


    The tawny pipit is a medium-large passerine that inhabits open, arid landscapes
    across a broad range spanning from northwest Africa through central Eurasia to
    Inner Mongolia. It is a long-distance migrant, departing its breeding grounds
    during winter to spend the season in tropical Africa and the Indian subcontinent,
    returning to breed in spring and summer months.


    This bird favors dry, sparsely vegetated habitats including steppe, semi-desert,
    and rocky hillsides where it forages on the ground for insects and small invertebrates.
    It is often seen walking on the ground with an upright posture, occasionally pausing
    to feed. When disturbed, it typically runs rather than flies immediately, though
    it will take to the air with a bounding flight pattern characteristic of pipits.


    The tawny pipit produces a distinctive call and song that aid in identification,
    though specific vocalizations are best learned through field experience or audio
    guides. Its plumage is relatively uniform and pale, adapted to blend with its
    arid surroundings, making it somewhat challenging to observe despite its preference
    for open terrain. Patience and careful scanning of suitable habitat are essential
    for successful sightings.'
migration:
  sv: ''
  en: '# Tawny Pipit in Scandinavia/Northern Europe


    The Tawny Pipit is a summer visitor to Scandinavia and northern Europe, arriving
    in late spring to breed in open, dry habitats during the warmer months. Breeding
    birds are present from approximately May through August. As a long-distance migrant,
    the species vacates Scandinavian breeding grounds in late summer and early autumn,
    with most individuals departing by September. The entire Scandinavian and northern
    European population migrates south to overwinter in tropical Africa and the Indian
    subcontinent, making it entirely absent from the region during winter months.'
