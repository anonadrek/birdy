description:
  sv: '# Trädpiplärka


    Trädpiplärkan är en liten, spenslig fågel som tillhör piplärksläktet. Den är grå-brun
    på ovansidan med mörka streck och vitaktig undersida. Fågeln är ungefär 15 centimeter
    lång och förhållandevis lätt att förväxla med andra piplärkor, men karakteriseras
    av sitt slangeligt byggde och ständiga rörlighet.


    Arten är väl anpassad till sitt habitat i skogsbryn och gläntor, där den ofta
    fångas på marken medan den söker föda. Trädpiplärkan är en migratorisk art som
    överväntrar långt söderut och återvänder till sina häckningsområden under våren.
    Det är en mycket vanlig fågel över större delen av sitt utbredningsområde, som
    sträcker sig från nästan hela Europa österut genom Asien till västra Kina och
    Himalaya. I Sverige räknas den bland de allra vanligaste fågelarterna.


    Arten är klassificerad som livskraftig av IUCN och visar ingen oroande populationstrend.
    Tack vare sitt stora utbredningsområde och stabila bestånd är dess bevarandestatus
    god.'
  en: '# Tree Pipit


    The tree pipit is a small passerine belonging to the pipit family, characterized
    by its slender build and brownish, streaked plumage adapted to grassland and open
    woodland habitats. It breeds across much of Europe and the Palearctic region,
    extending as far east as the East Siberian Mountains. This species is a remarkable
    long-distance migrant, undertaking an annual journey to winter grounds in Africa
    and southern Asia, returning to breeding territories each spring.


    Tree pipits inhabit open woodlands, heathlands, and grasslands where scattered
    trees provide suitable perching and nesting sites. The bird forages on the ground
    for insects and small invertebrates, often moving in a characteristic bounding
    manner. It is known for its distinctive display flight, ascending from a tree
    with accelerating song before parachuting back down on spread wings—a behavior
    typical of the genus. The call is a thin, sharp note, while the song is a melodious,
    accelerating warble delivered both from perches and during flight displays.


    The tree pipit''s scientific name reflects its ecological niche: *anthus* refers
    to a small grassland bird, while *trivialis* means "common," acknowledging its
    widespread distribution throughout suitable habitats across its breeding range.'
migration:
  sv: '# Trädpiplärka - Förekomst i Norden


    Trädpiplärkan är en sommargäst i Skandinavien och övriga Nordeuropa. Arten anländer
    till Sverige på våren, typiskt mellan april och maj, och etablerar sig i skogsbryn,
    gläntor och öppna skogsmarker över nästan hela landet. Under sommaren häckar arten
    vid riklig insekt­tillgång. I augusti och september påbörjas höstflyttningen då
    populationerna drar söderut. Fågeln övervintrar i Afrika söder om Sahara samt
    på Indiska halvön, vilket innebär att Skandinavien är helt tomt på arten under
    vinter­halvåret. Endast under migrations­perioderna på våren och hösten kan enstaka
    individer observeras utanför huvudförekomstområdena.'
  en: '# Tree Pipit Migration in Northern Europe


    The Tree Pipit is a long-distance migrant in Scandinavia and Northern Europe,
    breeding throughout the region during the summer months. Birds arrive in spring,
    typically from April onwards, after wintering in Africa and southern Asia. They
    establish territories in open woodlands, forest edges, and heathland habitats
    across the region.


    As autumn approaches, Tree Pipits begin their southward migration in late August
    and September, departing Northern Europe to reach their African and Asian wintering
    grounds. The species is entirely absent from Scandinavia during winter months,
    making it a true trans-Saharan migrant that undertakes one of the longest annual
    journeys of any European songbird.'
