description:
  sv: '# Kanariepiplärka


    Kanariepiplärka är en liten tätting som är endemit för två ögrupper i Atlanten.
    Det är en sober färgad fågel med gråbrun fjäderdräkt, vilket ger den utmärkt kamouflage
    i den steniga, torra miljön den bebor. Fågeln är grund- och medelstor bland piplärkorna.


    Beteendemässigt är kanariepiplärkan en typisk piplärka som gärna vistas på marken
    och rör sig genom att gå eller springa efter föda. Det är en återhållsam fågel
    som ofta ses i mindre grupper. Under häckningsperioden söker den föda på jordytan
    och mellan klippor.


    Arten förekommer uteslutande i Kanarieöarna och på Madeira, där den utgör den
    enda häckande piplärkan. Det gör den till en betydelsefull art för dessa öar ur
    ett ornitologiskt perspektiv. Arten är väl anpassad till de torra och steniga
    habitaten som präglar dessa ögrupper.'
  en: ''
