description:
  sv: ''
  en: '# African Pipit


    The African pipit is a small passerine belonging to the pipit genus Anthus within
    the Motacillidae family. Also called the grassveld or grassland pipit, it is a
    fairly inconspicuous bird that blends readily into its preferred habitat. It was
    formerly grouped with Richard''s, Australian, mountain, and paddyfield pipits
    as a single species, but is now recognized as a distinct species in its own right.


    The bird is adapted to open grassland and savanna environments, where its subtle
    plumage provides effective camouflage. Like other pipits, it is a ground-dwelling
    species that forages among grass and low vegetation. Its small size and cryptic
    coloration make it easy to overlook, though patient observation in appropriate
    habitats will reveal this characteristic member of the pipit family.'
