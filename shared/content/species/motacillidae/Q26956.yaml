description:
  sv: '# Ängspiplärka


    Ängspiplärka är en liten, spenslig fågel som tillhör piplärkornas släkte. Den
    är smal och långhalsad med ett tunnt, spetsigt näbb anpassat för att plocka små
    insekter. Fjäderdräkten är övervägande brunaktig med mörkare streckningar på rygg
    och flanker, vilket ger utmärkt kamouflage i gräsmarker och på öppen mark.


    Arten förekommer på ängsmarker, myrar och hedar från sydöstra Grönland genom Europa
    till västra Sibirien. Ängspiplärkan är en aktiv fågel som ofta ses på marken där
    den går omkring och söker föda. Den är känd för sitt karakteristiska ropande läte
    och sin sångaraktivitet, särskilt under häckningssäsongen. Ofta hörs den innan
    den ses.


    Merparten av populationen är flyttfåglar som drar söderut på hösten mot södra
    Europa, norra Afrika och sydvästra Asien. I västra Europas kusttrakter förekommer
    dock stannfåglar som stannar året om. Arten återvänder till sina häckningsområden
    på våren för att bygga bon på marken.'
  en: '# Meadow Pipit


    The meadow pipit is a small passerine bird with streaked brown and buff plumage
    that provides excellent camouflage in grassland habitats. It is a slender, delicate-looking
    species with thin legs and a fine, pointed bill adapted for picking insects from
    vegetation and soil.


    This highly migratory species breeds across much of the northern Palearctic, from
    Greenland and Iceland eastward to the Urals, and southward to central France and
    Romania, with an isolated population in the Caucasus. It is restless and active,
    often seen running through short grass or making short, jerky flights low over
    the ground with its characteristic weak, undulating flight pattern.


    The meadow pipit winters in southern Europe, North Africa, and south-western Asia,
    though populations in western Europe are largely resident, shifting to coastal
    and lowland areas during winter months. It frequents open grassland, moorland,
    and rough fields where it hunts for insects and small invertebrates. Its thin,
    high-pitched call and simple song are characteristic sounds of upland and open
    country during the breeding season.'
migration:
  sv: '# Ängspiplärka – Förekomst i Skandinavien och Nordeuropa


    Ängspiplärkan är en häckfågel i Skandinavien och Nordeuropa under vår och sommar.
    Arten anländer vanligtvis i april och stannar fram till september. Merparten av
    populationen är flyttfågel och övervintra i södra Europa, norra Afrika och sydvästra
    Asien. Dock förekommer stannfåglar längs västra Europas kusttrakter där klimatet
    är mildare, vilket möjliggör ganzårsbosättning. Efter häckningen börjar huvuddelen
    av populationen sin höstflyttning under senhösten för att undvika de hårda nordiska
    vinterklimatens mat- och klimatbrist.'
  en: '# Meadow Pipit (Anthus pratensis) in Northern Europe


    The Meadow Pipit is a migratory species across most of Scandinavia and northern
    Europe, though populations show regional variation. Birds breeding in eastern
    and central regions migrate south in autumn, wintering in southern Europe, North
    Africa, and southwestern Asia. However, western European populations, including
    some Scandinavian birds, are partially resident year-round, with many shifting
    to coastal areas and lowlands during winter months rather than undertaking long-distance
    migration. Spring arrival typically occurs in March-April as breeding season approaches.'
