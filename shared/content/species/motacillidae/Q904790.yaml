description:
  sv: '# Större piplärka


    Större piplärka är en medelstor piplärka med spenslig gestalt och långt svans.
    Den har brun och gråvittig fjäderdräkt med mörkare streckningar på ryggen, vilket
    ger den en välkamouflagerad utseende. Fågeln är ofta svår att särskilja från närbesläktade
    arter.


    Större piplärka förekommer i öppna, gräsbevuxna landskap och stäpper. Det är en
    markhäckande fågel som ofta hittas på jorden eller på låg vegetation. Under häckningstiden
    är den aktiv och rastlös, och flyger gärna långt när den skrämms upp.


    Arten häckar i södra Sibirien, Mongoliet, Centralasien och Kina. Merparten av
    populationen är flyttfågel och övervintra i söder och sydostra Asien. En mindre
    del vandrar västerut under höstflyttningen och förekommer då sparsamt men regelbundet
    i stora delar av Europa, inklusive nordvästra regioner. Arten klassificeras som
    livskraftig av IUCN.'
  en: ''
migration:
  sv: '# Större piplärka i Skandinavien och Nordeuropa


    Större piplärka är en långdistansflyttare som huvudsakligen häckar i södra Sibirien,
    Mongoliet och delar av Centralasien. Under vintern migrera de flesta populationen
    till Syd- och Sydostasien. En mindre andel av arten tar dock en västlig väg under
    flyttningen och når regelbundet, men sparsamt, fram till Portugal och övriga Europa.
    I Skandinavien och Nordeuropa förekommer arten således endast irregelbundet under
    flyttningsperioderna, primärt under höst och vår. Dessa västvandrare observeras
    då sporadiskt men regelbundet i olika delar av Europa under sin migration mellan
    häckningsområdena och övervintringskvarteren i söder.'
  en: ''
