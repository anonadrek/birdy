description:
  sv: ''
  en: '# Long-billed Pipit


    The long-billed pipit is a widespread passerine found across Africa, the Arabian
    Peninsula, and South Asia. Several subspecies are recognized across its range,
    though the taxonomy of this group remains incompletely understood. It is also
    known as the brown rock pipit, reflecting its coloration and habitat preferences.


    Most populations are sedentary or undertake only short-distance movements rather
    than undertaking long migrations. This pattern allows it to remain within familiar
    territories throughout much of the year, taking advantage of local food resources
    and established breeding sites. The species shows considerable adaptability across
    its extensive range, suggesting it is well-suited to various environmental conditions
    found throughout Africa and southern Asia.'
migration:
  sv: ''
  en: '# Long-billed Pipit in Northern Europe


    Migration data unavailable for this species.


    The Long-billed Pipit''s distribution is primarily centered in Africa, the Arabian
    Peninsula, and South Asia. While the species is described as consisting of mostly
    resident or short-distance migrant populations, there is no documented occurrence
    or migration pattern in Scandinavia or Northern Europe. This species does not
    form part of the regular avifauna of the region.'
