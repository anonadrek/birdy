description:
  sv: '# Sibirisk piplärka


    Sibirisk piplärka är en liten tätting som tillhör familjen ärlor och piplärkor.
    Den är mycket lik trädpiplärkan och närstäld med denna art. Arten kännetecknas
    av sitt olivbruna yttre, vilket även återspeglas i dess engelska namn Olive-backed
    Pipit.


    Arten häckar i Sibirien, nordöstligaste Europa samt i bergstrakter i södra och
    västra Asien, däribland Himalaya, Kina och Japan. Under vintermånaderna är fågeln
    flyttfågel som söker sig till södra och sydöstra Asien, från Indien till Indonesien
    för att övervintra.


    I Europa påträffas sibirisk piplärka endast sällsynt men regelbundet. I Sverige
    är den en årlig gäst, främst under flyttningsperioderna. Internationella naturvårdsunionen
    IUCN klassificerar arten som livskraftig, vilket indikerar att den inte är hotad.'
  en: '# Olive-backed Pipit


    The olive-backed pipit is a small passerine with distinctive plumage that sets
    it apart from related species. Its most notable feature is an olive-toned back
    with minimal streaking, contrasting with the browner, more heavily streaked appearance
    of the similar tree pipit. The head pattern includes a well-marked supercilium
    (eyebrow stripe) that is particularly prominent, giving the bird a characteristic
    facial expression.


    This is a long-distance migrant with a wide breeding range across southern, north-central,
    and eastern Asia, extending into north-eastern European Russia. During winter
    months, it relocates to southern Asia and Indonesia in search of food and suitable
    habitat. Like other pipits, it is an active forager, typically found on the ground
    or in low vegetation where it hunts for insects and small invertebrates.


    The olive-backed pipit''s call and song are typical of the genus, though details
    of its vocalizations are less distinctive than its visual characteristics. It
    occupies open and semi-open habitats during both breeding and wintering seasons,
    preferring areas with short grass and scattered scrub vegetation. Its migratory
    habits and preference for lower elevations make it a seasonal visitor to many
    regions within its range.'
migration:
  sv: '# Sibirisk piplärka i Norden


    Sibirisk piplärka är en regelbunden men sällsynt gäst i Skandinavien och övriga
    Europa. Arten häckar i Sibirien och nordöstligaste Europa, men flyttar på hösten
    till söder. Under höstflyttningen påträffas den årligen i Sverige och andra nordeuropeiska
    länder, där den syns företrädesvis under sensommar och höst. Arten övervintringar
    inte i Norden utan drar vidare till södra och sydöstra Asien, från Indien till
    Indonesien. På våren återvänder fåglarna till sina häckningsområden i öst.'
  en: '# Olive-backed Pipit (Anthus hodgsoni) in Northern Europe


    The Olive-backed Pipit is a rare vagrant to Scandinavia and Northern Europe rather
    than a regular migrant. While the species breeds in northeastern European Russia
    and is a long-distance migrant between its Asian breeding grounds and wintering
    areas in southern Asia and Indonesia, it only occasionally reaches Scandinavian
    regions during migration periods. Most records from Northern Europe represent
    vagrants that have dispersed beyond their normal migration routes. When encountered
    in the region, they typically appear during spring or autumn migration, though
    such sightings remain uncommon.'
