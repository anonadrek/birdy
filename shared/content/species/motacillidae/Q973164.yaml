description:
  sv: '# Mongolpiplärka


    Mongolpiplärka är en asiatisk piplärka som häckar i bergiga områden från Altaj
    österut till nordöstra Kina. Under vintern migrera den till Indien. I Europa är
    arten extremt sällsynt och påträffas endast tillfälligt, med endast omkring 20
    dokumenterade fynd i Sverige.


    Som medlem av familjen ärlor och piplärkor är mongolpiplärkan en liten, slank
    fågel väl anpassad för sitt livsrum i öppna berglandskap. Arten är idag klassificerad
    som livskraftig enligt IUCN.'
  en: ''
migration:
  sv: '# Mongolpiplärka – Förekomst i Skandinavien/Nordeuropa


    Mongolpiplärka är en mycket sällsynt besökare i Skandinavien och Nordeuropa. Arten
    häckar normalt långt bort i östra Asien och förekommer endast tillfälligt och
    ytterst sällsynt i denna region. I Sverige finns bara ett knappt 20-tal registrerade
    fynd. Arten påträffas här således inte regelbundet eller enligt någon förutsägbar
    säsongsmönster, utan utgör snarare slumpmässiga vagabonder långt från sitt normale
    utbredningsområde. För denna art finns därför ingen etablerad migrations- eller
    övervintringsmönster i Skandinavien.'
  en: ''
