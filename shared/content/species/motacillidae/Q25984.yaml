description:
  sv: '# Gulärla


    Gulärla är en liten tätting från familjen ärlor som häckar över stora delar av
    de tempererade områdena. Den är en mycket variabel art med många underarter, vilket
    gör den systematiska klassificeringen komplicerad. Utseendemässigt påminner den
    om sädesärlan och kännetecknas av en övervägande gul undersida och en olivfärgad
    till grå ovansida. Hanen har en mer kontrasterande fjäderdräkt än honan, vars
    färger är mattare och mindre påtagliga. En särskilt markant skillnad mellan underarterna
    är teckningarna på huvudet, vilket kan göra identifiering utmanande.


    Gulärlan är en aktiv och återlös fågel som rör sig likt sädesärlan. Den förekommer
    i öppna habitat där den forages på marken efter insekter. Arten är en långstracksflyttare
    som uppsöker häckningsområden efter att ha övervintrat på andra kontinenter. Under
    flyttningen kan den ibland iakttas på oväntade platser under genomflyttning.'
  en: '# Western Yellow Wagtail


    The western yellow wagtail is a small passerine in the Motacillidae family, characterized
    by its slender build typical of wagtails. It displays yellow underparts that give
    it its common name, with considerable variation in head and back patterns across
    different populations and seasons.


    This species is highly migratory across much of its range, breeding throughout
    temperate regions of Europe and Asia during the breeding season. Most populations
    undertake long-distance migrations southward to spend winter in tropical Africa
    and southern Asia, following seasonal food availability. A notable exception exists
    in Egypt, where a small resident population remains year-round.


    The western yellow wagtail favors open habitats, often found in grasslands, agricultural
    areas, and wetland margins where it forages for insects. It is characteristically
    active and restless, frequently bobbing its tail and moving across the ground
    in search of food. Its presence often signals the arrival of warmer months in
    its breeding range, making it a welcome herald of spring.'
migration:
  sv: '# Gulärla (Motacilla flava) – Migration i Nordeuropa


    Migrationsdata saknas för denna art.'
  en: '# Western Yellow Wagtail in Scandinavia/Northern Europe


    The Western Yellow Wagtail is a summer breeding visitor to Scandinavia and Northern
    Europe, arriving in late spring to breed across temperate regions. Most populations
    are highly migratory, with birds departing in late summer and autumn to spend
    the winter in tropical Africa and southern Asia. The species is absent during
    winter months, returning to breeding grounds in April and May. The breeding season
    spans late spring through summer, after which birds undertake their southward
    migration before the onset of winter, making this a strongly migratory species
    throughout its Scandinavian range.'
