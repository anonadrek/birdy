description:
  sv: '# Korp


    Korpen är en stor, helt svart kråkfågel och den mest utbredda av alla medlemmar
    i familjen Corvidae. Det återfinns på större delen av norra halvklotet och förekommer
    i många olika underarter, vilka visar liten visuell variation men betydande genetiska
    skillnader.


    Med sin imponerade storlek och helt svarta fjäderdräkt är korpen en karakteristisk
    fågel. Det är en intelligent och allätande fågel som är anpassad till många olika
    miljöer, från bergiga områden till skogar och kustremsor. Korpen är känd för sitt
    intelligenta beteende och förmåga att lösa problem, och det är ofta ses solit
    eller i små grupper.


    Korpen är en imponerande flygare med kraftfulla vingslag och kan ofta ses glida
    högt i luften. Det är en långlivad fågel som kan uppnå betydande ålder i naturen.
    Arten spelar en viktig roll i sitt ekosystem som både rovfågel och skallfågel.'
  en: '# Northern Raven


    The Northern Raven is a magnificent all-black passerine and the heaviest of all
    songbirds, weighing up to 2 kilograms and measuring around 63 centimetres in length.
    It holds the distinction of being the most widely distributed corvid across the
    Northern Hemisphere, with 11 recognized subspecies showing relatively consistent
    appearance despite significant genetic variation between populations. This large,
    robust bird is one of only two corvids that rival it in size.


    Behaviourally, Northern Ravens are highly social in their youth, often travelling
    in flocks, but mature birds form lasting pair bonds. Mated couples establish and
    actively defend territories throughout the year. The species is notably long-lived
    for a passerine, with individuals documented surviving over 23 years in the wild,
    though their average lifespan is considerably shorter.


    Its all-black plumage, substantial build, and powerful presence make the Northern
    Raven unmistakable in the field. The bird''s intelligence and adaptability have
    allowed it to thrive across diverse habitats throughout the Northern Hemisphere,
    from urban areas to remote wilderness regions.'
migration:
  sv: '# Korp (Corvus corax) – Förekomst i Skandinavien/Nordeuropa


    Korpen är en permanent bosatt art i Skandinavien och Nordeuropa under större delen
    av året. Den återfinns året runt i regionen, där den är en icke-flyttande eller
    endast partiellt flyttande population. Under de kallaste vintermånaderna kan vissa
    individer från nordligare populationer förflytta sig söderut för att söka föda,
    men huvuddelen av populationen förblir i sitt hemområde genom hela året. Korpen
    är väl anpassad för kallt klimat och kan övervintras framgångsrikt i norra områden,
    där den lever på ben, offrade eller döda djur samt människans matavfall.'
