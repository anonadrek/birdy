description:
  sv: ''
  en: '# Red-billed Chough


    The red-billed chough is a striking member of the crow family, distinguished by
    its glossy black plumage contrasted with bright red bill and legs. It is a relatively
    compact corvid, smaller than most of its relatives, with an elegant silhouette
    in flight. The bird''s acrobatic aerial displays are remarkable, featuring steep
    dives and rolls that showcase its mastery of mountain air currents.


    This species favors mountainous and coastal cliff terrain, where it forages for
    insects, small invertebrates, and seeds among rocky ground. It is highly social,
    often seen in small groups that wheel and tumble through the air with apparent
    ease. The red-billed chough produces a distinctive loud, ringing call—a sharp
    "chow" or "chough" from which its common name derives.


    The species has a wide but discontinuous range across Eurasia, from western Atlantic
    coasts eastward through southern regions to Central Asia and East Asia. Eight
    recognized subspecies inhabit this vast range, each adapted to their particular
    mountain and cliff habitats. Once more widespread, it now occupies scattered populations,
    making it a prized sighting for birdwatchers in regions where it occurs.'
migration:
  sv: ''
  en: '# Red-billed Chough in Northern Europe


    The Red-billed Chough is not a regular resident of Scandinavia or Northern Europe.
    Its range extends from western Ireland and Britain eastward through southern Europe,
    with no established populations occurring in Scandinavian countries. While vagrant
    individuals may occasionally appear in northern regions during dispersal or unusual
    weather conditions, the species does not have predictable migration patterns to
    or through Northern Europe. The chough remains primarily restricted to its southern
    and western European breeding range throughout the year, with populations showing
    local movements rather than long-distance migration.'
