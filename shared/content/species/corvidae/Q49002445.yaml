description:
  sv: ''
  en: '# Maghreb Magpie


    The Maghreb magpie is a striking corvid that inhabits North Africa across a wide
    range of elevations, from coastal regions to mountain areas. It shares the characteristic
    black-and-white plumage of other magpies but can be reliably distinguished by
    several distinctive features: a patch of bare blue skin behind the eye, a narrower
    white belly stripe, proportionally shorter wings, and a notably longer tail compared
    to its Eurasian relative.


    This species occupies diverse habitats throughout its range, from lowland areas
    to mountainous terrain at altitudes exceeding 2,300 metres. Like other magpies,
    it is likely an intelligent and adaptable bird, though detailed behavioral information
    specific to this species remains limited in general literature. It shares the
    corvid family''s reputation for intelligence and social behavior.


    The Maghreb magpie represents an important North African endemic, with its range
    extending across multiple countries in the region. Its adaptation to such varied
    elevations suggests ecological flexibility, allowing it to thrive in both Mediterranean
    and higher-altitude environments throughout its distribution.'
