description:
  sv: '# Asirskata


    Asirskata är en starkt utrotningshotad tätting i familjen kråkfåglar. Den betraktades
    tidigare som en underart till skatan men räknas numera som egen art. Arten förekommer
    enbart isolerat i ett begränsat bergsområde och är därför mycket sårbar för miljöförändringar.


    Asirskata är en relativt liten medlem av kråkfågelfamiljen. Precis som många andra
    skatartade har den troligen en svartvit eller mörkfärgad fjäderdräkt, men detaljerade
    beskrivningar av dess utseende är begränsade. Arten är mycket sparsamt dokumenterad
    i naturvårdslitteraturen, vilket reflekterar dess isolerade utbredning och små
    population.


    På grund av sitt mycket begränsade utbredningsområde och små bestånd klassificeras
    Asirskata som starkt utrotningshotad. Arten är därför föremål för internationell
    naturvård och forskning för att säkra dess överlevnad.'
  en: '# Asir Magpie


    The Asir magpie is a critically endangered corvid endemic to the southwestern
    highlands of Saudi Arabia, where it inhabits African juniper forests within well-vegetated
    wadis and valleys. Once classified as a subspecies of the Eurasian magpie, it
    is now recognized as a distinct species by most authorities, though taxonomic
    debate continues. It shares the characteristic features typical of magpies, with
    striking black and white plumage.


    This highly threatened species faces severe habitat destruction as its native
    forests fail to regenerate naturally. Tourism development and climate change compound
    these pressures, pushing the species toward extinction. Currently, fewer than
    135 breeding pairs remain in the wild, and population numbers continue to decline.
    The bird''s restricted range and dependence on specific forest habitats make it
    particularly vulnerable to environmental changes. Conservation efforts are crucial
    to prevent the loss of this unique Arabian endemic, as it exists nowhere else
    in the world and represents an irreplaceable part of the region''s avifauna.'
