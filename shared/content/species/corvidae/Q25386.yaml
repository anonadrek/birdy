description:
  sv: '# Råka


    Råkan är en större kråkfågel med en karakteristisk lång, spetsig näbb som är
    svagt nedåtböjd. Det mest utmärkande kännetecknet är det ljusa, nakna hudpartiet
    vid näbbasen, vilket framstår tydligt mot fjäderdräkten. Fjädrarna är metalliskt
    glänsande och helt svarta, vilket ger fågeln ett elegant utseende.


    Råkan förekommer i stora delar av den palearktiska regionen och har även introducerats
    på Nya Zeeland. Den är en social fågel som ofta ses i flockar, särskilt utanför
    häckningssäsongen. Som medlem av kråksläktet är den en intelligent och anpassningsbar
    art.'
  en: ''
migration:
  sv: '# Råka - Utbredning och Migration i Norden


    Råkan är en partiell migrant i Skandinavien och Nordeuropa. Under sommaren häckar
    arten utbrett över större delen av regionen, men populationerna i norr drar sig
    söderut under hösten. Många råkor från Sverige och Norge övervintrarar i Centraleuropa
    och Sydeuropa, medan andra stannar kvar under mildare vintrar. Återkomsten till
    häckningsområdena sker vanligtvis från mars till april då förhållandena förbättras.


    I södra Skandinavien förekommer råkan mera regelbundet året runt, särskilt där
    vinterklimat är mildare. Ankomsten till häckningsplatserna i norr påbörjas typiskt
    från slutet av mars, med toppen under april. Arten är känd för att bilda större
    flockar under flyttperioderna och på övervintringsplatserna.'
  en: ''
