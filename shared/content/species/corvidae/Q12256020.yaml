description:
  sv: '# Iberisk blåskata


    Iberisk blåskata är en medlem av kråkfågelfamiljen som är endemisk för Iberiska
    halvön. Arten betraktades tidigare som samma art som den östasiatiska östlig blåskata,
    men klassificeras nu som en egen art.


    Arten har det karakteristiska blåa och vita fjäderdräkten som är typiskt för blåskator.
    Det är en medelstor fågel med långt svans och markant färgteckning. Beteendemässigt
    är den social och ses ofta i mindre flockar, särskilt under icke-häckningssäsongen.
    Arten förekommer främst i öppen och halvöppen miljö.


    Denna fågel är anpassad till sin specifika geografiska miljö på Iberiska halvön
    och representerar ett exempel på artbildning bland tidigare sammanslagna populationer.'
  en: '# Iberian Magpie


    The Iberian magpie is a corvid measuring 31–35 cm in length, making it comparable
    to the Eurasian magpie in overall size and shape. However, it is noticeably slenderer
    with proportionately smaller legs and bill than its more widespread relative.
    It belongs to the genus Cyanopica, which contains several Asian species.


    This bird inhabits specific regions within southwestern Europe, where it favours
    open woodland and scrubland habitats. Like other magpies, it is likely to be an
    opportunistic feeder and socially gregarious, though specific details about its
    behaviour and vocalizations would benefit from additional observation and study.


    The species represents an interesting isolated population within Europe, separated
    from its Asiatic relatives, making it of particular interest to ornithologists
    studying biogeography and the evolution of corvid populations.'
