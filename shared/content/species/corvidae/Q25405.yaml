description:
  sv: '# Gråkråka


    Gråkråkan är en stor kråkfågel som kännetecknas av sin karakteristiska grå och
    svarta färgteckning. Huvudet, halsen, vingarna och svansen är svarta, medan ryggen,
    bröstet och buken är gråa. Det är en robust fågel med kraftig näbb och intelligent
    uppsyn.


    Arten är mycket anpassningsbar och förekommer i ett brett spektrum av miljöer,
    från städer och jordbruksmark till skogar och fjällbygd. Gråkråkan är intelligent
    och framåtsträvande, ofta observerad när den äter från innehållsrikt område eller
    söker föda på marken. Den är mycket social och ses ofta i smågrupper eller större
    flockningar, särskilt under höst och vinter.


    Arten är högljudd med ett karakteristiskt "kra-kra-kra"-läte som är grovt och
    raspigt. Det använder också andra läten för kommunikation med artfränder. Gråkråkan
    är en smart fågel som lätt anpassar sig till människans närhet och kan observeras
    året runt i många regioner.'
  en: '# Hooded Crow


    The hooded crow is a distinctive corvid with striking plumage that makes it instantly
    recognizable. Its ashy-grey body contrasts sharply with its black head, throat,
    wings, tail, and thigh feathers, while the bill, eyes, and feet are also black.
    This striking two-tone coloration distinguishes it from the all-black carrion
    crow.


    Like other members of the crow family, the hooded crow is highly adaptable and
    omnivorous, opportunistically foraging for whatever food sources are available.
    It exploits a wide range of habitats and feeding opportunities, from urban areas
    to open countryside. The species is vocal and intelligent, displaying the problem-solving
    abilities characteristic of corvids.


    The hooded crow is widely distributed across northern, eastern, and southeastern
    regions of Europe, as well as parts of the Middle East. It thrives in varied environments,
    making it a common sight throughout much of its range. Its combination of bold
    plumage, adaptability, and intelligence makes it a fascinating subject for bird
    observation.'
migration:
  sv: '# Gråkråka - Förekomst i Norden


    Gråkråka är en årlig fågel i Skandinavien och Nordeuropa. Arten är främst stationär
    eller delvandring i området, med populationer som övervintringar på flera platser.
    Under hösten ankommer några individer från östligare regioner, medan inhemska
    fåglar kan förflytta sig sydväst. Arten ses året om i sitt utbredningsområde,
    särskilt i kustnära och öppna habitat. Övervintringsbestånden består ofta av både
    lokala fåglar och invandrare från öster, vilka förstärker populationen under kallare
    perioder. Våren märks en påtaglig återvändande av nordligare häckande fåglar.'
  en: '# Hooded Crow (Corvus cornix) in Scandinavia


    The Hooded Crow is a year-round resident throughout much of Scandinavia and Northern
    Europe, with populations showing varying degrees of migratory behavior depending
    on latitude and winter severity. In southern Scandinavia, birds are largely sedentary,
    remaining in their territories throughout winter. However, northern populations
    may undertake partial migrations, with some individuals moving southwestward during
    harsh winter conditions. Spring arrival of migratory birds typically occurs from
    March onwards, while autumn dispersal begins in September and October.


    Migration data unavailable for this species.'
