description:
  sv: '# Kortstjärtad korp


    Kortstjärtad korp är en medlem av kråkfåglarnas familj och förekommer i Mellanöstern
    samt i Afrika söder om Sahara, från Mali till Kenya. Arten är anpassad till de
    halva och torra miljöer som finns inom sitt utbredningsområde.


    Det är en medelstor korp med karakteristisk kort stjärt, vilket gett arten sitt
    namn. För att lära känna arten bör man främst fokusera på denna särskiljande stjärtform,
    som skiljer den från andra korparter i området. Arten är anpassad till liv i öppen
    eller halvöppen terräng.


    Kortstjärtad korp förekommer i lämpliga habitat inom sitt omfattande afrikanska
    och mellanöstligt område, där den lever i anpassning till dessa torka- eller halvtorra
    regioner.'
  en: ''
migration:
  sv: 'Migrationsdata saknas för denna art.


    Kortstjärtad korp är en afrikansk och mellanöstlig art som inte förekommer naturligt
    i Skandinavien eller Nordeuropa. Arten är stationär inom sitt utbredningsområde
    i Afrika och Mellanöstern, men finns inte bland de fåglar som normalt observeras
    i norra Europa under året.'
  en: ''
