description:
  sv: ''
  en: '# Brown-necked Raven


    The brown-necked raven is a large corvid, intermediate in size between the carrion
    crow and common raven. It shares the common raven''s overall proportions but has
    a noticeably smaller, less deep bill and more pointed wings. The defining feature
    is its distinctive brownish-black head and throat, contrasting with glossy black
    plumage on the body that shows purple and blue iridescence. The bird''s appearance
    changes notably with age and wear—feathers fade to brownish-black relatively quickly,
    sometimes making older individuals appear predominantly brown before moulting.
    It has black feet, legs, and bill.


    This species inhabits arid and semi-arid regions across North Africa and the Middle
    East, where it occupies similar ecological niches to other large ravens. Like
    its relatives, it is an adaptable omnivore, feeding on carrion, insects, small
    animals, and plant material. It is typically encountered as a solitary bird or
    in small groups, though occasionally larger gatherings form.


    The brown-necked raven''s vocalizations resemble those of the common raven—deep,
    resonant calls and croaks that carry across open terrain. It is often seen in
    flight, displaying strong, direct wingbeats characteristic of large ravens, soaring
    at considerable heights.'
