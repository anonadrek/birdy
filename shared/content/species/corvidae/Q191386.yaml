description:
  sv: '# Alpkaja


    Alpkaja är en bergslevande medlem av kråkfågelfamiljen som förekommer på europeiska
    kontinenten och långt österut till Indien. Det är en anpassad höghöjdsfågel som
    trivas i bergsmiljöer och har klassificerats som livskraftig av IUCN, vilket tyder
    på en stabil populationsstatus.


    Arten är en karakteristisk bergsbo som är väl anpassad för livet på höga höjder
    där få andra fåglar kan överleva. Den återfinns i alpina och subalpina regioner
    där dess närvaro ofta är ett tecken på bergiga terräng och höga altitude. Även
    om denna kort beskrivning baseras på begränsad information, bekräftar statusen
    att arten fortsatt förekommer genom sitt naturliga utbredningsområde.'
  en: '# Alpine Chough


    The Alpine chough is a striking member of the crow family, distinguished by its
    glossy black plumage, bright yellow beak, and yellow legs. This remarkable bird
    inhabits some of the world''s highest mountain ranges, breeding at altitudes that
    exceed those of virtually any other bird species. Its eggs have evolved special
    adaptations to cope with the thin mountain air, featuring enhanced oxygen uptake
    and reduced water loss—crucial physiological features for surviving in extreme
    environments.


    Alpine choughs are found across high-altitude regions from Spain through southern
    Europe and North Africa to Central Asia and Nepal, where they form small flocks.
    They are highly adapted to their harsh alpine habitat, foraging on rocky slopes
    and peaks for seeds, insects, and organic matter. These agile birds are often
    seen performing acrobatic flight displays among the mountain peaks, using air
    currents with remarkable skill.


    The species belongs to the genus Pyrrhocorax, which contains only two species.
    Its presence at extreme altitudes makes it a symbol of adaptation to one of Earth''s
    most challenging environments, where few other birds can successfully breed and
    raise young.'
migration:
