  en: '# Alpine Chough in Scandinavia/Northern Europe


    Migration data unavailable for this species.


    The Alpine Chough is a high-mountain specialist breeding across southern Europe,
    North Africa, and Central Asia, with no regular occurrence in Scandinavia or Northern
    Europe. The species'' distribution is restricted to alpine regions south of the
    Scandinavian peninsula, and it does not form part of the region''s avifauna during
    any season.'
