description:
  sv: '# Stornäbbad kråka


    Stornäbbad kråka är en stor asiatisk fågel som tillhör kråkfåglarnas familj. Den
    kännetecknas av sitt stora, kraftigt utformat näbb, vilket är dess mest framträdande
    karaktäristik. Fågeln är helt svart eller mörkgrå till färgen och liknar andra
    större kråkfåglar, men näbben är märkligt större och kraftigare.


    Arten är vida spridd över stora delar av Asien och förekommer i varierande habitat,
    från tätbebyggda områden till mer öppna landskap. Det är en allmän fågel inom
    sitt utbredningsområde. Arten är socialt lagd och ses ofta i mindre flockar, särskilt
    utanför häckningstiden.


    Taxonomin för arten är komplex och fortfarande omdiskuterad bland ornitologer.
    Det finns indikationer på att det som betecknas som stornäbbad kråka faktiskt
    utgör ett komplex av flera närbesläktade arter snarare än en enda enhetlig art.'
  en: '# Large-billed Crow


    The large-billed crow is a widespread Asian corvid characterized by its notably
    large, heavy bill—the feature from which both its scientific name and common names
    derive. Its substantial bill may cause confusion with the larger common raven,
    though the crow is a distinctly smaller bird overall. It is entirely black in
    plumage, presenting a sleek appearance typical of the crow family.


    This species demonstrates remarkable adaptability, thriving on a diverse diet
    and successfully colonizing a wide range of habitats and environments. Its dietary
    flexibility and ability to exploit new territories have enabled rapid range expansion,
    though this success has made it a nuisance species in many areas, particularly
    on islands where introduced populations can become problematic.


    The large-billed crow inhabits various Asian regions and favors environments ranging
    from urban and cultivated areas to more open landscapes. It is a highly social
    bird, often seen in small flocks or larger gatherings. While the source material
    does not provide specific details about its calls or behavior beyond its feeding
    adaptability, its intelligence and problem-solving abilities are consistent with
    other corvid species, allowing it to thrive in increasingly human-modified landscapes.'
