org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
# Konan per-library compiler caches crash (ClassCastException IrCallImpl->IrConst) when
# building caches for Compose Multiplatform 1.7.3 klibs under Kotlin 2.1.20
# (first hit: :composeApp:linkDebugFrameworkIosSimulatorArm64 on foundation-uikitsimarm64).
# Workaround recommended by the compiler itself; only affects Kotlin/Native link speed.
kotlin.native.cacheKind=none

android.useAndroidX=true
android.nonTransitiveRClass=true

# Google Play Billing v8 — paste from Play Console → Monetization Setup → Licensing public key
# Local-only; never commit actual key value.
BIRDY_PLAY_LICENSE_KEY=

# MapTiler raster-tile key — https://cloud.maptiler.com/account/keys/ . Local-only; do not commit a real value.
MAPTILER_API_KEY=
