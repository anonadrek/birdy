org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
# NOTE: Compose Multiplatform 1.7.3 klibs crashed konan per-library cache builds under
# Kotlin 2.1.20 (ClassCastException IrCallImpl->IrConst at :composeApp:linkDebugFrameworkIosSimulatorArm64).
# Fixed by the CMP 1.8.2 bump (verified 2026-07-11: cold cache build + fresh link green).
# If the crash ever returns, the workaround was: kotlin.native.cacheKind=none

android.useAndroidX=true
android.nonTransitiveRClass=true

# Google Play Billing v8 — paste from Play Console → Monetization Setup → Licensing public key
# Local-only; never commit actual key value.
BIRDY_PLAY_LICENSE_KEY=

# MapTiler raster-tile key — https://cloud.maptiler.com/account/keys/ . Local-only; do not commit a real value.
MAPTILER_API_KEY=
