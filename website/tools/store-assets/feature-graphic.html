<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Play Store feature graphic, 1024x500. Same design system as the 8 screenshot
     cards (template.html): paper + dot texture + copper corner brackets +
     DM Serif headline with a Caveat copper accent + framed phone. */
  :root{ --paper:#EFE7D6; --ink:#2A3520; --moss:#3F4F30; --copper:#A8552D; }
  *{ margin:0; box-sizing:border-box; }
  html,body{ background:transparent; }
  #fg{ position:relative; width:1024px; height:500px; background:var(--paper); overflow:hidden;
    background-image:radial-gradient(rgba(63,79,48,.05) 3px, transparent 3px); background-size:42px 42px;
    display:flex; align-items:center; font-synthesis:none; }
  /* copper corner brackets, mirror the card template */
  #fg::before,#fg::after{ content:''; position:absolute; width:82px; height:82px; border:6px solid var(--copper); z-index:4; }
  #fg::before{ top:30px; left:30px; border-right:0; border-bottom:0; }
  #fg::after{ bottom:30px; right:30px; border-left:0; border-top:0; }
  .warm{ position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(125% 100% at 17% 14%, rgba(255,255,255,.24), rgba(255,255,255,0) 56%, rgba(0,0,0,.06)); }
  .left{ position:relative; z-index:3; width:600px; height:100%; padding:0 0 0 80px;
    display:flex; flex-direction:column; justify-content:center; }
  .wordmark{ font-family:'Caveat'; font-weight:700; font-size:52px; color:var(--copper); line-height:1; }
  .eyebrow{ font-family:Inter; font-weight:700; font-size:18px; letter-spacing:4px; color:var(--moss);
    text-transform:uppercase; margin-top:8px; white-space:nowrap; }
  .hl{ font-family:'DM Serif Display'; font-size:55px; line-height:1.02; color:var(--ink); margin:22px 0 0; }
  .hl em{ display:block; font-family:'Caveat'; font-style:normal; font-weight:700; color:var(--copper);
    font-size:100px; line-height:0.84; margin-top:6px; }
  .body{ font-family:'Caveat'; font-weight:600; font-size:37px; color:var(--moss); line-height:1.12; margin-top:26px; max-width:460px; }
  /* framed phone on the right, gently tilted */
  .right{ position:absolute; right:70px; top:50%; transform:translateY(-50%) rotate(-4deg); z-index:5; }
  #screen{ width:220px; height:390px; background-size:cover; background-position:center top;
    border:11px solid #fff; border-radius:40px; box-shadow:0 38px 66px rgba(42,53,37,.30); }
</style>
</head>
<body>
  <div id="fg">
    <div class="warm"></div>
    <div class="left">
      <div class="wordmark">Birdy.</div>
      <div class="eyebrow">On-device &middot; 839 species &middot; Private</div>
      <div class="hl">Spot it. Learn it.<em>Keep it.</em></div>
      <div class="body">Identify by camera or song &mdash; and keep every find as a page you own.</div>
    </div>
    <div class="right"><div id="screen"></div></div>
  </div>
<script>
  window.setScreen = (url) => {
    document.getElementById('screen').style.backgroundImage = `url('${url}')`;
    return document.fonts.ready;
  };
</script>
</body>
</html>
